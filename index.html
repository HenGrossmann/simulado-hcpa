 automaticamente pelas redes, explorando vulnerabilidades e enviando cópias de si mesmo de computador para computador.", "( ) Insere cópias de si mesmo em outros programas e arquivos e depende da execução do programa ou arquivo hospedeiro para agir.", "( ) Monitora as atividades de um sistema e envia as informações coletadas para terceiros.", "( ) Além de executar as funções para as quais aparentemente foi projetado, executa outras funções, normalmente maliciosas, sem o conhecimento do usuário."], "alternativas": ["1 – 2 – 4 – 3", "2 – 1 – 3 – 4", "3 – 1 – 4 – 2", "1 – 2 – 3 – 4", "2 – 1 – 4 – 3"], "correta": 4, "explicacao": "1º item: espalhar-se sozinho pela rede, explorando falhas, é o worm (2). 2º item: entrar em outros arquivos e depender de o arquivo ser executado é o vírus (1). 3º item: monitorar e mandar dados para terceiros é o spyware (4). 4º item: parecer um programa normal e esconder funções maliciosas é o cavalo de troia (3). Sequência: 2 – 1 – 4 – 3. Dica: a diferença que mais cai é vírus x worm. O vírus precisa de execução; o worm não.", "fundamento": "Cartilha CERT.br: o vírus se propaga inserindo cópias de si mesmo em outros programas e arquivos e depende da execução do hospedeiro; o worm se propaga automaticamente pelas redes; o cavalo de troia executa, além das funções aparentes, funções maliciosas sem o conhecimento do usuário; o spyware monitora as atividades e envia as informações a terceiros.", "fonte": "Cartilha CERT.br, livro, cap. 4 Códigos maliciosos (4.1 Vírus, 4.2 Worm, 4.6 Cavalo de troia); fascículo Códigos Maliciosos (Spyware)", "url": "https://cartilha.cert.br/livro/", "sub": "info-seguranca", "regra": "Quando precisar separar vírus de worm, lembre: o vírus precisa que o arquivo seja executado; o worm se espalha sozinho pela rede.", "passos": [{"t": "1º item: espalha-se sozinho pela rede, explorando falhas. É o worm (2)."}, {"t": "2º item: entra em outros arquivos e depende de o arquivo ser executado. É o vírus (1)."}, {"t": "3º item: monitora e manda dados para terceiros. É o spyware (4)."}, {"t": "4º item: parece um programa normal e esconde funções maliciosas. É o cavalo de troia (3)."}], "resp": "Alternativa E (2, 1, 4, 3)", "pegadinha": "A (1, 2, 4, 3) troca vírus e worm. O worm se espalha sozinho; o vírus precisa de execução.", "porque": {"A": "Essa troca vírus e worm. O worm se espalha sozinho pela rede, e o vírus precisa que o arquivo seja executado.", "B": "Essa troca spyware e cavalo de troia. Mandar dados para terceiros é o spyware, e parecer programa normal é o cavalo de troia.", "C": "Essa chama de cavalo de troia o que se espalha sozinho pela rede, mas isso é o worm. E o 4º item é o cavalo de troia.", "D": "Essa troca vírus com worm e spyware com cavalo de troia. A ordem certa é worm, vírus, spyware, cavalo de troia."}}, {"id": "inf-15", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo, baseadas na Cartilha de Segurança para Internet (CERT.br).", "itens": ["I – Usar a mesma senha em vários serviços é seguro, desde que ela seja longa e tenha letras, números e símbolos.", "II – Recomenda-se ter pelo menos duas cópias de backup, guardadas em locais diferentes, por exemplo uma na nuvem e outra em pen drive.", "III – A assinatura digital permite comprovar a autenticidade e a integridade de uma informação, isto é, que ela foi gerada por quem diz tê-la gerado e que não foi alterada."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 3, "explicacao": "I está errada: a Cartilha manda usar uma senha diferente para cada conta. Se a mesma senha vazar em um lugar, o atacante entra em todos os outros, por mais forte que ela seja. II está certa: a Cartilha recomenda ter pelo menos 2 cópias, em locais diferentes, como nuvem e pen drive. III está certa: é a definição de assinatura digital da Cartilha. Resposta: apenas II e III.", "fundamento": "Cartilha CERT.br: reusar senhas é arriscado, pois basta descobrir a senha de uma conta para acessar as demais; tenha pelo menos 2 cópias dos dados em locais diferentes; a assinatura digital permite comprovar a autenticidade e a integridade de uma informação.", "fonte": "Cartilha CERT.br: fascículos Autenticação e Backup; livro, 9.3 Assinatura digital", "url": "https://cartilha.cert.br/fasciculos/autenticacao/fasciculo-autenticacao.pdf", "sub": "info-seguranca", "regra": "Quando a afirmação disser que repetir senha é seguro “desde que” ela seja forte, marque errado: cada conta precisa de uma senha diferente.", "passos": [{"t": "I: se a mesma senha vazar em um lugar, o atacante entra em todos os outros, por mais forte que ela seja. Errada."}, {"t": "II: a Cartilha recomenda pelo menos 2 cópias de backup, em locais diferentes, como nuvem e pen drive. Correta."}, {"t": "III: é a definição da Cartilha, pois a assinatura digital comprova quem gerou a informação e que ela não foi alterada. Correta."}], "resp": "Alternativa D (apenas II e III)", "pegadinha": "E atrai quem acredita que senha longa e com símbolos pode ser repetida. Não pode: se vazar em um lugar, o atacante entra nos outros.", "porque": {"A": "A I está errada. Se a mesma senha vazar em um lugar, o atacante entra nos outros, por mais forte que ela seja.", "B": "Essa deixa a III de fora, mas a III é a definição da Cartilha: a assinatura digital comprova quem gerou e que não foi alterada.", "C": "Essa diz que a I está certa. Mas repetir senha é arriscado, cada conta precisa de uma senha diferente.", "E": "Essa inclui a I, que está errada. Senha forte não pode ser repetida, porque se vazar em um lugar o atacante entra nos outros."}}, {"id": "rl-01", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação lógica da proposição “Se o paciente chegou atrasado, então a consulta foi remarcada” é", "alternativas": ["O paciente chegou atrasado e a consulta não foi remarcada.", "Se o paciente não chegou atrasado, então a consulta não foi remarcada.", "O paciente não chegou atrasado ou a consulta foi remarcada.", "O paciente não chegou atrasado e a consulta foi remarcada.", "Se a consulta não foi remarcada, então o paciente não chegou atrasado."], "correta": 0, "explicacao": "Sejam p = “o paciente chegou atrasado” e q = “a consulta foi remarcada”. A condicional p → q só é falsa quando p é V e q é F; logo, sua negação é p ∧ ~q: “chegou atrasado e a consulta não foi remarcada”. Conferido por tabela-verdade nas 4 linhas: só A coincide com ~(p → q). Pegadinhas: C (~p ∨ q) e E (~q → ~p) são EQUIVALENTES à frase original, não sua negação; B é a inversa; D nega a parte errada. Erro comum: negar uma condicional com outra condicional.", "fundamento": "~(p → q) ≡ p ∧ ~q: mantém-se o antecedente, troca-se “se... então” por “e” e nega-se o consequente.", "fonte": "Resolução", "url": "", "regra": "Quando pedirem a NEGAÇÃO de um “se... então”, a resposta nunca é outro “se... então”: mantenha a 1ª parte, troque por “e” e negue a 2ª.", "passos": [{"t": "Separe as duas partes:", "conta": ["p = o paciente chegou atrasado", "q = a consulta foi remarcada"]}, {"t": "Pense em quando a frase seria mentira: ele chegou atrasado e a consulta NÃO foi remarcada. É o único caso que quebra a promessa."}, {"t": "Monte a negação: mantém p, troca “se... então” por “e”, nega q:", "conta": ["chegou atrasado E a consulta não foi remarcada"]}], "resp": "Alternativa A", "pegadinha": "C e E dizem a mesma coisa que a frase original (são equivalentes), não a negação. Se pedirem negação, desconfie de alternativa com “se... então”.", "dica": "Pense: em que situação essa frase seria mentira? A negação descreve exatamente essa situação.", "porque": {"B": "Essa é a inversa, que só nega as duas partes. A negação de “se... então” nunca é outro “se... então”.", "C": "Essa diz a mesma coisa que a frase original, é equivalente, não negação. Para negar, mantenha a 1ª parte, use “e” e negue a 2ª.", "D": "Você negou a parte errada. Na negação, a 1ª parte fica igual (chegou atrasado) e a 2ª é que vira “não foi remarcada”.", "E": "Essa é a contrapositiva, que diz a mesma coisa que a frase original. A negação de “se... então” nunca é outro “se... então”."}, "sub": "rl-logica"}, {"id": "rl-02", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma proposição logicamente equivalente a “Se o setor recebe a documentação, então o cadastro é liberado” é", "alternativas": ["Se o cadastro é liberado, então o setor recebe a documentação.", "Se o setor não recebe a documentação, então o cadastro não é liberado.", "O setor recebe a documentação e o cadastro não é liberado.", "Se o cadastro não é liberado, então o setor não recebe a documentação.", "O setor recebe a documentação ou o cadastro não é liberado."], "correta": 3, "explicacao": "Com p = “o setor recebe a documentação” e q = “o cadastro é liberado”, a frase é p → q. A contrapositiva ~q → ~p (alternativa D) é equivalente: inverte-se a ordem e negam-se as duas partes. Conferido por tabela-verdade: só D coincide com p → q nas 4 linhas. A é a recíproca (q → p); B é a inversa (~p → ~q); C é a negação (p ∧ ~q); E é p ∨ ~q, que equivale a q → p (recíproca), e não a p → q. Atenção: “O setor NÃO recebe a documentação OU o cadastro é liberado” (~p ∨ q) também seria equivalente, mas não está entre as opções; a pegadinha de E é negar o termo errado.", "fundamento": "p → q ≡ ~q → ~p (contrapositiva) ≡ ~p ∨ q. A recíproca (q → p) e a inversa (~p → ~q) não são equivalentes à condicional original.", "fonte": "Resolução", "url": "", "regra": "Quando pedirem uma frase EQUIVALENTE a um “se... então”: inverta a ordem e negue as duas partes.", "passos": [{"t": "Separe as duas partes:", "conta": ["p = o setor recebe a documentação", "q = o cadastro é liberado"]}, {"t": "Inverta a ordem e negue as duas partes:", "conta": ["se p, então q", "vira: se NÃO q, então NÃO p"]}, {"t": "Volte para as palavras: “Se o cadastro não é liberado, então o setor não recebe a documentação.”"}], "resp": "Alternativa D", "pegadinha": "A só inverte a ordem, sem negar. B só nega, sem inverter. As duas mudam o sentido: para ser equivalente, tem que fazer as duas coisas juntas.", "dica": "Equivalente quer dizer: a mesma ideia com outras palavras. Teste inverter a ordem e negar as duas partes.", "porque": {"A": "Você só inverteu a ordem, sem negar. Essa é a recíproca, que muda o sentido. Tem que inverter e negar juntas.", "B": "Você só negou, sem inverter. Essa é a inversa, que muda o sentido. Tem que inverter a ordem e negar as duas partes.", "C": "Essa é a negação da frase, não uma equivalente. Para ser equivalente, inverta a ordem e negue as duas partes.", "E": "Essa nega a parte errada e acaba equivalendo à recíproca. O “ou” certo seria “o setor não recebe a documentação ou o cadastro é liberado”."}, "sub": "rl-logica"}, {"id": "rl-03", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação da proposição “Todos os pacientes foram atendidos e nenhum paciente reclamou” é", "alternativas": ["Nenhum paciente foi atendido e todos os pacientes reclamaram.", "Algum paciente não foi atendido e algum paciente reclamou.", "Nem todos os pacientes foram atendidos ou nenhum paciente reclamou.", "Todos os pacientes não foram atendidos ou algum paciente reclamou.", "Algum paciente não foi atendido ou algum paciente reclamou."], "correta": 4, "explicacao": "Passo 1 (De Morgan): ~(P ∧ Q) ≡ ~P ∨ ~Q — o “e” vira “ou” e as duas partes são negadas. Passo 2: ~(“Todos foram atendidos”) = “Algum paciente não foi atendido”. Passo 3: ~(“Nenhum reclamou”) = “Algum paciente reclamou”. Resultado: alternativa E. B mantém o “e” (erro de De Morgan); C não nega a segunda parte; A e D trocam “todos” por “nenhum”/“todos... não”, que é o contrário, não a negação (“todos não foram atendidos” equivale a “nenhum foi atendido”).", "fundamento": "De Morgan: ~(P ∧ Q) ≡ ~P ∨ ~Q. Quantificadores: a negação de “Todo A é B” é “Algum A não é B”; a negação de “Nenhum A é B” é “Algum A é B”.", "fonte": "Resolução", "url": "", "regra": "Quando negar uma frase com “e”: negue as duas partes e troque o “e” por “ou”. A negação de “todos” é “algum não”; a de “nenhum” é “algum”.", "passos": [{"t": "Separe as duas partes:", "conta": ["1ª: todos os pacientes foram atendidos", "2ª: nenhum paciente reclamou"]}, {"t": "Negue cada uma:", "conta": ["todos foram atendidos → algum NÃO foi atendido", "nenhum reclamou → algum reclamou"]}, {"t": "Junte com “ou”, porque o “e” vira “ou”:", "conta": ["algum não foi atendido OU algum reclamou"]}], "resp": "Alternativa E", "pegadinha": "B nega as duas partes, mas mantém o “e”. A troca “todos” por “nenhum”, que é o oposto e não a negação: para desmentir “todos foram atendidos”, basta UM não ter sido.", "dica": "Separe a frase nas duas partes ligadas pelo “e” e negue cada uma. Depois veja o que acontece com o “e”.", "porque": {"A": "Você trocou “todos” por “nenhum”, que é o oposto, não a negação. Para desmentir “todos foram atendidos”, basta um não ter sido.", "B": "Você negou as duas partes certo, mas manteve o “e”. Na negação, o “e” vira “ou”.", "C": "Você não negou a 2ª parte. “Nenhum paciente reclamou” tinha que virar “algum paciente reclamou”.", "D": "“Todos não foram atendidos” é o mesmo que “nenhum foi atendido”, o oposto. A negação de “todos” é “algum não”."}, "sub": "rl-logica"}, {"id": "rl-04", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um setor com 120 funcionários, 68 fizeram o curso de Comunicação Não-Violenta (CNV), 50 fizeram o curso de LGPD e 22 fizeram os dois cursos. O número de funcionários que fizeram apenas um dos dois cursos é", "alternativas": ["96", "74", "24", "118", "46"], "correta": 1, "explicacao": "Apenas CNV = 68 − 22 = 46. Apenas LGPD = 50 − 22 = 28. Apenas um dos cursos = 46 + 28 = 74. Conferência: 46 + 28 + 22 = 96 fizeram ao menos um curso (união = 68 + 50 − 22 = 96) e 120 − 96 = 24 não fizeram nenhum. As distratoras são valores intermediários do próprio cálculo: 96 (pelo menos um curso), 24 (nenhum), 46 (apenas CNV) e 118 (soma direta 68 + 50, contando a interseção duas vezes).", "fundamento": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B). “Apenas A” = n(A) − n(A ∩ B). “Apenas um” = n(A ∪ B) − n(A ∩ B).", "fonte": "Resolução", "url": "", "regra": "Quando aparecer “fizeram os dois”, tire essa turma de cada grupo antes de somar. Senão você conta as mesmas pessoas duas vezes.", "passos": [{"t": "Desenhe dois círculos que se cruzam. No meio ficam os que fizeram os dois: 22."}, {"t": "Só CNV: tire os 22 do total de CNV:", "conta": ["68 − 22 = 46"]}, {"t": "Só LGPD: tire os 22 do total de LGPD:", "conta": ["50 − 22 = 28"]}, {"t": "Apenas um dos cursos = só CNV + só LGPD:", "conta": ["46 + 28 = 74"]}], "resp": "74", "pegadinha": "96 é quem fez pelo menos um curso (inclui os 22 do meio). 46 é só CNV. 118 é 68 + 50, contando os 22 duas vezes.", "dica": "Desenhe dois círculos que se cruzam. Coloque primeiro, no meio, os que fizeram os dois cursos.", "porque": {"A": "96 é quem fez pelo menos um curso, incluindo os 22 que fizeram os dois. Tirando esses 22, sobram 74.", "C": "24 é quem não fez nenhum curso: 120 − 96. A pergunta é quem fez só um.", "D": "118 é 68 + 50, contando os 22 do meio duas vezes. Tire os 22 de cada grupo antes de somar.", "E": "46 é só quem fez CNV. Faltou somar os 28 que fizeram só LGPD."}, "sub": "rl-logica"}, {"id": "rl-05", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um prontuário foi esquecido na sala de espera, e sabe-se que foi exatamente uma de quatro pessoas: Ana, Bruno, Carla ou Davi. Questionadas, disseram:\nAna: “Foi o Bruno.”\nBruno: “Foi o Davi.”\nCarla: “Não fui eu.”\nDavi: “O Bruno está mentindo.”\nSabendo que apenas uma das quatro pessoas mentiu, quem esqueceu o prontuário?", "alternativas": ["Ana", "Carla", "Bruno", "Davi", "Não é possível determinar."], "correta": 2, "explicacao": "As falas de Bruno e Davi são contraditórias (Davi diz que Bruno mente): exatamente uma delas é falsa. Como só há uma mentira, ela está entre Bruno e Davi, e Ana e Carla dizem a verdade. Se Ana diz a verdade, foi o Bruno. Conferência: Bruno (“Foi o Davi”) mente; Davi (“Bruno está mentindo”) diz a verdade; Carla (“Não fui eu”) diz a verdade — exatamente 1 mentira. Testando os 4 culpados possíveis: Ana → 2 mentiras; Bruno → 1; Carla → 3; Davi → 2. Só Bruno satisfaz a condição, então E também está descartada.", "fundamento": "Em problemas de verdades e mentiras, procure duas afirmações contraditórias: uma delas é necessariamente falsa, o que localiza a(s) mentira(s) e torna verdadeiras as demais.", "fonte": "Resolução", "url": "", "regra": "Quando só uma pessoa mente, procure duas falas que brigam entre si. Uma delas é a mentira, e todas as outras falas são verdade.", "passos": [{"t": "Davi diz que Bruno mente. Então Bruno e Davi não podem estar os dois certos: o mentiroso é um deles."}, {"t": "Como só existe uma mentira, Ana e Carla falam a verdade. Ana diz que foi o Bruno."}, {"t": "Confira contando as mentiras de cada culpado possível:", "conta": ["se foi Ana — 2 mentiras", "se foi Bruno — 1 mentira", "se foi Carla — 3 mentiras", "se foi Davi — 2 mentiras"]}], "resp": "Bruno", "pegadinha": "Testar pessoa por pessoa sem pista demora. Comece pelas duas falas que brigam entre si: elas mostram onde está a mentira.", "dica": "Procure duas falas que não podem ser verdade ao mesmo tempo. A mentira está numa delas.", "porque": {"A": "Se fosse a Ana, Ana e Bruno estariam mentindo: duas mentiras. O enunciado diz que só uma pessoa mentiu.", "B": "Se fosse a Carla, Ana, Bruno e Carla estariam mentindo: três mentiras. Só pode haver uma.", "D": "Se fosse o Davi, Ana e o próprio Davi estariam mentindo: duas mentiras. Só pode haver uma.", "E": "Dá para determinar. Testando os quatro, só com o Bruno há exatamente uma mentira."}, "sub": "rl-logica"}, {"id": "rl-06", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um ambulatório realizava 800 consultas por mês. No mês seguinte, o número de consultas aumentou 15% e, no mês subsequente, diminuiu 10% em relação ao mês anterior. O número de consultas no último mês foi", "alternativas": ["828", "840", "820", "832", "860"], "correta": 0, "explicacao": "Aumento de 15%: 800 × 1,15 = 920. Redução de 10% sobre 920: 920 × 0,90 = 828. Equivalente: 800 × 1,15 × 0,90 = 800 × 1,035 = 828. A pegadinha é a alternativa 840: somar as porcentagens (+15% − 10% = +5%) ignora que a redução incide sobre a base nova (920), e não sobre 800. As demais (820, 832, 860) não correspondem a nenhuma aplicação correta das duas porcentagens.", "fundamento": "Porcentagens sucessivas se multiplicam: aumento de i% → fator (1 + i/100); redução de j% → fator (1 − j/100). O fator total é o produto dos fatores, não a soma das porcentagens.", "fonte": "Resolução", "url": "", "regra": "Quando tiver aumento e depois desconto, faça uma conta de cada vez, sempre em cima do valor novo. Não junte as porcentagens (+15% − 10% não é +5%).", "passos": [{"t": "Aumento de 15% em cima de 800 (os 100% viram 115%):", "conta": ["100% — 800", "115% — x", "100x = 800 × 115", "x = 92.000 ÷ 100 = 920"]}, {"t": "Desconto de 10% em cima do valor novo, 920 (os 100% viram 90%):", "conta": ["100% — 920", "90% — x", "100x = 920 × 90", "x = 82.800 ÷ 100 = 828"]}, {"t": "Atalho, quando já tiver prática: 800 × 1,15 × 0,90 = 828. É a mesma conta, mais curta."}], "pegadinha": "840 é o que dá juntando as porcentagens: +15% − 10% = +5%, e 800 + 5% = 840. Está errado porque o desconto de 10% é sobre 920, não sobre 800.", "resp": "828", "dica": "Faça uma porcentagem de cada vez. Comece pela regra de três: 100% — 800, 115% — x.", "porque": {"B": "Você juntou as porcentagens: +15% − 10% = +5%. Mas o desconto de 10% é sobre 920, não sobre 800.", "C": "820 não sai da conta certa. 800 com 15% a mais dá 920, e 920 com 10% a menos dá 828.", "D": "832 não sai da conta certa. 800 com 15% a mais dá 920, e 920 com 10% a menos dá 828.", "E": "860 não sai da conta certa. Faça uma de cada vez: 800 vira 920, e 920 com 10% a menos dá 828."}, "sub": "rl-contas"}, {"id": "rl-07", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma paciente iniciou sessões de fisioterapia na segunda-feira, 2 de novembro de 2026, com uma sessão a cada 4 dias (2/11, 6/11, 10/11, e assim por diante). A 10ª sessão ocorrerá em", "alternativas": ["4 de dezembro, sexta-feira.", "6 de dezembro, domingo.", "8 de dezembro, segunda-feira.", "12 de dezembro, sábado.", "8 de dezembro, terça-feira."], "correta": 4, "explicacao": "As datas formam uma progressão aritmética de razão 4. Da 1ª à 10ª sessão há 9 intervalos: 9 × 4 = 36 dias. 2/11 + 36 dias: novembro tem 30 dias, então 2/11 + 28 = 30/11 e mais 8 dias = 8/12. Dia da semana: 36 = 5 × 7 + 1, logo a data cai 1 dia da semana após segunda-feira: terça-feira. No calendário, 2/11/2026 é segunda e 8/12/2026 é terça. Pegadinhas: 12/12 conta 10 intervalos (40 dias); 4/12 é a 9ª sessão; a opção C tem a data certa e o dia errado.", "fundamento": "n-ésimo termo de uma PA: aₙ = a₁ + (n − 1)·r. Para o dia da semana, só importa o resto da divisão do número de dias por 7.", "fonte": "Resolução", "url": "", "regra": "Quando contar sessões, o número de intervalos é um a menos que o de sessões. Para o dia da semana, só importa quanto sobra ao dividir os dias por 7.", "passos": [{"t": "Da 1ª à 10ª sessão são 9 intervalos de 4 dias:", "conta": ["9 × 4 = 36 dias"]}, {"t": "Some 36 dias a 2/11. Novembro tem 30 dias:", "conta": ["2/11 + 28 dias = 30/11", "30/11 + 8 dias = 8/12"]}, {"t": "Dia da semana: divida 36 por 7 e olhe o que sobra:", "conta": ["36 = 5 × 7 + 1", "sobra 1: um dia depois de segunda"]}], "resp": "8/12, terça-feira", "pegadinha": "12/12 conta 10 intervalos em vez de 9. E a opção C tem a data certa com o dia errado: confira sempre as duas partes.", "dica": "Conte quantos intervalos de 4 dias há entre a 1ª e a 10ª sessão. Não são 10.", "porque": {"A": "4 de dezembro é a 9ª sessão. Da 1ª à 10ª são 9 intervalos de 4 dias, ou seja, 36 dias.", "B": "6 de dezembro nem é dia de sessão. Somando 36 dias a 2/11, a 10ª sessão cai em 8/12.", "C": "A data está certa, mas o dia não. 36 dias é 5 semanas e sobra 1, então cai um dia depois de segunda: terça.", "D": "Você contou 10 intervalos, 40 dias. Da 1ª à 10ª sessão são 9 intervalos, 36 dias."}, "sub": "rl-sequencias"}, {"id": "rl-08", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um plantão, uma atendente fez 3 atendimentos de 0,4 hora cada e mais um atendimento de 1,25 hora. O tempo total desses atendimentos foi de", "alternativas": ["2 h 45 min", "3 h 25 min", "2 h 27 min", "2 h 37 min", "1 h 27 min"], "correta": 2, "explicacao": "Passo 1: some em horas: 3 × 0,4 = 1,2 h; 1,2 + 1,25 = 2,45 h. Passo 2: separe a parte inteira: 2 horas. Passo 3: transforme a parte depois da vírgula em minutos: 0,45 × 60 = 27 min. Total: 2 h 27 min. Pegadinhas: 2 h 45 min lê 0,45 como se fosse 45 minutos. 3 h 25 min lê 0,4 h como 40 min e 1,25 h como 1 h 25 min. 2 h 37 min erra só o 1,25 (o certo é 1 h 15 min). 1 h 27 min lê 0,4 h como 4 min.", "fundamento": "Uma hora tem 60 minutos. Para converter a parte decimal da hora em minutos, multiplica-se por 60 (0,8 h = 48 min, como na prova de 2023).", "fonte": "Resolução", "url": "", "sub": "rl-contas", "regra": "Quando a hora vier com vírgula (0,4 h, 1,25 h), o número depois da vírgula não é minuto. Para virar minuto, multiplique a parte depois da vírgula por 60.", "passos": [{"t": "Some tudo em horas, com vírgula mesmo:", "conta": ["3 × 0,4 = 1,2 h", "1,2 + 1,25 = 2,45 h"]}, {"t": "Separe as horas inteiras: 2 h. Sobra 0,45 h para virar minuto."}, {"t": "Regra de três (1 hora tem 60 minutos):", "conta": ["1 h — 60 min", "0,45 h — x min", "x = 0,45 × 60 = 27"]}], "pegadinha": "2 h 45 min lê o 0,45 como se fosse 45 minutos. Mas 0,45 h é menos de meia hora (meia hora é 0,5 h, que são 30 min).", "resp": "2 h 27 min", "dica": "Some tudo em horas primeiro, com vírgula mesmo. Só no fim transforme a parte depois da vírgula em minutos.", "porque": {"A": "Aqui você leu o 0,45 h como 45 minutos. Mas 0,45 × 60 = 27 minutos.", "B": "Aqui você leu 0,4 h como 40 minutos e 1,25 h como 1 h 25 min. O número depois da vírgula não é minuto.", "D": "Aqui você leu 1,25 h como 1 h 25 min. O certo é 1 h 15 min, porque 0,25 × 60 = 15.", "E": "Aqui você leu 0,4 h como 4 minutos. Mas 0,4 h já é quase meia hora."}}, {"id": "rl-09", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Seis servidores, trabalhando no mesmo ritmo, digitalizam todos os prontuários de um arquivo em 10 dias. Se apenas 4 desses servidores fizerem o mesmo trabalho, no mesmo ritmo, o número de dias necessários será", "alternativas": ["6", "8", "12", "15", "20"], "correta": 3, "explicacao": "Passo 1: pense no sentido. Com menos gente, o trabalho demora MAIS. É regra de três inversa. Passo 2: o total de trabalho é o mesmo: 6 servidores × 10 dias = 60 servidor-dias. Passo 3: divida pelos 4 servidores: 60 ÷ 4 = 15 dias. Pegadinha: se fizer regra de três direta (10 × 4 ÷ 6), dá cerca de 6,7 dias, menos tempo com menos gente, o que não faz sentido.", "fundamento": "Grandezas inversamente proporcionais: quando uma aumenta, a outra diminui na mesma proporção, e o produto fica constante (6 × 10 = 4 × d).", "fonte": "Resolução", "url": "", "sub": "rl-contas", "regra": "Teste do dobro: imagine o dobro da primeira coisa. Se a segunda também dobra, é direta. Se ela cai pela metade, é inversa e você inverte uma coluna antes de multiplicar em cruz.", "passos": [{"t": "Monte a regra de três:", "conta": ["6 servidores — 10 dias", "4 servidores — x dias"]}, {"t": "Teste do dobro: com o dobro de servidores (12), o trabalho termina na metade dos dias (5). Uma sobe e a outra desce: é inversa. Aqui caiu de 6 para 4 servidores, então os dias vão aumentar."}, {"t": "Inverta a coluna dos dias e só então multiplique em cruz:", "conta": ["6 — x", "4 — 10", "4x = 6 × 10", "4x = 60", "x = 60 ÷ 4 = 15"]}, {"t": "Confira se faz sentido: 15 dias é mais que 10, e tem menos gente trabalhando."}], "pegadinha": "Multiplicar em cruz sem inverter dá 6x = 40, x ≈ 6,7 dias: menos dias com menos gente, o que não faz sentido. Por isso a alternativa 6 está ali.", "resp": "15 dias", "dica": "Antes de montar a conta, pense: com menos servidores, vai levar mais ou menos dias?", "gerador": "regra3", "porque": {"A": "Esse 6 é o que dá multiplicando em cruz sem inverter. Mas com menos gente o trabalho demora mais, não menos.", "B": "8 é menos que 10 dias, mas com menos gente o trabalho demora mais. A conta é 6 × 10 = 60, e 60 ÷ 4 = 15.", "C": "12 até aumenta os dias, mas não o suficiente. O trabalho total é 6 × 10 = 60, e 60 ÷ 4 = 15.", "E": "20 seria o dobro de dias, como se a equipe caísse pela metade. De 6 para 4 não é metade, então 60 ÷ 4 = 15."}, "video": {"arquivo": "videos/direta-ou-inversa.mp4", "titulo": "Direta ou inversa?", "minutos": 1}}, {"id": "rl-10", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma cadeira de rodas custava R$ 250,00. O fornecedor deu um desconto de 20% e, depois, mais 10% de desconto sobre o novo preço. O preço final e o desconto total equivalente são, respectivamente,", "alternativas": ["R$ 180,00 e 28%", "R$ 175,00 e 30%", "R$ 180,00 e 30%", "R$ 175,00 e 28%", "R$ 185,00 e 26%"], "correta": 0, "explicacao": "Passo 1: desconto de 20% = multiplicar por 0,80: 250 × 0,80 = 200. Passo 2: mais 10% sobre o novo preço = multiplicar por 0,90: 200 × 0,90 = 180. Passo 3: desconto total: 250 - 180 = 70; 70 ÷ 250 = 0,28 = 28%. Atalho: 0,80 × 0,90 = 0,72; pagou 72%, então o desconto foi 28%. Pegadinha: somar 20% + 10% = 30% (daria R$ 175,00).", "fundamento": "Descontos sucessivos se multiplicam: desconto de i% equivale ao fator (1 - i/100). O fator total é o produto dos fatores, não a soma das porcentagens.", "fonte": "Resolução", "url": "", "sub": "rl-contas", "regra": "Quando tiver dois descontos seguidos, o segundo é sobre o preço que já caiu. Não some as porcentagens.", "passos": [{"t": "Desconto de 20% em cima de 250 (os 100% viram 80%):", "conta": ["100% — 250", "80% — x", "100x = 250 × 80", "x = 20.000 ÷ 100 = 200"]}, {"t": "Mais 10% em cima do novo preço, 200 (os 100% viram 90%):", "conta": ["100% — 200", "90% — x", "100x = 200 × 90", "x = 18.000 ÷ 100 = 180"]}, {"t": "Desconto total: quanto caiu, comparado com o preço inicial:", "conta": ["250 − 180 = 70", "250 — 100%", "70 — x", "250x = 70 × 100", "x = 7.000 ÷ 250 = 28%"]}], "resp": "R$ 180,00 e 28%", "pegadinha": "Somar 20% + 10% = 30% daria R$ 175,00. Está errado porque o segundo desconto é sobre 200, não sobre 250.", "dica": "Faça um desconto de cada vez. Comece pela regra de três: 100% — 250, 80% — x.", "porque": {"B": "Aqui você somou 20% e 10%. O segundo desconto é sobre 200, o preço que já caiu, e não sobre 250.", "C": "O preço de R$ 180,00 está certo, mas o desconto não é a soma 20% + 10%. Caiu 70 de 250, que dá 28%.", "D": "Os 28% estão certos, mas R$ 175,00 vem de somar os descontos. O segundo é sobre 200, e 200 × 0,90 = 180.", "E": "Esses números não batem com a conta certa. 250 × 0,80 = 200, depois 200 × 0,90 = 180, e o desconto total é 28%."}}, {"id": "rl-11", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as proposições p: “O sistema está fora do ar” e q: “A recepção usa fichas de papel”. Sabe-se que p é falsa e q é verdadeira. Avalie as afirmações.", "itens": ["I – A proposição “Se o sistema está fora do ar, então a recepção usa fichas de papel” é verdadeira.", "II – A proposição “Se a recepção usa fichas de papel, então o sistema está fora do ar” é verdadeira.", "III – A proposição “O sistema está fora do ar ou a recepção usa fichas de papel” é verdadeira."], "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 1, "explicacao": "I (p → q): o se... então só é falso quando a 1ª parte é V e a 2ª é F. Aqui a 1ª é F, então I é verdadeira. II (q → p): a 1ª parte (q) é V e a 2ª (p) é F. Esse é justamente o caso falso. II é falsa. III (p ∨ q): o ou só é falso se as duas forem falsas. Como q é V, III é verdadeira. Resposta: apenas I e III.", "fundamento": "p → q é falsa somente quando p é V e q é F. p ∨ q é falsa somente quando p e q são F. A recíproca (q → p) não é equivalente a p → q e pode ter valor diferente.", "fonte": "Resolução", "url": "", "sub": "rl-logica", "regra": "Um “se... então” só é falso num caso: 1ª parte verdadeira e 2ª falsa. O “ou” só é falso quando as duas partes são falsas.", "passos": [{"t": "Anote o que a questão deu:", "conta": ["p = F (o sistema NÃO está fora do ar)", "q = V (a recepção usa fichas)"]}, {"t": "I é “se p, então q”. Começa com F, então não tem como quebrar a promessa:", "conta": ["F → V = V"]}, {"t": "II é “se q, então p”. Começa com V e termina com F, o único caso falso:", "conta": ["V → F = F"]}, {"t": "III é “p ou q”. Basta uma ser verdadeira:", "conta": ["F ou V = V"]}], "resp": "Apenas I e III", "pegadinha": "II é a I com a ordem trocada. Trocar a ordem de um “se... então” muda o valor, por isso uma é verdadeira e a outra é falsa.", "dica": "Troque cada parte por V ou F. Lembre: o “se... então” só é falso quando começa com V e termina com F.", "porque": {"A": "Essa diz que a III é falsa. Mas o “ou” só é falso se as duas partes forem falsas, e q é verdadeira.", "C": "Essa diz que a II é verdadeira e a I falsa. É o contrário: a II é V → F, o único caso falso.", "D": "Essa diz que a II é verdadeira, mas a II começa com V e termina com F, o único caso falso do “se... então”.", "E": "Essa diz que a II é verdadeira, mas a II é V → F. Trocar a ordem do “se... então” mudou o valor."}}, {"id": "rl-12", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere verdadeiras as afirmações: “Todo enfermeiro do hospital é servidor concursado” e “Nenhum servidor concursado é estagiário”. A partir delas, conclui-se necessariamente que", "alternativas": ["algum estagiário é enfermeiro.", "todo servidor concursado é enfermeiro.", "algum servidor concursado é estagiário.", "todo estagiário é servidor concursado.", "nenhum enfermeiro é estagiário."], "correta": 4, "explicacao": "Desenhe os conjuntos. Passo 1: “todo enfermeiro é concursado” = o círculo dos enfermeiros fica DENTRO do círculo dos concursados. Passo 2: “nenhum concursado é estagiário” = o círculo dos estagiários fica totalmente FORA do círculo dos concursados. Passo 3: se os enfermeiros estão dentro dos concursados, e os estagiários estão fora, enfermeiros e estagiários não se encontram. Logo, nenhum enfermeiro é estagiário. As outras não decorrem: A e C contrariam as premissas; B inverte a primeira frase (pode haver concursado que não é enfermeiro); D vai contra a segunda frase, pois os estagiários ficam fora dos concursados.", "fundamento": "Um argumento é válido quando a conclusão é verdadeira em todos os casos em que as premissas são verdadeiras. Se A está contido em B e B não tem nada em comum com C, então A não tem nada em comum com C.", "fonte": "Resolução", "url": "", "sub": "rl-logica", "regra": "Quando aparecer “todo” e “nenhum”, desenhe círculos: “todo A é B” põe A dentro de B; “nenhum B é C” deixa C fora de B.", "passos": [{"t": "“Todo enfermeiro é concursado”: desenhe o círculo dos enfermeiros DENTRO do círculo dos concursados."}, {"t": "“Nenhum concursado é estagiário”: desenhe o círculo dos estagiários FORA do círculo dos concursados."}, {"t": "Olhe o desenho: os enfermeiros estão dentro e os estagiários estão fora. Não tem como se encontrarem."}], "resp": "Nenhum enfermeiro é estagiário", "pegadinha": "B inverte a primeira frase. Todo enfermeiro é concursado, mas pode haver concursado que não é enfermeiro: o círculo de fora é maior.", "dica": "Desenhe um círculo para cada grupo: enfermeiros, concursados e estagiários. Use as frases para saber quem fica dentro de quem.", "porque": {"A": "Isso contraria as frases. Os estagiários ficam fora dos concursados, e os enfermeiros ficam dentro, então não se encontram.", "B": "Essa inverte a primeira frase. Todo enfermeiro é concursado, mas pode haver concursado que não é enfermeiro.", "C": "Isso contraria a segunda frase, que diz que nenhum concursado é estagiário.", "D": "Isso vai contra a segunda frase. Os estagiários ficam totalmente fora do círculo dos concursados."}}, {"id": "rl-13", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma sequência de figuras é feita com palitos. A figura 1 é um quadrado (4 palitos). A figura 2 tem dois quadrados lado a lado, que dividem um palito (7 palitos). A figura 3 tem três quadrados em fila (10 palitos), e assim por diante. O número de palitos da figura 12 é", "alternativas": ["36", "48", "37", "40", "34"], "correta": 2, "explicacao": "Passo 1: veja quanto aumenta de uma figura para a outra: 4, 7, 10. Sempre +3, porque cada quadrado novo aproveita um palito do anterior. Passo 2: regra: começa com 4 e soma 3 para cada figura a mais. Figura n = 4 + 3 × (n - 1) = 3n + 1. Passo 3: figura 12 = 3 × 12 + 1 = 37. Pegadinhas: 48 conta 4 palitos por quadrado, sem aproveitar os palitos comuns; 36 esquece o palito inicial; 40 é a figura 13; 34 é a figura 11.", "fundamento": "Em uma sequência em que a diferença entre termos vizinhos é constante (progressão aritmética), o termo n é a₁ + (n - 1) × r.", "fonte": "Resolução", "url": "", "sub": "rl-sequencias", "regra": "Quando a sequência aumenta sempre o mesmo tanto, a figura n é: a primeira + (n − 1) × o aumento.", "passos": [{"t": "Veja quanto aumenta: 4, 7, 10. Sempre +3, porque cada quadrado novo aproveita um palito do anterior."}, {"t": "Da figura 1 até a figura 12 são 11 aumentos de 3:", "conta": ["4 + 11 × 3", "4 + 33 = 37"]}], "resp": "37", "pegadinha": "48 conta 4 palitos para cada quadrado, sem aproveitar o palito do meio. 40 é a figura 13 e 34 é a figura 11: cuidado com o “menos 1”.", "dica": "Escreva quantos palitos tem cada figura (4, 7, 10...) e veja quanto aumenta de uma para a outra.", "porque": {"A": "Esse 36 é 3 × 12, sem o palito inicial. A conta é 4 + 11 × 3 = 37.", "B": "Aqui você contou 4 palitos para cada quadrado. Mas cada quadrado novo aproveita um palito do anterior.", "D": "40 é a figura 13. Da figura 1 até a 12 são só 11 aumentos de 3, então 4 + 33 = 37.", "E": "34 é a figura 11. Da figura 1 até a 12 são 11 aumentos de 3, então 4 + 33 = 37."}}, {"id": "rl-14", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A tabela mostra o número de atendimentos de um ambulatório em quatro meses.\nJaneiro: 120\nFevereiro: 150\nMarço: 135\nAbril: 180\nConsidere as afirmações.", "itens": ["I – A média mensal de atendimentos no período foi de 146,25.", "II – De janeiro para fevereiro, o número de atendimentos aumentou 25%.", "III – De março para abril, o número de atendimentos aumentou 45%."], "alternativas": ["Apenas I e II.", "Apenas I.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 0, "explicacao": "I: média = soma ÷ quantidade = (120 + 150 + 135 + 180) ÷ 4 = 585 ÷ 4 = 146,25. Verdadeira. II: de janeiro para fevereiro aumentou 30 atendimentos; 30 ÷ 120 = 0,25 = 25%. Verdadeira. III: de março para abril aumentou 45 atendimentos, mas o percentual é 45 ÷ 135 ≈ 0,333, cerca de 33,3%. Falsa: a pegadinha é confundir a diferença absoluta (45) com a porcentagem. Resposta: apenas I e II.", "fundamento": "Média aritmética = soma dos valores ÷ número de valores. Variação percentual = (valor novo - valor antigo) ÷ valor antigo × 100.", "fonte": "Resolução", "url": "", "sub": "rl-sequencias", "regra": "Para saber quanto POR CENTO aumentou, compare o aumento com o valor de ANTES. O aumento em número (45) não é a porcentagem (45%).", "passos": [{"t": "I: média = soma ÷ quantidade de meses:", "conta": ["120 + 150 + 135 + 180 = 585", "585 ÷ 4 = 146,25"]}, {"t": "II: de janeiro para fevereiro aumentou 30. Compare com o valor de antes, 120:", "conta": ["120 — 100%", "30 — x", "120x = 30 × 100", "x = 3.000 ÷ 120 = 25%"]}, {"t": "III: de março para abril aumentou 45. O valor de antes é 135:", "conta": ["135 — 100%", "45 — x", "135x = 45 × 100", "x = 4.500 ÷ 135 ≈ 33,3%"]}], "resp": "Apenas I e II", "pegadinha": "III diz 45%, mas 45 é o aumento em número de atendimentos. Em porcentagem, comparado com 135, dá cerca de 33%.", "dica": "Para a porcentagem, compare o aumento com o valor do mês de antes, numa regra de três.", "porque": {"B": "Essa diz que a II é falsa. Mas aumentou 30 sobre 120, e 30 ÷ 120 = 25%.", "C": "Essa diz que a I é falsa. Mas a soma é 585, e 585 ÷ 4 = 146,25.", "D": "Essa diz que a III é verdadeira. Mas 45 é o aumento em número, e comparado com 135 dá cerca de 33%.", "E": "Essa inclui a III. Mas 45 é o aumento em número, não em porcentagem. Comparado com 135, dá cerca de 33%."}}, {"id": "rl-15", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um ambulatório, a razão entre o número de consultas presenciais e o de consultas por telemedicina é de 5 para 3. Em um mês, foram feitas 480 consultas no total. O número de consultas por telemedicina foi", "alternativas": ["288", "300", "160", "180", "96"], "correta": 3, "explicacao": "Passo 1: 5 para 3 quer dizer que, a cada 8 consultas, 5 são presenciais e 3 por telemedicina. Passo 2: divida o total em 8 partes: 480 ÷ 8 = 60 por parte. Passo 3: telemedicina = 3 partes = 3 × 60 = 180. Conferência: presenciais = 5 × 60 = 300; 300 + 180 = 480. Pegadinhas: 288 usa 3/5 de 480 (esquece de somar as partes); 300 é o número de presenciais; 160 e 96 são 480 ÷ 3 e 480 ÷ 5.", "fundamento": "Na divisão em partes proporcionais a 5 e 3, o total corresponde a 5 + 3 = 8 partes; cada parte vale total ÷ 8.", "fonte": "Resolução", "url": "", "sub": "rl-contas", "regra": "Quando a razão for “5 para 3”, some as partes (5 + 3 = 8) e divida o total por essa soma. O resultado é o valor de cada parte.", "passos": [{"t": "Some as partes:", "conta": ["5 + 3 = 8 partes"]}, {"t": "Divida o total pelas partes:", "conta": ["480 ÷ 8 = 60 por parte"]}, {"t": "Telemedicina são 3 partes:", "conta": ["3 × 60 = 180"]}, {"t": "Confira: presenciais são 5 × 60 = 300, e 300 + 180 = 480."}], "resp": "180", "pegadinha": "300 é o número de presenciais, não de telemedicina. Confira de qual lado da razão está a pergunta.", "dica": "“5 para 3” quer dizer que, a cada 5 + 3 = 8 consultas, 3 são por telemedicina. Comece dividindo o total por 8.", "porque": {"A": "Aqui você fez 3/5 de 480, esquecendo de somar as partes. O total é 5 + 3 = 8 partes.", "B": "300 é o número de consultas presenciais. A pergunta é sobre telemedicina, que são 3 partes de 60.", "C": "Esse 160 é 480 ÷ 3. O certo é dividir por 8 partes, 480 ÷ 8 = 60, e pegar 3 partes.", "E": "Esse 96 é 480 ÷ 5. O certo é dividir por 8 partes, 480 ÷ 8 = 60, e pegar 3 partes."}}, {"id": "rl-01g", "gemeaDe": "rl-01", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "A negação lógica da proposição “Se a ficha foi preenchida, então o atendimento foi liberado” é", "alternativas": ["Se a ficha não foi preenchida, então o atendimento não foi liberado.", "A ficha não foi preenchida ou o atendimento foi liberado.", "A ficha foi preenchida e o atendimento não foi liberado.", "Se o atendimento não foi liberado, então a ficha não foi preenchida.", "A ficha não foi preenchida e o atendimento foi liberado."], "correta": 2, "regra": "Quando pedirem a NEGAÇÃO de um “se... então”, a resposta nunca é outro “se... então”: mantenha a 1ª parte, troque por “e” e negue a 2ª.", "passos": [{"t": "Separe as duas partes:", "conta": ["p = a ficha foi preenchida", "q = o atendimento foi liberado"]}, {"t": "Quando a frase seria mentira? Ficha preenchida e atendimento NÃO liberado."}, {"t": "Monte a negação: mantém p, troca por “e”, nega q:", "conta": ["a ficha foi preenchida E o atendimento não foi liberado"]}], "resp": "Alternativa C", "pegadinha": "B e D dizem a mesma coisa que a frase original (são equivalentes), não a negação.", "explicacao": "", "dica": "Pense: em que situação essa frase seria mentira? A negação descreve exatamente essa situação.", "porque": {"A": "A negação de um “se... então” nunca é outro “se... então”. Mantenha a 1ª parte, troque por “e” e negue a 2ª.", "B": "Essa diz a mesma coisa que a frase original, não a negação.", "D": "Essa diz a mesma coisa que a frase original, só que com a ordem invertida e as partes negadas. Não é a negação.", "E": "Essa nega a parte errada. Na negação, a ficha continua preenchida e só o atendimento vira “não foi liberado”."}}, {"id": "rl-02g", "gemeaDe": "rl-02", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Uma proposição logicamente equivalente a “Se o exame foi autorizado, então o paciente foi agendado” é", "alternativas": ["Se o paciente foi agendado, então o exame foi autorizado.", "Se o paciente não foi agendado, então o exame não foi autorizado.", "O exame foi autorizado e o paciente não foi agendado.", "Se o exame não foi autorizado, então o paciente não foi agendado.", "O exame foi autorizado ou o paciente foi agendado."], "correta": 1, "regra": "Quando pedirem uma frase EQUIVALENTE a um “se... então”: inverta a ordem e negue as duas partes.", "passos": [{"t": "Separe as duas partes:", "conta": ["p = o exame foi autorizado", "q = o paciente foi agendado"]}, {"t": "Inverta a ordem e negue as duas partes:", "conta": ["se p, então q", "vira: se NÃO q, então NÃO p"]}, {"t": "Volte para as palavras: “Se o paciente não foi agendado, então o exame não foi autorizado.”"}], "resp": "Alternativa B", "pegadinha": "A só inverte, sem negar. D só nega, sem inverter. Para ser equivalente, tem que fazer as duas coisas juntas.", "explicacao": "", "dica": "Equivalente quer dizer: a mesma ideia com outras palavras. Teste inverter a ordem e negar as duas partes.", "porque": {"A": "Essa só inverte a ordem, sem negar. Para ser equivalente, tem que inverter e negar as duas partes.", "C": "Essa troca o “se... então” por “e”. A equivalente é “se não q, então não p”, invertendo e negando.", "D": "Essa só nega as partes, sem inverter a ordem. Para ser equivalente, tem que fazer as duas coisas juntas.", "E": "Essa troca por “ou” e não nega nada. A equivalente inverte a ordem e nega as duas partes."}}, {"id": "rl-03g", "gemeaDe": "rl-03", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "A negação da proposição “Todos os exames foram entregues e nenhum laudo atrasou” é", "alternativas": ["Nenhum exame foi entregue ou todos os laudos atrasaram.", "Algum exame não foi entregue e algum laudo atrasou.", "Algum exame não foi entregue ou algum laudo atrasou.", "Todos os exames não foram entregues e algum laudo atrasou.", "Nem todos os exames foram entregues ou nenhum laudo atrasou."], "correta": 2, "regra": "Quando negar uma frase com “e”: negue as duas partes e troque o “e” por “ou”. A negação de “todos” é “algum não”; a de “nenhum” é “algum”.", "passos": [{"t": "Separe as duas partes:", "conta": ["1ª: todos os exames foram entregues", "2ª: nenhum laudo atrasou"]}, {"t": "Negue cada uma:", "conta": ["todos foram entregues → algum NÃO foi entregue", "nenhum atrasou → algum atrasou"]}, {"t": "Junte com “ou”:", "conta": ["algum não foi entregue OU algum laudo atrasou"]}], "resp": "Alternativa C", "pegadinha": "B nega as duas partes, mas mantém o “e”. A troca “todos” por “nenhum”, que é o oposto, não a negação.", "explicacao": "", "dica": "Separe a frase nas duas partes ligadas pelo “e” e negue cada uma. Depois veja o que acontece com o “e”.", "porque": {"A": "Essa troca “todos” por “nenhum”, que é o oposto, não a negação. A negação de “todos” é “algum não”.", "B": "Essa nega as duas partes, mas mantém o “e”. Na negação, o “e” vira “ou”.", "D": "A negação de “todos foram entregues” é “algum não foi entregue”, não “todos não foram”. E o “e” devia virar “ou”.", "E": "Essa nega só a 1ª parte. “Nenhum laudo atrasou” também tem que ser negado, e vira “algum laudo atrasou”."}}, {"id": "rl-04g", "gemeaDe": "rl-04", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Em um setor com 90 funcionários, 52 fizeram o treinamento de NR-32, 40 fizeram o de segurança do paciente e 15 fizeram os dois. O número de funcionários que fizeram apenas um dos dois treinamentos é", "alternativas": ["77", "62", "13", "92", "37"], "correta": 1, "regra": "Quando aparecer “fizeram os dois”, tire essa turma de cada grupo antes de somar. Senão você conta as mesmas pessoas duas vezes.", "passos": [{"t": "Desenhe dois círculos que se cruzam. No meio ficam os que fizeram os dois: 15."}, {"t": "Só NR-32:", "conta": ["52 − 15 = 37"]}, {"t": "Só segurança do paciente:", "conta": ["40 − 15 = 25"]}, {"t": "Apenas um = só NR-32 + só segurança:", "conta": ["37 + 25 = 62"]}], "resp": "62", "pegadinha": "77 é quem fez pelo menos um (inclui os 15 do meio). 37 é só NR-32. 92 é 52 + 40, contando os 15 duas vezes.", "explicacao": "", "dica": "Desenhe dois círculos que se cruzam. Coloque primeiro, no meio, os que fizeram os dois treinamentos.", "porque": {"A": "77 é quem fez pelo menos um, incluindo os 15 que fizeram os dois. A pergunta é só um.", "C": "13 é quem não fez nenhum, 90 menos 77. A pergunta é quem fez só um: 37 + 25 = 62.", "D": "Aqui você somou 52 + 40 e contou os 15 do meio duas vezes. Tire os 15 de cada grupo antes de somar.", "E": "37 é só quem fez NR-32. Falta somar os 25 que fizeram só segurança do paciente."}}, {"id": "rl-05g", "gemeaDe": "rl-05", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Um carimbo sumiu da recepção, e sabe-se que foi pego por exatamente uma de quatro pessoas: Lia, Marcos, Nina ou Otávio. Questionadas, disseram:\nLia: “Foi a Nina.”\nMarcos: “Não fui eu.”\nNina: “Foi o Otávio.”\nOtávio: “A Nina está mentindo.”\nSabendo que apenas uma das quatro pessoas mentiu, quem pegou o carimbo?", "alternativas": ["Lia", "Marcos", "Nina", "Otávio", "Não é possível determinar."], "correta": 2, "regra": "Quando só uma pessoa mente, procure duas falas que brigam entre si. Uma delas é a mentira, e todas as outras falas são verdade.", "passos": [{"t": "Otávio diz que Nina mente. Então Nina e Otávio não podem estar os dois certos: o mentiroso é um deles."}, {"t": "Como só existe uma mentira, Lia e Marcos falam a verdade. Lia diz que foi a Nina."}, {"t": "Confira contando as mentiras de cada culpado possível:", "conta": ["se foi Lia — 2 mentiras", "se foi Marcos — 3 mentiras", "se foi Nina — 1 mentira", "se foi Otávio — 2 mentiras"]}], "resp": "Nina", "pegadinha": "Comece pelas duas falas que brigam entre si (Nina e Otávio): elas mostram onde está a mentira.", "explicacao": "", "dica": "Procure duas falas que não podem ser verdade ao mesmo tempo. A mentira está numa delas.", "porque": {"A": "Se fosse a Lia, haveria 2 mentiras: a da Lia e a da Nina. Mas só uma pessoa mentiu.", "B": "Se fosse o Marcos, haveria 3 mentiras. Mas só uma pessoa mentiu.", "D": "Se fosse o Otávio, haveria 2 mentiras: a da Lia e a do Otávio. Mas só uma pessoa mentiu.", "E": "Dá para descobrir. Só com a Nina como culpada existe exatamente uma mentira."}}, {"id": "rl-06g", "gemeaDe": "rl-06", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Um laboratório fazia 600 exames por mês. No mês seguinte, o número de exames aumentou 20% e, no mês subsequente, diminuiu 15% em relação ao mês anterior. O número de exames no último mês foi", "alternativas": ["630", "612", "615", "600", "648"], "correta": 1, "regra": "Quando tiver aumento e depois desconto, faça uma conta de cada vez, sempre em cima do valor novo. Não junte as porcentagens.", "passos": [{"t": "Aumento de 20% em cima de 600 (os 100% viram 120%):", "conta": ["100% — 600", "120% — x", "100x = 600 × 120", "x = 72.000 ÷ 100 = 720"]}, {"t": "Queda de 15% em cima do valor novo, 720 (os 100% viram 85%):", "conta": ["100% — 720", "85% — x", "100x = 720 × 85", "x = 61.200 ÷ 100 = 612"]}], "resp": "612", "pegadinha": "630 é o que dá juntando as porcentagens: +20% − 15% = +5%. Está errado porque a queda de 15% é sobre 720, não sobre 600.", "explicacao": "", "sub": "rl-contas", "dica": "Faça uma porcentagem de cada vez. Comece pela regra de três: 100% — 600, 120% — x.", "porque": {"A": "Aqui você juntou +20% e −15% em +5%. A queda de 15% é sobre 720, não sobre 600.", "C": "615 não bate com a conta certa. Primeiro 600 vira 720, depois 15% a menos sobre 720 dá 612.", "D": "600 é o número do começo. Subir 20% e depois cair 15% não volta ao mesmo lugar: dá 612.", "E": "648 não bate com a conta certa. A queda é de 15% sobre 720, e 720 × 0,85 = 612."}}, {"id": "rl-07g", "gemeaDe": "rl-07", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Um curso começou na quarta-feira, 4 de novembro de 2026, com um encontro a cada 5 dias (4/11, 9/11, 14/11, e assim por diante). O 8º encontro ocorrerá em", "alternativas": ["4 de dezembro, sexta-feira.", "9 de dezembro, quinta-feira.", "14 de dezembro, segunda-feira.", "9 de dezembro, quarta-feira.", "8 de dezembro, terça-feira."], "correta": 3, "regra": "Quando contar encontros, o número de intervalos é um a menos que o de encontros. Para o dia da semana, só importa quanto sobra ao dividir os dias por 7.", "passos": [{"t": "Do 1º ao 8º encontro são 7 intervalos de 5 dias:", "conta": ["7 × 5 = 35 dias"]}, {"t": "Some 35 dias a 4/11. Novembro tem 30 dias:", "conta": ["4/11 + 26 dias = 30/11", "30/11 + 9 dias = 9/12"]}, {"t": "Dia da semana: divida 35 por 7 e olhe o que sobra:", "conta": ["35 = 5 × 7 + 0", "sobra 0: mesmo dia da semana, quarta"]}], "resp": "9/12, quarta-feira", "pegadinha": "14/12 conta 8 intervalos em vez de 7. E a opção B tem a data certa com o dia errado: confira sempre as duas partes.", "explicacao": "", "dica": "Conte quantos intervalos de 5 dias há entre o 1º e o 8º encontro. Não são 8.", "porque": {"A": "4/12 é o 7º encontro. Do 1º ao 8º são 7 intervalos de 5 dias, 35 dias, e isso dá 9/12.", "B": "A data está certa, mas o dia da semana não. 35 dias são 5 semanas certinhas, então cai numa quarta.", "C": "Aqui você contou 8 intervalos em vez de 7. Do 1º ao 8º encontro são 7 intervalos de 5 dias.", "E": "Contando de 5 em 5 a partir de 4/11, não cai em 8/12. São 35 dias depois, em 9/12, numa quarta."}}, {"id": "rl-08g", "gemeaDe": "rl-08", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Em um plantão, uma recepcionista fez 2 atendimentos de 0,75 hora cada e mais um atendimento de 0,6 hora. O tempo total desses atendimentos foi de", "alternativas": ["2 h 10 min", "3 h 30 min", "2 h 6 min", "2 h 1 min", "1 h 56 min"], "correta": 2, "regra": "Quando a hora vier com vírgula, o número depois da vírgula não é minuto. Para virar minuto, multiplique a parte depois da vírgula por 60.", "passos": [{"t": "Some tudo em horas, com vírgula mesmo:", "conta": ["2 × 0,75 = 1,5 h", "1,5 + 0,6 = 2,1 h"]}, {"t": "Separe as horas inteiras: 2 h. Sobra 0,1 h para virar minuto."}, {"t": "Regra de três (1 hora tem 60 minutos):", "conta": ["1 h — 60 min", "0,1 h — x min", "x = 0,1 × 60 = 6"]}], "resp": "2 h 6 min", "pegadinha": "2 h 10 min lê o 0,1 como se fosse 10 minutos. Mas 0,1 h é só um décimo da hora: 6 minutos.", "explicacao": "", "sub": "rl-contas", "dica": "Some tudo em horas primeiro, com vírgula mesmo. Só no fim transforme a parte depois da vírgula em minutos.", "porque": {"A": "Aqui você leu o 0,1 h como 10 minutos. Mas 0,1 × 60 = 6 minutos.", "B": "Aqui você leu 0,75 h como 75 minutos e 0,6 h como 60 minutos. O número depois da vírgula não é minuto.", "D": "Aqui você leu 2,1 h como 2 h 1 min. Mas 0,1 h é um décimo da hora, 6 minutos.", "E": "Essa fica abaixo de 2 h, mas a soma dá 2,1 h, mais de 2 horas. O certo é 2 h e 0,1 × 60 = 6 min."}}, {"id": "rl-09g", "gemeaDe": "rl-09", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Oito servidores, trabalhando no mesmo ritmo, organizam o almoxarifado em 6 dias. Se apenas 3 desses servidores fizerem o mesmo trabalho, no mesmo ritmo, o número de dias necessários será", "alternativas": ["2,25", "12", "16", "18", "24"], "correta": 2, "regra": "Teste do dobro: imagine o dobro da primeira coisa. Se a segunda também dobra, é direta. Se ela cai pela metade, é inversa e você inverte uma coluna antes de multiplicar em cruz.", "passos": [{"t": "Monte a regra de três:", "conta": ["8 servidores — 6 dias", "3 servidores — x dias"]}, {"t": "Teste do dobro: com o dobro de servidores (16), o trabalho termina na metade dos dias (3). Uma sobe e a outra desce: é inversa. Aqui caiu de 8 para 3 servidores, então os dias vão aumentar."}, {"t": "Inverta a coluna dos dias e multiplique em cruz:", "conta": ["8 — x", "3 — 6", "3x = 8 × 6", "3x = 48", "x = 48 ÷ 3 = 16"]}, {"t": "Confira: 16 dias é mais que 6, e tem menos gente."}], "resp": "16 dias", "pegadinha": "Sem inverter dá 8x = 18, x = 2,25 dias: menos dias com menos gente, o que não faz sentido.", "explicacao": "", "sub": "rl-contas", "dica": "Antes de montar a conta, pense: com menos servidores, vai levar mais ou menos dias?", "gerador": "regra3", "porque": {"A": "Esse 2,25 é o que dá sem inverter. Mas com menos gente o trabalho demora mais, não menos.", "B": "12 não bate com a conta certa. O trabalho total é 8 × 6 = 48, e 48 ÷ 3 = 16.", "D": "18 é o 3 × 6 da conta sem inverter. O certo é 8 × 6 = 48, dividido por 3, que dá 16.", "E": "24 passa da conta certa. O trabalho total é 8 × 6 = 48, e 48 ÷ 3 = 16."}, "video": {"arquivo": "videos/direta-ou-inversa.mp4", "titulo": "Direta ou inversa?", "minutos": 1}}, {"id": "rl-10g", "gemeaDe": "rl-10", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Um monitor custava R$ 400,00. A loja deu um desconto de 25% e, depois, mais 20% de desconto sobre o novo preço. O preço final e o desconto total equivalente são, respectivamente,", "alternativas": ["R$ 220,00 e 45%", "R$ 240,00 e 40%", "R$ 240,00 e 45%", "R$ 220,00 e 40%", "R$ 250,00 e 37,5%"], "correta": 1, "regra": "Quando tiver dois descontos seguidos, o segundo é sobre o preço que já caiu. Não some as porcentagens.", "passos": [{"t": "Desconto de 25% em cima de 400 (os 100% viram 75%):", "conta": ["100% — 400", "75% — x", "100x = 400 × 75", "x = 30.000 ÷ 100 = 300"]}, {"t": "Mais 20% em cima do novo preço, 300 (os 100% viram 80%):", "conta": ["100% — 300", "80% — x", "100x = 300 × 80", "x = 24.000 ÷ 100 = 240"]}, {"t": "Desconto total, comparado com o preço inicial:", "conta": ["400 − 240 = 160", "400 — 100%", "160 — x", "400x = 160 × 100", "x = 16.000 ÷ 400 = 40%"]}], "resp": "R$ 240,00 e 40%", "pegadinha": "Somar 25% + 20% = 45% daria R$ 220,00. Está errado porque o segundo desconto é sobre 300, não sobre 400.", "explicacao": "", "sub": "rl-contas", "dica": "Faça um desconto de cada vez. Comece pela regra de três: 100% — 400, 75% — x.", "porque": {"A": "Aqui você somou 25% e 20%. O segundo desconto é sobre 300, o preço que já caiu, e não sobre 400.", "C": "O preço de R$ 240,00 está certo, mas o desconto não é a soma 25% + 20%. Caiu 160 de 400, que dá 40%.", "D": "Os 40% estão certos, mas R$ 220,00 vem de somar os descontos. O segundo é sobre 300, e 300 × 0,80 = 240.", "E": "Esses números não batem com a conta certa. 400 vira 300, depois 300 × 0,80 = 240, e o desconto total é 40%."}}, {"id": "rl-11g", "gemeaDe": "rl-11", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Considere as proposições p: “O elevador está em manutenção” e q: “A equipe usa a escada”. Sabe-se que p é verdadeira e q é falsa. Avalie as afirmações.", "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 2, "regra": "Um “se... então” só é falso num caso: 1ª parte verdadeira e 2ª falsa. O “e” só é verdadeiro quando as duas partes são verdadeiras.", "passos": [{"t": "Anote o que a questão deu:", "conta": ["p = V (o elevador está em manutenção)", "q = F (a equipe NÃO usa a escada)"]}, {"t": "I é “se p, então q”. Começa com V e termina com F, o único caso falso:", "conta": ["V → F = F"]}, {"t": "II é “se q, então p”. Começa com F, então não tem como quebrar a promessa:", "conta": ["F → V = V"]}, {"t": "III é “p e q”. Precisa das duas verdadeiras, e q é falsa:", "conta": ["V e F = F"]}], "resp": "Apenas II", "pegadinha": "I e II parecem a mesma frase com a ordem trocada, mas trocar a ordem de um “se... então” muda o valor.", "explicacao": "", "sub": "rl-logica", "itens": ["I – A proposição “Se o elevador está em manutenção, então a equipe usa a escada” é verdadeira.", "II – A proposição “Se a equipe usa a escada, então o elevador está em manutenção” é verdadeira.", "III – A proposição “O elevador está em manutenção e a equipe usa a escada” é verdadeira."], "dica": "Troque cada parte por V ou F. Lembre: o “se... então” só é falso quando começa com V e termina com F.", "porque": {"A": "Essa diz que a I é verdadeira, mas a I é V → F, o único caso falso do “se... então”.", "B": "Essa diz que a I e a III são verdadeiras. A I é V → F, e o “e” precisa das duas verdadeiras, mas q é falsa.", "D": "Essa diz que a III é verdadeira, mas o “e” precisa das duas partes verdadeiras, e q é falsa.", "E": "Essa diz que as três são verdadeiras. Mas a I é V → F, que é falso, e a III tem q falsa."}}, {"id": "rl-12g", "gemeaDe": "rl-12", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Considere verdadeiras as afirmações: “Todo técnico de farmácia é servidor do hospital” e “Nenhum servidor do hospital é terceirizado”. A partir delas, conclui-se necessariamente que", "alternativas": ["todo servidor do hospital é técnico de farmácia.", "nenhum técnico de farmácia é terceirizado.", "algum terceirizado é técnico de farmácia.", "algum servidor do hospital é terceirizado.", "todo terceirizado é servidor do hospital."], "correta": 1, "regra": "Quando aparecer “todo” e “nenhum”, desenhe círculos: “todo A é B” põe A dentro de B; “nenhum B é C” deixa C fora de B.", "passos": [{"t": "“Todo técnico é servidor”: desenhe o círculo dos técnicos DENTRO do círculo dos servidores."}, {"t": "“Nenhum servidor é terceirizado”: desenhe o círculo dos terceirizados FORA do círculo dos servidores."}, {"t": "Olhe o desenho: técnicos dentro, terceirizados fora. Não tem como se encontrarem."}], "resp": "Nenhum técnico é terceirizado", "pegadinha": "A inverte a primeira frase: todo técnico é servidor, mas pode haver servidor que não é técnico.", "explicacao": "", "sub": "rl-logica", "dica": "Desenhe um círculo para cada grupo: técnicos, servidores e terceirizados. Use as frases para saber quem fica dentro de quem.", "porque": {"A": "Essa inverte a primeira frase. Todo técnico é servidor, mas pode haver servidor que não é técnico.", "C": "Isso contraria as frases. Os técnicos ficam dentro dos servidores e os terceirizados ficam fora, então não se encontram.", "D": "Isso contraria a segunda frase, que diz que nenhum servidor do hospital é terceirizado.", "E": "Isso vai contra a segunda frase. Os terceirizados ficam totalmente fora do círculo dos servidores."}}, {"id": "rl-13g", "gemeaDe": "rl-13", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Uma sequência de figuras é feita com palitos. A figura 1 é um triângulo (3 palitos). A figura 2 tem dois triângulos lado a lado, que dividem um palito (5 palitos). A figura 3 tem três triângulos em fila (7 palitos), e assim por diante. O número de palitos da figura 15 é", "alternativas": ["45", "30", "31", "33", "29"], "correta": 2, "regra": "Quando a sequência aumenta sempre o mesmo tanto, a figura n é: a primeira + (n − 1) × o aumento.", "passos": [{"t": "Veja quanto aumenta: 3, 5, 7. Sempre +2, porque cada triângulo novo aproveita um palito do anterior."}, {"t": "Da figura 1 até a figura 15 são 14 aumentos de 2:", "conta": ["3 + 14 × 2", "3 + 28 = 31"]}], "resp": "31", "pegadinha": "45 conta 3 palitos para cada triângulo, sem aproveitar o palito comum. 33 é a figura 16 e 29 é a figura 14: cuidado com o “menos 1”.", "explicacao": "", "sub": "rl-sequencias", "dica": "Escreva quantos palitos tem cada figura (3, 5, 7...) e veja quanto aumenta de uma para a outra.", "porque": {"A": "Aqui você contou 3 palitos para cada triângulo. Mas cada triângulo novo aproveita um palito do anterior.", "B": "Esse 30 é 15 × 2, como se o primeiro triângulo tivesse 2 palitos. Ele tem 3, então 3 + 14 × 2 = 31.", "D": "33 é a figura 16. Da figura 1 até a 15 são só 14 aumentos de 2, então 3 + 28 = 31.", "E": "29 é a figura 14. Da figura 1 até a 15 são 14 aumentos de 2, então 3 + 28 = 31."}}, {"id": "rl-14g", "gemeaDe": "rl-14", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "A tabela mostra o número de exames de um laboratório em quatro meses.\nMaio: 200\nJunho: 240\nJulho: 210\nAgosto: 280\nConsidere as afirmações.", "alternativas": ["Apenas I.", "Apenas I e II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 2, "regra": "Para saber quanto POR CENTO aumentou, compare o aumento com o valor de ANTES. O aumento em número (40) não é a porcentagem (40%).", "passos": [{"t": "I: média = soma ÷ quantidade de meses:", "conta": ["200 + 240 + 210 + 280 = 930", "930 ÷ 4 = 232,5"]}, {"t": "II: de maio para junho aumentou 40. Compare com o valor de antes, 200:", "conta": ["200 — 100%", "40 — x", "200x = 40 × 100", "x = 4.000 ÷ 200 = 20%"]}, {"t": "III: de julho para agosto aumentou 70. O valor de antes é 210:", "conta": ["210 — 100%", "70 — x", "210x = 70 × 100", "x = 7.000 ÷ 210 ≈ 33,3%"]}], "resp": "Apenas I e III", "pegadinha": "II diz 40%, mas 40 é o aumento em número de exames. Em porcentagem, comparado com 200, dá 20%.", "explicacao": "", "sub": "rl-sequencias", "itens": ["I – A média mensal de exames no período foi de 232,5.", "II – De maio para junho, o número de exames aumentou 40%.", "III – De julho para agosto, o número de exames aumentou cerca de 33%."], "dica": "Para a porcentagem, compare o aumento com o valor do mês de antes, numa regra de três.", "porque": {"A": "Essa diz que a III é falsa. Mas aumentou 70 sobre 210, e 70 ÷ 210 dá cerca de 33%.", "B": "Essa diz que a II é verdadeira. Mas 40 é o aumento em número, e comparado com 200 dá 20%.", "D": "Essa diz que a I é falsa e a II verdadeira. Mas 930 ÷ 4 = 232,5, e o aumento da II é 20%, não 40%.", "E": "Essa inclui a II. Mas 40 é o aumento em número, não em porcentagem. Comparado com 200, dá 20%."}}, {"id": "rl-15g", "gemeaDe": "rl-15", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "fonte": "Resolução", "url": "", "enunciado": "Em uma unidade, a razão entre o número de atendimentos pela manhã e o número de atendimentos à tarde é de 7 para 2. Em uma semana, foram feitos 360 atendimentos no total. O número de atendimentos à tarde foi", "alternativas": ["280", "180", "40", "80", "120"], "correta": 3, "regra": "Quando a razão for “7 para 2”, some as partes (7 + 2 = 9) e divida o total por essa soma. O resultado é o valor de cada parte.", "passos": [{"t": "Some as partes:", "conta": ["7 + 2 = 9 partes"]}, {"t": "Divida o total pelas partes:", "conta": ["360 ÷ 9 = 40 por parte"]}, {"t": "À tarde são 2 partes:", "conta": ["2 × 40 = 80"]}, {"t": "Confira: manhã é 7 × 40 = 280, e 280 + 80 = 360."}], "resp": "80", "pegadinha": "280 é o número da manhã, não da tarde. E 40 é uma parte só: a tarde tem 2 partes.", "explicacao": "", "sub": "rl-contas", "dica": "“7 para 2” quer dizer que, a cada 7 + 2 = 9 atendimentos, 2 são à tarde. Comece dividindo o total por 9.", "porque": {"A": "280 é o número da manhã. A pergunta é sobre a tarde, que são 2 partes de 40.", "B": "180 é metade de 360, mas a tarde não é metade. São 2 das 9 partes: 2 × 40 = 80.", "C": "40 é uma parte só. A tarde tem 2 partes, então 2 × 40 = 80.", "E": "120 não bate com a conta certa. Cada parte é 360 ÷ 9 = 40, e a tarde tem 2 partes: 80."}}, {"id": "sus-01", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas dos incisos abaixo, transcritos do art. 7º da Lei nº 8.080/1990.\n\nI – ________ de acesso aos serviços de saúde em todos os níveis de assistência;\nII – ________ de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema;\nIV – ________ da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "alternativas": ["integralidade – universalidade – equidade", "universalidade – integralidade – equidade", "universalidade – integralidade – igualdade", "equidade – integralidade – universalidade", "universalidade – equidade – igualdade"], "correta": 2, "explicacao": "O texto da Lei 8.080 usa “universalidade” (I), “integralidade” (II) e “igualdade” (IV). A pegadinha é “equidade”: o termo é muito usado na doutrina do SUS, mas não é a palavra que aparece no inciso IV do art. 7º.", "fundamento": "Art. 7º, I – universalidade de acesso aos serviços de saúde em todos os níveis de assistência; II – integralidade de assistência [...]; IV – igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "fonte": "Lei 8.080/1990, art. 7º, I, II e IV", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando a lacuna for “___ da assistência à saúde, sem preconceitos ou privilégios”, a palavra do art. 7º da Lei 8.080 é igualdade. Equidade não aparece nesse inciso.", "passos": [{"t": "Use a pista de cada lacuna. “Acesso aos serviços de saúde em todos os níveis” é universalidade (I)."}, {"t": "“Conjunto articulado e contínuo das ações e serviços” é integralidade (II)."}, {"t": "“Sem preconceitos ou privilégios de qualquer espécie” é igualdade (IV). A ordem fica universalidade, integralidade, igualdade."}], "resp": "Alternativa C", "pegadinha": "B troca igualdade por equidade. Equidade é muito usada quando se fala do SUS, mas não é a palavra que está no inciso IV do art. 7º.", "porque": {"A": "Você trocou as duas primeiras. “Acesso em todos os níveis” é universalidade, e o inciso IV usa “igualdade”, não “equidade”.", "B": "Equidade não está no inciso IV. A lei usa “igualdade da assistência à saúde”.", "D": "Acesso aos serviços em todos os níveis é universalidade (I). E “sem preconceitos ou privilégios” é igualdade (IV).", "E": "O inciso II, o do “conjunto articulado e contínuo das ações”, é integralidade, não equidade."}}, {"id": "sus-02", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Considere as afirmações abaixo sobre os objetivos do Sistema Único de Saúde (SUS), conforme o art. 5º da Lei nº 8.080/1990.\n\nQuais estão corretas?", "itens": ["I – É objetivo do SUS a identificação e divulgação dos fatores condicionantes e determinantes da saúde.", "II – É objetivo do SUS a formulação de política de saúde destinada a promover, nos campos econômico e social, a observância do dever do Estado de garantir a saúde.", "III – É objetivo do SUS a assistência às pessoas exclusivamente por meio de ações de recuperação da saúde, ficando as atividades preventivas a cargo de outros setores do governo."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II reproduzem os incisos I e II do art. 5º (o inciso II remete ao § 1º do art. 2º, que trata do dever do Estado). III está errada: a lei prevê ações de promoção, proteção e recuperação, com realização integrada das ações assistenciais e das atividades preventivas.", "fundamento": "Art. 5º São objetivos do Sistema Único de Saúde SUS: [...] III - a assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas.", "fonte": "Lei 8.080/1990, art. 5º, I a III (e art. 2º, § 1º)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando a questão falar dos OBJETIVOS do SUS (art. 5º) e disser “exclusivamente” recuperação, está errada: o objetivo é promoção, proteção e recuperação, com assistência e prevenção integradas.", "passos": [{"t": "Veja o tema: aqui são os OBJETIVOS do SUS, que ficam no art. 5º da Lei 8.080."}, {"t": "I e II copiam os incisos I e II do art. 5º: identificar e divulgar os fatores condicionantes e determinantes da saúde, e formular política de saúde. Certos."}, {"t": "III usa “exclusivamente” recuperação e joga a prevenção para outros setores. A lei diz promoção, proteção e recuperação, com ações assistenciais e preventivas feitas de forma integrada."}], "resp": "Alternativa D", "pegadinha": "E (I, II e III) pega quem lê rápido. A palavra “exclusivamente” no item III já mostra o erro.", "porque": {"A": "Você deixou a II de fora, mas ela copia o inciso II do art. 5º: formular política de saúde é objetivo do SUS.", "B": "Você deixou a I de fora, mas ela copia o inciso I do art. 5º: identificar e divulgar os fatores condicionantes e determinantes da saúde.", "C": "A III está errada: o objetivo é promoção, proteção e recuperação, não “exclusivamente” recuperação. E a I e a II estão certas.", "E": "A III está errada. A palavra “exclusivamente” entrega: a lei fala em promoção, proteção e recuperação, com prevenção integrada."}}, {"id": "sus-03", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com o art. 6º da Lei nº 8.080/1990, estão incluídas no campo de atuação do Sistema Único de Saúde (SUS) as ações abaixo, EXCETO:", "alternativas": ["a vigilância nutricional e a orientação alimentar.", "a fiscalização e a inspeção de alimentos, água e bebidas para consumo humano.", "a ordenação da formação de recursos humanos na área de saúde.", "a colaboração na proteção do meio ambiente, nele compreendido o do trabalho.", "a formulação e a execução, de forma exclusiva, da política de saneamento básico."], "correta": 4, "explicacao": "Quanto ao saneamento básico, a lei atribui ao SUS apenas a participação na formulação da política e na execução de ações, e não a condução exclusiva da política. As demais alternativas reproduzem os incisos IV, VIII, III e V do art. 6º.", "fundamento": "Art. 6º Estão incluídas ainda no campo de atuação do Sistema Único de Saúde (SUS): [...] II - a participação na formulação da política e na execução de ações de saneamento básico;", "fonte": "Lei 8.080/1990, art. 6º, II, III, IV, V e VIII", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando aparecer saneamento básico no campo de atuação do SUS, lembre: o SUS participa da formulação da política e da execução de ações. Nada de “exclusiva”.", "passos": [{"t": "A questão pede a EXCEÇÃO. Procure a palavra que exagera: a E diz “de forma exclusiva”."}, {"t": "O art. 6º, II, dá ao SUS “a participação na formulação da política e na execução de ações de saneamento básico”."}, {"t": "Participar não é conduzir sozinho. Por isso a E está fora. As outras copiam os incisos IV, VIII, III e V do art. 6º."}], "resp": "Alternativa E", "pegadinha": "C (formação de recursos humanos) e D (meio ambiente) parecem longe da saúde, mas estão no art. 6º. Saneamento também está, só que como participação, não como tarefa exclusiva.", "porque": {"A": "Vigilância nutricional e orientação alimentar estão no art. 6º. A questão pede a que fica fora, e essa está dentro.", "B": "Fiscalizar alimentos, água e bebidas está no art. 6º. A que fica fora é a do saneamento “de forma exclusiva”.", "C": "Formação de recursos humanos parece longe da saúde, mas está no art. 6º. A questão pede a que fica fora.", "D": "Meio ambiente parece longe da saúde, mas colaborar na sua proteção está no art. 6º. A questão pede a que fica fora."}}, {"id": "sus-04", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com as definições do art. 6º da Lei nº 8.080/1990.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Entende-se por vigilância sanitária um conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde.", "( ) A vigilância epidemiológica abrange o controle de bens de consumo que, direta ou indiretamente, se relacionem com a saúde, compreendidas todas as etapas e processos, da produção ao consumo.", "( ) Entende-se por vigilância epidemiológica um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.", "( ) Para fins da lei, a saúde do trabalhador destina-se apenas à recuperação e reabilitação dos trabalhadores já acidentados, não abrangendo ações de promoção e proteção da saúde."], "alternativas": ["F – V – V – F", "V – F – V – F", "V – V – F – F", "V – F – F – V", "F – F – V – V"], "correta": 1, "explicacao": "O controle de bens de consumo “da produção ao consumo” integra a vigilância sanitária (§ 1º, I), não a epidemiológica: é a troca entre as duas vigilâncias. A saúde do trabalhador (§ 3º) abrange promoção e proteção, além de recuperação e reabilitação.", "fundamento": "§ 3º Entende-se por saúde do trabalhador [...] um conjunto de atividades que se destina, através das ações de vigilância epidemiológica e vigilância sanitária, à promoção e proteção da saúde dos trabalhadores, assim como visa à recuperação e reabilitação da saúde dos trabalhadores [...]", "fonte": "Lei 8.080/1990, art. 6º, §§ 1º, 2º e 3º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando o item falar em controle de bens de consumo “da produção ao consumo”, é vigilância SANITÁRIA, não epidemiológica.", "passos": [{"t": "Item 1 é a definição de vigilância sanitária: V. Item 3 é a definição de vigilância epidemiológica: V."}, {"t": "Item 2 troca as vigilâncias. O controle de bens de consumo “da produção ao consumo” é da sanitária (§ 1º, I). É F."}, {"t": "Item 4 diz “apenas” recuperação e reabilitação. A saúde do trabalhador (§ 3º) abrange também promoção e proteção. É F."}], "resp": "Alternativa B", "pegadinha": "A e C marcam o item 2 como verdadeiro. Controlar bens de consumo parece caber em qualquer vigilância, mas a lei põe isso na sanitária.", "porque": {"A": "Essa diz que o item 2 é V, mas controlar bens de consumo é vigilância sanitária. E o item 1, a definição da sanitária, é V.", "C": "Essa diz que o item 2 é V, mas bens de consumo são da vigilância sanitária. E o item 3 é a definição da epidemiológica, V.", "D": "Essa erra o item 3 e o 4. O item 3 é a definição da epidemiológica, V. E a saúde do trabalhador inclui promoção e proteção.", "E": "Essa erra o item 1 e o 4. O item 1 é a definição da vigilância sanitária, V. E a saúde do trabalhador inclui promoção e proteção."}}, {"id": "sus-05", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Segundo o art. 7º, IX, da Lei nº 8.080/1990, a descentralização político-administrativa no Sistema Único de Saúde (SUS) ocorre", "alternativas": ["com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os municípios e com regionalização e hierarquização da rede de serviços de saúde.", "com direção compartilhada entre União, Estados e Municípios em cada serviço, com ênfase na descentralização dos serviços para os Estados.", "com direção única exercida pela União, com ênfase na centralização dos serviços de maior complexidade e com regionalização da rede.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os Estados e com hierarquização dos profissionais de saúde.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os consórcios intermunicipais, dispensada a regionalização."], "correta": 0, "explicacao": "A lei fala em direção única em cada esfera de governo, com ênfase na descentralização para os municípios, e não para os Estados. Regionalização e hierarquização referem-se à rede de serviços de saúde, não aos profissionais.", "fundamento": "IX - descentralização político-administrativa, com direção única em cada esfera de governo: a) ênfase na descentralização dos serviços para os municípios; b) regionalização e hierarquização da rede de serviços de saúde;", "fonte": "Lei 8.080/1990, art. 7º, IX, alíneas a e b", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando a questão falar em descentralização do SUS, lembre a fórmula do art. 7º, IX: direção única em cada esfera, ênfase nos MUNICÍPIOS, regionalização e hierarquização da REDE de serviços.", "passos": [{"t": "Separe as três peças da lei: direção única em cada esfera de governo; ênfase na descentralização para os municípios; regionalização e hierarquização da rede de serviços de saúde."}, {"t": "Compare cada alternativa com as três peças. Só a A tem as três certas."}, {"t": "As outras trocam algum pedaço: Estados no lugar de municípios, ou profissionais no lugar da rede de serviços."}], "resp": "Alternativa A", "pe
