<!doctype html>
<html lang="pt-BR">
<head>

<title>Simulado HCPA</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23a8325e%22/%3E%3Cpath d=%22M18 33l9 9 19-20%22 fill=%22none%22 stroke=%22white%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">

<style>
/* Layout: uma coluna estreita, como um caderno de questões; alternativas viram as bolhas da folha óptica. */
:root {
  --paper: #f7f5f2;
  --card: #ffffff;
  --ink: #1f1d1b;
  --muted: #66615b;
  --line: #e2ddd6;
  --pen: #a8325e;
  --pen-fill: #a8325e;
  --sobre-fill: #ffffff;
  --borda-hoje: var(--line);
  --destaque: var(--ink);
  --post: #fff3c4;
  --post-borda: #d9a400;
  --post-texto: #6b4a00;
  --pen-soft: #f6e4ea;
  --ok: #1d7748;
  --ok-soft: #e2f3e9;
  --bad: #c2410c;
  --bad-soft: #fdebdd;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161514; --card: #201e1c; --ink: #f2efea; --muted: #a7a097; --line: #37332f;
    --pen: #e597b4; --pen-fill: #a8325e; --sobre-fill: #ffffff; --borda-hoje: var(--line); --destaque: var(--ink); --post: #3a3112; --post-borda: #b8901c; --post-texto: #f2cf5b; --pen-soft: #3a2230; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff9d5c; --bad-soft: #3a1c22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161514; --card: #201e1c; --ink: #f2efea; --muted: #a7a097; --line: #37332f;
  --pen: #e597b4; --pen-fill: #a8325e; --sobre-fill: #ffffff; --borda-hoje: var(--line); --destaque: var(--ink); --post: #3a3112; --post-borda: #b8901c; --post-texto: #f2cf5b; --pen-soft: #3a2230; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff9d5c; --bad-soft: #3a1c22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 680px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 22px; }
p, li { text-wrap: pretty; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.2rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--pen); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }

.faixa {
  font-size: 0.92rem; color: var(--muted); margin-top: -4px;
}
.topo { display: flex; flex-direction: column; gap: 10px; }
.contagem { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.contagem .dias { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--destaque); font-variant-numeric: tabular-nums; }
.contagem .rot { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats div { background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.8rem; color: var(--muted); }

.acoes { display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  border: 1px solid var(--line); background: var(--card); border-radius: var(--r);
  padding: 14px 16px; text-align: left; cursor: pointer; min-height: 52px;
}
.btn small { display: block; color: var(--muted); font-size: 0.85rem; }
.btn.prim { background: var(--pen-fill); border-color: var(--pen-fill); color: var(--sobre-fill); }
.btn.prim small { color: var(--sobre-fill); opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: default; }
.seta { font-family: var(--f-mono); flex: none; color: var(--pen); }

.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.temas { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.tema { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.tema:first-child { border-top: 0; }
.tema .nome { min-width: 0; }
.tema .qtd { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.barra { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; }
.barra i { display: block; height: 100%; background: var(--ok); }
.barra i.e { background: var(--bad); }

details.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 12px 14px; }
details.material summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
details.material ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
details.material li a { display: inline-block; padding: 10px 0; }
.nota { color: var(--muted); font-size: 0.88rem; }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-btn { background: none; border: 0; padding: 0; color: var(--pen); text-decoration: underline; cursor: pointer; font-size: 0.88rem; }

/* Questão */
.barra-sup { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.barra-sup .pos { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.progresso { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progresso i { display: block; height: 100%; background: var(--pen); }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pen); background: var(--pen-soft); padding: 4px 8px; border-radius: 6px; }
.questao { display: flex; flex-direction: column; gap: 16px; }
.questao .num { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
details.texto { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--muted); }
details.texto summary { cursor: pointer; font-weight: 700; color: var(--ink); }
details.texto p { margin-top: 10px; white-space: pre-line; font-size: 0.95rem; color: var(--ink); overflow-wrap: anywhere; }
.enunciado { font-size: 1.15rem; font-weight: 700; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
.origem { font-size: 0.85rem; color: var(--muted); }
.feito { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.feito h2 { color: var(--ok); font-size: 1.4rem; }
.itens { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.itens li { padding-left: 12px; border-left: 2px solid var(--line); overflow-wrap: anywhere; }
.opcoes { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
  width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 14px; cursor: pointer; min-height: 52px;
}
.opt .txt { min-width: 0; padding-top: 3px; overflow-wrap: anywhere; }
.bolha {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted);
}
.opt.marcada { border-color: var(--pen); }
.opt.marcada .bolha { background: var(--pen); border-color: var(--pen); color: var(--card); }
.opt.certa { border-color: var(--ok); background: var(--ok-soft); }
.opt.certa .bolha { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.errada { border-color: var(--bad); background: var(--bad-soft); }
.opt.errada .bolha { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.apagada { opacity: 0.6; }
.opt:disabled { cursor: default; }

.feedback { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--card); }
.feedback .veredito { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.feedback.ok .veredito { color: var(--ok); }
.feedback.bad .veredito { color: var(--bad); }
.feedback blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--pen); background: var(--pen-soft); border-radius: 0 8px 8px 0; font-size: 0.95rem; white-space: pre-line; }
.fb-regra { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--pen-soft); font-weight: 600; }
.fb-regra b { color: var(--pen); }
.fb-passos { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 12px; }
.fb-passos li::marker { color: var(--pen); font-weight: 800; }
.dica-q > summary { cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px dashed var(--pen); border-radius: 999px; color: var(--pen); font-weight: 700; }
.dica-q > summary::-webkit-details-marker { display: none; }
.dica-q > summary::before { content: '?'; display: grid; place-items: center; width: 1.4em; height: 1.4em; border-radius: 50%; background: var(--pen); color: var(--sobre-fill); font-size: 0.85em; font-weight: 800; }
.dica-q p { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--pen-soft); font-weight: 600; }
.rascunho > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--pen); }
.rascunho[open] > summary { margin-bottom: 8px; }
.rascunho > summary::-webkit-details-marker { display: none; }
.rascunho > summary::before { content: '▸'; }
.rascunho[open] > summary::before { content: '▾'; }
.folha-rascunho { padding: 14px 16px 16px 26px; border: 1px solid var(--line); border-radius: 10px; background-color: var(--card);
  background-image: linear-gradient(to right, transparent 13px, color-mix(in srgb, var(--bad) 40%, transparent) 13px 15px, transparent 15px),
    repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--ink) 8%, transparent) 31px 32px); }
.resp-final { margin: 14px 0 0; font-weight: 700; }
.resp-final span { display: inline-block; margin-left: 4px; padding: 2px 14px; border: 2px solid var(--pen); border-radius: 999px; font-weight: 800; }
.conta { display: grid; grid-template-columns: auto 2.5em auto; align-items: center; gap: 4px 10px; width: fit-content; max-width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px 16px; border: 1px dashed var(--line); border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.conta .traco { border-bottom: 2px solid var(--muted); align-self: center; }
.conta .eq { grid-column: 1 / -1; overflow-wrap: anywhere; }
.feedback .fonte { font-size: 0.88rem; color: var(--muted); overflow-wrap: anywhere; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.nav .in > p { flex: 1 1 100%; font-size: 0.92rem; }
.nb { flex: 1 1 0; min-height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; padding: 0 12px; }
.nb.prim { background: var(--pen-fill); color: var(--sobre-fill); border-color: var(--pen-fill); }
.nb.perigo { background: var(--bad); color: var(--card); border-color: var(--bad); }
.nb:disabled { opacity: 0.45; cursor: default; }
.sair { background: none; border: 0; color: var(--pen); cursor: pointer; padding: 6px 0; font-weight: 700; min-height: 44px; }

/* Resultado */
.placar { display: flex; flex-direction: column; gap: 6px; }
.placar .grande { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.veredito-edital { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.veredito-edital.ok { border-color: var(--ok); background: var(--ok-soft); }
.veredito-edital.bad { border-color: var(--bad); background: var(--bad-soft); }
.tabela { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabela th, .tabela td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); }
.tabela th { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; border-top: 0; }
.tabela td.n, .tabela th.n { text-align: right; font-family: var(--f-mono); white-space: nowrap; }
.revisao { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.revisao button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.revisao button:first-child { border-top: 0; }
.revisao .marca { font-family: var(--f-mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; color: var(--card); }
.revisao .marca.ok { background: var(--ok); }
.revisao .marca.bad { background: var(--bad); }
.revisao .marca.branco { background: var(--muted); }
.revisao .resumo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
/* Provas reais e folha de respostas */
.provas { display: flex; flex-direction: column; gap: 10px; }
.prova-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.prova-card h3 { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.prova-card .sub { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { flex: 1 1 140px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); padding: 0 12px; font-size: 0.95rem; }
.mini.prim { background: var(--pen-fill); border-color: var(--pen-fill); color: var(--sobre-fill); }
.aviso { background: var(--pen-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.folha { display: flex; flex-direction: column; gap: 18px; }
.bloco { display: flex; flex-direction: column; gap: 6px; }
.bloco h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.linhas { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; display: flex; flex-direction: column; }
.lf { display: flex; align-items: center; gap: 10px; padding-block: 5px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.lf:first-child { border-top: 0; }
.lf .nq { font-family: var(--f-mono); width: 2.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
.lf .bs { display: flex; gap: 8px; }
.lf .obs { font-size: 0.8rem; color: var(--muted); flex-basis: 100%; padding-left: calc(2.2em + 10px); }
.b { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--muted); background: none; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); cursor: pointer; padding: 0; }
.b[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.b.certa { background: var(--ok); border-color: var(--ok); color: var(--card); }
.b.errada { background: var(--bad); border-color: var(--bad); color: var(--card); }
.b.gab { border-color: var(--ok); color: var(--ok); border-width: 3px; }
.b:disabled { cursor: default; }
/* Tarefa do dia, resumos, plano e títulos */
.hoje { background: var(--card); border: 1px solid var(--borda-hoje); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.hoje .meta { color: var(--muted); font-size: 0.92rem; margin-top: -6px; }
.hoje h2 { font-size: 1.35rem; }
.hoje ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 2px; }
.hoje .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.passos-plano { display: flex; gap: 4px; }
.passos-plano i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.passos-plano i.f { background: var(--ok); }
.resumo { display: flex; flex-direction: column; gap: 14px; }
.resumo-cab { display: flex; flex-direction: column; gap: 6px; }
.resumo-cab .materia { align-self: flex-start; font-weight: 800; font-size: 0.8rem; }
.resumo-cab h2 { font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
.resumo-cab .meta { color: var(--muted); font-size: 0.92rem; }
.resumo-cab .porque { font-size: 1rem; }
.ferramentas { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.modos { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.modo { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: none; cursor: pointer; font-weight: 700; color: var(--muted); }
.modo[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); }
.modo:disabled { opacity: 0.45; cursor: default; }
.ouvir { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-weight: 700; }
.ouvir svg { color: var(--pen); }
.ouvir[aria-pressed="true"] { border-color: var(--pen); }
.gtitulo { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; margin-top: 10px; }
.pontos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.pontos li { display: grid; grid-template-columns: 1.8em 1fr; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); transition: background-color 0.25s ease-out; }
.pontos li:first-child { border-top: 0; }
.pontos .num { color: var(--pen); font-weight: 800; font-variant-numeric: tabular-nums; }
.pontos .corpo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

<script id="questoes" type="application/json">[{"id": "por-01", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Considere as seguintes afirmações sobre a referência de palavras do texto.", "itens": ["I – O pronome “eles” (3º parágrafo) retoma “Os profissionais administrativos”.", "II – O pronome “ela” (último período) retoma “a forma como alguém é recebido”.", "III – O pronome “aquele” (2º parágrafo) refere-se a um paciente, termo já mencionado na mesma frase."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I está correta: “São eles que organizam as filas” só pode se referir aos profissionais administrativos, sujeito do período anterior. III está correta: “aquele que é deixado sem resposta” contrapõe-se a “Um paciente que entende”, ou seja, “aquele” = o paciente. II está errada: em “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, “ela” retoma “a sobrecarga de trabalho”. A pegadinha é o termo “a forma como alguém é recebido”, que aparece depois, na oração com “pois”; o pronome anafórico aponta para trás, não para o que vem adiante.", "fundamento": "Pronomes pessoais e demonstrativos têm função referencial (anafórica): retomam um termo já expresso, normalmente o mais próximo compatível em gênero, número e sentido.", "fonte": "Coesão referencial: função anafórica dos pronomes pessoais e demonstrativos", "url": "", "regra": "Quando a questão perguntar a quem um pronome se refere, procure para trás no texto o termo mais próximo que combine em gênero, número e sentido.", "passos": [{"t": "I: em “São eles que organizam as filas”, “eles” só pode ser “Os profissionais administrativos”, sujeito do período anterior. Correta."}, {"t": "III: “aquele que é deixado sem resposta” se opõe a “Um paciente que entende”. Então “aquele” é o paciente, e a afirmação está correta."}, {"t": "II: em “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, o “ela” retoma “a sobrecarga de trabalho”. Errada."}], "resp": "Alternativa D (apenas I e III)", "pegadinha": "B e E caem no termo “a forma como alguém é recebido”, que vem depois do “ela”, na oração com “pois”. O pronome aponta para trás, não para o que vem adiante.", "porque": {"A": "Você deixou a III de fora, mas ela está certa: “aquele” se opõe a “Um paciente que entende”, então é o paciente.", "B": "A II está errada: o “ela” retoma “a sobrecarga de trabalho”, que vem antes. E você deixou de fora a I e a III, que estão certas.", "C": "Você deixou a I de fora, mas ela está certa: “São eles que organizam as filas” só pode ser os profissionais administrativos.", "E": "A II está errada: o “ela” retoma “a sobrecarga de trabalho”. “A forma como alguém é recebido” vem depois, e o pronome aponta para trás."}}, {"id": "por-02", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações sobre os nexos do texto. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) “Por isso” (1º parágrafo) introduz uma conclusão a partir do que foi dito antes.", "( ) “no entanto” (2º parágrafo) poderia ser substituído por “portanto” sem alteração de sentido.", "( ) “Embora” (3º parágrafo) introduz uma ideia de concessão.", "( ) “pois” (último período) expressa finalidade."], "alternativas": ["V – V – F – F", "V – F – V – F", "F – F – V – V", "V – F – F – V", "F – V – V – F"], "correta": 1, "explicacao": "1ª V: como quem chega traz dor e medo, conclui-se que o primeiro contato pesa muito. 2ª F: “no entanto” é adversativo (opõe a cortesia à ideia de que acolher é só ser educado); “portanto” é conclusivo e mudaria o sentido. 3ª V: “Embora” admite um fato (a sobrecarga é real) que não impede a conclusão. 4ª F: “pois”, posposto ao verbo e iniciando a oração, é explicativo/causal (dá a razão de a indiferença não se justificar); finalidade seria “para que”.", "fundamento": "Conjunções estabelecem relações lógicas: adversativas (mas, no entanto) opõem; conclusivas (portanto, por isso) concluem; concessivas (embora, ainda que) admitem um obstáculo que não impede o fato; explicativas (pois, porque) justificam.", "fonte": "Nexos/conjunções: valor semântico das coordenativas e subordinativas", "url": "", "regra": "Quando a questão perguntar o sentido de um conectivo, classifique-o primeiro (opõe, conclui, admite um obstáculo ou explica) e só aceite troca por outro do mesmo grupo.", "passos": [{"t": "1ª, “Por isso”: como quem chega traz dor e medo, conclui-se que o primeiro contato pesa muito. V."}, {"t": "2ª, “no entanto”: opõe ideias. “Portanto” conclui, então a troca mudaria o sentido: F."}, {"t": "3ª, “Embora”: admite um fato (a sobrecarga é real) que não impede a conclusão. Isso é concessão, então V."}, {"t": "4ª, “pois”: dá a razão de a indiferença não se justificar. Finalidade seria “para que”, então F."}], "resp": "Alternativa B (V, F, V, F)", "pegadinha": "D marca a 4ª como V, como se “pois” indicasse finalidade. “Pois” explica a razão; finalidade é “para que”.", "porque": {"A": "Essa diz que a 2ª é V, mas “no entanto” opõe e “portanto” conclui. E marca a 3ª como F, mas “Embora” é concessão.", "C": "Essa marca a 1ª como F, mas “Por isso” conclui, sim. E marca a 4ª como V, mas “pois” explica a razão, finalidade seria “para que”.", "D": "Essa erra a 3ª e a 4ª. “Embora” é concessão, então a 3ª é V. E “pois” explica a razão, finalidade seria “para que”.", "E": "Essa erra as duas primeiras. “Por isso” conclui, então a 1ª é V. E “no entanto” opõe, não pode virar “portanto”."}}, {"id": "por-03", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "No trecho “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, a palavra “Embora” pode ser substituída, sem alteração do sentido e sem necessidade de outras mudanças na frase, por", "alternativas": ["Ainda que", "Visto que", "Caso", "À medida que", "Para que"], "correta": 0, "explicacao": "“Embora” é concessiva, e “Ainda que” também é, mantendo o verbo no subjuntivo (“seja”). “Visto que” é causal: diria que a sobrecarga é a causa de não se justificar a indiferença, o que não faz sentido. “Caso” é condicional e tornaria hipotético um fato que o texto afirma. “À medida que” indica proporção, e “Para que”, finalidade. A pegadinha é que todas as opções “cabem” na sintaxe com o subjuntivo ou o indicativo; só a concessiva conserva o sentido.", "fundamento": "Conjunções subordinativas concessivas (embora, ainda que, mesmo que, conquanto, se bem que) introduzem um fato contrário ao da oração principal, mas insuficiente para impedi-lo; costumam exigir o subjuntivo.", "fonte": "Conjunções subordinativas concessivas: substituição mantendo o sentido", "url": "", "regra": "Quando pedirem para trocar “embora” sem mudar o sentido, procure outra concessiva, como “ainda que”, “mesmo que” ou “se bem que”.", "passos": [{"t": "“Embora” é concessiva: admite um fato (a sobrecarga é real) que não impede o resto da frase."}, {"t": "“Ainda que” também é concessiva e aceita o mesmo verbo no subjuntivo (“seja”)."}, {"t": "As outras mudam o sentido: “Visto que” indica causa, “Caso” indica condição, “À medida que” indica proporção e “Para que” indica finalidade."}], "resp": "Alternativa A", "pegadinha": "B, “Visto que”, indica causa. Diria que a sobrecarga é a causa de a indiferença não se justificar, o que não faz sentido.", "porque": {"B": "“Visto que” indica causa. Diria que a sobrecarga é a causa de a indiferença não se justificar, o que não faz sentido.", "C": "“Caso” indica condição. Deixaria como hipótese uma sobrecarga que o texto afirma que é real.", "D": "“À medida que” indica proporção, não concessão. Só outra concessiva, como “ainda que”, troca “embora” sem mudar o sentido.", "E": "“Para que” indica finalidade, não concessão. Só outra concessiva, como “ainda que”, troca “embora” sem mudar o sentido."}}, {"id": "por-04", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas da frase abaixo, na ordem em que aparecem.\n\n“Entregue o laudo ___ enfermeira responsável e informe ___ ela o horário da consulta, marcada para ___ 14h.”", "alternativas": ["a – à – às", "à – à – as", "a – a – às", "à – a – as", "à – a – às"], "correta": 4, "explicacao": "1ª lacuna: entrega-se algo A alguém (preposição) + A enfermeira (artigo) = “à”. 2ª lacuna: diante do pronome pessoal “ela” não se usa artigo, logo não há crase: “a ela”. 3ª lacuna: na indicação de hora determinada, há crase: “às 14h”. A pegadinha é a 2ª lacuna: o verbo pede a preposição, mas o pronome pessoal não admite artigo.", "fundamento": "Crase é a fusão da preposição “a” com o artigo feminino “a”. Ocorre antes de palavra feminina que admite artigo e na indicação de horas; não ocorre antes de pronomes pessoais como ela, você ou eles.", "fonte": "Crase: a + artigo feminino; ausência antes de pronome pessoal; presença na indicação de horas", "url": "", "regra": "Quando a lacuna vier antes de pronome pessoal (ela, você, eles), não use crase; antes de hora marcada, use.", "passos": [{"t": "1ª lacuna: entrega-se algo A alguém (preposição) + A enfermeira (artigo). Fica “à enfermeira”."}, {"t": "2ª lacuna: “ela” é pronome pessoal e não aceita artigo. Fica “a ela”, sem crase."}, {"t": "3ª lacuna: indicação de hora determinada leva crase. Fica “às 14h”."}], "resp": "Alternativa E (à, a, às)", "pegadinha": "B põe crase antes de “ela”. O verbo pede a preposição, mas o pronome pessoal não aceita artigo, então não há crase.", "porque": {"A": "Você trocou as duas primeiras. “À enfermeira” leva crase, e “a ela” não leva, porque pronome pessoal não aceita artigo.", "B": "Antes de “ela” não há crase, porque pronome pessoal não aceita artigo. E hora marcada leva crase: “às 14h”.", "C": "Faltou a crase em “à enfermeira”: entrega-se algo A alguém, e “enfermeira” aceita o artigo “a”.", "D": "Faltou a crase na hora. Hora marcada leva crase: “às 14h”."}}, {"id": "por-05", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.", "alternativas": ["Faziam dois meses que o paciente aguardava a cirurgia.", "Houveram muitas reclamações sobre a demora no atendimento.", "Devem haver vagas no ambulatório na próxima semana.", "Precisa-se de técnicos de enfermagem para o turno da noite.", "Aluga-se salas comerciais próximas ao hospital."], "correta": 3, "explicacao": "Em D, “precisar de” é verbo transitivo indireto; o “se” é índice de indeterminação do sujeito e o verbo fica no singular. Em A, “fazer” indicando tempo é impessoal: “Fazia dois meses”. Em B, “haver” no sentido de existir é impessoal: “Houve”. Em C, o auxiliar de “haver” impessoal também fica no singular: “Deve haver”. Em E, “alugar” é transitivo direto e o “se” é partícula apassivadora; o verbo concorda com o sujeito “salas”: “Alugam-se”. A pegadinha é tratar D e E como iguais: só com VTI o singular é obrigatório.", "fundamento": "Haver (existir) e fazer (tempo decorrido) são impessoais e ficam na 3ª pessoa do singular, inclusive o auxiliar da locução. Com VTD + se (voz passiva sintética), o verbo concorda com o sujeito; com VTI + se (índice de indeterminação), fica no singular.", "fonte": "Concordância verbal: verbos impessoais e voz passiva sintética × índice de indeterminação do sujeito", "url": "", "regra": "Quando aparecer verbo + “se”, veja se o verbo pede preposição: com preposição (“precisa-se de”) fica no singular; sem preposição (“alugam-se salas”) concorda com o termo.", "passos": [{"t": "D: “precisar de” pede preposição, então o “se” indetermina o sujeito e o verbo fica no singular. Correta."}, {"t": "A, B e C: “fazer” indicando tempo e “haver” no sentido de existir ficam no singular, inclusive o auxiliar. O certo é “Fazia”, “Houve” e “Deve haver”."}, {"t": "E: “alugar” não pede preposição, então “salas” é o sujeito e o verbo vai para o plural: “Alugam-se”."}], "resp": "Alternativa D", "pegadinha": "E parece igual a D, mas “alugar” não pede preposição. Aí o verbo concorda com “salas”: “Alugam-se salas”.", "porque": {"A": "“Fazer” indicando tempo não vai para o plural. O certo é “Fazia dois meses”.", "B": "“Haver” no sentido de existir fica no singular. O certo é “Houve muitas reclamações”.", "C": "Com “haver” no sentido de existir, até o auxiliar fica no singular. O certo é “Deve haver vagas”.", "E": "“Alugar” não pede preposição, então “salas” é o sujeito e o verbo vai para o plural: “Alugam-se salas”."}}, {"id": "por-06", "materia": "Português", "tema": "Português", "enunciado": "Considere as frases abaixo quanto à regência verbal, segundo a norma-padrão.", "itens": ["I – A paciente preferia mais ser atendida pela manhã do que à tarde.", "II – Os usuários devem obedecer às normas de visitação do hospital.", "III – Os familiares chegaram no hospital antes do horário de visita."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "explicacao": "II está correta: “obedecer” é transitivo indireto e exige a preposição “a” (obedecer às normas). I está errada: “preferir” rege a preposição “a” e não admite “mais... do que”; o correto é “preferia ser atendida pela manhã a ser atendida à tarde”. III está errada: verbos de movimento como “chegar” regem a preposição “a” na norma-padrão (“chegaram ao hospital”); “chegar em” é uso coloquial. A pegadinha é que I e III soam naturais na fala.", "fundamento": "Preferir: prefere-se uma coisa a outra, sem intensificadores. Obedecer/desobedecer: transitivos indiretos (preposição a). Chegar, ir: regem a preposição a para indicar destino.", "fonte": "Regência verbal: preferir, obedecer e chegar", "url": "", "regra": "Quando cair regência de “preferir”, “obedecer” ou “chegar”, lembre: prefere-se uma coisa A outra, obedece-se A algo, chega-se A um lugar.", "passos": [{"t": "II: “obedecer” pede a preposição “a”. “Obedecer às normas” está correto."}, {"t": "I: “preferir” pede “a” e não aceita “mais... do que”. O certo é “preferia ser atendida pela manhã a ser atendida à tarde”."}, {"t": "III: “chegar” é verbo de movimento e pede “a” na norma-padrão: “chegaram ao hospital”. “Chegar em” é uso coloquial."}], "resp": "Alternativa B (apenas II)", "pegadinha": "I e III soam naturais na fala, e por isso D e E atraem. Mas “preferir mais... do que” e “chegar em” fogem da norma-padrão.", "porque": {"A": "A I está errada: “preferir” não aceita “mais... do que”. E você deixou de fora a II, que está certa: “obedecer às normas”.", "C": "A III está errada: na norma-padrão se chega A um lugar, “chegaram ao hospital”. E a II, que está certa, ficou de fora.", "D": "A I está errada: “preferir” não aceita “mais... do que”. O certo é preferir uma coisa A outra.", "E": "A I e a III estão erradas. “Preferir mais... do que” e “chegar em” soam naturais na fala, mas fogem da norma-padrão."}}, {"id": "por-07", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a pontuação está correta.", "alternativas": ["Os pacientes que aguardam na fila, devem apresentar o cartão do SUS.", "O hospital, que atende pelo SUS recebe pacientes de todo o estado.", "Na semana passada, a ouvidoria recebeu elogios, sugestões e reclamações.", "A enfermeira explicou, os cuidados ao familiar do paciente.", "Senhora, Maria por favor, aguarde ser chamada."], "correta": 2, "explicacao": "Em C, a vírgula isola o adjunto adverbial deslocado para o início (“Na semana passada”) e as demais separam os itens de uma enumeração. Em A, há vírgula entre o sujeito (“Os pacientes que aguardam na fila”) e o verbo (“devem”). Em B, a oração adjetiva explicativa foi aberta e não fechada: “O hospital, que atende pelo SUS, recebe...”. Em D, a vírgula separa o verbo de seu complemento. Em E, o vocativo é “Senhora Maria” e deve vir isolado inteiro: “Senhora Maria, por favor, aguarde...”.", "fundamento": "Não se separa por vírgula o sujeito do verbo nem o verbo de seus complementos. Isolam-se por vírgulas o adjunto adverbial deslocado, os termos de enumeração, as orações adjetivas explicativas (nos dois lados) e o vocativo.", "fonte": "Pontuação: emprego da vírgula", "url": "", "regra": "Quando a questão for de vírgula, procure primeiro vírgula entre sujeito e verbo ou entre verbo e complemento: isso é erro.", "passos": [{"t": "C: a primeira vírgula isola “Na semana passada”, deslocado para o início, e as outras separam itens de uma lista. Correta."}, {"t": "A e D: a vírgula separa o sujeito do verbo (“na fila, devem”) e o verbo do complemento (“explicou, os cuidados”). Erradas."}, {"t": "B: o trecho “que atende pelo SUS” abriu com vírgula e não fechou. E: quem está sendo chamado é “Senhora Maria”, e o nome todo deve ficar entre vírgulas."}], "resp": "Alternativa C", "pegadinha": "A tem vírgula entre o sujeito “Os pacientes que aguardam na fila” e o verbo “devem”. Sujeito e verbo não se separam por vírgula.", "porque": {"A": "Tem vírgula entre o sujeito “Os pacientes que aguardam na fila” e o verbo “devem”. Sujeito e verbo não se separam.", "B": "A vírgula abriu o trecho “que atende pelo SUS” e não fechou. O certo é “O hospital, que atende pelo SUS, recebe”.", "D": "A vírgula separa o verbo “explicou” do complemento “os cuidados”. Verbo e complemento não se separam.", "E": "Quem está sendo chamado é “Senhora Maria”, e o nome todo fica entre vírgulas: “Senhora Maria, por favor, aguarde”."}}, {"id": "inf-01", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha do Excel, a célula B2 contém a fórmula =A2*$C$1. Essa célula foi copiada e colada na célula C3 (uma linha abaixo e uma coluna à direita). A fórmula que aparecerá em C3 é", "alternativas": ["=A3*$C$1", "=B3*$D$2", "=A2*$C$1", "=B3*$D$1", "=B3*$C$1"], "correta": 4, "explicacao": "A referência A2 é relativa: ao deslocar a fórmula uma linha para baixo e uma coluna para a direita, ela vira B3. A referência $C$1 é absoluta (cifrão antes da coluna e da linha) e não muda. Resultado: =B3*$C$1. As pegadinhas: em A só a linha foi ajustada; em B e D a referência absoluta foi tratada como relativa; em C nada foi ajustado.", "fundamento": "A página da Microsoft explica que, por padrão, a referência é relativa e se ajusta ao ser copiada; o cifrão antes da coluna e da linha ($A$1) a torna absoluta, e F4 alterna entre os tipos. Na tabela do suporte, $A$1 copiada continua $A$1, enquanto A1 vira C3.", "fonte": "Microsoft Suporte – Alternar entre referências relativas, absolutas e mistas", "url": "https://support.microsoft.com/pt-br/office/alternar-entre-refer%C3%AAncias-relativas-absolutas-e-mistas-dfec08cd-ae65-4f56-839e-5f0d8d0baca9", "regra": "Ao copiar uma fórmula, cada referência anda o mesmo tanto que a célula andou. O que tem $ na frente fica parado.", "passos": [{"t": "A fórmula está em B2 e vai ser colada em C3:", "grade": {"cols": ["A", "B", "C", "D"], "linhas": [1, 2, 3], "cel": {"B2": "=A2*$C$1", "C3": "?"}, "cor": {"B2": "origem", "C3": "destino"}, "legenda": [["origem", "copiou daqui"], ["destino", "colou aqui"]]}}, {"t": "De B2 para C3 ela andou 1 coluna para a direita (B → C) e 1 linha para baixo (2 → 3)."}, {"t": "Agora mova cada pedaço da fórmula:", "conta": ["A2 → B3 (não tem $: anda 1 coluna e 1 linha)", "$C$1 → $C$1 (tem $ na frente de tudo: fica parado)"]}, {"t": "Junte as duas. Em C3 fica:", "grade": {"cols": ["A", "B", "C", "D"], "linhas": [1, 2, 3], "cel": {"B2": "=A2*$C$1", "C3": "=B3*$C$1"}, "cor": {"C3": "destino", "B3": "anda", "C1": "fixa"}, "legenda": [["anda", "B3: a referência que andou"], ["fixa", "C1: a que ficou parada"]]}}], "resp": "=B3*$C$1", "pegadinha": "B e D mudaram o $C$1, como se ele não tivesse $. A mudou só a linha e esqueceu que a fórmula também andou para o lado.", "gerador": "formula-copia", "porque": {"A": "Você só ajustou a linha. A fórmula também andou uma coluna para a direita, então o A vira B.", "B": "Você mexeu no $C$1, mas ele tem cifrão na coluna e na linha. O que tem cifrão fica parado.", "C": "Você não ajustou nada. A2 não tem cifrão, então anda junto com a célula: uma coluna e uma linha, virando B3.", "D": "Você mudou a coluna do $C$1, mas o cifrão antes do C trava a coluna. Ele continua $C$1."}, "sub": "info-planilhas"}, {"id": "inf-02", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre funções de pesquisa do Excel.", "itens": ["I – Na função PROCV, o valor procurado deve estar na primeira coluna do intervalo informado como matriz_tabela.", "II – Na fórmula =PROCV(A2;D2:F50;3;FALSO), o número 3 indica que o valor retornado virá da coluna F, e o argumento FALSO indica correspondência exata.", "III – Assim como a PROCV, a função PROCX só pesquisa da esquerda para a direita, não podendo retornar valores de colunas situadas à esquerda da coluna pesquisada."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I está correta: a primeira coluna da matriz deve conter o valor procurado. II está correta: o índice de coluna conta a partir da primeira coluna da matriz (D=1, E=2, F=3), e FALSO/0 pede correspondência exata. III está errada: essa limitação é da PROCV; a PROCX recebe a matriz de pesquisa e a de retorno separadamente e funciona com o retorno de qualquer lado. Pegadinha extra: o índice 3 não é a 3ª coluna da planilha (C), e sim a 3ª coluna da matriz.", "fundamento": "Suporte Microsoft: a primeira coluna do intervalo deve conter o valor procurado; o número da coluna começa em 1 na coluna mais à esquerda da matriz; 0/FALSO pesquisa o valor exato. A PROCX retorna resultados independentemente do lado da coluna de retorno, ao contrário da PROCV.", "fonte": "Microsoft Suporte – Função PROCV; Função PROCX", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-procv-0bbc8083-26fe-4963-8ab8-93a18ad188a1", "regra": "Quando aparecer o número da coluna no PROCV, conte a partir da primeira coluna do intervalo, não da coluna A da planilha.", "passos": [{"t": "I: no PROCV, o valor procurado tem que estar na primeira coluna do intervalo. Correta."}, {"t": "II: o número 3 conta a partir da primeira coluna de D2:F50, e FALSO pede valor exato. Correta.", "conta": ["D = 1", "E = 2", "F = 3"]}, {"t": "III: só olhar para a direita é limitação do PROCV; o PROCX recebe a coluna de pesquisa e a de retorno separadas e retorna de qualquer lado. Errada."}], "resp": "Alternativa C (apenas I e II)", "pegadinha": "E atrai quem acha que o PROCX tem a mesma limitação do PROCV. Não tem: o PROCX retorna valores de qualquer lado.", "porque": {"A": "Você deixou a II de fora, mas ela está certa: contando a partir do D, a coluna F é a 3ª, e FALSO pede valor exato.", "B": "A III está errada: só olhar para a direita é limitação do PROCV, o PROCX retorna de qualquer lado. E a I e a II estão certas.", "D": "A III está errada: o PROCX retorna valores de qualquer lado. E a I está certa: o valor procurado fica na primeira coluna.", "E": "A III está errada. Só olhar para a direita é limitação do PROCV, o PROCX retorna valores de qualquer lado."}, "sub": "info-planilhas"}, {"id": "inf-03", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha (Excel ou Google Planilhas), o intervalo B2:B7 contém, nesta ordem, os textos Agendado, Faltou, Agendado, Atendido, Faltou, Faltou; o intervalo C2:C7 contém os tempos de espera 20, 35, 15, 40, 25, 15. Foram digitadas as fórmulas: D1: =CONT.SE(B2:B7;\"Faltou\") | D2: =SE(D1>3;\"Revisar agenda\";\"Normal\") | D3: =MÉDIA(C2:C7). Os resultados exibidos em D1, D2 e D3 são, respectivamente,", "alternativas": ["3 – Normal – 25", "3 – Revisar agenda – 25", "2 – Normal – 25", "3 – Normal – 30", "4 – Revisar agenda – 22,5"], "correta": 0, "explicacao": "CONT.SE conta as células de B2:B7 iguais a \"Faltou\": são 3 (B3, B6 e B7). Em D2, o teste é D1>3, ou seja, 3>3, que é FALSO; por isso SE devolve o terceiro argumento, \"Normal\". MÉDIA: (20+35+15+40+25+15)/6 = 150/6 = 25. A pegadinha é o operador “maior que” (>) e não “maior ou igual” (>=): com 3 faltas o teste é falso.", "fundamento": "CONT.SE(intervalo; critério) conta as células do intervalo que atendem ao critério. SE(teste_lógico; valor_se_verdadeiro; [valor_se_falso]) devolve o segundo argumento se o teste for VERDADEIRO e o terceiro se for FALSO.", "fonte": "Microsoft Suporte – Função CONT.SE; Função SE", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-cont-se-e0de10c6-f885-4e71-abb4-1f464816df34", "regra": "Quando a fórmula SE usar “>”, lembre que o valor igual não passa: 3>3 é FALSO, e só “>=” aceita o igual.", "passos": [{"t": "D1: CONT.SE conta quantas vezes aparece “Faltou” em B2:B7:", "grade": {"cols": ["B", "C"], "linhas": [2, 3, 4, 5, 6, 7], "cel": {"B2": "Agendado", "C2": "20", "B3": "Faltou", "C3": "35", "B4": "Agendado", "C4": "15", "B5": "Atendido", "C5": "40", "B6": "Faltou", "C6": "25", "B7": "Faltou", "C7": "15"}, "cor": {"B3": "origem", "B6": "origem", "B7": "origem"}}, "conta": ["B3, B6 e B7 = 3"]}, {"t": "D2: o teste é D1>3. Como 3 não é maior que 3, dá FALSO, e o SE devolve o último valor, “Normal”:", "conta": ["3 > 3 → FALSO", "resultado: Normal"]}, {"t": "D3: MÉDIA soma os tempos da coluna C e divide pela quantidade:", "conta": ["20 + 35 + 15 + 40 + 25 + 15 = 150", "150 ÷ 6 = 25"]}], "resp": "Alternativa A (3, Normal, 25)", "pegadinha": "B (Revisar agenda) trata “>” como “maior ou igual”. Com 3 faltas, 3>3 é falso, então sai “Normal”.", "porque": {"B": "Você tratou “>” como “maior ou igual”. Com 3 faltas, 3>3 é falso, então sai “Normal”.", "C": "O CONT.SE dá 3, não 2: “Faltou” aparece em B3, B6 e B7.", "D": "Esse 30 é a soma 150 dividida por 5. Mas são 6 tempos, então a média é 150 ÷ 6 = 25.", "E": "Não bate com a planilha: “Faltou” aparece 3 vezes, não 4, e a média dos 6 tempos é 150 ÷ 6 = 25."}, "sub": "info-planilhas"}, {"id": "inf-04", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre o compartilhamento de arquivos no Google Drive, assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Quem recebe o acesso de Leitor pode ver e abrir o arquivo, mas não pode editá-lo, comentá-lo nem compartilhá-lo.", "( ) Quem recebe o acesso de Comentador (comentarista) pode adicionar comentários e fazer sugestões, mas não editar o conteúdo diretamente.", "( ) Por padrão, os Editores podem mudar as permissões e compartilhar o arquivo, mas essa possibilidade pode ser desativada nas configurações de compartilhamento.", "( ) Quando o acesso geral é definido como “Qualquer pessoa com o link”, só consegue abrir o arquivo quem tem Conta do Google e foi convidado individualmente."], "alternativas": ["V – F – V – F", "F – V – V – V", "V – V – F – F", "V – V – V – F", "V – F – F – V"], "correta": 3, "explicacao": "As três primeiras estão de acordo com a Central de Ajuda do Drive: Leitor só vê; Comentador comenta e sugere; Editor edita e, por padrão, também compartilha e muda permissões, o que pode ser desligado desmarcando “Permitir que os editores mudem as permissões e compartilhem”. A quarta é falsa: com “Qualquer pessoa com o link”, quem tiver o link abre o arquivo mesmo sem fazer login; convite individual é o modo “Restrito”. Observação: a página atual do Drive chama o papel de “Comentador”; outras páginas do Google usam “comentarista”.", "fundamento": "Segundo a Central de Ajuda do Google Drive, Leitores não editam, comentam nem compartilham; Editores podem mudar permissões e compartilhar por padrão; com “Qualquer pessoa com o link”, qualquer pessoa que tenha o link abre o arquivo sem fazer login.", "fonte": "Google Drive Ajuda – Compartilhar arquivos do Google Drive", "url": "https://support.google.com/drive/answer/2494822?hl=pt-BR", "regra": "Quando a questão falar em “Qualquer pessoa com o link”, lembre que quem tem o link abre o arquivo, mesmo sem fazer login.", "passos": [{"t": "1ª e 2ª: o Leitor só vê, e o Comentador comenta e sugere sem editar o texto. As duas são V."}, {"t": "3ª: por padrão, o Editor também compartilha e muda permissões, mas isso pode ser desligado desmarcando “Permitir que os editores mudem as permissões e compartilhem”. V."}, {"t": "4ª: com “Qualquer pessoa com o link”, quem tiver o link abre mesmo sem login. Convite individual é o modo “Restrito”, então F."}], "resp": "Alternativa D (V, V, V, F)", "pegadinha": "B marca a 4ª como V. Ela descreve o modo “Restrito”, não “Qualquer pessoa com o link”.", "porque": {"A": "Essa diz que a 2ª é F, mas ela está certa: o Comentador comenta e sugere, sem editar o texto.", "B": "Essa erra a 1ª e a 4ª. O Leitor só vê, então a 1ª é V. E a 4ª descreve o modo “Restrito”, então é F.", "C": "Essa diz que a 3ª é F, mas por padrão o Editor compartilha e muda permissões, e isso pode ser desligado. É V.", "E": "Essa erra três. A 2ª e a 3ª são V. E a 4ª é F: com “Qualquer pessoa com o link”, abre mesmo sem login."}, "sub": "info-docs-drive"}, {"id": "inf-05", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre revisão colaborativa de documentos.", "itens": ["I – No Documentos Google, uma pessoa com permissão para comentar pode sugerir edições; as sugestões aparecem destacadas, o texto excluído aparece tachado, e o texto original só é substituído se a sugestão for aceita.", "II – No Microsoft Word, o recurso Controlar Alterações é ativado pela guia Revisão.", "III – No Microsoft Word, é possível aceitar ou rejeitar as alterações uma a uma ou todas de uma vez."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três estão corretas. I: o Google permite sugerir edições a quem tem permissão de comentar ou editar; o que se exclui fica tachado e só substitui o original após aprovação. II: no Word, o caminho é Revisão > Controlar Alterações. III: o Word oferece Aceitar/Rejeitar para cada alteração e “Aceitar Todas as Alterações” / “Rejeitar Todas as Alterações”. A pegadinha é supor que só Editores sugerem no Google Docs: Comentaristas também podem.", "fundamento": "Google: as pessoas podem sugerir edições quando têm permissão para comentar ou editar; exclusões aparecem tachadas e as sugestões aprovadas substituem o original. Microsoft: na guia Revisão, Controlar Alterações; aceitar ou rejeitar uma a uma ou todas.", "fonte": "Google Documentos Ajuda – Sugerir edições; Microsoft Suporte – Controlar alterações no Word", "url": "https://support.google.com/docs/answer/6033474?hl=pt-BR", "regra": "Quando a questão perguntar quem pode sugerir edições no Documentos Google, lembre que quem pode comentar também sugere, não só quem edita.", "passos": [{"t": "I: no Google, quem pode comentar ou editar pode sugerir; o texto excluído fica tachado e só sai se a sugestão for aceita. Correta."}, {"t": "II: no Word, o caminho é guia Revisão > Controlar Alterações. Correta."}, {"t": "III: o Word tem Aceitar/Rejeitar para cada alteração e também “Aceitar Todas as Alterações” e “Rejeitar Todas as Alterações”. Correta."}], "resp": "Alternativa E (I, II e III)", "pegadinha": "D (apenas II e III) atrai quem acha que só Editores sugerem no Google Docs. Comentaristas também podem.", "porque": {"A": "Você deixou a II e a III de fora, mas estão certas: Controlar Alterações fica na guia Revisão, e dá para aceitar uma a uma ou todas.", "B": "Você deixou de fora a I e a III, que estão certas. Quem pode comentar também sugere, e o Word aceita uma a uma ou todas.", "C": "Você deixou a III de fora, mas ela está certa: o Word aceita ou rejeita uma a uma e também todas de uma vez.", "D": "Você deixou a I de fora, mas ela está certa: no Google, quem pode comentar também sugere edições, não só quem edita."}, "sub": "info-docs-drive"}, {"id": "inf-06", "materia": "Informática", "tema": "Informática", "enunciado": "De acordo com a Cartilha de Segurança para Internet (CERT.br), assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Pagar o resgate exigido por um ransomware garante a recuperação dos dados; por isso, manter backups é dispensável.", "( ) Phishing é a fraude em que o golpista tenta obter dados pessoais e financeiros combinando meios técnicos e engenharia social, por exemplo com mensagens que se passam pela comunicação oficial de uma instituição.", "( ) Com a verificação em duas etapas ativada, mesmo que o atacante descubra a senha, ele precisará de outras informações para acessar a conta.", "( ) O recebimento de códigos por SMS é o método de verificação em duas etapas mais seguro e deve ser preferido à chave de segurança física."], "alternativas": ["V – V – F – F", "F – V – V – F", "F – F – V – V", "V – F – V – F", "F – V – F – V"], "correta": 1, "explicacao": "1ª F: a Cartilha afirma que pagar o resgate não garante o acesso aos dados, e que a única garantia é ter backups atualizados. 2ª V: é a definição de phishing do livro da Cartilha. 3ª V: é o que o fascículo Autenticação diz sobre a verificação em duas etapas. 4ª F: o fascículo diz que a chave de segurança física é a opção mais segura e recomenda usar SMS só se não houver outras opções.", "fundamento": "Cartilha: ransomware torna os dados inacessíveis e cobra resgate, que não garante a recuperação; backups atualizados são a única garantia. Phishing combina meios técnicos e engenharia social. Na verificação em duas etapas, prefira chave física ou aplicativo; SMS só sem alternativa.", "fonte": "CERT.br – Cartilha: página Ransomware (cartilha.cert.br/ransomware/); Fascículo Autenticação; Livro, cap. Golpes na Internet, seção 2.3 Phishing", "url": "https://cartilha.cert.br/ransomware/", "regra": "Quando a afirmação disser que pagar resgate de ransomware “garante” os dados, marque falso: segundo a Cartilha, só backup atualizado garante.", "passos": [{"t": "1ª: a Cartilha diz que pagar o resgate não garante o acesso aos dados; a única garantia é ter backups atualizados. F."}, {"t": "2ª: é a definição de phishing da Cartilha, com meios técnicos e engenharia social, como mensagens que se passam por uma instituição. V."}, {"t": "3ª: com a verificação em duas etapas ativada, só a senha não basta para entrar na conta. V."}, {"t": "4ª: a opção mais segura é a chave de segurança física, e o SMS só deve ser usado se não houver outra opção. F."}], "resp": "Alternativa B (F, V, V, F)", "pegadinha": "C marca a 4ª como V. A Cartilha aponta a chave física como a mais segura e deixa o SMS para quando não há alternativa.", "porque": {"A": "Essa diz que a 1ª é V, mas pagar o resgate não garante os dados, só backup garante. E a 3ª é V, não F.", "C": "Essa erra a 2ª e a 4ª. A 2ª é a definição de phishing da Cartilha, V. E a chave física é mais segura que SMS.", "D": "Essa diz que a 1ª é V, mas pagar o resgate não garante os dados. E a 2ª é a definição de phishing, então é V.", "E": "Essa erra a 3ª e a 4ª. Com duas etapas, só a senha não basta, então a 3ª é V. E a chave física supera o SMS."}, "sub": "info-seguranca"}, {"id": "inf-07", "materia": "Informática", "tema": "Informática", "enunciado": "Segundo a Cartilha de Segurança para Internet (CERT.br), assinale a alternativa correta sobre certificado digital e assinatura digital.", "alternativas": ["A assinatura digital garante a confidencialidade de um documento, impedindo que terceiros leiam o seu conteúdo.", "A assinatura digital é gerada com a chave pública do autor e verificada com a chave privada dele.", "O certificado digital associa uma chave pública a uma entidade e é emitido por uma Autoridade Certificadora (AC), que também publica a lista dos certificados que deixaram de ser confiáveis.", "Todo certificado autoassinado é malicioso, pois somente uma AC comercial pode emitir certificados legítimos.", "O certificado digital não possui prazo de validade: uma vez emitido, vale até ser revogado."], "correta": 2, "explicacao": "C reproduz a definição da Cartilha: registro eletrônico que distingue uma entidade e a associa a uma chave pública, emitido por uma AC, que publica a Lista de Certificados Revogados (LCR). A está errada: a assinatura digital comprova autenticidade e integridade, não sigilo. B inverte as chaves: assina-se com a chave privada e verifica-se com a pública. D está errada: as ACs raízes têm certificado autoassinado, e há usos legítimos (o uso malicioso também existe). E está errada: a validade (data de emissão e de expiração) é um dos dados do certificado.", "fundamento": "Cartilha (cap. Criptografia): a assinatura digital comprova autenticidade e integridade; é feita com a chave privada e verificada com a pública. O certificado associa uma chave pública a uma entidade, é emitido por uma AC, que mantém a LCR, e traz a validade.", "fonte": "CERT.br – Cartilha de Segurança para Internet (livro), cap. 9 Criptografia, seções 9.3 Assinatura digital e 9.4 Certificado digital", "url": "https://cartilha.cert.br/livro/", "regra": "Quando cair assinatura digital, lembre: ela comprova autenticidade e integridade, não sigilo; assina-se com a chave privada e confere-se com a pública.", "passos": [{"t": "C repete a definição da Cartilha: o certificado liga uma chave pública a uma entidade e é emitido por uma Autoridade Certificadora (AC). A AC publica a Lista de Certificados Revogados (LCR)."}, {"t": "A e B: a assinatura digital comprova autenticidade e integridade, não sigilo. E assina-se com a chave privada e confere-se com a pública."}, {"t": "D e E: as ACs raízes têm certificado autoassinado, então nem todo autoassinado é malicioso. E a validade (emissão e expiração) faz parte do certificado."}], "resp": "Alternativa C", "pegadinha": "B inverte as chaves. O certo é assinar com a chave privada e verificar com a chave pública.", "porque": {"A": "A assinatura digital comprova autenticidade e integridade, não sigilo. Ela não serve para esconder o conteúdo.", "B": "Você inverteu as chaves. Assina-se com a chave privada e confere-se com a chave pública.", "D": "Nem todo autoassinado é malicioso: as ACs raízes têm certificado autoassinado, e há usos legítimos.", "E": "O certificado tem validade, sim: a data de emissão e a de expiração fazem parte dele."}, "sub": "info-seguranca"}, {"id": "inf-08", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha do Excel, as células A1, B1 e C1 contêm, respectivamente, os números 10, 4 e 2. Na célula D1 foi digitada a fórmula =A1+B1*C1^2. O valor exibido em D1 é", "alternativas": ["56", "26", "74", "324", "784"], "correta": 1, "explicacao": "Passo 1: troque as referências pelos números: =10+4*2^2. Passo 2: o Excel faz primeiro a potência: 2^2 = 4. Passo 3: depois a multiplicação: 4*4 = 16. Passo 4: por último a soma: 10+16 = 26. As erradas vêm de fazer as contas fora de ordem: 56 é (10+4)*4; 74 é 10+(4*2)^2; 324 é (10+4*2)^2; 784 é ((10+4)*2)^2.", "fundamento": "Na ordem de precedência do Excel, a exponenciação (^) vem antes da multiplicação e da divisão, que vêm antes da adição e da subtração. Parênteses mudam essa ordem: =5+2*3 dá 11 e =(5+2)*3 dá 21.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "url": "https://support.microsoft.com/pt-br/office/a-ordem-em-que-o-excel-efetua-opera%C3%A7%C3%B5es-em-f%C3%B3rmulas-28eaf0d7-7058-4eff-a8ea-0a835fafadb8", "sub": "info-planilhas", "regra": "Quando a fórmula misturar operações sem parênteses, faça nesta ordem: potência (^), depois multiplicação e divisão, por último soma e subtração.", "passos": [{"t": "Troque as referências pelos números:", "conta": ["=A1+B1*C1^2", "=10+4*2^2"]}, {"t": "Faça as contas na ordem do Excel:", "conta": ["potência: 2^2 = 4", "multiplicação: 4*4 = 16", "soma: 10+16 = 26"]}], "resp": "Alternativa B (26)", "pegadinha": "A (56) vem de somar primeiro: (10+4)*4. Sem parênteses, a soma é a última conta.", "gerador": "formula-conta", "porque": {"A": "Esse 56 vem de somar primeiro, (10+4)*4. Sem parênteses, a soma é a última conta.", "C": "Esse 74 vem de fazer 4*2 antes da potência, 10+8^2. A potência vale só para o C1, então 2^2 = 4.", "D": "Esse 324 vem de fazer 10+4*2 = 18 e elevar tudo ao quadrado. A potência vale só para o 2 do C1.", "E": "Esse 784 vem de fazer as contas da esquerda para a direita, (10+4)*2 = 28 e depois 28^2. O Excel faz a potência primeiro."}}, {"id": "inf-09", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha (Excel ou Google Planilhas), o intervalo A2:A7 contém os setores Clínica, UTI, Emergência, UTI, Clínica, UTI, e o intervalo B2:B7 contém os gastos com material, em reais: 120, 80, 210, 45, 30, 75. As fórmulas =SOMASE(A2:A7;\"UTI\";B2:B7) e =CONT.SE(A2:A7;\"UTI\") retornam, respectivamente,", "alternativas": ["560 e 3", "3 e 200", "150 e 2", "200 e 3", "200 e 6"], "correta": 3, "explicacao": "SOMASE: Passo 1: ache as linhas em que A diz \"UTI\": linhas 3, 5 e 7. Passo 2: some os gastos dessas linhas na coluna B: 80 + 45 + 75 = 200. CONT.SE: conta quantas células de A2:A7 são \"UTI\": 3. Resposta: 200 e 3. As erradas: 560 é a soma de todos os gastos (sem critério); \"3 e 200\" inverte a ordem; 150 e 2 são os números da Clínica; 6 é o total de linhas.", "fundamento": "SOMASE(intervalo; critérios; [intervalo_soma]) soma as células de intervalo_soma cujas linhas atendem ao critério em intervalo. CONT.SE(intervalo; critério) conta as células que atendem ao critério. As duas funções têm o mesmo nome e a mesma ordem de argumentos no Google Planilhas em português.", "fonte": "Microsoft Suporte: Função SOMASE; Ajuda do Editores de Documentos Google: SOMASE e CONT.SE", "url": "https://support.microsoft.com/pt-br/office/somase-fun%C3%A7%C3%A3o-169b8c99-c05c-4483-a712-1697a653039b", "sub": "info-planilhas", "regra": "Quando aparecer SOMASE, ache as linhas que batem com o critério e some só os valores dessas linhas; CONT.SE apenas conta essas linhas.", "passos": [{"t": "Marque as linhas em que a coluna A diz “UTI”:", "grade": {"cols": ["A", "B"], "linhas": [2, 3, 4, 5, 6, 7], "cel": {"A2": "Clínica", "B2": "120", "A3": "UTI", "B3": "80", "A4": "Emergência", "B4": "210", "A5": "UTI", "B5": "45", "A6": "Clínica", "B6": "30", "A7": "UTI", "B7": "75"}, "cor": {"A3": "origem", "B3": "destino", "A5": "origem", "B5": "destino", "A7": "origem", "B7": "destino"}}}, {"t": "SOMASE soma os gastos da coluna B só nessas linhas:", "conta": ["80 + 45 + 75 = 200"]}, {"t": "CONT.SE só conta quantas células são “UTI”:", "conta": ["A3, A5 e A7 = 3"]}], "resp": "Alternativa D (200 e 3)", "pegadinha": "B (3 e 200) tem os números certos na ordem trocada. A primeira fórmula é a SOMASE, então o 200 vem primeiro.", "porque": {"A": "Esse 560 é a soma de todos os gastos. A SOMASE soma só as linhas da UTI, que dão 200.", "B": "Os números estão certos, mas na ordem trocada. A primeira fórmula é a SOMASE, então o 200 vem primeiro.", "C": "Esses 150 e 2 são os números da Clínica. O critério das fórmulas é “UTI”, que dá 200 e 3.", "E": "A SOMASE está certa, mas 6 é o total de linhas. A CONT.SE conta só as células com “UTI”, que são 3."}}, {"id": "inf-10", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre mensagens de erro no Excel.", "itens": ["I – A fórmula =B2/C2 exibe #DIV/0! quando a célula C2 está vazia.", "II – A fórmula =PROCV(\"Pediatria\";A2:B7;2;FALSO) exibe #N/D quando o texto Pediatria não existe na coluna A.", "III – A fórmula =SOMMA(B2:B7), com o nome da função digitado errado, exibe #NOME?."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três estão corretas. I: dividir por zero ou por célula vazia gera #DIV/0!. Como C2 está vazia, =B2/C2 mostra esse erro. II: #N/D quer dizer valor não disponível. A causa mais comum é uma função de procura, como o PROCV, não achar o que foi pedido. III: o Excel não reconhece SOMMA como nome de função, então mostra #NOME?. Dica para decorar: DIV de dividir, N/D de não disponível, NOME de nome errado.", "fundamento": "Segundo o suporte da Microsoft: #DIV/0! aparece quando um número é dividido por zero ou por uma célula vazia; #N/D, quando um valor não está disponível para a função ou fórmula; #NOME?, quando o Excel não reconhece o texto da fórmula.", "fonte": "Microsoft Suporte: Detectar erros de fórmula no Excel; Como corrigir um erro #N/D", "url": "https://support.microsoft.com/pt-br/excel/detect-formula-errors-in-excel", "sub": "info-planilhas", "regra": "Quando a questão for de erro do Excel, ligue o nome ao motivo: #DIV/0! é dividir por zero ou vazio, #N/D é valor não disponível, #NOME? é nome escrito errado.", "passos": [{"t": "I: dividir por zero ou por célula vazia dá #DIV/0!. Como C2 está vazia, está correta."}, {"t": "II: #N/D quer dizer valor não disponível, e aparece quando o PROCV não acha o que foi pedido. Correta."}, {"t": "III: o Excel não reconhece SOMMA como nome de função e mostra #NOME?. Correta."}], "resp": "Alternativa E (I, II e III)", "pegadinha": "D (apenas II e III) atrai quem acha que célula vazia não gera erro. Dividir por célula vazia também dá #DIV/0!.", "porque": {"A": "Essa deixa de fora a II e a III. PROCV que não acha o texto dá #N/D, e nome de função errado dá #NOME?.", "B": "Essa deixa de fora a I e a III. Dividir por célula vazia dá #DIV/0!, e nome de função errado dá #NOME?.", "C": "Essa deixa de fora a III, que está certa: o Excel não reconhece SOMMA e mostra #NOME?.", "D": "Essa deixa de fora a I, mas dividir por célula vazia também dá #DIV/0!."}}, {"id": "inf-11", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre atalhos de teclado no Microsoft Word para Windows, em português, e no Documentos Google, assinale a alternativa correta.", "alternativas": ["No Word em português, Ctrl+B aplica negrito, assim como no Documentos Google.", "Nos dois programas, Ctrl+Z refaz a última ação que foi desfeita.", "No Word em português, Ctrl+N aplica negrito e Ctrl+S aplica sublinhado; no Documentos Google, o negrito é Ctrl+B e o sublinhado é Ctrl+U.", "No Word, Ctrl+X copia o texto selecionado e Ctrl+C o recorta.", "No Documentos Google, Ctrl+I insere um comentário no trecho selecionado."], "correta": 2, "explicacao": "C está certa. O Word em português usa as iniciais em português: N de negrito, I de itálico, S de sublinhado. O Documentos Google usa as iniciais em inglês: B (bold) para negrito e U (underline) para sublinhado. A está errada: no Word em português, Ctrl+B salva o documento. B está errada: Ctrl+Z desfaz; para refazer, o Word usa Ctrl+Y e o Docs usa Ctrl+Shift+Z. D inverteu: Ctrl+C copia e Ctrl+X recorta. E está errada: no Docs, Ctrl+I é itálico; comentário é Ctrl+Alt+M.", "fundamento": "Suporte da Microsoft (Word para Windows, pt-BR): negrito Ctrl+N, itálico Ctrl+I, sublinhado Ctrl+S, salvar Ctrl+B, desfazer Ctrl+Z, refazer Ctrl+Y. Ajuda do Documentos Google: negrito Ctrl+B, itálico Ctrl+I, sublinhado Ctrl+U, refazer Ctrl+Shift+Z, inserir comentário Ctrl+Alt+M.", "fonte": "Microsoft Suporte: Atalhos de teclado no Word; Ajuda do Documentos Google: Atalhos de teclado", "url": "https://support.microsoft.com/pt-br/office/atalhos-de-teclado-no-word-95ef89dd-7142-4b50-afb2-f762f663ceb2", "sub": "info-docs-drive", "regra": "Quando cair atalho de formatação, lembre: o Word em português usa a inicial em português (N, I, S) e o Documentos Google usa a inicial em inglês (B, I, U).", "passos": [{"t": "Word em português: N de negrito, I de itálico, S de sublinhado."}, {"t": "Documentos Google: B de bold (negrito) e U de underline (sublinhado). Por isso C está certa."}, {"t": "A e B: no Word em português, Ctrl+B salva. Ctrl+Z desfaz; para refazer, o Word usa Ctrl+Y e o Docs usa Ctrl+Shift+Z."}, {"t": "D e E: Ctrl+C copia e Ctrl+X recorta. No Docs, Ctrl+I é itálico, e comentário é Ctrl+Alt+M."}], "resp": "Alternativa C", "pegadinha": "A atrai quem pensa no Docs. No Word em português, Ctrl+B salva o documento; o negrito é Ctrl+N.", "porque": {"A": "No Word em português, Ctrl+B salva o documento. O negrito no Word é Ctrl+N.", "B": "Ctrl+Z desfaz, não refaz. Para refazer, o Word usa Ctrl+Y e o Docs usa Ctrl+Shift+Z.", "D": "Essa inverteu os dois. Ctrl+C copia e Ctrl+X recorta.", "E": "No Documentos Google, Ctrl+I é itálico. Comentário é Ctrl+Alt+M."}}, {"id": "inf-12", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre recursos do Documentos Google e do Google Drive, assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) No Documentos Google, é preciso ter permissão de editor para ver o histórico de versões de um arquivo.", "( ) No histórico de versões do Documentos Google, é possível dar um nome a uma versão.", "( ) No Google Drive, os arquivos excluídos ficam na lixeira por 30 dias e depois são excluídos permanentemente.", "( ) No Documentos Google, ao clicar em Resolver em um comentário, ele é apagado e não pode mais ser reaberto."], "alternativas": ["V – V – V – F", "V – F – V – V", "F – V – F – F", "V – V – F – V", "F – F – V – F"], "correta": 0, "explicacao": "1ª V: a Ajuda do Google diz que, sem permissão para editar, não é possível ver o histórico de versões. 2ª V: no histórico, dá para escolher uma versão e usar Nomear esta versão. 3ª V: arquivos excluídos ficam 30 dias na lixeira e depois são apagados de vez. 4ª F: Resolver apenas fecha o comentário. Ele continua na lista de comentários e pode ser reaberto com o botão Reabrir.", "fundamento": "Ajuda do Google: ver o histórico de versões exige permissão de editor, e é possível nomear versões; na lixeira do Drive, os arquivos permanecem por 30 dias antes da exclusão permanente; um comentário resolvido pode ser visto na lista de comentários e reaberto.", "fonte": "Ajuda do Documentos Google: Ver atividade e versões; Ajuda do Google Drive: Excluir e restaurar arquivos; Ajuda do Documentos Google: Usar comentários", "url": "https://support.google.com/docs/answer/190843?hl=pt-BR", "sub": "info-docs-drive", "regra": "Quando aparecer “Resolver” em comentário do Documentos Google, lembre que ele só fecha o comentário, sem apagar.", "passos": [{"t": "1ª: sem permissão para editar, não dá para ver o histórico de versões. V."}, {"t": "2ª: no histórico, dá para escolher uma versão e usar Nomear esta versão. V."}, {"t": "3ª: arquivos excluídos ficam 30 dias na lixeira do Drive e depois são apagados de vez. V."}, {"t": "4ª: Resolver só fecha o comentário. Ele continua na lista e pode ser reaberto com o botão Reabrir, então F."}], "resp": "Alternativa A (V, V, V, F)", "pegadinha": "D marca a 4ª como V. Resolver não apaga o comentário: ele continua na lista e pode ser reaberto.", "porque": {"B": "Essa diz que a 2ª é falsa, mas dá para nomear uma versão. E diz que a 4ª é verdadeira, mas Resolver só fecha o comentário.", "C": "Essa diz que a 1ª e a 3ª são falsas. Mas sem permissão de editor não dá para ver o histórico, e a lixeira guarda por 30 dias.", "D": "Essa diz que a 3ª é falsa, mas a lixeira guarda por 30 dias mesmo. E Resolver não apaga o comentário, ele pode ser reaberto.", "E": "Essa diz que a 1ª e a 2ª são falsas. Mas o histórico exige permissão de editor, e dá para nomear uma versão."}}, {"id": "inf-13", "materia": "Informática", "tema": "Informática", "enunciado": "Uma servidora compartilhou pelo OneDrive (Microsoft 365) a planilha de escala do setor com alguns colegas. De acordo com o suporte da Microsoft, assinale a alternativa correta.", "alternativas": ["Com a permissão Pode exibir, o colega pode alterar o conteúdo da planilha, desde que não a exclua.", "A permissão Pode editar permite exibir e alterar o arquivo.", "A opção Remover acesso exclui a planilha também do OneDrive da proprietária.", "Se um colega recebeu Pode editar por um link e Pode exibir por convite direto, vale sempre a permissão mais restrita.", "O OneDrive só oferece a opção Pode editar; para impedir alterações, é preciso enviar uma cópia por e-mail."], "correta": 1, "explicacao": "B está certa: Pode editar = ver e alterar. A está errada: Pode exibir deixa só ver, sem fazer alterações. C está errada: Remover acesso tira o acesso dos outros e deixa o arquivo privado para os proprietários; não apaga o arquivo. D está errada: o suporte avisa que a pessoa mantém a permissão MAIS ALTA que recebeu por qualquer caminho. Por isso, para tirar a edição, é preciso mudar todas as fontes. E está errada: além de Pode editar, existe Pode exibir.", "fundamento": "Suporte da Microsoft: Pode editar permite exibir e alterar; Pode exibir permite ver sem fazer alterações; Remover acesso torna o item privado para os proprietários; uma pessoa mantém a permissão mais alta que tem por meio de qualquer fonte.", "fonte": "Microsoft Suporte: Compartilhar arquivos e pastas no Microsoft OneDrive", "url": "https://support.microsoft.com/pt-br/onedrive/share-files-and-folders-in-microsoft-onedrive", "sub": "info-docs-drive", "regra": "Quando a mesma pessoa recebe permissões diferentes por caminhos diferentes no OneDrive, vale a mais alta, não a mais restrita.", "passos": [{"t": "B: Pode editar deixa ver e alterar o arquivo. Correta."}, {"t": "A e E: existe a permissão Pode exibir, que deixa só ver, sem fazer alterações."}, {"t": "C: Remover acesso tira o acesso dos outros e deixa o arquivo privado para os proprietários. Não apaga o arquivo."}, {"t": "D: a pessoa fica com a permissão MAIS ALTA que recebeu por qualquer caminho. Para tirar a edição, é preciso mudar todas as fontes."}], "resp": "Alternativa B", "pegadinha": "D diz que vale a permissão mais restrita. É o contrário: vale a mais alta, então quem recebeu Pode editar por link continua editando.", "porque": {"A": "Pode exibir deixa só ver, sem fazer nenhuma alteração.", "C": "Remover acesso tira o acesso dos outros e deixa o arquivo só para os proprietários. Não apaga a planilha.", "D": "É o contrário. A pessoa fica com a permissão mais alta que recebeu por qualquer caminho, então continua editando.", "E": "Além de Pode editar, existe Pode exibir, que deixa só ver. Não precisa mandar cópia por e-mail."}}, {"id": "inf-14", "materia": "Informática", "tema": "Informática", "enunciado": "Associe cada tipo de código malicioso (coluna da esquerda) à sua descrição (coluna da direita), de acordo com a Cartilha de Segurança para Internet (CERT.br).\n(1) Vírus\n(2) Worm\n(3) Cavalo de troia\n(4) Spyware\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Propaga-se
