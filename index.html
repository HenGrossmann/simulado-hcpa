rtuguês", "tema": "Português", "enunciado": "Se o nome próprio Marie Skłodowska-Curie (l. 37-38) fosse substituído por as irmãs Skłodowska-Curie, quantas outras palavras na frase deveriam sofrer ajustes para fins de concordância verbal ou nominal?", "alternativas": ["Três.", "Quatro.", "Cinco.", "Seis.", "Sete."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 5", "url": "provas/p2021-03-ps22.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t1"}, {"id": "p2021-03-ps22-q06", "banca": "p2021-03-ps22", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta palavras que contenham prefixos em sua formação morfológica.", "alternativas": ["encostado (l. 02) – novamente (l. 07) – escandalizavam (l. 20).", "floreiras (l. 04) – lápis-cera (l. 11) – descrever (l. 25).", "interminável (l. 13) – indiferentes (l. 19) – desabafar (l. 24).", "decidiu (l. 22) – subiu (l. 27) – fechou (l. 31).", "estacavam (l. 20) – especialmente (l. 29) – emagrecendo (l. 36)."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 6", "url": "provas/p2021-03-ps22.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t2"}, {"id": "p2021-03-ps22-q07", "banca": "p2021-03-ps22", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – V – F.", "V – F – V.", "V – F – F.", "F – F – V.", "F – F – F."], "correta": 4, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 7", "url": "provas/p2021-03-ps22.pdf#page=5", "itens": ["(  ) O sujeito da forma verbal foi (l. 07) é o porteiro (l. 01-02).", "(  ) O objeto direto da forma verbal sairiam (l. 11) é os dois (l. 11).", "(  ) O sujeito da forma verbal Fez (l. 37) é Mariana (l. 32)."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t2"}, {"id": "p2021-03-ps22-q08", "banca": "p2021-03-ps22", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta a versão gramaticalmente correta do trecho é o rapaz mais estranho que encontrei em toda a minha vida (l. 41-42), se a forma verbal encontrei fosse substituída por gostei.", "alternativas": ["é o rapaz mais estranho que gostei em toda a minha vida.", "é o rapaz mais estranho de que gostei em toda a minha vida.", "é o rapaz mais estranho o qual gostei em toda a minha vida.", "é o rapaz mais estranho que já gostei em toda a minha vida.", "é o rapaz mais estranho cujo gostei em toda a minha vida."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 8", "url": "provas/p2021-03-ps22.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t2"}, {"id": "p2021-03-ps22-q09", "banca": "p2021-03-ps22", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém uma oração subordinada que desempenha a função sintática de objeto direto no texto.", "alternativas": ["que passavam (l. 03).", "que apanhava qualquer coisa no chão (l. 05-06).", "que andavam pela rua (l. 18).", "que estacavam (l. 20).", "que a minha filha está emagrecendo (l. 35-36)."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 9", "url": "provas/p2021-03-ps22.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t2"}, {"id": "p2021-03-ps22-q10", "banca": "p2021-03-ps22", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta somente substantivos retirados do texto.", "alternativas": ["floreiras (l. 04) – volta (l. 14) – coisa (l. 16)", "manobra (l. 08) – tarde (l. 12) – tudo (l. 25)", "aparecer (l. 09) – desabafar (l. 24) – marcar (l. 31)", "dois (l. 11) – telefona (l. 38) – Surpresa (l. 38)", "colega (l. 23) – que (l. 28) seda (l. 32)"], "correta": 0, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 10", "url": "provas/p2021-03-ps22.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t2"}, {"id": "p2021-03-ps22-q11", "banca": "p2021-03-ps22", "num": 11, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "De acordo com o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, fazem parte dos principais deveres do servidor as prerrogativas abaixo apresentadas, EXCETO uma delas. Assinale-a.", "alternativas": ["Ter consciência de que seu trabalho é regido por princípios éticos que se materializam na adequada prestação dos serviços públicos.", "Participar dos movimentos e estudos que se relacionem com a melhoria do exercício de suas funções, tendo por escopo a realização do bem comum.", "Usar de artifícios para procrastinar ou dificultar o exercício regular de direito por qualquer pessoa, causando-lhe dano moral ou material.", "Manter-se atualizado com as instruções, as normas de serviço e a legislação pertinentes ao órgão onde exerce suas funções.", "Ser assíduo e frequente ao serviço, na certeza de que sua ausência provoca danos ao trabalho ordenado, refletindo negativamente em todo o sistema."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 11", "url": "provas/p2021-03-ps22.pdf#page=5"}, {"id": "p2021-03-ps22-q12", "banca": "p2021-03-ps22", "num": 12, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Em conformidade com o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, assinale as afirmações abaixo com V (verdadeiro) ou F (falso).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – V – V.", "V – V – F.", "F – F – F.", "V – F – V.", "F – V – V."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 12", "url": "provas/p2021-03-ps22.pdf#page=5", "itens": ["(  ) É vedado ao servidor público usar de artifícios para procrastinar ou dificultar o exercício regular de direito por qualquer pessoa, causando-lhe dano moral ou material.", "(  ) É vedado ao servidor público deixar de utilizar os avanços técnicos e científicos ao seu alcance ou do seu conhecimento para atendimento do seu mister.", "(  ) É vedado ao servidor público atender com cortesia qualquer pessoa que necessite do atendimento em serviços públicos."]}, {"id": "p2021-03-ps22-q13", "banca": "p2021-03-ps22", "num": 13, "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "“É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde, à alimentação, à educação, ao esporte, ao lazer, à profissionalização, à cultura, à dignidade, ao respeito, à liberdade e à convivência familiar e comunitária.” (Estatuto da Criança e do Adolescente, 1990). Com relação a esse tema, considere os itens abaixo.\n\nQuais, segundo a Lei nº 8.069/90 – ECA, compreendem a garantia de prioridade dos direitos acima mencionados?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 13", "url": "provas/p2021-03-ps22.pdf#page=6", "itens": ["I - Primazia de receber proteção e socorro em quaisquer circunstâncias.", "II - Preterição de atendimento nos serviços públicos ou de relevância pública.", "III - Destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude."]}, {"id": "p2021-03-ps22-q14", "banca": "p2021-03-ps22", "num": 14, "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Quanto ao direito à educação das crianças e adolescentes, o Estatuto da Criança e do Adolescente – ECA (Lei nº 8.069/90) destinou o capítulo IV, artigos 53 a 59, à educação, cultura, esporte e lazer.\nCom relação a esse tema, considere os itens abaixo.\n\nQuais são pressupostos estabelecidos pelo ECA?", "alternativas": ["Apenas II.", "Apenas I e II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 4, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 14", "url": "provas/p2021-03-ps22.pdf#page=6", "itens": ["I - O dever do Estado de assegurar atendimento em creche e pré-escola às crianças de zero a cinco anos de idade.", "II - O direito da criança de ser respeitada por seus educadores.", "III - O direito dos pais ou responsáveis de ter ciência do processo pedagógico, bem como de participar da definição das propostas educacionais."]}, {"id": "p2021-03-ps22-q15", "banca": "p2021-03-ps22", "num": 15, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Considere o disposto pela Lei nº 8.080, de 19 de setembro de 1990, acerca dos propósitos do Sistema Único de Saúde (SUS).\nSão objetivos do SUS:\nA identificação e divulgação dos fatores condicionantes e determinantes da ____________.\nA formulação de _____________ de saúde destinadas a promover, nos campos ________________ e social, a observância do disposto no § 1º do art. 2º desta lei.\nA assistência às pessoas por intermédio de ações de _______________, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades _______________.\nAssinale a alternativa que completa, correta e respectivamente, as lacunas do texto acima.", "alternativas": ["saúde – políticas – econômico – promoção – preventivas", "saúde – regras – cultural – promoção – preventivas", "lei – políticas – cultural – declínio – negligenciadas", "saúde – políticas – econômico – declínio – preventivas", "lei – regras – cultural – promoção – negligenciadas"], "correta": 0, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 15", "url": "provas/p2021-03-ps22.pdf#page=6"}, {"id": "p2021-03-ps22-q16", "banca": "p2021-03-ps22", "num": 16, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale a alternativa que NÃO faz parte das diretrizes e princípios do Sistema Único de Saúde.", "alternativas": ["Universalidade de acesso aos serviços de saúde em todos os níveis de assistência.", "Igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "Centralização política, com direção única em cada esfera de governo.", "Integração em nível executivo das ações de saúde, meio ambiente e saneamento básico.", "Participação da comunidade."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 16", "url": "provas/p2021-03-ps22.pdf#page=6"}, {"id": "p2021-03-ps22-q17", "banca": "p2021-03-ps22", "num": 17, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Sobre a Norma Regulamentadora n° 32 (NR-32), assinale a afirmação INCORRETA.", "alternativas": ["É uma legislação do Ministério do Trabalho e Emprego que estabelece medidas para proteger a segurança e a saúde dos trabalhadores de saúde, em qualquer serviço de saúde, inclusive os que trabalham nas escolas, ensinando ou pesquisando.", "Atinge apenas os empregados próprios do serviço de saúde, excluindo os empregados das empresas terceirizadas, cooperativas e prestadoras de serviço.", "A definição de serviço de saúde incorpora o conceito de edificação. Deste modo, todos os trabalhadores que exerçam atividades nestas edificações, relacionadas ou não com a promoção e assistência à saúde, são abrangidos pela norma, como, por exemplo, atividade de limpeza, lavanderia, reforma e manutenção.", "Dispõe que a responsabilidade quanto ao seu cumprimento é solidária, ou seja, compartilhada entre contratantes e contratados.", "Tem como finalidade instituir as diretrizes básicas para a implementação de medidas de proteção à segurança e à saúde dos trabalhadores dos serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 17", "url": "provas/p2021-03-ps22.pdf#page=7"}, {"id": "p2021-06-ps43-q01", "banca": "p2021-06-ps43", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche adequadamente as lacunas das linhas 03, 20, 32 e 48, nesta ordem.", "alternativas": ["as – as – à – às", "as – às – a – às", "as – às – à – as", "às – as – a – as", "às – às – a – às"], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 1", "url": "provas/p2021-06-ps43.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t1"}, {"id": "p2021-06-ps43-q02", "banca": "p2021-06-ps43", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 2", "url": "provas/p2021-06-ps43.pdf#page=3", "itens": ["I - Trata-se de um texto no qual o autor relata lembranças que atestam o grande conhecimento etimológico de seus familiares.", "II - Trata-se de um texto no qual o autor relata lembranças que atestam o despertar de seu interesse pela etimologia.", "III - Trata-se de um texto no qual o autor relata a insuficiência do conhecimento etimológico de seus amigos e familiares."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t1"}, {"id": "p2021-06-ps43-q03", "banca": "p2021-06-ps43", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém a afirmação correta acerca do uso de verbos no texto.", "alternativas": ["tínhamos (l. 04) está flexionado no tempo do pretérito imperfeito e no modo subjuntivo.", "vieram (l. 19) está flexionado no tempo do futuro do pretérito e no modo indicativo.", "leem (l. 27) está flexionado no tempo do presente e no modo indicativo.", "era (l. 42) está flexionado no tempo do pretérito e no modo subjuntivo.", "escoava (l. 55) está flexionado no tempo do pretérito e no modo subjuntivo."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 3", "url": "provas/p2021-06-ps43.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t1"}, {"id": "p2021-06-ps43-q04", "banca": "p2021-06-ps43", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Considere as afirmações abaixo, sobre a pontuação no texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 4", "url": "provas/p2021-06-ps43.pdf#page=4", "itens": ["I - O travessão da linha 17 poderia ser substituído por ponto e vírgula.", "II - Os dois-pontos da linha 35 poderiam ser substituídos por ponto final, feito o devido ajuste relativo ao uso de maiúscula.", "III - O ponto e vírgula da linha 47 poderia ser substituído por ponto final, feito o devido ajuste relativo ao uso de maiúscula."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t1"}, {"id": "p2021-06-ps43-q05", "banca": "p2021-06-ps43", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Sobre as palavras todos (l. 27), os (l. 27) e muitas (l. 32) é correto afirmar que, no contexto em que ocorrem, são todas", "alternativas": ["advérbios.", "adjetivos.", "substantivos.", "preposições.", "pronomes."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 5", "url": "provas/p2021-06-ps43.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t1"}, {"id": "p2021-06-ps43-q06", "banca": "p2021-06-ps43", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche adequadamente as lacunas das linhas 06, 21, 29 e 40, nesta ordem.", "alternativas": ["por que – quê – exencial – por que", "porquê – que – excensial – porque", "porque – que – essencial – porque", "porque – quê – essencial – por que", "por que – que – excensial – porquê"], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 6", "url": "provas/p2021-06-ps43.pdf#page=4", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t2"}, {"id": "p2021-06-ps43-q07", "banca": "p2021-06-ps43", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 7", "url": "provas/p2021-06-ps43.pdf#page=5", "itens": ["I - O autor estabelece diferenças entre o que é de ordem natural no ser humano e o que é de ordem adquirida.", "II - O autor do texto explica que o talento é uma habilidade rara, exceto para artistas e atletas.", "III - O autor do texto estabelece sua visão acerca do que é necessário aprender para escrever bem."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t2"}, {"id": "p2021-06-ps43-q08", "banca": "p2021-06-ps43", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre palavras do texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 8", "url": "provas/p2021-06-ps43.pdf#page=5", "itens": ["I - crônica (l. 02) tem valor adjetivo no contexto em que ocorre.", "II - primeiríssimo (l. 30) tem valor adverbial no contexto em que ocorre.", "III - outro (l. 42) tem valor pronominal no contexto em que ocorre."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t2"}, {"id": "p2021-06-ps43-q09", "banca": "p2021-06-ps43", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "A alternativa que apresenta o sentido mais adequado para suposto (l. 11), de acordo com o texto, é", "alternativas": ["natural.", "hipotético.", "real.", "verdadeiro.", "sonhado."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 9", "url": "provas/p2021-06-ps43.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t2"}, {"id": "p2021-06-ps43-q10", "banca": "p2021-06-ps43", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "A conjunção E (l. 23) introduz, no período em que ocorre, uma ideia de", "alternativas": ["adição.", "causa.", "comparação.", "explicação.", "consecução."], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 10", "url": "provas/p2021-06-ps43.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps43:t2"}, {"id": "p2021-06-ps43-q13", "banca": "p2021-06-ps43", "num": 13, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Em relação ao Sistema Único de Saúde (SUS), considere os objetivos abaixo.\n\nQuais são objetivos do SUS?", "alternativas": ["Apenas III.", "Apenas I, II e III.", "Apenas I, II e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 13", "url": "provas/p2021-06-ps43.pdf#page=6", "itens": ["I - Identificação e divulgação dos fatores condicionantes e determinantes da saúde.", "II - Formulação de política de saúde destinada à promoção de saúde, nos campos econômico e social.", "III - Assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas.", "IV - Fiscalização e inspeção de alimentos, água e bebidas para consumo humano e animal, preservando os padrões mínimos de higiene e modo de conservação."]}, {"id": "p2021-06-ps43-q14", "banca": "p2021-06-ps43", "num": 14, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "As ações e serviços públicos de saúde e os serviços privados contratados ou conveniados que integram o Sistema Único de Saúde (SUS) são desenvolvidos de acordo com as diretrizes previstas na Lei nº 8.080/1990, na Portaria nº 1.559/2008 e na Constituição Federal de 1988, obedecendo a determinados princípios.\nSobre essas diretrizes, considere os itens abaixo.\n\nQuais NÃO são diretrizes do SUS, de acordo com as citadas normas legais?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas III e IV.", "Apenas I, III e IV."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 14", "url": "provas/p2021-06-ps43.pdf#page=6", "itens": ["I - Integração em nível executivo das ações de saúde, meio ambiente e saneamento básico.", "II - Conjugação dos recursos financeiros, tecnológicos, materiais e humanos da União, dos Estados, do Distrito Federal, dos Municípios, das Organizações Não Governamentais e das Cooperativas de Saúde na prestação de serviços de assistência à saúde da população.", "III - Capacidade de resolução dos serviços em todos os níveis de assistência.", "IV - Organização dos serviços públicos de modo a evitar duplicidade de meios para fins idênticos."]}, {"id": "p2021-06-ps43-q15", "banca": "p2021-06-ps43", "num": 15, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Em consonância ao Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, é correto afirmar que:", "alternativas": ["o servidor público pode vir a prejudicar deliberadamente a reputação de outros servidores ou de cidadãos que deles dependam com o escopo de favorecimento, para si ou para outrem, atendendo o espírito de solidariedade para com o todo.", "o servidor público pode ser conivente em função de seu espírito de solidariedade, conivente com erro ou infração a este Código de Ética ou ao Código de Ética de sua profissão.", "o servidor público não pode fazer o uso do cargo ou função, facilidades, amizades, tempo, posição e influências, para obter qualquer favorecimento, para si ou para outrem.", "o servidor público pode usar de artifícios para procrastinar ou dificultar o exercício regular de direito por qualquer pessoa, inclusive causando-lhe dano moral ou material atendendo o espírito de solidariedade para com o todo.", "o servidor público pode deixar de utilizar os avanços técnicos e científicos ao seu alcance ou do seu conhecimento para atendimento do seu mister."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 15", "url": "provas/p2021-06-ps43.pdf#page=6"}, {"id": "p2021-06-ps43-q16", "banca": "p2021-06-ps43", "num": 16, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre as comissões de ética previstas expressamente no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, é INCORRETO afirmar que:", "alternativas": ["em todos os órgãos e entidades da Administração Pública Federal direta, indireta autárquica e fundacional, ou em qualquer órgão ou entidade que exerça atribuições delegadas pelo poder público, deverá ser criada uma Comissão de Ética, encarregada de orientar e aconselhar sobre a ética profissional do servidor, no tratamento com as pessoas e com o patrimônio público, competindo-lhe conhecer concretamente de imputação ou de procedimento susceptível de censura.", "à Comissão de Ética incumbe fornecer, aos organismos encarregados da execução do quadro de carreira dos servidores, os registros sobre sua conduta ética, para o efeito de instruir e fundamentar promoções e para todos os demais procedimentos próprios da carreira do servidor público.", "a pena aplicável ao servidor público pela Comissão de Ética é a de censura, e sua fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.", "para fins de apuração do comprometimento ético, entende-se por servidor público todo aquele que, por força de lei, contrato ou de qualquer ato jurídico, preste serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira, desde que ligado direta ou indiretamente a qualquer órgão do poder estatal, como as autarquias, as fundações públicas, as entidades paraestatais, as empresas públicas e as sociedades de economia mista, ou em qualquer setor onde prevaleça o interesse do Estado.", "cada Comissão de Ética, que é integrada por três servidores públicos e respectivos suplentes, poderá instaurar, de ofício, processo sobre ato, fato ou conduta que considerar passível de infringência a princípio ou norma ético-profissional, podendo ainda conhecer de consultas, denúncias ou representações formuladas contra o servidor público, a repartição ou o setor em que haja ocorrido a falta, cuja análise e deliberação forem recomendáveis para atender ou resguardar o exercício do cargo ou função pública, desde que formuladas por autoridade, servidor, jurisdicionados administrativos, qualquer cidadão que se identifique ou quaisquer entidades associativas regularmente constituídas."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 16", "url": "provas/p2021-06-ps43.pdf#page=7"}, {"id": "p2021-06-ps43-q28", "banca": "p2021-06-ps43", "num": 28, "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "A disciplina de proteção de dados pessoais, no artigo 2º da Lei nº 13.709/2018, tem como fundamentos estabelecidos, todos os abaixo listados, EXCETO um deles. Assinale-o.", "alternativas": ["A inviolabilidade da intimidade, da honra e da imagem.", "A livre iniciativa, a livre concorrência e a defesa do consumidor.", "A liberdade de expressão, de informação, de comunicação e de opinião.", "A segurança privada dos dados.", "A autodeterminação informativa."], "correta": 3, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 28", "url": "provas/p2021-06-ps43.pdf#page=9"}, {"id": "p2021-06-ps43-q29", "banca": "p2021-06-ps43", "num": 29, "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "A Política Nacional de Humanização (PNH), segundo o documento Cadernos HumanizaSUS de 2010, do Ministério da Saúde, possui como princípios", "alternativas": ["a supremacia do cuidado, a prática humanizadora e a saúde física e mental.", "a eficiência do serviço de saúde, a humanização e o tratamento igualitário.", "a indissociabilidade entre gestão e cuidado, a transversalidade e o fomento do protagonismo das pessoas.", "a inclusividade, o cuidado humanizador e a atenção com as pessoas.", "a eficácia da gestão, o bom tratamento humano e a assistência cuidadosa."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 29", "url": "provas/p2021-06-ps43.pdf#page=10"}, {"id": "p2021-06-ps43-q33", "banca": "p2021-06-ps43", "num": 33, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Compete à direção nacional do Sistema Único da Saúde (SUS), a partir do disposto no artigo 16 da Lei nº 8.080/1990, EXCETO:", "alternativas": ["promover a descentralização para as Unidades Federadas e para os Municípios, dos serviços e ações de saúde, respectivamente, de abrangência estadual e municipal.", "normatizar e coordenar nacionalmente o Sistema Nacional de Sangue, Componentes e Derivados.", "prestar apoio técnico e financeiro aos Municípios e executar supletivamente ações e serviços de saúde.", "acompanhar, controlar e avaliar as ações e os serviços de saúde, respeitadas as competências estaduais e municipais.", "elaborar o Planejamento Estratégico Nacional no âmbito do SUS, em cooperação técnica com os Estados, Municípios e Distrito Federal."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 33", "url": "provas/p2021-06-ps43.pdf#page=10"}, {"id": "p2021-06-ps43-q34", "banca": "p2021-06-ps43", "num": 34, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O processo de planejamento e orçamento do Sistema Único da Saúde (SUS), a partir da literalidade do disposto no artigo 36 da Lei nº 8.080/1990, será", "alternativas": ["ascendente, do nível local até o federal, ouvidos seus órgãos deliberativos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de recursos em planos de saúde dos Municípios, dos Estados, do Distrito Federal e da União.", "ascendente, do nível local até o federal, ouvidos seus órgãos consultivos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de orçamentos em planos de saúde dos Municípios, dos Estados, do Distrito Federal e da União.", "descendente, do nível federal até o local, ouvidos seus órgãos deliberativos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de recursos em planos de saúde dos Municípios, dos Estados, do Distrito Federal e da União.", "descendente, do nível federal até o local, ouvidos seus órgãos consultivos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de orçamentos em planos de saúde dos Municípios, dos Estados, do Distrito Federal e da União.", "descendente, do nível federal até o local, ouvidos seus órgãos consultivos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de recursos previamente aprovados em planos de saúde dos Municípios, dos Estados, do Distrito Federal e da União."], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria Administrativa) (FAURGS), questão 34", "url": "provas/p2021-06-ps43.pdf#page=11"}, {"id": "p2021-06-ps44-q01", "banca": "p2021-06-ps44", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche adequadamente as lacunas das linhas 03, 20, 32 e 48, nesta ordem.", "alternativas": ["as – as – à – às", "as – às – a – às", "as – às – à – as", "às – as – a – as", "às – às – a – às"], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 1", "url": "provas/p2021-06-ps44.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps44:t1"}, {"id": "p2021-06-ps44-q02", "banca": "p2021-06-ps44", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 2", "url": "provas/p2021-06-ps44.pdf#page=3", "itens": ["I - Trata-se de um texto no qual o autor relata lembranças que atestam o grande conhecimento etimológico de seus familiares.", "II - Trata-se de um texto no qual o autor relata lembranças que atestam o despertar de seu interesse pela etimologia.", "III - Trata-se de um texto no qual o autor relata a insuficiência do conhecimento etimológico de seus amigos e familiares."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps44:t1"}, {"id": "p2021-06-ps44-q03", "banca": "p2021-06-ps44", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém a afirmação correta acerca do uso de verbos no texto.", "alternativas": ["tínhamos (l. 04) está flexionado no tempo do pretérito imperfeito e no modo subjuntivo.", "vieram (l. 19) está flexionado no tempo do futuro do pretérito e no modo indicativo.", "leem (l. 27) está flexionado no tempo do presente e no modo indicativo.", "era (l. 42) está flexionado no tempo do pretérito e no modo subjuntivo.", "escoava (l. 55) está flexionado no tempo do pretérito e no modo subjuntivo."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 3", "url": "provas/p2021-06-ps44.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps44:t1"}, {"id": "p2021-06-ps44-q04", "banca": "p2021-06-ps44", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Considere as afirmações abaixo, sobre a pontuação no texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 4", "url": "provas/p2021-06-ps44.pdf#page=4", "itens": ["I - O travessão da linha 17 poderia ser substituído por ponto e vírgula.", "II - Os dois-pontos da linha 35 poderiam ser substituídos por ponto final, feito o devido ajuste relativo ao uso de maiúscula.", "III - O ponto e vírgula da linha 47 poderia ser substituído por ponto final, feito o devido ajuste relativo ao uso de maiúscula."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps44:t1"}, {"id": "p2021-06-ps44-q05", "banca": "p2021-06-ps44", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Sobre as palavras todos (l. 27), os (l. 27) e muitas (l. 32) é correto afirmar que, no contexto em que ocorrem, são todas", "alternativas": ["advérbios.", "adjetivos.", "substantivos.", "preposições.", "pronomes."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 5", "url": "provas/p2021-06-ps44.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-06-ps44:t1"}, {"id": "p2021-06-ps44-q06", "banca": "p2021-06-ps44", "num": 6, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 6", "url": "provas/p2021-06-ps44.pdf#page=4", "itens": ["I - Multiplicar um valor positivo por 3 corresponde a aumentar esse valor em 200%.", "II - Aumentos sucessivos e acumulados de 20% e 30% correspondem a um único aumento de 50%.", "III - Descontos sucessivos e acumulados de 20% e 30% correspondem a um único desconto de 50%."]}, {"id": "p2021-06-ps44-q11", "banca": "p2021-06-ps44", "num": 11, "materia": "Informática", "tema": "Informática", "enunciado": "Considere a planilha Excel a seguir, que contém dados de produtos adquiridos numa última compra e dos quais se deseja fazer uma nova aquisição.\n\nPara a próxima aquisição deseja-se aumentar em 12% as quantidades da última compra. Entretanto, esses produtos só são vendidos em caixas com 10 unidades cada. Na coluna C tem-se a quantidade já com o adicional de 12%, porém com resultado fracionário. Para que a quantidade a comprar seja um número inteiro e múltiplo de 10, digita-se na célula D3 a fórmula (que depois foi copiada para as demais linhas):", "alternativas": ["=INT(C3/10)", "=TRUNCAR(C3;-1)", "=TRUNCAR(C3;1)", "=ARRED(C3;-1)", "=ARRED(C3;1)"], "correta": 3, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 11", "url": "provas/p2021-06-ps44.pdf#page=5", "figura": "provas/fig/p2021-06-ps44-q11.png"}, {"id": "p2021-06-ps44-q12", "banca": "p2021-06-ps44", "num": 12, "materia": "Informática", "tema": "Informática", "enunciado": "Considere a planilha Excel a seguir, que contém dados de cotação de preços de produtos importados em Dólar.\n\nÉ preciso se ter a cotação desses produtos em Reais, a partir da cotação do Dólar do dia, que está na célula B8. A fórmula digitada na célula C3, para obter o valor em Reais na linha 3 e nas demais (4 a 6), e copiada para as demais linhas, é:", "alternativas": ["=B3*B8", "=B$3*B$8", "=B$3*B8", "=B3*$B8", "=B3*B$8"], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 12", "url": "provas/p2021-06-ps44.pdf#page=5", "figura": "provas/fig/p2021-06-ps44-q12.png"}, {"id": "p2021-06-ps44-q13", "banca": "p2021-06-ps44", "num": 13, "materia": "Informática", "tema": "Informática", "enunciado": "Considere a planilha a seguir, que contém dados sobre o tempo de atendimento de pacientes, coletado em minutos.\n\nDeseja-se obter o tempo de atendimento em horas e minutos, em valores inteiros, a partir do total de minutos que está na coluna B. As fórmulas a serem digitadas nas células C3 e D3, para se obter o tempo em horas e minutos (que depois devem ser copiadas para as demais linhas), devem ser, respectivamente:", "alternativas": ["=INT(B3;60) e =MOD(B3;60)", "=INT(B3/60) e =MOD(B3;60)", "=INT(B3/60) e =MOD(B3/60)", "=MOD(B3;60) e =INT(B3;60)", "=MOD(B3/60) e =INT(B3;60)"], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 13", "url": "provas/p2021-06-ps44.pdf#page=5", "figura": "provas/fig/p2021-06-ps44-q13.png"}, {"id": "p2021-06-ps44-q14", "banca": "p2021-06-ps44", "num": 14, "materia": "Informática", "tema": "Informática", "enunciado": "As fórmulas digitadas nas células E13 e E14, para calcular a média dos totais do pedido das cotações apresentadas (célula E13), objetivando o mínimo de gasto e o Total do Pedido de menor custo total (célula E14), são, respectivamente:", "alternativas": ["=MÉDIA(E4:E11) e =MÍNIMO(E4:E11)", "=MÉDIA(E4:E11) e =MENOR(E4:E11)", "=MÉDIA(E4;E11) e =MÍNIMO(E4;E11)", "=SOMA(E4:E11)/CONT(E4:E11) e =MENOR(E4:E11)", "=SOMA(E4:E11)/8 e =MÍNIMO(E4:E11)"], "correta": 0, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 14", "url": "provas/p2021-06-ps44.pdf#page=6", "instrucao": "Para responder às questões 14 e 15, considere a planilha Excel a seguir, que contém dados sobre cotações de produtos de fornecedores (um fornecedor não apresentou cotações). Para obter a coluna do Total do Pedido, considerou-se que em B1 tem-se o número de unidades de cada produto. Na linha 4 a fórmula digitada em E4 é =B$1*SOMA(B4:D4)", "figura": "provas/fig/p2021-06-ps44-q14.png"}, {"id": "p2021-06-ps44-q15", "banca": "p2021-06-ps44", "num": 15, "materia": "Informática", "tema": "Informática", "enunciado": "Na célula A16 foi digitada a fórmula =PROCV(\"Fornecedor 6\";A4:E11;3). Qual o resultado obtido quando a fórmula for executada pelo Excel?", "alternativas": ["Fornecedor 6", "12,10", "83,88", "65,70", "16.168,00"], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 15", "url": "provas/p2021-06-ps44.pdf#page=6", "instrucao": "Para responder às questões 14 e 15, considere a planilha Excel a seguir, que contém dados sobre cotações de produtos de fornecedores (um fornecedor não apresentou cotações). Para obter a coluna do Total do Pedido, considerou-se que em B1 tem-se o número de unidades de cada produto. Na linha 4 a fórmula digitada em E4 é =B$1*SOMA(B4:D4)", "figura": "provas/fig/p2021-06-ps44-q15.png"}, {"id": "p2021-06-ps44-q22", "banca": "p2021-06-ps44", "num": 22, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Na seção I, do Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, faz-se referência a regras associadas a dignidade, decoro, zelo, eficácia e consciência dos princípios morais, que são primados maiores que devem nortear o servidor público, seja no exercício do cargo ou função, seja fora dele, já que refletirá o exercício da vocação do próprio poder estatal. Atos, comportamentos e atitudes serão direcionados para a preservação da honra e da tradição dos serviços públicos. Tais regras são denominadas:", "alternativas": ["Regras Escatológicas.", "Regras Deontológicas.", "Regras de Ordem Administrativa.", "Regras Processuais.", "Regras Permissivas."], "correta": 1, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 22", "url": "provas/p2021-06-ps44.pdf#page=8"}, {"id": "p2021-06-ps44-q23", "banca": "p2021-06-ps44", "num": 23, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Assinale as afirmações abaixo com V (verdadeiro) ou F (falso), de acordo com as regras impostas pelo Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é:", "alternativas": ["F – V – V – V.", "V – F – F – V.", "V – V – F – F.", "V – V – V – V.", "F – F – F – F."], "correta": 3, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 23", "url": "provas/p2021-06-ps44.pdf#page=8", "itens": ["( ) Salvo os casos de segurança nacional, investigações policiais ou interesse superior do Estado e da Administração Pública, a serem preservados em processo previamente declarado sigiloso, nos termos da lei, a publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade, ensejando sua omissão comprometimento ético contra o bem comum, imputável a quem a negar.", "( ) Toda pessoa tem direito à verdade. O servidor não pode omiti-la ou falseá-la, ainda que contrária aos interesses da própria pessoa interessada ou da Administração Pública. Nenhum Estado pode crescer ou estabilizar-se sobre o poder corruptivo do hábito do erro, da opressão ou da mentira, que sempre aniquilam, até mesmo, a dignidade humana, quanto mais a de uma Nação.", "( ) A cortesia, a boa vontade, o cuidado e o tempo dedicados ao serviço público caracterizam o esforço pela disciplina. Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral. Da mesma forma, causar dano a qualquer bem pertencente ao patrimônio público, deteriorando-o, por descuido ou má vontade, não constitui apenas uma ofensa ao equipamento e às instalações ou ao Estado, mas a todos os homens de boa vontade que dedicaram sua inteligência, seu tempo, suas esperanças e seus esforços para construí-los.", "( ) Deixar o servidor público qualquer pessoa à espera de solução que compete ao setor em que exerça suas funções, permitindo a formação de longas filas, ou qualquer outra espécie de atraso na prestação do serviço, não caracteriza apenas atitude contra a ética ou ato de desumanidade, mas, principalmente, grave dano moral aos usuários dos serviços públicos."]}, {"id": "p2021-06-ps44-q28", "banca": "p2021-06-ps44", "num": 28, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "A saúde, segundo prevê expressamente o artigo 2º da Lei nº 8.080/1990, é um direito", "alternativas": ["difuso de todos.", "social de todos.", "coletivo de todos.", "individual do ser humano.", "fundamental do ser humano."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 28", "url": "provas/p2021-06-ps44.pdf#page=10"}, {"id": "p2021-06-ps44-q32", "banca": "p2021-06-ps44", "num": 32, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "As ações e serviços públicos de saúde e os serviços privados contratados ou conveniados que integram o Sistema Único de Saúde (SUS) são desenvolvidos de acordo com as diretrizes previstas no art. 198 da Constituição Federal, obedecendo, ainda, aos seguintes princípios, como prevê expressamente o artigo 7º da Lei nº 8.080/1990, EXCETO:", "alternativas": ["universalidade de acesso aos serviços de saúde em todos os níveis de assistência.", "preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "direito à informação, às pessoas assistidas, sobre sua saúde.", "assistência terapêutica integral, inclusive farmacêutica."], "correta": 4, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 32", "url": "provas/p2021-06-ps44.pdf#page=10"}, {"id": "p2021-06-ps44-q39", "banca": "p2021-06-ps44", "num": 39, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "O Programa de Prevenção de Riscos Ambientais (PPRA), previsto na Norma Regulamentar nº 32 (NR-32), que trata de Segurança e Saúde no Trabalho em Serviços de Saúde, deve ser reavaliado, em condições normais, uma vez ao", "alternativas": ["trimestre.", "semestre.", "ano.", "biênio.", "triênio."], "correta": 2, "fonte": "Prova de 2021 · Analista I (Coordenadoria de Suprimentos) (FAURGS), questão 39", "url": "provas/p2021-06-ps44.pdf#page=11"}, {"id": "p2021-07-ps66-q01", "banca": "p2021-07-ps66", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche, correta e respectivamente, as lacunas das linhas 08, 20, 23 e 33.", "alternativas": ["a – a – a – a", "a – há – a – à", "a – há – a – a", "à – a – à – à", "à – a – à – a"], "correta": 2, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 1", "url": "provas/p2021-07-ps66.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t1"}, {"id": "p2021-07-ps66-q02", "banca": "p2021-07-ps66", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 2", "url": "provas/p2021-07-ps66.pdf#page=3", "itens": ["I - O texto considera importante tratar de forma indireta os aspectos referentes ao futuro profissional dos jovens.", "II - O texto considera que a obtenção de um diploma universitário é parte do percurso relativo ao futuro profissional.", "III - O texto considera que o diploma universitário pode ser substituído na formação profissional de cada um."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t1"}, {"id": "p2021-07-ps66-q03", "banca": "p2021-07-ps66", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações acerca do uso de sinais de pontuação no texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas II e III.", "I, II e III."], "correta": 4, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 3", "url": "provas/p2021-07-ps66.pdf#page=3", "itens": ["I - Cada uma das vírgulas da linha 02 poderia ser substituída por travessão.", "II - Os dois-pontos da linha 27 poderiam ser substituídos por ponto-final, feito o devido ajuste relativo ao uso de maiúscula.", "III - Os parênteses da linha 45 poderiam ser substituídos por vírgulas."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t1"}, {"id": "p2021-07-ps66-q04", "banca": "p2021-07-ps66", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre palavras do texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 4", "url": "provas/p2021-07-ps66.pdf#page=4", "itens": ["I - respeitável (l. 17) é adjetivo formado por sufixação a partir de um verbo.", "II - adquirimos (l. 29) está flexionada no pretérito imperfeito do indicativo.", "III - Quem (l. 43) é classificada como pronome."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t1"}, {"id": "p2021-07-ps66-q05", "banca": "p2021-07-ps66", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém a afirmação correta acerca das palavras profundamente (l. 24) e necessariamente (l. 34), respectivamente.", "alternativas": ["São advérbios de modo derivados de adjetivos.", "São adjetivos derivados de substantivos.", "São adjetivos derivados de adjetivos.", "São substantivos derivados de adjetivos.", "São advérbios derivados de advérbios."], "correta": 0, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 5", "url": "provas/p2021-07-ps66.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t1"}, {"id": "p2021-07-ps66-q06", "banca": "p2021-07-ps66", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas II e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 6", "url": "provas/p2021-07-ps66.pdf#page=5", "itens": ["I - O autor do texto defende que, ao contrário dos cariocas e paulistas, os porto-alegrenses não têm identidade.", "II - O autor do texto defende que a identidade dos cariocas e dos paulistas está ligada à cultura de cada cidade.", "III - O autor do texto defende que a identidade porto-alegrense, embora exista, não é facilmente evidente."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t2"}, {"id": "p2021-07-ps66-q07", "banca": "p2021-07-ps66", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes propostas de substituição de vocábulos do texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 7", "url": "provas/p2021-07-ps66.pdf#page=5", "itens": ["I - A substituição de eu (l. 04) por nós, no segmento que se estende da linha 04 à linha 05 implicaria outras duas (02) alterações no parágrafo, para fins de concordância.", "II - A substituição de inclui (l. 20) por refere-se criaria condições para o emprego do acento indicativo de crase na frase.", "III - A substituição de Mas (l. 25) por Portanto não provocaria alteração no sentido da frase."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t2"}, {"id": "p2021-07-ps66-q08", "banca": "p2021-07-ps66", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "A palavra Entretanto (l. 09) introduz, no período em que ocorre, uma ideia de", "alternativas": ["oposição.", "causa.", "comparação.", "explicação", "consecução."], "correta": 0, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 8", "url": "provas/p2021-07-ps66.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t2"}, {"id": "p2021-07-ps66-q09", "banca": "p2021-07-ps66", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "A expressão Em suma (l. 31) poderia ser substituída, sem alteração do sentido contextual, por", "alternativas": ["Acima.", "Em resumo.", "Respectivamente.", "Em cima.", "Abaixo."], "correta": 1, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 9", "url": "provas/p2021-07-ps66.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t2"}, {"id": "p2021-07-ps66-q10", "banca": "p2021-07-ps66", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Assinale os excertos abaixo com V (verdadeiro) ou F (falso) em relação às ocorrências em que a palavra que substitui uma palavra ou expressão anterior no texto.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V – F.", "V – V – F – F.", "V – V – F – V.", "F – F – F – V.", "F – F – V – V."], "correta": 4, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 10", "url": "provas/p2021-07-ps66.pdf#page=5", "itens": ["( ) confesso que não tenho uma resposta satisfatória para isto. (l. 16-17).", "( ) O que caracteriza, exatamente, a cidade? (l. 22).", "( ) é uma identidade que tem de ser procurada (l. 31-32).", "( ) alguém que continua (l. 35)."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-07-ps66:t2"}, {"id": "p2021-07-ps66-q11", "banca": "p2021-07-ps66", "num": 11, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "No que se refere à Norma Regulamentadora nº 32 (NR-32) – Segurança e Saúde no Trabalho em Serviços de Saúde, assinale com V (verdadeiro) ou F (falso) as afirmações abaixo.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["F – V – V – F – V.", "V – V – F – V – F.", "F – F – V – F – V.", "V – F – V – V – F.", "V – F – F – F – V."], "correta": 2, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 11", "url": "provas/p2021-07-ps66.pdf#page=6", "itens": ["( ) Os trabalhadores com feridas ou lesões em membros superiores não podem ser liberados para trabalhar, independentemente da atividade.", "( ) A trabalhadora gestante deve ser proibida de trabalhar em áreas com possibilidade de exposição a gases ou vapores anestésicos.", "( ) Deve-se proibir que os trabalhadores expostos aos quimioterápicos antineoplásicos realizem atividades com exposição à radiação ionizante.", "( ) O uso de duas luvas pelo trabalhador substitui a lavagem das mãos.", "( ) São vedados o reencape e a desconexão manual de agulhas."]}, {"id": "p2021-07-ps66-q12", "banca": "p2021-07-ps66", "num": 12, "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "O Estatuto da Criança e do Adolescente (ECA) proíbe que seja exercido qualquer trabalho por menores de quatorze anos, salvo se for na condição de aprendiz, e ainda observa que o programa social de aprendizagem tenha como base o trabalho educativo. A partir desse contexto, assinale a alternativa que corresponde corretamente ao que se entende por trabalho educativo, sendo prerrogativa do ECA.", "alternativas": ["Atividade laboral em que as exigências econômicas são relativas ao desenvolvimento pessoal do educando.", "Atividade laboral em que as exigências pedagógicas relativas ao desenvolvimento pessoal e social do educando prevalecem sobre o aspecto produtivo.", "Atividade laboral remunerada em que os aspectos produtivos prevalecem sobre as exigências pedagógicas relativas ao desenvolvimento pessoal e social do educando.", "Atividade laborativa restritiva aos jovens em situação de emancipação.", "Atividade desenvolvida exclusivamente por entidade governamental em parceria com o setor privado."], "correta": 1, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 12", "url": "provas/p2021-07-ps66.pdf#page=6"}, {"id": "p2021-07-ps66-q13", "banca": "p2021-07-ps66", "num": 13, "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "De acordo com o Estatuto do Idoso, Lei nº 10.741, de 1º de outubro de 2003, é obrigação da família, da comunidade, da sociedade e do Poder Público assegurar ao idoso, com absoluta prioridade, a efetivação do direito à vida, à saúde, à alimentação, entre outros elencados pela respectiva lei. Nesse sentido, entende-se por prioridade", "alternativas": ["a garantia de dispensa do pagamento dos tributos federais.", "a garantia de dispensa do pagamento dos tributos municipais.", "a garantia de acesso à rede de serviços de saúde e de assistência social locais.", "o atendimento preferencial coletivo junto aos órgãos públicos e privados prestadores de serviços à população.", "a garantia de dispensa de vacinação."], "correta": 2, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 13", "url": "provas/p2021-07-ps66.pdf#page=6"}, {"id": "p2021-07-ps66-q14", "banca": "p2021-07-ps66", "num": 14, "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "De acordo com a Carta dos Direitos dos Usuários da Saúde (2012), toda pessoa", "alternativas": ["tem direito a participar dos conselhos e das conferências de saúde após ter contribuído com o Instituto Nacional da Previdência Social (INSS) por, no mínimo, um ano.", "tem a responsabilidade de comunicar aos serviços de saúde, às ouvidorias ou à vigilância sanitária irregularidades relacionadas ao uso e à oferta de produtos e serviços que afetem a saúde em ambientes públicos e privados.", "tem direito a um atendimento adequado, com qualidade, no tempo inferior a duas horas, independentemente do seu estado de saúde e com garantia de continuidade do tratamento no domicílio e/ou em instituição asilar.", "tem o dever de adotar os valores, a cultura e a crença do serviço de saúde responsável pelo seu atendimento.", "está desobrigada a assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados, cabendo à instituição de saúde apresentar representação jurídica."], "correta": 1, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 14", "url": "provas/p2021-07-ps66.pdf#page=6"}, {"id": "p2021-07-ps66-q16", "banca": "p2021-07-ps66", "num": 16, "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "Assinale a alternativa que NÃO apresenta crime resultante de preconceito de raça ou de cor, conforme a Lei 7.716/89, alterada pelas Leis 9.459/97 e 12.288/2010.", "alternativas": ["Impedir ou obstar, por qualquer meio ou forma, o casamento ou convivência familiar e social.", "Impedir ou obstar o acesso de alguém, devidamente habilitado, a qualquer cargo da Administração Direta ou Indireta, bem como das concessionárias de serviços públicos.", "Constranger alguém, mediante violência ou grave ameaça, ou depois de lhe haver reduzido a capacidade de resistência.", "Praticar, induzir ou incitar a discriminação ou o preconceito de raça, cor, etnia, religião ou procedência nacional. (Redação dada pela Lei nº 9.459, de 15/05/97)", "Impedir o acesso ou o uso de transportes públicos, como aviões, navios, barcas, barcos, ônibus, trens, metrô ou qualquer outro meio de transporte concedido."], "correta": 2, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 16", "url": "provas/p2021-07-ps66.pdf#page=7"}, {"id": "p2021-07-ps66-q22", "banca": "p2021-07-ps66", "num": 22, "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Quando utilizamos a Comunicação Não Violenta (CNV) em nossas interações, nós nos colocamos em nosso estado compassivo natural. Assinale a alternativa que apresenta, de forma correta, os níveis de comunicação e as situações em que a CNV é aplicada.", "alternativas": ["Relacionamentos íntimos, famílias, escolas, organizações e instituições, terapia e aconselhamento, negociações internacionais, disputas e conflitos de toda natureza.", "Relacionamentos íntimos, famílias, escolas, organizações e instituições, terapia e aconselhamento, negociações diplomáticas e comerciais, disputas e conflitos de toda natureza.", "Relacionamentos familiares íntimos, nas escolas, organizações e instituições, terapia e aconselhamento, negociações diplomáticas e comerciais, disputas e avenças.", "Relacionamentos de amizade, religioso, organizações e instituições, terapia e aconselhamento pessoal, negociações diplomáticas, disputas e conflitos de toda natureza.", "Relacionamentos familiares, escolares, organizações e instituições, terapia e aconselhamento, reuniões diplomáticas e comerciais, disputas e conflitos."], "correta": 1, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 22", "url": "provas/p2021-07-ps66.pdf#page=9"}, {"id": "p2021-07-ps66-q23", "banca": "p2021-07-ps66", "num": 23, "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "A Comunicação Não Violenta (CNV) nos ajuda a nos ligarmos uns aos outros e a nós mesmos, possibilitando que nossa compaixão natural floresça. Ela nos guia no processo de reformular a maneira pela qual nos expressamos e escutamos os outros, mediante a concentração em quatro áreas: o que observamos, o que sentimos, do que necessitamos, e o que pedimos para enriquecer nossa vida.\n\nConsiderando a CNV, assinale com V (verdadeiro) ou F (falso) as afirmações abaixo.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["F – V – V – F – V.", "V – V – F – V – F.", "F – F – V – F – V.", "V – F – V – V – F.", "V – F – F – F – V."], "correta": 3, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 23", "url": "provas/p2021-07-ps66.pdf#page=9", "itens": ["( ) A CNV promove maior profundidade no escutar, fomenta o respeito e a empatia e provoca o desejo mútuo de nos entregarmos de coração.", "( ) A CNV torna ineficaz a profundidade no escutar, deixando de fomentar o respeito e a simpatia e acaba por não provocar o desejo mútuo de nos entregarmos de coração.", "( ) Algumas pessoas usam a CNV para responder compassivamente a si mesmas; outras, para estabelecer maior profundidade em suas relações pessoais.", "( ) Algumas pessoas usam a CNV para gerar relacionamentos eficazes no trabalho ou na política.", "( ) Para gerar relacionamentos eficazes no trabalho ou na política, utiliza-se a CNV para mediar a pacificação em níveis sociais, econômicos e culturais."]}, {"id": "p2021-07-ps66-q24", "banca": "p2021-07-ps66", "num": 24, "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre a ferramenta Google Desktop.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 24", "url": "provas/p2021-07-ps66.pdf#page=9", "itens": ["I - É um aplicativo relativamente jovem, que foi lançado em novembro de 2005 e auxilia na localização de informações.", "II - Podem-se visualizar, em sua área de trabalho, informações atualizadas sobre capacidade de armazenamento de mídia.", "III - Cria um índice de todo o conteúdo passível de busca e o armazena em seu computador."]}, {"id": "p2021-07-ps66-q25", "banca": "p2021-07-ps66", "num": 25, "materia": "Informática", "tema": "Informática", "enunciado": "Com o Google Agenda é possível compartilhar contatos com amigos, familiares ou colegas de trabalho e marcar compromissos.\n\nNumere a coluna de 1 a 6, com a ordem sequencial de execução dos procedimentos de acesso ao Google Agenda.\n\nA sequência numérica correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["5 – 2 – 6 – 3 – 1 – 4.", "2 – 5 – 1 – 6 – 3 – 4.", "2 – 6 – 1 – 3 – 4 – 5.", "6 – 5 – 2 – 4 – 3 – 1.", "3 – 5 – 6 – 4 – 2 – 1."], "correta": 4, "fonte": "Prova de 2021 · Assistente Administrativo I (Vigilante) (FAURGS), questão 25", "url": "provas/p2021-07-ps66.pdf#page=10", "itens": ["( ) Clique no link “Agenda”.", "( ) Digite as suas informações pessoais, como nome, sobrenome, local de acesso de sua agenda, como fuso horário.", "( ) Ao pressionar o botão “Continuar”, sua agenda será exibida na tela.", "( ) Digite os dados de sua conta do Gmail, como nome e senha.", "( ) Dê um clique no link “Mais”.", "( ) Digite o endereço do site www.google.com.br."]}, {"id": "p2022-01-ps08-q01", "banca": "p2022-01-ps08", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 04, 07 e 10.", "alternativas": ["expessura – alagadiço – as", "espessura – alagadiço – às", "espessura – alagadiço – as", "expessura – alagadisso – às", "espeçura – alagadisso – às"], "correta": 1, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 1", "url": "provas/p2022-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t1"}, {"id": "p2022-01-ps08-q02", "banca": "p2022-01-ps08", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 37, 39 e 41.", "alternativas": ["lhe – lá – lhe", "na – la – a", "la – lhe – a", "na – la – lhe", "lhe – lá – la"], "correta": 1, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 2", "url": "provas/p2022-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t1"}, {"id": "p2022-01-ps08-q03", "banca": "p2022-01-ps08", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta um sinônimo adequado para singular (l. 01) e contudo (l. 18).", "alternativas": ["distinta – portanto", "retangular – não obstante", "irregular – no entanto", "ímpar – entretanto", "única – por conseguinte"], "correta": 3, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 3", "url": "provas/p2022-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t1"}, {"id": "p2022-01-ps08-q04", "banca": "p2022-01-ps08", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 0, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 4", "url": "provas/p2022-01-ps08.pdf#page=3", "itens": ["I - Subentende-se o pronome ela antes de mostra (l. 02).", "II - Subentende-se a expressão tive de antes de pôr (l. 10).", "III - Subentende-se a expressão a anta antes de saltou (l. 25)."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t1"}, {"id": "p2022-01-ps08-q05", "banca": "p2022-01-ps08", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta o sujeito da forma verbal está se alastrando (l. 08-09).", "alternativas": ["fogo (l. 07).", "o capim seco (l. 07-08).", "o cerrado (l. 09).", "o terreno (l. 08).", "O fogo que pusemos no capim seco no dia da chegada para descobrir o terreno (l. 07-08)."], "correta": 4, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 5", "url": "provas/p2022-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t1"}, {"id": "p2022-01-ps08-q06", "banca": "p2022-01-ps08", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a afirmativa que apresenta uma inferência válida a partir da leitura do texto.", "alternativas": ["Carolina estava animada para o baile de carnaval, mas disfarçou sua animação porque sabia que Sérgio não gostava do carnaval.", "Sérgio inicialmente sentia-se velho demais para ir ao baile de carnaval; depois decidiu não ir porque não tinha fantasia adequada.", "Sérgio e Carolina eram namorados, e Sérgio estava com ciúmes por Carolina ir sozinha ao baile de carnaval.", "Apesar da insistência de Carolina, Sérgio não estava animado para ir aos festejos do carnaval.", "A grande diferença de idade entre Sérgio e Carolina foi o principal empecilho para que os dois pudessem ir juntos ao baile de carnaval."], "correta": 3, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 6", "url": "provas/p2022-01-ps08.pdf#page=4", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t2"}, {"id": "p2022-01-ps08-q07", "banca": "p2022-01-ps08", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – V – F.", "V – F – V.", "F – V – V.", "F – F – V.", "F – F – F."], "correta": 4, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 7", "url": "provas/p2022-01-ps08.pdf#page=4", "itens": ["( ) O sujeito da locução verbal estava batendo (l. 12-13) é Carolina.", "( ) A forma verbal Havia (l. 18) não tem sujeito.", "( ) O sujeito da forma verbal Ajeitou (l. 29) é Sérgio."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t2"}, {"id": "p2022-01-ps08-q08", "banca": "p2022-01-ps08", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta uma palavra formada por derivação sufixal.", "alternativas": ["espelhinho (l. 02).", "dispôs (l. 22).", "carinho (l. 24).", "percorreu (l. 32).", "retrovisor (l. 33)."], "correta": 0, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 8", "url": "provas/p2022-01-ps08.pdf#page=4", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t2"}, {"id": "p2022-01-ps08-q09", "banca": "p2022-01-ps08", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "Se a palavra caminho (l. 06) estivesse no plural, quantas outras palavras na frase deveriam ser modificadas para fins de concordância?", "alternativas": ["Uma.", "Duas.", "Três.", "Quatro.", "Cinco."], "correta": 2, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 9", "url": "provas/p2022-01-ps08.pdf#page=4", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t2"}, {"id": "p2022-01-ps08-q10", "banca": "p2022-01-ps08", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém uma oração subordinada.", "alternativas": ["Mostrou os dentes à busca de manchas, não encontrou, ergueu o quebra-sol (l. 04-05).", "Carolina deu a mão a ele (l. 18).", "Ele dissera que não (l. 20).", "Ele fez um carinho no joelho dela (l. 24).", "Carolina puxou o elástico de trás da cabeça, ergueu a máscara de penas pretas e enfiou-a nele (l. 28-29)."], "correta": 2, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 10", "url": "provas/p2022-01-ps08.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2022-01-ps08:t2"}, {"id": "p2022-01-ps08-q11", "banca": "p2022-01-ps08", "num": 11, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 11", "url": "provas/p2022-01-ps08.pdf#page=5", "itens": ["I - O tempo de 7,4 horas corresponde a 444 minutos.", "II - O resultado de 1/15 + 1/35 está entre 0,09 e 0,1.", "III - O resultado de (√2 + √3)² é igual a 5."], "figura": "provas/fig/p2022-01-ps08-q11.png"}, {"id": "p2022-01-ps08-q12", "banca": "p2022-01-ps08", "num": 12, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um determinado valor V, em reais, é aumentado em 20%; o novo valor é aumentado em 20%, e este, por sua vez, é aumentado em 20%, obtendo-se o resultado R$4.320,00. Dentre as alternativas abaixo, assinale a que apresenta o cálculo que resulta no valor V.", "alternativas": ["4320/(0,2)³", "4320/(1,2)³", "4320 − [(0,2)³ × 4320)]", "4320 − (3 × 0,2 × 4320)", "4320 − [(3 × (0,2)³ × 4320)]"], "correta": 1, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 12", "url": "provas/p2022-01-ps08.pdf#page=5", "figura": "provas/fig/p2022-01-ps08-q12.png"}, {"id": "p2022-01-ps08-q13", "banca": "p2022-01-ps08", "num": 13, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A expressão F=1,8C+32 relaciona graus Celsius com graus Fahrenheit, em que C representa o valor da temperatura em graus Celsius e F representa o correspondente valor em graus Fahrenheit. Dentre as alternativas, a melhor aproximação para a temperatura em graus Celsius que corresponde a 100 graus Fahrenheit é", "alternativas": ["34.", "35.", "36.", "37.", "38."], "correta": 4, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 13", "url": "provas/p2022-01-ps08.pdf#page=5"}, {"id": "p2022-01-ps08-q15", "banca": "p2022-01-ps08", "num": 15, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A tabela abaixo apresenta as despesas com salários e benefícios, segundo dados do Relatório Integrado de Gestão do Hospital de Clínicas de Porto Alegre de 2020.\n\nAno | Salários e Benefícios (valores em milhões)\n2018 | R$ 1.032\n2019 | R$ 1.117\n2020 | R$ 1.186\n\nDentre as alternativas, a melhor aproximação para o aumento percentual das despesas com salários e benefícios de 2019 para 2020 foi de", "alternativas": ["3%.", "4%.", "5%.", "6%.", "7%."], "correta": 3, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 15", "url": "provas/p2022-01-ps08.pdf#page=5"}, {"id": "p2022-01-ps08-q18", "banca": "p2022-01-ps08", "num": 18, "materia": "Informática", "tema": "Informática", "enunciado": "O processador de textos MS-Word tem um recurso muito útil que consiste em localizar determinado texto e substituí-lo por outro. Há diversas opções de pesquisa que permitem tratamento de exceções e situações especiais. Sobre esse tema, qual das afirmações a seguir NÃO é verdadeira?", "alternativas": ["É possível não fazer a substituição se o texto procurado foi digitado com letras maiúsculas e o encontrado está com letras minúsculas.", "É possível procurar por uma marca de parágrafo e substituí-la por outro conteúdo.", "É possível procurar por um caractere de tabulação e substituí-lo por outro conteúdo.", "É possível procurar por um texto, mas não substituí-lo se não for uma palavra inteira, ou seja, o texto procurado é encontrado como parte de uma palavra.", "Não é possível procurar por um texto que esteja em uma determinada fonte e substituí-lo por outro texto com outra fonte."], "correta": 4, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 18", "url": "provas/p2022-01-ps08.pdf#page=6"}, {"id": "p2022-01-ps08-q19", "banca": "p2022-01-ps08", "num": 19, "materia": "Informática", "tema": "Informática", "enunciado": "O processador de Textos MS-Word tem uma ferramenta que permite definir uma combinação de características de formatação, tais como tipo de fonte, tamanho da fonte, recuos, espaçamento entre linhas, idioma, entre outros. Tal ferramenta chama-se", "alternativas": ["Estilo.", "Macro.", "Tabela.", "Biblioteca.", "Quadros."], "correta": 0, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 19", "url": "provas/p2022-01-ps08.pdf#page=6"}, {"id": "p2022-01-ps08-q20", "banca": "p2022-01-ps08", "num": 20, "materia": "Informática", "tema": "Informática", "enunciado": "Para se obterem os valores da Variação Percentual da coluna C, procedeu-se da seguinte forma: digitou-se em C5 uma fórmula para cálculo da Variação Percentual entre o Valor Medido e o Valor de referência. Após, formatou-se esta célula para formato de percentual, com duas casas decimais. A seguir, a fórmula de C5 foi copiada e colada para as células C6 até C10. Qual fórmula deve ser digitada em C5, para que se obtenham os resultados da coluna C mostrados na planilha?", "alternativas": ["=(B5-B2)/B2", "=(B$5-B2)/B2", "=(B5-B2)/B2*100", "=(B5-B$2)/B$2", "=(B$5-B$2)/B$2"], "correta": 3, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 20", "url": "provas/p2022-01-ps08.pdf#page=7", "instrucao": "Para responder às questões 20 e 21 considere a planilha MS-Excel abaixo, que contém dados de algumas medições feitas por um aparelho (como por exemplo, um aparelho de pressão ou um medidor de tensão).", "figura": "provas/fig/p2022-01-ps08-q20.png"}, {"id": "p2022-01-ps08-q21", "banca": "p2022-01-ps08", "num": 21, "materia": "Informática", "tema": "Informática", "enunciado": "Para o cálculo da média aritmética na célula B12, podem-se usar diversas fórmulas. Dentre as alternativas abaixo, qual apresenta a fórmula que NÃO faz o cálculo correto da média?", "alternativas": ["=MÉDIA(B5:B10)", "=MÉDIA(B5;B10)", "=MÉDIA(B5;B6;B7;B8;B9;B10)", "=(B5+B6+B7+B8+B9+B10)/6", "=MÉDIA((B5+B6+B7+B8+B9+B10)/6)"], "correta": 1, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 21", "url": "provas/p2022-01-ps08.pdf#page=7", "instrucao": "Para responder às questões 20 e 21 considere a planilha MS-Excel abaixo, que contém dados de algumas medições feitas por um aparelho (como por exemplo, um aparelho de pressão ou um medidor de tensão).", "figura": "provas/fig/p2022-01-ps08-q21.png"}, {"id": "p2022-01-ps08-q22", "banca": "p2022-01-ps08", "num": 22, "materia": "Informática", "tema": "Informática", "enunciado": "Considere a planilha MS-Excel a seguir, que contém dados de casos atendidos em um laboratório de patologia em 2 meses consecutivos.\n\nDeseja-se calcular o Percentual de Aumento do número de casos atendidos no mês atual em relação ao mês anterior. Para tanto, digitou-se em D4 uma fórmula para o cálculo desse aumento percentual, considerando como base o mês anterior, ou seja, quanto aumentou o número de casos no mês atual em relação ao anterior. A célula D4 foi, então, formatada para formato de percentual, com 2 casas decimais e, a seguir, foi copiada e colada para as células D5 até D10. A fórmula digitada em D4, para que se obtenham os resultados da coluna D mostrados na planilha, deve ser", "alternativas": ["=(C4-B4)/B4", "=C4/B4", "=(B4-C4)/B4", "=(B4-C4)/C4", "=(C4-B4)/B4*100"], "correta": 0, "fonte": "Prova de 2022 · Profissional Assistencial III (Necropsia e Macroscopia) (FAURGS), questão 22", "url": "provas/p2022-01-ps08.pdf#page=7", "figura": "provas/fig/p2022-01-ps08-q22.png"}, {"id": "p2022-01-ps08-q33", "banca": "p2022-01-ps08", "num": 33, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Conforme o Decreto nº 1.171, de 22 de junho de 1994, assinale a afirmativa que apresenta uma prerrogativa do servidor público.", "alternativas": ["Ter respeito à hierarquia, sem jamais representar contra qualquer comprometimento indevido da estrutura
