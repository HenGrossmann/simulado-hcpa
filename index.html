l Assistencial III (Suprimentos/Farmácia)", "sub": "HCPA · Edital 03/2024 · PS 29", "url": "provas/p2024-03-ps29.pdf", "origem": "https://portalfaurgs.com.br/LerArquivo/52da05c9-9df3-4f70-9afc-e4a82abc7db3", "gab": "EDCDCADDCECEDACDEBCACCBEBABBABDEEADBBAAE", "blocos": [["SUS: objetivos, princípios e diretrizes", [15, 39]], ["Ética do servidor (Decreto 1.171/1994)", [19]], ["Segurança do paciente", [25, 29]], ["Gestão de materiais e almoxarifado", [32, 38]], ["NR-32", [40]]], "nota": "Única com gestão de materiais de hospital (ciclo de compras, inventário), mais SUS, ética, metas de segurança do paciente e NR-32; o resto é farmácia."}}</script>
<script id="textos" type="application/json">{"p2015:t1": "O potencial do português brasileiro como língua internacional\n\n01. Nos últimos anos, tenho visitado diversos países\n02. onde se ensina a língua portuguesa: Argentina, Uruguai,\n03. México, Colômbia, Itália e agora estou aqui na Finlândia.\n04. Em todos esses lugares, esses convites foram motivados\n05. pela enorme dificuldade que as professoras e os\n06. professores _____ de fazer valorizar o português\n07. brasileiro como língua digna de ser ensinada a\n08. estrangeiros. A Universidade Nacional Autônoma do\n09. México, por exemplo, é o lugar no mundo onde mais\n10. se estuda português, e seria mais do que natural\n11. imaginar que, estando na América Latina, o interesse\n12. dos mexicanos deveria ser pelo português brasileiro –\n13. e é. Só que nessa mesma universidade o Instituto\n14. Camões ocupa um andar inteiro do centro de estudos\n15. de línguas estrangeiras, envia professores e material\n16. didático, além de oferecer estágios em Portugal\n17. para os estudantes. O Brasil... nada.\n\n18. Aliás, os dados comparativos são eloquentes: o\n19. governo português ___ 1.691 docentes de língua no\n20. exterior, atua em 72 países e está presente em 300\n21. universidades mundo afora. Já o nosso Ministério das\n22. Relações Exteriores é responsável somente por 40\n23. leitorados e 24 centros de estudos brasileiros. A\n24. postura do Itamaraty parece ser a seguinte: se já\n25. estão lá os portugueses, nós não precisamos estar\n26. também. Essa diferença de números é ainda mais\n27. surpreendente quando comparamos Brasil e Portugal\n28. em termos de importância geopolítica e econômica. O\n29. Brasil participa de um grupo chamado BRICS, que ___\n30. as chamadas “potências emergentes”, ou seja, Brasil,\n31. Rússia, Índia, China e África do Sul. Portugal, infeliz-\n32. mente, é incluído num grupo pejorativamente chamado\n33. de PIIGS (Portugal, Irlanda, Itália, Grécia e Espanha),\n34. os países que mais ___ sofrido com a grave crise\n35. econômica iniciada em 2008.\n\nAdaptado de: “O potencial do português brasileiro como língua internacional”, de Marcos Bagno (https://marcosbagno.files.wordpress.com/2014/11/o-potencial-do-portuguecc82s-brasileiro-como-licc81ngua-internacional.pdf). Acessado em 11 de abril de 2015.", "p2015:t2": "01. Aquele verão foi seco e cruel. Quando o áspero\n02. vento norte soprava Ana Terra ficava de tal maneira\n03. irritada, tão brusca de modos e palavras, que D.\n04. Henriqueta murmurava: “O que essa menina precisa\n05. mesmo é casar duma vez...” Ana revoltava-se. Casar?\n06. O que ela precisava era mudar de vida, visitar de vez\n07. em quando o Rio Pardo, ir a festas, ter amigas, ver\n08. gente. Aquela solidão ia acabar deixando-a doida,\n09. doida varrida... Mas na presença do pai não dizia nada.\n10. Recalcava a revolta, prendia-a no peito, apertava os\n11. lábios para que ela não se lhe escapasse pela boca\n12. em palavras amargas. Nas noites abafadas dormia\n13. mal, ____ levantava-se, ia para a frente da casa, ficava\n14. olhando as coxilhas e o céu, tendo nos olhos um sono\n15. pesado e na cabeça, no peito, no corpo todo uma ânsia\n16. que a mantinha desperta e agitada. Não raro, altas\n17. horas da noite acordava com uma sede desesperada,\n18. metia a caneca na talha, bebia em longos goles uma\n19. água que a mornidão tornava grossa; e ia bebendo,\n20. caneca sobre caneca, para no fim ficar com o estômago\n21. pesado sem ter saciado a sede nem aliviado a ardência\n22. da garganta. Muitas vezes o sono só lhe vinha de\n23. madrugada alta, e, vendo pela cor do horizonte que o\n24. dia não tardava a raiar, concluía que não adiantava ir\n25. para a cama, pois, dentro de pouco teria de acender o\n26. fogo para aquentar a água do chimarrão. O remédio,\n27. então, era molhar os olhos, lavar ___ cara, caminhar\n28. ao redor do rancho para espantar ___ sonolência.\n\nAdaptado de: “O Tempo e o Vento: O Continente I”, de Érico Veríssimo.", "p2021-01-ps08:t1": "01 Todos diziam que Leninha, quando crescesse, ia ser\n02 médica. Passava horas brincando de médico com as\n03 bonecas. Só que, ao contrário das outras crianças,\n04 quando largou as bonecas, não perdeu a mania. A\n05 primeira vez que tocou no rosto do namorado foi para\n06 ver se estava com febre. Só na segunda é que foi\n07 carinho. Ia ____ ia ser médica. Só tinha uma coisa.\n08 Não podia ver sangue.\n\n09 – Mas, Leninha, como é que...\n\n10 – Deixa que eu me arranjo.\n\n11 Não é que ela tivesse nojo de sangue. Desmaiava.\n12 Não podia ver carne malpassada. Ou ketchup. Um\n13 arranhãozinho era o bastante para derrubá-la. Mas fez\n14 o vestibular para a Medicina, passou e preparou-se\n15 para começar o curso.\n\n16 – E as aulas de Anatomia, Leninha? Os cadáveres?\n\n17 – Deixa que eu me arranjo.\n\n18 Fez um trato com a Olga, colega desde o Secundário.\n19 Quando abrissem um cadáver, fecharia os olhos. A\n20 Olga descreveria tudo para ela. Conseguiu fazer o curso\n21 de Medicina sem ver uma gota de sangue. Houve\n22 momentos em que precisou explicar o ____ dos olhos\n23 fechados.\n\n24 – É concentração, professor.\n\n25 Mas se formou. Hoje é médica de sucesso. Não na\n26 cirurgia, claro. Se bem que chegou a pensar em convidar\n27 a Olga para fazerem uma dupla cirúrgica, ela operando\n28 com o rosto virado, e a Olga dando as coordenadas.\n\n29 Está feliz. Inclusive se casou, pois encontrou uma\n30 alma gêmea. Foi num aeroporto. No bar onde foi tomar\n31 um cafezinho enquanto esperava a chamada para o\n32 embarque, puxou conversa com um homem que parecia\n33 muito nervoso.\n\n34 – Algum problema? – perguntou, pronta para\n35 medicá-lo.\n\n36 – Não – tentou sorrir o homem. – É o avião...\n\n37 – Você tem medo de voar?\n\n38 – Pavor. Sempre tive.\n\n39 – Então ____ voa?\n\n40 – Na minha profissão, é preciso.\n\n41 – Qual é a sua profissão?\n\n42 – Piloto.\n\n43 Casaram-se uma semana depois.\n\nAdaptado de: VERISSIMO, Luis Fernando. Vocações. In: VERISSIMO, Luis Fernando. A mãe do Freud. Porto Alegre: L&PM, 1985.", "p2021-01-ps08:t2": "01 Hoje, vejo com lucidez aquele adolescente proble-\n02 mático. Como todos; porém talvez um pouco mais\n03 marcado pela solidão e por um complexo de rejeição\n04 ____ só me libertei muito depois. Angustiado, querendo\n05 fazer, ser alguma coisa, para se superar e ser admirado,\n06 amado e respeitado. No momento _____, ainda no\n07 ginásio, o adolescente descobriu que sabia escrever\n08 melhor do que os outros, foi um barco salva-vidas.\n09 Certo dia, numa aula de história, comentando uma\n10 prova, a professora fez um elogio público do meu texto,\n11 acrescentando: “Você tem um enorme poder de\n12 síntese”. Três coisas me davam prazer: ler, escrever e\n13 ir ao cinema. O curioso é que o cinema, uma alegria,\n14 também era uma tortura. Eu ficava na porta de entrada\n15 do Cine Odeon, vendo as pessoas chegando. Os meus\n16 amigos com suas namoradas. E eu só.\n\n17 Desde os quatorze anos eu pertencia a um grupo\n18 mais ou menos rebelde, revoltado, inquieto. Um grupo\n19 que disputava eleições para o Centro Cívico (como se\n20 chamavam os diretórios acadêmicos), bebia a noite\n21 toda, fazia serenatas e arruaças (ingênuas, como\n22 quebrar lâmpadas de postes, etc.). E lia, lia, lia.\n23 Éramos os donos da biblioteca municipal. Passávamos\n24 a tarde inteira lá. O que eu lia? Havia dois livros de\n25 cinema ____ gostava muito. Sétima Arte, de Mota da\n26 Costa, e Designing for Moving Pictures (este li com\n27 dificuldades imensas a primeira vez, depois fui melho-\n28 rando). E lia Graciliano, Lins do Rego, Machado de\n29 Assis, Coelho Neto, Balzac, Flaubert, descobri Faulkner,\n30 Hemingway, Cecília Meireles, Drummond, Bandeira,\n31 Graça Aranha. Devorávamos os livros e, quando não\n32 havia mais nada, folheávamos até a Revista dos\n33 Tribunais.\n\n34 Dos tempos de criança, não sei precisar ____ o\n35 primeiro livro que li. Só sei que li toda a Coleção Infantil\n36 da Melhoramentos e a série de Contos de Fadas, da\n37 Vecchi. Gostei muito de Pinóquio, que ganhei como\n38 prêmio por um desenho, logo depois da guerra: “Como\n39 você vê Paris libertada?”. Como será que vi, para ganhar\n40 um prêmio? Será que existe algum documento a\n41 respeito? Quem promoveu? O consulado francês?\n42 Mistérios da infância.\n\nAdaptado de: BRANDÃO, Ignácio de Loyola. In: STEEN, Edla van. Viver & escrever, v. 1. Porto Alegre: L&PM, 2008.", "p2021-02-ps11:t1": "01. Todas as noites, antes de dormir e quase até pegar\n02. no sono, eu pensava nos meus problemas. Eram três,\n03. disso eu tenho certeza, e um deles envolvia uma enco-\n04. menda feita sem autorização dos adultos ______ um\n05. vendedor ambulante que passava de tempos em\n06. tempos na frente da nossa casa – dos outros eu esqueci.\n\n07. Quando minha mãe me botava na cama e apagava\n08. a luz, eu acendia meus três problemas para jogar com\n09. eles no escuro. Ainda não tinha aprendido a ler, mas\n10. já sabia me preocupar. Apesar de ______ palavra\n11. \"problema\" ter entrado tão cedo no meu vocabulário,\n12. não tive uma infância \"problemática\" – os maiores\n13. problemas de uma criança, em geral, não são esses que\n14. ela consegue partir em pequenos pedaços e observar.\n\n15. Que eu tenha captado o sentido da palavra ouvindo\n16. a conversa dos adultos (ou vendo novela) e tenha me\n17. apressado a colocá-la em uso todas as noites apenas\n18. demonstra certa predisposição precoce para o lado não\n19. prático da existência – e hoje me parece fabuloso que\n20. uma das minhas memórias mais nítidas da infância diga\n21. respeito não a algo que me aconteceu ou que eu vi,\n22. mas ____ uma atividade puramente mental: matutar.\n\n23. Com o passar dos anos, meus problemas ganharam\n24. em concretude e variedade. Os menos graves foram\n25. parar na maçaroca indistinta das aflições superadas, lá\n26. onde uma não desprezível montanha de preocupações\n27. antigas causadas por atritos na família, amores frustrados\n28. ou dissabores no trabalho já perderam boa parte do\n29. poder que um dia tiveram sobre mim.\n\n30. Porque ter um problema é ruim, claro, mas não como\n31. um acontecimento trágico ou um fato consumado\n32. diante do qual só nos resta sofrer com maior ou menor\n33. resignação. Problema é aquilo que a gente fica remoendo\n34. não apenas porque nos incomoda, mas porque\n35. imaginamos que existe uma solução, em algum lugar,\n36. esperando por nós.\n\n37. Problema resolvido produz conhecimento. Não\n38. devemos subestimar nossa capacidade para resolver\n39. impasses, conflitos, crises de pequenas ou grandes\n40. proporções. Quando não contempla a possibilidade de\n41. solução, não estamos diante de um problema, mas de\n42. uma sentença. Costumamos associar a expressão\n43. \"esquentar a cabeça\" com reações impulsivas e violentas,\n44. mas, ____ vezes, o que mais nos esgota mentalmente\n45. é o oposto disso: o esforço para buscar não a solução\n46. mais rápida, mas a melhor. Matutar.\n\nAdaptado de: LAITANO, Cláudia. Matutar. Disponível em: <https://gauchazh.clicrbs.com.br/opiniao/noticia/2015/10/claudia-laitano-matutar-4862029.html>. Acesso em: 28 jan. 2021.", "p2021-03-ps22:t1": "01. Marie Skłodowska-Curie, nascida Maria Salomea\n02. Skłodowska (1867-1934), foi uma física e química\n03. polonesa naturalizada francesa que conduziu pesquisas\n04. pioneiras sobre radioatividade. Ela foi a primeira\n05. mulher a ganhar o Prêmio Nobel, sendo também a\n06. primeira pessoa e a única mulher a ganhá-lo duas\n07. vezes, além de ser a única pessoa a ser premiada em\n08. dois campos científicos diferentes. Ela teve papel\n09. fundamental no legado da família Curie, de cinco\n10. prêmios Nobel. Ela também foi a primeira mulher a se\n11. tornar professora na Universidade de Paris e, em 1995,\n12. se tornou a primeira mulher a ser sepultada por seus\n13. próprios méritos no Panteão de Paris.\n\n14. Nascida em Varsóvia, no que era então o Reino\n15. da Polônia, parte do Império Russo, ela estudou na\n16. clandestina Universidade Volante de Varsóvia e iniciou\n17. seu treinamento científico prático na mesma cidade.\n18. Em 1891, aos 24 anos, seguiu sua irmã mais velha,\n19. Bronisława, para estudar em Paris, onde obteve seus\n20. diplomas superiores e conduziu seus trabalhos científicos\n21. subsequentes. Ela compartilhou o Prêmio Nobel de\n22. Física de 1903 com seu marido, Pierre Curie, e com o\n23. físico Henri Becquerel. Ela também ganhou o Prêmio\n24. Nobel de Química de 1911.\n\n25. Suas realizações incluem o desenvolvimento da\n26. teoria da “radioatividade” (um termo que ela cunhou),\n27. técnicas para isolar isótopos radioativos e a descoberta\n28. de dois elementos químicos, o polônio e o rádio. Sob\n29. sua direção, foram conduzidos os primeiros estudos\n30. para o tratamento de neoplasias usando isótopos\n31. radioativos. Ela fundou o Instituto Curie em Paris e\n32. sua contraparte em Varsóvia, que continuam sendo\n33. grandes centros de pesquisa médica. Durante a\n34. Primeira Guerra Mundial, ela desenvolveu unidades de\n35. radiografia móvel para fornecer serviços de raio-X ___\n36. hospitais de campanha.\n\n37. Apesar de ter se tornado cidadã francesa, Marie\n38. Skłodowska-Curie, que usava os dois sobrenomes,\n39. nunca perdeu o senso de identidade polonesa. Ela\n40. ensinou ___ filhas ___ língua polonesa e as levava em\n41. visitas ___ Polônia. Ela nomeou o primeiro elemento\n42. químico que descobriu, o polônio, em homenagem ao\n43. seu país natal. Marie Curie morreu em 1934, aos 66\n44. anos, em um sanatório em Sancellemoz, na França, de\n45. anemia aplástica, causada por exposição à radiação\n46. durante sua pesquisa científica e seu trabalho\n47. radiológico em hospitais de campanha durante a\n48. Primeira Guerra Mundial.\n\nAdaptado de: Marie Curie, disponível em https://pt.wikipedia.org/wiki/Marie_Curie.", "p2021-03-ps22:t2": "01. Mariana desceu pouco depois das três horas, o\n02. porteiro estava encostado na grande porta de vidro,\n03. olhando as pessoas que passavam, os carros e os\n04. aviões, os navios e os cachorros que cheiravam floreiras\n05. e cantos de parede. Fingiu que apanhava qualquer\n06. coisa no chão e espiou sob a borda do degrau. Nada.\n07. Foi um pouco além, voltou e subiu novamente. Repetiu\n08. muitas vezes a manobra e lá estava a pedra vazia de\n09. sinal. Ficou a passear nervosa, Cássio podia aparecer\n10. de um momento para outro, a encontraria sem ser\n11. preciso gastar lápis-cera, sairiam os dois de mãos\n12. dadas, a tarde estava sem vento, os carros prosse-\n13. guiam na sua faina interminável de ir e de vir, como se\n14. não tivessem um destino certo. Mais uma volta e nada\n15. do sinal combinado.\n\n16. Cássio não viria mais, alguma coisa dentro de seu\n17. coração lhe dizia isso, olhava confrangida para os\n18. casais de namorados que andavam pela rua, abraçados,\n19. muito juntos, trocando beijos, indiferentes aos passantes,\n20. às velhas que estacavam e se escandalizavam diante\n21. da cena.\n\n22. Por fim decidiu subir, escreveria uma carta havia\n23. muito devida a uma colega que seguira por um ano\n24. para Nova York, pensou até em desabafar para ela,\n25. contar tudo, pedir conselhos, descrever Cássio da\n26. cabeça aos pés.\n\n27. Mas quando subiu encontrou a mãe sentada lendo um\n28. livro sob a lâmpada que fora colocada a um canto da sala\n29. especialmente para ela, os seus cabelos pareciam mais\n30. claros e dourados, os traços de antiga beleza.\n\n31. A mãe fechou o livro depois de marcar a página com\n32. uma tira de seda azul, presente de Mariana num dia\n33. distante: diga lá dentro o que você quer jantar, há\n34. salada pronta na geladeira, mande passar um filé,\n35. quem sabe um caldo quente, tenho a impressão de que\n36. a minha filha está emagrecendo, anda com a fisionomia\n37. abatida. Fez uma pausa, rodou a cadeira e perguntou:\n38. por que ele não telefona mais? Surpresa, Mariana\n39. exclamou: eu mesma não sei, simplesmente ele disse\n40. que não ia telefonar mais, a gente nunca consegue\n41. saber direito das pessoas e depois é o rapaz mais\n42. estranho que encontrei em toda a minha vida.\n\nAdaptado de: GUIMARÃES, J. É tarde para saber. Porto Alegre: L&PM, 2011.", "p2021-06-ps43:t1": "01. Várias vezes eu evoquei, nesta coluna, o prazer que\n02. todos sentimos no momento em que vislumbramos,\n03. através do opaco véu que encobre _____ palavras,\n04. uma semelhança ou um parentesco que jamais tínhamos\n05. percebido. O multitalentoso Alberto Savinio, irmão do\n06. conhecido pintor De Chirico, registrou, comovido, o\n07. momento em que sua filhinha de cinco anos viu se abrir\n08. diante dela, pela primeira vez, esta caverna de tesouros\n09. infinitos, ao se dar conta de que os fiammiferi (\"fósforos\",\n10. em Italiano) tinham esse nome porque \"trazem uma\n11. chama\" (fiamma).\n\n12. Diz ele: \"Em seus olhinhos dourados senti brilhar\n13. uma nova luz, primeiro reflexo de uma compreensão\n14. mais sólida das coisas, de uma felicidade emanada da\n15. razão\". E continua: \"A descoberta etimológica é uma\n16. iluminação. Ela nos dá a impressão (ou a ilusão) de\n17. tocar na Verdade com as mãos – e daí nos vem este\n18. raro prazer\".\n\n19. Ao rosário iniciado por fiammiferi, suponho que vieram\n20. se acrescentar _____ contas inflamar, inflamável e\n21. inflamação, todas nascidas da mesma flama (o termo\n22. latino para chama). E depois certamente ela viu passar\n23. alguma Ferrari, desfilando o seu vermelho flamante,\n24. provado alguma iguaria flambada na nobre chama do\n25. conhaque ou ouvido algum padre falar na espada\n26. flamejante que impedia o acesso ao Paraíso.\n\n27. Como todos os que leem esta coluna, eu também\n28. tive o meu \"Abre-te, Sésamo\" etimológico. Andava eu\n29. pela casa dos oito anos quando meu pai apareceu em\n30. casa com um exemplar de O Guarani, impresso em\n31. papel de segunda e ostentando uma capa de terceira.\n32. Para mim, foi um amor _____ primeira vista que muitas\n33. marcas deixou.\n\n34. Pois é a este livro que devo a minha \"iluminação\n35. etimológica\": a folhas tantas, quando a mãe de Peri\n36. vem tentar convencê-lo a sair da propriedade dos brancos\n37. e voltar para sua aldeia natal, ele recusa. Ela então se\n38. afasta lentamente: \"Peri seguiu-a com os olhos até que\n39. desapareceu na floresta; esteve a correr, chamá-la e\n40. partir com ela. Mas o vento lhe trazia a voz argentina\n41. de Cecília que falava com seu pai; ficou\". Que diabos\n42. seria isso? A palavra argentino era bastante usada por\n43. minha avó, que tinha lá suas diferenças com os porte-\n44. nhos e praguejava contra eles sempre que tinha\n45. oportunidade. Mas voz argentina? E logo na imaculada\n46. Ceci? Nunca uma palavra tinha me chamado tanto a\n47. atenção; recorri ao dicionário, à enciclopédia, ao Lelo\n48. Universal, aos tios, à mãe professora, _____ colegas\n49. da mãe professora e aos anciãos da vizinhança e\n50. descobri que tudo vinha de argentum (\"prata\", no\n51. Latim), e que os espanhóis tinham dado a esta nova\n52. conquista o nome de Argentina porque ainda não\n53. sabiam que o grosso da prata vinha do Peru, mas\n54 acertadamente chamaram de Rio da Prata o curso\n55. d'água por onde escoava a produção deste metal, e\n56. que por isso a prata era Ag na tabela periódica, e que\n57. não por acaso \"dinheiro\", em Francês, é argent, e\n58. argentário é o dinheirista, e que uma voz argentina,\n59. como a de Ceci, tinha o timbre fino como o da prata.\n60. Bem, mas aí já era irremediável: como Ali Babá, fasci-\n61. nado, eu tinha descoberto a entrada do tesouro.\n\nAdaptado de: MORENO, Claudio. \"Iluminação etimológica\": o fascínio da descoberta das palavras. Disponível em: https://gauchazh.clicrbs.com.br/colunistas/claudio-moreno/noticia/2019/10/iluminacao-etimologica-o-fascinio-da-descoberta-das-palavras-ck2dyyhr40bc801n3bj3f0pl4.html. Acesso em: 05 set. 2021.", "p2021-06-ps43:t2": "01. Outro dia uma leitora para lá de generosa me\n02. cumprimentou por uma crônica e pelo “dom” de escrever.\n03. Agradeci, evidentemente, mas, com a devida delica-\n04. deza, esclareci que não tinha dom algum. Escrever,\n05. decididamente, não é um dom. Ninguém nasce com\n06. essa habilidade, até mesmo _____ quem escreve\n07. profissionalmente precisa passar por processos de\n08. aprendizagem que podem ir da alfabetização aos\n09. macetes da escrita criativa.\n\n10. Nem mesmo o nosso cronista mais talentoso, Luis\n11. Fernando Verissimo, veio ao mundo com esse suposto\n12. dom. Aliás, é dele um dos comentários mais criativos\n13. sobre a arte de juntar letrinhas: “Escrever bem é\n14. escrever claro, não necessariamente certo. Por exemplo:\n15. dizer ‘escrever claro’ não é certo, mas é claro, certo?”.\n\n16. Talento é outra coisa. É uma habilidade natural que\n17. pode ser aperfeiçoada, quase sempre à custa de muito\n18. esforço e persistência. Já talento sem aplicação vira\n19. desperdício. Em qualquer área. Com raras exceções, os\n20. artistas e atletas mais talentosos são também os\n21. ______ mais se preparam para as suas atividades.\n\n22. Escrever bem, na minha visão, é uma habilidade\n23. adquirida. E está ao alcance de qualquer pessoa. Basta\n24. querer, tentar e praticar muito. Escreve bem quem\n25. pensa bem. Escreve bem quem lê bastante. Escreve\n26. bem quem escreve, reescreve e tem humildade para se\n27. corrigir, para cortar palavras, para procurar os termos\n28. mais adequados à mensagem que deseja transmitir.\n\n29. Simples assim. E a simplicidade é ______ para a boa\n30. comunicação. Em primeiríssimo lugar, o que você quer\n31. dizer e para quem. Um dos meus primeiros professores\n32. de Jornalismo, o saudoso Ernesto Corrêa, dizia:\n\n33. — Lembre-se que você está escrevendo para ele (o\n34. leitor).\n\n35. Se a pessoa do outro lado da mensagem não\n36. entendeu o que você quis transmitir, é a mensagem\n37. que precisa ser adequada ao entendimento dela. Mario\n38. Quintana estava brincando ao dizer que quando\n39. alguém pergunta a um autor o que ele quis dizer é\n40. _____ um dos dois é burro.\n\n41. O poeta não conheceu esse nosso mundo de redes\n42. sociais. Hoje, quando alguém escreve e o outro fica em\n43. dúvida, o burro é sempre o corretor ortográfico.\n\nAdaptado de: SOUZA, Nílson. O dom do esforço. Disponível em: https://gauchazh.clicrbs.com.br/colunistas/nilson-souza/noticia/2021/05/o-dom-do-esforco-ckom0699700a1018matwrei68.html. Acesso em: 05 set. 2021.", "p2021-06-ps44:t1": "01. Várias vezes eu evoquei, nesta coluna, o prazer que\n02. todos sentimos no momento em que vislumbramos,\n03. através do opaco véu que encobre _____ palavras,\n04. uma semelhança ou um parentesco que jamais tínhamos\n05. percebido. O multitalentoso Alberto Savinio, irmão do\n06. conhecido pintor De Chirico, registrou, comovido, o\n07. momento em que sua filhinha de cinco anos viu se abrir\n08. diante dela, pela primeira vez, esta caverna de tesouros\n09. infinitos, ao se dar conta de que os fiammiferi (\"fósforos\",\n10. em Italiano) tinham esse nome porque \"trazem uma\n11. chama\" (fiamma).\n\n12. Diz ele: \"Em seus olhinhos dourados senti brilhar\n13. uma nova luz, primeiro reflexo de uma compreensão\n14. mais sólida das coisas, de uma felicidade emanada da\n15. razão\". E continua: \"A descoberta etimológica é uma\n16. iluminação. Ela nos dá a impressão (ou a ilusão) de\n17. tocar na Verdade com as mãos – e daí nos vem este\n18. raro prazer\".\n\n19. Ao rosário iniciado por fiammiferi, suponho que vieram\n20. se acrescentar _____ contas inflamar, inflamável e\n21. inflamação, todas nascidas da mesma flama (o termo\n22. latino para chama). E depois certamente ela viu passar\n23. alguma Ferrari, desfilando o seu vermelho flamante,\n24. provado alguma iguaria flambada na nobre chama do\n25. conhaque ou ouvido algum padre falar na espada\n26. flamejante que impedia o acesso ao Paraíso.\n\n27. Como todos os que leem esta coluna, eu também\n28. tive o meu \"Abre-te, Sésamo\" etimológico. Andava eu\n29. pela casa dos oito anos quando meu pai apareceu em\n30. casa com um exemplar de O Guarani, impresso em\n31. papel de segunda e ostentando uma capa de terceira.\n32. Para mim, foi um amor _____ primeira vista que muitas\n33. marcas deixou.\n\n34. Pois é a este livro que devo a minha \"iluminação\n35. etimológica\": a folhas tantas, quando a mãe de Peri\n36. vem tentar convencê-lo a sair da propriedade dos brancos\n37. e voltar para sua aldeia natal, ele recusa. Ela então se\n38. afasta lentamente: \"Peri seguiu-a com os olhos até que\n39. desapareceu na floresta; esteve a correr, chamá-la e\n40. partir com ela. Mas o vento lhe trazia a voz argentina\n41. de Cecília que falava com seu pai; ficou\". Que diabos\n42. seria isso? A palavra argentino era bastante usada por\n43. minha avó, que tinha lá suas diferenças com os portenhos\n44. e praguejava contra eles sempre que tinha\n45. oportunidade. Mas voz argentina? E logo na imaculada\n46. Ceci? Nunca uma palavra tinha me chamado tanto a\n47. atenção; recorri ao dicionário, à enciclopédia, ao Lelo\n48. Universal, aos tios, à mãe professora, _____ colegas\n49. da mãe professora e aos anciãos da vizinhança e\n50. descobri que tudo vinha de argentum (\"prata\", no\n51. Latim), e que os espanhóis tinham dado a esta nova\n52. conquista o nome de Argentina porque ainda não\n53. sabiam que o grosso da prata vinha do Peru, mas\n54. acertadamente chamaram de Rio da Prata o curso\n55. d'água por onde escoava a produção deste metal, e\n56. que por isso a prata era Ag na tabela periódica, e que\n57. não por acaso \"dinheiro\", em Francês, é argent, e\n58. argentário é o dinheirista, e que uma voz argentina,\n59. como a de Ceci, tinha o timbre fino como o da prata.\n60. Bem, mas aí já era irremediável: como Ali Babá, fascinado,\n61. eu tinha descoberto a entrada do tesouro.\n\nAdaptado de: MORENO, Claudio. \"Iluminação etimológica\": o fascínio da descoberta das palavras. Disponível em: https://gauchazh.clicrbs.com.br/colunistas/claudio-moreno/noticia/2019/10/iluminacao-etimologica-o-fascinio-da-descoberta-das-palavras-ck2dyyhr40bc801n3bj3f0pl4.html. Acesso em: 05 set. 2021.", "p2021-07-ps66:t1": "01 Uma das melhores pessoas com as quais já trabalhei\n02 na vida, hoje uma grande amiga, acabou de se formar.\n03 É um alento saber que, para ela, o diploma na mão\n04 realmente é tão somente um marco em uma jornada\n05 muito maior e durante a qual ela fez tudo certo.\n\n06 Por entender que fazer faculdade era apenas uma\n07 parte de sua formação profissional, ela estudou dois\n08 idiomas, começou _____ trabalhar cedo para entender\n09 como o mundo real funciona e para se capitalizar,\n10 participou de vários congressos e seminários, manteve\n11 a cabeça aberta e sempre dialogou com profissionais\n12 de diversos setores, cercou-se de pessoas com idades,\n13 bagagens culturais e socioeconômicas distintas, fez\n14 intercâmbio e conheceu vários países por saber que\n15 isso também era investir em sua carreira e em seu\n16 crescimento pessoal. Hoje, é dona de seu próprio\n17 negócio, com uma carteira de clientes respeitável e\n18 futuro promissor.\n\n19 No entanto, aposto que centenas de outros jovens\n20 que se formaram na universidade _____ pouco tempo\n21 se encontram na desesperadora situação de estar com\n22 o tão sonhado diploma de ensino superior na mão,\n23 enquanto _____ realidade não lhe dá o mínimo valor.\n24 Eu me solidarizo profundamente com quem comprou a\n25 ilusão de que ter uma graduação em um curso superior\n26 bastava e era o melhor – talvez o único – caminho para\n27 um futuro garantido. Certamente não é: há uma série\n28 de habilidades, de conhecimentos, de preparo que só\n29 adquirimos fora da universidade e até mesmo antes\n30 dela.\n\n31 Muitos adultos ainda insistem em vender aos\n32 adolescentes a ideia ultrapassada de que o caminho\n33 para o sucesso e _____ realização profissional passa\n34 necessariamente pelo vestibular e por cinco longos\n35 anos de faculdade. No final, restam endividamento e\n36 um canudo que talvez tenha pouco significado diante\n37 de todas as mudanças que ocorreram no mundo e no\n38 mercado de trabalho nesse meio tempo.\n\n39 É necessário que se busque uma abordagem mais\n40 responsável e realista no que se refere ao futuro\n41 profissional dos jovens.\n\n42 O diploma de graduação, em si, não é nem fim nem\n43 começo: é apenas parte do caminho. Quem entender\n44 isso terá mais resiliência e preparo para lidar com o que\n45 cada segunda-feira (e cada crise) trouxer pela frente.\n\nAdaptado de: SOLDATELLI, C. Disponível em: <https://gauchazh.clicrbs.com.br/pioneiro/colunistas/candice-soldatelli/noticia/2021/08/diploma-na-mao-realidade-na-cara-cksrgzwk1001v013bg2bjhwya.html>. Acesso em: 27 nov. 2021.", "p2021-07-ps66:t2": "01 Em nossa turma de basquete temos um colega que\n02 é conhecido simplesmente como Carioca: \"Vai lá,\n03 Carioca! Grande cesta, Carioca!\". Isso me inspira uma\n04 melancólica reflexão. Se eu for ao Rio de Janeiro e me\n05 convidarem para jogar basquete (altamente impro-\n06 vável), ninguém dirá: \"Vai lá, Porto-Alegrense! Grande\n07 cesta, Porto-Alegrense!\". Claro que minhas cestas são ra-\n08 ridade: como o cometa Halley, elas só surgem de 76\n09 em 76 anos. Entretanto mesmo assim ninguém de\n10 nossa cidade seria chamado de \"Porto-Alegrense\" por\n11 esse Brasil afora. \"Gaúcho\", sim. Existe uma identidade\n12 gaúcha, solidamente apoiada nas tradições de nosso\n13 Estado. Todo mundo sabe quem é o gaúcho. E, em\n14 termos de cidades, todo mundo sabe quem é o\n15 paulista, por exemplo. Mas quem é o porto-alegrense?\n\n16 Como nativo de Porto Alegre, confesso que não\n17 tenho uma resposta satisfatória para isto. A dificuldade\n18 maior é caracterizar a cultura porto-alegrense. A cultura\n19 do Rio de Janeiro inclui a praia, o bar, a favela; a cultura\n20 de São Paulo inclui o executivo, a avenida Paulista, a\n21 competição. E a cultura porto-alegrense? Aí vem a\n22 dificuldade. O que caracteriza, exatamente, a cidade?\n23 A Rua da Praia? Todo mundo sabe que a Rua da Praia\n24 já não é a mesma. Os crepúsculos, quem sabe?\n\n25 Mas temos, sim, uma identidade porto-alegrense.\n26 Só que ela não se revela facilmente. O porto-alegrense\n27 se caracteriza não exatamente pelo que é, mas pelos\n28 lugares aonde vai (o Brique da Redenção, os parques,\n29 a Usina do Gasômetro), pelo jeito que fala, e que foi\n30 codificado pelo Luís Augusto Fischer em seu dicionário.\n\n31 Em suma, é uma identidade que tem de ser procu-\n32 rada: nas ruas da Cidade Baixa, nos bares da avenida\n33 Goethe, nos restaurantes de rodízio, na Vila do IAPI,\n34 entre muitos outros lugares. O porto-alegrense é um\n35 agente secreto de sua cidade, alguém que continua,\n36 sim, admirando o sol a se pôr sobre o Guaíba.\n\nAdaptado de: SCLIAR, M. Quem és tu, porto-alegrense? Disponível em: <https://gauchazh.clicrbs.com.br/colunistas/moacyr-scliar/noticia/2017/03/quem-es-tu-porto-alegrense-9750783.html>. Acesso em: 27 nov. 2021.", "p2022-01-ps08:t1": "01 A área onde estamos abrindo a pista é singular. No\n02 tempo das águas ela fica alagada, mas na seca mostra\n03 uma camada compacta de areia com uns quarenta\n04 centímetros de ____, sobre outra camada de cascalho.\n05 Isto numa extensão de mais de um quilômetro. A super-\n06 fície é plana e toda coberta de uma vegetação mirrada,\n07 própria de terreno ____. O fogo que pusemos no capim\n08 seco no dia da chegada para descobrir o terreno está\n09 se alastrando terrivelmente pelo cerrado. Tivemos de\n10 fazer _____ pressas um aceiro e pôr fogo de encontro\n11 para evitar que atingisse o próprio acampamento. Outro\n12 contratempo pode surgir, e isto nos preocupa: a fumaça\n13 pode alertar o índio distante de que há intrusos nos\n14 seus domínios. À noite a fumaça nos obrigou a\n15 abandonar as redes. Na noite anterior, não foi a\n16 fumaça, foi uma onça, que resolveu nos visitar. O\n17 barulho do fogo e a fumaça impediram os cachorros de\n18 pressenti-la. O seu rasto, contudo, lá estava quase\n19 entre as redes.\n\n20 O dia hoje logo cedo nos premiou com uma enorme\n21 anta, que, caminhando distraída, enveredou pelo\n22 acampamento. Surpreendida, quis retroceder, mas foi\n23 abatida por um tiro certeiro. Bom reforço para variar o\n24 cardápio, que vinha sendo só de peixe.\n\n25 O fogo continua violento. Já saltou o rio em diversos\n26 pontos. O capim seco é um chamariz, e o vento, um\n27 veículo certo.\n\n28 O rádio vem informando que a bruma seca insiste\n29 em cortar a ligação aérea Mortes-Xingu. Um dos\n30 trabalhadores informou hoje pela manhã que, bem\n31 cedo, ouvira repetidos gritos vindos do outro lado do\n32 rio. Os cachorros, por seu lado, fizeram esta noite um\n33 grande alarido, mas é bem possível que tenha sido uma\n34 anta ou uma onça atrevida.\n\n35 Na noite seguinte, logo cedo uma onça esturrou tão\n36 perto que os cachorros levaram um susto. Despertados,\n37 acuaram-__ a menos de cinquenta metros. Aflita,\n38 ela não teve outra saída senão subir numa árvore\n39 inclinada. Quando chegamos, pudemos vê-__ arriada\n40 nas patas dianteiras, pronta, mas sem coragem para o\n41 salto que ___ ameaçava.\n\nAdaptado de: VILLAS BÔAS, O.; VILLAS BÔAS, C. A marcha para o oeste: a epopeia da Expedição Roncador-Xingu. São Paulo: Companhia das Letras: 2012.", "p2022-01-ps08:t2": "01 Carolina baixou o quebra-sol do teto do carro. No\n02 espelhinho, viu a própria boca, cor de laranja, combi-\n03 nando com os detalhes em laranja e azul do adereço\n04 da cabeça em forma de serpente. Mostrou os dentes à\n05 busca de manchas, não encontrou, ergueu o quebra-sol.\n06 O caminho pelas ruas do bairro até o ponto de encontro\n07 para a saída do bloco estava congestionado, duas filas\n08 de carros, e Sérgio havia pedido para não abrir as\n09 janelas por causa do ar, e só por isso ela não estava\n10 pendurada para fora da janela, de braços abertos,\n11 cantando a marchinha e a bateria que já escutavam ao\n12 longe. Virou para Sérgio, no banco do motorista, estava\n13 batendo os dedos na direção fora do ritmo distante do\n14 samba.\n\n15 – Estou bonita?\n\n16 Ele deu um sorriso.\n\n17 – Feito uma rainha.\n\n18 Carolina deu a mão a ele. Havia se oferecido para\n19 fazer outra fantasia, de Júlio César, para que ele usasse\n20 e fossem juntos ao carnaval. Ele dissera que não, não\n21 gostava de multidões, queria descansar no feriado. Mas\n22 se dispôs a levá-la.\n\n23 – Vem comigo – ela pediu uma última vez.\n\n24 Ele fez um carinho no joelho dela.\n\n25 – Sou velho pra essas coisas.\n\n26 – Não é nada.\n\n27 – E nem estou fantasiado.\n\n28 Carolina puxou o elástico de trás da cabeça, ergueu\n29 a máscara de penas pretas e enfiou-a nele. Ajeitou-a\n30 nos olhos cansados. O carro atrás deles buzinou, a fila\n31 andara meia quadra. Sérgio engatou a marcha e\n32 percorreu devagar o trajeto. Pararam novamente. Ele\n33 se olhou no retrovisor.\n\n34 – E o que sou, de máscara, calça de abrigo, tênis e\n35 camiseta?\n\n36 Ela se esticou para beijá-lo na face.\n\n37 – Meu namorado.\n\nAdaptado de: WOLFF, R. Fim de festa. Porto Alegre: Não Editora, 2018.", "p2022-03-ps20:t1": "01. Elisabeth II viria a ser a sexta mulher a ser rainha\n02. da Inglaterra. Seu reinado viria também a ser marcado\n03. pela primeira mulher a desempenhar o cargo de\n04. primeira-ministra, Margareth Thatcher.\n\n05. Quando Elisabeth II se tornou rainha, ____ 6 de\n06. fevereiro de 1952, a Inglaterra começava a sair das\n07. crises econômico-sociais resultantes das profundas\n08. feridas deixadas pela Segunda Guerra Mundial, durante\n09. a qual o país tinha sido duramente castigado pelos\n10. bombardeios alemães. Os racionamentos somente\n11. viriam a acabar em torno de 1955, mas os horizontes,\n12. então ainda nublados pela guerra fria, na qual os ingleses\n13. ficaram ao lado dos Estados Unidos, já começavam a\n14. se desanuviar.\n\n15. Os longos anos do reinado de Elisabeth II, que\n16. abarcaram metade do século XX e já adentram o século\n17. XXI, viram chegar o progresso tecnológico, as viagens\n18. espaciais, a era da informática, a era das comunicações\n19. eletrônicas, os satélites, os progressos da medicina, a\n20. clonagem da ovelha Dolly, a queda do muro de Berlim\n21. e a dissolução da União Soviética, o terrorismo do IRA\n22. e o Bloody Sunday de 30 de janeiro de 1972, a rápida\n23. perda das colônias, a Guerra das Malvinas, a desvalo-\n24. rização da libra esterlina, a consolidação da União\n25. Europeia com o Euro, a morte da mãe e fiel compa-\n26. nheira de Elisabeth II, a rainha-mãe, aos 102 anos de\n27. idade em 2002, o divórcio do Príncipe de Gales e da\n28. Princesa Diana, a morte da princesa Diana e o fim do\n29. caráter insular da Inglaterra, com a construção do túnel\n30. sob o Canal da Mancha, inaugurado em 1994. Com o\n31. túnel, de certo modo, fecha-se o círculo que começou,\n32. nos tempos ____ a Inglaterra ainda era ligada ao\n33. Continente, permitindo aos povos celtas livre trânsito\n34. entre o que é agora o continente europeu e a Inglaterra.\n35. A tudo isso Elisabeth II parece assistir com um certo\n36. estoicismo, talvez próprio de quem tenha visto o pior\n37. nos duros anos de sua adolescência, quando ____\n38. bombas alemãs sobre Londres e sobre a Inglaterra.\n\n39. Também veria Elisabeth II notáveis datas comemo-\n40. rativas, como, em 1964, o quarto centenário do nasci-\n41. mento de Shakespeare (1564-1616), celebrado com\n42. edições especiais de suas obras e com grandes festivi-\n43. dades; afinal, diz-se que Shakespeare traz mais divisas\n44. ____ Inglaterra do que toda a pompa e circunstância\n45. da monarquia.\n\nAdaptado de: FUNCK, E. Breve história da Inglaterra. Porto Alegre: Movimento\\Edunisc, 2012.", "p2023-03-ps09:t1": "01. \"Estive em 2050 e voltei\", foi o sentimento que me\n02. invadiu depois de quase duas semanas no Japão, onde\n03. estive em breve turnê para o lançamento de meu livro\n04. Torto Arado.\n\n05. Primeiro, porque, de fato, caminhamos para o futuro\n06. quando nos dirigimos ao Extremo Oriente, afinal eles\n07. estão 12 horas ____ frente (enquanto escrevo este\n08. texto na noite de quinta, na terra do sol nascente já é\n09. manhã de sexta). Segundo: desconheço outro país tão\n10. entranhado – e dependente – nos avanços tecnológicos\n11. proporcionados pela criação humana.\n\n12. Uma ida à \"kombini\" (descobri que a palavra vem\n13. do inglês \"convenience store\") com caixas automatizados,\n14. onde é possível pagar e recolher seu troco apenas com\n15. a mediação de máquinas, nos dá ____ medida dessa\n16. dependência. Até mesmo uma simples ida ao banheiro,\n17. com seus vasos sanitários inteligentes que existem em\n18. quase todos os espaços do país – universidades e locais\n19. públicos, por exemplo –, projetam a ilusão de que o\n20. Japão é o futuro.\n\n21. É muito curiosa a presença de palavras de origem\n22. inglesa na língua japonesa, como \"kombini\", \"biru\"\n23. (\"beer\") e \"aisukurimu\" (\"ice cream\"), provavelmente\n24. advindas da longa ocupação americana em terras nipô-\n25. nicas.\n\n26. Olhamos para qualquer lado de Tóquio e encontramos\n27. seu horizonte infinito de concreto. Edifícios inteligentes,\n28. elevadores ultrarrápidos que alcançam o topo em\n29. segundos, veículos com portas automáticas para\n30. embarcar e desembarcar sem que o passageiro precise\n31. acionar qualquer botão.\n\n32. A região metropolitana da capital, a mais populosa\n33. do mundo, reúne cerca de 37 milhões de pessoas, ou\n34. seja, maior que a população de muitos países e equivalente\n35. ____ do Canadá. Mesmo com um contingente\n36. populacional expressivo, Tóquio é uma cidade segura,\n37. o transporte público é eficiente e pontual e sofre menos\n38. congestionamentos que a Cidade do México ou São\n39. Paulo.\n\n40. O silêncio nos transportes e espaços públicos impressiona,\n41. como também salta aos olhos a impecável limpeza\n42. de suas ruas sem lixeiras. Cada um é responsável por\n43. seus resíduos, levados para casa, separados e entregues\n44. ao serviço de coleta. Há canteiros de obras por toda a\n45. parte, mas são tão discretos que é difícil identificar num\n46. primeiro plano.\n\n47. Sempre fui leitor – e apreciador – de crônicas de\n48. viagem. As crônicas de viagem podem ser importantes\n49. instrumentos para se conhecer o outro e exercer ____\n50. alteridade. Podem nos ensinar maneiras de coexistir,\n51. com diligência e respeito.\n\n52. Esse encontro com o outro – outro mundo, outros\n53. humanos, outras paisagens – são oportunidades de sair\n54. do espaço familiar e conhecido para penetrar o mistério\n55. do desconhecido. Talvez por isso, conserve essa paixão\n56. pela literatura: ler é como viajar e encontrar o novo, é\n57. reencontrar o familiar. Viajando e lendo, não vamos\n58. apenas escrutinar o diferente, mas encontrar e conhecer\n59. a nós mesmos.\n\nAdaptado de: VIEIRA JUNIOR, I. Ler e viajar permitem encontrar o novo e conhecer a nós mesmos. Disponível em: <https://www1.folha.uol.com.br/colunas/itamar-vieira-junior/2023/04/ler-e-viajar-permitem-encontrar-o-novo-e-conhecer-a-nos-mesmos.shtml>. Acesso em: 28 abr. 2023.", "p2023-07-ps43:t1": "01. \"Alguém afirmou recentemente que, ao desenvolver\n02. projetos de inteligência artificial, nós estamos evocando\n03. o demônio\", mencionou o matemático e filósofo da\n04. ciência John Lennox, professor emérito na Universi-\n05. dade de Oxford, em entrevista.\n\n06. Lennox é evangélico e ganhou destaque para além\n07. de seus campos de estudo ao debater religião com\n08. cientistas ateus, incluindo seu colega de universidade,\n09. o biólogo Richard Dawkins. Seu último livro, intitulado\n10. em referência ____ famosa distopia \"1984\", é \"2084:\n11. inteligência artificial e o futuro da humanidade\" (em\n12. tradução livre).\n\n13. Lennox critica a ideia de que a religião é contrária\n14. ____ ciência e vice-versa. \"É muito fácil dizer que as\n15. ciências naturais são limitadas, na medida em que não\n16. respondem a perguntas simples que uma criança faz,\n17. como: de onde nós viemos? E qual é o significado da\n18. existência?\", ele diz. \"A ciência desmonta ____ coisas\n19. para entender como funcionam e, suponho, para\n20. entender do que são feitas. A religião as reúne para ver\n21. o que significam\".\n\n22. Um dos argumentos do livro \"2084\" é que a ciência\n23. está se transformando em religião. \"A ciência é mara-\n24. vilhosa\", ele argumenta, \"mas ela está limitada ____\n25. perguntas que pode responder... Infelizmente, nos\n26. últimos anos, vem se desenvolvendo uma crença na\n27. ciência que chamamos de ‘cientismo’. Nele, a ciência é\n28. vista, sobretudo, como o único caminho para a verdade\n29. e todo o resto é considerado contos de fadas\".\n\n30. Lennox chama a atenção, por exemplo, para como\n31. a falta de referência moral afeta negativamente o\n32. desenvolvimento científico. Ele cita o trabalho do\n33. filósofo Nick Bostrom, que fundou o Instituto do Futuro\n34. da Universidade de Oxford. Para Bostrom, aliviar a\n35. pobreza global não deve ser uma prioridade porque,\n36. apesar de essas ações produzirem uma sensação de\n37. bem-estar, elas não são eficientes. \"Isso é devastador\",\n38. diz Lennox, \"porque é uma negação completa do\n39. princípio moral altruísta fundamental\".\n\n40. Lennox enfatiza o significado da palavra \"artificial\"\n41. no termo \"inteligência artificial\" como algo que não\n42. é verdadeiro. Inteligência artificial seria o mesmo que\n43. inteligência falsa, porque, ele argumenta, não existe\n44. inteligência sem consciência. \"Como poderíamos dizer\n45. que um computador terá consciência se não temos\n46. ideia do que a consciência é? Ninguém com quem\n47. eu conversei ou li tem a menor ideia do que seja a\n48. consciência.\"\n\n49. É intrigante observar um evangélico como Lennox\n50. denunciar o quanto a superstição e a crença podem\n51. influenciar a ciência. E observar ainda como o campo\n52. religioso é complexo e pode ser erudito, apesar da\n53. atitude voluntária ou involuntária de quem defende a\n54. ciência de apresentar religiosos apenas como negacio-\n55. nistas ou terraplanistas.\n\nAdaptado de: SPYER, J. A inteligência artificial é um novo Deus? Disponível em: <https://www1.folha.uol.com.br/colunas/juliano-spyer/2023/12/a-inteligencia-artificial-e-um-novo-deus.shtml>. Acesso em: 12 dez. 2023.", "p2023-07-ps43:t2": "01. É inegável que mulheres historicamente enfrentaram\n02. preconceito para adentrar no campo artístico. Nas últimas\n03. décadas, tem havido esforço louvável para valorizar a\n04. produção feminina, mas é preciso cuidado para não\n05. cair em novos radicalismos sectários.\n\n06. Um exemplo recente é o das listas de leituras\n07. obrigatórias para as provas do vestibular da Universi-\n08. dade de São Paulo (USP) a serem realizadas entre 2026\n09. e 2028, que, pela primeira vez, serão constituídas\n10. apenas por obras escritas por mulheres, conforme a\n11. Folha revelou.\n\n12. De fato, há disparidade de gênero notável nas\n13. leituras exigidas pelas cinco instituições de ensino\n14. superior mais bem colocadas no Ranking Universitário\n15. da Folha (RUF) que fazem uso de listas do tipo – USP,\n16. Unicamp, UFSC, UFRGS e UFPR.\n\n17. Segundo levantamento feito por este jornal, das\n18. 178 obras pedidas desde o final dos anos 1980, 146\n19. foram escritas por homens e somente 29 por mulheres.\n\n20. A USP é a instituição com maior predomínio masculino\n21. no período pesquisado, não tendo adotado parcela de\n22. obras de escritoras maior que os 22,2% do próximo\n23. ano. Já a UFSC foi a primeira a escolher 50% de livros\n24. de mulheres, em 2017 – igualdade repetida em 2020,\n25. 2021 e 2023. Também a UFRGS mantém 50% desde\n26. 2021.\n\n27. O fato é que a saudável busca por maior diversidade\n28. de autores e autoras não justifica retirar das listas de\n29. leitura apresentadas aos estudantes nomes do cânone\n30. literário – como, para ficar em um exemplo óbvio,\n31. Machado de Assis, o maior escritor brasileiro.\n\n32. Cânones são construções históricas, decerto, que\n33. mudam ao longo do tempo não por imposição militante\n34. e sim por meio de análises da crítica e da academia,\n35. que devem observar aspectos estéticos.\n\n36. A lista da USP revela um fenômeno problemático em\n37. voga na pesquisa universitária: a valorização de\n38. abordagens políticas, em detrimento da propriamente\n39. literária.\n\n40. Pesquisadores como o americano Harold Bloom\n41. e o italiano Italo Calvino apontam a importância da\n42. contemplação estética para o estímulo da imaginação\n43. e do autoconhecimento do indivíduo – e também o\n44. papel dos clássicos, obras que perduram por séculos e\n45. influenciam gerações por conterem alegrias e dores\n46. universais.\n\n47. Uma lista de leituras que não leve em conta tais\n48. aspectos desvaloriza ferramentas fundamentais para a\n49. formação literária e humanística dos estudantes\n50. brasileiros.\n\nAdaptado de: FOLHA DE SÃO PAULO. Editorial. 09 dez. 2023. Disponível em: <https://www1.folha.uol.com.br/opiniao/2023/12/vestibular-feminista.shtml>. Acesso em: 12 dez. 2023.", "p2023-07-ps71:t1": "01. Desde muito cedo, de criancinhas ___ adolescentes,\n02. aprendemos na escola uma porção de lições de língua\n03. portuguesa. Do “bê a bá” lá dos primeiros anos da\n04. alfabetização até as orações subordinadas mais terrificantes\n05. do ensino médio, somos sempre levados ___\n06. crer que, se aprendemos só o português na escola,\n07. então essa é a única língua falada no país. Reside aí,\n08. no entanto, um mito gigantesco!\n\n09. O que queremos dizer é que, embora hoje se ensine\n10. somente o português e algumas outras línguas estrangeiras\n11. na escola, nosso país é multilíngue! E esse\n12. multilinguismo tem raízes muito profundas e antigas,\n13. que remontam ___ muito antes da história da própria\n14. colonização e implantação do português no Brasil.\n\n15. Como sabemos, antes da chegada dos portugueses\n16. ___ terras brasileiras, já vivia aqui um sem-número de\n17. indígenas. Há estimativas, por exemplo, de que vivia\n18. no Brasil à época do “descobrimento” uma população\n19. estimada entre seis e nove milhões de indígenas, que\n20. falava cerca de 1.200 línguas distintas. Dá para ver,\n21. portanto, que, muito antes da colonização, o Brasil já\n22. era um país multilíngue, local onde conviviam povos\n23. falantes de línguas muito diversas e cenário de um\n24. intenso intercâmbio linguístico.\n\n25. Essa situação de multilinguismo se alterou, mas não\n26. ficou menos complexa depois da colonização. Se, por\n27. um lado, centenas de povos indígenas (com suas\n28. línguas) foram exterminados ao longo dos últimos\n29. cinco séculos, por outro lado, centenas de comunidades\n30. de imigrantes se estabeleceram por todo o território\n31. brasileiro, ao longo dos últimos dois séculos, introduzindo\n32. no país cerca de duas dezenas de novas línguas.\n33. O grande processo de migração que teve lugar em\n34. nosso país deu-se de forma violenta e impositiva para\n35. as pessoas africanas escravizadas, que aqui chegaram\n36. a partir de 1532, e de forma voluntária para muitos\n37. europeus e asiáticos – a maioria dos quais fugindo de\n38. uma situação de pobreza ou de guerras – que vieram\n39. para o Brasil, a partir da primeira metade do século XIX.\n40. A convivência entre africanos, europeus e asiáticos,\n41. juntamente com os povos indígenas que já habitavam\n42. o país, contribuiu para a formação de uma situação de\n43. constante multilinguismo ao longo dos séculos.\n\n44. E as línguas indígenas resistem até hoje. Embora\n45. tenham sido faladas, como vimos, mais de mil línguas\n46. indígenas no passado, ainda hoje temos muitos\n47. idiomas sendo falados em nosso país: são faladas\n48. atualmente, aqui no Brasil, cerca de 170 línguas indígenas,\n49. de diferentes povos, de diferentes regiões do país,\n50. e não apenas aquelas línguas instrumentalizadas pelo\n51. ensino escolar. Essa história de que nosso país é\n52. monolíngue, portanto, não passa de um mito capenga,\n53. uma birutice sem fim, fruto de um processo de genocídio\n54. e silenciamento dos povos indígenas e de suas línguas,\n55. que já dura mais de cinco séculos.\n\nAdaptado de: D’ANGELIS, W. R.; FELIPE, P. H. Línguas indígenas e diversidade linguística no Brasil. Roseta, v. 2, n. 1, 2019.", "p2023:t1": "01. “Você não vai lá na tapera se despedir?”, o Pedro\n02. perguntou.\n\n03. “Despedir de quem?”\n\n04. O Pedro, naquela hora, parecia o avô Lindolfo.\n\n05. “Eu vou”, ele continuou, “e vai ser agora mesmo.”\n\n06. “Vou contigo”, eu disse e saltei da cama.\n\n07. Nunca mais eu ia ver a tapera, nem chupar as\n08. bergamotas e as laranjas que lá eram mais doces por\n09. causa da terra gorda do canhadão. No outro dia, assim\n10. que saía o sol, a gente pegava o estradão e se ia\n11. embora. O meu irmão tinha ajeitado tudo, era só armar\n12. a nossa barraca e viver no acampamento, junto com os\n13. outros, feito cigano.\n\n14. Saímos de casa sem fazer barulho, pisando na ponta\n15. dos pés. Era noite de lua cheia, de céu estrelado. Pra\n16. mim, cada pedaço da estradinha de chão batido tinha\n17. uma história.\n\n18. “Aqui”, pensei, “aqui eu caí do Petiço, que era um\n19. matungo velho e que nem prestava mais pra puxar o\n20. arado.” Eu tinha ido em casa buscar água fresca pro\n21. pessoal que estava na roça. Na volta, ia assobiando, o\n22. cavalo andava no tranco lá dele, a rédea solta e tudo,\n23. tão manso que ele era. O Petiço estava cansado de\n24. viver. Tinha um olho cego e os cascos estropiados.\n25. Essa minha mão direita segurava um pão de milho com\n26. melado; a outra, o garrafão de água. Não se sabe o\n27. que assustou o Petiço. Pode ser que um lagarto. Ou\n28. uma cobra. Ou, como eu ele também resolveu corco-\n29. vear, correr sozinho pela estrada sem peso nenhum\n30. _____? Ele empinou, eu tentei segurar as crinas, mas caí\n31. de cabeça na estrada e desmaiei. Acordei um tempo\n32. depois, na cama. Olhei pros lados e vi muita gente: o\n33. pai, a mãe, as irmãs, o Pedro, os vizinhos.\n\n34. “Nossa Senhora me ouviu”.\n\n35. “Esse é dos bons.”\n\n36. “Não precisa mais de médico.”\n\n37. “O que foi?”, eu perguntei.\n\n38. “O cavalo chegou na roça sozinho. Saltei no lombo\n39. dele e me vim atrás de ti. Te encontrei _____ no chão,\n40. no meio do mato, meio que morto. Agora eu ia te levar\n41. pra Pau-d’Arco pra ver um médico”, disse o pai.\n\n42. “_______ a minha mão?”, perguntou Arnaldo, o\n43. vizinho e ______ do pai.\n\n44. Sentei na cama e olhei pra mão dele e vi os dedos\n45. grossos e as unhas sujas, a palma toda rachada.\n\n46. “Vejo sim”, eu disse e fui me levantando.\n\n47. “Não, senhor”, disse a mãe e me empurrou de volta\n48. pro colchão. “Hoje não. Já é noite mesmo, pode ficar\n49. aí até amanhã.”\n\n50. Eu não lembrava do que tinha acontecido desde a\n51. hora do tombo, antes do meio-dia, até a hora em que\n52. acordei com todos eles ao redor da minha cama. Um\n53. dia que saiu da minha cabeça foi esse.\n\nAdaptado de: KIEFER, C. Quem faz gemer a terra. 3ª ed. Porto Alegre: Mercado Aberto, 1993.", "p2023:t2": "01. No pós-guerra e por toda a década de 1950, é muito\n02. comum que as moças de classe média que trabalham\n03. ou estudam interrompam essas atividades com o casa-\n04. mento. Como observou o sociólogo Emílio Willems em\n05. 1954: “apesar do fato de que as mulheres podem,\n06. agora, escolher entre várias possibilidades profissio-\n07. nais, ainda há poucas mulheres, no Brasil, que seguem\n08. alguma carreira”. Para a maioria esmagadora delas, o\n09. casamento está em primeiro plano e nem estudos nem\n10. profissão fazem com que ele seja adiado ou rejeitado.\n11. Ao longo dos Anos Dourados, é comum ouvir que carreira\n12. e matrimônio são inconciliáveis. As mulheres encon-\n13. tram muitas barreiras ao tentar prosseguir com os\n14. estudos universitários ou investir em uma profissão.\n15. Invariavelmente, seu trabalho profissional será consi-\n16. derado bem menos relevante que o do chefe da família.\n\n17. Pais e maridos de classe média chegam ___ se\n18. envergonhar por terem filhas ou esposa trabalhando\n19. fora do lar. Outros, porém, diante das pressões econô-\n20. micas, deixam de fazer objeções ___ que suas mulheres\n21. tenham empregos que não o de professora, e não só\n22. permitem o trabalho das filhas solteiras como muitas\n23. vezes o incentivam. Assim, várias moças dessa classe\n24. social entram no mercado de trabalho “para ajudar a\n25. família” nas questões financeiras, e outras, simples-\n26. mente para adquirir maior independência. Porém, nos\n27. anos 1950, é bem mais difícil encontrar mulheres casa-\n28. das dessa classe social trabalhando fora; é preferível\n29. que elas se dediquem inteiramente ao lar e “se preser-\n30. vem da rua”.\n\n31. O controle exercido por maridos, pais e irmãos\n32. sobre as mulheres diminui consideravelmente quando\n33. elas trabalham fora de casa. Contudo, ou por isso\n34. mesmo, elas devem cuidar de sua reputação compor-\n35. tando-se de maneira ___ não “reduzir as oportunidades\n36. para o casamento” ou desagradar o marido. Observando\n37. suas contemporâneas, Emílio Willems alerta contra con-\n38. clusões apressadas, como a de que “as mulheres brasilei-\n39. ras gozam ou desejam gozar o grau de liberdade que é\n40. comum em outras partes do Ocidente”.\n\n41. As mudanças que vão se operando na sociedade\n42. nos 15 anos que se seguem ao término da Segunda\n43. Guerra Mundial afetam, de vários modos, as relações\n44. de gênero estabelecidas. Ao lado da emancipação\n45. feminina em curso convivem – nem sempre pacifica-\n46. mente, nem sempre em estado de guerra –, visões\n47. tradicionais dos papéis masculinos e femininos. Algu-\n48. mas instituições conservadoras colocam restrições ___\n49. dedicação ao estudo e ____ profissionalização das\n50. mulheres. Já o cinema, embora divulgue um modelo\n51. tradicional de esposa, também traz imagens de países\n52. estrangeiros (EUA, França, Itália, etc.) em que a parti-\n53. cipação feminina no mercado de trabalho é vista com\n54. maior naturalidade.\n\n55. A classe média acabará aceitando e valorizando o\n56. trabalho feminino fora de casa, afinal o capitalismo, os\n57. novos padrões de consumo e a “modernidade”, além\n58. da emancipação (convicta ou não) de muitas mulheres,\n59. exigem que assim seja. Mas num percurso acidentado\n60. e cheio de obstáculos.\n\nAdaptado de: PINSKY, C. B. Mulheres dos anos dourados. São Paulo: Contexto, 2014.", "p2025-06-ps63:t1": "01 Ao longo das últimas décadas, _____ gestão de\n02 empresas de saúde tem enfrentado desafios complexos\n03 e em constante evolução. Desde os primórdios da\n04 medicina organizada até os sistemas modernos de\n05 saúde, a maneira como as empresas da área são\n06 gerenciadas tem refletido nas mudanças sociais, tecno-\n07 lógicas e regulatórias.\n\n08 Nos últimos tempos, as empresas do segmento\n09 de saúde _____ enfrentado diversos desafios que se\n10 tornaram significativos gargalos na gestão. Entre esses\n11 desafios, destacam-se a crescente pressão por redução\n12 de custos, a complexidade regulatória, a demanda\n13 por inovação tecnológica, a necessidade de garantir a\n14 qualidade e a segurança do atendimento, bem como a\n15 crescente expectativa dos pacientes por uma experiência\n16 mais personalizada e centrada no usuário. Além disso,\n17 questões como a interoperabilidade de sistemas de\n18 informação, a escassez de profissionais qualificados e\n19 a crescente concorrência no mercado também _____\n20 impactado diretamente na gestão eficaz das empresas\n21 de saúde.\n\n22 Encontrar soluções para tais desafios tem sido\n23 essencial para garantir a sustentabilidade e o sucesso\n24 dessas organizações em um ambiente cada vez mais\n25 dinâmico e competitivo.\n\n26 Para superar os maiores desafios na gestão atual,\n27 as empresas de saúde podem adotar uma abordagem\n28 multifacetada que _____ tecnologia, colaboração inter-\n29 disciplinar e foco na qualidade do cuidado. Investir em\n30 soluções tecnológicas avançadas, como sistemas de\n31 gestão integrada e telemedicina, pode melhorar a\n32 eficiência operacional, reduzir erros e facilitar a comu-\n33 nicação entre equipes. Além disso, promover uma\n34 cultura organizacional centrada no paciente, que valorize\n35 o trabalho em equipe e o desenvolvimento profissional,\n36 pode ajudar a atrair e reter talentos qualificados, redu-\n37 zindo a rotatividade e fortalecendo o compromisso com\n38 a excelência clínica.\n\nAdaptado de: Gestão de empresas de saúde e seus desafios na atualidade. Disponível em: <https://www.gruposcopo.com/gestao-de-empresas-de-saude-e-seus-desafios-na-atualidade>. Acesso em: 21 set. 2025.", "p2026-01-ps15:t1": "O que é sotaque?\n\n01 Toda pessoa que fala uma determinada língua\n02 percebe diferenças em como os indivíduos pronunciam\n03 as palavras que ____ as frases dessa língua. As carac-\n04 terísticas sonoras da fala são salientes e, por isso,\n05 identificamos logo se quem fala é do mesmo dialeto\n06 regional que o nosso ou não, se tem o mesmo status\n07 socioeconômico, se fala a mesma língua ou outra, entre\n08 outros aspectos. A maneira como os sons da fala\n09 são produzidos ____ de sotaque. É comum ser ____\n10 referência a determinadas características sonoras da\n11 fala de algumas pessoas como “sotaque carregado”\n12 ou até mesmo que a pessoa fala “sem sotaque”.\n13 Normalmente, essas caracterizações da fala do outro\n14 se referem ____ como uma pessoa de uma determi-\n15 nada região fala. Podem também se referir a como uma\n16 pessoa fala uma língua diferente da sua, se fala como\n17 os falantes nativos daquela língua ou trazendo carac-\n18 terísticas de sua própria língua nativa.\n\n19 Existe, de fato, a possibilidade de algum indivíduo\n20 falar “sem sotaque” sua própria língua ou uma língua\n21 estrangeira? Haveria alguma característica sonora das\n22 diferentes variedades de uma mesma língua ou entre\n23 diferentes línguas que fosse mais “suave”, ao passo\n24 que outras seriam mais “carregadas” ou “fortes”? Para\n25 responder a essas indagações é preciso situar o que é\n26 sotaque do ponto de vista da ciência linguística.\n\n27 Sotaque diz respeito ____ características sonoras da\n28 fala de qualquer indivíduo falante de qualquer língua.\n29 Essas características podem ser individuais, como a voz\n30 de quem fala, ou podem ser coletivas, tais como as\n31 diferenças percebidas entre falantes de diferentes\n32 faixas etárias, sexo ou gênero, status socioeconômico\n33 etc. Podem corresponder também ____ diferenças\n34 entre variedades regionais ou dialetos de uma mesma\n35 língua, como as observadas entre indivíduos das\n36 diferentes regiões do Brasil. Por exemplo, cariocas e\n37 paulistanos diferem na maneira como produzem o som\n38 que corresponde ____ letra “s” na palavra festa, ou\n39 ainda na pronúncia de “r” na palavra porta. Essas\n40 diferenças podem ser caracterizadas como diferentes\n41 sotaques. Sotaque também ____ as diferenças sonoras\n42 mais gerais entre línguas com uma mesma origem,\n43 como as diferenças entre o português brasileiro e o\n44 português europeu, ou entre o inglês americano e o\n45 inglês britânico, ou mesmo aquelas que caracterizam o\n46 grau de proximidade ou distância com que uma pessoa\n47 fala uma língua estrangeira em relação a como os\n48 falantes nativos falam essa língua.\n\n49 A diversidade de sons presentes nas línguas pode\n50 ser observada se compararmos línguas diferentes entre\n51 si e também variedades da mesma língua. Toda língua,\n52 não importa o tamanho do país e nem a quantidade\n53 de pessoas que a falam, apresenta diversidade sonora,\n54 caracterizando diferenças regionais, etárias, de classe\n55 social, de gênero ou sexo, ou até mesmo diferenças\n56 étnicas, a depender da organização sócio-histórica do\n57 povo que fala uma determinada língua.\n\n58 A diversidade sonora observada entre línguas\n59 diferentes e em uma mesma língua é consequência do\n60 conjunto vasto de possibilidades de produção de sons\n61 da fala pelos seres humanos. O som da fala é resultado\n62 da modificação da corrente de ar que inspiramos e\n63 expiramos e é modificada por um conjunto de órgãos\n64 que formam nosso aparelho fonador. A maioria dos\n65 sons da fala é produzida com a corrente expirada\n66 (aquela que sai dos pulmões em direção à boca).\n67 A corrente de ar pode ser modificada pelas cordas\n68 vocais e pelos diversos articuladores, como a faringe, a\n69 língua, os lábios, os dentes incisivos superiores, o\n70 palato duro, o palato mole e a úvula, até sair pela boca\n71 ou pela boca e nariz. Assim, os órgãos que são mobili-\n72 zados na produção dos sons linguísticos, e que formam\n73 o aparelho fonador, são os mesmos e funcionam da\n74 mesma maneira para todos os seres humanos.\n\nAdaptado de: GOMES, Christina Abreu. O que é sotaque? In: OTHERO, G. A.; FLORES, V. N. (orgs.) O que sabemos sobre a linguagem. São Paulo: Parábola, 2022."}</script>
<script>
(function () {
  const TODAS = JSON.parse(document.getElementById('questoes').textContent);
  // Gêmea: mesma questão com outros números. Fica fora dos sorteios e das listas; só aparece no lugar da original errada, em "Refazer as que errei".
  // Questões da banca (q.banca) ficam fora dos sorteios e das listas de assunto: aparecem em "Resolver aqui" das provas reais.
  const Q = TODAS.filter(q => !q.gemeaDe && !q.banca);
  const TEXTOS = JSON.parse(document.getElementById('textos').textContent);
  const BYID = Object.fromEntries(TODAS.map(q => [q.id, q]));
  const GEMEA = Object.fromEntries(TODAS.filter(q => q.gemeaDe).map(q => [q.gemeaDe, q.id]));
  function paraRefazer() {
    return Object.keys(store.res).filter(id => BYID[id] && !BYID[id].gemeaDe && !store.res[id].ok).map(id => {
      const g = GEMEA[id];
      if (!g) return id;
      return store.res[g] && store.res[g].ok ? null : g;
    }).filter(Boolean);
  }
  const MATERIAS = ['Português', 'Informática', 'Raciocínio Lógico', 'Conhecimentos Específicos'];
  // Composição da prova escrita do PS 32, item 13 do Edital 04/2026.
  const OFICIAL = { 'Português': 5, 'Informática': 5, 'Raciocínio Lógico': 5, 'Conhecimentos Específicos': 25 };
  const L = 'ABCDE';
  const KEY = 'hcpa-ps32-v1';
  const RES = JSON.parse(document.getElementById('resumos').textContent);
  const RESID = Object.fromEntries(RES.map(r => [r.id, r]));
  const VID = JSON.parse(document.getElementById('videos').textContent);
  const RES_DO_TEMA = Object.fromEntries(RES.filter(r => r.tema !== 'Informática' && r.tema !== 'Raciocínio Lógico').map(r => [r.tema, r.id]));
  function idsDoResumo(rid) {
    const r = RESID[rid];
    if (!r) return [];
    return Q.filter(q => q.sub ? q.sub === rid : (RES_DO_TEMA[q.tema] === rid)).map(q => q.id);
  }
  // Ordem pensada para quem tem pouco tempo: alterna as matérias que eliminam (Informática e Lógico, mínimo de 2 acertos)
  // com os específicos que mais caíram na prova de 2023. As marcadas como essenciais bastam se o tempo apertar.
  const PLANO = [
    { id: 'm01', res: ['rl-contas'], ess: true },
    { id: 'm02', res: ['lgpd'], ess: true, det: 'Assunto novo para você. Vá com calma: leia os grupos um de cada vez.' },
    { id: 'm03', res: ['info-planilhas'], ess: true },
    { id: 'm04b', res: ['etica'], ess: true, det: 'Você conhece um pouco. Foque nos deveres, nas vedações e na pena da Comissão de Ética.' },
    { id: 'm05', res: ['rl-logica'], ess: true },
    { id: 'm06', res: ['seg-paciente'], ess: true },
    { id: 'm07', res: ['info-seguranca'], ess: true },
    { id: 'm08b', res: ['humaniza'], ess: true, det: 'Você já conhece a ideia. Foque em como a política é organizada: princípios, método, diretrizes e dispositivos.' },
    { id: 'm09', prova: 'p2023', titulo: 'Prova real de 2023', det: 'Comece pelas questões 27 a 40 (específicos). Se der tempo, faça de 16 a 26. Dá para fazer em dois dias.', min: 60 },
    { id: 'm10b', res: ['direitos'] },
    { id: 'm11', res: ['info-docs-drive'], ess: true },
    { id: 'm12', res: ['eca'] },
    { id: 'm13', res: ['rl-sequencias'], ess: true },
    { id: 'm14', res: ['idosa', 'lbi'] },
    { id: 'm15', res: ['materiais'] },
    { id: 'm16', res: ['injuria', 'ans', 'cnv'] },
    { id: 'm17b', res: ['nr32', 'sus'], det: 'Revisão rápida do que você já conhece.' },
    { id: 'm17c', res: ['lgpd', 'etica'], modo: 'testar', ess: true, titulo: 'Revisão: LGPD e ética no Me testar', det: 'Os dois assuntos que você menos conhecia, agora tentando lembrar sem ler.' },
    { id: 'm18', acao: 'simulado', titulo: 'Simulado de 40 questões', det: 'Como no dia da prova: 40 questões, sem dicas, correção no final.', min: 90, ess: true },
    { id: 'm19', acao: 'erros', titulo: 'Refazer as que errei', det: 'Só as questões que ficaram erradas.', min: 30, ess: true }
  ].map(m => {
    const rs = (m.res || []).filter(id => RESID[id]);
    const ids = rs.flatMap(idsDoResumo);
    return { ...m, res: rs, ids,
      titulo: m.titulo || rs.map(id => RESID[id].titulo || RESID[id].tema).join(' + '),
      min: m.min || rs.reduce((s, id) => s + (RESID[id].minutos || 5), 0) + Math.ceil(ids.length * 1.5) };
  }).filter(m => m.prova || m.acao || m.res.length);
  // Gabaritos após recursos publicados pela FAURGS; '*' marca questão anulada (ponto para todos).
  const PROVAS = {
    p2023: {
      titulo: 'Prova de 2023', sub: 'HCPA · Edital 02/2023 · PS 07 · Assistente Administrativo II',
      url: 'provas/2023-ps07-assistente-administrativo-ii.pdf',
      origem: 'https://portalfaurgs.com.br/LerArquivo/5e230bea-c692-4a4a-8112-12c0e8fd2a4f',
      gab: 'DCECDBAAEDCBABAECECBDABDCABBDDBDACDADEBC',
      blocos: [['Português', 1, 15], ['Matemática', 16, 20], ['Raciocínio Lógico', 21, 26], ['Conhecimentos Específicos', 27, 40]],
      nota: 'Os específicos (27 a 40) cobram SUS, LGPD, NR-32, HumanizaSUS, ética do servidor e segurança do paciente, que também estão no edital deste ano.'
    },
    p2015: {
      titulo: 'Prova de 2015', sub: 'HCPA · Edital 04/2015 · PS 34 · Assistente Administrativo II',
      url: 'provas/2015-ps34-assistente-administrativo-ii.pdf',
      origem: 'https://www.estudegratis.com.br/images/provas/35801-faurgs-2015-hcpa-assistente-administrativo-ii-prova.pdf',
      gab: 'CDBEBDACADCBEE*BABCDBEADEEADCCBCBDACDEAABCDEABD*DB',
      blocos: [['Português', 1, 15], ['Matemática e Raciocínio Lógico', 16, 25], ['Conhecimentos Específicos', 26, 50]],
      nota: 'Mais antiga: parte dos específicos é sobre atendimento ao público, que saiu do edital. SUS, HumanizaSUS, NR-32 e segurança do paciente continuam.'
    }
  };
  Object.assign(PROVAS, JSON.parse(document.getElementById('provas').textContent));
  // Questões reais por assunto: { 'LGPD': [{ pid, nums }] }, das provas extras.
  const REAIS = {};
  for (const [pid, p] of Object.entries(PROVAS)) {
    if (!p.extra) continue;
    for (const [nome, nums] of p.blocos) (REAIS[nome] = REAIS[nome] || []).push({ pid, nums });
  }
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const navIn = document.getElementById('nav-in');

  let store = { res: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.res) store = s; } catch (e) {}
  function salvar() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function registrar(id, ok) {
    const r = store.res[id] || { n: 0, acertos: 0 };
    r.n += 1; if (ok) r.acertos += 1; r.ok = ok;
    store.res[id] = r; salvar();
  }

  let S = null;       // sessão em andamento
  let confirmar = null; // { msg, sim, rotuloSim }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function idsDa(materia) { return Q.filter(q => q.materia === materia).map(q => q.id); }

  function temas() {
    const m = new Map();
    for (const q of Q) {
      const k = q.materia + '|' + q.tema;
      if (!m.has(k)) m.set(k, { materia: q.materia, tema: q.tema, ids: [] });
      m.get(k).ids.push(q.id);
    }
    return [...m.values()].sort((a, b) => MATERIAS.indexOf(a.materia) - MATERIAS.indexOf(b.materia));
  }

  function diasAteProva() {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    return Math.round((new Date(2026, 11, 13) - hoje) / 86400000);
  }

  // ---------- Plano ----------
  function feitas() { store.plano = store.plano || {}; return store.plano; }
  function marcarFeita(mid) { if (mid && !feitas()[mid]) { feitas()[mid] = new Date().toISOString().slice(0, 10); salvar(); } }
  // Sugere a próxima tarefa não feita; se faltam mais tarefas que dias, pula as não essenciais.
  function proximaMissao() {
    const f = feitas();
    const resto = PLANO.filter(m => !f[m.id]);
    if (!resto.length) return null;
    const apertado = resto.length > Math.max(diasAteProva(), 0);
    return { m: (apertado && resto.find(m => m.ess)) || resto[0], apertado, resto: resto.length };
  }
  function bancaDaMissao(m) {
    if (!m.res || !m.res.length) return [];
    const temas = m.res.map(id => RESID[id] && RESID[id].tema).filter(t => t && t !== 'Informática' && t !== 'Raciocínio Lógico');
    const cands = TODAS.filter(q => q.banca && temas.includes(q.tema)).sort((a, b) => (store.res[a.id] ? (store.res[a.id].ok ? 2 : 1) : 0) - (store.res[b.id] ? (store.res[b.id].ok ? 2 : 1) : 0));
    return cands.slice(0, 3).map(q => q.id);
  }
  function passosDa(m) {
    if (m.prova) return [`Abrir a prova e marcar as respostas na folha daqui`, `Corrigir e ver o que errou`];
    if (m.acao === 'simulado') return ['Responder as 40 questões', 'Entregar e ver a nota'];
    if (m.acao === 'erros') return ['Refazer só as questões erradas'];
    if (m.modo === 'testar') return ['Abrir os resumos em "Me testar" e tentar lembrar cada palavra escondida', `Fazer ${m.ids.length} questões com correção na hora`];
    const nb = bancaDaMissao(m).length;
    return [`Ler ${m.res.length > 1 ? 'os resumos' : 'o resumo'} (${m.res.reduce((s, id) => s + (RESID[id].minutos || 5), 0)} min)`, nb ? `Fazer ${m.ids.length} questões de treino e ${nb} ${nb === 1 ? 'real' : 'reais'} da banca` : `Fazer ${m.ids.length} questões com correção na hora`];
  }
  function abrirMissao(mid) {
    R = null;
    const m = PLANO.find(x => x.id === mid);
    if (!m) return;
    if (m.prova) { F = { pid: m.prova, missao: m.id }; S = null; confirmar = null; folha(); return; }
    if (m.acao === 'simulado') { abrirSimulado(m.id); return; }
    if (m.acao === 'erros') {
      const ids = paraRefazer();
      if (!ids.length) { marcarFeita(m.id); plano(); return; }
      iniciar('pratica', 'Refazer erros', ids); S.missao = m.id; questao(); return;
    }
    resumo(m.res, m.id);
    if (m.modo === 'testar') { R.modo = 'testar'; resumo(R.ids, null, false); }
  }
  function estudoDe(chave) {
    const t = (store.testes || {})[chave], and = (store.andamento || {})[chave] || {};
    const revisar = t && t.pontos ? Object.values(t.pontos).filter(v => v === 'nao').length : 0;
    return { lido: !!(store.lidos || {})[chave], teste: t, revisar, andamento: Object.keys(and).length };
  }
  function textoEstudo(e) {
    const partes = [];
    if (e.andamento) partes.push('teste pela metade');
    else if (e.teste) partes.push(`lembrou ${e.teste.lembrou} de ${e.teste.total}`);
    else if (e.lido) partes.push('chegou ao fim do resumo');
    if (e.revisar) partes.push(`${e.revisar} para revisar`);
    return partes.join(' · ');
  }
  function materiaDaMissao(m) {
    if (m.res && m.res.length) { const ms = [...new Set(m.res.map(id => RESID[id] && materiaDoResumo(RESID[id])).filter(Boolean))]; return ms.join(' e '); }
    if (m.prova) return 'Prova real';
    if (m.acao === 'simulado') return 'Todas as matérias';
    return '';
  }
  function cartaoHoje() {
    const p = proximaMissao();
    const f = feitas();
    const barra = `<div class="passos-plano" aria-hidden="true">${PLANO.map(m => `<i class="${f[m.id] ? 'f' : ''}"></i>`).join('')}</div>`;
    const feitasN = PLANO.filter(m => f[m.id]).length;
    if (!p) return `<section class="hoje"><h2>Todas as ${PLANO.length} tarefas feitas</h2>${barra}
      <p>Daqui até a prova, faça simulados e refaça as que errou.</p></section>`;
    const m = p.m;
    return `<section class="hoje" aria-labelledby="t-hoje">
      <h2 id="t-hoje">${m.ess ? '<span class="estrela" aria-label="essencial">★</span> ' : ''}${esc(m.titulo)}</h2>
      <p class="meta">Tarefa ${PLANO.indexOf(m) + 1} de ${PLANO.length}${materiaDaMissao(m) ? ` · ${esc(materiaDaMissao(m))}` : ''} · cerca de ${m.min} min</p>
      ${m.det ? `<p>${esc(m.det)}</p>` : ''}
      <ol>${passosDa(m).map((t, i) => `<li${i === 0 && m.res && m.res.length && estudoDe(m.res.join('+')).lido ? ' class="passo-visto"' : ''}>${esc(t)}</li>`).join('')}</ol>
      <div class="botoes">
        <button class="mini prim" data-act="missao" data-m="${m.id}">Começar</button>
        <button class="mini" data-act="plano">Ver o plano</button>
      </div>
      <button class="link-btn outra-mat" data-act="outra-materia">Quero estudar outra matéria agora</button>
      ${(() => {
        const pend = Object.keys(store.testes || {}).map(k => ({ k, e: estudoDe(k) })).filter(x => x.e.revisar)[0];
        if (!pend) return '';
        const nome = pend.k.split('+').map(id => (RESID[id] && (RESID[id].titulo || RESID[id].tema)) || id).join(' e ');
        return `<button class="revisao-curta" data-act="revisar" data-r="${esc(pend.k)}"><b>Revisar ${pend.e.revisar} ${pend.e.revisar === 1 ? 'item' : 'itens'} de ${esc(nome)}</b><small>Cerca de 1 min, no Me testar</small></button>`;
      })()}
      ${barra}
      <p class="nota">${feitasN} de ${PLANO.length} tarefas feitas. ${p.apertado
        ? 'Faltam mais tarefas do que dias: o plano agora sugere só as essenciais (★).'
        : 'A tarefa só muda quando você termina as questões dela. Pulou um dia? O plano segue de onde parou.'}</p>
    </section>`;
  }
  function plano() {
    VISTA = 'plano'; armar();
    S = null; F = null; confirmar = null;
    const f = feitas();
    const linhas = PLANO.map((m, i) => `<div class="pl ${f[m.id] ? 'feito' : ''}">

  // ---------- Ouvir ----------
  // Cada ponto vira uma fala separada na fila, para não depender de uma fala longa única
  // e para destacar na tela o ponto que está sendo lido.
  function falasDoResumo(rids) {
    const partes = [];
    for (const id of rids) {
      const r = RESID[id], pegs = pegadinhasDo(r);
      partes.push({ t: r.titulo || r.tema });
      if (r.porque) partes.push({ t: r.porque });
      const soltas = pegs.filter(g => g.ponto == null);
      if (soltas.length) { partes.push({ t: 'Armadilhas da banca.' }); soltas.forEach(g => partes.push({ t: g.t })); }
      if (r.exemplo) { partes.push({ t: 'Exemplo resolvido. ' + r.exemplo.pergunta }); (r.exemplo.passos || []).forEach(t => partes.push({ t })); partes.push({ t: 'Resposta: ' + r.exemplo.resposta }); }
      (r.pontos || []).forEach((p, i) => {
        const el = `pt-${r.id}-${i}`;
        partes.push({ t: p.t, el });
        pegs.filter(g => g.ponto === i).forEach(g => partes.push({ t: 'Pegadinha: ' + g.t, el }));
      });
    }
    return partes;
  }
  function vozBR() {
    const vs = speechSynthesis.getVoices();

  }

    document.querySelectorAll('.pontos li.falando').forEach(li => li.classList.remove('falando'));

  }

    const voz = vozBR(), todas = falasDoResumo(R.ids);
    const visivel = [...view.querySelectorAll('.pontos li')].find(li => li.getBoundingClientRect().top >= 0);
    const ini = window.scrollY > 200 && visivel ? Math.max(0, todas.findIndex(p => p.el === visivel.id)) : 0;
    const partes = todas.slice(ini);

      if (i === partes.length - 1) u.onend = () => pararFala();

  // ---------- Títulos ----------

  function calcTitulos(t) {

        if (sim && !(g && g.modo === 'simulado')) h += `<div class="revisar-box retomar"><p><b>Seu simulado está guardado na questão ${sim.i + 1} de ${sim.ids.length}.</b></p>

        return h;
      })()}
      ${cartaoHoje()}
      <details class="material pesos">
        <summary>Quanto vale cada parte da prova</summary>
