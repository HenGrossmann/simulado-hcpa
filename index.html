administrativo-ii.pdf#page=4", "itens": ["(  ) A palavra mexicanos (l. 12) está sendo usada como adjetivo.", "(  ) A palavra comparativos (l. 18) está sendo usada como adjetivo.", "(  ) A palavra pejorativamente (l. 32) está sendo usada como advérbio."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q09", "banca": "p2015", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta, correta e respectivamente, a separação silábica das palavras Uruguai (l. 02), brasileiro (l. 07), digna (l. 07) e surpreendente (l. 27).", "alternativas": ["U-ru-guai \\ bra-si-lei-ro \\ dig-na \\ sur-pre-en-den-te.", "U-ru-gu-ai \\ bra-si-lei-ro \\ di-gna \\ sur-pre-en-den-te.", "U-ru-gu-a-i \\ bra-si-le-i-ro \\ dig-na \\ sur-preen-den-te.", "U-ru-gu-ai \\ bra-si-le-i-ro \\ dig-na \\ sur-preen-den-te.", "U-ru-guai \\ bra-si-lei-ro \\ di-gna \\ sur-preen-den-te."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 9", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q10", "banca": "p2015", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações.\n\nQuais das afirmações acima estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "Apenas II e III."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 10", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=5", "itens": ["I - A expressão diversos países onde se ensina a língua portuguesa (l. 01-02) desempenha a função sintática de objeto direto.", "II - A expressão dos mexicanos (l. 12) desempenha a função sintática de objeto indireto.", "III - A expressão eloquentes (l. 18) desempenha a função sintática de predicativo do sujeito."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q11", "banca": "p2015", "num": 11, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 13, 27 e 28 do texto, respectivamente.", "alternativas": ["às vezes – à – a", "as vezes – a – à", "às vezes – a – a", "as vezes – à – a", "às vezes – à – à"], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 11", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=5", "instrucao": "As questões 11 a 15 referem-se ao texto abaixo.", "textoRef": "p2015:t2"}, {"id": "p2015-q12", "banca": "p2015", "num": 12, "materia": "Português", "tema": "Português", "enunciado": "Assinale a única alternativa que apresenta um pronome que NÃO se refere à Ana Terra.", "alternativas": ["a (l. 08).", "a (l. 10).", "lhe (l. 11).", "a (l. 16).", "lhe (l. 22)."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 12", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=5", "instrucao": "As questões 11 a 15 referem-se ao texto abaixo.", "textoRef": "p2015:t2"}, {"id": "p2015-q13", "banca": "p2015", "num": 13, "materia": "Português", "tema": "Português", "enunciado": "Ao longo do texto, há várias elipses que podem ser recuperadas pelo leitor. Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir sobre as possibilidades de recuperação das informações elípticas.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – F – V.", "F – V – V – V.", "F – F – V – F.", "V – V – F – F.", "F – F – V – V."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 13", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=6", "itens": ["(  ) Mas na presença do pai (D. Henriqueta) não dizia nada (ao pai) (l. 09).", "(  ) (O pai) Recalcava a revolta (l. 10).", "(  ) Nas noites abafadas (Ana Terra) dormia mal, às vezes (Ana Terra) levantava-se, (Ana Terra) ia para a frente da casa (l. 12-13).", "(  ) (Ana Terra) ficava olhando as coxilhas e o céu, (ficava) tendo nos olhos um sono pesado e na cabeça, no peito, no corpo todo (ficava tendo) uma ânsia que a mantinha desperta e agitada (l. 13-16)."], "instrucao": "As questões 11 a 15 referem-se ao texto abaixo.", "textoRef": "p2015:t2"}, {"id": "p2015-q14", "banca": "p2015", "num": 14, "materia": "Português", "tema": "Português", "enunciado": "Assinale a única alternativa em que o elemento sublinhado NÃO desempenha a função de objeto direto na oração.", "alternativas": ["Aquela solidão ia acabar deixando-a doida, doida varrida... (l. 08-09).", "metia a caneca na talha (l. 18).", "bebia em longos goles uma água que a mornidão tornava grossa (l. 18-19).", "Muitas vezes o sono só lhe vinha de madrugada alta, e, vendo pela cor do horizonte que o dia não tardava a raiar (l. 22-24).", "concluía que não adiantava ir para a cama (l. 24-25)."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 14", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=6", "instrucao": "As questões 11 a 15 referem-se ao texto abaixo.", "figura": "provas/fig/p2015-q14.png", "textoRef": "p2015:t2"}, {"id": "p2015-q16", "banca": "p2015", "num": 16, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Um produto farmacêutico foi vendido com 20% de desconto sobre seu preço original. Se o produto foi vendido por R$ 90,00, seu preço original era de", "alternativas": ["R$ 110,00.", "R$ 112,50.", "R$ 115,00.", "R$ 117,50.", "R$ 120,00."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 16", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=6"}, {"id": "p2015-q17", "banca": "p2015", "num": 17, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Segundo o Relatório de Gestão do Exercício de 2014 do Hospital de Clínicas de Porto Alegre, “O Programa de Cirurgia Robótica do HCPA apresentou significativo incremento de suas atividades em 2014.”\nA tabela abaixo apresenta o número de cirurgias robóticas realizadas nas respectivas especialidades.\n\nDentre as alternativas, em relação ao total de cirurgias robóticas realizadas, assinale a que apresenta o valor percentual mais próximo para o número de cirurgias na especialidade Ginecologia.", "alternativas": ["22%.", "24%.", "25%.", "26%.", "28%."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 17", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=6", "figura": "provas/fig/p2015-q17.png"}, {"id": "p2015-q18", "banca": "p2015", "num": 18, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "A figura a seguir, formada por dois retângulos cujas medidas estão indicadas em metros, representa um terreno.\n\nSe o terreno foi avaliado em R$ 2.140.000,00, o valor do metro quadrado é", "alternativas": ["R$ 2.500,00.", "R$ 5.000,00.", "R$ 9.500,00.", "R$ 19.000,00.", "R$ 38.000,00."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 18", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=7", "figura": "provas/fig/p2015-q18.png"}, {"id": "p2015-q19", "banca": "p2015", "num": 19, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "No Hospital de Clínicas de Porto Alegre (HCPA), um dos indicadores institucionais estratégicos relacionados à sustentabilidade é o “Consumo de Papel A4 por funcionário”.", "alternativas": ["18.300 folhas.", "183.000 folhas.", "1.830.000 folhas.", "18.300.000 folhas.", "183.000.000 folhas."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 19", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=7", "figura": "provas/fig/p2015-q19.png"}, {"id": "p2015-q20", "banca": "p2015", "num": 20, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "A sala de um ambulatório foi representada em um desenho na escala 1:150. Considerando que essa sala possui formato retangular e que as medidas do desenho são 4cm e 10cm, a área da sala, em metros quadrados, é", "alternativas": ["40.", "60.", "80.", "90.", "150."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 20", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=7"}, {"id": "p2015-q21", "banca": "p2015", "num": 21, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "A sequência de números a seguir possui um padrão de construção.\n\n1, 1, 2, 3, 5, 8, 13, N, 34, 55\n\nUtilizando esse padrão, o valor de N é", "alternativas": ["20.", "21.", "24.", "30.", "31."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 21", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=7"}, {"id": "p2015-q22", "banca": "p2015", "num": 22, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Considere P como o resultado da multiplicação de sete números naturais. Para que P seja ímpar, é suficiente e necessário que a quantidade de números ímpares, entre os números utilizados na multiplicação, seja igual a", "alternativas": ["1.", "2.", "3.", "5.", "7."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 22", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=8"}, {"id": "p2015-q23", "banca": "p2015", "num": 23, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Três pessoas, Ana, João e Maria, possuem telefones celulares das marcas Apple, Samsung e Motorola, não necessariamente nessa ordem. Um dos telefones tem cor preta, outro é azul e um tem cor prata. O telefone de Ana é da cor prata. O telefone de Maria é da marca Motorola. O telefone de João não é preto e não é da marca Samsung. Os donos com seus respectivos telefones e cores são", "alternativas": ["João-Apple-azul, Ana-Samsung-prata, Maria-Motorola-preto.", "João-Apple-prata, Ana-Samsung-preto, Maria-Motorola-azul.", "Ana-Samsung-prata, Maria-Apple-preto, João-Motorola-azul.", "Ana-Motorola-prata, João-Apple-azul, Maria-Samsung-preto.", "Maria-Motorola-preto, João-Apple-prata, Ana-Samsung-azul."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 23", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=8"}, {"id": "p2015-q24", "banca": "p2015", "num": 24, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Considere a sequência de triângulos equiláteros de lado 1 e justapostos de acordo com as etapas da figura a seguir.\n\nNessa sequência, na etapa 1 temos 1 triângulo equilátero de lado 1; na etapa 2 temos 4 triângulos equiláteros de lado 1; na etapa 3 temos 9 triângulos equiláteros de lado 1 e assim, sucessivamente.\n\nPortanto, na etapa 17, o número de triângulos equiláteros de lado 1 é", "alternativas": ["169.", "196.", "225.", "289.", "324."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 24", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=8", "figura": "provas/fig/p2015-q24.png"}, {"id": "p2015-q25", "banca": "p2015", "num": 25, "materia": "Raciocínio Lógico", "tema": "Matemática e Raciocínio Lógico", "enunciado": "Considere a planificação de um cubo representada na figura a seguir.\n\nSe os números das faces opostas do cubo são multiplicados entre si e esses produtos são somados, o resultado final é", "alternativas": ["21.", "29.", "31.", "39.", "41."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 25", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=8", "figura": "provas/fig/p2015-q25.png"}, {"id": "p2015-q26", "banca": "p2015", "num": 26, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Segundo pesquisa realizada pela National Retail Merchants Association, qual das alternativas abaixo NÃO se refere à fuga dos clientes das empresas?", "alternativas": ["68% dos clientes fogem das empresas por problemas de postura no atendimento.", "14% fogem por não terem suas reclamações atendidas.", "9% fogem pelo preço.", "9% fogem por competição, mudança de endereço, morte.", "3% fogem por falta de uma política clara de serviços."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 26", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2015-q27", "banca": "p2015", "num": 27, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Escutar é muito mais do que ouvir, pois é captar o verdadeiro sentido, compreendendo e interpretando a essência, __________________.\n\nAssinale a alternativa que completa corretamente a lacuna do texto acima.", "alternativas": ["o conteúdo da comunicação", "os nossos preconceitos", "as distrações", "os julgamentos prévios", "as antipatias"], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 27", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2015-q28", "banca": "p2015", "num": 28, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Considere as afirmações abaixo com relação à postura do profissional de atendimento.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 28", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=9", "itens": ["I - Entender o seu verdadeiro papel, que é o de compreender e atender as necessidades dos clientes.", "II - Entender que as reclamações e insatisfações dos clientes devem ser encaminhadas ao Serviço de Atendimento ao Consumidor (SAC).", "III - Entender a necessidade de manter um estado de espírito positivo."]}, {"id": "p2015-q29", "banca": "p2015", "num": 29, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Proporcionar um Atendimento Nota 10 (PERFORMANCE RESEARCH ASSOCIATES, 2011) é criar uma experiência positiva e _________ para cada cliente. Corresponde a suprir expectativas e ___________ necessidades, de tal forma que você seja visto como alguém com quem é _______________ negociar. Significa procurar oportunidades de surpreender e ___________ o cliente de um modo único e ______________.\n\nAssinale a alternativa que completa, correta e respectivamente, as lacunas do texto acima.", "alternativas": ["inesquecível – cativar – fácil – satisfazer – inesperado", "maravilhosa – compreender – normal – motivar – surpreendente", "inesquecível – satisfazer – fácil – cativar – inesperado", "maravilhosa – motivar – normal – compreender – surpreendente", "inesquecível – cativar – inesperado – satisfazer – fácil"], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 29", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2015-q30", "banca": "p2015", "num": 30, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Na obra Atendimento Nota 10 (2011), o pesquisador de administração e marketing Dr. Leonard Berry e seus colegas da Texas A&M University referem que os clientes avaliam a qualidade do atendimento baseados em cinco fatores.\nDentre as alternativas abaixo, assinale a que NÃO apresenta um desses fatores.", "alternativas": ["Confiabilidade.", "Empatia.", "Sistematização.", "Aparência.", "Resposta."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 30", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2015-q31", "banca": "p2015", "num": 31, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Numere a segunda coluna de acordo com a primeira, associando o processo de recuperação do atendimento às respectivas características.\n\n(1) Peça desculpas/reconheça o problema\n(2) Ouça, demonstre empatia e faça perguntas abertas\n(3) Resolva o problema com rapidez e correção\n(4) Faça o acompanhamento\n(5) Lembre-se: cumpra suas promessas\n\nA sequência numérica correta de preenchimento dos parênteses da segunda coluna, de cima para baixo, é", "alternativas": ["1 – 2 – 3 – 4 – 5.", "3 – 5 – 4 – 1 – 2.", "4 – 5 – 3 – 2 – 1.", "5 – 3 – 4 – 1 – 2.", "5 – 4 – 2 – 3 – 1."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 31", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=10", "itens": ["(  ) Crie e implemente soluções – envolva o cliente para consolidar a parceria e construir confiança.", "(  ) As expectativas dos clientes – explícitas ou implícitas – tornam-se uma promessa entre você e eles. Seja realista sobre o que poderá ou não cumprir.", "(  ) Dê um passo extra. Confirme se o problema foi resolvido e mostre que você se importa com a situação.", "(  ) Histórias positivas de recuperação começam com uma versão qualquer de “sinto muito”.", "(  ) Escutar é um processo ativo: demonstrar empatia, manifestando entendimento sobre o que o cliente diz, bem como expressar preocupação em resolver o problema. Fazer perguntas abertas ajuda a conquistar e a manter o controle da situação."]}, {"id": "p2015-q32", "banca": "p2015", "num": 32, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A Lei nº 8.080/1990, em suas disposições gerais, assegura que", "alternativas": ["a saúde e a educação são direitos fundamentais do brasileiro.", "o dever do Estado exclui o das pessoas.", "a saúde é um direito fundamental.", "o dever do Estado exclui o das famílias.", "a saúde é um direito apenas para quem contribui com a seguridade social."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 32", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2015-q33", "banca": "p2015", "num": 33, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "O Sistema Único de Saúde (SUS) NÃO inclui, definitivamente, os seguintes órgãos:", "alternativas": ["hospitais universitários.", "instituições de seguro privado de saúde.", "instituições federais de controle de qualidade.", "serviço de saúde das Forças Armadas.", "instituições estaduais de medicamentos."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 33", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2015-q34", "banca": "p2015", "num": 34, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Considere os objetivos abaixo.\n\nQuais estão incluídos no campo de atuação do SUS?", "alternativas": ["Apenas I e II.", "Apenas I e III.", "Apenas II e IV.", "Apenas I, III e IV.", "I, II, III e IV."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 34", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=10", "itens": ["I - Controlar e fiscalizar os serviços, produtos e substâncias de interesse para a área da saúde.", "II - Supervisionar convênios entre os hospitais, postos de saúde e entidades filantrópicas.", "III - Atuar na vigilância nutricional e na orientação alimentar.", "IV - Incrementar o desenvolvimento científico e tecnológico de suas unidades."]}, {"id": "p2015-q35", "banca": "p2015", "num": 35, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "O Quinto Princípio da Carta de Direitos e Deveres dos Pacientes assegura as responsabilidades que o cidadão também deve ter para que seu tratamento aconteça de forma adequada.\nQual das alternativas abaixo NÃO se refere a esse princípio?", "alternativas": ["Ter acesso aos mecanismos de escuta para apresentar sugestões, reclamações e denúncias aos gestores e às gerências das unidades prestadoras de serviços de saúde e às ouvidorias, sendo respeitada a privacidade, o sigilo e a confidencialidade.", "Adotar comportamento respeitoso e cordial com os demais usuários e trabalhadores da saúde.", "Prestar informações apropriadas nas consultas e nas internações sobre queixas, enfermidades e hospitalizações anteriores, história de uso de medicamentos e/ou drogas, reações alérgicas e demais indicadores de sua situação de saúde.", "Atentar para situações da vida cotidiana em que sua saúde esteja em risco e as possibilidades de redução da vulnerabilidade do adoecimento.", "Comunicar aos serviços de saúde ou vigilância sanitária irregularidades relacionadas ao uso e à oferta de produtos e serviços que afetem a saúde em ambientes públicos e privados."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 35", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2015-q36", "banca": "p2015", "num": 36, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale a alternativa INCORRETA em relação aos princípios descritos na Carta de Direitos e Deveres dos Pacientes.", "alternativas": ["Receber, quando internado, visita de médico de sua referência, que não pertença àquela unidade hospitalar, sendo facultado a esse profissional o acesso ao prontuário.", "Ter liberdade para procurar uma segunda opinião ou parecer de outro profissional ou serviço sobre seu estado de saúde ou sobre procedimentos recomendados, em qualquer fase do tratamento.", "Identificar o paciente pelo nome e sobrenome, devendo existir em todo documento de registro do usuário um campo para o nome pelo qual prefere ser chamado, independentemente do registro civil, podendo ser tratado por número, nome da doença, código, de modo genérico, desrespeitoso ou preconceituoso.", "Saber o nome dos profissionais que trabalham nas unidades de saúde, bem como dos gerentes e/ou diretores e gestor responsável pelo serviço.", "Contribuir para o bem-estar de todos que circulam no ambiente de saúde, evitando principalmente ruídos, uso de fumo, derivados do tabaco e bebidas alcoólicas, colaborando com a limpeza do ambiente."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 36", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=11"}, {"id": "p2015-q37", "banca": "p2015", "num": 37, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "No que se refere ao conceito de humanização, entendido não como programa, mas como política pública que atravessa/transversaliza as diferentes ações e instâncias gestoras do SUS, considere os objetivos abaixo.\n\nQuais objetivos refletem o conceito de humanização acima mencionado?", "alternativas": ["Apenas I.", "Apenas II e III.", "Apenas II e V.", "Apenas I, IV e V.", "I, II, III, IV e V."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 37", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=11", "itens": ["I - Traduzir os princípios do SUS em modos de operar os diferentes equipamentos e sujeitos da rede de saúde.", "II - Construir trocas solidárias e comprometidas somente com o objetivo de produção de saúde.", "III - Oferecer um eixo articulador das práticas em saúde, destacando os aspectos objetivos presentes.", "IV - Orientar as práticas de atenção e gestão do SUS a partir da experiência concreta do trabalhador e usuário, construindo um sentido positivo de humanização, desidealizando “o Homem”.", "V - Contagiar, por atitudes e ações humanizadoras, a rede do SUS, incluindo gestores, trabalhadores da saúde e usuários."]}, {"id": "p2015-q38", "banca": "p2015", "num": 38, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale a alternativa INCORRETA no que se refere à Política Nacional de Humanização (PNH).", "alternativas": ["Fortalecimento de trabalho em equipe multiprofissional, fomentando a transversalidade e a grupalidade.", "Construção de autonomia e protagonismo dos sujeitos e coletivos implicados na rede do SUS.", "Fortalecimento do controle social, com caráter participativo, em todas as instâncias gestoras do SUS.", "Valorização da ambiência, com organização de espaços de trabalho saudáveis e acolhedores.", "Compromisso com a democratização das relações de trabalho e valorização dos trabalhadores de saúde, não estimulando, portanto, o processo de educação permanente em saúde."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 38", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=11"}, {"id": "p2015-q39", "banca": "p2015", "num": 39, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A implementação da PNH pressupõe vários eixos de ação com o objetivo de institucionalizar, de difundir essa estratégia e, principalmente, de que a sociedade se aproprie de seus resultados.\n\nNumere a segunda coluna de acordo com a primeira, associando os eixos às suas respectivas características.\n\n(1) Eixo das instituições do SUS\n(2) Eixo da gestão do Trabalho\n(3) Eixo do financiamento\n(4) Eixo da atenção\n\nA sequência correta de preenchimento dos parênteses da segunda coluna, de cima para baixo, é", "alternativas": ["4 – 1 – 3 – 2.", "1 – 3 – 4 – 2.", "1 – 2 – 4 – 3.", "2 – 1 – 3 – 4.", "4 – 2 – 1 – 3."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 39", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=11", "itens": ["(  ) Propõe uma política incentivadora de ações integrais, promocionais e intersetoriais de saúde, inovando nos processos de trabalho que busquem o compartilhamento dos cuidados, resultando em aumento da autonomia e protagonismo dos sujeitos envolvidos.", "(  ) Propõe que a PNH faça parte dos planos estaduais e municipais dos governos, como já faz do Plano Nacional de Saúde e dos Termos de Compromisso do Pacto pela Saúde.", "(  ) Propõe a integração dos recursos vinculados a programas específicos de humanização e outros recursos de subsídio à atenção, unificando-os e repassando-os fundo a fundo, mediante o compromisso dos gestores com a PNH.", "(  ) Propõe a promoção de ações que assegurem a participação dos trabalhadores nos processos de discussão e decisão, fortalecendo e valorizando os trabalhadores, sua motivação, seu desenvolvimento e o seu crescimento profissional."]}, {"id": "p2015-q40", "banca": "p2015", "num": 40, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale a alternativa correta quanto ao objetivo e campo de aplicação da Norma Regulamentadora (NR) 32.", "alternativas": ["Estabelecer as diretrizes básicas para a implementação de medidas de proteção à segurança e à saúde dos trabalhadores dos serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral.", "Estabelecer as diretrizes para o planejamento estratégico das medidas de proteção à segurança e à saúde dos profissionais atuantes em serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral.", "Estabelecer as diretrizes básicas para a implementação de medidas de proteção à segurança e à saúde dos pacientes e trabalhadores dos serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral.", "Impedir a implementação de medidas de conformidade à saúde dos trabalhadores, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral.", "Estabelecer as diretrizes, normas e fundamentos de gestão para implementação de medidas de proteção à segurança e à saúde dos trabalhadores dos serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral, de acordo com as normas já estabelecidas previamente na instituição."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 40", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=12"}, {"id": "p2015-q41", "banca": "p2015", "num": 41, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "De acordo com a Norma Regulamentadora (NR) 32, o empregador deve vedar as práticas abaixo relacionadas, EXCETO:", "alternativas": ["a utilização de pias de trabalho para fins diversos dos previstos.", "o consumo de alimentos e bebidas em qualquer área do hospital.", "o ato de fumar, o uso de adornos e o manuseio de lentes de contato nos postos de trabalho.", "a guarda de alimentos em locais não destinados para este fim.", "o uso de calçados abertos."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 41", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=12"}, {"id": "p2015-q42", "banca": "p2015", "num": 42, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale com V (verdadeiro) ou F (falso) as sentenças abaixo, referentes à NR-32, especificamente sobre resíduos das instituições de saúde.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V – F – V.", "F – V – F – F – V.", "V – V – F – V – F.", "F – F – V – V – F.", "V – V – F – V – V."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 42", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=12", "itens": ["(  ) A segregação dos resíduos deve ser realizada no local onde são gerados.", "(  ) Os recipientes de resíduos devem ser identificados e sinalizados segundo as normas da ABNT.", "(  ) O recipiente para acondicionamento dos perfurocortantes deve ser mantido exclusivamente em cima da pia no posto de enfermagem.", "(  ) Para os recipientes destinados à coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado 5cm abaixo do bocal.", "(  ) O transporte manual do recipiente de segregação pode ser arrastado, desde que realizado de forma que não exista o contato do mesmo com outras partes do corpo."]}, {"id": "p2015-q43", "banca": "p2015", "num": 43, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A Portaria nº 529, do Ministério da Saúde, estabelece que a Cultura de Segurança configura-se a partir de cinco características operacionalizadas pela gestão de segurança da organização.\n\nDentre as alternativas abaixo, assinale a que NÃO apresenta uma dessas características.", "alternativas": ["Todos os trabalhadores, incluindo profissionais envolvidos no cuidado e gestores, assumem responsabilidade pela sua própria segurança, pela segurança de seus colegas, pacientes e familiares.", "A segurança é priorizada acima de metas financeiras e operacionais.", "A identificação, a notificação e a resolução dos problemas relacionados à segurança são encorajados e recompensados.", "A ocorrência de incidentes promove a ação punitiva dos responsáveis envolvidos no evento.", "Proporciona recursos, estrutura e responsabilização para a manutenção efetiva da segurança."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 43", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=12"}, {"id": "p2015-q44", "banca": "p2015", "num": 44, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Considere os objetivos específicos abaixo do Programa Nacional de Segurança do Paciente, conforme disposto na Portaria nº 529, do Ministério da Saúde.\n\nQuais estão corretos?", "alternativas": ["Apenas I.", "Apenas IV.", "Apenas I e IV.", "Apenas I, II, IV e V.", "I, II, III, IV e V."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 44", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=13", "itens": ["I - Promover e apoiar a implementação de iniciativas voltadas à segurança do paciente em diferentes áreas da atenção, da organização e da gestão de serviços de saúde, por meio da implantação da gestão de risco e de núcleos de segurança do paciente nos estabelecimentos de saúde.", "II - Envolver pacientes e familiares nas ações de segurança do paciente.", "III - Ampliar o acesso da sociedade às informações relativas à segurança do paciente.", "IV - Produzir, sistematizar e difundir conhecimentos sobre segurança do paciente.", "V - Fomentar a inclusão do tema segurança do paciente, no ensino técnico, de graduação e de pós-graduação, na área da saúde."]}, {"id": "p2015-q45", "banca": "p2015", "num": 45, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Em relação ao Acolhimento (Ministério da Saúde, 2004), assinale com V (verdadeiro) ou F (falso) as afirmações abaixo.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V – V – F.", "F – V – V – V – F.", "V – F – F – F – V.", "V – V – F – F – V.", "F – F – V – V – V."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 45", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=13", "itens": ["(  ) Trata-se do modo de operar os processos de trabalho em saúde de forma a atender a todos que procuram os serviços de saúde, ouvindo seus pedidos e assumindo, no serviço, uma postura capaz de acolher, escutar e pactuar respostas mais adequadas aos usuários.", "(  ) Chamado também de triagem, constitui-se como uma etapa do processo que deve ocorrer em local específico nos serviços de saúde.", "(  ) Atendimento com resolutividade e responsabilização, orientando, quando for o caso, o paciente e a família em relação a outros serviços de saúde para a continuidade da assistência e estabelecendo articulações com esses serviços para garantir a eficácia desses encaminhamentos.", "(  ) Implementação do serviço com a consequente constituição de vínculos entre os profissionais e a população, com empenho na construção coletiva de estratégias que promovam mudanças nas práticas dos serviços.", "(  ) Trata-se de uma construção individual, com propostas com a instituição, sem necessidade de relação com a rede de serviços e gerências centrais e distritais."]}, {"id": "p2015-q46", "banca": "p2015", "num": 46, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale a alternativa correta em relação à tecnologia de Avaliação com Classificação de Risco.", "alternativas": ["Determina a necessidade de atendimento, classificada conforme a ordem de chegada dos pacientes.", "Determina a agilidade no atendimento, a partir da análise do grau de necessidade do usuário e não da ordem de chegada.", "Aproxima-se do conceito de triagem, em que é realizada uma avaliação de exclusão dos pacientes que devem ou não ter atendimento naquele local.", "Realiza a classificação da necessidade do paciente para atendimento, excluindo os de menor gravidade, uma vez que nem todos serão atendidos.", "Distribui as consultas disponíveis conforme ordem de chegada dos pacientes para atendimento."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 46", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=13"}, {"id": "p2015-q47", "banca": "p2015", "num": 47, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "São objetivos da Classificação de Risco, EXCETO:", "alternativas": ["avaliar o paciente, logo na sua chegada ao Pronto-Socorro, humanizando o atendimento.", "reduzir o tempo para o atendimento médico, fazendo com que o paciente seja visto precocemente de acordo com a sua gravidade.", "informar os tempos de espera.", "atender apenas os pacientes classificados como vermelhos.", "retornar informações a familiares."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 47", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=14"}, {"id": "p2015-q49", "banca": "p2015", "num": 49, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A garantia da _____________, além de uma obrigação legal contida no Código Penal, no Código Civil e na maioria dos ______________, é um dever prima facie de todos os profissionais e também das instituições. A preservação da informação pode ser abordada tanto pela questão da privacidade quanto da _______________. A privacidade é a _______________ às informações de uma dada pessoa, à própria pessoa, à sua intimidade; é a garantia à preservação do seu anonimato, do seu resguardo, afastamento ou solidão. É a liberdade que o paciente tem de não ser observado sem autorização.\n\nAssinale a alternativa que completa, correta e respectivamente, as lacunas do texto acima.", "alternativas": ["Declaração Universal dos Direitos Humanos – Códigos de Ética Profissional – confidencialidade – limitação do acesso", "preservação das informações – pacientes – Ética Profissional – confidencialidade", "confidencialidade – Códigos de Ética Profissional – preservação das informações – limitação do acesso", "preservação das informações – Códigos de Ética Profissional – confidencialidade – limitação do acesso", "limitação do acesso – Conselhos Regionais de Medicina – preservação das informações – Ética Profissional"], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 49", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=14"}, {"id": "p2015-q50", "banca": "p2015", "num": 50, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Assinale a alternativa correta com relação ao comportamento adequado do profissional de saúde, de acordo com a ética profissional.", "alternativas": ["Tirar fotos com o paciente, quando de sua alta hospitalar e publicar nas redes sociais.", "Os profissionais com direito para acessar o prontuário do paciente mantêm o sigilo e confidencialidade das informações.", "Comentar sobre o quadro clínico do paciente, no elevador.", "Ter acesso ao prontuário de todo e qualquer paciente.", "Identificar uma pessoa hospitalizada, socialmente reconhecida, e comentar com outros colegas."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 50", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=14"}, {"id": "p2021-01-ps08-q01", "banca": "p2021-01-ps08", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche, correta e respectivamente, as lacunas das linhas 07, 22 e 39.", "alternativas": ["por que – por quê – por que", "porque – por quê – por que", "por que – porquê – porque", "porque – porquê – por que", "porquê – porque – porque"], "correta": 3, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 1", "url": "provas/p2021-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t1"}, {"id": "p2021-01-ps08-q02", "banca": "p2021-01-ps08", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 2", "url": "provas/p2021-01-ps08.pdf#page=3", "itens": ["I - A expressão Só que (l. 03) tem valor coesivo semelhante à expressão Por conseguinte e poderia ser substituída por ela sem que o sentido da frase fosse alterado.", "II - Na frase Só na segunda é que foi carinho (l. 06-07), poderíamos mover Só para imediatamente depois de que sem que o sentido da frase fosse alterado.", "III - A conjunção pois (l. 29) tem valor coesivo semelhante à expressão já que e poderia ser substituída por ela sem que o sentido da frase fosse alterado."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t1"}, {"id": "p2021-01-ps08-q03", "banca": "p2021-01-ps08", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Na frase A primeira vez que tocou no rosto do namorado foi para ver se estava com febre (l. 04-06), os sujeitos das formas verbais tocou, ver e estava são, respectivamente,", "alternativas": ["Leninha – Leninha – o rosto do namorado.", "que – Leninha – Leninha.", "Leninha – o namorado – o namorado.", "que – o namorado – o rosto do namorado.", "Leninha – Leninha – o namorado."], "correta": 4, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 3", "url": "provas/p2021-01-ps08.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t1"}, {"id": "p2021-01-ps08-q04", "banca": "p2021-01-ps08", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – V – F.", "V – F – V.", "F – F – V.", "F – V – V.", "F – F – F."], "correta": 4, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 4", "url": "provas/p2021-01-ps08.pdf#page=4", "itens": ["( ) O pronome la (l. 13) poderia ser substituído pelo pronome lhe, sem incorrer em erro gramatical e sem que o sentido da frase fosse alterado.", "( ) A forma verbal Houve (l. 21) poderia ser empregada no plural, sem incorrer em erro gramatical e sem que o sentido da frase fosse alterado.", "( ) A frase Foi num aeroporto (l. 30) poderia ser substituída por Foi a um aeroporto, sem incorrer em erro gramatical e sem que o sentido da frase fosse alterado."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t1"}, {"id": "p2021-01-ps08-q05", "banca": "p2021-01-ps08", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta corretamente a análise sintática da frase Você tem medo de voar (l. 37), considerando elementos de regência verbal e nominal.", "alternativas": ["Objeto direto = medo; objeto indireto = de voar.", "Objeto direto = medo de voar; objeto indireto = de voar.", "Objeto direto = medo de voar; complemento nominal = de voar.", "Objeto direto = medo de voar; complemento nominal = medo.", "Objeto direto = medo; complemento nominal = de voar."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 5", "url": "provas/p2021-01-ps08.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t1"}, {"id": "p2021-01-ps08-q06", "banca": "p2021-01-ps08", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche, correta e respectivamente, as lacunas das linhas 04, 06, 25 e 34.", "alternativas": ["do qual – em que – de que – qual", "que – quando – dos quais – de qual", "do qual – onde – que – qual", "de que – que – dos quais – de qual", "cujo – quando – que – que"], "correta": 0, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 6", "url": "provas/p2021-01-ps08.pdf#page=4", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t2"}, {"id": "p2021-01-ps08-q07", "banca": "p2021-01-ps08", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta apenas substantivos retirados do texto.", "alternativas": ["lucidez (l. 01) – público (l. 10) – criança (l. 34) – guerra (l. 38).", "Angustiado (l. 04) – síntese (l. 12) – rebelde (l. 18) – livros (l. 31).", "poder (l. 11) – tarde (l. 24) – Bandeira (l. 30) – prêmio (l. 40).", "amigos (l. 16) – vez (l. 27) – tempos (l. 34) – primeiro (l. 35).", "namoradas (l. 16) – só (l. 16) – série (l. 36) – francês (l. 41)."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 7", "url": "provas/p2021-01-ps08.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t2"}, {"id": "p2021-01-ps08-q08", "banca": "p2021-01-ps08", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – F.", "V – V – V.", "F – F – V.", "V – V – F.", "F – V – F."], "correta": 0, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 8", "url": "provas/p2021-01-ps08.pdf#page=5", "itens": ["( ) Os pronomes meu (l. 10) e Você (l. 11) referem-se ao autor do texto.", "( ) Os pronomes eu (l. 24) e Você (l. 39) referem-se ao autor do texto.", "( ) As formas verbais lia (l. 22) e li (l. 35) têm como sujeito o autor do texto."], "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t2"}, {"id": "p2021-01-ps08-q09", "banca": "p2021-01-ps08", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que NÃO está correta.", "alternativas": ["Se o substantivo cinema fosse substituído pelo substantivo escola em ao cinema (l. 13), seria criada condição para uso do sinal indicativo de crase na frase.", "Se a forma verbal vendo (l. 15) fosse substituída pela forma verbal observando, não seria criada condição para uso do sinal indicativo de crase na frase.", "Se um grupo (l. 17) fosse substituído por uma turma, não seria criada condição para uso do sinal indicativo de crase na frase.", "Se a forma verbal li fosse substituída pela forma verbal percorri em Só sei que li (l. 35), seria criada condição para uso do sinal indicativo de crase na frase.", "Se o pronome demonstrativo esse fosse introduzido entre a (l. 40) e respeito (l. 41), não seria criada condição para uso do sinal indicativo de crase na frase."], "correta": 3, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 9", "url": "provas/p2021-01-ps08.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t2"}, {"id": "p2021-01-ps08-q10", "banca": "p2021-01-ps08", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Se a palavra cinema fosse substituída por filmes na frase O curioso é que o cinema, uma alegria, também era uma tortura (l. 13-14), quantas outras palavras nessa frase deveriam necessariamente sofrer mudanças para fins de concordância?", "alternativas": ["Uma.", "Duas.", "Três.", "Quatro.", "Cinco."], "correta": 1, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 10", "url": "provas/p2021-01-ps08.pdf#page=5", "instrucao": "As questões 06 a 10 referem-se ao texto abaixo.", "textoRef": "p2021-01-ps08:t2"}, {"id": "p2021-01-ps08-q11", "banca": "p2021-01-ps08", "num": 11, "materia": "Informática", "tema": "Informática", "enunciado": "Considere a planilha MS-Excel abaixo, que contém dados de pacientes atendidos em um determinado período, distribuídos por faixa etária, na qual o número de pacientes atendidos encontra-se nas células B4 até B9. Na célula B10, tem-se o total de pacientes atendidos de todas as faixas etárias.\n\nDeseja-se obter o percentual de pacientes atendidos (coluna C) em cada faixa etária, em relação ao total. Para tanto, digita-se, na célula C4, uma fórmula, que depois será copiada e colada para as células C5 até C9. Conforme a figura acima, a coluna C será formatada em porcentagem, com duas casas decimais. Qual é esta fórmula?", "alternativas": ["=B4/B10", "=B4/B$10", "=B4/$B10", "=B$4/B10", "=B$4/B$10"], "correta": 1, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 11", "url": "provas/p2021-01-ps08.pdf#page=5", "figura": "provas/fig/p2021-01-ps08-q11.png"}, {"id": "p2021-01-ps08-q12", "banca": "p2021-01-ps08", "num": 12, "materia": "Informática", "tema": "Informática", "enunciado": "No processador de textos MS-Word, pode-se criar, automaticamente, listas de itens tais como 1, 2, 3, 4 ou a, b, c, d ou I, II, III, IV. Com relação a esse tema, assinale a afirmativa INCORRETA.", "alternativas": ["Quando se usam letras, elas podem ser maiúsculas ou minúsculas, mantendo-se o tipo selecionado para uma determinada lista, ou seja, ambos os tipos não podem se misturar na sequência da mesma lista.", "Quando se usam números romanos, eles podem ser com letras maiúsculas ou minúsculas, mantendo-se o tipo selecionado para uma determinada lista, ou seja, ambos os tipos não podem se misturar na sequência da mesma lista.", "Quando se escolhe determinado tipo (letras ou números) para uma lista, os subitens desta lista devem ser mantidos com o mesmo tipo do item principal, ou seja, por exemplo, se o item principal é 1, 2, 3, os subitens não podem ser a, b, c, ou I, II, III.", "Pode-se escolher, como complemento do tipo escolhido, um símbolo que vai imediatamente após o tipo escolhido. Estes símbolos podem ser ponto [ex.: A.], parêntese [ex.: i)] ou hífen [ex.: 1-].", "Pode-se iniciar uma determinada lista por qualquer número ou letra da sequência, não sendo obrigatório que o primeiro item da sequência seja 1 ou A."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 12", "url": "provas/p2021-01-ps08.pdf#page=6"}, {"id": "p2021-01-ps08-q13", "banca": "p2021-01-ps08", "num": 13, "materia": "Informática", "tema": "Informática", "enunciado": "Deseja-se enviar um e-mail para duas pessoas. Ao digitar o destinatário, preencheram-se, no campo \"Para\", o nome Usuário1 e, no campo \"Cco\", o nome Usuário2. Quem envia o e-mail é o usuário \"Emissor\". Todos os usuários têm seus endereços de e-mail já cadastrados na lista de contatos. O que acontecerá após enviar o referido e-mail para os dois usuários quando abrirem seus e-mails?", "alternativas": ["Usuário1 verá que Usuário2 também recebeu o e-mail; e Usuário2 verá que Usuário1 também recebeu o e-mail.", "Usuário1 verá que Usuário2 também recebeu o e-mail; e Usuário2 não verá que Usuário1 também recebeu o e-mail.", "Usuário1 não verá que Usuário2 também recebeu o e-mail; e Usuário2 não verá que Usuário1 também recebeu o e-mail.", "Usuário1 verá que outro usuário também recebeu o e-mail, mas não saberá quem foi; e Usuário2 não verá que Usuário1 também recebeu o e-mail.", "Usuário1 não verá que Usuário2 também recebeu o e-mail; e Usuário2 verá que Usuário1 também recebeu o e-mail."], "correta": 4, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 13", "url": "provas/p2021-01-ps08.pdf#page=6"}, {"id": "p2021-01-ps08-q14", "banca": "p2021-01-ps08", "num": 14, "materia": "Informática", "tema": "Informática", "enunciado": "Ao acessar a internet através de um navegador (browser), tal como Chrome ou Firefox, deve-se ter cuidado quando se inserirem dados pessoais ou financeiros ao fazer uma compra ou inscrição, temendo uma possível exposição dos dados por agentes (pessoas ou sites) mal-intencionados. Para tanto, a empresa destinatária procura garantir o sigilo dos dados usando um protocolo dito seguro. Tal protocolo aparece no endereço do navegador e se chama", "alternativas": ["ftp://", "mailto://", "http://", "https://", "pop3://"], "correta": 3, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 14", "url": "provas/p2021-01-ps08.pdf#page=6"}, {"id": "p2021-01-ps08-q32", "banca": "p2021-01-ps08", "num": 32, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Segundo o Código de Ética profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171, de 22 de junho de 1994), a dignidade, o decoro, o zelo, a eficácia e a consciência dos princípios morais são primados maiores que devem nortear o servidor público, seja no exercício do cargo ou função, ou fora dele, já que refletirá o exercício da vocação do próprio poder estatal. Seus atos, comportamentos e atitudes serão direcionados para a preservação da honra e da tradição dos serviços públicos. A esse respeito, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I e II.", "Apenas II e III.", "Apenas I, III e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 32", "url": "provas/p2021-01-ps08.pdf#page=10", "itens": ["I - A moralidade da Administração Pública não se limita à distinção entre o bem e o mal, devendo ser acrescida da ideia de que o fim é sempre o bem comum.", "II - A função pública deve ser tida como exercício profissional e, portanto, a vida particular de cada servidor público não se relaciona com sua conduta no ambiente de trabalho e com a formação do seu conceito na vida funcional.", "III - Deixar o servidor público, qualquer pessoa à espera de solução que compete ao setor em que exerça suas funções, permitindo a formação de longas filas, ou qualquer outra espécie de atraso na prestação do serviço, não caracteriza apenas atitude contra a ética ou ato de desumanidade, mas, principalmente, grave dano moral aos usuários dos serviços públicos.", "IV - O servidor deve prestar toda a sua atenção às ordens legais de seus superiores, velando atentamente por seu cumprimento e, assim, evitando a conduta negligente."]}, {"id": "p2021-01-ps08-q35", "banca": "p2021-01-ps08", "num": 35, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "A Lei nº 8.080, de 19 de setembro de 1990, dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes e dá outras providências. Esta lei regula, em todo o território nacional, as ações e serviços de saúde, executados isolada ou conjuntamente, em caráter permanente ou eventual, por pessoas naturais ou jurídicas de direito público ou privado. Nas disposições gerais, afirma que a saúde é um direito fundamental do ser humano, devendo o Estado prover as condições indispensáveis ao seu pleno exercício. A esse respeito, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I e III.", "Apenas III e IV.", "Apenas IV e V.", "Apenas II, IV e V.", "I, II, III, IV e V."], "correta": 4, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 35", "url": "provas/p2021-01-ps08.pdf#page=11", "itens": ["I - O dever do Estado de garantir a saúde consiste na formulação e execução de políticas econômicas e sociais que visem à redução de riscos de doenças e de outros agravos.", "II - O dever do Estado é de estabelecer condições que assegurem acesso universal e igualitário às ações e aos serviços para a sua promoção, proteção e recuperação.", "III - O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade.", "IV - Os níveis de saúde expressam a organização social e econômica do País, tendo a saúde como determinante e condicionante.", "V - Dizem respeito também à saúde, as ações que se destinam a garantir às pessoas e à coletividade condições de bem-estar físico, mental e social."]}, {"id": "p2021-01-ps08-q36", "banca": "p2021-01-ps08", "num": 36, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O conjunto de ações e serviços de saúde, prestados por órgãos e instituições públicas federais, estaduais e municipais, da Administração direta e indireta e das fundações mantidas pelo Poder Público, constitui o", "alternativas": ["Plano Nacional de Vacinação.", "Programa Nacional de Saúde e Bem-Estar Social.", "Sistema Único de Saúde.", "Planejamento Anual de Ações de Saúde e Saneamento.", "Plano de Proteção ao Cidadão."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 36", "url": "provas/p2021-01-ps08.pdf#page=11"}, {"id": "p2021-01-ps08-q37", "banca": "p2021-01-ps08", "num": 37, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Na área de atendimento e triagem de um hospital público, Ana Maria, que é uma das servidoras de plantão, reconhece, dentre os pacientes que aguardam atendimento na sala, uma prima que aparenta estar bastante indisposta, o que justifica sua presença no setor de emergência. Preocupada com o bem-estar da prima, Ana Maria sai de sua área de atendimento e se dirige à prima e a encaminha para o processo de triagem imediatamente, já que aparenta estar passando mal. Este gesto gentil e proativo de Ana Maria fere um dos princípios das ações e serviços públicos de saúde que integra o Sistema Único de Saúde. Assinale a alternativa que apresenta, de forma correta, esse princípio.", "alternativas": ["Universalidade de acesso aos serviços de saúde.", "Igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "Integralidade de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "Redução de risco de doenças e de outros agravos."], "correta": 1, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 37", "url": "provas/p2021-01-ps08.pdf#page=11"}, {"id": "p2021-01-ps08-q38", "banca": "p2021-01-ps08", "num": 38, "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Segundo a Constituição Federal, no Art. 93 da Lei nº 8.213/91, conhecida como Lei de Cotas, consta que a empresa com 100 ou mais empregados está obrigada a preencher de 2 a 5% dos seus cargos com beneficiários reabilitados ou pessoas portadoras de deficiência, habilitadas. Porém, segundo dados do Instituto Brasileiro de Geografia e Estatística (IBGE), no Brasil, existem 24,6 milhões de pessoas portadoras de deficiência. Destas, 15,2 milhões estão em idade de trabalhar no mercado formal, mas apenas 3,9% encontrariam trabalho, se a legislação fosse cumprida. Estudos revelam que são muitas as dificuldades para que as pessoas com deficiência consigam a plena inclusão no mercado de trabalho. Analisando esta conjuntura de mercado, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas IV.", "Apenas I, II e III.", "Apenas I, III e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 38", "url": "provas/p2021-01-ps08.pdf#page=12", "itens": ["I - Uma das dificuldades é a não existência de uma rede de transporte público adequada, que possa garantir o deslocamento de portadores de deficiência, até a falta de acessibilidade no local de trabalho, que, na maioria das vezes, possui escadas, banheiros inadequados e corredores estreitos para cadeirantes, por exemplo.", "II - As Pessoas com Deficiência (PcD’s) exigem muita atenção específica dos colegas de trabalho, o que acaba sobrecarregando o trabalhador com funções de assistência que não lhe cabem.", "III - A falta de preparo do mercado de trabalho para absorver os portadores de deficiência e fazer com que eles progridam profissionalmente se evidencia em comportamentos que vão desde o isolamento até a falta de percepção de suas capacidades laborativas.", "IV - A baixa escolaridade é o principal argumento usado pelos empregadores na hora de fechar as portas do mercado de trabalho para as pessoas com deficiência."]}, {"id": "p2021-01-ps08-q39", "banca": "p2021-01-ps08", "num": 39, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "A Norma Regulamentadora nº 32 (NR-32) tem por finalidade estabelecer as diretrizes básicas para a implementação de medidas de proteção à segurança e à saúde dos trabalhadores dos serviços de saúde, bem como daqueles que exercem atividades de promoção e assistência à saúde em geral. Sobre os riscos biológicos, considere os itens abaixo.\n\nQuais devem ser VEDADOS pelo empregador?", "alternativas": ["Apenas I e II.", "Apenas II e III.", "Apenas I, II, III e V.", "Apenas I, III, IV e V.", "I, II, III, IV e V."], "correta": 2, "fonte": "Prova de 2021 · Técnico em Secretariado (FAURGS), questão 39", "url": "provas/p2021-01-ps08.pdf#page=12", "itens": ["I - Utilização de pias de trabalho para fins diversos dos previstos.", "II - Ato de fumar, o uso de adornos e o manuseio de lentes de contato nos postos de trabalho.", "III - Consumo de alimentos e bebidas nos postos de trabalho.", "IV - Uso de aparelhos de telefonia celular nos postos de trabalho.", "V - Uso de calçados abertos."]}, {"id": "p2021-02-ps11-q01", "banca": "p2021-02-ps11", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche adequadamente as lacunas das linhas 04, 10, 22 e 44, nesta ordem.", "alternativas": ["à – à – a – há", "à – à – à – as", "a – a – à – as", "a – a – a – às", "a – a – a – há"], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 1", "url": "provas/p2021-02-ps11.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-02-ps11:t1"}, {"id": "p2021-02-ps11-q02", "banca": "p2021-02-ps11", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 2", "url": "provas/p2021-02-ps11.pdf#page=3", "itens": ["I - A autora do texto faz uma apologia dos problemas infantis.", "II - A autora do texto utiliza aspas como um recurso para realçar certas palavras ou expressões do texto, sentidos figurados e gírias.", "III - A autora do texto reduz os problemas infantis ao que chama de “matutar”"], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-02-ps11:t1"}, {"id": "p2021-02-ps11-q03", "banca": "p2021-02-ps11", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes sugestões de mudança na pontuação do texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 3", "url": "provas/p2021-02-ps11.pdf#page=3", "itens": ["I - Acréscimo de vírgula logo após dormir (l. 01).", "II - Inserção de vírgula imediatamente após apenas (l. 17).", "III - Substituição do ponto final após melhor (l. 46) por dois pontos."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-02-ps11:t1"}, {"id": "p2021-02-ps11-q04", "banca": "p2021-02-ps11", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que contém palavras que pertencem à mesma classe de palavras.", "alternativas": ["disso (l. 03) e deles (l. 03).", "que (l. 21) e que (l. 35)", "mas (l. 30) e com (l. 43)", "não (l. 30) e maior (l. 32)", "porque (l. 34) e por (l. 36)"], "correta": 0, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 4", "url": "provas/p2021-02-ps11.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-02-ps11:t1"}, {"id": "p2021-02-ps11-q05", "banca": "p2021-02-ps11", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta o sinônimo adequado para a respectiva palavra do texto, considerando o contexto em que esta é empregada.", "alternativas": ["acendia (l. 08) – listava", "observar (l. 14) – infringir", "captado (l. 15) - apreendido", "dissabores (l. 28) – aprazimentos", "subestimar (l. 38) – valorizar"], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 5", "url": "provas/p2021-02-ps11.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-02-ps11:t1"}, {"id": "p2021-02-ps11-q06", "banca": "p2021-02-ps11", "num": 6, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considerando que uma hora equivale a 60 minutos, 3,2 horas equivalem a", "alternativas": ["3 horas e 2 minutos.", "3 horas e 6 minutos.", "3 horas e 12 minutos.", "3 horas e 20 minutos.", "3 horas e 30 minutos."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 6", "url": "provas/p2021-02-ps11.pdf#page=4"}, {"id": "p2021-02-ps11-q07", "banca": "p2021-02-ps11", "num": 7, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as proposições abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas I e II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 7", "url": "provas/p2021-02-ps11.pdf#page=4", "itens": ["(I) 2,5 multiplicado por 2/5 é igual a 1.", "(II) 0,8 multiplicado por 0,2 é igual a 4/25.", "(III) (-5)² é igual a -25."], "figura": "provas/fig/p2021-02-ps11-q7.png"}, {"id": "p2021-02-ps11-q08", "banca": "p2021-02-ps11", "num": 8, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Dois aumentos sucessivos e acumulados, um de 25% e outro de 40%, equivalem a um único aumento de", "alternativas": ["50%.", "65%.", "75%.", "90%.", "96%."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 8", "url": "provas/p2021-02-ps11.pdf#page=4"}, {"id": "p2021-02-ps11-q09", "banca": "p2021-02-ps11", "num": 9, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere os dados da tabela a seguir, na qual constam pagamentos efetuados durante cinco meses de 2020, exceto o pagamento correspondente ao mês de setembro de 2020.\nMês | Pagamento (em reais)\nJunho | 325\nJulho | 440\nAgosto | 290\nSetembro | x\nOutubro | 145\nSe o pagamento do mês de setembro corresponde a 25% do total pago nesses cinco meses, o valor do pagamento de setembro, em reais, é", "alternativas": ["250.", "300.", "320.", "350.", "400."], "correta": 4, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 9", "url": "provas/p2021-02-ps11.pdf#page=4"}, {"id": "p2021-02-ps11-q10", "banca": "p2021-02-ps11", "num": 10, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em 2020 a população mundial foi estimada em 7,8 bilhões de pessoas. De acordo com reportagem da ONU de agosto de 2020 (https://news.un.org/pt/story/2020/08/1721771), “Covid-19 mostrou que investimentos em água e saneamento são essenciais” e que em todo o mundo 2,2 bilhões de pessoas não têm acesso à água.\nEntre as alternativas abaixo, a melhor estimativa para o percentual de pessoas, em relação à estimativa da população mundial de 2020, que em agosto de 2020 não tinha acesso à água, é de", "alternativas": ["20%.", "25%.", "28%.", "32%.", "33%."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 10", "url": "provas/p2021-02-ps11.pdf#page=4"}, {"id": "p2021-02-ps11-q11", "banca": "p2021-02-ps11", "num": 11, "materia": "Informática", "tema": "Informática", "enunciado": "Qual das alternativas apresentadas se refere ao procedimento de segurança de acesso a sítios e serviços de rede que visa garantir a identidade do usuário por meio do fornecimento adicional de informações que apenas o próprio usuário possui?", "alternativas": ["Rastreamento de cookies.", "Certificação digital.", "Assinatura digital.", "Criptografia de chave secreta.", "Verificação em duas etapas."], "correta": 4, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 11", "url": "provas/p2021-02-ps11.pdf#page=4"}, {"id": "p2021-02-ps11-q12", "banca": "p2021-02-ps11", "num": 12, "materia": "Informática", "tema": "Informática", "enunciado": "No Excel 2016, qual recurso é usado para restringir o tipo de dados ou os valores que os usuários inserem em uma célula, que se encontra na aba de “Dados”?", "alternativas": ["Opções de cálculo.", "Consolidar.", "Planilha de revisão.", "Validação de Dados.", "Filtros."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 12", "url": "provas/p2021-02-ps11.pdf#page=5"}, {"id": "p2021-02-ps11-q13", "banca": "p2021-02-ps11", "num": 13, "materia": "Informática", "tema": "Informática", "enunciado": "No Excel 2016, deseja-se registrar na célula B1 a soma de todos os dados das células da coluna A que tenham valor maior do que 2. Assinale a alternativa que apresenta a fórmula a ser escrita na célula B1.", "alternativas": ["=somase(A$:A$;”>2”)", "=somases(A$1:A$END;”>2”)", "=somase(A:A;”>2”)", "=somase(A;”>2”)", "=somase(A$:A$;>2)"], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 13", "url": "provas/p2021-02-ps11.pdf#page=5"}, {"id": "p2021-02-ps11-q14", "banca": "p2021-02-ps11", "num": 14, "materia": "Informática", "tema": "Informática", "enunciado": "No editor de texto Word 2016, a opção de formatação de _____________ que coloca pelo menos duas linhas de um parágrafo na parte superior ou inferior de uma página chama-se _____________, ao passo que, para evitar quebras de páginas entre parágrafos distintos, deve ser utilizada a opção ____________.\nAssinale a alternativa que completa, correta e respectivamente, as lacunas do texto acima:", "alternativas": ["layout – controle de linhas órfãs/viúvas – manter linhas juntas", "parágrafo – controle de linhas órfãs/viúvas – manter com o próximo", "parágrafo – manter linhas juntas – quebrar página antes", "layout – quebrar página antes – manter com o próximo", "parágrafo – manter linhas juntas – quebras páginas antes"], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 14", "url": "provas/p2021-02-ps11.pdf#page=5"}, {"id": "p2021-02-ps11-q15", "banca": "p2021-02-ps11", "num": 15, "materia": "Informática", "tema": "Informática", "enunciado": "Após o encerramento de todas as janelas de uma sessão de navegação anônima do Google Chrome, qual dos tipos de dados ou informações obtidos durante a navegação anônima permanecem no seu computador, entre os listados?", "alternativas": ["Arquivos de downloads e favoritos.", "Cookies e favoritos.", "Histórico de navegação e cookies.", "Histórico de navegação e favoritos.", "Cookies e arquivos de download."], "correta": 0, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 15", "url": "provas/p2021-02-ps11.pdf#page=5"}, {"id": "p2021-02-ps11-q22", "banca": "p2021-02-ps11", "num": 22, "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "No processo de gestão de compras de um hospital, utiliza-se como ferramenta para controle de estoques a análise da Curva ABC. Na avaliação dos resultados da Curva ABC, percebe‐se o giro dos itens no estoque, o nível da lucratividade e o grau de representação no faturamento da organização.\nSobre a Curva ABC representada acima, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 22", "url": "provas/p2021-02-ps11.pdf#page=7", "itens": ["I - É um método de classificação de informações, para que se separem os itens de maior importância ou impacto, os quais são normalmente em menor número, e para se estabelecer formas de gestão apropriada à importância de cada medicamento em relação ao valor total dos estoques.", "II - Trata‐se de classificação subjetiva de materiais que considera sua importância, baseada nas quantidades compradas e no seu valor.", "III - A análise dos recursos financeiros alocados em cada produto demonstra que um pequeno número de itens é responsável pelo comprometimento de um grande volume de recursos despendidos com materiais."], "figura": "provas/fig/p2021-02-ps11-q22.png"}, {"id": "p2021-02-ps11-q24", "banca": "p2021-02-ps11", "num": 24, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 24", "url": "provas/p2021-02-ps11.pdf#page=7", "itens": ["I - O servidor deve cumprir as tarefas de seu cargo ou função, tanto quanto possível, com critério, segurança e rapidez.", "II - O servidor não deve participar dos movimentos e estudos que se relacionem com a melhoria do exercício de suas funções.", "III - O servidor deve manter-se atualizado com as instruções, as normas de serviço e a legislação pertinentes ao órgão onde exerce suas funções."]}, {"id": "p2021-02-ps11-q31", "banca": "p2021-02-ps11", "num": 31, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Conforme a Lei 8080/1990, artigo 6º, estão incluídas no campo de atuação do SUS:\n\nAs palavras que completam corretamente as lacunas das frases acima são:", "alternativas": ["sanitária – farmacêutica – nutricional – imunobiológicos", "epidemiológica – farmacêutica – vacinal – imunobiológicos", "sanitária e epidemiológica – farmacêutica – nutricional – imunobiológicos", "sanitária – hospitalar – nutricional – alimentos", "sanitária e epidemiológica – hospitalar – vacinal – alimentos"], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 31", "url": "provas/p2021-02-ps11.pdf#page=9", "itens": ["I - A execução de ações de vigilância ____________, de saúde do trabalhador, de assistência terapêutica integral, inclusive __________.", "II - A vigilância __________ e a orientação alimentar.", "III - A formulação da política de medicamentos, equipamentos, __________ e outros insumos de interesse para saúde e participação na sua produção."]}, {"id": "p2021-02-ps11-q32", "banca": "p2021-02-ps11", "num": 32, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "A Norma Regulamentadora 32 (NR-32) estabelece as diretrizes básicas para a implementação de medidas de proteção à segurança e à saúde dos trabalhadores de serviços de saúde.\nTendo em vista as medidas de proteção aos riscos biológicos, assinale a alternativa que apresenta afirmação correta sobre a vacinação dos trabalhadores.", "alternativas": ["A todo trabalhador dos serviços de saúde, deve ser fornecida, gratuitamente, apenas a vacina contra hepatite B.", "Sempre que houver vacinas eficazes contra outros agentes biológicos a que os trabalhadores estejam expostos, o empregador deve fornecê-las gratuitamente.", "A vacinação deve obedecer apenas às recomendações da Organização Mundial da Saúde (OMS).", "Não é obrigatório o registro da vacinação no prontuário clínico individual do trabalhador.", "Não é necessário fornecer ao trabalhador o comprovante das vacinas recebidas."], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 32", "url": "provas/p2021-02-ps11.pdf#page=10"}, {"id": "p2021-02-ps11-q36", "banca": "p2021-02-ps11", "num": 36, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Segurança do Paciente consiste na redução ao mínimo aceitável de danos desnecessários ao paciente. Danos desnecessários são aqueles que podemos prevenir/evitar, pois não estão associados ao tratamento terapêutico ou à hospitalização.\nAssinale a alternativa que apresenta afirmação correta sobre Metas de Segurança do Paciente.", "alternativas": ["A identificação correta do paciente sempre deve ser confirmada com ele, mesmo em casos de alteração de nível de consciência/déficit cognitivo.", "A lista de medicamentos de alto risco ou medicamentos de alta vigilância é única para todas as instituições do Brasil e determinada pelo Instituto para Práticas Seguras no Uso de Medicamentos.", "Para garantir a meta de cirurgia segura, qualquer profissional que atue no centro cirúrgico (enfermeiro, técnico de enfermagem ou médico) pode ser o responsável pela condução do checklist.", "Para higienização das mãos, preparações alcoólicas podem ser utilizadas quando a mão estiver visivelmente suja ou contaminada com sangue ou fluidos corporais.", "Individuo independente e sem nenhum fator de risco é incluído na classificação de alto risco de queda."], "correta": 2, "fonte": "Prova de 2021 · Profissional Assistencial III (Farmácia) (FAURGS), questão 36", "url": "provas/p2021-02-ps11.pdf#page=11"}, {"id": "p2021-03-ps22-q01", "banca": "p2021-03-ps22", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 35, 40 e 41.", "alternativas": ["a – as – à – a", "a – às – a – à", "à – as – à – à", "a – às – a – a", "à – às – a – a"], "correta": 1, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 1", "url": "provas/p2021-03-ps22.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t1"}, {"id": "p2021-03-ps22-q02", "banca": "p2021-03-ps22", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – V – V.", "V – F – F.", "F – F – F.", "F – V – V.", "F – F – V."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 2", "url": "provas/p2021-03-ps22.pdf#page=3", "itens": ["(  ) O pronome que (l. 03) refere-se a pesquisas pioneiras sobre radioatividade (l. 03-04).", "(  ) O pronome lo (l. 06) refere-se a o Prêmio Nobel (l. 05).", "(  ) O pronome as (l. 40) refere-se a filhas (l. 40)."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t1"}, {"id": "p2021-03-ps22-q03", "banca": "p2021-03-ps22", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 0, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 3", "url": "provas/p2021-03-ps22.pdf#page=3", "itens": ["I - As vírgulas presentes no trecho, parte do Império Russo, (l. 15) poderiam ser substituídas por parênteses, sem que o sentido da frase seja alterado e sem que se cometa erro de pontuação.", "II - As vírgulas da linha 22 poderiam ser excluídas sem que o sentido da frase seja alterado e sem que se cometa erro de pontuação.", "III - As vírgulas no trecho, que usava os dois sobrenomes, (l. 38) poderiam ser excluídas sem que o sentido da frase seja alterado e sem que se cometa erro de pontuação."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t1"}, {"id": "p2021-03-ps22-q04", "banca": "p2021-03-ps22", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Observe as propostas de reescrita para o seguinte trecho do texto e assinale a única que preserva a significação do trecho original.\nEm 1891, aos 24 anos, seguiu sua irmã mais velha, Bronisława, para estudar em Paris, onde obteve seus diplomas superiores e conduziu seus trabalhos científicos subsequentes. (l. 18-21).", "alternativas": ["Aos 24 anos, seguiu sua irmã mais velha, Bronisława, para estudar, em 1891, onde obteve seus diplomas, em Paris. E conduziu seus trabalhos científicos subsequentes.", "Em Paris, em 1891, ela seguiu sua irmã mais velha, Bronisława, para estudar e obteve seus diplomas superiores e conduziu seus trabalhos científicos subsequentes.", "Bronisława seguiu sua irmã mais velha aos 24 anos, em 1891, para estudar em Paris, onde conduziu seus trabalhos científicos subsequentes e obteve seus diplomas superiores.", "Aos 24 anos, para estudar em Paris, seguiu Bronisława, sua irmã mais velha, em 1891. Lá obteve seus diplomas superiores e conduziu seus trabalhos científicos subsequentes.", "Em 1891, seguiu sua irmã mais velha, Bronisława, aos 24 anos para estudar em Paris, quando conduziu seus trabalhos científicos e então obteve seus diplomas superiores."], "correta": 3, "fonte": "Prova de 2021 · Profissional Assistencial II (Monitor de Creche) (FAURGS), questão 4", "url": "provas/p2021-03-ps22.pdf#page=4", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2021-03-ps22:t1"}, {"id": "p2021-03-ps22-q05", "banca": "p2021-03-ps22", "num": 5, "materia": "Po
