<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
<title>Simulado HCPA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna estreita, como um caderno de questões; alternativas viram as bolhas da folha óptica. */
:root {
  --paper: #f3f5f8;
  --card: #ffffff;
  --ink: #16202c;
  --muted: #586579;
  --line: #d6dce5;
  --pen: #1c47c9;
  --pen-soft: #e5ecff;
  --ok: #1d7748;
  --ok-soft: #e2f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131a; --card: #161d27; --ink: #e5eaf1; --muted: #98a4b4; --line: #2a3441;
    --pen: #84a6ff; --pen-soft: #1a2644; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff8576; --bad-soft: #3a1612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131a; --card: #161d27; --ink: #e5eaf1; --muted: #98a4b4; --line: #2a3441;
  --pen: #84a6ff; --pen-soft: #1a2644; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff8576; --bad-soft: #3a1612;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 680px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.2rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--pen); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }

.faixa {
  font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px;
  border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding-block: 8px;
}
.topo { display: flex; flex-direction: column; gap: 10px; }
.contagem { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.contagem .dias { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--pen); font-variant-numeric: tabular-nums; }
.contagem .rot { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats div { background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font-family: var(--f-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.8rem; color: var(--muted); }

.acoes { display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  border: 1px solid var(--line); background: var(--card); border-radius: var(--r);
  padding: 14px 16px; text-align: left; cursor: pointer; min-height: 52px;
}
.btn small { display: block; color: var(--muted); font-size: 0.85rem; }
.btn.prim { background: var(--pen); border-color: var(--pen); color: var(--card); }
.btn.prim small { color: var(--card); opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: default; }
.seta { font-family: var(--f-mono); flex: none; }

.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.temas { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.tema { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.tema:first-child { border-top: 0; }
.tema .nome { min-width: 0; }
.tema .qtd { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.barra { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; }
.barra i { display: block; height: 100%; background: var(--ok); }
.barra i.e { background: var(--bad); }

details.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 12px 14px; }
details.material summary { cursor: pointer; font-weight: 700; }
details.material ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.nota { color: var(--muted); font-size: 0.88rem; }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-btn { background: none; border: 0; padding: 0; color: var(--pen); text-decoration: underline; cursor: pointer; font-size: 0.88rem; }

/* Questão */
.barra-sup { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.barra-sup .pos { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.progresso { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progresso i { display: block; height: 100%; background: var(--pen); }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pen); background: var(--pen-soft); padding: 4px 8px; border-radius: 6px; }
.questao { display: flex; flex-direction: column; gap: 16px; }
.questao .num { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
details.texto { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
details.texto summary { cursor: pointer; font-weight: 700; }
details.texto p { margin-top: 10px; white-space: pre-line; }
.enunciado { font-size: 1.05rem; white-space: pre-line; }
.itens { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.itens li { padding-left: 12px; border-left: 2px solid var(--line); }
.opcoes { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
  width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 14px; cursor: pointer; min-height: 52px;
}
.opt .txt { min-width: 0; padding-top: 3px; }
.bolha {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted);
}
.opt.marcada { border-color: var(--pen); }
.opt.marcada .bolha { background: var(--pen); border-color: var(--pen); color: var(--card); }
.opt.certa { border-color: var(--ok); background: var(--ok-soft); }
.opt.certa .bolha { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.errada { border-color: var(--bad); background: var(--bad-soft); }
.opt.errada .bolha { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.apagada { opacity: 0.6; }
.opt:disabled { cursor: default; }

.feedback { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--card); }
.feedback .veredito { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.feedback.ok .veredito { color: var(--ok); }
.feedback.bad .veredito { color: var(--bad); }
.feedback blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--pen); background: var(--pen-soft); border-radius: 0 8px 8px 0; font-size: 0.95rem; white-space: pre-line; }
.feedback .fonte { font-size: 0.88rem; color: var(--muted); overflow-wrap: anywhere; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.nav .in > p { flex: 1 1 100%; font-size: 0.92rem; }
.nb { flex: 1 1 0; min-height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; padding: 0 12px; }
.nb.prim { background: var(--pen); color: var(--card); border-color: var(--pen); }
.nb.perigo { background: var(--bad); color: var(--card); border-color: var(--bad); }
.nb:disabled { opacity: 0.45; cursor: default; }
.sair { background: none; border: 0; color: var(--pen); cursor: pointer; padding: 6px 0; font-weight: 700; }

/* Resultado */
.placar { display: flex; flex-direction: column; gap: 6px; }
.placar .grande { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.veredito-edital { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.veredito-edital.ok { border-color: var(--ok); background: var(--ok-soft); }
.veredito-edital.bad { border-color: var(--bad); background: var(--bad-soft); }
.tabela { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabela th, .tabela td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); }
.tabela th { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; border-top: 0; }
.tabela td.n, .tabela th.n { text-align: right; font-family: var(--f-mono); white-space: nowrap; }
.revisao { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.revisao button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.revisao button:first-child { border-top: 0; }
.revisao .marca { font-family: var(--f-mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; color: var(--card); }
.revisao .marca.ok { background: var(--ok); }
.revisao .marca.bad { background: var(--bad); }
.revisao .marca.branco { background: var(--muted); }
.revisao .resumo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
/* Provas reais e folha de respostas */
.provas { display: flex; flex-direction: column; gap: 10px; }
.prova-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.prova-card h3 { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.prova-card .sub { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.prova-card .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { flex: 1 1 140px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); padding: 0 12px; font-size: 0.95rem; }
.mini.prim { background: var(--pen); border-color: var(--pen); color: var(--card); }
.aviso { background: var(--pen-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.folha { display: flex; flex-direction: column; gap: 18px; }
.bloco { display: flex; flex-direction: column; gap: 6px; }
.bloco h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.linhas { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; display: flex; flex-direction: column; }
.lf { display: flex; align-items: center; gap: 10px; padding-block: 5px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.lf:first-child { border-top: 0; }
.lf .nq { font-family: var(--f-mono); width: 2.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
.lf .bs { display: flex; gap: 8px; }
.lf .obs { font-size: 0.8rem; color: var(--muted); flex-basis: 100%; padding-left: calc(2.2em + 10px); }
.b { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--muted); background: none; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); cursor: pointer; padding: 0; }
.b[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.b.certa { background: var(--ok); border-color: var(--ok); color: var(--card); }
.b.errada { background: var(--bad); border-color: var(--bad); color: var(--card); }
.b.gab { border-color: var(--ok); color: var(--ok); border-width: 3px; }
.b:disabled { cursor: default; }
@media (prefers-reduced-motion: no-preference) {
  .progresso i, .barra i { transition: width 0.3s ease; }
}
</style>
</head>

<script id="questoes" type="application/json">[{"id": "por-01", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Considere as seguintes afirmações sobre a referência de palavras do texto.", "itens": ["I – O pronome “eles” (3º parágrafo) retoma “Os profissionais administrativos”.", "II – O pronome “ela” (último período) retoma “a forma como alguém é recebido”.", "III – O pronome “aquele” (2º parágrafo) refere-se a um paciente, termo já mencionado na mesma frase."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I está correta: “São eles que organizam as filas” só pode se referir aos profissionais administrativos, sujeito do período anterior. III está correta: “aquele que é deixado sem resposta” contrapõe-se a “Um paciente que entende”, ou seja, “aquele” = o paciente. II está errada: em “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, “ela” retoma “a sobrecarga de trabalho”. A pegadinha é o termo “a forma como alguém é recebido”, que aparece depois, na oração com “pois”; o pronome anafórico aponta para trás, não para o que vem adiante.", "fundamento": "Pronomes pessoais e demonstrativos têm função referencial (anafórica): retomam um termo já expresso, normalmente o mais próximo compatível em gênero, número e sentido.", "fonte": "Coesão referencial: função anafórica dos pronomes pessoais e demonstrativos", "url": ""}, {"id": "por-02", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações sobre os nexos do texto. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) “Por isso” (1º parágrafo) introduz uma conclusão a partir do que foi dito antes.", "( ) “no entanto” (2º parágrafo) poderia ser substituído por “portanto” sem alteração de sentido.", "( ) “Embora” (3º parágrafo) introduz uma ideia de concessão.", "( ) “pois” (último período) expressa finalidade."], "alternativas": ["V – V – F – F", "V – F – V – F", "F – F – V – V", "V – F – F – V", "F – V – V – F"], "correta": 1, "explicacao": "1ª V: como quem chega traz dor e medo, conclui-se que o primeiro contato pesa muito. 2ª F: “no entanto” é adversativo (opõe a cortesia à ideia de que acolher é só ser educado); “portanto” é conclusivo e mudaria o sentido. 3ª V: “Embora” admite um fato (a sobrecarga é real) que não impede a conclusão. 4ª F: “pois”, posposto ao verbo e iniciando a oração, é explicativo/causal (dá a razão de a indiferença não se justificar); finalidade seria “para que”.", "fundamento": "Conjunções estabelecem relações lógicas: adversativas (mas, no entanto) opõem; conclusivas (portanto, por isso) concluem; concessivas (embora, ainda que) admitem um obstáculo que não impede o fato; explicativas (pois, porque) justificam.", "fonte": "Nexos/conjunções: valor semântico das coordenativas e subordinativas", "url": ""}, {"id": "por-03", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "No trecho “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, a palavra “Embora” pode ser substituída, sem alteração do sentido e sem necessidade de outras mudanças na frase, por", "alternativas": ["Ainda que", "Visto que", "Caso", "À medida que", "Para que"], "correta": 0, "explicacao": "“Embora” é concessiva, e “Ainda que” também é, mantendo o verbo no subjuntivo (“seja”). “Visto que” é causal: diria que a sobrecarga é a causa de não se justificar a indiferença, o que não faz sentido. “Caso” é condicional e tornaria hipotético um fato que o texto afirma. “À medida que” indica proporção, e “Para que”, finalidade. A pegadinha é que todas as opções “cabem” na sintaxe com o subjuntivo ou o indicativo; só a concessiva conserva o sentido.", "fundamento": "Conjunções subordinativas concessivas (embora, ainda que, mesmo que, conquanto, se bem que) introduzem um fato contrário ao da oração principal, mas insuficiente para impedi-lo; costumam exigir o subjuntivo.", "fonte": "Conjunções subordinativas concessivas: substituição mantendo o sentido", "url": ""}, {"id": "por-04", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas da frase abaixo, na ordem em que aparecem.\n\n“Entregue o laudo ___ enfermeira responsável e informe ___ ela o horário da consulta, marcada para ___ 14h.”", "alternativas": ["a – à – às", "à – à – as", "a – a – às", "à – a – as", "à – a – às"], "correta": 4, "explicacao": "1ª lacuna: entrega-se algo A alguém (preposição) + A enfermeira (artigo) = “à”. 2ª lacuna: diante do pronome pessoal “ela” não se usa artigo, logo não há crase: “a ela”. 3ª lacuna: na indicação de hora determinada, há crase: “às 14h”. A pegadinha é a 2ª lacuna: o verbo pede a preposição, mas o pronome pessoal não admite artigo.", "fundamento": "Crase é a fusão da preposição “a” com o artigo feminino “a”. Ocorre antes de palavra feminina que admite artigo e na indicação de horas; não ocorre antes de pronomes pessoais como ela, você ou eles.", "fonte": "Crase: a + artigo feminino; ausência antes de pronome pessoal; presença na indicação de horas", "url": ""}, {"id": "por-05", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.", "alternativas": ["Faziam dois meses que o paciente aguardava a cirurgia.", "Houveram muitas reclamações sobre a demora no atendimento.", "Devem haver vagas no ambulatório na próxima semana.", "Precisa-se de técnicos de enfermagem para o turno da noite.", "Aluga-se salas comerciais próximas ao hospital."], "correta": 3, "explicacao": "Em D, “precisar de” é verbo transitivo indireto; o “se” é índice de indeterminação do sujeito e o verbo fica no singular. Em A, “fazer” indicando tempo é impessoal: “Fazia dois meses”. Em B, “haver” no sentido de existir é impessoal: “Houve”. Em C, o auxiliar de “haver” impessoal também fica no singular: “Deve haver”. Em E, “alugar” é transitivo direto e o “se” é partícula apassivadora; o verbo concorda com o sujeito “salas”: “Alugam-se”. A pegadinha é tratar D e E como iguais: só com VTI o singular é obrigatório.", "fundamento": "Haver (existir) e fazer (tempo decorrido) são impessoais e ficam na 3ª pessoa do singular, inclusive o auxiliar da locução. Com VTD + se (voz passiva sintética), o verbo concorda com o sujeito; com VTI + se (índice de indeterminação), fica no singular.", "fonte": "Concordância verbal: verbos impessoais e voz passiva sintética × índice de indeterminação do sujeito", "url": ""}, {"id": "por-06", "materia": "Português", "tema": "Português", "enunciado": "Considere as frases abaixo quanto à regência verbal, segundo a norma-padrão.", "itens": ["I – A paciente preferia mais ser atendida pela manhã do que à tarde.", "II – Os usuários devem obedecer às normas de visitação do hospital.", "III – Os familiares chegaram no hospital antes do horário de visita."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "explicacao": "II está correta: “obedecer” é transitivo indireto e exige a preposição “a” (obedecer às normas). I está errada: “preferir” rege a preposição “a” e não admite “mais... do que”; o correto é “preferia ser atendida pela manhã a ser atendida à tarde”. III está errada: verbos de movimento como “chegar” regem a preposição “a” na norma-padrão (“chegaram ao hospital”); “chegar em” é uso coloquial. A pegadinha é que I e III soam naturais na fala.", "fundamento": "Preferir: prefere-se uma coisa a outra, sem intensificadores. Obedecer/desobedecer: transitivos indiretos (preposição a). Chegar, ir: regem a preposição a para indicar destino.", "fonte": "Regência verbal: preferir, obedecer e chegar", "url": ""}, {"id": "por-07", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a pontuação está correta.", "alternativas": ["Os pacientes que aguardam na fila, devem apresentar o cartão do SUS.", "O hospital, que atende pelo SUS recebe pacientes de todo o estado.", "Na semana passada, a ouvidoria recebeu elogios, sugestões e reclamações.", "A enfermeira explicou, os cuidados ao familiar do paciente.", "Senhora, Maria por favor, aguarde ser chamada."], "correta": 2, "explicacao": "Em C, a vírgula isola o adjunto adverbial deslocado para o início (“Na semana passada”) e as demais separam os itens de uma enumeração. Em A, há vírgula entre o sujeito (“Os pacientes que aguardam na fila”) e o verbo (“devem”). Em B, a oração adjetiva explicativa foi aberta e não fechada: “O hospital, que atende pelo SUS, recebe...”. Em D, a vírgula separa o verbo de seu complemento. Em E, o vocativo é “Senhora Maria” e deve vir isolado inteiro: “Senhora Maria, por favor, aguarde...”.", "fundamento": "Não se separa por vírgula o sujeito do verbo nem o verbo de seus complementos. Isolam-se por vírgulas o adjunto adverbial deslocado, os termos de enumeração, as orações adjetivas explicativas (nos dois lados) e o vocativo.", "fonte": "Pontuação: emprego da vírgula", "url": ""}, {"id": "inf-01", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha do Excel, a célula B2 contém a fórmula =A2*$C$1. Essa célula foi copiada e colada na célula C3 (uma linha abaixo e uma coluna à direita). A fórmula que aparecerá em C3 é", "alternativas": ["=A3*$C$1", "=B3*$D$2", "=A2*$C$1", "=B3*$D$1", "=B3*$C$1"], "correta": 4, "explicacao": "A referência A2 é relativa: ao deslocar a fórmula uma linha para baixo e uma coluna para a direita, ela vira B3. A referência $C$1 é absoluta (cifrão antes da coluna e da linha) e não muda. Resultado: =B3*$C$1. As pegadinhas: em A só a linha foi ajustada; em B e D a referência absoluta foi tratada como relativa; em C nada foi ajustado.", "fundamento": "A página da Microsoft explica que, por padrão, a referência é relativa e se ajusta ao ser copiada; o cifrão antes da coluna e da linha ($A$1) a torna absoluta, e F4 alterna entre os tipos. Na tabela do suporte, $A$1 copiada continua $A$1, enquanto A1 vira C3.", "fonte": "Microsoft Suporte – Alternar entre referências relativas, absolutas e mistas", "url": "https://support.microsoft.com/pt-br/office/alternar-entre-refer%C3%AAncias-relativas-absolutas-e-mistas-dfec08cd-ae65-4f56-839e-5f0d8d0baca9"}, {"id": "inf-02", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre funções de pesquisa do Excel.", "itens": ["I – Na função PROCV, o valor procurado deve estar na primeira coluna do intervalo informado como matriz_tabela.", "II – Na fórmula =PROCV(A2;D2:F50;3;FALSO), o número 3 indica que o valor retornado virá da coluna F, e o argumento FALSO indica correspondência exata.", "III – Assim como a PROCV, a função PROCX só pesquisa da esquerda para a direita, não podendo retornar valores de colunas situadas à esquerda da coluna pesquisada."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I está correta: a primeira coluna da matriz deve conter o valor procurado. II está correta: o índice de coluna conta a partir da primeira coluna da matriz (D=1, E=2, F=3), e FALSO/0 pede correspondência exata. III está errada: essa limitação é da PROCV; a PROCX recebe a matriz de pesquisa e a de retorno separadamente e funciona com o retorno de qualquer lado. Pegadinha extra: o índice 3 não é a 3ª coluna da planilha (C), e sim a 3ª coluna da matriz.", "fundamento": "Suporte Microsoft: a primeira coluna do intervalo deve conter o valor procurado; o número da coluna começa em 1 na coluna mais à esquerda da matriz; 0/FALSO pesquisa o valor exato. A PROCX retorna resultados independentemente do lado da coluna de retorno, ao contrário da PROCV.", "fonte": "Microsoft Suporte – Função PROCV; Função PROCX", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-procv-0bbc8083-26fe-4963-8ab8-93a18ad188a1"}, {"id": "inf-03", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha (Excel ou Google Planilhas), o intervalo B2:B7 contém, nesta ordem, os textos Agendado, Faltou, Agendado, Atendido, Faltou, Faltou; o intervalo C2:C7 contém os tempos de espera 20, 35, 15, 40, 25, 15. Foram digitadas as fórmulas: D1: =CONT.SE(B2:B7;\"Faltou\") | D2: =SE(D1>3;\"Revisar agenda\";\"Normal\") | D3: =MÉDIA(C2:C7). Os resultados exibidos em D1, D2 e D3 são, respectivamente,", "alternativas": ["3 – Normal – 25", "3 – Revisar agenda – 25", "2 – Normal – 25", "3 – Normal – 30", "4 – Revisar agenda – 22,5"], "correta": 0, "explicacao": "CONT.SE conta as células de B2:B7 iguais a \"Faltou\": são 3 (B3, B6 e B7). Em D2, o teste é D1>3, ou seja, 3>3, que é FALSO; por isso SE devolve o terceiro argumento, \"Normal\". MÉDIA: (20+35+15+40+25+15)/6 = 150/6 = 25. A pegadinha é o operador “maior que” (>) e não “maior ou igual” (>=): com 3 faltas o teste é falso.", "fundamento": "CONT.SE(intervalo; critério) conta as células do intervalo que atendem ao critério. SE(teste_lógico; valor_se_verdadeiro; [valor_se_falso]) devolve o segundo argumento se o teste for VERDADEIRO e o terceiro se for FALSO.", "fonte": "Microsoft Suporte – Função CONT.SE; Função SE", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-cont-se-e0de10c6-f885-4e71-abb4-1f464816df34"}, {"id": "inf-04", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre o compartilhamento de arquivos no Google Drive, assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Quem recebe o acesso de Leitor pode ver e abrir o arquivo, mas não pode editá-lo, comentá-lo nem compartilhá-lo.", "( ) Quem recebe o acesso de Comentador (comentarista) pode adicionar comentários e fazer sugestões, mas não editar o conteúdo diretamente.", "( ) Por padrão, os Editores podem mudar as permissões e compartilhar o arquivo, mas essa possibilidade pode ser desativada nas configurações de compartilhamento.", "( ) Quando o acesso geral é definido como “Qualquer pessoa com o link”, só consegue abrir o arquivo quem tem Conta do Google e foi convidado individualmente."], "alternativas": ["V – F – V – F", "F – V – V – V", "V – V – F – F", "V – V – V – F", "V – F – F – V"], "correta": 3, "explicacao": "As três primeiras estão de acordo com a Central de Ajuda do Drive: Leitor só vê; Comentador comenta e sugere; Editor edita e, por padrão, também compartilha e muda permissões, o que pode ser desligado desmarcando “Permitir que os editores mudem as permissões e compartilhem”. A quarta é falsa: com “Qualquer pessoa com o link”, quem tiver o link abre o arquivo mesmo sem fazer login; convite individual é o modo “Restrito”. Observação: a página atual do Drive chama o papel de “Comentador”; outras páginas do Google usam “comentarista”.", "fundamento": "Segundo a Central de Ajuda do Google Drive, Leitores não editam, comentam nem compartilham; Editores podem mudar permissões e compartilhar por padrão; com “Qualquer pessoa com o link”, qualquer pessoa que tenha o link abre o arquivo sem fazer login.", "fonte": "Google Drive Ajuda – Compartilhar arquivos do Google Drive", "url": "https://support.google.com/drive/answer/2494822?hl=pt-BR"}, {"id": "inf-05", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre revisão colaborativa de documentos.", "itens": ["I – No Documentos Google, uma pessoa com permissão para comentar pode sugerir edições; as sugestões aparecem destacadas, o texto excluído aparece tachado, e o texto original só é substituído se a sugestão for aceita.", "II – No Microsoft Word, o recurso Controlar Alterações é ativado pela guia Revisão.", "III – No Microsoft Word, é possível aceitar ou rejeitar as alterações uma a uma ou todas de uma vez."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três estão corretas. I: o Google permite sugerir edições a quem tem permissão de comentar ou editar; o que se exclui fica tachado e só substitui o original após aprovação. II: no Word, o caminho é Revisão > Controlar Alterações. III: o Word oferece Aceitar/Rejeitar para cada alteração e “Aceitar Todas as Alterações” / “Rejeitar Todas as Alterações”. A pegadinha é supor que só Editores sugerem no Google Docs: Comentaristas também podem.", "fundamento": "Google: as pessoas podem sugerir edições quando têm permissão para comentar ou editar; exclusões aparecem tachadas e as sugestões aprovadas substituem o original. Microsoft: na guia Revisão, Controlar Alterações; aceitar ou rejeitar uma a uma ou todas.", "fonte": "Google Documentos Ajuda – Sugerir edições; Microsoft Suporte – Controlar alterações no Word", "url": "https://support.google.com/docs/answer/6033474?hl=pt-BR"}, {"id": "inf-06", "materia": "Informática", "tema": "Informática", "enunciado": "De acordo com a Cartilha de Segurança para Internet (CERT.br), assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Pagar o resgate exigido por um ransomware garante a recuperação dos dados; por isso, manter backups é dispensável.", "( ) Phishing é a fraude em que o golpista tenta obter dados pessoais e financeiros combinando meios técnicos e engenharia social, por exemplo com mensagens que se passam pela comunicação oficial de uma instituição.", "( ) Com a verificação em duas etapas ativada, mesmo que o atacante descubra a senha, ele precisará de outras informações para acessar a conta.", "( ) O recebimento de códigos por SMS é o método de verificação em duas etapas mais seguro e deve ser preferido à chave de segurança física."], "alternativas": ["V – V – F – F", "F – V – V – F", "F – F – V – V", "V – F – V – F", "F – V – F – V"], "correta": 1, "explicacao": "1ª F: a Cartilha afirma que pagar o resgate não garante o acesso aos dados, e que a única garantia é ter backups atualizados. 2ª V: é a definição de phishing do livro da Cartilha. 3ª V: é o que o fascículo Autenticação diz sobre a verificação em duas etapas. 4ª F: o fascículo diz que a chave de segurança física é a opção mais segura e recomenda usar SMS só se não houver outras opções.", "fundamento": "Cartilha: ransomware torna os dados inacessíveis e cobra resgate, que não garante a recuperação; backups atualizados são a única garantia. Phishing combina meios técnicos e engenharia social. Na verificação em duas etapas, prefira chave física ou aplicativo; SMS só sem alternativa.", "fonte": "CERT.br – Cartilha: página Ransomware (cartilha.cert.br/ransomware/); Fascículo Autenticação; Livro, cap. Golpes na Internet, seção 2.3 Phishing", "url": "https://cartilha.cert.br/ransomware/"}, {"id": "inf-07", "materia": "Informática", "tema": "Informática", "enunciado": "Segundo a Cartilha de Segurança para Internet (CERT.br), assinale a alternativa correta sobre certificado digital e assinatura digital.", "alternativas": ["A assinatura digital garante a confidencialidade de um documento, impedindo que terceiros leiam o seu conteúdo.", "A assinatura digital é gerada com a chave pública do autor e verificada com a chave privada dele.", "O certificado digital associa uma chave pública a uma entidade e é emitido por uma Autoridade Certificadora (AC), que também publica a lista dos certificados que deixaram de ser confiáveis.", "Todo certificado autoassinado é malicioso, pois somente uma AC comercial pode emitir certificados legítimos.", "O certificado digital não possui prazo de validade: uma vez emitido, vale até ser revogado."], "correta": 2, "explicacao": "C reproduz a definição da Cartilha: registro eletrônico que distingue uma entidade e a associa a uma chave pública, emitido por uma AC, que publica a Lista de Certificados Revogados (LCR). A está errada: a assinatura digital comprova autenticidade e integridade, não sigilo. B inverte as chaves: assina-se com a chave privada e verifica-se com a pública. D está errada: as ACs raízes têm certificado autoassinado, e há usos legítimos (o uso malicioso também existe). E está errada: a validade (data de emissão e de expiração) é um dos dados do certificado.", "fundamento": "Cartilha (cap. Criptografia): a assinatura digital comprova autenticidade e integridade; é feita com a chave privada e verificada com a pública. O certificado associa uma chave pública a uma entidade, é emitido por uma AC, que mantém a LCR, e traz a validade.", "fonte": "CERT.br – Cartilha de Segurança para Internet (livro), cap. 9 Criptografia, seções 9.3 Assinatura digital e 9.4 Certificado digital", "url": "https://cartilha.cert.br/livro/"}, {"id": "rl-01", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação lógica da proposição “Se o paciente chegou atrasado, então a consulta foi remarcada” é", "alternativas": ["O paciente chegou atrasado e a consulta não foi remarcada.", "Se o paciente não chegou atrasado, então a consulta não foi remarcada.", "O paciente não chegou atrasado ou a consulta foi remarcada.", "O paciente não chegou atrasado e a consulta foi remarcada.", "Se a consulta não foi remarcada, então o paciente não chegou atrasado."], "correta": 0, "explicacao": "Sejam p = “o paciente chegou atrasado” e q = “a consulta foi remarcada”. A condicional p → q só é falsa quando p é V e q é F; logo, sua negação é p ∧ ~q: “chegou atrasado e a consulta não foi remarcada”. Conferido por tabela-verdade nas 4 linhas: só A coincide com ~(p → q). Pegadinhas: C (~p ∨ q) e E (~q → ~p) são EQUIVALENTES à frase original, não sua negação; B é a inversa; D nega a parte errada. Erro comum: negar uma condicional com outra condicional.", "fundamento": "~(p → q) ≡ p ∧ ~q: mantém-se o antecedente, troca-se “se... então” por “e” e nega-se o consequente.", "fonte": "Resolução", "url": ""}, {"id": "rl-02", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma proposição logicamente equivalente a “Se o setor recebe a documentação, então o cadastro é liberado” é", "alternativas": ["Se o cadastro é liberado, então o setor recebe a documentação.", "Se o setor não recebe a documentação, então o cadastro não é liberado.", "O setor recebe a documentação e o cadastro não é liberado.", "Se o cadastro não é liberado, então o setor não recebe a documentação.", "O setor recebe a documentação ou o cadastro não é liberado."], "correta": 3, "explicacao": "Com p = “o setor recebe a documentação” e q = “o cadastro é liberado”, a frase é p → q. A contrapositiva ~q → ~p (alternativa D) é equivalente: inverte-se a ordem e negam-se as duas partes. Conferido por tabela-verdade: só D coincide com p → q nas 4 linhas. A é a recíproca (q → p); B é a inversa (~p → ~q); C é a negação (p ∧ ~q); E é p ∨ ~q, que equivale a q → p (recíproca), e não a p → q. Atenção: “O setor NÃO recebe a documentação OU o cadastro é liberado” (~p ∨ q) também seria equivalente, mas não está entre as opções; a pegadinha de E é negar o termo errado.", "fundamento": "p → q ≡ ~q → ~p (contrapositiva) ≡ ~p ∨ q. A recíproca (q → p) e a inversa (~p → ~q) não são equivalentes à condicional original.", "fonte": "Resolução", "url": ""}, {"id": "rl-03", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação da proposição “Todos os pacientes foram atendidos e nenhum paciente reclamou” é", "alternativas": ["Nenhum paciente foi atendido e todos os pacientes reclamaram.", "Algum paciente não foi atendido e algum paciente reclamou.", "Nem todos os pacientes foram atendidos ou nenhum paciente reclamou.", "Todos os pacientes não foram atendidos ou algum paciente reclamou.", "Algum paciente não foi atendido ou algum paciente reclamou."], "correta": 4, "explicacao": "Passo 1 (De Morgan): ~(P ∧ Q) ≡ ~P ∨ ~Q — o “e” vira “ou” e as duas partes são negadas. Passo 2: ~(“Todos foram atendidos”) = “Algum paciente não foi atendido”. Passo 3: ~(“Nenhum reclamou”) = “Algum paciente reclamou”. Resultado: alternativa E. B mantém o “e” (erro de De Morgan); C não nega a segunda parte; A e D trocam “todos” por “nenhum”/“todos... não”, que é o contrário, não a negação (“todos não foram atendidos” equivale a “nenhum foi atendido”).", "fundamento": "De Morgan: ~(P ∧ Q) ≡ ~P ∨ ~Q. Quantificadores: a negação de “Todo A é B” é “Algum A não é B”; a negação de “Nenhum A é B” é “Algum A é B”.", "fonte": "Resolução", "url": ""}, {"id": "rl-04", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um setor com 120 funcionários, 68 fizeram o curso de Comunicação Não-Violenta (CNV), 50 fizeram o curso de LGPD e 22 fizeram os dois cursos. O número de funcionários que fizeram apenas um dos dois cursos é", "alternativas": ["96", "74", "24", "118", "46"], "correta": 1, "explicacao": "Apenas CNV = 68 − 22 = 46. Apenas LGPD = 50 − 22 = 28. Apenas um dos cursos = 46 + 28 = 74. Conferência: 46 + 28 + 22 = 96 fizeram ao menos um curso (união = 68 + 50 − 22 = 96) e 120 − 96 = 24 não fizeram nenhum. As distratoras são valores intermediários do próprio cálculo: 96 (pelo menos um curso), 24 (nenhum), 46 (apenas CNV) e 118 (soma direta 68 + 50, contando a interseção duas vezes). Contas rodadas em Python.", "fundamento": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B). “Apenas A” = n(A) − n(A ∩ B). “Apenas um” = n(A ∪ B) − n(A ∩ B).", "fonte": "Resolução", "url": ""}, {"id": "rl-05", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um prontuário foi esquecido na sala de espera, e sabe-se que foi exatamente uma de quatro pessoas: Ana, Bruno, Carla ou Davi. Questionadas, disseram:\nAna: “Foi o Bruno.”\nBruno: “Foi o Davi.”\nCarla: “Não fui eu.”\nDavi: “O Bruno está mentindo.”\nSabendo que apenas uma das quatro pessoas mentiu, quem esqueceu o prontuário?", "alternativas": ["Ana", "Carla", "Bruno", "Davi", "Não é possível determinar."], "correta": 2, "explicacao": "As falas de Bruno e Davi são contraditórias (Davi diz que Bruno mente): exatamente uma delas é falsa. Como só há uma mentira, ela está entre Bruno e Davi, e Ana e Carla dizem a verdade. Se Ana diz a verdade, foi o Bruno. Conferência: Bruno (“Foi o Davi”) mente; Davi (“Bruno está mentindo”) diz a verdade; Carla (“Não fui eu”) diz a verdade — exatamente 1 mentira. Testando os 4 culpados possíveis em Python: Ana → 2 mentiras; Bruno → 1; Carla → 3; Davi → 2. Só Bruno satisfaz a condição, então E também está descartada.", "fundamento": "Em problemas de verdades e mentiras, procure duas afirmações contraditórias: uma delas é necessariamente falsa, o que localiza a(s) mentira(s) e torna verdadeiras as demais.", "fonte": "Resolução", "url": ""}, {"id": "rl-06", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um ambulatório realizava 800 consultas por mês. No mês seguinte, o número de consultas aumentou 15% e, no mês subsequente, diminuiu 10% em relação ao mês anterior. O número de consultas no último mês foi", "alternativas": ["828", "840", "820", "832", "860"], "correta": 0, "explicacao": "Aumento de 15%: 800 × 1,15 = 920. Redução de 10% sobre 920: 920 × 0,90 = 828. Equivalente: 800 × 1,15 × 0,90 = 800 × 1,035 = 828 (conta rodada em Python). A pegadinha é a alternativa 840: somar as porcentagens (+15% − 10% = +5%) ignora que a redução incide sobre a base nova (920), e não sobre 800. As demais (820, 832, 860) não correspondem a nenhuma aplicação correta das duas porcentagens.", "fundamento": "Porcentagens sucessivas se multiplicam: aumento de i% → fator (1 + i/100); redução de j% → fator (1 − j/100). O fator total é o produto dos fatores, não a soma das porcentagens.", "fonte": "Resolução", "url": ""}, {"id": "rl-07", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma paciente iniciou sessões de fisioterapia na segunda-feira, 2 de novembro de 2026, com uma sessão a cada 4 dias (2/11, 6/11, 10/11, e assim por diante). A 10ª sessão ocorrerá em", "alternativas": ["4 de dezembro, sexta-feira.", "6 de dezembro, domingo.", "8 de dezembro, segunda-feira.", "12 de dezembro, sábado.", "8 de dezembro, terça-feira."], "correta": 4, "explicacao": "As datas formam uma progressão aritmética de razão 4. Da 1ª à 10ª sessão há 9 intervalos: 9 × 4 = 36 dias. 2/11 + 36 dias: novembro tem 30 dias, então 2/11 + 28 = 30/11 e mais 8 dias = 8/12. Dia da semana: 36 = 5 × 7 + 1, logo a data cai 1 dia da semana após segunda-feira: terça-feira. Conferido em Python (datetime): 2/11/2026 é segunda e 8/12/2026 é terça. Pegadinhas: 12/12 conta 10 intervalos (40 dias); 4/12 é a 9ª sessão; a opção C tem a data certa e o dia errado.", "fundamento": "n-ésimo termo de uma PA: aₙ = a₁ + (n − 1)·r. Para o dia da semana, só importa o resto da divisão do número de dias por 7.", "fonte": "Resolução", "url": ""}, {"id": "sus-01", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas dos incisos abaixo, transcritos do art. 7º da Lei nº 8.080/1990.\n\nI – ________ de acesso aos serviços de saúde em todos os níveis de assistência;\nII – ________ de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema;\nIV – ________ da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "alternativas": ["integralidade – universalidade – equidade", "universalidade – integralidade – equidade", "universalidade – integralidade – igualdade", "equidade – integralidade – universalidade", "universalidade – equidade – igualdade"], "correta": 2, "explicacao": "O texto da Lei 8.080 usa “universalidade” (I), “integralidade” (II) e “igualdade” (IV). A pegadinha é “equidade”: o termo é muito usado na doutrina do SUS, mas não é a palavra que aparece no inciso IV do art. 7º.", "fundamento": "Art. 7º, I – universalidade de acesso aos serviços de saúde em todos os níveis de assistência; II – integralidade de assistência [...]; IV – igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "fonte": "Lei 8.080/1990, art. 7º, I, II e IV", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-02", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Considere as afirmações abaixo sobre os objetivos do Sistema Único de Saúde (SUS), conforme o art. 5º da Lei nº 8.080/1990.\n\nQuais estão corretas?", "itens": ["I – É objetivo do SUS a identificação e divulgação dos fatores condicionantes e determinantes da saúde.", "II – É objetivo do SUS a formulação de política de saúde destinada a promover, nos campos econômico e social, a observância do dever do Estado de garantir a saúde.", "III – É objetivo do SUS a assistência às pessoas exclusivamente por meio de ações de recuperação da saúde, ficando as atividades preventivas a cargo de outros setores do governo."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II reproduzem os incisos I e II do art. 5º (o inciso II remete ao § 1º do art. 2º, que trata do dever do Estado). III está errada: a lei prevê ações de promoção, proteção e recuperação, com realização integrada das ações assistenciais e das atividades preventivas.", "fundamento": "Art. 5º São objetivos do Sistema Único de Saúde SUS: [...] III - a assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas.", "fonte": "Lei 8.080/1990, art. 5º, I a III (e art. 2º, § 1º)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-03", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com o art. 6º da Lei nº 8.080/1990, estão incluídas no campo de atuação do Sistema Único de Saúde (SUS) as ações abaixo, EXCETO:", "alternativas": ["a vigilância nutricional e a orientação alimentar.", "a fiscalização e a inspeção de alimentos, água e bebidas para consumo humano.", "a ordenação da formação de recursos humanos na área de saúde.", "a colaboração na proteção do meio ambiente, nele compreendido o do trabalho.", "a formulação e a execução, de forma exclusiva, da política de saneamento básico."], "correta": 4, "explicacao": "Quanto ao saneamento básico, a lei atribui ao SUS apenas a participação na formulação da política e na execução de ações, e não a condução exclusiva da política. As demais alternativas reproduzem os incisos IV, VIII, III e V do art. 6º.", "fundamento": "Art. 6º Estão incluídas ainda no campo de atuação do Sistema Único de Saúde (SUS): [...] II - a participação na formulação da política e na execução de ações de saneamento básico;", "fonte": "Lei 8.080/1990, art. 6º, II, III, IV, V e VIII", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-04", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com as definições do art. 6º da Lei nº 8.080/1990.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Entende-se por vigilância sanitária um conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde.", "( ) A vigilância epidemiológica abrange o controle de bens de consumo que, direta ou indiretamente, se relacionem com a saúde, compreendidas todas as etapas e processos, da produção ao consumo.", "( ) Entende-se por vigilância epidemiológica um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.", "( ) Para fins da lei, a saúde do trabalhador destina-se apenas à recuperação e reabilitação dos trabalhadores já acidentados, não abrangendo ações de promoção e proteção da saúde."], "alternativas": ["F – V – V – F", "V – F – V – F", "V – V – F – F", "V – F – F – V", "F – F – V – V"], "correta": 1, "explicacao": "O controle de bens de consumo “da produção ao consumo” integra a vigilância sanitária (§ 1º, I), não a epidemiológica: é a troca entre as duas vigilâncias. A saúde do trabalhador (§ 3º) abrange promoção e proteção, além de recuperação e reabilitação.", "fundamento": "§ 3º Entende-se por saúde do trabalhador [...] um conjunto de atividades que se destina, através das ações de vigilância epidemiológica e vigilância sanitária, à promoção e proteção da saúde dos trabalhadores, assim como visa à recuperação e reabilitação da saúde dos trabalhadores [...]", "fonte": "Lei 8.080/1990, art. 6º, §§ 1º, 2º e 3º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-05", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Segundo o art. 7º, IX, da Lei nº 8.080/1990, a descentralização político-administrativa no Sistema Único de Saúde (SUS) ocorre", "alternativas": ["com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os municípios e com regionalização e hierarquização da rede de serviços de saúde.", "com direção compartilhada entre União, Estados e Municípios em cada serviço, com ênfase na descentralização dos serviços para os Estados.", "com direção única exercida pela União, com ênfase na centralização dos serviços de maior complexidade e com regionalização da rede.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os Estados e com hierarquização dos profissionais de saúde.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os consórcios intermunicipais, dispensada a regionalização."], "correta": 0, "explicacao": "A lei fala em direção única em cada esfera de governo, com ênfase na descentralização para os municípios, e não para os Estados. Regionalização e hierarquização referem-se à rede de serviços de saúde, não aos profissionais.", "fundamento": "IX - descentralização político-administrativa, com direção única em cada esfera de governo: a) ênfase na descentralização dos serviços para os municípios; b) regionalização e hierarquização da rede de serviços de saúde;", "fonte": "Lei 8.080/1990, art. 7º, IX, alíneas a e b", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-06", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com os arts. 2º a 4º da Lei nº 8.080/1990, assinale a alternativa correta.", "alternativas": ["O dever do Estado de garantir a saúde exclui o das pessoas, da família, das empresas e da sociedade.", "A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "Integram o SUS somente os órgãos da Administração direta federal, estadual e municipal, excluídas as fundações mantidas pelo Poder Público.", "As instituições públicas de produção de medicamentos, sangue e hemoderivados não estão incluídas no SUS, por se tratarem de atividade industrial.", "Para a lei, os níveis de saúde dependem apenas da oferta de serviços médicos, não sendo considerados fatores como moradia, renda e educação."], "correta": 1, "explicacao": "O art. 4º, § 2º, prevê a participação da iniciativa privada em caráter complementar. O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade (art. 2º, § 2º). O SUS inclui a Administração indireta, as fundações e as instituições públicas de produção de insumos (art. 4º). O art. 3º lista moradia, renda, educação e outros determinantes.", "fundamento": "Art. 4º, § 2º A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "fonte": "Lei 8.080/1990, art. 2º, § 2º; art. 3º; art. 4º, caput e §§ 1º e 2º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-07", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O art. 7º da Lei nº 8.080/1990 estabelece os princípios que as ações e serviços públicos de saúde, e os serviços privados contratados ou conveniados que integram o SUS, devem obedecer. Assinale a alternativa INCORRETA em relação a esses princípios.", "alternativas": ["Conjugação dos recursos financeiros, tecnológicos, materiais e humanos exclusivamente da União na prestação de serviços de assistência à saúde da população.", "Utilização da epidemiologia para o estabelecimento de prioridades, a alocação de recursos e a orientação programática.", "Organização dos serviços públicos de modo a evitar duplicidade de meios para fins idênticos.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "Atenção humanizada."], "correta": 0, "explicacao": "O inciso XI fala em conjugação dos recursos da União, dos Estados, do Distrito Federal e dos Municípios, não apenas da União. As demais alternativas reproduzem os incisos VII, XIII, III e XVI (este incluído pela Lei nº 15.126/2025).", "fundamento": "XI - conjugação dos recursos financeiros, tecnológicos, materiais e humanos da União, dos Estados, do Distrito Federal e dos Municípios na prestação de serviços de assistência à saúde da população;", "fonte": "Lei 8.080/1990, art. 7º, III, VII, XI, XIII e XVI", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "hum-01", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Segundo o documento HumanizaSUS: documento base para gestores e trabalhadores do SUS (Ministério da Saúde, 2008), a Política Nacional de Humanização (PNH) possui três princípios, a partir dos quais se desdobra como política pública de saúde. Esses princípios são:", "alternativas": ["acolhimento; clínica ampliada; co-gestão.", "universalidade; integralidade; equidade.", "transversalidade; indissociabilidade entre atenção e gestão; protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "visita aberta; direito à acompanhante; acolhimento com classificação de risco.", "descentralização; regionalização; hierarquização."], "correta": 2, "explicacao": "Os três princípios da PNH são transversalidade, indissociabilidade entre atenção e gestão e protagonismo/co-responsabilidade/autonomia. Acolhimento, clínica ampliada e co-gestão são diretrizes; visita aberta e classificação de risco são dispositivos. As alternativas B e E trazem princípios e diretrizes do SUS, não da PNH.", "fundamento": "O documento afirma que a PNH, como movimento de mudança dos modelos de atenção e gestão, tem três princípios: transversalidade; indissociabilidade entre atenção e gestão; e protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios da PNH”, p. 23-24", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-02", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "A PNH se estrutura a partir de princípios, método, diretrizes e dispositivos. Considere as afirmações abaixo, de acordo com o HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nQuais estão corretas?", "itens": ["I – Acolhimento e clínica ampliada estão entre as diretrizes da PNH.", "II – O Grupo de Trabalho de Humanização (GTH) e a Visita Aberta e Direito à Acompanhante estão entre os dispositivos da PNH.", "III – A transversalidade é uma das diretrizes da PNH, ao lado da co-gestão e da defesa dos direitos do usuário."], "alternativas": ["Apenas I e II.", "Apenas I.", "Apenas III.", "Apenas II e III.", "I, II e III."], "correta": 0, "explicacao": "I e II estão de acordo com as listas de diretrizes e de dispositivos do documento. III está errada porque a transversalidade é princípio da PNH, e não diretriz. A pegadinha é misturar os níveis princípio, diretriz e dispositivo.", "fundamento": "O documento lista como diretrizes a clínica ampliada, a co-gestão, o acolhimento, a valorização do trabalho e do trabalhador e a defesa dos direitos do usuário, entre outras. Entre os dispositivos estão o GTH, o colegiado gestor e a visita aberta e direito à acompanhante. A transversalidade aparece como princípio.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios”, “Diretrizes” e “Dispositivos da PNH”, p. 23-27", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-03", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "O HumanizaSUS: documento base para gestores e trabalhadores do SUS afirma que a PNH caminha no sentido da inclusão, nos processos de produção de saúde, dos diferentes agentes implicados, e fala em um “método de tríplice inclusão”. Essa tríplice inclusão compreende a inclusão", "alternativas": ["dos usuários, dos familiares e dos acompanhantes nas decisões clínicas.", "da União, dos Estados e dos Municípios no financiamento das ações de humanização.", "da atenção básica, da média complexidade e da alta complexidade em uma rede única.", "dos diferentes sujeitos (gestores, trabalhadores e usuários), dos analisadores sociais e do coletivo.", "dos trabalhadores, dos conselhos de saúde e das ouvidorias no planejamento hospitalar."], "correta": 3, "explicacao": "O método da PNH inclui os diferentes sujeitos (gestores, trabalhadores e usuários), os analisadores sociais (fenômenos que desestabilizam os modelos tradicionais de atenção e gestão) e o coletivo. As outras alternativas trocam essa tríade por divisões que soam plausíveis, mas não estão no documento.", "fundamento": "O método de tríplice inclusão compreende: incluir os diferentes sujeitos (gestores, trabalhadores e usuários), com rodas; incluir os analisadores sociais, com análise coletiva dos conflitos; e incluir o coletivo, como movimento social organizado ou experiência grupal, com fomento das redes.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “O método da PNH”, p. 24-25", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-04", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o glossário do HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Na classificação de risco, o critério de priorização da atenção passa a ser o agravo à saúde e/ou o grau de sofrimento, e não mais a ordem de chegada.", "( ) O acolhimento restringe-se à recepção do usuário na porta de entrada, encerrando-se a responsabilização da equipe no momento em que ele é encaminhado ao setor de atendimento.", "( ) A ambiência refere-se exclusivamente à estrutura física do serviço, como luminosidade, ruídos e temperatura, sem relação com a forma de acolher e de interagir.", "( ) Entre as propostas da clínica ampliada está o compromisso com o sujeito, e não só com a doença."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – F – V", "V – F – F – V"], "correta": 4, "explicacao": "O acolhimento implica responsabilização do trabalhador/equipe pelo usuário desde a chegada até a saída. Na ambiência, o documento destaca como muito importante o componente afetivo, expresso no acolhimento e nas interações. A primeira e a quarta afirmações correspondem ao glossário.", "fundamento": "Glossário: a classificação de risco prioriza pelo agravo e/ou grau de sofrimento, não pela ordem de chegada. O acolhimento responsabiliza a equipe pelo usuário da chegada à saída. A ambiência inclui o componente afetivo. A clínica ampliada propõe compromisso com o sujeito e não só com a doença.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, Glossário (“Acolhimento”, “Ambiência”, “Classificação de Risco”, “Clínica ampliada”), p. 51-56", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "dir-01", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Portaria de Consolidação GM/MS nº 1/2017, que garante à pessoa atendimento humanizado e acolhedor.\n\nÉ garantida a identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o ________, independente do registro civil. É garantido também o direito a visita diária não inferior a ________ horas, preferencialmente ________ em todas as unidades de internação, ressalvadas as situações técnicas não indicadas.", "alternativas": ["nome de preferência – uma – restrita", "nome social – duas – aberta", "nome social – quatro – restrita", "apelido – duas – restrita", "número do prontuário – uma – aberta"], "correta": 1, "explicacao": "A norma prevê campo para o nome social em todo documento e visita diária não inferior a duas horas, preferencialmente aberta. A mesma norma proíbe identificar o usuário por número, nome ou código da doença.", "fundamento": "I - identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o nome social [...]; VII - o direito a visita diária não inferior a duas horas, preferencialmente aberta em todas as unidades de internação, ressalvadas as situações técnicas não indicadas;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 5º, parágrafo único, I e VII (origem: Portaria MS/GM nº 1.820/2009, art. 4º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-02", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "A Portaria de Consolidação GM/MS nº 1/2017 estabelece que toda pessoa tem responsabilidade para que seu tratamento e recuperação sejam adequados e sem interrupção, e lista o que as pessoas deverão fazer para isso. Assinale a alternativa que NÃO corresponde a um desses deveres.", "alternativas": ["Prestar informações apropriadas nos atendimentos, nas consultas e nas internações sobre queixas, enfermidades e hospitalizações anteriores, história de uso de medicamentos, drogas e reações alérgicas.", "Expressar se compreendeu as informações e orientações recebidas e, caso ainda tenha dúvidas, solicitar esclarecimento sobre elas.", "Ter em mão seus documentos e, quando solicitados, os resultados de exames que estejam em seu poder.", "Submeter-se a todos os procedimentos, exames e tratamentos recomendados, uma vez que a norma não admite a recusa do usuário.", "Comunicar à autoridade sanitária local a ocorrência de caso de doença transmissível, quando a situação requerer o isolamento ou quarentena da pessoa ou quando a doença constar da relação do Ministério da Saúde."], "correta": 3, "explicacao": "A norma não proíbe a recusa. O dever é assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados, e a mesma portaria garante o consentimento livre e revogável. As demais alternativas reproduzem os incisos I, II, VIII e XIII.", "fundamento": "V - assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados e pelo descumprimento das orientações do profissional ou da equipe de saúde;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 7º, parágrafo único, I, II, V, VIII e XIII (origem: Portaria MS/GM nº 1.820/2009, art. 6º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-03", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta dos Direitos dos Usuários da Saúde (Ministério da Saúde, 3ª edição, 2011).\n\nQuais estão corretas?", "itens": ["I – “Todo cidadão tem direito ao acesso ordenado e organizado aos sistemas de saúde” é um dos seis princípios basilares da Carta.", "II – A Carta foi aprovada pela Agência Nacional de Saúde Suplementar (ANS), em 2009, e por isso vale apenas para os planos de saúde.", "III – A Carta é apresentada como ferramenta para que o cidadão conheça seus direitos e deveres no momento de procurar atendimento de saúde, tanto público como privado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "Apenas I e III."], "correta": 4, "explicacao": "I e III estão na apresentação da Carta. II está errada: a Carta foi aprovada pelo Conselho Nacional de Saúde (CNS), na 198ª Reunião Ordinária, em 17 de junho de 2009, e vale tanto para o atendimento público quanto para o privado.", "fundamento": "A apresentação informa que a Carta foi aprovada pelo Conselho Nacional de Saúde em 17/06/2009. Ela se apoia em seis princípios basilares, o primeiro deles o acesso ordenado e organizado. Ela serve ao cidadão no atendimento público e no privado.", "fonte": "Carta dos Direitos dos Usuários da Saúde, MS/CNS, 3ª ed., 2011, Apresentação, p. 3-4", "url": "https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf"}, {"id": "dir-04", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Segundo a Portaria de Consolidação GM/MS nº 1/2017, toda pessoa deve ter seus valores, cultura e direitos respeitados na relação com os serviços de saúde. Assinale a alternativa correta a respeito das garantias previstas.", "alternativas": ["O sigilo e a confidencialidade das informações pessoais cessam com a morte do paciente.", "A segunda opinião sobre o estado de saúde só pode ser buscada antes do início do tratamento.", "O acesso ao conteúdo do prontuário é exclusivo da equipe assistencial, sendo vedado o fornecimento de cópia ao usuário.", "O consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais.", "O exame de saúde pré-admissional pode ser realizado sem conhecimento do trabalhador sempre que exigido pelo empregador."], "correta": 3, "explicacao": "A alternativa D reproduz o inciso V do art. 6º. O sigilo vale mesmo após a morte, salvo risco à saúde pública. A segunda opinião pode ser buscada em qualquer fase do tratamento. O usuário tem acesso ao prontuário e direito a cópia em caso de encaminhamento ou mudança de domicílio. Exame sem conhecimento e consentimento só é admitido em caso de risco coletivo.", "fundamento": "V - o consentimento livre, voluntário e esclarecido, a quaisquer procedimentos diagnósticos, preventivos ou terapêuticos, salvo nos casos que acarretem risco à saúde pública, considerando que o consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 6º, II, III, V, VI e IX (origem: Portaria MS/GM nº 1.820/2009, art. 5º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-05", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta de direitos e deveres do paciente do Hospital de Clínicas de Porto Alegre (HCPA).\n\nQuais estão corretas?", "itens": ["I – É dever do paciente ter em mãos um documento oficial com foto sempre que vier ao hospital.", "II – É direito do paciente definir se seus familiares e acompanhantes devem ser informados sobre seu estado de saúde, podendo autorizar um representante de sua livre escolha para ter acesso a essas informações ou decidir em seu nome, caso necessite.", "III – O adolescente deve ser atendido sempre na presença dos pais ou responsável, ainda que deseje ser atendido sem acompanhante.", "IV – É dever do paciente respeitar a proibição do fumo e do consumo de bebidas alcoólicas e/ou do uso de drogas ilícitas nas dependências do hospital e exigir que seus acompanhantes também a respeitem."], "alternativas": ["Apenas I e II.", "Apenas III e IV.", "Apenas I, II e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 2, "explicacao": "I, II e IV estão na Carta do HCPA. III está errada: o adolescente, se desejar, pode ser atendido sem acompanhante, com garantia de individualidade e confidencialidade. A participação e o consentimento dos pais ou responsável só são exigidos em situações de risco ou em procedimentos de alguma complexidade.", "fundamento": "A Carta do HCPA garante ao adolescente, se desejar, atendimento sem acompanhante, com individualidade e confidencialidade, salvo quando o sigilo possa acarretar dano. Em situações de risco ou procedimentos de alguma complexidade, exige participação e consentimento dos pais ou responsável.", "fonte": "Carta de direitos e deveres do paciente do HCPA, seções “São direitos do paciente” e “São deveres do paciente/família”", "url": "https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf"}, {"id": "eca-01", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "De acordo com o Estatuto da Criança e do Adolescente (Lei nº 8.069/1990), assinale a alternativa correta quanto à definição de criança e de adolescente.", "alternativas": ["Considera-se criança a pessoa até doze anos de idade completos, e adolescente aquela entre doze e dezoito anos de idade.", "Considera-se criança a pessoa até quatorze anos de idade incompletos, e adolescente aquela entre quatorze e dezoito anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e quatro anos de idade.", "Considera-se adolescente a pessoa entre doze e vinte e um anos de idade, aplicando-se o Estatuto integralmente a toda essa faixa etária."], "correta": 2, "explicacao": "Criança é a pessoa até doze anos incompletos; adolescente, entre doze e dezoito; e, excepcionalmente, o ECA se aplica dos dezoito aos vinte e um anos. As pegadinhas trocam “incompletos” por “completos”, 12 por 14 e 21 por 24.", "fundamento": "Art. 2º Considera-se criança, para os efeitos desta Lei, a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade. Parágrafo único. Nos casos expressos em lei, aplica-se excepcionalmente este Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "fonte": "Lei 8.069/1990, art. 2º, caput e parágrafo único", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-02", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Considere o art. 12 do ECA, na redação atual, que inclui o parágrafo único acrescentado pela Lei nº 14.950/2024: “Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo ______ de ______, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de ______ à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["integral – um dos pais ou responsável – visitação", "parcial – ambos os pais – visitação", "integral – ambos os pais ou responsáveis – acompanhamento", "integral – um dos pais ou responsável – acompanhamento", "diurno – um dos pais ou responsável – visitação"], "correta": 0, "explicacao": "O caput garante a permanência em tempo integral de um dos pais ou responsável na internação de criança ou adolescente; o parágrafo único, incluído pela Lei 14.950/2024, garante à criança e ao adolescente o direito de visitação ao pai ou à mãe internados. A pegadinha troca “um dos pais” por “ambos” e “visitação” por “acompanhamento”.", "fundamento": "Art. 12. Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo integral de um dos pais ou responsável, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras. (Incluído pela Lei nº 14.950, de 2024)", "fonte": "Lei 8.069/1990, art. 12, caput e parágrafo único (incluído pela Lei 14.950/2024)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-03", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Um funcionário da recepção de um hospital percebe sinais de que uma criança atendida pode estar sofrendo maus-tratos. Sobre o que dispõe o ECA a respeito dessas situações, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais.", "II – A comunicação ao Conselho Tutelar só é obrigatória quando os maus-trato
