correta": 0, "fonte": "Prova de 2023 (FAURGS), questão 15", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=6", "itens": ["(  ) O nexo porém (l. 19) expressa uma ideia de oposição.", "(  ) O nexo Assim (l. 23) expressa uma ideia de conclusão.", "(  ) O nexo Contudo (l. 33) expressa uma ideia de finalidade."], "instrucao": "As questões 09 a 15 referem-se ao texto abaixo.", "textoRef": "p2023:t2"}, {"id": "p2023-q16", "banca": "p2023", "num": 16, "materia": "Raciocínio Lógico", "tema": "Matemática", "enunciado": "Considere as afirmações a seguir.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 4, "fonte": "Prova de 2023 (FAURGS), questão 16", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=6", "figura": "provas/fig/p2023-q16.png"}, {"id": "p2023-q17", "banca": "p2023", "num": 17, "materia": "Raciocínio Lógico", "tema": "Matemática", "enunciado": "A tabela abaixo apresenta dados do Relatório Integrado de Gestão do Hospital de Clínicas de Porto Alegre (HCPA) de 2022 relativos à assistência geral nos anos de 2020, 2021 e 2022.\n\nEntre as alternativas, a melhor aproximação em porcentagem para o aumento do número de consultas presenciais de 2021 para 2022 é de", "alternativas": ["15%.", "20%.", "25%.", "30%.", "33%."], "correta": 2, "fonte": "Prova de 2023 (FAURGS), questão 17", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=7", "figura": "provas/fig/p2023-q17.png"}, {"id": "p2023-q18", "banca": "p2023", "num": 18, "materia": "Raciocínio Lógico", "tema": "Matemática", "enunciado": "A tabela abaixo apresenta dados relativos ao custo anual, em milhões de reais, do consumo de folhas de papel A4 em um hospital, de 2019 a 2021, sendo desconhecido o custo no ano de 2022.\n\nConsiderando que o custo no ano de 2022 representa 20% do custo dos quatro anos, o custo de 2022, em milhões de reais, foi de", "alternativas": ["200.", "210.", "230", "240.", "250."], "correta": 4, "fonte": "Prova de 2023 (FAURGS), questão 18", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=7", "figura": "provas/fig/p2023-q18.png"}, {"id": "p2023-q19", "banca": "p2023", "num": 19, "materia": "Raciocínio Lógico", "tema": "Matemática", "enunciado": "O preço de um equipamento de proteção individual sofreu acréscimos sucessivos e acumulados de 15% e 20%. Com os acréscimos acumulados, o preço do equipamento de proteção individual aumentou em", "alternativas": ["30%.", "35%.", "38%.", "40%.", "45%."], "correta": 2, "fonte": "Prova de 2023 (FAURGS), questão 19", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=7"}, {"id": "p2023-q20", "banca": "p2023", "num": 20, "materia": "Raciocínio Lógico", "tema": "Matemática", "enunciado": "Algumas impressoras a jato de tinta utilizam cartuchos contendo 24,5 mL de tinta. Considerando que 5 mL dessa tinta custa 50 reais, usando oito cartuchos de tinta de 24,5 mL, o gasto, em reais, será de", "alternativas": ["1.225.", "1.960.", "2.450.", "3.920.", "4.900."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 20", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=7"}, {"id": "p2023-q21", "banca": "p2023", "num": 21, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Nas afirmações a seguir, P e Q são números naturais maiores que zero, sendo P um número par qualquer e Q um número ímpar qualquer.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 21", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=7", "figura": "provas/fig/p2023-q21.png"}, {"id": "p2023-q22", "banca": "p2023", "num": 22, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A seguir são apresentados os oito primeiros números de uma sequência numérica que possui um padrão de construção.\n2, 3, 5, 8, 13, 21, 34, 55\n\nMantido esse padrão de construção, classificando o nono, o décimo e o décimo primeiro número da sequência como números pares ou ímpares, nessa ordem, é correto afirmar que eles são, respectivamente,", "alternativas": ["ímpar, par, ímpar.", "ímpar, ímpar, par.", "par, ímpar, ímpar.", "ímpar, par, par.", "par, par, ímpar."], "correta": 0, "fonte": "Prova de 2023 (FAURGS), questão 22", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=8"}, {"id": "p2023-q23", "banca": "p2023", "num": 23, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um concurso para selecionar candidatos, cinco pessoas realizaram um exame. A ordem de classificação dos candidatos, do primeiro ao quinto colocado, respectivamente, é dada pelas informações a seguir.\n\nA ordem correta de classificação dos candidatos é", "alternativas": ["Hermes, Zeus, Atenas, Odin, Vênus.", "Atenas, Zeus, Odin, Hermes, Vênus.", "Atenas, Zeus, Hermes, Odin, Vênus.", "Vênus, Hermes, Odin, Atenas, Zeus.", "Atenas, Zeus, Odin, Vênus, Hermes."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 23", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=8", "itens": ["I. Zeus não é o primeiro colocado.", "II. Hermes ficou classificado na frente de Vênus.", "III. Atenas ficou classificada na frente de Zeus.", "IV. Odin ficou classificado atrás de Zeus mas na frente de Hermes.", "V. Vênus e Hermes ficaram classificados atrás de Zeus."]}, {"id": "p2023-q24", "banca": "p2023", "num": 24, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A seguir são apresentadas três etapas de uma construção geométrica constituída por quadrados brancos e cinzas e que possui um padrão de formação.\n\nMantido esse padrão de formação, o número de quadrados cinzas da etapa 5 é", "alternativas": ["64.", "128.", "256.", "512.", "1.024."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 24", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=8", "figura": "provas/fig/p2023-q24.png"}, {"id": "p2023-q25", "banca": "p2023", "num": 25, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Na figura abaixo encontram-se representados cubos idênticos de aresta medindo 1 unidade, os quais fazem parte de um cubo maior, sem espaços vazios.\n\nEntre as alternativas abaixo, o número de cubos de aresta medindo 1 unidade que devem ser adicionados para formar esse cubo maior é", "alternativas": ["53.", "54.", "114.", "115.", "215."], "correta": 2, "fonte": "Prova de 2023 (FAURGS), questão 25", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=9", "figura": "provas/fig/p2023-q25.png"}, {"id": "p2023-q26", "banca": "p2023", "num": 26, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em uma caixa não transparente foram colocadas 7 bolas brancas, 5 bolas azuis e 3 bolas vermelhas. Sem escolher, são retiradas bolas dessa caixa. A partir desses dados, considere as afirmações a seguir.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 0, "fonte": "Prova de 2023 (FAURGS), questão 26", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=9", "itens": ["I - Retirando 4 bolas, necessariamente 2 serão da mesma cor.", "II - Retirando 7 bolas, necessariamente 2 serão de cores diferentes.", "III - Retirando 7 bolas, necessariamente 1 será branca."]}, {"id": "p2023-q27", "banca": "p2023", "num": 27, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "O Decreto nº 1.171, de 22 de junho de 1994, aprova", "alternativas": ["o Regulamento da Previdência Social, e dá outras providências.", "o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal.", "a organização e as atribuições do Conselho Nacional de Saúde, e dá outras providências.", "a segurança e saúde no trabalho em serviços de saúde.", "o tratamento de dados pessoais, inclusive nos meios digitais."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 27", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2023-q28", "banca": "p2023", "num": 28, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "O princípio do Sistema Único de Saúde (SUS) que determina que \"Todos os cidadãos brasileiros, sem qualquer tipo de discriminação, têm direito à saúde\" corresponde à", "alternativas": ["Descentralização.", "Universalidade.", "Centralização.", "Equidade.", "Integralidade."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 28", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2023-q29", "banca": "p2023", "num": 29, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A Lei nº 13.709, de 14 de agosto de 2018, denominada Lei Geral de Proteção de Dados Pessoais (LGPD), tem como fundamento", "alternativas": ["a permissão de eventual violação da intimidade e da imagem.", "o respeito à privacidade em casos excepcionais.", "a priorização do desenvolvimento econômico em detrimento do avanço tecnológico.", "a liberdade de expressão, de informação, de comunicação e de opinião.", "a limitação da livre-iniciativa e da livre concorrência."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 29", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=9"}, {"id": "p2023-q30", "banca": "p2023", "num": 30, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A Política Nacional de Humanização (PNH) se estrutura a partir dos seguintes componentes:", "alternativas": ["Princípios, Método, Tecnologia, Revisões.", "Diretrizes, Revisões, Dispositivos, Mobilidade.", "Método, Tecnologia, Diretrizes, Princípios.", "Princípios, Método, Diretrizes, Dispositivos.", "Dispositivos, Mobilidade, Revisões, Tecnologia."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 30", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2023-q31", "banca": "p2023", "num": 31, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A Norma Regulamentadora nº 32 – NR 32 estabelece diretrizes básicas de proteção e segurança para a saúde dos profissionais que atuam em serviços de saúde. Assinale a alternativa que descreve corretamente uma dessas diretrizes.", "alternativas": ["Os trabalhadores que não atuam em áreas onde existam fontes de radiações ionizantes podem deixar o local de trabalho utilizando suas vestimentas de trabalho.", "Em toda ocorrência de acidente envolvendo riscos biológicos, com ou sem afastamento do trabalhador, deve ser emitida a Comunicação de Acidente de Trabalho – CAT.", "Deve der vedado o consumo de alimentos e bebidas nos postos de trabalho, mas a guarda de alimentos nesses locais é permitida.", "Deve ser assegurada capacitação aos trabalhadores, antes do início das atividades e de forma continuada, devendo ser ministrada sempre fora da jornada de trabalho.", "A capacitação dos profissionais deverá ocorrer sempre após o início das atividades desde que haja o cuidado na conservação e a higienização dos materiais e instrumentos de trabalho."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 31", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2023-q32", "banca": "p2023", "num": 32, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "O SUS poderá recorrer aos serviços ofertados pela iniciativa privada, quando as suas disponibilidades forem insuficientes para garantir a cobertura assistencial à população de uma determinada área. As afirmativas abaixo referem-se às normas de direito público que devem ser observadas nesses casos.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 32", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10", "itens": ["I - A participação complementar dos serviços privados será formalizada mediante contrato ou convênio.", "II - As entidades filantrópicas e as sem fins lucrativos não terão preferência para participar do SUS.", "III - É vedado aos proprietários, administradores e dirigentes das entidades privadas contratadas, exercer cargo de chefia ou função de confiança no SUS."]}, {"id": "p2023-q33", "banca": "p2023", "num": 33, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Constitui objetivo geral do Programa Nacional de Segurança do Paciente (PNSP):", "alternativas": ["contribuir para a qualificação do cuidado em saúde em todos os estabelecimentos de saúde do território nacional.", "propor e validar processos de identificação de pacientes.", "instituir protocolos de uso seguro de equipamentos, materiais e medicamentos.", "propor protocolos, guias e manuais para prevenção de quedas e úlceras por pressão de pacientes.", "recomendar estudos e pesquisas relacionadas à segurança do paciente."], "correta": 0, "fonte": "Prova de 2023 (FAURGS), questão 33", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2023-q34", "banca": "p2023", "num": 34, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Com a implementação da Política Nacional de Humanização (PNH), busca-se trabalhar para alcançar resultados englobando direções. A esse respeito, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 2, "fonte": "Prova de 2023 (FAURGS), questão 34", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10", "itens": ["I - Todo usuário do SUS saberá quem são os profissionais que cuidam de sua saúde e a rede de serviços que se responsabiliza por sua referência territorial e atenção integral.", "II - A ampliação do acesso, a redução das filas e do tempo de espera, e o atendimento resolutivo baseado em critérios de risco, fundamentam essa política.", "III - O investimento na educação permanente dos trabalhadores cede total espaço para a adequação de ambientes de trabalho saudáveis."]}, {"id": "p2023-q35", "banca": "p2023", "num": 35, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Considerando a necessidade de se desenvolverem estratégias e ações direcionadas aos gestores, profissionais e usuários de saúde, as quais reduzam as ocorrências de eventos adversos na atenção à saúde, instituiu-se", "alternativas": ["o Programa de Saúde da Família.", "a Diretoria-Geral de Saúde Pública.", "o Programa de Vigilância Sanitária e Epidemiológica.", "o Programa Nacional de Segurança do Paciente.", "o Programa de Saúde nas Escolas."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 35", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=10"}, {"id": "p2023-q36", "banca": "p2023", "num": 36, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Em relação ao acolhimento com avaliação e classificação de risco como dispositivo de mudança no trabalho da atenção e produção de saúde, assinale V (verdadeiro ou F (falso) nas afirmações abaixo.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V – F – V.", "F – V – F – V – F.", "V – F – V – V – F.", "F – F – V – F – V.", "V – V – F – F – V."], "correta": 0, "fonte": "Prova de 2023 (FAURGS), questão 36", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=11", "itens": ["(  ) Pressupõe a agilidade no atendimento sob a óptica de protocolo preestabelecido, do grau de necessidade do usuário, proporcionando atenção centrada no nível de complexidade e não na ordem de chegada.", "(  ) Acolhimento e Avaliação/Classificação de Risco têm objetivos semelhantes mas não são complementares, podem funcionar em ambientes distintos ou coexistirem no contexto físico, mas serem díspares no processo de trabalho.", "(  ) O conceito de Acolhimento se concretiza no cotidiano das práticas de saúde por meio de escuta qualificada e da capacidade de pactuação entre a demanda do usuário e a possibilidade de resposta do serviço.", "(  ) A avaliação de risco e vulnerabilidade do paciente deve ser considerada prerrogativa exclusiva dos profissionais de saúde; o usuário e sua rede social devem apenas aguardar os resultados e intervenções geradas neste processo.", "(  ) Avaliar riscos e vulnerabilidade implica estar atento tanto ao grau de sofrimento físico quanto ao psíquico, pois o usuário pode chegar andando, sem sinais visíveis de problemas físicos, mas muito angustiado, necessitando de atendimento com maior grau de risco e vulnerabilidade."]}, {"id": "p2023-q37", "banca": "p2023", "num": 37, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Constitui o primeiro princípio da Carta dos Direitos dos Usuários da Saúde, assegurar ao cidadão", "alternativas": ["o tratamento adequado e efetivo para seu problema de saúde, visando à melhoria da qualidade dos serviços prestados.", "o atendimento acolhedor e livre de discriminação, visando à igualdade de tratamento e uma relação mais pessoal e saudável.", "o atendimento que respeite os valores e direitos do paciente, visando preservar sua cidadania durante o tratamento.", "o acesso ordenado e organizado aos sistemas de saúde, visando a um atendimento mais justo e eficaz.", "o comprometimento dos gestores para que todos os princípios sejam cumpridos."], "correta": 3, "fonte": "Prova de 2023 (FAURGS), questão 37", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=11"}, {"id": "p2023-q38", "banca": "p2023", "num": 38, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A NR 32 – Segurança e Saúde no Trabalho em Serviços de Saúde estabelece o Programa de Gerenciamento de Riscos (PGR), que faz avaliação do local de trabalho e do trabalhador. A esse respeito, considere os itens abaixo.\n\nQuais são critérios para essa avaliação?", "alternativas": ["Apenas I e II.", "Apenas I e III.", "Apenas II e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 4, "fonte": "Prova de 2023 (FAURGS), questão 38", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=11", "itens": ["I - Finalidade e descrição do local de trabalho.", "II - Descrição das atividades e funções de cada local de trabalho.", "III - Possibilidade de exposição.", "IV - Medidas preventivas aplicáveis e seu acompanhamento."]}, {"id": "p2023-q39", "banca": "p2023", "num": 39, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "Nos termos da Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709), o tratamento de dados pessoais de crianças e de adolescentes deverá ocorrer", "alternativas": ["independentemente do consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal.", "com o consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal.", "por meio do consentimento específico e em destaque dado obrigatoriamente por ambos os pais.", "pelo bloqueio ou eliminação de dados desnecessários ou considerados excessivos por parte de um dos pais ou responsável legal.", "com o repasse a terceiro e sem o consentimento dos responsáveis apenas em casos especiais ou de pesquisas científicas."], "correta": 1, "fonte": "Prova de 2023 (FAURGS), questão 39", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=11"}, {"id": "p2023-q40", "banca": "p2023", "num": 40, "materia": "Conhecimentos Específicos", "tema": "Conhecimentos Específicos", "enunciado": "A direção do SUS é única, sendo exercida em cada esfera de governo por órgãos específicos. Assinale a alternativa que apresenta órgão de direção no âmbito dos Municípios.", "alternativas": ["Ministério da Saúde.", "Ministério do Trabalho e da Previdência.", "Secretaria de Saúde ou órgão equivalente.", "Secretaria Municipal de Assistência e Desenvolvimento Social.", "Procuradoria-Geral do Município."], "correta": 2, "fonte": "Prova de 2023 (FAURGS), questão 40", "url": "provas/2023-ps07-assistente-administrativo-ii.pdf#page=11"}, {"id": "p2024-03-ps29-q15", "banca": "p2024-03-ps29", "num": 15, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Em relação à Lei Federal nº 8.080/1990, as ações e os serviços públicos de saúde e os serviços privados contratados ou conveniados que integram o SUS são desenvolvidos de acordo com as diretrizes previstas no artigo 198 da Constituição Federal. À luz de tais diretrizes, considere os princípios abaixo, classificando-os como V (verdadeiros) ou F (falsos).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V – V – F.", "V – F – V – F – V.", "V – V – F – V – F.", "F – F – V – V – F.", "F – F – F – V – V."], "correta": 2, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 15", "url": "provas/p2024-03-ps29.pdf#page=6", "itens": ["( ) Universalidade de acesso aos serviços de saúde em todos os níveis de assistência.", "( ) Integralidade de assistência, entendida como conjunto articulado e contínuo de ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso, em todos os níveis de complexidade do sistema.", "( ) Não participação da comunidade.", "( ) Igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "( ) Supressão de informações quanto ao potencial dos serviços de saúde e a sua utilização pelo usuário."]}, {"id": "p2024-03-ps29-q19", "banca": "p2024-03-ps29", "num": 19, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "As alternativas abaixo contêm deveres do servidor público com base no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, EXCETO uma. Assinale-a.", "alternativas": ["Desempenhar, a tempo, as atribuições do cargo, da função ou do emprego público de que seja titular.", "Ser probo, reto, leal e justo, demonstrando toda a integridade do seu caráter, escolhendo sempre, quando estiver diante de duas opções, a melhor e a mais vantajosa para o bem comum.", "Retardar qualquer prestação de contas, condição essencial da gestão dos bens, direitos e serviços da coletividade a seu cargo.", "Tratar cuidadosamente os usuários dos serviços, aperfeiçoando o processo de comunicação e o contato com o público.", "Exercer suas atribuições com rapidez, perfeição e rendimento, pondo fim a ou procurando prioritariamente resolver situações procrastinatórias, principalmente diante de filas ou de qualquer outra espécie de atraso na prestação dos serviços pelo setor em que exerça suas atribuições, com o fim de evitar dano moral ao usuário."], "correta": 2, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 19", "url": "provas/p2024-03-ps29.pdf#page=7"}, {"id": "p2024-03-ps29-q25", "banca": "p2024-03-ps29", "num": 25, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "De acordo com a Cartilha sobre Segurança do Paciente, elaborada pelo Hospital Alemão Oswaldo Cruz (2019), dentre as metas de segurança do paciente, inclui-se a cirurgia segura. O checklist da cirurgia segura trata-se de uma lista de verificação que deve ser aplicada em três momentos: antes da indução anestésica, imediatamente antes da cirurgia (time out) e após o procedimento cirúrgico. Numere a segunda coluna de acordo com a primeira, associando o momento e a verificação de segurança cirúrgica.\n\n(1) Antes da indução anestésica\n(2) Antes da incisão cirúrgica\n(3) Antes de o paciente sair da sala de operações\n\nA sequência numérica correta do preenchimento dos parênteses da segunda coluna, de cima para baixo, é", "alternativas": ["2 – 2 – 1 – 2 – 2.", "2 – 3 – 1 – 3 – 2.", "1 – 3 – 1 – 2 – 3.", "1 – 3 – 2 – 1 – 2.", "1 – 2 – 2 – 3 – 2."], "correta": 1, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 25", "url": "provas/p2024-03-ps29.pdf#page=9", "itens": ["( ) Cirurgião, anestesiologista e a equipe de enfermagem confirmam verbalmente a identificação do paciente, o sítio cirúrgico e o procedimento.", "( ) Profissional da equipe de enfermagem ou da equipe médica confirma verbalmente com a equipe o registro completo do procedimento intraoperatório, incluindo procedimento executado.", "( ) Revisão se há oxímetro de pulso no paciente e se está em funcionamento.", "( ) Profissional da equipe de enfermagem ou da equipe médica confirma verbalmente com a equipe se as contagens de instrumentais cirúrgicos, compressas e agulhas estão corretas (ou não se aplicam).", "( ) Revisão da equipe de enfermagem se os materiais necessários (exemplo: instrumentais, próteses) estão presentes e dentro do prazo de esterilização."]}, {"id": "p2024-03-ps29-q29", "banca": "p2024-03-ps29", "num": 29, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "A Segurança do Paciente visa à redução ao mínimo aceitável de danos desnecessários ao paciente, conforme a Cartilha elaborada pelo Hospital Alemão Oswaldo Cruz. Considere as seguintes afirmações sobre a meta de segurança na prescrição, uso e administração de medicamentos.\n\nQuais estão corretas?", "alternativas": ["Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 0, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 29", "url": "provas/p2024-03-ps29.pdf#page=10", "itens": ["I - Dentre as medidas de prevenção para a ocorrência de erros na dispensação, têm-se: fazer dupla checagem no processo da separação; adotar um sistema seguro de distribuição de medicamentos, como o sistema coletivo; garantir a identificação do paciente no medicamento dispensado.", "II - Para a prevenção da ocorrência de erros na prescrição, as instituições devem adotar uma série de medidas, como não utilizar ou evitar o uso de abreviaturas/símbolos e garantir a clareza da descrição do princípio ativo e da dosagem, além de utilizar prescrições verbais exclusivamente em casos de emergência e definir um procedimento seguro de realização e registro.", "III - Para garantir a segurança do paciente e a continuidade do cuidado na terapia medicamentosa, na alta do paciente, deverão ser relacionados quais medicamentos ele faz uso, para que possa ser avaliada a necessidade de sua continuação ou de sua suspensão."]}, {"id": "p2024-03-ps29-q32", "banca": "p2024-03-ps29", "num": 32, "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Segundo Melo e colaboradores, em “A gestão de materiais médico-hospitalares em hospital público”, para uma eficiente gestão de materiais médico-hospitalares, faz-se necessária qualificação e capacitação profissional dos funcionários envolvidos no processo de compras, organização das atividades nas unidades gestoras, bem como nas especificações técnicas para compra. O processo de compras compreende um conjunto de várias ações e procedimentos preestabelecidos, analisados perante as necessidades da organização. O ciclo de compras, mais detalhadamente, consiste em alguns passos. Assinale a alternativa com a ordem correta dos mesmos.", "alternativas": ["Seleção de fornecedores – Recebimento e análise de requisições de compras – Solicitações de cotações e determinação de preço certo – Emissão de pedidos de compra – Recepção e aceitação das mercadorias – Aprovação da fatura do fornecedor para pagamento.", "Seleção de fornecedores – Solicitações de cotações e determinação de preço certo – Recebimento e análise de requisições de compras – Emissão de pedidos de compra – Recepção e aceitação das mercadorias – Aprovação da fatura do fornecedor para pagamento.", "Seleção de fornecedores – Recebimento e análise de requisições de compras – Solicitações de cotações e determinação de preço certo – Emissão de pedidos de compra – Aprovação da fatura do fornecedor para pagamento – Recepção e aceitação das mercadorias.", "Recebimento e análise de requisições de compras – Solicitações de cotações e determinação de preço certo – Seleção de fornecedores – Emissão de pedidos de compra – Aprovação da fatura do fornecedor para pagamento – Recepção e aceitação das mercadorias.", "Recebimento e análise de requisições de compras – Seleção de fornecedores – Solicitações de cotações e determinação de preço certo – Emissão de pedidos de compra – Recepção e aceitação das mercadorias – Aprovação da fatura do fornecedor para pagamento."], "correta": 4, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 32", "url": "provas/p2024-03-ps29.pdf#page=12"}, {"id": "p2024-03-ps29-q38", "banca": "p2024-03-ps29", "num": 38, "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Considerando o documento “Assistência farmacêutica na atenção básica: instruções técnicas para sua organização”, o controle de estoque é uma das atividades relacionadas ao Ciclo de Assistência Farmacêutica que visa subsidiar a programação, a aquisição de medicamentos e a manutenção dos níveis de estoques necessários ao atendimento da demanda. Uma das ferramentas utilizadas para gestão de estoque é a realização de inventários periódicos. Em relação aos inventários, é correto afirmar que", "alternativas": ["consistem na contagem física dos estoques para verificar se a quantidade de medicamentos estocada está em conformidade com a quantidade registrada nas fichas de controle ou no sistema informatizado.", "são o conjunto de procedimentos técnicos e administrativos que tem por finalidade assegurar as condições adequadas de conservação dos produtos.", "são a ordenação adequada dos produtos em áreas apropriadas, de acordo com suas características específicas e condições de conservação exigidas (termolábeis, psicofármacos, inflamáveis, material médico-hospitalar etc).", "consistem no suprimento de medicamentos às unidades de saúde, em quantidade, qualidade e tempo oportuno.", "são a relação entre consumo e estoque médio, em determinado período de tempo."], "correta": 0, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 38", "url": "provas/p2024-03-ps29.pdf#page=14"}, {"id": "p2024-03-ps29-q39", "banca": "p2024-03-ps29", "num": 39, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "A Lei nº 8.080/1990 dispõe sobre as condições para a promoção, proteção e recuperação da saúde, para a organização e o funcionamento dos serviços. Avalie as afirmações abaixo e assinale-as com V (verdadeiro) ou F (falso).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["F – F – V – F.", "V – F – V – V.", "F – V – F – V.", "F – F – V – V.", "V – F – F – V."], "correta": 0, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 39", "url": "provas/p2024-03-ps29.pdf#page=14", "itens": ["( ) A saúde é um direito fundamental do ser humano, devendo a iniciativa privada prover as condições indispensáveis ao seu pleno exercício.", "( ) A iniciativa privada não poderá participar do Sistema Único de Saúde (SUS) em caráter complementar.", "( ) A execução de ações de vigilância sanitária e epidemiológica estão no campo de atuação do SUS.", "( ) A vigilância nutricional e a orientação alimentar não fazem parte do campo de atuação do SUS."]}, {"id": "p2024-03-ps29-q40", "banca": "p2024-03-ps29", "num": 40, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "A Norma Regulamentadora (NR) nº 32 dispõe sobre Segurança e Saúde no Trabalho em Serviços de Saúde. Qual é a afirmativa correta no que tange às medidas de proteção ao trabalhador?", "alternativas": ["Em caso de exposição acidental ou incidental, medidas de proteção devem ser adotadas posteriormente, após a análise do evento.", "Não é obrigatório ter lavatório no interior dos quartos ou enfermarias destinados ao isolamento de pacientes portadores de doenças infecto-contagiosas, desde que seja disponibilizado álcool gel para higienização de mãos.", "O uso de luvas substitui o processo de lavagem das mãos, o que deve ocorrer, no mínimo, antes e depois do uso das mesmas.", "Os trabalhadores com feridas ou lesões nos membros superiores podem iniciar suas atividades laborais até que ocorra a avaliação médica obrigatória com emissão de documento de liberação para as atividades.", "Todo local onde exista possibilidade de exposição a agente biológico deve ter lavatório exclusivo para higiene das mãos, provido de água corrente, sabonete líquido, toalha descartável, e ter lixeira provida de sistema de abertura sem contato manual."], "correta": 4, "fonte": "Prova de 2024 · Profissional Assistencial III (Suprimentos/Farmácia) (FAURGS), questão 40", "url": "provas/p2024-03-ps29.pdf#page=14"}, {"id": "p2025-06-ps63-q01", "banca": "p2025-06-ps63", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche, correta e respectivamente, as lacunas das linhas 01, 09, 19 e 28.", "alternativas": ["a – tem – tem – integrem", "a – têm – tem – integre", "à – têm – têm – integrem", "à – tem – têm – integrem", "a – têm – têm – integre"], "correta": 4, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 1", "url": "provas/p2025-06-ps63.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2025-06-ps63:t1"}, {"id": "p2025-06-ps63-q02", "banca": "p2025-06-ps63", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Abaixo são feitas algumas afirmações acerca de ideias veiculadas pelo texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 2, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 2", "url": "provas/p2025-06-ps63.pdf#page=3", "itens": ["I - Segundo o texto, os desafios da gestão de saúde são de tal maneira complexos que sua resolução depende somente de fatores externos à área.", "II - Segundo o texto, há soluções capazes de melhorar a gestão de saúde, o que independe das equipes.", "III - Segundo o texto, a gestão das empresas do setor da saúde tem espelhado as transformações sociais, tecnológicas e regulatórias."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2025-06-ps63:t1"}, {"id": "p2025-06-ps63-q03", "banca": "p2025-06-ps63", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes expressões do texto.\n\nQuais desempenham, no contexto em que ocorrem, a mesma função sintática?", "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 3", "url": "provas/p2025-06-ps63.pdf#page=3", "itens": ["I - Ao longo das últimas décadas (l. 01) e Nos últimos tempos (l. 08).", "II - se (l. 09) e se (l. 11).", "III - as empresas de saúde (l. 27) e o trabalho em equipe (l. 35)."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2025-06-ps63:t1"}, {"id": "p2025-06-ps63-q04", "banca": "p2025-06-ps63", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "A substituição de empresas (l. 05) por setor acarretaria a modificação, para fins de concordância, de quantas outras palavras do segmento que vai da linha 03 à linha 07?", "alternativas": ["Duas.", "Três.", "Quatro.", "Cinco.", "Seis."], "correta": 1, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 4", "url": "provas/p2025-06-ps63.pdf#page=3", "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2025-06-ps63:t1"}, {"id": "p2025-06-ps63-q05", "banca": "p2025-06-ps63", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre o uso de palavras no texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 4, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 5", "url": "provas/p2025-06-ps63.pdf#page=4", "itens": ["I - esses (l. 10) é um pronome e tem sentido demonstrativo no contexto em que ocorre.", "II - tais (l. 22) é um pronome e tem sentido demonstrativo no contexto em que ocorre.", "III - clínica (l. 38) é um adjetivo no contexto em que ocorre."], "instrucao": "As questões 01 a 05 referem-se ao texto abaixo.", "textoRef": "p2025-06-ps63:t1"}, {"id": "p2025-06-ps63-q06", "banca": "p2025-06-ps63", "num": 6, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as afirmações a seguir sobre operações com números naturais maiores que zero.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 0, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 6", "url": "provas/p2025-06-ps63.pdf#page=4", "itens": ["I - Se o produto de dez números naturais é ímpar, então, necessariamente, esses dez números são ímpares.", "II - Se a soma de dez números naturais é par, então, necessariamente, esses dez números são pares.", "III - Se a soma de dez números naturais é ímpar, então, necessariamente, nove desses números são ímpares."]}, {"id": "p2025-06-ps63-q07", "banca": "p2025-06-ps63", "num": 7, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma caixa contém 1.000 moedas. Essas moedas serão retiradas sem reposição, por diferentes pessoas, de acordo com a seguinte regra: a primeira pessoa retira uma moeda; a segunda pessoa retira o dobro de moedas da primeira pessoa; a terceira pessoa retira o dobro de moedas da segunda pessoa, e cada pessoa seguinte retira, necessariamente, o dobro de moedas da pessoa anterior, até o momento em que a regra não pode ser cumprida. De acordo com essa regra, quantas pessoas diferentes retiraram moedas da caixa?", "alternativas": ["8.", "9.", "10.", "11.", "12."], "correta": 1, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 7", "url": "provas/p2025-06-ps63.pdf#page=4"}, {"id": "p2025-06-ps63-q08", "banca": "p2025-06-ps63", "num": 8, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A configuração de números da tabela abaixo possui um padrão de construção.\n\nUtilizando esse padrão de construção, o produto do número localizado na linha 8 e na coluna 6 pelo número localizado na linha 9 e na coluna 5 é", "alternativas": ["441.", "735.", "1.225.", "1.470.", "2.450."], "correta": 3, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 8", "url": "provas/p2025-06-ps63.pdf#page=4", "figura": "provas/fig/p2025-06-ps63-q8.png"}, {"id": "p2025-06-ps63-q09", "banca": "p2025-06-ps63", "num": 9, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em uma caixa não transparente foram colocadas 30 bolas coloridas, sendo 4 bolas azuis, 5 bolas vermelhas, 6 bolas verdes, 7 bolas amarelas e 8 bolas brancas. Sem escolher, foram retiradas bolas dessa caixa. Com esses dados, considere as afirmações abaixo.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 3, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 9", "url": "provas/p2025-06-ps63.pdf#page=5", "itens": ["I - O número mínimo de bolas que devem ser retiradas da caixa de maneira a garantir que se obtenha uma bola da cor branca é 22.", "II - O número mínimo de bolas que devem ser retiradas da caixa de maneira a garantir que se obtenham duas bolas da mesma cor é 6.", "III - Retirando 9 bolas, necessariamente duas serão de cores diferentes."]}, {"id": "p2025-06-ps63-q10", "banca": "p2025-06-ps63", "num": 10, "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Ariano, Bilac, Carlos e Dalton vivem em diferentes cidades, não necessariamente nesta ordem: Canoas, Viamão, Gravataí e Alvorada e praticam os seguintes esportes, também não necessariamente nesta ordem: esgrima, futebol, judô e vôlei. Considere as afirmações a seguir.\n\nConsiderando como verdadeiras as afirmações acima, a cidade em que vive Bilac e o esporte praticado por Ariano, são, respectivamente,", "alternativas": ["Alvorada e vôlei.", "Viamão e futebol.", "Alvorada e futebol.", "Gravataí e esgrima.", "Canoas e vôlei."], "correta": 4, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 10", "url": "provas/p2025-06-ps63.pdf#page=5", "itens": ["I - Ariano vive em Alvorada.", "II - O futebolista vive em Canoas.", "III - Carlos não vive em Canoas e nem em Viamão.", "IV - O esgrimista vive em Gravataí.", "V - Dalton pratica judô."]}, {"id": "p2025-06-ps63-q15", "banca": "p2025-06-ps63", "num": 15, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Considerando o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, acerca de suas regras deontológicas e dos principais deveres do servidor público, qual a afirmativa INCORRETA?", "alternativas": ["O trabalho desenvolvido pelo servidor público perante a comunidade deve ser entendido como acréscimo ao seu próprio bem-estar, já que, como cidadão, integrante da sociedade, o êxito desse trabalho pode ser considerado como seu maior patrimônio.", "Toda pessoa tem direito à verdade. Entretanto, o servidor deve omiti-la ou falseá-la nas situações de grave risco social, caso necessário para a preservação da integridade do próprio servidor e da sociedade como um todo.", "A cortesia, a boa vontade, o cuidado e o tempo dedicados ao serviço público caracterizam o esforço pela disciplina. Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral.", "É um dever do servidor público jamais retardar qualquer prestação de contas, condição essencial da gestão dos bens, direitos e serviços da coletividade a seu cargo.", "É um dever do servidor público exercer com estrita moderação as prerrogativas funcionais que lhe sejam atribuídas, abstendo-se de fazê-lo contrariamente aos legítimos interesses dos usuários do serviço público e dos jurisdicionados administrativos."], "correta": 1, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 15", "url": "provas/p2025-06-ps63.pdf#page=6"}, {"id": "p2025-06-ps63-q16", "banca": "p2025-06-ps63", "num": 16, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, a respeito do que é vedado ao servidor público, qual afirmativa NÃO apresenta uma vedação?", "alternativas": ["Usar cargo ou função, facilidades, amizades, tempo, posição e influências para obter qualquer favorecimento, para si ou para outrem.", "Retirar da repartição pública, sem estar legalmente autorizado, qualquer documento, livro ou bem pertencente ao patrimônio público.", "Alterar ou deturpar o teor de documentos que deva encaminhar para providências.", "Deixar de utilizar os avanços técnicos e científicos ao seu alcance ou do seu conhecimento para atendimento do seu mister.", "Resistir a todas as pressões de superiores hierárquicos, de contratantes, interessados e outros que visem a obter quaisquer favores, benesses ou vantagens indevidas em decorrência de ações imorais, ilegais ou aéticas, e denunciá-las."], "correta": 4, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 16", "url": "provas/p2025-06-ps63.pdf#page=6"}, {"id": "p2025-06-ps63-q21", "banca": "p2025-06-ps63", "num": 21, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Como consta do documento Gestão de Riscos e Investigação de Eventos Adversos Relacionados à Assistência à Saúde da Agência Nacional de Vigilância Sanitária (2025), considere o trecho a seguir.\n\n“Eis três dos oito princípios da gestão de riscos: ___________– as entradas para a gestão de riscos são baseadas em informações históricas e atuais, bem como em expectativas futuras –; ___________– comportamento humano e cultura influenciam significativamente todos os aspectos da gestão de risco em cada nível e estágio –; e ___________– riscos podem emergir, mudar ou desaparecer à medida que os contextos externo e interno de uma organização mudem.”\n\nAssinale a alternativa que completa, correta e respectivamente, as lacunas do trecho acima:", "alternativas": ["dinâmica – fatores humanos e culturais – melhor informação disponível", "fatores humanos e culturais – dinâmica – melhoria contínua", "fatores humanos e culturais – melhor informação disponível – dinâmica", "melhor informação disponível – fatores humanos e culturais – dinâmica", "melhor informação disponível – melhoria contínua – fatores humanos e culturais"], "correta": 3, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 21", "url": "provas/p2025-06-ps63.pdf#page=8"}, {"id": "p2025-06-ps63-q25", "banca": "p2025-06-ps63", "num": 25, "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Considere o trecho a seguir, sobre ferramentas lean.\n\n“Esta é uma ferramenta cujo nome pode ser traduzido como ‘aviso’, ‘cartão’ ou ‘sinal’, e possibilita quantificar um ponto adequado para a compra de suprimentos e leva em conta vários fatores, tais como: utilização ou demanda média de um item; frequência para fazer uma nova encomenda; lead time do fornecedor para reposição de itens; estoque de segurança, considerando a variação do uso e do tempo de reabastecimento e os custos da quebra de estoque.”\n\nA ferramenta a que o trecho acima se refere é", "alternativas": ["Kanban.", "Relatório A3.", "5S.", "SMED.", "Poka-Yoke."], "correta": 0, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 25", "url": "provas/p2025-06-ps63.pdf#page=9"}, {"id": "p2025-06-ps63-q26", "banca": "p2025-06-ps63", "num": 26, "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "No que tange ao tratamento de dados pessoais sensíveis segundo a Lei Geral de Proteção de Dados Pessoais (LGPD), considere as seguintes afirmações.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas II e III."], "correta": 4, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 26", "url": "provas/p2025-06-ps63.pdf#page=9", "itens": ["I - É permitido a operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de seleção de riscos na contratação de qualquer modalidade, e/ou na contratação e exclusão de beneficiários.", "II - Em estudos de saúde pública, os órgãos de pesquisa poderão ter acesso a bases de dados pessoais, que serão tratados exclusivamente dentro do órgão e estritamente para a finalidade de realização de estudos e pesquisas, mantidos em ambiente controlado e seguro, conforme práticas de segurança previstas em regulamento específico, incluindo, sempre que possível, a anonimização ou pseudonimização dos dados, e observando os padrões éticos aplicáveis.", "III - Os dados anonimizados não serão considerados dados pessoais para os fins dessa Lei, salvo quando o processo de anonimização ao qual foram submetidos for revertido, utilizando exclusivamente meios próprios, ou quando, com esforços razoáveis, puder ser revertido. A razoabilidade deve considerar fatores objetivos, tais como custo e tempo necessários à reversão, de acordo com as tecnologias disponíveis, e a utilização exclusiva de meios próprios."]}, {"id": "p2025-06-ps63-q34", "banca": "p2025-06-ps63", "num": 34, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "A Resolução RDC nº 36 (Ministério da Saúde/Agência Nacional de Vigilância Sanitária, 2013) traz, em seu art. 3º, definições relacionadas à segurança do paciente em serviços de saúde. Numere a segunda coluna de acordo com a primeira, relacionando cada termo à sua definição.\n\nA sequência numérica correta de preenchimento dos parênteses da segunda coluna, de cima para baixo, é", "alternativas": ["1 – 2 – 5 – 3 – 4.", "1 – 3 – 4 – 5 – 2.", "2 – 3 – 5 – 4 – 1.", "2 – 5 – 4 – 1 – 3.", "3 – 5 – 1 – 2 – 4."], "correta": 3, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 34", "url": "provas/p2025-06-ps63.pdf#page=11", "itens": ["(1) Cultura da segurança", "(2) Garantia da qualidade", "(3) Gestão de risco", "(4) Núcleo de segurança do paciente", "(5) Plano de segurança do paciente", "( ) Totalidade das ações sistemáticas necessárias para garantir que os serviços prestados estejam dentro dos padrões de qualidade exigidos para os fins a que se propõem.", "( ) Documento que aponta situações de risco e descreve as estratégias e ações definidas pelo serviço de saúde para a gestão de risco visando à prevenção e à mitigação dos incidentes, desde a admissão até a transferência, a alta ou o óbito do paciente no serviço de saúde.", "( ) Instância do serviço de saúde criada para promover e apoiar a implementação de ações voltadas à segurança do paciente.", "( ) Conjunto de valores, atitudes, competências e comportamentos que determinam o comprometimento com a gestão da saúde e da segurança, substituindo a culpa e a punição pela oportunidade de aprender com as falhas e melhorar a atenção à saúde.", "( ) Aplicação sistêmica e contínua de políticas, procedimentos, condutas e recursos na identificação, análise, avaliação, comunicação e controle de riscos e eventos adversos que afetam a segurança, a saúde humana, a integridade profissional, o meio ambiente e a imagem institucional."]}, {"id": "p2025-06-ps63-q35", "banca": "p2025-06-ps63", "num": 35, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Sobre a Norma Reguladora nº 32 (BRASIL, Ministério do Trabalho e Emprego, 2022), que trata de segurança e saúde no trabalho em serviços de saúde, no que tange aos recursos biológicos e químicos, assinale a afirmativa INCORRETA.", "alternativas": ["A preparação e a associação de todos os medicamentos para administração imediata aos pacientes devem ocorrer somente em local apropriado para a manipulação ou fracionamento de produtos químicos que impliquem riscos à segurança e à saúde do trabalhador.", "Deve ser mantida a rotulagem do fabricante na embalagem original dos produtos químicos utilizados em serviços de saúde.", "A todo trabalhador dos serviços de saúde deve ser fornecido, gratuitamente, programa de imunização ativa contra tétano, difteria, hepatite B e os estabelecidos no PCMSO.", "O empregador deve providenciar locais apropriados para fornecimento de vestimentas limpas e para deposição das usadas.", "Para efeito dessa NR, consideram-se medicamentos e drogas de risco aqueles que possam causar genotoxicidade, carcinogenicidade, teratogenicidade e toxicidade séria e seletiva sobre órgãos e sistemas."], "correta": 0, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 35", "url": "provas/p2025-06-ps63.pdf#page=12"}, {"id": "p2025-06-ps63-q36", "banca": "p2025-06-ps63", "num": 36, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O Decreto nº 7.508/2011, que regulamenta a Lei nº 8.080/1990 para dispor sobre a organização do Sistema Único de Saúde (SUS), o planejamento da saúde, a assistência à saúde e a articulação interfederativa, traz, em seu art. 2º, esta definição:\n\n“Espaço geográfico contínuo constituído por agrupamentos de Municípios limítrofes, delimitado a partir de identidades culturais, econômicas e sociais e de redes de comunicação e infraestrutura de transportes compartilhados, com a finalidade de integrar a organização, o planejamento e a execução de ações e serviços de saúde.”\n\nEssa é a definição de", "alternativas": ["porta de entrada.", "região de saúde.", "comissão intergestores.", "mapa da saúde.", "rede de atenção à saúde."], "correta": 1, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 36", "url": "provas/p2025-06-ps63.pdf#page=12"}, {"id": "p2025-06-ps63-q37", "banca": "p2025-06-ps63", "num": 37, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Selecione a alternativa que NÃO apresenta um princípio do Sistema Único de Saúde (SUS).", "alternativas": ["Integralidade de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema.", "Utilização da epidemiologia para o estabelecimento de prioridades, a alocação de recursos e a orientação programática.", "Centralização total, no âmbito da União, do planejamento, execução e controle da rede privada de saúde em nível nacional.", "Integração em nível executivo das ações de saúde, meio ambiente e saneamento básico.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral."], "correta": 2, "fonte": "Prova de 2025 · Analista I (Gestão dos Negócios Assistenciais) (FAURGS), questão 37", "url": "provas/p2025-06-ps63.pdf#page=12"}, {"id": "p2026-01-ps15-q01", "banca": "p2026-01-ps15", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 03, 09 e 41.", "alternativas": ["compõem – são chamados – feita – é", "compõe – é chamado – feito – são", "compõem – é chamada – feita – são", "compõe – são chamados – feito – é", "compõem – é chamada – feitas – são"], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 1", "url": "provas/p2026-01-ps15.pdf#page=3", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q02", "banca": "p2026-01-ps15", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 14, 27, 33 e 38.", "alternativas": ["a – às – a – a", "à – as – às – à", "a – a – a – a", "à – as – as – à", "a – às – às – à"], "correta": 4, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 2", "url": "provas/p2026-01-ps15.pdf#page=3", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q03", "banca": "p2026-01-ps15", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre algumas das ideias expressas no texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 3", "url": "provas/p2026-01-ps15.pdf#page=3", "itens": ["I - O sotaque das pessoas permite identificá-las com determinados grupos sociais ou regionais.", "II - As pessoas com menos escolaridade apresentam sotaques “carregados” ou “fortes”.", "III - As pessoas podem apresentar sotaque ao falarem uma língua estrangeira."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q04", "banca": "p2026-01-ps15", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso), nas afirmações a seguir, sobre algumas das ideias advindas do texto.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – V.", "F – F – V.", "F – V – F.", "V – F – F.", "F – V – V."], "correta": 1, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 4", "url": "provas/p2026-01-ps15.pdf#page=4", "itens": ["( ) Nem todos têm sotaque; apenas quem fala variedades diferentes de uma língua (como a língua portuguesa) ou quem fala uma língua estrangeira (como a língua inglesa) tem sotaque.", "( ) A diversidade de sons das línguas humanas é resultado da diversidade anatômica do aparelho fonador de cada pessoa.", "( ) O sotaque de uma pessoa está relacionado com a pronúncia de palavras e frases dessa pessoa."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q05", "banca": "p2026-01-ps15", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso), nas afirmações a seguir, sobre elementos subentendidos no texto.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["V – F – F.", "F – F – V.", "F – V – F.", "V – V – F.", "V – F – V."], "correta": 0, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 5", "url": "provas/p2026-01-ps15.pdf#page=4", "itens": ["( ) O sujeito da forma verbal tem (l. 06) é quem fala (l. 05).", "( ) Subentende-se que o sujeito da forma verbal Podem (l. 15) seja os sotaques.", "( ) O sujeito da forma verbal podem (l. 30) é as diferenças (l. 30-31)."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q06", "banca": "p2026-01-ps15", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta o valor semântico dos nexos coesivos por isso (l. 04), se (l. 50) e Assim (l. 71).", "alternativas": ["Explicação – condição – conclusão", "Conclusão – condição – causa", "Explicação – comparação – explicação", "Justificativa – comparação – explicação", "Conclusão – condição – conclusão"], "correta": 4, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 6", "url": "provas/p2026-01-ps15.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q07", "banca": "p2026-01-ps15", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre proposta de reescrita de trechos do texto.\n\nQuais estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 1, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 7", "url": "provas/p2026-01-ps15.pdf#page=4", "itens": ["I - A palavra Normalmente (l. 13) poderia ser movida para imediatamente depois de fala (l. 15), sem provocar alteração de significado na frase, efetuando-se os ajustes necessários para o uso de letras maiúsculas e minúsculas.", "II - A palavra também (l. 15) poderia ser movida para imediatamente depois de referir (l. 15), sem provocar alteração de significado na frase.", "III - A palavra também (l. 33) poderia ser movida para imediatamente antes de dialetos (l. 34), sem provocar alteração de significado na frase."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q08", "banca": "p2026-01-ps15", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Se a palavra característica (l. 21) estivesse no plural, quantas outras palavras na frase deveriam sofrer alterações para fins de concordância?", "alternativas": ["Duas.", "Três.", "Quatro.", "Cinco.", "Seis."], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 8", "url": "provas/p2026-01-ps15.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q09", "banca": "p2026-01-ps15", "num": 9, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que NÃO apresenta um exemplo de partícula que exercendo a função sintática de sujeito.", "alternativas": ["que (l. 45).", "que (l. 57).", "que (l. 62).", "que (l. 66).", "que (l. 72)."], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 9", "url": "provas/p2026-01-ps15.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q10", "banca": "p2026-01-ps15", "num": 10, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que NÃO apresenta palavras formadas com os mesmos prefixos das formas verbais inspiramos (l. 62) e expiramos (l. 63).", "alternativas": ["incapacitar – ex-prefeito.", "ingerir – expelir.", "injetar – extração.", "inocular – exógeno.", "ingresso – exterior."], "correta": 0, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 10", "url": "provas/p2026-01-ps15.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2026-01-ps15:t1"}, {"id": "p2026-01-ps15-q11", "banca": "p2026-01-ps15", "num": 11, "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Ideia ou sentimento negativo baseado em estereótipos, sem contato direto com a realidade (Fenavist, ABCFAV, Turra e Pedrosa, 2025) é a definição de", "alternativas": ["assédio moral.", "bullying organizacional.", "capacitismo.", "homofobia.", "preconceito."], "correta": 4, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 11", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q13", "banca": "p2026-01-ps15", "num": 13, "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Acerca de Comunicação Não Violenta (CNV), na abordagem de Marshall Rosenberg, qual a afirmativa correta?", "alternativas": ["Observações, sentimentos, necessidades e pedidos (ou demandas) são os quatro componentes principais da CNV.", "Sentimentos são os elementos menos importantes da CNV, devendo ser desconsiderados quando forem negativos.", "A empatia na CNV ocorre quando contamos para a outra pessoa o que estamos sentindo, o que nos é importante e qual o nosso pedido.", "Fazer pedidos negativos, subjetivos e relativizados, não específicos, é fundamental na CNV.", "As necessidades abordadas pela CNV não são necessariamente humanas, nem universais."], "correta": 0, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 13", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q14", "banca": "p2026-01-ps15", "num": 14, "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "De acordo com a Carta dos Direitos e Deveres do Paciente do Hospital de Clínicas de Porto Alegre (HCPA), qual alternativa apresenta um dever do paciente/família?", "alternativas": ["Consentir em participar de pesquisas.", "Desfrutar de atividades lúdicas.", "Responsabilizar-se pela guarda de seus objetos pessoais.", "Buscar informações sobre procedimentos para doação de órgãos e tecidos.", "Evitar buscar outra opinião sobre diagnóstico e proposta de tratamento."], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 14", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q15", "banca": "p2026-01-ps15", "num": 15, "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Tomar todos os cuidados para que, em razão da idade avançada, pessoas não sejam privadas de acessar postos e cargos de liderança em organizações e instituições, valorizando a experiência desta população, é uma medida de combate", "alternativas": ["ao ageísmo.", "ao capacitismo.", "à homofobia.", "ao machismo.", "à xenofobia."], "correta": 0, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 15", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q16", "banca": "p2026-01-ps15", "num": 16, "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "De acordo com o Estatuto da Criança e do Adolescente (ECA) – Lei nº 8.069/1990, assinale a alternativa correta.", "alternativas": ["O poder público, as instituições e os empregadores propiciarão condições adequadas ao aleitamento materno, exceto aos filhos de mães submetidas a medida privativa de liberdade.", "Os profissionais que atuam no cuidado diário ou frequente de crianças na primeira infância receberão formação específica e permanente para a detecção de sinais de risco para o desenvolvimento psíquico, bem como para o acompanhamento que se fizer necessário.", "Ainda que cumpridas as normas regulamentadoras, menores de 21 anos não podem visitar o pai ou a mãe internados em instituição de saúde.", "É facultativo aos estabelecimentos de atendimento à saúde, inclusive às unidades neonatais, de terapia intensiva e de cuidados intermediários, proporcionar condições para a permanência em tempo integral de um dos pais ou responsável, nos casos de internação de criança ou adolescente, não havendo obrigatoriedade.", "A permanência da criança e do adolescente em programa de acolhimento institucional não se prolongará por mais de 48 (quarenta e oito) meses, salvo comprovada necessidade que atenda ao seu superior interesse, devidamente fundamentada pela autoridade judiciária."], "correta": 1, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 16", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q17", "banca": "p2026-01-ps15", "num": 17, "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Possibilidade e condição de alcance para utilização, com segurança e autonomia, de espaços, mobiliários, equipamentos urbanos, edificações, transportes, informação e comunicação, inclusive seus sistemas e tecnologias, bem como de outros serviços e instalações abertos ao público, de uso público ou privados de uso coletivo, tanto na zona urbana como na rural, por pessoa com deficiência ou com mobilidade reduzida, segundo a Lei Brasileira de Inclusão (LBI) da Pessoa com Deficiência (Lei nº 13.146/2015), é a definição de", "alternativas": ["acessibilidade.", "adaptações razoáveis.", "comunicação.", "desenho universal.", "tecnologia assistiva ou ajuda técnica."], "correta": 0, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 17", "url": "provas/p2026-01-ps15.pdf#page=5"}, {"id": "p2026-01-ps15-q18", "banca": "p2026-01-ps15", "num": 18, "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "A respeito do direito de pessoas idosas à saúde, de acordo com a Lei nº 10.741/2003 e a Lei nº 14.423/2022, assinale a alternativa correta.", "alternativas": ["Quando a pessoa idosa não estiver em condições de proceder à opção pelo tratamento de saúde que lhe for reputado mais favorável, em qualquer circunstância, somente o médico poderá fazê-lo.", "É obrigatório exigir o comparecimento da pessoa idosa enferma perante os órgãos públicos, independentemente da gravidade da enfermidade.", "Em todo atendimento de saúde, os maiores de 80 (oitenta) anos terão preferência especial sobre as demais pessoas idosas, exceto em caso de emergência.", "À pessoa idosa é assegurado o direito a acompanhante somente em horário parcial e em internações superiores a 7 (sete) dias.", "Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação facultativa pelos serviços de saúde públicos e privados à autoridade sanitária."], "correta": 2, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 18", "url": "provas/p2026-01-ps15.pdf#page=6"}, {"id": "p2026-01-ps15-q20", "banca": "p2026-01-ps15", "num": 20, "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Conforme o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), qual a alternativa que NÃO apresenta um dever do servidor público?", "alternativas": ["Jamais retardar qualquer prestação de contas, condição essencial da gestão dos bens, direitos e serviços da coletividade a seu cargo.", "Ter respeito à hierarquia, porém sem nenhum temor de representar contra qualquer comprometimento indevido da estrutura em que se funda o Poder Estatal.", "Apresentar-se ao trabalho com vestimentas adequadas ao exercício da função.", "Abster-se, de forma absoluta, de exercer sua função, poder ou autoridade com finalidade estranha ao interesse público, mesmo que observando as formalidades legais e não cometendo qualquer violação expressa à lei.", "Deixar de utilizar os avanços técnicos e científicos ao seu alcance ou do seu conhecimento para atendimento do seu mister."], "correta": 4, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 20", "url": "provas/p2026-01-ps15.pdf#page=6"}, {"id": "p2026-01-ps15-q23", "banca": "p2026-01-ps15", "num": 23, "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Segundo o art. 3º da RDC nº 36/2013, o conjunto de valores, atitudes, competências e comportamentos que determinam o comprometimento com a gestão da saúde e da segurança, substituindo a culpa e a punição pela oportunidade de aprender com as falhas e melhorar a atenção à saúde, é definido como", "alternativas": ["gestão de risco.", "garantia da qualidade.", "segurança do paciente.", "cultura da segurança.", "tecnologias em saúde."], "correta": 3, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 23", "url": "provas/p2026-01-ps15.pdf#page=7"}, {"id": "p2026-01-ps15-q24", "banca": "p2026-01-ps15", "num": 24, "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Acerca da Norma Regulamentadora nº 32 (2022), no que tange às medidas de proteção do trabalhador, assinale a alternativa INCORRETA.", "alternativas": ["O empregador deve assegurar capacitação aos trabalhadores, antes do início das atividades e de forma continuada, sempre que ocorra uma mudança nas condições de exposição dos trabalhadores aos agentes biológicos, durante o horário de trabalho e por profissionais de saúde familiarizados com os riscos inerentes aos agentes biológicos.", "Os trabalhadores podem, aos finais de plantão, deixar o local de trabalho levando consigo os equipamentos de proteção individual e as vestimentas utilizadas em suas atividades laborais.", "Os trabalhadores devem comunicar imediatamente todo acidente ou incidente, com possível exposição a agentes biológicos, ao responsável pelo local de trabalho e, quando houver, ao serviço de segurança e saúde do trabalho e à CIPA.", "Os trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu descarte.", "O empregador deve comprovar para a inspeção do trabalho a realização da capacitação através de documentos que informem a data, o horário, a carga horária, o conteúdo ministrado, o nome e a formação ou capacitação profissional do instrutor e dos trabalhadores envolvidos."], "correta": 1, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 24", "url": "provas/p2026-01-ps15.pdf#page=7"}, {"id": "p2026-01-ps15-q25", "banca": "p2026-01-ps15", "num": 25, "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale a alternativa que, conforme a Lei nº 8.080/1990, NÃO apresenta uma diretriz do Sistema Único de Saúde (SUS).", "alternativas": ["Direito à informação, às pessoas assistidas, sobre sua saúde.", "Capacidade de resolução dos serviços em todos os níveis de assistência.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "Priorização exclusiva dos recursos dos municípios na prestação de serviços de assistência à saúde infantil.", "Integração em nível executivo das ações de saúde, meio ambiente e saneamento básico."], "correta": 3, "fonte": "Prova de 2026 · Assistente Administrativo I (Vigilante) (FAURGS), questão 25", "url": "provas/p2026-01-ps15.pdf#page=7"}]</script>
<script id="resumos" type="application/json">[{"id": "info-planilhas", "tema": "Informática", "titulo": "Planilhas: fórmulas que mais caem", "minutos": 6, "porque": "Cai copiar fórmula com $, calcular o resultado de uma função (SOMA, MÉDIA, SE, CONT.SE, SOMASE, PROCV) e saber o que cada erro significa.", "pontos": [{"t": "Toda fórmula começa com =. Exemplo: =A1+B1.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "grupo": "Básico das fórmulas", "chave": "começa com ="}, {"t": "Ordem das contas: o que está entre parênteses primeiro, depois ^ (potência), depois * e /, por último + e -. =5+2*3 dá 11; =(5+2)*3 dá 21.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "grupo": "Básico das fórmulas", "chave": "parênteses primeiro"}, {"t": "A1 é relativa: muda ao copiar. $A$1 nunca muda. A$1 trava só a linha. $A1 trava só a coluna. A tecla F4 alterna os tipos.", "fonte": "Microsoft Suporte: Alternar entre referências relativas, absolutas e mistas", "grupo": "Básico das fórmulas", "chave": "$A$1 nunca muda"}, {"t": "Erros: #DIV/0! dividiu por zero ou vazio; #N/D valor não encontrado; #NOME? texto não reconhecido; #REF! referência inválida; #### coluna estreita.", "fonte": "Microsoft Suporte: Detectar erros de fórmula no Excel", "grupo": "Básico das fórmulas", "chave": "#DIV/0!"}, {"t": "=SOMA(A1:A5) soma o intervalo. =MÉDIA(A1:A5) ignora célula vazia e texto, mas conta a célula com zero.", "fonte": "Microsoft Suporte: Função MÉDIA", "grupo": "Funções essenciais", "chave": "ignora célula vazia"}, {"t": "=SE(teste;se_verdadeiro;se_falso). Se o teste der verdadeiro, mostra o 2º argumento; se der falso, o 3º.", "fonte": "Microsoft Suporte: Função SE", "grupo": "Funções essenciais", "chave": "mostra o 2º argumento"}, {"t": "=CONT.SE(intervalo;critério) conta células. =SOMASE(intervalo;critério;intervalo_soma) soma os valores das linhas que batem com o critério.", "fonte": "Microsoft Suporte: Função CONT.SE; Função SOMASE", "grupo": "Funções essenciais", "chave": "=CONT.SE"}, {"t": "=PROCV(valor;tabela;nº da coluna;FALSO) procura na 1ª coluna da tabela e devolve a coluna pedida. FALSO = valor exato.", "fonte": "Microsoft Suporte: Função PROCV", "grupo": "PROCV e PROCX", "chave": "FALSO = valor exato"}, {"t": "No PROCV, se você omitir o último argumento, o padrão é VERDADEIRO (aproximado). Isso vale no Excel e no Google Planilhas.", "fonte": "Microsoft Suporte: Função PROCV; Ajuda do Editores de Documentos Google: PROCV", "grupo": "PROCV e PROCX", "chave": "VERDADEIRO (aproximado)"}, {"t": "PROCX procura para qualquer lado e é exata por padrão. Mas não existe no Excel 2016 nem no Excel 2019.", "fonte": "Microsoft Suporte: Função PROCX", "grupo": "PROCV e PROCX", "chave": "não existe no Excel 2016"}, {"grupo": "Excel e Google Planilhas", "t": "As fórmulas são quase iguais nos dois: SOMA, MÉDIA, SE, CONT.SE, SOMASE e PROCV existem no Excel e no Google Planilhas e se escrevem do mesmo jeito.", "chave": "quase iguais nos dois"}, {"grupo": "Excel e Google Planilhas", "t": "PROCV não é o Ctrl+F. O Ctrl+F (Localizar) só acha um texto na tela. O PROCV é uma fórmula: procura um valor numa tabela e devolve outro da mesma linha.", "chave": "PROCV não é o Ctrl+F"}, {"grupo": "Excel e Google Planilhas", "t": "Onde fica o arquivo: o Excel salva um arquivo .xlsx no computador ou no OneDrive. O Google Planilhas fica no Google Drive e salva sozinho.", "chave": "salva sozinho"}, {"grupo": "Excel e Google Planilhas", "t": "Leia de qual programa a questão fala. Se ela disser “Excel ou Google Planilhas”, a resposta vale para os dois."}], "pegadinhas": [{"t": "No PROCV, o número da coluna conta a partir da 1ª coluna da tabela escolhida, não a partir da coluna A da planilha.", "ponto": 7}, {"t": "Em SE, cuidado com > e >=. Com valores iguais, 3>3 é falso e 3>=3 é verdadeiro.", "ponto": 5}, {"t": "Ao copiar uma fórmula, só muda a parte que não tem $ na frente.", "ponto": 2}, {"t": "No Google Planilhas em português, CONT.SE, SOMASE e PROCV têm os mesmos nomes do Excel. A banca pode citar os dois programas na mesma questão.", "ponto": null}], "exemplo": {"pergunta": "No Excel, a célula C1 tem a fórmula =A1*B$1. Ela foi copiada para C2, uma linha abaixo. Qual fórmula aparece em C2?", "passos": ["Separe as duas referências: A1 e B$1.", "A1 não tem $. Ela é relativa e acompanha o movimento. Desceu uma linha, então A1 vira A2.", "B$1 tem $ antes do 1. A linha está travada e continua 1.", "A coluna B não tem $, mas a cópia foi na mesma coluna (C para C). Então B continua B.", "Junte tudo: =A2*B$1."], "resposta": "=A2*B$1"}, "links": [{"rotulo": "Referências relativas, absolutas e mistas (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/alternar-entre-refer%C3%AAncias-relativas-absolutas-e-mistas-dfec08cd-ae65-4f56-839e-5f0d8d0baca9"}, {"rotulo": "Ordem das operações no Excel (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/a-ordem-em-que-o-excel-efetua-opera%C3%A7%C3%B5es-em-f%C3%B3rmulas-28eaf0d7-7058-4eff-a8ea-0a835fafadb8"}, {"rotulo": "Função SOMASE (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/somase-fun%C3%A7%C3%A3o-169b8c99-c05c-4483-a712-1697a653039b"}, {"rotulo": "Função PROCV (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-procv-0bbc8083-26fe-4963-8ab8-93a18ad188a1"}, {"rotulo": "Erros de fórmula no Excel (Microsoft)", "url": "https://support.microsoft.com/pt-br/excel/detect-formula-errors-in-excel"}, {"rotulo": "SOMASE no Google Planilhas", "url": "https://support.google.com/docs/answer/3093583?hl=pt-BR"}]}, {"id": "info-docs-drive", "tema": "Informática", "titulo": "Word, Docs e nuvem: o essencial", "minutos": 6, "porque": "Cai atalho de teclado, revisão com comentários e sugestões, permissões de compartilhamento e histórico de versões.", "pontos": [{"t": "Word em português: Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+B salvar.", "fonte": "Microsoft Suporte:
