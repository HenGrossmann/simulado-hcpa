              <tr><td>Conhecimentos específicos</td><td class="n">25</td><td class="n">–</td></tr>
              <tr><td>Português</td><td class="n">5</td><td class="n">2</td></tr>
              <tr><td>Informática</td><td class="n">5</td><td class="n">2</td></tr>
              <tr><td>Raciocínio lógico</td><td class="n">5</td><td class="n">2</td></tr>
              <tr><td><b>Total</b></td><td class="n"><b>40</b></td><td class="n"><b>24</b></td></tr>
            </tbody>
          </table>
          <ul>
            <li>Toda questão vale o mesmo: 0,25. Para passar, nota 6 (24 acertos) e pelo menos 2 acertos em Português, Informática e Raciocínio Lógico.</li>
            <li>Os específicos são 62,5% da prova. É onde estão os pontos.</li>
            <li>Nota final: prova escrita com peso 6 e títulos com peso 4. Só os 300 primeiros da ampla concorrência (mais as cotas) seguem para os títulos.</li>
            <li>Não tem redação.</li>
          </ul>

        </div>
      </details>
      <section class="grupo" aria-labelledby="t-provas">
        <h2 id="t-provas">Provas reais da FAURGS</h2>

      </section>
      <div class="provas">${Object.entries(PROVAS).filter(([, p]) => !p.extra).map(([pid, p]) => {
        const f = (store.folhas || {})[pid];
        const ult = f && f.corrigida ? `<p class="nota">Última correção: ${contarFolha(pid, f.marcas).acertos} de ${p.gab.length}</p>` : f && Object.keys(f.marcas || {}).length ? `<p class="nota">${Object.keys(f.marcas).length} respostas marcadas, falta corrigir</p>` : '';
        return `<div class="prova-card">
          <span class="sub">${esc(p.sub)}</span>
          <h3>${esc(p.titulo)} · ${p.gab.length} questões</h3>
          <p class="nota">${esc(p.nota)}</p>
          ${ult}
          <div class="botoes">
            ${temBanca(pid) ? `<button class="mini" data-act="banca-escolha" data-p="${pid}">Resolver aqui no site</button>` : ''}

      ${Object.values(PROVAS).some(p => p.extra) ? `<details class="material mais-provas"><summary>Mais provas da banca para o HCPA (${Object.values(PROVAS).filter(p => p.extra).length})</summary>

          if (temBanca(pid)) return `<li><button class="link-prova" data-act="banca-escolha" data-p="${pid}"><b>${esc(p.titulo)}</b><small>${idsBanca(pid).length} questões úteis · resolver aqui no site</small></button></li>`;
          const f = (store.folhas || {})[pid], c = f && f.corrigida ? contarFolha(pid, f.marcas) : null;
          return `<li><button class="link-prova" data-act="folha" data-p="${pid}"><b>${esc(p.titulo)}</b><small>${numsDe(pid).length} questões úteis${c ? ` · última correção: ${c.acertos} de ${c.total}` : ''}</small></button></li>`;
        }).join('')}</ul></details>` : ''}
      <section class="grupo" aria-labelledby="t-temas">

        <div class="chips-materia">${MATERIAS.map((m, i) => `<button class="chip-mat" data-act="ir-materia" data-alvo="mat-${i}">${esc(m)}</button>`).join('')}</div>

      <section class="grupo" aria-labelledby="t-outras">
        <h2 id="t-outras">Outras formas de treinar</h2>
      </section>
      <div class="acoes">
        <button class="btn" data-act="simulado" ${temOficial ? '' : 'disabled'}>
          <span>Simulado de 40 questões<small>5 Português · 5 Informática · 5 Raciocínio Lógico · 25 Específicos, como na prova. Sem dicas, correção no final.</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="treino-formulas">
          <span>Treino de fórmulas de planilha<small>10 questões novas a cada vez: copiar fórmula com $ e ordem das contas</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="treino-di">
          <span>Direta ou inversa?<small>10 situações para treinar quando inverter a regra de três</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="rapida">
          <span>Rodada rápida<small>10 questões sorteadas, com a correção na hora</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="anotacoes">
          <span>Minhas anotações<small>${Object.keys(store.notas || {}).length ? Object.keys(store.notas).length + ' anotações suas' : 'O que você anotar nas questões fica aqui'}</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="erros" ${erros.length ? '' : 'disabled'}>
          <span>Refazer as que errei<small>${erros.length ? erros.length + (erros.length === 1 ? ' questão' : ' questões') + ' com erro na última tentativa' : 'Nenhum erro guardado ainda'}</small></span><span class="seta">→</span>
        </button>
      </div>
      <details class="material">
        <summary>Material oficial para estudar</summary>
        <ul>
          <li><a href="https://portalfaurgs.com.br/LerArquivo/19c9cb82-a209-4830-8cd8-24e43fc55b45" target="_blank" rel="noopener">Edital 04/2026 completo (FAURGS)</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm" target="_blank" rel="noopener">Lei 8.080/1990 (SUS)</a></li>
          <li><a href="https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/" target="_blank" rel="noopener">HumanizaSUS: documento base</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf" target="_blank" rel="noopener">Carta dos Direitos dos Usuários da Saúde</a></li>
          <li><a href="https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf" target="_blank" rel="noopener">Carta de direitos e deveres do paciente do HCPA</a></li>

          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm" target="_blank" rel="noopener">Lei Brasileira de Inclusão, Lei 13.146/2015</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm" target="_blank" rel="noopener">Injúria racial, Lei 14.532/2023</a></li>
          <li><a href="https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf" target="_blank" rel="noopener">Guia ANS de Diversidade e Inclusão</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm" target="_blank" rel="noopener">LGPD, Lei 13.709/2018</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm" target="_blank" rel="noopener">Código de Ética do servidor, Decreto 1.171/1994</a></li>
          <li><a href="https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf" target="_blank" rel="noopener">NR-32</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html" target="_blank" rel="noopener">RDC 36/2013 (segurança do paciente)</a> e <a href="https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html" target="_blank" rel="noopener">Portaria 529/2013</a></li>
          <li><a href="https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content" target="_blank" rel="noopener">Gestão de materiais (Fenili, ENAP)</a> e <a href="https://efivest.com.br/wp-content/uploads/2018/09/gestaodeestoques.pdf" target="_blank" rel="noopener">Gestão de estoques (Kummer)</a></li>
          <li><a href="https://cartilha.cert.br/" target="_blank" rel="noopener">Cartilha de Segurança para Internet (cert.br)</a></li>
        </ul>
      </details>
      <p class="nota">As questões de "Treinar por assunto" e dos simulados foram escritas a partir das leis e documentos que o edital indica. Não são questões da FAURGS. Cada resposta mostra o artigo ou trecho de onde saiu, para conferir. As questões da banca são as das provas reais acima.</p>
      <section class="copia">
        <h3>Guardar uma cópia do progresso</h3>
        <p class="nota">Baixa um arquivo com suas respostas, anotações e o plano. Serve para guardar ou para levar o progresso para outro aparelho (do tablet para o iPhone, por exemplo): lá, toque em “Restaurar” e escolha o arquivo.</p>
        <div class="botoes"><button class="mini" data-act="baixar-progresso">Baixar cópia</button>
          <label class="mini restaurar">Restaurar de um arquivo<input type="file" accept=".json,application/json" data-restaurar hidden></label></div>
      </section>
      <div class="linha-acoes">
        ${instalado() ? `<p class="nota">Seu progresso fica salvo só neste aparelho. O site abre sem internet; só os vídeos do YouTube e os PDFs que você ainda não abriu precisam dela.</p>`
          : `<div class="sem-internet"><p><b>Para usar sem internet no iPhone:</b> abra este site no Safari, toque em Compartilhar (o quadrado com a seta) e depois em “Adicionar à Tela de Início”. Daí em diante, abra pelo ícone.</p>
            <p class="nota">O progresso fica salvo só no aparelho, e o ícone guarda o dele separado do Safari: escolha um dos dois e use sempre o mesmo.</p></div>`}
        ${resp.length ? (confirmarZerar
          ? `<span class="nota">Apagar todo o progresso?</span><button class="link-btn" data-act="zerar-sim">Sim, apagar</button><button class="link-btn" data-act="zerar-nao">Cancelar</button>`
          : `<button class="link-btn" data-act="zerar">Zerar progresso</button>`) : ''}
      </div>`;
    nav.hidden = true;
  }
  let confirmarZerar = false;

  // ---------- Sessões ----------
  function iniciar(modo, titulo, ids) {
    confirmarZerar = false;
    S = { modo, titulo, ids, i: 0, resp: {}, entregue: false };
    confirmar = null;
    questao();
  }
  function montarSimulado() {
    let ids = [];
    for (const m of MATERIAS) {
      let sorteadas = embaralhar(idsDa(m)).slice(0, OFICIAL[m]);
      // Questões de Português que dividem o mesmo texto ficam juntas.
      if (m === 'Português') sorteadas.sort((a, b) => (BYID[b].texto ? 1 : 0) - (BYID[a].texto ? 1 : 0));
      ids = ids.concat(sorteadas);
    }
    return ids;
  }

  // ---------- Questão ----------
  function questao() {
    VISTA = 'questao'; armar(); guardarSessao();
    const id = S.ids[S.i], q = BYID[id];
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    const escolhida = S.resp[id];
    const revelado = !simuladoAberto && (escolhida != null || S.entregue);

    const opcoes = q.alternativas.map((a, k) => {
      let cls = 'opt';
      if (revelado) cls += k === q.correta ? ' certa' : k === escolhida ? ' errada' : ' apagada';
      else if (k === escolhida) cls += ' marcada';
      const estado = revelado ? (k === q.correta ? ' (resposta certa)' : k === escolhida ? ' (sua resposta)' : '') : (k === escolhida ? ' (marcada)' : '');
      return `<button class="${cls}" data-act="marcar" data-k="${k}" ${revelado ? 'disabled' : ''} aria-label="Alternativa ${L[k]}${estado}"><span class="bolha" aria-hidden="true">${L[k]}</span><span class="txt">${esc(a)}</span></button>`;
    }).join('');

    let fb = '';
    if (revelado) {
      const ok = escolhida === q.correta;
      const ver = escolhida == null ? `Em branco. Resposta: letra ${L[q.correta]}` : ok ? 'Certa!' : `Errou. Resposta: letra ${L[q.correta]}`;
      fb = `<section class="feedback ${ok ? 'ok' : 'bad'}">
        <p class="veredito">${ver}</p>
        ${!ok && escolhida != null && q.porque && q.porque[L[escolhida]] ? `<p class="porque-sua"><b>Por que a ${L[escolhida]} está errada:</b> ${esc(q.porque[L[escolhida]])}</p>` : ''}
        ${q.banca ? `<p class="nota">Questão da banca: a resposta é a do gabarito oficial e não tem explicação aqui. Se ficou com dúvida, anote embaixo e procure o assunto no resumo.</p>` : ''}
        ${q.passos ? explicacaoEmPassos(q, ok) : `${q.explicacao ? `<p>${esc(q.explicacao)}</p>` : ''}
        ${q.fundamento ? `<blockquote>${esc(q.fundamento)}</blockquote>` : ''}`}
        ${q.fonte && q.fonte !== 'Resolução' ? `<p class="fonte">Fonte: ${esc(q.fonte)}${q.url ? ` · <a href="${esc(q.url)}" target="_blank" rel="noopener">abrir</a>` : ''}</p>` : ''}
        ${q.video ? `<figure class="video-proprio fb-video"><video controls playsinline preload="metadata" src="${esc(q.video.arquivo)}#t=0.5"></video><figcaption><b>${esc(q.video.titulo)}</b><small>Vídeo do site${q.video.minutos ? ` · ${q.video.minutos} min` : ''}</small></figcaption></figure>` : ''}
        ${!q.gerada ? blocoNota(id) : ''}
        ${S.modo !== 'simulado' ? `<div class="fb-acoes">
          ${q.gerador ? `<button class="mini" data-act="outra-parecida">Fazer outra parecida</button>` : ''}
          ${q.gerador === 'regra3' ? `<button class="mini" data-act="treino-di">Treinar: direta ou inversa?</button>` : ''}
          ${q.gerador && q.gerador.startsWith('formula') ? `<button class="mini" data-act="treino-formulas">Treinar 10 fórmulas</button>` : ''}
          ${escolhida != null ? `<button class="link-btn" data-act="desfazer-resp">Cliquei sem querer: desfazer</button>` : ''}
        </div>` : ''}
      </section>`;
    }

    const pct = 100 * (S.i + 1) / S.ids.length;
    view.innerHTML = `
      <div class="barra-sup">
        <button class="sair" data-act="sair">← Sair</button>
        <span class="pos">${S.i + 1} / ${S.ids.length}</span>
      </div>
      <div class="progresso" aria-hidden="true"><i style="width:${pct}%"></i></div>
      ${simuladoAberto ? `<p class="aviso">Modo prova: sem dicas, como no dia. As explicações aparecem quando você entregar. Para treinar com dica, saia e escolha a matéria na tela inicial. Este simulado fica guardado.</p>` : ''}
      <article class="questao">
        <div class="linha-acoes"><span class="num">Questão ${S.i + 1}</span><span class="chip">${esc(q.materia === q.tema ? q.materia : q.tema)}</span><span class="origem">${q.banca ? `Questão real da FAURGS · ${esc(PROVAS[q.banca].titulo)}, nº ${q.num}` : 'Treino · escrita para o simulado, não é da banca'}</span></div>
        ${q.instrucao ? `<p class="instrucao">${esc(q.instrucao)}</p>` : ''}
        ${(q.texto || TEXTOS[q.textoRef]) ? `<details class="texto" open><summary>Texto de apoio</summary><p>${esc(q.texto || TEXTOS[q.textoRef])}</p></details>` : ''}
        ${(() => {
          // Na prova, a pergunta ("Quais estão corretas?") vem depois dos itens: é o último parágrafo do enunciado.
          const corte = q.itens && q.itens.length ? q.enunciado.lastIndexOf('\n\n') : -1;
          const antes = corte > 0 ? q.enunciado.slice(0, corte) : q.enunciado, depois = corte > 0 ? q.enunciado.slice(corte + 2) : '';
          return `<p class="enunciado">${esc(antes)}</p>
        ${q.itens && q.itens.length ? `<ul class="itens">${q.itens.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${depois ? `<p class="enunciado">${esc(depois)}</p>` : ''}`;
        })()}
        ${q.figura ? `<img class="figura-q" src="${esc(q.figura)}" alt="Figura da questão ${q.num}, como está na prova">` : ''}
        ${q.dica && !revelado && S.modo !== 'simulado' ? `<details class="dica-q"><summary>Não sei por onde começar</summary><p>${esc(q.dica)}</p></details>` : ''}
        ${!revelado && S.modo !== 'simulado' ? lembretesDe(q).map(([, nome, txt]) => `<details class="dica-q"><summary>Não lembro o que é ${esc(nome)}</summary><p>${esc(txt)}</p></details>`).join('') : ''}
        ${q.banca && q.textoRef && !revelado && S.modo !== 'simulado' ? `<details class="dica-q"><summary>O texto é longo demais</summary><p>Leia primeiro a pergunta e as alternativas. Depois volte ao texto só nas linhas que elas citam. Não precisa ler tudo de novo a cada questão do mesmo texto.</p></details>` : ''}
        <div class="opcoes">${opcoes}</div>
        ${fb}
      </article>`;
    barraNav();
  }

  function barraNav() {
    nav.hidden = false;
    const ultimo = S.i === S.ids.length - 1;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p>
        <button class="nb" data-act="conf-nao">Voltar</button>
        <button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
      return;
    }
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    let prox;
    if (simuladoAberto) prox = ultimo ? `<button class="nb prim" data-act="entregar">Entregar</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else if (S.modo === 'simulado') prox = ultimo ? `<button class="nb prim" data-act="resultado">Ver resultado</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else prox = ultimo ? `<button class="nb prim" data-act="fim">Concluir</button>` : `<button class="nb prim" data-act="prox">${S.resp[S.ids[S.i]] == null ? 'Pular' : 'Próxima'}</button>`;
    const extra = simuladoAberto && !ultimo ? `<button class="nb" data-act="entregar">Entregar</button>` : '';
    navIn.innerHTML = `<button class="nb" data-act="ant" ${S.i === 0 ? 'disabled' : ''}>Anterior</button>${extra}${prox}`;
  }

  function entregar() {
    S.entregue = true;
    esquecerSimulado();
    marcarFeita(S.missao);
    for (const id of S.ids) if (S.resp[id] != null) registrar(id, S.resp[id] === BYID[id].correta);
    resultado();
  }

  // ---------- Resultado ----------
  function resultado() {
    VISTA = 'resultado'; armar(); esquecerSessao();
    confirmar = null;
    const ids = S.ids;
    const certa = id => S.resp[id] === BYID[id].correta;
    const acertos = ids.filter(certa).length;
    const porMat = MATERIAS.map(m => {
      const xs = ids.filter(id => BYID[id].materia === m);
      return { m, total: xs.length, ok: xs.filter(certa).length };
    }).filter(x => x.total);

    let edital = '';
    if (S.modo === 'simulado') {
      const nota = acertos * 0.25;
      const faltas = porMat.filter(x => x.m !== 'Conhecimentos Específicos' && x.ok < 2).map(x => x.m);
      const passa = nota >= 6 && !faltas.length;
      const motivos = [];
      if (nota < 6) motivos.push(`nota ${nota.toFixed(2).replace('.', ',')}, abaixo de 6,00 (faltaram ${24 - acertos} acertos)`);
      if (faltas.length) motivos.push(`menos de 2 acertos em ${faltas.length > 1 ? faltas.slice(0, -1).join(', ') + ' e ' + faltas[faltas.length - 1] : faltas[0]}`);
      edital = `<div class="veredito-edital ${passa ? 'ok' : 'bad'}">
        <h2>${passa ? 'Passaria dos mínimos do edital' : 'Ficaria abaixo dos mínimos do edital'}</h2>
        <p>${passa ? 'Nota de pelo menos 6,00 e no mínimo 2 acertos em Português, Informática e Raciocínio Lógico.' : 'Motivo: ' + esc(motivos.join('; ')) + '.'}</p>
        <p class="nota">O mínimo só evita a eliminação. A classificação depende das notas das demais pessoas inscritas e da prova de títulos.</p>
      </div>`;
    }

    const notaTxt = S.modo === 'simulado' ? `<p>Nota ${(acertos * 0.25).toFixed(2).replace('.', ',')} de 10,00 (cada questão vale 0,25)</p>` : '';
    let fechamento = '';
    if (S.missao && feitas()[S.missao]) {
      const prox = proximaMissao();
      const nFeitas = PLANO.filter(m => feitas()[m.id]).length;
      fechamento = `<section class="feito" aria-live="polite">
        <h2>✓ Tarefa feita</h2>
        <p>${nFeitas} de ${PLANO.length} tarefas do plano. ${prox ? `Próxima: <b>${esc(prox.m.titulo)}</b>, cerca de ${prox.m.min} min.` : 'Era a última. Daqui até a prova, simulados e revisão.'}</p>
        ${ids.some(id => !certa(id)) ? '<p class="nota">Errou alguma? Ela fica guardada em "Refazer as que errei" para revisar depois.</p>' : ''}
      </section>`;
    }
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${esc(S.titulo)}</span></div>
      ${fechamento}
      <section class="placar">
        <span class="chip">Resultado</span>
        <span class="grande">${acertos} / ${ids.length}</span>
        ${notaTxt}
      </section>
      ${edital}
      ${S.modo !== 'simulado' && ids.some(id => S.resp[id] == null) ? `<div class="revisar-box"><p><b>Você pulou ${ids.filter(id => S.resp[id] == null).length} ${ids.filter(id => S.resp[id] == null).length === 1 ? 'questão' : 'questões'}.</b> Quer tentar agora, com calma?</p><button class="mini prim" data-act="puladas">Fazer as que pulei</button></div>` : ''}
      <table class="tabela">
        <thead><tr><th>Matéria</th><th class="n">Acertos</th></tr></thead>
        <tbody>${porMat.map(x => `<tr><td>${esc(x.m)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody>
      </table>
      <section class="grupo">
        <h2>Revisar questão por questão</h2>
        <div class="revisao">${ids.map((id, i) => {
          const r = S.resp[id];
          const cls = r == null ? 'branco' : certa(id) ? 'ok' : 'bad';
          const marca = r == null ? '–' : L[r];
          return `<button data-act="rever" data-i="${i}"><span class="marca ${cls}" aria-label="${cls === 'ok' ? 'certa' : cls === 'bad' ? 'errada' : 'em branco'}">${marca}</span><span class="resumo">${i + 1}. ${esc(BYID[id].tema)}: ${esc(BYID[id].enunciado)}</span></button>`;
        }).join('')}</div>
      </section>`;
    nav.hidden = false;
    const temErro = ids.some(id => !certa(id));
    navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button>${temErro ? `<button class="nb prim" data-act="refazer">Refazer erradas</button>` : ''}`;
    window.scrollTo(0, 0);
  }

  // ---------- Folha de respostas das provas reais ----------
  let F = null; // { pid, so }
  function chaveF(pid, so) { return so ? pid + '|' + so : pid; }
  function folhaDe(chave) {
    store.folhas = store.folhas || {};
    store.folhas[chave] = store.folhas[chave] || { marcas: {}, corrigida: false };
    return store.folhas[chave];
  }
  function blocosDe(pid, so) {
    const lista = PROVAS[pid].blocos.map(bl => [bl[0], Array.isArray(bl[1]) ? bl[1] : Array.from({ length: bl[2] - bl[1] + 1 }, (_, i) => bl[1] + i)]);
    return so ? lista.filter(bl => bl[0] === so) : lista;
  }
  function numsDe(pid, so) { return blocosDe(pid, so).flatMap(bl => bl[1]); }
  function contarFolha(pid, marcas, so) {
    const p = PROVAS[pid];
    const por = blocosDe(pid, so).map(([nome, nums]) => {
      let ok = 0;
      for (const n of nums) { const g = p.gab[n - 1]; if (g === '*' || L[marcas[n]] === g) ok++; }
      return { nome, total: nums.length, ok };
    });
    return { por, acertos: por.reduce((s, x) => s + x.ok, 0), total: por.reduce((s, x) => s + x.total, 0) };
  }
  function faixas(nums) {
    const out = [];
    for (let i = 0; i < nums.length; i++) {
      let j = i;
      while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
      out.push(j > i ? nums[i] + ' a ' + nums[j] : String(nums[i]));
      i = j;
    }
    return out.join(', ');
  }
  function folha() {
    VISTA = 'folha'; armar();
    const p = PROVAS[F.pid], f = folhaDe(chaveF(F.pid, F.so));
    const nums = numsDe(F.pid, F.so);
    const marcadas = nums.filter(n => f.marcas[n] != null).length;
    let topo = '';
    if (f.corrigida) {
      const c = contarFolha(F.pid, f.marcas, F.so);
      topo = `<section class="placar"><span class="chip">Resultado</span><span class="grande">${c.acertos} / ${c.total}</span>
        ${p.gab.includes('*') ? '<p class="nota">Questão anulada conta ponto para todo mundo, como na prova.</p>' : ''}</section>
        <table class="tabela"><thead><tr><th>Parte</th><th class="n">Acertos</th></tr></thead>
        <tbody>${c.por.map(x => `<tr><td>${esc(x.nome)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody></table>
        <p class="nota">Verde cheio: você acertou. Vermelho: você errou, e a certa aparece com contorno verde.</p>`;
    } else {
      topo = `${F.so ? `<p class="aviso">Só as questões de <b>${esc(F.so)}</b>: ${faixas(nums)}. Pule as outras.</p>` : ''}<p class="aviso">Abra a prova, resolva no papel ou na tela e marque aqui. Este PDF não tem a folha de gabarito: a correção acontece só quando você tocar em Corrigir.</p>
        <div class="botoes"><a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir a prova (PDF)</a></div>
        <p class="nota">Prova original da FAURGS, sem a primeira página (o gabarito). <a href="${esc(p.origem)}" target="_blank" rel="noopener">Arquivo completo</a>.</p>`;
    }
    const blocos = blocosDe(F.pid, F.so).map(([nome, lista]) => {
      let linhas = '';
      for (const n of lista) {
        const g = p.gab[n - 1], m = f.marcas[n];
        const bs = [0, 1, 2, 3, 4].map(k => {
          let cls = 'b', extra = '';
          if (f.corrigida && g !== '*') {
            if (m === k) cls += L[k] === g ? ' certa' : ' errada';
            else if (L[k] === g) cls += ' gab';
          } else if (m === k) extra = ' aria-pressed="true"';
          if (!f.corrigida && m !== k) extra = ' aria-pressed="false"';
          return `<button class="${cls}" data-act="fm" data-n="${n}" data-k="${k}"${extra} ${f.corrigida ? 'disabled' : ''} aria-label="Questão ${n}, alternativa ${L[k]}">${L[k]}</button>`;
        }).join('');
        const obs = f.corrigida && g === '*' ? '<span class="obs">Anulada: ponto para todos</span>' : '';
        linhas += `<div class="lf"><span class="nq">${String(n).padStart(2, '0')}</span><div class="bs">${bs}</div>${obs}</div>`;
      }
      return `<div class="bloco"><h3>${esc(nome)} · ${faixas(lista)}</h3><div class="linhas">${linhas}</div></div>`;
    }).join('');
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${marcadas} / ${nums.length} marcadas</span></div>
      <header class="topo"><span class="sub chip">${esc(p.sub)}</span><h1>${esc(p.titulo)}</h1></header>
      ${topo}
      <div class="folha">${blocos}</div>`;
    nav.hidden = false;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p><button class="nb" data-act="conf-nao">Voltar</button><button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
    } else if (f.corrigida) {
      navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button><button class="nb prim" data-act="folha-refazer">Fazer de novo</button>`;
    } else {
      navIn.innerHTML = `<button class="nb" data-act="folha-limpar" ${marcadas ? '' : 'disabled'}>Apagar marcações</button><button class="nb prim" data-act="folha-corrigir">Corrigir</button>`;
    }
  }

  // ---------- Eventos ----------
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const rolar = () => window.scrollTo(0, 0);
    if (act !== 'ouvir') pararFala();
    if (!['ouvir', 'revelar', 'lembrei', 'modo', 'desfazer', 'ir', 'testar-erros', 'continuar-teste'].includes(act)) guardarPosicao();
    switch (act) {
      case 'simulado': abrirSimulado(); rolar(); break;
      case 'retomar-simulado': abrirSimulado(); rolar(); break;
      case 'descartar-simulado': esquecerSimulado(); { const g = sessaoGuardada(); if (g && g.modo === 'simulado') esquecerSessao(); } inicio(); break;
      case 'rapida': iniciar('pratica', 'Rodada rápida', embaralhar(Q.map(q => q.id)).slice(0, 10)); rolar(); break;
      case 'erros': iniciar('pratica', 'Refazer erros', paraRefazer()); rolar(); break;
      case 'tema': {
        const t = temas().find(t => t.materia + '|' + t.tema === el.dataset.tema);
        if (t) { iniciar('pratica', t.tema, t.ids.slice()); rolar(); }
        break;
      }
      case 'marcar': {
        const id = S.ids[S.i], k = Number(el.dataset.k), q = BYID[id];
        S.resp[id] = k;
        if (S.modo !== 'simulado' && !q.gerada) {
          S.antes = S.antes || {};
          S.antes[id] = store.res[id] ? { ...store.res[id] } : null;
          registrar(id, k === q.correta);
        }
        questao();
        break;
      }
      case 'desfazer-resp': {
        const id = S.ids[S.i];
        delete S.resp[id];
        if (S.antes && id in S.antes) {
          if (S.antes[id]) store.res[id] = S.antes[id]; else delete store.res[id];
          delete S.antes[id]; salvar();
        }
        questao(); rolar(); break;
      }
      case 'outra-parecida': {
        const nova = novaParecida(BYID[S.ids[S.i]]);
        if (nova) { const [nid] = entraNaSessao([nova]); S.ids.splice(S.i + 1, 0, nid); S.i++; questao(); rolar(); }
        break;
      }
      case 'treino-formulas': iniciar('pratica', 'Treino de fórmulas', entraNaSessao(treinoFormulas(10))); rolar(); break;
      case 'treino-di': iniciar('pratica', 'Direta ou inversa?', entraNaSessao(treinoDI(10))); rolar(); break;
      case 'prox': if (S.i < S.ids.length - 1) { S.i++; questao(); rolar(); } break;
      case 'ant': if (S.i > 0) { S.i--; questao(); rolar(); } break;
      case 'entregar': {
        const brancos = S.ids.filter(id => S.resp[id] == null).length;
        if (brancos) { confirmar = { msg: `${brancos} ${brancos === 1 ? 'questão está' : 'questões estão'} em branco. Entregar assim mesmo?`, sim: 'entregar-ja', rotuloSim: 'Entregar' }; barraNav(); }
        else entregar();
        break;
      }
      case 'sair': {
        if ((S.modo === 'simulado' && S.entregue) || S.modo === 'pratica-fim') { resultado(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'conf-nao': confirmar = null; if (F) folha(); else barraNav(); break;
      case 'conf-sim': {
        const alvo = confirmar.sim; confirmar = null;
        if (alvo === 'entregar-ja') entregar();
        else if (alvo === 'folha-corrigir-ja') { folhaDe(chaveF(F.pid, F.so)).corrigida = true; marcarFeita(F.missao); salvar(); folha(); rolar(); }
        else if (alvo === 'folha-limpar-ja') { folhaDe(chaveF(F.pid, F.so)).marcas = {}; salvar(); folha(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'folha': F = { pid: el.dataset.p, so: el.dataset.so || null }; S = null; R = null; confirmar = null; folha(); rolar(); break;
      case 'fm': {
        const f = folhaDe(chaveF(F.pid, F.so)), n = Number(el.dataset.n), k = Number(el.dataset.k);
        if (f.marcas[n] === k) delete f.marcas[n]; else f.marcas[n] = k;
        salvar(); folha();
        break;
      }
      case 'folha-corrigir': {
        const f = folhaDe(chaveF(F.pid, F.so)), faltam = numsDe(F.pid, F.so).filter(n => f.marcas[n] == null).length;
        if (faltam) { confirmar = { msg: `${faltam} ${faltam === 1 ? 'questão está' : 'questões estão'} sem marcação. Corrigir assim mesmo?`, sim: 'folha-corrigir-ja', rotuloSim: 'Corrigir' }; folha(); }
        else { f.corrigida = true; marcarFeita(F.missao); salvar(); folha(); rolar(); }
        break;
      }
      case 'folha-limpar': confirmar = { msg: 'Apagar todas as marcações desta prova?', sim: 'folha-limpar-ja', rotuloSim: 'Apagar' }; folha(); break;
      case 'folha-refazer': store.folhas[chaveF(F.pid, F.so)] = { marcas: {}, corrigida: false }; salvar(); folha(); rolar(); break;
      case 'fim': S.modo = 'pratica-fim'; marcarFeita(S.missao); resultado(); break;
      case 'missao': abrirMissao(el.dataset.m); if (!view.querySelector('.resumo')) rolar(); break;
      case 'plano': plano(); rolar(); break;
      case 'ck': {
        const f = feitas(), mid = el.dataset.m;
        if (f[mid]) delete f[mid]; else f[mid] = new Date().toISOString().slice(0, 10);
        salvar(); plano();
        break;
      }
      case 'resumo': R = null; resumo([el.dataset.r]); break;
      case 'modo': guardarPosicao(); R.modo = el.dataset.v; R.so = null; if (R.modo === 'testar') { R.teste = { ...((store.andamento || {})[chaveTeste()] || {}) }; if (Object.keys(R.teste).length) R.foco = '.lacuna'; } resumo(R.ids, null, R.modo === 'ler'); if (R.modo === 'testar') rolar(); break;
      case 'testar-erros': { const rv = [...paraRevisar()]; R.modo = 'testar'; R.so = rv.length ? rv : (Object.keys(R.teste).filter(k => R.teste[k] === 'nao')); R.so.forEach(k => { delete R.teste[k]; }); resumo(R.ids, null, false); rolar(); break; }
      case 'continuar-teste': R.modo = 'testar'; R.so = null; R.teste = { ...((store.andamento || {})[chaveTeste()] || {}) }; R.foco = '.lacuna'; resumo(R.ids, null, false); break;
      case 'revisar': R = null; resumo(el.dataset.r.split('+')); { const rv = [...paraRevisar()]; R.modo = 'testar'; R.so = rv; rv.forEach(k => { delete R.teste[k]; }); R.foco = '.lacuna'; resumo(R.ids, null, false); } break;
      case 'desfazer': R.teste[el.dataset.k] = 'aberto'; salvarAndamento(); resumo(R.ids, null, true); break;
      case 'ir': { const alvo = document.getElementById(el.dataset.id); if (alvo) alvo.scrollIntoView({ block: 'center' }); break; }
      case 'revelar': R.teste[el.dataset.k] = 'aberto'; R.foco = '.avaliar'; resumo(R.ids, null, true); break;
      case 'lembrei': marcarTeste(el.dataset.k, el.dataset.v); break;
      case 'resumo-questoes': {
        const missao = R.missao, mm = missao && PLANO.find(x => x.id === missao);
        const ids = R.ids.flatMap(idsDoResumo).concat(mm ? bancaDaMissao(mm) : []);
        const nome = R.ids.map(id => RESID[id].titulo || RESID[id].tema).join(' + ');
        iniciar('pratica', nome, ids); S.missao = missao; R = null; rolar();
        break;
      }
      case 'titulos': titulos(); rolar(); break;
      case 'ouvir': ouvir(el); break;
      case 'resultado': resultado(); break;
      case 'rever': S.i = Number(el.dataset.i); questao(); rolar(); break;
      case 'refazer': iniciar('pratica', 'Refazer erradas', S.ids.filter(id => S.resp[id] !== BYID[id].correta)); rolar(); break;
      case 'inicio': inicio(); rolar(); break;
      case 'anotacoes': anotacoes(); rolar(); break;
      case 'puladas': { const ids = S.ids.filter(id => S.resp[id] == null), t = S.titulo; iniciar('pratica', t + ' · as que pulei', ids); rolar(); break; }
      case 'banca-escolha': bancaEscolha(el.dataset.p); rolar(); break;
      case 'banca': { const pid = el.dataset.p, so = el.dataset.so || null, ids = idsBanca(pid, so); if (ids.length) { iniciar('pratica', PROVAS[pid].titulo + (so ? ' · ' + so : ''), ids); rolar(); } break; }
      case 'refazer-uma': iniciar('pratica', 'Refazer uma questão', [el.dataset.id]); rolar(); break;
      case 'retomar': { const g = sessaoGuardada(); if (g) { S = g; R = null; F = null; questao(); rolar(); } else inicio(); break; }
      case 'descartar-sessao': { const g = sessaoGuardada(); if (g && g.modo === 'simulado') esquecerSimulado(); esquecerSessao(); inicio(); break; }
      case 'baixar-progresso': baixarProgresso(); break;
      case 'outra-materia': { const alvo = document.getElementById('t-temas'); if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'ir-materia': { const alvo = document.getElementById(el.dataset.alvo); if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'zerar': confirmarZerar = true; inicio(); break;
      case 'zerar-nao': confirmarZerar = false; inicio(); break;
      case 'zerar-sim': store = { res: {} }; salvar(); confirmarZerar = false; inicio(); break;
    }
  });

  // Mantém a sessão aberta quando a página é atualizada enquanto ela estuda.
  function start(data) {
    if (data && data.S && data.S.ids && data.S.ids.every(id => BYID[id])) {
      S = data.S;
      if (S.modo === 'pratica-fim' || (S.modo === 'simulado' && S.entregue && data.tela === 'resultado')) resultado(); else questao();
    } else inicio();
  }
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S, tela: view.querySelector('.placar') ? 'resultado' : 'questao' }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
