gadinha": "D é a mais parecida: tem direção única em cada esfera, mas fala em Estados (a lei diz municípios) e em hierarquização dos profissionais (a lei diz da rede de serviços).", "porque": {"B": "A lei fala em direção única em cada esfera, não compartilhada. E a ênfase é nos municípios, não nos Estados.", "C": "A direção é única em cada esfera, não só da União. E a lei fala em descentralizar para os municípios, não em centralizar.", "D": "A ênfase da lei é nos municípios, não nos Estados. E a hierarquização é da rede de serviços, não dos profissionais.", "E": "A ênfase da lei é nos municípios, não em consórcios. E a regionalização não é dispensada, ela está no inciso IX."}}, {"id": "sus-06", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com os arts. 2º a 4º da Lei nº 8.080/1990, assinale a alternativa correta.", "alternativas": ["O dever do Estado de garantir a saúde exclui o das pessoas, da família, das empresas e da sociedade.", "A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "Integram o SUS somente os órgãos da Administração direta federal, estadual e municipal, excluídas as fundações mantidas pelo Poder Público.", "As instituições públicas de produção de medicamentos, sangue e hemoderivados não estão incluídas no SUS, por se tratarem de atividade industrial.", "Para a lei, os níveis de saúde dependem apenas da oferta de serviços médicos, não sendo considerados fatores como moradia, renda e educação."], "correta": 1, "explicacao": "O art. 4º, § 2º, prevê a participação da iniciativa privada em caráter complementar. O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade (art. 2º, § 2º). O SUS inclui a Administração indireta, as fundações e as instituições públicas de produção de insumos (art. 4º). O art. 3º lista moradia, renda, educação e outros determinantes.", "fundamento": "Art. 4º, § 2º A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "fonte": "Lei 8.080/1990, art. 2º, § 2º; art. 3º; art. 4º, caput e §§ 1º e 2º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando a questão falar da iniciativa privada no SUS, a palavra-chave é “complementar”: ela pode participar, em caráter complementar.", "passos": [{"t": "A B copia o art. 4º, § 2º: a iniciativa privada pode participar do SUS em caráter complementar."}, {"t": "A A erra: o dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade (art. 2º, § 2º)."}, {"t": "C e D erram: o SUS inclui a Administração indireta, as fundações e as instituições públicas de produção de insumos (art. 4º). E erra: o art. 3º lista moradia, renda, educação e outros determinantes."}], "resp": "Alternativa B", "pegadinha": "C soa técnica e convincente, mas está errada: o SUS não é só a Administração direta. Fundações e Administração indireta também fazem parte.", "porque": {"A": "O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade.", "C": "O SUS não é só a Administração direta. A Administração indireta e as fundações também fazem parte.", "D": "As instituições públicas de produção de insumos fazem parte do SUS, pelo art. 4º.", "E": "O art. 3º lista moradia, renda, educação e outros fatores como determinantes da saúde. Não é só oferta de serviços médicos."}}, {"id": "sus-07", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O art. 7º da Lei nº 8.080/1990 estabelece os princípios que as ações e serviços públicos de saúde, e os serviços privados contratados ou conveniados que integram o SUS, devem obedecer. Assinale a alternativa INCORRETA em relação a esses princípios.", "alternativas": ["Conjugação dos recursos financeiros, tecnológicos, materiais e humanos exclusivamente da União na prestação de serviços de assistência à saúde da população.", "Utilização da epidemiologia para o estabelecimento de prioridades, a alocação de recursos e a orientação programática.", "Organização dos serviços públicos de modo a evitar duplicidade de meios para fins idênticos.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "Atenção humanizada."], "correta": 0, "explicacao": "O inciso XI fala em conjugação dos recursos da União, dos Estados, do Distrito Federal e dos Municípios, não apenas da União. As demais alternativas reproduzem os incisos VII, XIII, III e XVI (este incluído pela Lei nº 15.126/2025).", "fundamento": "XI - conjugação dos recursos financeiros, tecnológicos, materiais e humanos da União, dos Estados, do Distrito Federal e dos Municípios na prestação de serviços de assistência à saúde da população;", "fonte": "Lei 8.080/1990, art. 7º, III, VII, XI, XIII e XVI", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm", "regra": "Quando um princípio do art. 7º falar em recursos “exclusivamente da União”, está errado: a lei fala em conjugar recursos da União, dos Estados, do Distrito Federal e dos Municípios.", "passos": [{"t": "A questão pede a INCORRETA entre os princípios do art. 7º. A A traz “exclusivamente da União”."}, {"t": "O inciso XI fala em conjugação dos recursos da União, dos Estados, do Distrito Federal e dos Municípios."}, {"t": "A lei junta todos; a alternativa deixa só a União. Por isso a A é a incorreta. As outras copiam os incisos VII, XIII, III e XVI."}], "resp": "Alternativa A", "pegadinha": "E (“Atenção humanizada”) parece curta demais para ser princípio, mas está na lei: é o inciso XVI, incluído pela Lei nº 15.126/2025.", "porque": {"B": "Essa está na lei, é o inciso VII. A questão pede a INCORRETA, e a errada é a que fala em “exclusivamente da União”.", "C": "Essa está na lei, é o inciso XIII. A questão pede a INCORRETA, e a errada é a que fala em “exclusivamente da União”.", "D": "Essa está na lei, é o inciso III. A questão pede a INCORRETA, e a errada é a que fala em “exclusivamente da União”.", "E": "Parece curta demais, mas “atenção humanizada” é princípio de verdade, o inciso XVI. A questão pede a INCORRETA."}}, {"id": "hum-01", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Segundo o documento HumanizaSUS: documento base para gestores e trabalhadores do SUS (Ministério da Saúde, 2008), a Política Nacional de Humanização (PNH) possui três princípios, a partir dos quais se desdobra como política pública de saúde. Esses princípios são:", "alternativas": ["acolhimento; clínica ampliada; co-gestão.", "universalidade; integralidade; equidade.", "transversalidade; indissociabilidade entre atenção e gestão; protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "visita aberta; direito à acompanhante; acolhimento com classificação de risco.", "descentralização; regionalização; hierarquização."], "correta": 2, "explicacao": "Os três princípios da PNH são transversalidade, indissociabilidade entre atenção e gestão e protagonismo/co-responsabilidade/autonomia. Acolhimento, clínica ampliada e co-gestão são diretrizes; visita aberta e classificação de risco são dispositivos. As alternativas B e E trazem princípios e diretrizes do SUS, não da PNH.", "fundamento": "O documento afirma que a PNH, como movimento de mudança dos modelos de atenção e gestão, tem três princípios: transversalidade; indissociabilidade entre atenção e gestão; e protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios da PNH”, p. 23-24", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/", "regra": "Quando pedirem os PRINCÍPIOS da PNH, são três: transversalidade, indissociabilidade entre atenção e gestão, e protagonismo, co-responsabilidade e autonomia.", "passos": [{"t": "A palavra que decide é “princípios”. A PNH tem princípios, diretrizes e dispositivos, e a banca mistura os três."}, {"t": "Os três princípios são: transversalidade; indissociabilidade entre atenção e gestão; protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos."}, {"t": "Só a alternativa C traz exatamente esses três."}], "resp": "Alternativa C", "pegadinha": "A traz diretrizes (acolhimento, clínica ampliada, co-gestão) e D traz dispositivos. B e E são princípios e diretrizes do SUS, não da PNH.", "porque": {"A": "Acolhimento, clínica ampliada e co-gestão são diretrizes da PNH, não princípios.", "B": "Universalidade, integralidade e equidade vêm do SUS, não da PNH. Os princípios da PNH são outros três.", "D": "Visita aberta, direito à acompanhante e acolhimento com classificação de risco são dispositivos da PNH, não princípios.", "E": "Descentralização, regionalização e hierarquização vêm do SUS, não da PNH. Os princípios da PNH são outros três."}}, {"id": "hum-02", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "A PNH se estrutura a partir de princípios, método, diretrizes e dispositivos. Considere as afirmações abaixo, de acordo com o HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nQuais estão corretas?", "itens": ["I – Acolhimento e clínica ampliada estão entre as diretrizes da PNH.", "II – O Grupo de Trabalho de Humanização (GTH) e a Visita Aberta e Direito à Acompanhante estão entre os dispositivos da PNH.", "III – A transversalidade é uma das diretrizes da PNH, ao lado da co-gestão e da defesa dos direitos do usuário."], "alternativas": ["Apenas I e II.", "Apenas I.", "Apenas III.", "Apenas II e III.", "I, II e III."], "correta": 0, "explicacao": "I e II estão de acordo com as listas de diretrizes e de dispositivos do documento. III está errada porque a transversalidade é princípio da PNH, e não diretriz. A pegadinha é misturar os níveis princípio, diretriz e dispositivo.", "fundamento": "O documento lista como diretrizes a clínica ampliada, a co-gestão, o acolhimento, a valorização do trabalho e do trabalhador e a defesa dos direitos do usuário, entre outras. Entre os dispositivos estão o GTH, o colegiado gestor e a visita aberta e direito à acompanhante. A transversalidade aparece como princípio.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios”, “Diretrizes” e “Dispositivos da PNH”, p. 23-27", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/", "regra": "Quando a questão misturar termos da PNH, separe em três caixas: princípio (transversalidade), diretriz (acolhimento, clínica ampliada, co-gestão) e dispositivo (GTH, visita aberta).", "passos": [{"t": "I: acolhimento e clínica ampliada estão na lista de diretrizes. Correta."}, {"t": "II: GTH e visita aberta e direito à acompanhante estão na lista de dispositivos. Correta."}, {"t": "III: transversalidade é princípio, não diretriz. Errada."}], "resp": "Alternativa A", "pegadinha": "A III coloca a transversalidade ao lado de diretrizes verdadeiras (co-gestão e defesa dos direitos do usuário), o que faz parecer certa. Mas transversalidade é princípio.", "porque": {"B": "Essa deixa a II de fora, mas ela está certa. GTH e visita aberta e direito à acompanhante são dispositivos da PNH.", "C": "Essa aceita só a III, que é a errada, porque transversalidade é princípio, não diretriz. E deixa de fora a I e a II, que estão certas.", "D": "Essa diz que a III é verdadeira, mas transversalidade é princípio, não diretriz. E deixa de fora a I, que está certa.", "E": "Essa diz que a III é verdadeira, mas transversalidade é princípio da PNH, não diretriz."}}, {"id": "hum-03", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "O HumanizaSUS: documento base para gestores e trabalhadores do SUS afirma que a PNH caminha no sentido da inclusão, nos processos de produção de saúde, dos diferentes agentes implicados, e fala em um “método de tríplice inclusão”. Essa tríplice inclusão compreende a inclusão", "alternativas": ["dos usuários, dos familiares e dos acompanhantes nas decisões clínicas.", "da União, dos Estados e dos Municípios no financiamento das ações de humanização.", "da atenção básica, da média complexidade e da alta complexidade em uma rede única.", "dos diferentes sujeitos (gestores, trabalhadores e usuários), dos analisadores sociais e do coletivo.", "dos trabalhadores, dos conselhos de saúde e das ouvidorias no planejamento hospitalar."], "correta": 3, "explicacao": "O método da PNH inclui os diferentes sujeitos (gestores, trabalhadores e usuários), os analisadores sociais (fenômenos que desestabilizam os modelos tradicionais de atenção e gestão) e o coletivo. As outras alternativas trocam essa tríade por divisões que soam plausíveis, mas não estão no documento.", "fundamento": "O método de tríplice inclusão compreende: incluir os diferentes sujeitos (gestores, trabalhadores e usuários), com rodas; incluir os analisadores sociais, com análise coletiva dos conflitos; e incluir o coletivo, como movimento social organizado ou experiência grupal, com fomento das redes.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “O método da PNH”, p. 24-25", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/", "regra": "Quando falarem em “tríplice inclusão” da PNH, lembre: incluir os sujeitos (gestores, trabalhadores e usuários), os analisadores sociais e o coletivo.", "passos": [{"t": "A expressão que decide é “método de tríplice inclusão”."}, {"t": "O documento lista três inclusões: os diferentes sujeitos (gestores, trabalhadores e usuários), os analisadores sociais e o coletivo."}, {"t": "Analisadores sociais são os fenômenos que desestabilizam os modelos tradicionais de atenção e gestão. Só a alternativa D traz essa tríade."}], "resp": "Alternativa D", "pegadinha": "As outras alternativas trazem trios que soam plausíveis, como União, Estados e Municípios, mas não estão no documento.", "porque": {"A": "Usuários, familiares e acompanhantes não são a tríade do documento. A tríplice inclusão é dos sujeitos, dos analisadores sociais e do coletivo.", "B": "União, Estados e Municípios soam plausíveis, mas não estão no documento. A tríplice inclusão é dos sujeitos, dos analisadores sociais e do coletivo.", "C": "Atenção básica, média e alta complexidade não são a tríade do documento. A tríplice inclusão é dos sujeitos, dos analisadores sociais e do coletivo.", "E": "Trabalhadores, conselhos e ouvidorias não são a tríade do documento. A tríplice inclusão é dos sujeitos, dos analisadores sociais e do coletivo."}}, {"id": "hum-04", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o glossário do HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Na classificação de risco, o critério de priorização da atenção passa a ser o agravo à saúde e/ou o grau de sofrimento, e não mais a ordem de chegada.", "( ) O acolhimento restringe-se à recepção do usuário na porta de entrada, encerrando-se a responsabilização da equipe no momento em que ele é encaminhado ao setor de atendimento.", "( ) A ambiência refere-se exclusivamente à estrutura física do serviço, como luminosidade, ruídos e temperatura, sem relação com a forma de acolher e de interagir.", "( ) Entre as propostas da clínica ampliada está o compromisso com o sujeito, e não só com a doença."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – F – V", "V – F – F – V"], "correta": 4, "explicacao": "O acolhimento implica responsabilização do trabalhador/equipe pelo usuário desde a chegada até a saída. Na ambiência, o documento destaca como muito importante o componente afetivo, expresso no acolhimento e nas interações. A primeira e a quarta afirmações correspondem ao glossário.", "fundamento": "Glossário: a classificação de risco prioriza pelo agravo e/ou grau de sofrimento, não pela ordem de chegada. O acolhimento responsabiliza a equipe pelo usuário da chegada à saída. A ambiência inclui o componente afetivo. A clínica ampliada propõe compromisso com o sujeito e não só com a doença.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, Glossário (“Acolhimento”, “Ambiência”, “Classificação de Risco”, “Clínica ampliada”), p. 51-56", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/", "regra": "Quando uma afirmação da PNH usar “restringe-se” ou “exclusivamente”, desconfie: acolhimento e ambiência são conceitos amplos.", "passos": [{"t": "1º: na classificação de risco, a prioridade é o agravo e/ou o grau de sofrimento, não a ordem de chegada. Verdadeiro."}, {"t": "2º: o acolhimento responsabiliza a equipe pelo usuário da chegada até a saída, não só na porta. Falso."}, {"t": "3º: a ambiência inclui o componente afetivo, o jeito de acolher e de interagir, não só a estrutura física. Falso."}, {"t": "4º: a clínica ampliada propõe compromisso com o sujeito, e não só com a doença. Verdadeiro."}], "resp": "Alternativa E (V, F, F, V)", "pegadinha": "O 3º item cita coisas reais da ambiência (luz, ruído, temperatura), por isso parece certo. O erro está no “exclusivamente”, que tira o componente afetivo.", "porque": {"A": "Essa diz que a 2ª é verdadeira, mas o acolhimento vai da chegada até a saída. E marca a 4ª como falsa, mas ela está certa.", "B": "Essa marca a 1ª como falsa, mas ela está certa. E marca a 3ª como verdadeira, mas a ambiência inclui o componente afetivo.", "C": "Essa diz que a 3ª é verdadeira, mas a ambiência inclui o componente afetivo. E marca a 4ª como falsa, mas ela está certa.", "D": "Essa marca a 1ª como falsa e a 2ª como verdadeira. Mas a classificação de risco prioriza o agravo, e o acolhimento vai da chegada até a saída."}}, {"id": "dir-01", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Portaria de Consolidação GM/MS nº 1/2017, que garante à pessoa atendimento humanizado e acolhedor.\n\nÉ garantida a identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o ________, independente do registro civil. É garantido também o direito a visita diária não inferior a ________ horas, preferencialmente ________ em todas as unidades de internação, ressalvadas as situações técnicas não indicadas.", "alternativas": ["nome de preferência – uma – restrita", "nome social – duas – aberta", "nome social – quatro – restrita", "apelido – duas – restrita", "número do prontuário – uma – aberta"], "correta": 1, "explicacao": "A norma prevê campo para o nome social em todo documento e visita diária não inferior a duas horas, preferencialmente aberta. A mesma norma proíbe identificar o usuário por número, nome ou código da doença.", "fundamento": "I - identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o nome social [...]; VII - o direito a visita diária não inferior a duas horas, preferencialmente aberta em todas as unidades de internação, ressalvadas as situações técnicas não indicadas;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 5º, parágrafo único, I e VII (origem: Portaria MS/GM nº 1.820/2009, art. 4º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html", "regra": "Quando a questão falar em identificação do usuário, lembre do nome social em todo documento. Quando falar em visita, lembre: no mínimo duas horas por dia, de preferência aberta.", "passos": [{"t": "São três lacunas: o campo do documento, as horas de visita e o tipo de visita."}, {"t": "A Portaria garante, em todo documento do usuário, um campo para o nome social, independente do registro civil."}, {"t": "A visita diária é de no mínimo duas horas, preferencialmente aberta em todas as unidades de internação."}, {"t": "Só B tem nome social, duas e aberta."}], "resp": "Alternativa B", "pegadinha": "C acerta o nome social, mas erra as horas (quatro) e o tipo de visita (restrita). E é armadilha: a mesma norma proíbe identificar o usuário por número, nome ou código da doença.", "porque": {"A": "A norma fala em nome social, não “nome de preferência”. E a visita é de no mínimo duas horas, preferencialmente aberta.", "C": "Acerta o nome social, mas a visita é de no mínimo duas horas, não quatro, e preferencialmente aberta, não restrita.", "D": "O campo é para o nome social, não apelido. E a visita é preferencialmente aberta, não restrita.", "E": "A norma proíbe identificar o usuário por número. O campo é para o nome social, e a visita é de no mínimo duas horas, não uma."}}, {"id": "dir-02", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "A Portaria de Consolidação GM/MS nº 1/2017 estabelece que toda pessoa tem responsabilidade para que seu tratamento e recuperação sejam adequados e sem interrupção, e lista o que as pessoas deverão fazer para isso. Assinale a alternativa que NÃO corresponde a um desses deveres.", "alternativas": ["Prestar informações apropriadas nos atendimentos, nas consultas e nas internações sobre queixas, enfermidades e hospitalizações anteriores, história de uso de medicamentos, drogas e reações alérgicas.", "Expressar se compreendeu as informações e orientações recebidas e, caso ainda tenha dúvidas, solicitar esclarecimento sobre elas.", "Ter em mão seus documentos e, quando solicitados, os resultados de exames que estejam em seu poder.", "Submeter-se a todos os procedimentos, exames e tratamentos recomendados, uma vez que a norma não admite a recusa do usuário.", "Comunicar à autoridade sanitária local a ocorrência de caso de doença transmissível, quando a situação requerer o isolamento ou quarentena da pessoa ou quando a doença constar da relação do Ministério da Saúde."], "correta": 3, "explicacao": "A norma não proíbe a recusa. O dever é assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados, e a mesma portaria garante o consentimento livre e revogável. As demais alternativas reproduzem os incisos I, II, VIII e XIII.", "fundamento": "V - assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados e pelo descumprimento das orientações do profissional ou da equipe de saúde;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 7º, parágrafo único, I, II, V, VIII e XIII (origem: Portaria MS/GM nº 1.820/2009, art. 6º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html", "regra": "Quando a questão disser que o usuário é obrigado a aceitar todo tratamento, desconfie. Ele pode recusar, mas assume a responsabilidade pela recusa.", "passos": [{"t": "A questão pede o que NÃO é dever. Procure a alternativa que contradiz a norma."}, {"t": "D diz que a norma não admite recusa. Mas o dever é outro: assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados."}, {"t": "A mesma portaria garante o consentimento livre e revogável. Então recusar é possível, e D é a que não corresponde."}, {"t": "A, B, C e E reproduzem os incisos I, II, VIII e XIII, que são deveres de fato."}], "resp": "Alternativa D", "pegadinha": "E parece estranha por pedir ao usuário que avise a autoridade sanitária sobre doença transmissível. Mas é um dever previsto na norma, então não é a resposta.", "porque": {"A": "Esse é um dever de verdade, o inciso I. A questão pede o que NÃO é dever.", "B": "Esse é um dever de verdade, o inciso II. A questão pede o que NÃO é dever.", "C": "Esse é um dever de verdade, o inciso VIII. A questão pede o que NÃO é dever.", "E": "Parece estranho, mas avisar a autoridade sanitária sobre doença transmissível é dever previsto, o inciso XIII. A questão pede o que NÃO é dever."}}, {"id": "dir-03", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta dos Direitos dos Usuários da Saúde (Ministério da Saúde, 3ª edição, 2011).\n\nQuais estão corretas?", "itens": ["I – “Todo cidadão tem direito ao acesso ordenado e organizado aos sistemas de saúde” é um dos seis princípios basilares da Carta.", "II – A Carta foi aprovada pela Agência Nacional de Saúde Suplementar (ANS), em 2009, e por isso vale apenas para os planos de saúde.", "III – A Carta é apresentada como ferramenta para que o cidadão conheça seus direitos e deveres no momento de procurar atendimento de saúde, tanto público como privado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "Apenas I e III."], "correta": 4, "explicacao": "I e III estão na apresentação da Carta. II está errada: a Carta foi aprovada pelo Conselho Nacional de Saúde (CNS), na 198ª Reunião Ordinária, em 17 de junho de 2009, e vale tanto para o atendimento público quanto para o privado.", "fundamento": "A apresentação informa que a Carta foi aprovada pelo Conselho Nacional de Saúde em 17/06/2009. Ela se apoia em seis princípios basilares, o primeiro deles o acesso ordenado e organizado. Ela serve ao cidadão no atendimento público e no privado.", "fonte": "Carta dos Direitos dos Usuários da Saúde, MS/CNS, 3ª ed., 2011, Apresentação, p. 3-4", "url": "https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf", "regra": "Quando a questão falar da Carta dos Direitos dos Usuários da Saúde, lembre: quem aprovou foi o Conselho Nacional de Saúde (CNS), e ela vale para o atendimento público e o privado.", "passos": [{"t": "I está correta: o acesso ordenado e organizado é o primeiro dos seis princípios basilares da Carta."}, {"t": "II está errada: a Carta foi aprovada pelo Conselho Nacional de Saúde (CNS), em 17 de junho de 2009, e não pela ANS. E não vale só para planos de saúde."}, {"t": "III está correta: a apresentação diz que a Carta serve ao cidadão no atendimento público e no privado."}], "resp": "Alternativa E", "pegadinha": "C (Apenas I e II) pega quem confia na II. A Carta foi aprovada pelo CNS, não pela ANS, e vale também para o atendimento público.", "porque": {"A": "Essa deixa a III de fora, mas ela está certa. A Carta serve ao cidadão no atendimento público e no privado.", "B": "Essa aceita só a II, que é a errada. A Carta foi aprovada pelo Conselho Nacional de Saúde, não pela ANS, e vale também no atendimento público.", "C": "Essa diz que a II é verdadeira, mas a Carta foi aprovada pelo CNS, não pela ANS. E a III, que ficou de fora, está certa.", "D": "Essa diz que a II é verdadeira, mas a Carta foi aprovada pelo CNS, não pela ANS. E a I, que ficou de fora, está certa."}}, {"id": "dir-04", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Segundo a Portaria de Consolidação GM/MS nº 1/2017, toda pessoa deve ter seus valores, cultura e direitos respeitados na relação com os serviços de saúde. Assinale a alternativa correta a respeito das garantias previstas.", "alternativas": ["O sigilo e a confidencialidade das informações pessoais cessam com a morte do paciente.", "A segunda opinião sobre o estado de saúde só pode ser buscada antes do início do tratamento.", "O acesso ao conteúdo do prontuário é exclusivo da equipe assistencial, sendo vedado o fornecimento de cópia ao usuário.", "O consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais.", "O exame de saúde pré-admissional pode ser realizado sem conhecimento do trabalhador sempre que exigido pelo empregador."], "correta": 3, "explicacao": "A alternativa D reproduz o inciso V do art. 6º. O sigilo vale mesmo após a morte, salvo risco à saúde pública. A segunda opinião pode ser buscada em qualquer fase do tratamento. O usuário tem acesso ao prontuário e direito a cópia em caso de encaminhamento ou mudança de domicílio. Exame sem conhecimento e consentimento só é admitido em caso de risco coletivo.", "fundamento": "V - o consentimento livre, voluntário e esclarecido, a quaisquer procedimentos diagnósticos, preventivos ou terapêuticos, salvo nos casos que acarretem risco à saúde pública, considerando que o consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 6º, II, III, V, VI e IX (origem: Portaria MS/GM nº 1.820/2009, art. 5º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html", "regra": "Quando a questão falar em consentimento do usuário, lembre que ele é livre e pode ser revogado a qualquer instante, sem punição.", "passos": [{"t": "A questão pede a alternativa correta sobre as garantias do usuário."}, {"t": "A Portaria diz que o consentimento dado antes pode ser revogado a qualquer instante, por decisão livre e esclarecida, sem sanções morais, financeiras ou legais."}, {"t": "D repete esse texto, que é o inciso V do art. 6º."}, {"t": "As outras cortam direitos. O sigilo continua após a morte (salvo risco à saúde pública), e a segunda opinião pode ser buscada em qualquer fase do tratamento."}], "resp": "Alternativa D", "pegadinha": "C parece razoável, mas o usuário tem acesso ao prontuário e direito a cópia em caso de encaminhamento ou mudança de domicílio. E também erra: exame sem conhecimento e consentimento só é admitido em caso de risco coletivo.", "porque": {"A": "O sigilo não acaba com a morte. Ele continua depois dela, salvo risco à saúde pública.", "B": "A segunda opinião pode ser buscada em qualquer fase do tratamento, não só antes de começar.", "C": "O prontuário não é só da equipe. O usuário tem acesso a ele e direito a cópia em caso de encaminhamento ou mudança de domicílio.", "E": "Exame sem conhecimento e consentimento só é admitido em caso de risco coletivo, não porque o empregador exigiu."}}, {"id": "dir-05", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta de direitos e deveres do paciente do Hospital de Clínicas de Porto Alegre (HCPA).\n\nQuais estão corretas?", "itens": ["I – É dever do paciente ter em mãos um documento oficial com foto sempre que vier ao hospital.", "II – É direito do paciente definir se seus familiares e acompanhantes devem ser informados sobre seu estado de saúde, podendo autorizar um representante de sua livre escolha para ter acesso a essas informações ou decidir em seu nome, caso necessite.", "III – O adolescente deve ser atendido sempre na presença dos pais ou responsável, ainda que deseje ser atendido sem acompanhante.", "IV – É dever do paciente respeitar a proibição do fumo e do consumo de bebidas alcoólicas e/ou do uso de drogas ilícitas nas dependências do hospital e exigir que seus acompanhantes também a respeitem."], "alternativas": ["Apenas I e II.", "Apenas III e IV.", "Apenas I, II e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 2, "explicacao": "I, II e IV estão na Carta do HCPA. III está errada: o adolescente, se desejar, pode ser atendido sem acompanhante, com garantia de individualidade e confidencialidade. A participação e o consentimento dos pais ou responsável só são exigidos em situações de risco ou em procedimentos de alguma complexidade.", "fundamento": "A Carta do HCPA garante ao adolescente, se desejar, atendimento sem acompanhante, com individualidade e confidencialidade, salvo quando o sigilo possa acarretar dano. Em situações de risco ou procedimentos de alguma complexidade, exige participação e consentimento dos pais ou responsável.", "fonte": "Carta de direitos e deveres do paciente do HCPA, seções “São direitos do paciente” e “São deveres do paciente/família”", "url": "https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf", "regra": "Quando a questão disser que o adolescente deve ser atendido “sempre” com os pais, desconfie. Se ele quiser, pode ser atendido sozinho, com confidencialidade.", "passos": [{"t": "I, II e IV estão na Carta do HCPA: documento oficial com foto, escolha de quem recebe as informações e proibição de fumo, álcool e drogas."}, {"t": "III está errada. O adolescente, se desejar, pode ser atendido sem acompanhante, com individualidade e confidencialidade."}, {"t": "Os pais ou responsável só precisam participar e consentir em situações de risco ou em procedimentos de alguma complexidade."}], "resp": "Alternativa C", "pegadinha": "E (todas) pega quem acha natural os pais estarem sempre junto. A III está errada porque o adolescente pode escolher ser atendido sem acompanhante.", "porque": {"A": "Essa deixa a IV de fora, mas ela está certa. Respeitar a proibição de fumo, álcool e drogas é dever do paciente na Carta.", "B": "Essa aceita a III, mas o adolescente pode ser atendido sozinho se quiser. E deixa de fora a I e a II, que estão certas.", "D": "Essa aceita a III, mas o adolescente pode ser atendido sem acompanhante se quiser. E deixa de fora a I, que está certa.", "E": "Essa aceita a III, mas o adolescente, se quiser, pode ser atendido sem acompanhante, com confidencialidade."}}, {"id": "eca-01", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "De acordo com o Estatuto da Criança e do Adolescente (Lei nº 8.069/1990), assinale a alternativa correta quanto à definição de criança e de adolescente.", "alternativas": ["Considera-se criança a pessoa até doze anos de idade completos, e adolescente aquela entre doze e dezoito anos de idade.", "Considera-se criança a pessoa até quatorze anos de idade incompletos, e adolescente aquela entre quatorze e dezoito anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e quatro anos de idade.", "Considera-se adolescente a pessoa entre doze e vinte e um anos de idade, aplicando-se o Estatuto integralmente a toda essa faixa etária."], "correta": 2, "explicacao": "Criança é a pessoa até doze anos incompletos; adolescente, entre doze e dezoito; e, excepcionalmente, o ECA se aplica dos dezoito aos vinte e um anos. As pegadinhas trocam “incompletos” por “completos”, 12 por 14 e 21 por 24.", "fundamento": "Art. 2º Considera-se criança, para os efeitos desta Lei, a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade. Parágrafo único. Nos casos expressos em lei, aplica-se excepcionalmente este Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "fonte": "Lei 8.069/1990, art. 2º, caput e parágrafo único", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm", "regra": "Quando a questão perguntar idade no ECA, lembre: criança até 12 anos incompletos, adolescente de 12 a 18, e excepcionalmente o ECA vale de 18 a 21.", "passos": [{"t": "Art. 2º: criança é a pessoa até doze anos incompletos. Adolescente é quem tem entre doze e dezoito anos."}, {"t": "Parágrafo único: nos casos expressos em lei, o ECA se aplica excepcionalmente dos dezoito aos vinte e um anos."}, {"t": "Só C tem as três informações certas: 12 incompletos, 12 a 18 e 18 a 21."}], "resp": "Alternativa C", "pegadinha": "D é igual à C, mas troca 21 por 24. A também engana, porque diz “completos” no lugar de “incompletos”.", "porque": {"A": "Aqui está “completos”, mas a lei diz criança até doze anos incompletos.", "B": "A idade que separa criança de adolescente é doze anos, não quatorze.", "D": "Essa é igual à certa, mas troca 21 por 24. A aplicação excepcional do ECA vai dos dezoito aos vinte e um anos.", "E": "Adolescente é quem tem entre doze e dezoito anos. Dos dezoito aos vinte e um, o ECA só se aplica excepcionalmente, nos casos expressos em lei."}}, {"id": "eca-02", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Considere o art. 12 do ECA, na redação atual, que inclui o parágrafo único acrescentado pela Lei nº 14.950/2024: “Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo ______ de ______, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de ______ à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["integral – um dos pais ou responsável – visitação", "parcial – ambos os pais – visitação", "integral – ambos os pais ou responsáveis – acompanhamento", "integral – um dos pais ou responsável – acompanhamento", "diurno – um dos pais ou responsável – visitação"], "correta": 0, "explicacao": "O caput garante a permanência em tempo integral de um dos pais ou responsável na internação de criança ou adolescente; o parágrafo único, incluído pela Lei 14.950/2024, garante à criança e ao adolescente o direito de visitação ao pai ou à mãe internados. A pegadinha troca “um dos pais” por “ambos” e “visitação” por “acompanhamento”.", "fundamento": "Art. 12. Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo integral de um dos pais ou responsável, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras. (Incluído pela Lei nº 14.950, de 2024)", "fonte": "Lei 8.069/1990, art. 12, caput e parágrafo único (incluído pela Lei 14.950/2024)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm", "regra": "Quando a criança está internada, um dos pais ou responsável pode ficar em tempo integral. Quando é a mãe ou o pai que está internado, a criança tem direito de visitação.", "passos": [{"t": "Lacunas 1 e 2: na internação de criança ou adolescente, o hospital deve permitir a permanência em tempo integral de um dos pais ou responsável."}, {"t": "Lacuna 3: o parágrafo único, incluído pela Lei 14.950/2024, trata do caso inverso. Quando a mãe ou o pai está internado, a criança e o adolescente têm direito de visitação."}, {"t": "Só A tem integral, um dos pais ou responsável e visitação."}], "resp": "Alternativa A", "pegadinha": "D troca visitação por acompanhamento, e C ainda troca “um dos pais” por “ambos”. A lei fala em um dos pais e em visitação.", "porque": {"B": "A lei fala em tempo integral, não parcial, e em um dos pais ou responsável, não ambos.", "C": "A lei fala em um dos pais ou responsável, não ambos. E quando a mãe ou o pai está internado, a criança tem direito de visitação.", "D": "Acerta as duas primeiras, mas troca visitação por acompanhamento. Quando a mãe ou o pai está internado, a criança tem direito de visitação.", "E": "A permanência é em tempo integral, não só no período diurno."}}, {"id": "eca-03", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Um funcionário da recepção de um hospital percebe sinais de que uma criança atendida pode estar sofrendo maus-tratos. Sobre o que dispõe o ECA a respeito dessas situações, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais.", "II – A comunicação ao Conselho Tutelar só é obrigatória quando os maus-tratos estiverem confirmados, não bastando a mera suspeita.", "III – Constitui infração administrativa, punida com multa, deixar o responsável por estabelecimento de atenção à saúde de comunicar à autoridade competente os casos de que tenha conhecimento envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "O art. 13 manda comunicar ao Conselho Tutelar tanto a suspeita quanto a confirmação, por isso a II está errada. A III reproduz o art. 245, que está no capítulo das infrações administrativas e prevê multa de três a vinte salários de referência.", "fundamento": "Art. 13. Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais. Art. 245. Deixar o médico, professor ou responsável por estabelecimento de atenção à saúde [...] de comunicar à autoridade competente os casos de que tenha conhecimento, envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente: Pena - multa de três a vinte salários de referência [...].", "fonte": "Lei 8.069/1990, art. 13, caput, e art. 245", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm", "regra": "Quando houver suspeita de maus-tratos contra criança ou adolescente, a comunicação ao Conselho Tutelar é obrigatória. Não precisa esperar a confirmação.", "passos": [{"t": "I está correta: pelo art. 13, a suspeita ou a confirmação de maus-tratos é comunicada obrigatoriamente ao Conselho Tutelar."}, {"t": "II está errada: diz que só a confirmação obriga, mas o art. 13 inclui a suspeita."}, {"t": "III está correta: pelo art. 245, o responsável por estabelecimento de saúde que não comunica comete infração administrativa. A multa é de três a vinte salários de referência."}], "resp": "Alternativa D", "pegadinha": "E (todas) pega quem acha razoável esperar a certeza antes de comunicar. Mas a lei manda comunicar já na suspeita, então a II está errada.", "porque": {"A": "Essa deixa a III de fora, mas ela está certa. Deixar de comunicar é infração administrativa punida com multa (art. 245).", "B": "Essa aceita só a II, que é a errada. A comunicação é obrigatória já na suspeita, não só na confirmação.", "C": "Essa diz que a II é verdadeira, mas a lei manda comunicar já na suspeita. E deixa de fora a III, que está certa.", "E": "Essa diz que a II é verdadeira, mas a lei manda comunicar já na suspeita, sem esperar a confirmação."}}, {"id": "eca-04", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre alterações recentes do Estatuto da Criança e do Adolescente. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A Lei nº 14.950/2024 garantiu à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.", "( ) A Lei nº 14.987/2024 estendeu o atendimento médico e psicossocial às crianças e aos adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime semiaberto.", "( ) A Lei nº 15.243/2025 incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas, e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "( ) Segundo a Lei nº 15.243/2025, a assistência à criança e ao adolescente dependentes químicos cabe exclusivamente à família, restando ao poder público apenas promover campanhas de prevenção do uso de drogas ilícitas."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "A Lei 14.987/2024 fala em pai ou responsável preso em regime fechado, não semiaberto (2ª é falsa). A Lei 15.243/2025 atribui ao poder público a assistência integral e multiprofissional e as campanhas sobre drogas lícitas e ilícitas (4ª é falsa).", "fundamento": "Art. 12, parágrafo único (Lei 14.950/2024): direito de visitação à mãe ou ao pai internados. Art. 87, III (Lei 14.987/2024): atendimento médico e psicossocial às crianças e adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime fechado. Art. 14-A (Lei 15.243/2025): Incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas [...] e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "fonte": "Lei 8.069/1990, art. 12, parágrafo único (Lei 14.950/2024); art. 87, III (Lei 14.987/2024); art. 14-A (Lei 15.243/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm", "regra": "Quando uma afirmação de V ou F troca um detalhe da lei, como regime fechado por semiaberto, ela é falsa. Confira palavra por palavra.", "passos": [{"t": "1ª é V: a Lei 14.950/2024 garantiu à criança e ao adolescente o direito de visitação à mãe ou ao pai internados."}, {"t": "2ª é F: a Lei 14.987/2024 fala em pai ou responsável preso em regime fechado, e não semiaberto."}, {"t": "3ª é V: pela Lei 15.243/2025, cabe ao poder público a assistência integral e multiprofissional e as campanhas sobre drogas lícitas e ilícitas."}, {"t": "4ª é F: diz que a assistência é só da família e as campanhas só sobre drogas ilícitas. Isso contraria a 3ª."}], "resp": "Alternativa E (V, F, V, F)", "pegadinha": "A (V, V, F, F) pega quem não percebe a troca de “fechado” por “semiaberto” na 2ª. E a 3ª é a que reproduz a lei, não a 4ª.", "porque": {"A": "Essa diz que a 2ª é verdadeira, mas a lei fala em regime fechado, não semiaberto. E a 3ª, que ela marca falsa, reproduz a lei.", "B": "Essa marca a 1ª como falsa, mas ela está certa. E marca a 4ª como verdadeira, mas a assistência cabe ao poder público, não só à família.", "C": "Essa troca a 3ª pela 4ª. Quem reproduz a lei é a 3ª: assistência e campanhas cabem ao poder público, não só à família.", "D": "Essa marca a 1ª como falsa, mas ela está certa. E marca a 2ª como verdadeira, mas a lei fala em regime fechado, não semiaberto."}}, {"id": "eca-05", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Sobre o dever de assegurar, com absoluta prioridade, os direitos da criança e do adolescente, previsto no art. 4º do ECA, assinale a alternativa INCORRETA.", "alternativas": ["A garantia de prioridade compreende a primazia de receber proteção e socorro em quaisquer circunstâncias.", "A garantia de prioridade compreende a precedência de atendimento somente nos serviços públicos de saúde e de educação.", "A garantia de prioridade compreende a preferência na formulação e na execução das políticas sociais públicas.", "A garantia de prioridade compreende a destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde e à alimentação, entre outros."], "correta": 1, "explicacao": "A lei prevê precedência de atendimento nos serviços públicos ou de relevância pública, sem limitar a saúde e educação; por isso a B é a incorreta. As demais reproduzem o caput e as alíneas do § 1º do art. 4º.", "fundamento": "Art. 4º É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde, à alimentação [...]. § 1º A garantia de prioridade compreende: a) primazia de receber proteção e socorro em quaisquer circunstâncias; b) precedência de atendimento nos serviços públicos ou de relevância pública; c) preferência na formulação e na execução das políticas sociais públicas; d) destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "fonte": "Lei 8.069/1990, art. 4º, caput e § 1º (antigo parágrafo único; numeração dada pela Lei 15.240/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm", "regra": "Quando a questão disser “somente” ao falar da prioridade da criança, desconfie: a precedência vale nos serviços públicos ou de relevância pública, sem limitar a saúde e educação.", "passos": [{"t": "A questão pede a INCORRETA."}, {"t": "O art. 4º, § 1º, diz que a prioridade compreende a precedência de atendimento nos serviços públicos ou de relevância pública."}, {"t": "B fala em “somente nos serviços públicos de saúde e de educação”. A lei não limita assim, então B é a incorreta."}, {"t": "As outras reproduzem o caput e as alíneas do § 1º do art. 4º."}], "resp": "Alternativa B", "pegadinha": "D pode parecer exagerada, mas a destinação privilegiada de recursos públicos para a infância e a juventude está na lei. Ela é correta, então não é a resposta.", "porque": {"A": "Essa está certa, é a alínea “a” do § 1º do art. 4º. A questão pede a INCORRETA.", "C": "Essa está certa, é a alínea “c” do § 1º do art. 4º. A questão pede a INCORRETA.", "D": "Parece exagerada, mas a destinação privilegiada de recursos públicos para a infância e a juventude está na lei. A questão pede a INCORRETA.", "E": "Essa está certa, é o caput do art. 4º. A questão pede a INCORRETA."}}, {"id": "ido-01", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Conforme a Lei nº 10.741/2003, com a redação dada pela Lei nº 14.423/2022, o Estatuto da Pessoa Idosa destina-se a regular os direitos assegurados às pessoas com idade igual ou superior a ______ anos. Entre as pessoas idosas, é assegurada prioridade especial aos maiores de ______ anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["65 – 80", "60 – 80", "60 – 75", "65 – 90", "60 – 90"], "correta": 1, "explicacao": "Pessoa idosa é quem tem 60 anos ou mais (art. 1º), e a prioridade especial é dos maiores de 80 anos (art. 3º, § 2º). A pegadinha troca 60 por 65, idade que aparece em outras normas.", "fundamento": "Art. 1º É instituído o Estatuto da Pessoa Idosa, destinado a regular os direitos assegurados às pessoas com idade igual ou superior a 60 (sessenta) anos. Art. 3º, § 2º Entre as pessoas idosas, é assegurada prioridade especial aos maiores de 80 (oitenta) anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas.", "fonte": "Lei 10.741/2003, art. 1º e art. 3º, § 2º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm", "regra": "Quando a questão falar em idade no Estatuto da Pessoa Idosa, lembre: pessoa idosa a partir de 60 anos, e prioridade especial para os maiores de 80.", "passos": [{"t": "Art. 1º: o Estatuto vale para pessoas com idade igual ou superior a 60 anos."}, {"t": "Art. 3º, § 2º: entre as pessoas idosas, os maiores de 80 anos têm prioridade especial."}, {"t": "Só B tem 60 e 80."}], "resp": "Alternativa B", "pegadinha": "A (65 e 80) troca 60 por 65, idade que aparece em outras normas. No Estatuto, pessoa idosa é quem tem 60 anos ou mais.", "porque": {"A": "No Estatuto, pessoa idosa é quem tem 60 anos ou mais, não 65. O 65 aparece em outras normas.", "C": "Acerta o 60, mas a prioridade especial é para os maiores de 80 anos, não de 75.", "D": "As duas estão erradas. Pessoa idosa é a partir de 60 anos, e a prioridade especial é dos maiores de 80.", "E": "Acerta o 60, mas a prioridade especial é para os maiores de 80 anos, não de 90."}}, {"id": "ido-02", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Uma pessoa idosa de 68 anos é internada em um hospital, e sua filha pergunta na recepção se pode permanecer como acompanhante. De acordo com o art. 16 do Estatuto da Pessoa Idosa, assinale a alternativa correta.", "alternativas": ["O direito a acompanhante é assegurado apenas à pessoa idosa internada, não se estendendo à que estiver em observação.", "Cabe ao diretor administrativo do hospital conceder a autorização para o acompanhamento da pessoa idosa.", "O direito a acompanhante em tempo integral é assegurado apenas às pessoas idosas maiores de 80 anos.", "Cabe ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento ou, no caso de impossibilidade, justificá-la por escrito.", "Havendo impossibilidade de acompanhamento, basta que o profissional de saúde comunique verbalmente a negativa à família."], "correta": 3, "explicacao": "O art. 16 garante acompanhante à pessoa idosa internada ou em observação, e o parágrafo único atribui a autorização ao profissional de saúde responsável pelo tratamento, que deve justificar por escrito eventual impossibilidade. As pegadinhas trocam o responsável (diretor), a forma (verbal) e a idade (80 anos).", "fundamento": "Art. 16. À pessoa idosa internada ou em observação é assegurado o direito a acompanhante, devendo o órgão de saúde proporcionar as condições adequadas para a sua permanência em tempo integral, segundo o critério médico. Parágrafo único. Caberá ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento da pessoa idosa ou, no caso de impossibilidade, justificá-la por escrito.", "fonte": "Lei 10.741/2003, art. 16, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm", "regra": "Quando a questão perguntar quem autoriza o acompanhante da pessoa idosa, lembre: é o profissional de saúde responsável pelo tratamento, e a negativa precisa ser justificada por escrito.", "passos": [{"t": "Art. 16: a pessoa idosa internada ou em observação tem direito a acompanhante em tempo integral, segundo o critério médico."}, {"t": "Parágrafo único: quem autoriza é o profissional de saúde responsável pelo tratamento. Se for impossível, ele justifica por escrito."}, {"t": "D diz exatamente isso."}], "resp": "Alternativa D", "pegadinha": "E parece prática, mas a lei exige justificativa por escrito, não verbal. C erra a idade: o direito não é só dos maiores de 80 anos.", "porque": {"A": "O direito a acompanhante vale para a pessoa idosa internada ou em observação.", "B": "Quem autoriza é o profissional de saúde responsável pelo tratamento, não o diretor administrativo.", "C": "O direito a acompanhante vale para toda pessoa idosa internada ou em observação, não só para os maiores de 80 anos.", "E": "A lei exige que a impossibilidade seja justificada por escrito. Não basta avisar a família verbalmente."}}, {"id": "ido-03", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Sobre a violência contra a pessoa idosa, de acordo com o art. 19 do Estatuto da Pessoa Idosa, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária.", "II – Esses casos também serão obrigatoriamente comunicados pelos serviços de saúde a quaisquer dos seguintes órgãos: autoridade policial, Ministério Público, Conselho Municipal, Conselho Estadual ou Conselho Nacional da Pessoa Idosa.", "III – Para os efeitos do Estatuto, considera-se violência contra a pessoa idosa apenas a ação praticada em local público que lhe cause morte ou dano físico."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I e II reproduzem o caput e os incisos do art. 19. A III está errada: o § 1º considera violência qualquer ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico.", "fundamento": "Art. 19. Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária, bem como serão obrigatoriamente comunicados por eles a quaisquer dos seguintes órgãos: I – autoridade policial; II – Ministério Público; III – Conselho Municipal da Pessoa Idosa; IV – Conselho Estadual da Pessoa Idosa; V – Conselho Nacional da Pessoa Idosa. § 1º [...] considera-se violência contra a pessoa idosa qualquer ação ou omissão praticada em local público ou privado que lhe cause morte, dano ou sofrimento físico ou psicológico.", "fonte": "Lei 10.741/2003, art. 19, caput, incisos I a V e § 1º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm", "regra": "Quando a questão limitar a violência contra a pessoa idosa (só em local público, só dano físico), desconfie: vale qualquer ação ou omissão, em local público ou privado.", "passos": [{"t": "I está correta: suspeita ou confirmação de violência é de notificação compulsória à autoridade sanitária, pelos serviços de saúde públicos e privados."}, {"t": "II está correta: os casos também são comunicados a qualquer um destes: autoridade policial, Ministério Público ou Conselho Municipal, Estadual ou Nacional da Pessoa Idosa."}, {"t": "III está errada: o § 1º considera violência qualquer ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico."}], "resp": "Alternativa C", "pegadinha": "E (todas) pega quem lê a III rápido. Ela diz “apenas” local público e dano físico, mas a lei inclui local privado, omissão e sofrimento psicológico.", "porque": {"A": "Essa deixa a II de fora, mas ela está certa. Os casos também são comunicados à autoridade policial, ao Ministério Público ou aos Conselhos da Pessoa Idosa.", "B": "Essa aceita só a III, que é a errada. Violência é qualquer ação ou omissão, em local público ou privado, com dano físico ou psicológico.", "D": "Essa diz que a III é verdadeira, mas a lei inclui omissão, local privado e sofrimento psicológico. E deixa de fora a I, que está certa.", "E": "Essa diz que a III é verdadeira, mas a lei não fala “apenas” em local público e dano físico. Inclui omissão, local privado e sofrimento psicológico."}}, {"id": "ido-04", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Estatuto da Pessoa Idosa. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É permitida a cobrança de valores diferenciados em razão da idade nos planos de saúde, desde que a pessoa idosa seja informada previamente.", "( ) A garantia de prioridade compreende o atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população.", "( ) Não estando a pessoa idosa em condições de optar pelo tratamento de saúde e não tendo curador, a opção será feita pelo diretor do hospital.", "( ) À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável."], "alternativas": ["F – V – F – V", "V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – V – V"], "correta": 0, "explicacao": "O art. 15, § 3º, veda a cobrança diferenciada por idade nos planos de saúde (1ª é falsa). Sem curador, a opção cabe aos familiares, e ao médico apenas em iminente risco de vida ou sem familiar conhecido; a lei não menciona o diretor do hospital (3ª é falsa).", "fundamento": "Art. 3º, § 1º, I – atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população. Art. 15, § 3º É vedada a discriminação da pessoa idosa nos planos de saúde pela cobrança de valores diferenciados em razão da idade. Art. 17. À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável. Parágrafo único [...] II – pelos familiares, quando a pessoa idosa não tiver curador ou este não puder ser contactado em tempo hábil.", "fonte": "Lei 10.741/2003, art. 3º, § 1º, I; art. 15, § 3º; art. 17, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm", "regra": "Quando o Estatuto da Pessoa Idosa falar em plano de saúde, lembre que é proibido cobrar valores diferentes por causa da idade.", "passos": [{"t": "1ª é F: o art. 15, § 3º, proíbe cobrar valores diferenciados em razão da idade nos planos de saúde."}, {"t": "2ª é V: atendimento preferencial imediato e individualizado nos órgãos públicos e privados faz parte da garantia de prioridade (art. 3º, § 1º, I)."}, {"t": "3ª é F: sem curador, quem escolhe são os familiares, e o médico só em iminente risco de vida ou sem familiar conhecido. A lei não fala em diretor do hospital."}, {"t": "4ª é V: a pessoa idosa no domínio de suas faculdades mentais pode escolher o tratamento que achar mais favorável (art. 17)."}], "resp": "Alternativa A (F, V, F, V)", "pegadinha": "E (F, V, V, V) pega quem acha natural o diretor do hospital decidir. Sem curador, a decisão é dos familiares, e a lei nem menciona o diretor.", "porque": {"B": "Essa diz que a 1ª é verdadeira, mas a lei proíbe cobrar diferente por idade no plano de saúde. E a 4ª, que ela marca falsa, está certa.", "C": "Essa marca a 2ª como falsa, mas ela está certa. E marca a 3ª como verdadeira, mas sem curador quem escolhe são os familiares, não o diretor.", "D": "Essa inverte as quatro. A lei proíbe cobrança diferente por idade no plano, e sem curador quem escolhe são os familiares, não o diretor.", "E": "Essa diz que a 3ª é verdadeira, mas sem curador quem escolhe são os familiares. A lei nem menciona o diretor do hospital."}}, {"id": "pcd-01", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "De acordo com a Lei Brasileira de Inclusão (Lei nº 13.146/2015): “Considera-se pessoa com deficiência aquela que tem impedimento de ______ prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais ______, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.” E ainda: “A avaliação da deficiência, quando necessária, será ______, realizada por equipe multiprofissional e interdisciplinar.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["longo – barreiras – biopsicossocial", "curto – barreiras – exclusivamente médica", "longo – limitações – exclusivamente médica", "médio – barreiras – biopsicossocial", "longo – doenças – psicossocial"], "correta": 0, "explicacao": "O art. 2º exige impedimento de longo prazo que, em interação com barreiras, obstrua a participação; a deficiência resulta dessa interação, e não só do diagnóstico. A avaliação é biopsicossocial e feita por equipe multiprofissional e interdisciplinar, não por avaliação exclusivamente médica.", "fundamento": "Art. 2º Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas. § 1º A avaliação da deficiência, quando necessária, será biopsicossocial, realizada por equipe multiprofissional e interdisciplinar [...].", "fonte": "Lei 13.146/2015, art. 2º, caput e § 1º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm", "regra": "Quando a LBI definir pessoa com deficiência, lembre de três palavras: impedimento de LONGO prazo, interação com BARREIRAS e avaliação BIOPSICOSSOCIAL.", "passos": [{"t": "1ª lacuna: o art. 2º fala em impedimento de longo prazo."}, {"t": "2ª lacuna: a deficiência vem da interação desse impedimento com barreiras, e não só do diagnóstico."}, {"t": "3ª lacuna: a avaliação é biopsicossocial, feita por equipe multiprofissional e interdisciplinar (§ 1º). Fica longo, barreiras, biopsicossocial."}], "resp": "Alternativa A", "pegadinha": "B e C falam em avaliação “exclusivamente médica”, mas a lei exige equipe multiprofissional e interdisciplinar. Desconfie de “exclusivamente” nessa definição.", "porque": {"B": "A lei fala em impedimento de longo prazo, não curto. E a avaliação é biopsicossocial, por equipe multiprofissional, não exclusivamente médica.", "C": "Acerta o longo prazo, mas a interação é com barreiras, não limitações. E a avaliação é biopsicossocial, não exclusivamente médica.", "D": "Acerta barreiras e biopsicossocial, mas a lei fala em impedimento de longo prazo, não médio.", "E": "A interação é com barreiras, não doenças. E a avaliação é biopsicossocial, não só psicossocial."}}, {"id": "pcd-02", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "A Lei nº 13.146/2015 classifica as barreiras que limitam ou impedem a participação social da pessoa com deficiência. Considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Barreiras atitudinais são atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "II – Barreiras arquitetônicas são as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo.", "III – Barreiras nas comunicações e na informação são qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações por intermédio de sistemas de comunicação e de tecnologia da informação."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas I e III."], "correta": 4, "explicacao": "A II traz a definição de barreiras urbanísticas, não das arquitetônicas. Barreiras arquitetônicas são as que existem nos edifícios públicos e privados. I e III reproduzem as alíneas “e” e “d” do art. 3º, IV.", "fundamento": "Art. 3º, IV – barreiras [...]: a) barreiras urbanísticas: as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo; b) barreiras arquitetônicas: as existentes nos edifícios públicos e privados; [...] d) barreiras nas comunicações e na informação: qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações [...]; e) barreiras atitudinais: atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "fonte": "Lei 13.146/2015, art. 3º, IV, alíneas a, b, d e e", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm", "regra": "Quando aparecer barreira “nas vias e nos espaços abertos ao público”, ela é urbanística. Arquitetônica é só a que existe nos edifícios públicos e privados.", "passos": [{"t": "Olhe o item II: ele fala em barreira nas “vias e nos espaços públicos e privados abertos ao público”."}, {"t": "Pela LBI (art. 3º, IV), essa é a definição de barreira urbanística. Barreira arquitetônica é a que existe nos edifícios públicos e privados."}, {"t": "I e III copiam as definições de barreira atitudinal e de barreira nas comunicações e na informação. Então só I e III estão certas."}], "resp": "Alternativa E", "pegadinha": "D (I e II) engana porque o texto do item II existe na lei. Mas ele define barreira urbanística, não arquitetônica.", "porque": {"A": "Essa deixa a III de fora, mas ela está certa. É a definição de barreira nas comunicações e na informação.", "B": "Essa aceita só a II, que é a errada. Vias e espaços abertos ao público são barreira urbanística, não arquitetônica.", "C": "Essa deixa a I de fora, mas ela está certa. É a definição de barreira atitudinal.", "D": "Essa diz que a II é verdadeira, mas vias e espaços abertos ao público são barreira urbanística. Arquitetônica é a dos edifícios."}}, {"id": "pcd-03", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre o atendimento à pessoa com deficiência segundo a Lei nº 13.146/2015. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A pessoa com deficiência tem direito a receber atendimento prioritário, inclusive em todas as instituições e serviços de atendimento ao público.", "( ) Nos serviços de emergência públicos e privados, a prioridade conferida pela Lei é condicionada aos protocolos de atendimento médico.", "( ) Os direitos de atendimento prioritário estendem-se ao acompanhante ou ao atendente pessoal da pessoa com deficiência, inclusive quanto à restituição de imposto de renda e à tramitação processual.", "( ) O uso do cordão de fita com desenhos de girassóis, símbolo nacional de identificação de pessoas com deficiências ocultas, é obrigatório para o exercício dos direitos previstos em lei."], "alternativas": ["V – F – V – F", "F – V – F – V", "V – V – V – F", "V – V – F – F", "F – F – V – V"], "correta": 3, "explicacao": "A extensão ao acompanhante ou atendente pessoal exclui justamente a restituição de imposto de renda e a tramitação processual (incisos VI e VII), por isso a 3ª é falsa. O uso do cordão de girassóis é opcional, e sua ausência não prejudica direitos, por isso a 4ª também é falsa.", "fundamento": "Art. 9º [...] II - atendimento em todas as instituições e serviços de atendimento ao público; [...] § 1º Os direitos previstos neste artigo são extensivos ao acompanhante da pessoa com deficiência ou ao seu atendente pessoal, exceto quanto ao disposto nos incisos VI e VII deste artigo. § 2º Nos serviços de emergência públicos e privados, a prioridade conferida por esta Lei é condicionada aos protocolos de atendimento médico. Art. 2º-A, § 1º O uso do símbolo [...] é opcional, e sua ausência não prejudica o exercício de direitos e garantias previstos em lei.", "fonte": "Lei 13.146/2015, art. 9º, II, §§ 1º e 2º; art. 2º-A, § 1º (incluído pela Lei 14.624/2023)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm", "regra": "Quando a questão estender ao acompanhante os direitos de prioridade, lembre a exceção: restituição de imposto de renda e tramitação processual não passam para ele.", "passos": [{"t": "Itens 1 e 2 copiam o art. 9º: atendimento em todas as instituições e serviços, e prioridade na emergência condicionada aos protocolos médicos. Os dois são V."}, {"t": "Item 3: a extensão ao acompanhante ou atendente pessoal exclui justamente a restituição de imposto de renda e a tramitação processual (incisos VI e VII). É F."}, {"t": "Item 4: o cordão de girassóis é opcional, e não usar não prejudica direitos. A palavra “obrigatório” torna o item F."}], "resp": "Alternativa D", "pegadinha": "C (V, V, V, F) erra só o item 3. Ele parece certo, mas imposto de renda e tramitação processual são justamente as exceções que não se estendem ao acompanhante.", "porque": {"A": "Essa marca a 2ª como falsa, mas ela copia a lei. E marca a 3ª como verdadeira, mas imposto de renda e tramitação processual não passam ao acompanhante.", "B": "Essa marca a 1ª como falsa, mas ela copia a lei. E marca a 4ª como verdadeira, mas o cordão de girassóis é opcional.", "C": "Essa erra só a 3ª. Restituição de imposto de renda e tramitação processual são justamente as exceções que não passam ao acompanhante.", "E": "Essa inverte as quatro. A 1ª e a 2ª copiam a lei, a 3ª erra a exceção do acompanhante e o cordão é opcional."}}, {"id": "pcd-04", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Sobre os direitos da pessoa com deficiência nos serviços de saúde, conforme a Lei nº 13.146/2015, assinale a alternativa INCORRETA.", "alternativas": ["À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal, devendo o órgão ou a instituição de saúde proporcionar condições adequadas para sua permanência em tempo integral.", "Na impossibilidade de permanência do acompanhante ou do atendente pessoal junto à pessoa com deficiência, cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito.", "A notificação compulsória de violência contra a pessoa com deficiência é exigida apenas dos serviços públicos de saúde e somente nos casos em que a violência estiver confirmada.", "Ocorrendo a impossibilidade de permanência do acompanhante, o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência do acompanhante ou do atendente pessoal.", "Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência."], "correta": 2, "explicacao": "O art. 26 obriga os serviços de saúde públicos e privados a notificar a suspeita ou a confirmação de violência. Por isso a C é a incorreta, ao restringir a notificação ao setor público e aos casos confirmados. As demais reproduzem os arts. 22 e 26.", "fundamento": "Art. 22. À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal [...]. § 1º Na impossibilidade de permanência [...], cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito. § 2º [...] o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência [...]. Art. 26. Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência.", "fonte": "Lei 13.146/2015, art. 22, caput, §§ 1º e 2º; art. 26", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm", "regra": "Quando a questão falar em notificação de violência contra pessoa com deficiência, lembre: vale para serviço público e privado, e para suspeita ou confirmação.", "passos": [{"t": "A questão pede a INCORRETA. Procure palavras que restringem: a C diz “apenas dos serviços públicos” e “somente” quando a violência estiver confirmada."}, {"t": "O art. 26 obriga os serviços de saúde públicos e privados a notificar a suspeita ou a confirmação de violência."}, {"t": "A C corta as duas partes: tira o serviço privado e tira a suspeita. Por isso é a incorreta. As outras copiam os arts. 22 e 26."}], "resp": "Alternativa C", "pegadinha": "B e D parecem exigências a mais, mas estão certas: copiam o art. 22, sobre justificar por escrito e suprir a ausência do acompanhante.", "porque": {"A": "Essa está certa, copia o art. 22. A questão pede a INCORRETA.", "B": "Parece exigência a mais, mas está certa, copia o § 1º do art. 22. A questão pede a INCORRETA.", "D": "Parece exigência a mais, mas está certa: o hospital deve suprir a ausência do acompanhante (art. 22). A questão pede a INCORRETA.", "E": "Essa está certa, copia o art. 26. A questão pede a INCORRETA, a que tira o serviço privado e a suspeita."}}, {"id": "rac-01", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "A Lei nº 14.532/2023 incluiu o art. 2º-A na Lei nº 7.716/1989 (Lei do Crime Racial) e tipificou a injúria racial como crime de racismo. Sobre esse dispositivo, assinale a alternativa correta.", "alternativas": ["Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional, sujeita o autor à pena de detenção, de 1 (um) a 6 (seis) meses, ou multa.", "A pena prevista é de reclusão, de 2 (dois) a 5 (cinco) anos, e multa, aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "A pena prevista é de reclusão, de 1 (um) a 3 (três) anos, e multa, aumentada de 1/3 (um terço) se o crime for cometido por 2 (duas) ou mais pessoas.", "A injúria praticada em razão da religião da vítima passou a ser punida pelo art. 2º-A da Lei nº 7.716/1989, com a mesma pena da injúria em razão de raça ou cor.", "A injúria racial continuou prevista exclusivamente no Código Penal, como forma qualificada do crime de injúria."], "correta": 1, "explicacao": "O art. 2º-A prevê reclusão de 2 a 5 anos e multa, com aumento de metade no concurso de duas ou mais pessoas. A religião não está no art. 2º-A: a injúria por religião, idade ou deficiência ficou no art. 140, § 3º, do Código Penal, com reclusão de 1 a 3 anos (pegadinhas C e D).", "fundamento": "Art. 2º-A Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional. Pena: reclusão, de 2 (dois) a 5 (cinco) anos, e multa. Parágrafo único. A pena é aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "fonte": "Lei 7.716/1989, art. 2º-A (incluído pela Lei 14.532/2023, art. 1º); Código Penal, art. 140, § 3º (redação da Lei 14.532/2023, art. 2º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm", "regra": "Quando a injúria for por raça, cor, etnia ou procedência nacional, é o art. 2º-A da Lei 7.716/1989: reclusão de 2 a 5 anos e multa, aumentada de metade se forem 2 ou mais pessoas.", "passos": [{"t": "O art. 2º-A trata da injúria em razão de raça, cor, etnia ou procedência nacional."}, {"t": "A pena é reclusão de 2 a 5 anos e multa. Aumenta de metade se o crime for cometido por 2 ou mais pessoas."}, {"t": "A alternativa B traz exatamente essa pena e esse aumento."}], "resp": "Alternativa B", "pegadinha": "C traz a pena de 1 a 3 anos, que é da injúria por religião, idade ou deficiência, no art. 140, § 3º, do Código Penal. D erra porque religião não está no art. 2º-A.", "porque": {"A": "A pena do art. 2º-A é reclusão de 2 a 5 anos e multa, não detenção de 1 a 6 meses ou multa.", "C": "Reclusão de 1 a 3 anos é a pena da injúria por religião, idade ou deficiência, no Código Penal. No art. 2º-A é de 2 a 5 anos.", "D": "Religião não está no art. 2º-A. A injúria por religião ficou no art. 140, § 3º, do Código Penal, com pena de 1 a 3 anos.", "E": "A Lei nº 14.532/2023 levou a injúria racial para o art. 2º-A da Lei nº 7.716/1989. Ela não ficou só no Código Penal."}}, {"id": "rac-02", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "Considere as afirmações abaixo sobre os dispositivos que a Lei nº 14.532/2023 incluiu na Lei nº 7.716/1989. Quais estão corretas?", "itens": ["I – Os crimes previstos nos arts. 2º-A e 20 da Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando praticados por funcionário público, no exercício de suas funções ou a pretexto de exercê-las.", "II – Os crimes previstos na Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando ocorrer
