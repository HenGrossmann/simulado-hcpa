ade, sem ressalva. Desconfie de 'em casos excepcionais' ou 'permissão de violação'.", "ponto": 5}, {"t": "A sigla continua ANPD, mas o nome mudou em 2026 de Autoridade para Agência. A Lei 13.853/2019 do edital ainda diz Autoridade.", "ponto": 10}, {"t": "Operador não decide nada: executa em nome do controlador. Encarregado não trata dados, é o canal de comunicação.", "ponto": 8}], "links": [{"rotulo": "LGPD no Planalto", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"rotulo": "Lei 15.352/2026 (ANPD vira Agência)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/L15352.htm"}]}, {"id": "etica", "tema": "Ética do servidor (Decreto 1.171/1994)", "minutos": 5, "porque": "Em 2023 caiu o que o decreto aprova. O código vale para empresas públicas como o HCPA e fala de fila, atraso e cortesia, que é o dia a dia da recepção.", "pontos": [{"t": "O Decreto 1.171/1994 aprova o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal.", "fonte": "Decreto 1.171/1994, ementa e art. 1º", "grupo": "Código e quem abrange", "chave": "Poder Executivo Federal"}, {"t": "Servidor, para o código: quem presta serviço permanente, temporário ou excepcional, mesmo sem remuneração, por lei, contrato ou outro ato.", "fonte": "Decreto 1.171/1994, Anexo, item XXIV", "grupo": "Código e quem abrange", "chave": "mesmo sem remuneração"}, {"t": "Isso inclui quem atua em autarquias, fundações públicas, entidades paraestatais, empresas públicas e sociedades de economia mista.", "fonte": "Decreto 1.171/1994, Anexo, item XXIV", "grupo": "Código e quem abrange", "chave": "sociedades de economia mista"}, {"t": "Deve haver Comissão de Ética em todo órgão e entidade da Administração Federal direta, indireta, autárquica e fundacional.", "fonte": "Decreto 1.171/1994, Anexo, item XVI", "grupo": "Comissão de Ética", "chave": "todo órgão e entidade"}, {"t": "Os órgãos tinham 60 dias para criar a Comissão, formada por três servidores ou empregados titulares de cargo efetivo ou emprego permanente.", "fonte": "Decreto 1.171/1994, art. 2º", "grupo": "Comissão de Ética", "chave": "60 dias"}, {"t": "A pena que a Comissão de Ética aplica é a censura, com parecer assinado por todos os integrantes e ciência do servidor faltoso.", "fonte": "Decreto 1.171/1994, Anexo, item XXII", "grupo": "Comissão de Ética", "chave": "censura"}, {"t": "Deveres: fazer o trabalho a tempo, ser assíduo, ser cortês sem preconceito, manter o local de trabalho limpo e em ordem.", "fonte": "Decreto 1.171/1994, Anexo, item XIV, a, g, l, n", "grupo": "Deveres e vedações", "chave": "ser assíduo"}, {"t": "Deixar alguém esperando, permitir fila ou atrasar o serviço é conduta antiética e causa dano moral aos usuários.", "fonte": "Decreto 1.171/1994, Anexo, item X", "grupo": "Deveres e vedações", "chave": "dano moral"}, {"t": "Todo mundo tem direito à verdade: o servidor não pode omitir nem falsear, mesmo contra o interesse da pessoa ou da Administração.", "fonte": "Decreto 1.171/1994, Anexo, item VIII", "grupo": "Deveres e vedações", "chave": "omitir nem falsear"}, {"t": "A publicidade dos atos é a regra. Sigilo só nos casos legais, como segurança nacional e investigações.", "fonte": "Decreto 1.171/1994, Anexo, item VII", "grupo": "Deveres e vedações", "chave": "publicidade dos atos"}, {"t": "Vedado: pedir ou receber presente, comissão ou vantagem; usar o cargo para favorecer alguém; alterar ou deturpar documentos.", "fonte": "Decreto 1.171/1994, Anexo, item XV, a, g, h", "grupo": "Deveres e vedações", "chave": "presente, comissão ou vantagem"}, {"t": "Vedado também: retirar documento ou bem da repartição sem autorização e apresentar-se embriagado no serviço ou, fora dele, de forma habitual.", "fonte": "Decreto 1.171/1994, Anexo, item XV, l, n", "grupo": "Deveres e vedações", "chave": "de forma habitual"}], "pegadinhas": [{"t": "A pena da Comissão de Ética é a censura. Alternativa com advertência, suspensão ou demissão aplicada por ela está errada.", "ponto": 5}, {"t": "Vale para quem trabalha sem remuneração ou por contrato temporário também.", "ponto": 1}, {"t": "Ausência injustificada não é só falta administrativa: o código diz que desmoraliza o serviço público (item XII).", "ponto": 6}, {"t": "Embriaguez fora do serviço só é vedada se for habitual (item XV, n).", "ponto": 11}], "links": [{"rotulo": "Decreto 1.171 no Planalto", "url": "https://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}]}, {"id": "nr32", "tema": "NR-32", "minutos": 5, "porque": "Em 2023 caíram duas questões: PGR e as regras de proteção. É a norma de segurança de quem trabalha dentro do hospital, inclusive no administrativo.", "pontos": [{"t": "Objetivo: diretrizes básicas para proteger a segurança e a saúde dos trabalhadores dos serviços de saúde e de quem faz promoção e assistência à saúde.", "fonte": "NR-32, item 32.1.1", "grupo": "Objetivo e conceitos", "chave": "saúde dos trabalhadores"}, {"t": "Serviço de saúde: edificação de assistência à saúde e toda ação de promoção, recuperação, assistência, pesquisa e ensino em saúde.", "fonte": "NR-32, item 32.1.2", "grupo": "Objetivo e conceitos", "chave": "pesquisa e ensino"}, {"t": "Risco biológico é a probabilidade de exposição ocupacional a agentes biológicos: microrganismos, culturas de células, parasitas, toxinas e príons.", "fonte": "NR-32, itens 32.2.1 e 32.2.1.1", "grupo": "Objetivo e conceitos", "chave": "Risco biológico"}, {"t": "PGR avalia local e trabalhador: finalidade do local, organização, possibilidade de exposição, atividades, medidas preventivas.", "fonte": "NR-32, item 32.2.2.1, II", "grupo": "PGR", "chave": "possibilidade de exposição"}, {"t": "O PGR também identifica os agentes biológicos mais prováveis: fontes, vias de transmissão, transmissibilidade, persistência no ambiente.", "fonte": "NR-32, item 32.2.2.1, I", "grupo": "PGR", "chave": "agentes biológicos mais prováveis"}, {"t": "O PGR é reavaliado se mudar a exposição ou se a análise de acidentes exigir. Os documentos ficam disponíveis aos trabalhadores.", "fonte": "NR-32, itens 32.2.2.2 e 32.2.2.3", "grupo": "PGR", "chave": "reavaliado"}, {"t": "Capacitação: antes de começar e de forma continuada, durante a jornada, dada por profissionais de saúde familiarizados com os riscos.", "fonte": "NR-32, item 32.2.4.9", "grupo": "Prevenção no dia a dia", "chave": "durante a jornada"}, {"t": "É vedado no posto de trabalho: fumar, usar adornos, mexer em lente de contato, comer, beber, guardar alimento e usar calçado aberto.", "fonte": "NR-32, item 32.2.4.5", "grupo": "Prevenção no dia a dia", "chave": "guardar alimento"}, {"t": "Quem usa o perfurocortante é responsável pelo descarte. Reencapar e desconectar agulha com a mão é proibido.", "fonte": "NR-32, itens 32.2.4.14 e 32.2.4.15", "grupo": "Prevenção no dia a dia", "chave": "Reencapar"}, {"t": "Resíduos: saco cheio até 2/3 da capacidade. Caixa de perfurocortante cheia até 5 cm abaixo do bocal.", "fonte": "NR-32, itens 32.5.2, a, e 32.5.3.2", "grupo": "Prevenção no dia a dia", "chave": "2/3 da capacidade"}, {"t": "Vacinação gratuita contra tétano, difteria, hepatite B e as previstas no PCMSO, para todo trabalhador de serviço de saúde.", "fonte": "NR-32, item 32.2.4.17.1", "grupo": "Prevenção no dia a dia", "chave": "tétano, difteria, hepatite B"}, {"t": "Todo acidente com risco biológico gera CAT (Comunicação de Acidente de Trabalho), com ou sem afastamento.", "fonte": "NR-32, item 32.2.3.5", "grupo": "Prevenção no dia a dia", "chave": "com ou sem afastamento"}], "pegadinhas": [{"t": "Capacitação é durante a jornada, não fora dela. Em 2023 a alternativa errada dizia 'sempre fora da jornada'.", "ponto": 6}, {"t": "Não basta não comer no posto: guardar alimento em local não destinado a isso também é vedado.", "ponto": 7}, {"t": "Ninguém sai do local de trabalho com o EPI ou a vestimenta usada (item 32.2.4.6.2).", "ponto": null}, {"t": "Luva não substitui lavar as mãos, que deve ocorrer antes e depois do uso (item 32.2.4.3.2).", "ponto": null}], "links": [{"rotulo": "NR-32 atualizada (gov.br)", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}]}, {"id": "cnv", "tema": "Comunicação não-violenta (CNV)", "minutos": 5, "porque": "É o primeiro item dos conhecimentos específicos. Ajuda a atender paciente nervoso no balcão sem rebater e sem julgar.", "pontos": [{"t": "Os quatro ingredientes da CNV: observações, sentimentos, necessidades e pedidos.", "fonte": "Pelizzoli, CNV, p. 38", "grupo": "Os 4 componentes", "chave": "observações, sentimentos, necessidades e pedidos"}, {"t": "Observação é factual: sem julgamento, interpretação ou avaliação moral. Julgue o fato, não a pessoa.", "fonte": "Pelizzoli, CNV, p. 25 e p. 38", "grupo": "Os 4 componentes", "chave": "sem julgamento"}, {"t": "Sentimentos incluem sensações e emoções básicas. Necessidade é o que precisamos, queremos ou desejamos.", "fonte": "Pelizzoli, CNV, p. 38", "grupo": "Os 4 componentes", "chave": "sensações e emoções básicas"}, {"t": "Todos têm no fundo as mesmas necessidades. O que muda são as estratégias para atendê-las.", "fonte": "Pelizzoli, CNV, p. 40", "grupo": "Os 4 componentes", "chave": "mesmas necessidades"}, {"t": "'Sinto que meu chefe é manipulador' não é sentimento, é pensamento. Sentimento seria: 'me sinto frustrada'.", "fonte": "Pelizzoli, CNV, p. 42 e 43", "grupo": "Sentimento x julgamento", "chave": "é pensamento"}, {"t": "Ignorado, abandonado, manipulado, traído, usado: são não-sentimentos, ou seja, interpretações que parecem sentimentos.", "fonte": "Pelizzoli, CNV, p. 34", "grupo": "Sentimento x julgamento", "chave": "não-sentimentos"}, {"t": "Culpar, insultar, rebaixar, criticar, comparar e diagnosticar são formas de julgamento que bloqueiam a compaixão.", "fonte": "Pelizzoli, CNV, p. 39", "grupo": "Sentimento x julgamento", "chave": "bloqueiam a compaixão"}, {"t": "Pedido em linguagem positiva: diga o que quer, não o que não quer. 'Preciso de silêncio' é melhor que 'não fale alto'.", "fonte": "Pelizzoli, CNV, p. 28 e p. 45", "grupo": "Pedidos e escuta", "chave": "linguagem positiva"}, {"t": "Pedido específico funciona melhor que genérico. E desejo ('eu gostaria que você fosse mais calmo') não é pedido.", "fonte": "Pelizzoli, CNV, p. 28 e 29", "grupo": "Pedidos e escuta", "chave": "Pedido específico"}, {"t": "A CNV separa pedidos de ordens e imposições. Um 'não' deve ser respeitado: mostra necessidades do outro não atendidas.", "fonte": "Pelizzoli, CNV, p. 37 e p. 47", "grupo": "Pedidos e escuta", "chave": "pedidos de ordens"}, {"t": "Diante de mensagem negativa: culpar a si, culpar o outro, perceber os próprios sentimentos e necessidades, ou perceber os do outro.", "fonte": "Pelizzoli, CNV, p. 43", "grupo": "Pedidos e escuta", "chave": "culpar a si, culpar o outro"}, {"t": "Escuta empática vale mais que dar conselho. Parafrasear em forma de pergunta confirma se você entendeu.", "fonte": "Pelizzoli, CNV, p. 47 e 48", "grupo": "Pedidos e escuta", "chave": "Escuta empática"}], "pegadinhas": [{"t": "Juízo de valor (dar valor à pontualidade) não é julgamento moralista. O problema é rotular a pessoa (p. 39).", "ponto": 6}, {"t": "O outro é o gatilho, não a causa: é a avaliação que fazemos do ato que causa a raiva (p. 40 e 41).", "ponto": null}, {"t": "CNV não é técnica para fazer o outro aceitar sua posição. O objetivo é atender às necessidades de todos (p. 45).", "ponto": 9}, {"t": "Das quatro formas de receber crítica, só as duas últimas entram em contato com sentimentos e necessidades (p. 43).", "ponto": 10}], "links": [{"rotulo": "Ebook CNV (Pelizzoli, ref. do edital)", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf"}]}, {"id": "materiais", "tema": "Gestão de materiais e almoxarifado", "minutos": 5, "porque": "O cargo cobre suprimentos e almoxarifado. A banca gosta de definição pronta e de fórmula simples, como ponto de pedido e giro.", "pontos": [{"t": "Recebimento provisório: recepção do veículo e checagem da nota fiscal. A assinatura na nota só comprova a data de entrega.", "fonte": "Fenili, cap. 5, p. 129", "grupo": "Recebimento", "chave": "Recebimento provisório"}, {"t": "Depois vem a conferência quantitativa (quantidade da nota igual à entregue) e a qualitativa (especificações pedidas).", "fonte": "Fenili, cap. 5, p. 129", "grupo": "Recebimento", "chave": "conferência quantitativa"}, {"t": "Recebimento definitivo é a aceitação: material entra no estoque e o pagamento é liberado. Se não, há devolução ou reclamação.", "fonte": "Fenili, cap. 5, p. 129", "grupo": "Recebimento", "chave": "Recebimento definitivo"}, {"t": "Curva ABC, por valor de demanda: A tem cerca de 80% do valor e 20% dos itens; B, 15% e 30%; C, 5% e 50%. Percentuais aproximados.", "fonte": "Fenili, cap. 2, p. 32", "grupo": "Classificar e armazenar", "chave": "80% do valor"}, {"t": "Classificação XYZ mede criticidade. X é baixa, Y intermediária, Z máxima: a falta para a operação ou põe pessoas em risco.", "fonte": "Fenili, cap. 2, p. 31", "grupo": "Classificar e armazenar", "chave": "criticidade"}, {"t": "Codificação: série de números e/ou letras que representa o item. Cada item tem um único código.", "fonte": "Fenili, cap. 2, p. 27; Kummer, aula 16, p. 99", "grupo": "Classificar e armazenar", "chave": "único código"}, {"t": "Armazenagem por frequência põe perto da saída o que mais sai. Por compatibilidade separa materiais que reagem entre si.", "fonte": "Fenili, cap. 5, p. 132 e 133", "grupo": "Classificar e armazenar", "chave": "perto da saída"}, {"t": "PEPS ou FIFO: o primeiro a entrar é o primeiro a sair. FEFO: sai primeiro o que vence primeiro, ideal para perecíveis.", "fonte": "Fenili, cap. 2, p. 31; Kummer, aula 7, p. 60", "grupo": "Classificar e armazenar", "chave": "PEPS ou FIFO"}, {"t": "Ponto de pedido: PP = (C x TR) + ES. C é o consumo médio, TR o tempo de reposição, ES o estoque de segurança.", "fonte": "Fenili, cap. 3, p. 50", "grupo": "Controle de estoque", "chave": "PP = (C x TR) + ES"}, {"t": "Estoque de segurança cobre imprevistos: atraso na entrega, pedido cancelado, consumo maior, material rejeitado. Em condições normais não é usado.", "fonte": "Fenili, cap. 3, p. 50", "grupo": "Controle de estoque", "chave": "não é usado"}, {"t": "Giro de estoque = itens consumidos no período / estoque médio. Ex.: 6.000 consumidas e média de 1.500 dá giro 4. Busque giro alto.", "fonte": "Fenili, cap. 3, p. 68 e 69", "grupo": "Controle de estoque", "chave": "consumidos no período / estoque médio"}, {"t": "Inventário rotativo conta itens o tempo todo, sem parar o trabalho. O periódico conta tudo de uma vez; no fim do exercício é o geral.", "fonte": "Fenili, cap. 6, p. 148", "grupo": "Controle de estoque", "chave": "sem parar o trabalho"}], "pegadinhas": [{"t": "Assinar a nota no recebimento provisório não é aceitar o material. A aceitação é o recebimento definitivo.", "ponto": 0}, {"t": "Classe A tem poucos itens e muito valor. Não é o item mais pedido nem o mais crítico (criticidade é XYZ).", "ponto": 3}, {"t": "Em Fenili, estoque mínimo e estoque de segurança são a mesma coisa. Estoque máximo = ES + lote de compra (p. 50).", "ponto": 9}, {"t": "Kummer recomenda que o inventário seja contado por pessoas de outras áreas, e no mínimo uma vez por ano (aula 17, p. 101 e 102).", "ponto": 11}], "links": [{"rotulo": "Fenili, Gestão de materiais (ENAP)", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"rotulo": "Kummer, Gestão de estoques (IFPR)", "url": "https://efivest.com.br/wp-content/uploads/2018/09/gestaodeestoques.pdf"}]}]</script>

l Assistencial III (Suprimentos/Farmácia)", "sub": "HCPA · Edital 03/2024 · PS 29", "url": "provas/p2024-03-ps29.pdf", "origem": "https://portalfaurgs.com.br/LerArquivo/52da05c9-9df3-4f70-9afc-e4a82abc7db3", "gab": "EDCDCADDCECEDACDEBCACCBEBABBABDEEADBBAAE", "blocos": [["SUS: objetivos, princípios e diretrizes", [15, 39]], ["Ética do servidor (Decreto 1.171/1994)", [19]], ["Segurança do paciente", [25, 29]], ["Gestão de materiais e almoxarifado", [32, 38]], ["NR-32", [40]]], "nota": "Única com gestão de materiais de hospital (ciclo de compras, inventário), mais SUS, ética, metas de segurança do paciente e NR-32; o resto é farmácia."}}</script>
<script>
(function () {
  const Q = JSON.parse(document.getElementById('questoes').textContent);
  const BYID = Object.fromEntries(Q.map(q => [q.id, q]));
  const MATERIAS = ['Português', 'Informática', 'Raciocínio Lógico', 'Conhecimentos Específicos'];
  // Composição da prova escrita do PS 32, item 13 do Edital 04/2026.
  const OFICIAL = { 'Português': 5, 'Informática': 5, 'Raciocínio Lógico': 5, 'Conhecimentos Específicos': 25 };
  const L = 'ABCDE';
  const KEY = 'hcpa-ps32-v1';
  const RES = JSON.parse(document.getElementById('resumos').textContent);
  const RESID = Object.fromEntries(RES.map(r => [r.id, r]));
  const VID = JSON.parse(document.getElementById('videos').textContent);
  const RES_DO_TEMA = Object.fromEntries(RES.filter(r => r.tema !== 'Informática' && r.tema !== 'Raciocínio Lógico').map(r => [r.tema, r.id]));
  function idsDoResumo(rid) {
    const r = RESID[rid];
    if (!r) return [];
    return Q.filter(q => q.sub ? q.sub === rid : (RES_DO_TEMA[q.tema] === rid)).map(q => q.id);
  }
  // Ordem pensada para quem tem pouco tempo: alterna as matérias que eliminam (Informática e Lógico, mínimo de 2 acertos)
  // com os específicos que mais caíram na prova de 2023. As marcadas como essenciais bastam se o tempo apertar.
  const PLANO = [
    { id: 'm01', res: ['rl-contas'], ess: true },
    { id: 'm02', res: ['lgpd'], ess: true, det: 'Assunto novo para você. Vá com calma: leia os grupos um de cada vez.' },
    { id: 'm03', res: ['info-planilhas'], ess: true },
    { id: 'm04b', res: ['etica'], ess: true, det: 'Você conhece um pouco. Foque nos deveres, nas vedações e na pena da Comissão de Ética.' },
    { id: 'm05', res: ['rl-logica'], ess: true },
    { id: 'm06', res: ['seg-paciente'], ess: true },
    { id: 'm07', res: ['info-seguranca'], ess: true },
    { id: 'm08b', res: ['humaniza'], ess: true, det: 'Você já conhece a ideia. Foque em como a política é organizada: princípios, método, diretrizes e dispositivos.' },
    { id: 'm09', prova: 'p2023', titulo: 'Prova real de 2023', det: 'Comece pelas questões 27 a 40 (específicos). Se der tempo, faça de 16 a 26. Dá para fazer em dois dias.', min: 60 },
    { id: 'm10b', res: ['direitos'] },
    { id: 'm11', res: ['info-docs-drive'], ess: true },
    { id: 'm12', res: ['eca'] },
    { id: 'm13', res: ['rl-sequencias'], ess: true },
    { id: 'm14', res: ['idosa', 'lbi'] },
    { id: 'm15', res: ['materiais'] },
    { id: 'm16', res: ['injuria', 'ans', 'cnv'] },
    { id: 'm17b', res: ['nr32', 'sus'], det: 'Revisão rápida do que você já conhece.' },
    { id: 'm17c', res: ['lgpd', 'etica'], modo: 'testar', ess: true, titulo: 'Revisão: LGPD e ética no Me testar', det: 'Os dois assuntos que você menos conhecia, agora tentando lembrar sem ler.' },
    { id: 'm18', acao: 'simulado', titulo: 'Simulado de 40 questões', det: 'Como no dia da prova: 40 questões, correção no final.', min: 90, ess: true },
    { id: 'm19', acao: 'erros', titulo: 'Refazer as que errei', det: 'Só as questões que ficaram erradas.', min: 30, ess: true }
  ].map(m => {
    const rs = (m.res || []).filter(id => RESID[id]);
    const ids = rs.flatMap(idsDoResumo);
    return { ...m, res: rs, ids,
      titulo: m.titulo || rs.map(id => RESID[id].titulo || RESID[id].tema).join(' + '),
      min: m.min || rs.reduce((s, id) => s + (RESID[id].minutos || 5), 0) + Math.ceil(ids.length * 1.5) };
  }).filter(m => m.prova || m.acao || m.res.length);
  // Gabaritos após recursos publicados pela FAURGS; '*' marca questão anulada (ponto para todos).
  const PROVAS = {
    p2023: {
      titulo: 'Prova de 2023', sub: 'HCPA · Edital 02/2023 · PS 07 · Assistente Administrativo II',
      url: 'provas/2023-ps07-assistente-administrativo-ii.pdf',
      origem: 'https://portalfaurgs.com.br/LerArquivo/5e230bea-c692-4a4a-8112-12c0e8fd2a4f',
      gab: 'DCECDBAAEDCBABAECECBDABDCABBDDBDACDADEBC',
      blocos: [['Português', 1, 15], ['Matemática', 16, 20], ['Raciocínio Lógico', 21, 26], ['Conhecimentos Específicos', 27, 40]],
      nota: 'Os específicos (27 a 40) cobram SUS, LGPD, NR-32, HumanizaSUS, ética do servidor e segurança do paciente, que também estão no edital deste ano.'
    },
    p2015: {
      titulo: 'Prova de 2015', sub: 'HCPA · Edital 04/2015 · PS 34 · Assistente Administrativo II',
      url: 'provas/2015-ps34-assistente-administrativo-ii.pdf',
      origem: 'https://www.estudegratis.com.br/images/provas/35801-faurgs-2015-hcpa-assistente-administrativo-ii-prova.pdf',
      gab: 'CDBEBDACADCBEE*BABCDBEADEEADCCBCBDACDEAABCDEABD*DB',
      blocos: [['Português', 1, 15], ['Matemática e Raciocínio Lógico', 16, 25], ['Conhecimentos Específicos', 26, 50]],
      nota: 'Mais antiga: parte dos específicos é sobre atendimento ao público, que saiu do edital. SUS, HumanizaSUS, NR-32 e segurança do paciente continuam.'
    }
  };
  Object.assign(PROVAS, JSON.parse(document.getElementById('provas').textContent));
  // Questões reais por assunto: { 'LGPD': [{ pid, nums }] }, das provas extras.
  const REAIS = {};
  for (const [pid, p] of Object.entries(PROVAS)) {
    if (!p.extra) continue;
    for (const [nome, nums] of p.blocos) (REAIS[nome] = REAIS[nome] || []).push({ pid, nums });
  }
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const navIn = document.getElementById('nav-in');

  let store = { res: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.res) store = s; } catch (e) {}
  function salvar() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function registrar(id, ok) {
    const r = store.res[id] || { n: 0, acertos: 0 };
    r.n += 1; if (ok) r.acertos += 1; r.ok = ok;
    store.res[id] = r; salvar();
  }

  let S = null;       // sessão em andamento
  let confirmar = null; // { msg, sim, rotuloSim }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function idsDa(materia) { return Q.filter(q => q.materia === materia).map(q => q.id); }

  function temas() {
    const m = new Map();
    for (const q of Q) {
      const k = q.materia + '|' + q.tema;
      if (!m.has(k)) m.set(k, { materia: q.materia, tema: q.tema, ids: [] });
      m.get(k).ids.push(q.id);
    }
    return [...m.values()].sort((a, b) => MATERIAS.indexOf(a.materia) - MATERIAS.indexOf(b.materia));
  }

  function diasAteProva() {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    return Math.round((new Date(2026, 11, 13) - hoje) / 86400000);
  }

  // ---------- Plano ----------
  function feitas() { store.plano = store.plano || {}; return store.plano; }
  function marcarFeita(mid) { if (mid && !feitas()[mid]) { feitas()[mid] = new Date().toISOString().slice(0, 10); salvar(); } }
  // Sugere a próxima tarefa não feita; se faltam mais tarefas que dias, pula as não essenciais.
  function proximaMissao() {
    const f = feitas();
    const resto = PLANO.filter(m => !f[m.id]);
    if (!resto.length) return null;
    const apertado = resto.length > Math.max(diasAteProva(), 0);
    return { m: (apertado && resto.find(m => m.ess)) || resto[0], apertado, resto: resto.length };
  }
  function passosDa(m) {
    if (m.prova) return [`Abrir a prova e marcar as respostas na folha daqui`, `Corrigir e ver o que errou`];
    if (m.acao === 'simulado') return ['Responder as 40 questões', 'Entregar e ver a nota'];
    if (m.acao === 'erros') return ['Refazer só as questões erradas'];
    if (m.modo === 'testar') return ['Abrir os resumos em "Me testar" e tentar lembrar cada palavra escondida', `Fazer ${m.ids.length} questões com correção na hora`];
    return [`Ler ${m.res.length > 1 ? 'os resumos' : 'o resumo'} (${m.res.reduce((s, id) => s + (RESID[id].minutos || 5), 0)} min)`, `Fazer ${m.ids.length} questões com correção na hora`];
  }
  function abrirMissao(mid) {
    R = null;
    const m = PLANO.find(x => x.id === mid);
    if (!m) return;
    if (m.prova) { F = { pid: m.prova, missao: m.id }; S = null; confirmar = null; folha(); return; }
    if (m.acao === 'simulado') { iniciar('simulado', 'Simulado de 40', montarSimulado()); S.missao = m.id; questao(); return; }
    if (m.acao === 'erros') {
      const ids = Object.keys(store.res).filter(id => BYID[id] && !store.res[id].ok);
      if (!ids.length) { marcarFeita(m.id); plano(); return; }
      iniciar('pratica', 'Refazer erros', ids); S.missao = m.id; questao(); return;
    }
    resumo(m.res, m.id);
    if (m.modo === 'testar') { R.modo = 'testar'; resumo(R.ids, null, false); }
  }
  function cartaoHoje() {
    const p = proximaMissao();
    const f = feitas();
    const barra = `<div class="passos-plano" aria-hidden="true">${PLANO.map(m => `<i class="${f[m.id] ? 'f' : ''}"></i>`).join('')}</div>`;
    const feitasN = PLANO.filter(m => f[m.id]).length;
    if (!p) return `<section class="hoje"><h2>Todas as ${PLANO.length} tarefas feitas</h2>${barra}
      <p>Daqui até a prova, faça simulados e refaça as que errou.</p></section>`;
    const m = p.m;
    return `<section class="hoje" aria-labelledby="t-hoje">
      <h2 id="t-hoje">${m.ess ? '<span class="estrela" aria-label="essencial">★</span> ' : ''}${esc(m.titulo)}</h2>
      <p class="meta">Tarefa de hoje · cerca de ${m.min} min</p>
      ${m.det ? `<p>${esc(m.det)}</p>` : ''}
      <ol>${passosDa(m).map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <div class="botoes">
        <button class="mini prim" data-act="missao" data-m="${m.id}">Começar</button>
        <button class="mini" data-act="plano">Ver o plano</button>
      </div>
      ${barra}
      <p class="nota">${feitasN} de ${PLANO.length} tarefas feitas. ${p.apertado
        ? 'Faltam mais tarefas do que dias: o plano agora sugere só as essenciais (★).'
        : 'Pulou um dia? Tudo bem, o plano segue de onde parou.'}</p>
    </section>`;
  }
  function plano() {
    S = null; F = null; confirmar = null;
    const f = feitas();
    const linhas = PLANO.map((m, i) => `<div class="pl ${f[m.id] ? 'feito' : ''}">
        <button class="ck" data-act="ck" data-m="${m.id}" aria-pressed="${f[m.id] ? 'true' : 'false'}" aria-label="${f[m.id] ? 'Desmarcar' : 'Marcar como feita'}: ${esc(m.titulo)}">${f[m.id] ? '✓' : ''}</button>
        <button class="abrir" data-act="missao" data-m="${m.id}">

  // ---------- Resumo ----------
  let R = null; // { ids, missao, modo: 'ler' | 'testar', teste: { 'rid:i': 'aberto' | 'sim' | 'nao' } }
  const ICONE = {
    ouvir: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',

  // Referência que não aponta para um artigo (ex.: "regra de matemática") não ajuda a conferir nada.
  const REF_GENERICA = /^regra d/i;
  function leiDoResumo(r) {
    const leis = (r.pontos || []).map(p => (p.fonte || '').split(',')[0].trim()).filter(l => l && !REF_GENERICA.test(l));

  function blocoResumo(r) {

      const mostraPega = !testar || st === 'sim' || st === 'nao';

  // ---------- Ouvir ----------
  // Cada ponto vira uma fala separada na fila, para não depender de uma fala longa única

  function falasDoResumo(rids) {

        if (soltas.length) linhas += linhaTema('Outras questões', soltas, `data-act="tema" data-tema="${esc(mat + '|' + mat)}"`);
      } else {
        const ts = temas().filter(t => t.materia === mat);
        if (!ts.length) continue;
        linhas = ts.map(t => RES_DO_TEMA[t.tema]
          ? linhaTema(t.tema, t.ids, `data-act="resumo" data-r="${esc(RES_DO_TEMA[t.tema])}"`)
          : linhaTema(t.tema, t.ids, `data-act="tema" data-tema="${esc(t.materia + '|' + t.tema)}"`)).join('');

    view.innerHTML = `
      <header class="topo">

              <tr><td>Conhecimentos específicos</td><td class="n">25</td><td class="n">–</td></tr>

      <div class="acoes">
        <button class="btn" data-act="simulado" ${temOficial ? '' : 'disabled'}>
          <span>Simulado de 40 questões<small>5 Português · 5 Informática · 5 Raciocínio Lógico · 25 Específicos, como na prova. Correção no final.</small></span><span class="seta">→</span>

        </button>
      </div>
      <section class="grupo" aria-labelledby="t-provas">
        <h2 id="t-provas">Provas reais da FAURGS</h2>
        <p class="nota">Questões de verdade da banca, de concursos anteriores do HCPA para o mesmo cargo. Você resolve no PDF e marca as respostas aqui. A página corrige pelo gabarito oficial.</p>
      </section>
      <div class="provas">${Object.entries(PROVAS).filter(([, p]) => !p.extra).map(([pid, p]) => {
        const f = (store.folhas || {})[pid];
        const ult = f && f.corrigida ? `<p class="nota">Última correção: ${contarFolha(pid, f.marcas).acertos} de ${p.gab.length}</p>` : f && Object.keys(f.marcas || {}).length ? `<p class="nota">${Object.keys(f.marcas).length} respostas marcadas, falta corrigir</p>` : '';
        return `<div class="prova-card">
          <span class="sub">${esc(p.sub)}</span>

          <div class="botoes">
            <a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir a prova (PDF)</a>
            <button class="mini prim" data-act="folha" data-p="${pid}">Marcar respostas</button>
          </div>
        </div>`;
      }).join('')}</div>
      ${Object.values(PROVAS).some(p => p.extra) ? `<details class="material mais-provas"><summary>Mais provas da banca para o HCPA (${Object.values(PROVAS).filter(p => p.extra).length})</summary>
        <p class="nota">Provas de outros cargos do HCPA, feitas pela FAURGS. A folha mostra só as questões que caem na sua prova; pule as outras.</p>
        <ul class="lista-provas">${Object.entries(PROVAS).filter(([, p]) => p.extra).map(([pid, p]) => {
          const f = (store.folhas || {})[pid], c = f && f.corrigida ? contarFolha(pid, f.marcas) : null;
          return `<li><button class="link-prova" data-act="folha" data-p="${pid}"><b>${esc(p.titulo)}</b><small>${numsDe(pid).length} questões úteis${c ? ` · última correção: ${c.acertos} de ${c.total}` : ''}</small></button></li>`;
        }).join('')}</ul></details>` : ''}
      <section class="grupo" aria-labelledby="t-temas">
        <h2 id="t-temas">Treinar por assunto</h2>
        <p class="nota">Os assuntos são os do conteúdo da prova escrita no edital. A barra mostra acertos (verde) e erros (vermelho) da última tentativa.</p>
      </section>
      ${grupos}
      <details class="material">
        <summary>Material oficial para estudar</summary>
        <ul>
          <li><a href="https://portalfaurgs.com.br/LerArquivo/19c9cb82-a209-4830-8cd8-24e43fc55b45" target="_blank" rel="noopener">Edital 04/2026 completo (FAURGS)</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm" target="_blank" rel="noopener">Lei 8.080/1990 (SUS)</a></li>
          <li><a href="https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/" target="_blank" rel="noopener">HumanizaSUS: documento base</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf" target="_blank" rel="noopener">Carta dos Direitos dos Usuários da Saúde</a></li>
          <li><a href="https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf" target="_blank" rel="noopener">Carta de direitos e deveres do paciente do HCPA</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm" target="_blank" rel="noopener">ECA, Lei 8.069/1990</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm" target="_blank" rel="noopener">Estatuto da Pessoa Idosa, Lei 10.741/2003</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm" target="_blank" rel="noopener">Lei Brasileira de Inclusão, Lei 13.146/2015</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm" target="_blank" rel="noopener">Injúria racial, Lei 14.532/2023</a></li>
          <li><a href="https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf" target="_blank" rel="noopener">Guia ANS de Diversidade e Inclusão</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm" target="_blank" rel="noopener">LGPD, Lei 13.709/2018</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm" target="_blank" rel="noopener">Código de Ética do servidor, Decreto 1.171/1994</a></li>
          <li><a href="https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf" target="_blank" rel="noopener">NR-32</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html" target="_blank" rel="noopener">RDC 36/2013 (segurança do paciente)</a> e <a href="https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html" target="_blank" rel="noopener">Portaria 529/2013</a></li>
          <li><a href="https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content" target="_blank" rel="noopener">Gestão de materiais (Fenili, ENAP)</a> e <a href="https://efivest.com.br/wp-content/uploads/2018/09/gestaodeestoques.pdf" target="_blank" rel="noopener">Gestão de estoques (Kummer)</a></li>
          <li><a href="https://cartilha.cert.br/" target="_blank" rel="noopener">Cartilha de Segurança para Internet (cert.br)</a></li>
        </ul>
      </details>
      <p class="nota">As questões de "Treinar por assunto" e dos simulados foram escritas a partir das leis e documentos que o edital indica. Não são questões da FAURGS. Cada resposta mostra o artigo ou trecho de onde saiu, para conferir. As questões da banca são as das provas reais acima.</p>
      <div class="linha-acoes">
        <p class="nota">Seu progresso fica salvo só neste aparelho.</p>
        ${resp.length ? (confirmarZerar
          ? `<span class="nota">Apagar todo o progresso?</span><button class="link-btn" data-act="zerar-sim">Sim, apagar</button><button class="link-btn" data-act="zerar-nao">Cancelar</button>`
          : `<button class="link-btn" data-act="zerar">Zerar progresso</button>`) : ''}
      </div>`;
    nav.hidden = true;
  }
  let confirmarZerar = false;

  // ---------- Sessões ----------
  function iniciar(modo, titulo, ids) {
    confirmarZerar = false;
    S = { modo, titulo, ids, i: 0, resp: {}, entregue: false };
    confirmar = null;
    questao();
  }
  function montarSimulado() {
    let ids = [];
    for (const m of MATERIAS) {
      let sorteadas = embaralhar(idsDa(m)).slice(0, OFICIAL[m]);
      // Questões de Português que dividem o mesmo texto ficam juntas.
      if (m === 'Português') sorteadas.sort((a, b) => (BYID[b].texto ? 1 : 0) - (BYID[a].texto ? 1 : 0));
      ids = ids.concat(sorteadas);
    }
    return ids;
  }

  // ---------- Questão ----------
  function questao() {
    const id = S.ids[S.i], q = BYID[id];
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    const escolhida = S.resp[id];
    const revelado = !simuladoAberto && (escolhida != null || S.entregue);

    const opcoes = q.alternativas.map((a, k) => {
      let cls = 'opt';
      if (revelado) cls += k === q.correta ? ' certa' : k === escolhida ? ' errada' : ' apagada';
      else if (k === escolhida) cls += ' marcada';
      const estado = revelado ? (k === q.correta ? ' (resposta certa)' : k === escolhida ? ' (sua resposta)' : '') : (k === escolhida ? ' (marcada)' : '');
      return `<button class="${cls}" data-act="marcar" data-k="${k}" ${revelado ? 'disabled' : ''} aria-label="Alternativa ${L[k]}${estado}"><span class="bolha" aria-hidden="true">${L[k]}</span><span class="txt">${esc(a)}</span></button>`;
    }).join('');

    let fb = '';
    if (revelado) {
      const ok = escolhida === q.correta;
      const ver = escolhida == null ? `Em branco. Resposta: letra ${L[q.correta]}` : ok ? 'Certa!' : `Errou. Resposta: letra ${L[q.correta]}`;
      fb = `<section class="feedback ${ok ? 'ok' : 'bad'}">
        <p class="veredito">${ver}</p>
        ${q.explicacao ? `<p>${esc(q.explicacao)}</p>` : ''}
        ${q.fundamento ? `<blockquote>${esc(q.fundamento)}</blockquote>` : ''}
        ${q.fonte ? `<p class="fonte">Fonte: ${esc(q.fonte)}${q.url ? ` · <a href="${esc(q.url)}" target="_blank" rel="noopener">abrir</a>` : ''}</p>` : ''}
      </section>`;
    }

    const pct = 100 * (S.i + 1) / S.ids.length;
    view.innerHTML = `
      <div class="barra-sup">
        <button class="sair" data-act="sair">← Sair</button>
        <span class="pos">${S.i + 1} / ${S.ids.length}</span>
      </div>
      <div class="progresso" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <article class="questao">
        <div class="linha-acoes"><span class="num">Questão ${S.i + 1}</span><span class="chip">${esc(q.materia === q.tema ? q.materia : q.tema)}</span><span class="origem">Treino · escrita para o simulado, não é da banca</span></div>
        ${q.texto ? `<details class="texto" open><summary>Texto de apoio</summary><p>${esc(q.texto)}</p></details>` : ''}
        <p class="enunciado">${esc(q.enunciado)}</p>
        ${q.itens && q.itens.length ? `<ul class="itens">${q.itens.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        <div class="opcoes">${opcoes}</div>
        ${fb}
      </article>`;
    barraNav();
  }

  function barraNav() {
    nav.hidden = false;
    const ultimo = S.i === S.ids.length - 1;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p>
        <button class="nb" data-act="conf-nao">Voltar</button>
        <button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
      return;
    }
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    let prox;
    if (simuladoAberto) prox = ultimo ? `<button class="nb prim" data-act="entregar">Entregar</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else if (S.modo === 'simulado') prox = ultimo ? `<button class="nb prim" data-act="resultado">Ver resultado</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else prox = ultimo ? `<button class="nb prim" data-act="fim">Concluir</button>` : `<button class="nb prim" data-act="prox">${S.resp[S.ids[S.i]] == null ? 'Pular' : 'Próxima'}</button>`;
    const extra = simuladoAberto && !ultimo ? `<button class="nb" data-act="entregar">Entregar</button>` : '';
    navIn.innerHTML = `<button class="nb" data-act="ant" ${S.i === 0 ? 'disabled' : ''}>Anterior</button>${extra}${prox}`;
  }

  function entregar() {
    S.entregue = true;
    marcarFeita(S.missao);
    for (const id of S.ids) if (S.resp[id] != null) registrar(id, S.resp[id] === BYID[id].correta);
    resultado();
  }

  // ---------- Resultado ----------
  function resultado() {
    confirmar = null;
    const ids = S.ids;
    const certa = id => S.resp[id] === BYID[id].correta;
    const acertos = ids.filter(certa).length;
    const porMat = MATERIAS.map(m => {
      const xs = ids.filter(id => BYID[id].materia === m);
      return { m, total: xs.length, ok: xs.filter(certa).length };
    }).filter(x => x.total);

    let edital = '';
    if (S.modo === 'simulado') {
      const nota = acertos * 0.25;
      const faltas = porMat.filter(x => x.m !== 'Conhecimentos Específicos' && x.ok < 2).map(x => x.m);
      const passa = nota >= 6 && !faltas.length;
      const motivos = [];
      if (nota < 6) motivos.push(`nota ${nota.toFixed(2).replace('.', ',')}, abaixo de 6,00 (faltaram ${24 - acertos} acertos)`);
      if (faltas.length) motivos.push(`menos de 2 acertos em ${faltas.length > 1 ? faltas.slice(0, -1).join(', ') + ' e ' + faltas[faltas.length - 1] : faltas[0]}`);
      edital = `<div class="veredito-edital ${passa ? 'ok' : 'bad'}">
        <h2>${passa ? 'Passaria dos mínimos do edital' : 'Ficaria abaixo dos mínimos do edital'}</h2>
        <p>${passa ? 'Nota de pelo menos 6,00 e no mínimo 2 acertos em Português, Informática e Raciocínio Lógico.' : 'Motivo: ' + esc(motivos.join('; ')) + '.'}</p>
        <p class="nota">O mínimo só evita a eliminação. A classificação depende das notas das demais pessoas inscritas e da prova de títulos.</p>
      </div>`;
    }

    const notaTxt = S.modo === 'simulado' ? `<p>Nota ${(acertos * 0.25).toFixed(2).replace('.', ',')} de 10,00 (cada questão vale 0,25)</p>` : '';
    let fechamento = '';
    if (S.missao && feitas()[S.missao]) {
      const prox = proximaMissao();
      const nFeitas = PLANO.filter(m => feitas()[m.id]).length;
      fechamento = `<section class="feito" aria-live="polite">
        <h2>✓ Tarefa feita</h2>
        <p>${nFeitas} de ${PLANO.length} tarefas do plano. ${prox ? `Próxima: <b>${esc(prox.m.titulo)}</b>, cerca de ${prox.m.min} min.` : 'Era a última. Daqui até a prova, simulados e revisão.'}</p>
        ${ids.some(id => !certa(id)) ? '<p class="nota">Errou alguma? Ela fica guardada em "Refazer as que errei" para revisar depois.</p>' : ''}
      </section>`;
    }
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${esc(S.titulo)}</span></div>
      ${fechamento}
      <section class="placar">
        <span class="chip">Resultado</span>
        <span class="grande">${acertos} / ${ids.length}</span>
        ${notaTxt}
      </section>
      ${edital}
      <table class="tabela">
        <thead><tr><th>Matéria</th><th class="n">Acertos</th></tr></thead>
        <tbody>${porMat.map(x => `<tr><td>${esc(x.m)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody>
      </table>
      <section class="grupo">
        <h2>Revisar questão por questão</h2>
        <div class="revisao">${ids.map((id, i) => {
          const r = S.resp[id];
          const cls = r == null ? 'branco' : certa(id) ? 'ok' : 'bad';
          const marca = r == null ? '–' : L[r];
          return `<button data-act="rever" data-i="${i}"><span class="marca ${cls}" aria-label="${cls === 'ok' ? 'certa' : cls === 'bad' ? 'errada' : 'em branco'}">${marca}</span><span class="resumo">${i + 1}. ${esc(BYID[id].tema)}: ${esc(BYID[id].enunciado)}</span></button>`;
        }).join('')}</div>
      </section>`;
    nav.hidden = false;
    const temErro = ids.some(id => !certa(id));
    navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button>${temErro ? `<button class="nb prim" data-act="refazer">Refazer erradas</button>` : ''}`;
    window.scrollTo(0, 0);
  }

  // ---------- Folha de respostas das provas reais ----------
  let F = null; // { pid, so }
  function chaveF(pid, so) { return so ? pid + '|' + so : pid; }
  function folhaDe(chave) {
    store.folhas = store.folhas || {};
    store.folhas[chave] = store.folhas[chave] || { marcas: {}, corrigida: false };
    return store.folhas[chave];
  }
  function blocosDe(pid, so) {
    const lista = PROVAS[pid].blocos.map(bl => [bl[0], Array.isArray(bl[1]) ? bl[1] : Array.from({ length: bl[2] - bl[1] + 1 }, (_, i) => bl[1] + i)]);
    return so ? lista.filter(bl => bl[0] === so) : lista;
  }
  function numsDe(pid, so) { return blocosDe(pid, so).flatMap(bl => bl[1]); }
  function contarFolha(pid, marcas, so) {
    const p = PROVAS[pid];
    const por = blocosDe(pid, so).map(([nome, nums]) => {
      let ok = 0;
      for (const n of nums) { const g = p.gab[n - 1]; if (g === '*' || L[marcas[n]] === g) ok++; }
      return { nome, total: nums.length, ok };
    });
    return { por, acertos: por.reduce((s, x) => s + x.ok, 0), total: por.reduce((s, x) => s + x.total, 0) };
  }
  function faixas(nums) {
    const out = [];
    for (let i = 0; i < nums.length; i++) {
      let j = i;
      while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
      out.push(j > i ? nums[i] + ' a ' + nums[j] : String(nums[i]));
      i = j;
    }
    return out.join(', ');
  }
  function folha() {
    const p = PROVAS[F.pid], f = folhaDe(chaveF(F.pid, F.so));
    const nums = numsDe(F.pid, F.so);
    const marcadas = nums.filter(n => f.marcas[n] != null).length;
    let topo = '';
    if (f.corrigida) {
      const c = contarFolha(F.pid, f.marcas, F.so);
      topo = `<section class="placar"><span class="chip">Resultado</span><span class="grande">${c.acertos} / ${c.total}</span>
        ${p.gab.includes('*') ? '<p class="nota">Questão anulada conta ponto para todo mundo, como na prova.</p>' : ''}</section>
        <table class="tabela"><thead><tr><th>Parte</th><th class="n">Acertos</th></tr></thead>
        <tbody>${c.por.map(x => `<tr><td>${esc(x.nome)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody></table>
        <p class="nota">Verde cheio: você acertou. Vermelho: você errou, e a certa aparece com contorno verde.</p>`;
    } else {
      topo = `${F.so ? `<p class="aviso">Só as questões de <b>${esc(F.so)}</b>: ${faixas(nums)}. Pule as outras.</p>` : ''}<p class="aviso">Abra a prova, resolva no papel ou na tela e marque aqui. Este PDF não tem a folha de gabarito: a correção acontece só quando você tocar em Corrigir.</p>
        <div class="botoes"><a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir a prova (PDF)</a></div>
        <p class="nota">Prova original da FAURGS, sem a primeira página (o gabarito). <a href="${esc(p.origem)}" target="_blank" rel="noopener">Arquivo completo</a>.</p>`;
    }
    const blocos = blocosDe(F.pid, F.so).map(([nome, lista]) => {
      let linhas = '';
      for (const n of lista) {
        const g = p.gab[n - 1], m = f.marcas[n];
        const bs = [0, 1, 2, 3, 4].map(k => {
          let cls = 'b', extra = '';
          if (f.corrigida && g !== '*') {
            if (m === k) cls += L[k] === g ? ' certa' : ' errada';
            else if (L[k] === g) cls += ' gab';
          } else if (m === k) extra = ' aria-pressed="true"';
          if (!f.corrigida && m !== k) extra = ' aria-pressed="false"';
          return `<button class="${cls}" data-act="fm" data-n="${n}" data-k="${k}"${extra} ${f.corrigida ? 'disabled' : ''} aria-label="Questão ${n}, alternativa ${L[k]}">${L[k]}</button>`;
        }).join('');
        const obs = f.corrigida && g === '*' ? '<span class="obs">Anulada: ponto para todos</span>' : '';
        linhas += `<div class="lf"><span class="nq">${String(n).padStart(2, '0')}</span><div class="bs">${bs}</div>${obs}</div>`;
      }
      return `<div class="bloco"><h3>${esc(nome)} · ${faixas(lista)}</h3><div class="linhas">${linhas}</div></div>`;
    }).join('');
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${marcadas} / ${nums.length} marcadas</span></div>
      <header class="topo"><span class="sub chip">${esc(p.sub)}</span><h1>${esc(p.titulo)}</h1></header>
      ${topo}
      <div class="folha">${blocos}</div>`;
    nav.hidden = false;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p><button class="nb" data-act="conf-nao">Voltar</button><button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
    } else if (f.corrigida) {
      navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button><button class="nb prim" data-act="folha-refazer">Fazer de novo</button>`;
    } else {
      navIn.innerHTML = `<button class="nb" data-act="folha-limpar" ${marcadas ? '' : 'disabled'}>Apagar marcações</button><button class="nb prim" data-act="folha-corrigir">Corrigir</button>`;
    }
  }

  // ---------- Eventos ----------
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const rolar = () => window.scrollTo(0, 0);
    if (act !== 'ouvir') pararFala();
    if (!['ouvir', 'revelar', 'lembrei', 'modo'].includes(act)) guardarPosicao();
    switch (act) {
      case 'simulado': iniciar('simulado', 'Simulado de 40', montarSimulado()); rolar(); break;
      case 'rapida': iniciar('pratica', 'Rodada rápida', embaralhar(Q.map(q => q.id)).slice(0, 10)); rolar(); break;
      case 'erros': iniciar('pratica', 'Refazer erros', Object.keys(store.res).filter(id => BYID[id] && !store.res[id].ok)); rolar(); break;
      case 'tema': {
        const t = temas().find(t => t.materia + '|' + t.tema === el.dataset.tema);
        if (t) { iniciar('pratica', t.tema, t.ids.slice()); rolar(); }
        break;
      }
      case 'marcar': {
        const id = S.ids[S.i], k = Number(el.dataset.k);
        S.resp[id] = k;
        if (S.modo !== 'simulado') registrar(id, k === BYID[id].correta);
        questao();
        break;
      }
      case 'prox': if (S.i < S.ids.length - 1) { S.i++; questao(); rolar(); } break;
      case 'ant': if (S.i > 0) { S.i--; questao(); rolar(); } break;
      case 'entregar': {
        const brancos = S.ids.filter(id => S.resp[id] == null).length;
        if (brancos) { confirmar = { msg: `${brancos} ${brancos === 1 ? 'questão está' : 'questões estão'} em branco. Entregar assim mesmo?`, sim: 'entregar-ja', rotuloSim: 'Entregar' }; barraNav(); }
        else entregar();
        break;
      }
      case 'sair': {
        if (S.modo === 'simulado' && !S.entregue && Object.keys(S.resp).length) {
          confirmar = { msg: 'Sair sem entregar? As respostas deste simulado não serão salvas.', sim: 'inicio', rotuloSim: 'Sair' };
          barraNav();
        } else if ((S.modo === 'simulado' && S.entregue) || S.modo === 'pratica-fim') { resultado(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'conf-nao': confirmar = null; if (F) folha(); else barraNav(); break;
      case 'conf-sim': {
        const alvo = confirmar.sim; confirmar = null;
        if (alvo === 'entregar-ja') entregar();
        else if (alvo === 'folha-corrigir-ja') { folhaDe(chaveF(F.pid, F.so)).corrigida = true; marcarFeita(F.missao); salvar(); folha(); rolar(); }
        else if (alvo === 'folha-limpar-ja') { folhaDe(chaveF(F.pid, F.so)).marcas = {}; salvar(); folha(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'folha': F = { pid: el.dataset.p, so: el.dataset.so || null }; S = null; R = null; confirmar = null; folha(); rolar(); break;
      case 'fm': {
        const f = folhaDe(chaveF(F.pid, F.so)), n = Number(el.dataset.n), k = Number(el.dataset.k);
        if (f.marcas[n] === k) delete f.marcas[n]; else f.marcas[n] = k;
        salvar(); folha();
        break;
      }
      case 'folha-corrigir': {
        const f = folhaDe(chaveF(F.pid, F.so)), faltam = numsDe(F.pid, F.so).filter(n => f.marcas[n] == null).length;
        if (faltam) { confirmar = { msg: `${faltam} ${faltam === 1 ? 'questão está' : 'questões estão'} sem marcação. Corrigir assim mesmo?`, sim: 'folha-corrigir-ja', rotuloSim: 'Corrigir' }; folha(); }
        else { f.corrigida = true; marcarFeita(F.missao); salvar(); folha(); rolar(); }
        break;
      }
      case 'folha-limpar': confirmar = { msg: 'Apagar todas as marcações desta prova?', sim: 'folha-limpar-ja', rotuloSim: 'Apagar' }; folha(); break;
      case 'folha-refazer': store.folhas[chaveF(F.pid, F.so)] = { marcas: {}, corrigida: false }; salvar(); folha(); rolar(); break;
      case 'fim': S.modo = 'pratica-fim'; marcarFeita(S.missao); resultado(); break;
      case 'missao': abrirMissao(el.dataset.m); if (!view.querySelector('.resumo')) rolar(); break;
      case 'plano': plano(); rolar(); break;
      case 'ck': {
        const f = feitas(), mid = el.dataset.m;
        if (f[mid]) delete f[mid]; else f[mid] = new Date().toISOString().slice(0, 10);
        salvar(); plano();
        break;
      }
      case 'resumo': R = null; resumo([el.dataset.r]); break;
      case 'modo': guardarPosicao(); R.modo = el.dataset.v; resumo(R.ids, null, R.modo === 'ler'); if (R.modo === 'testar') rolar(); break;
      case 'revelar': R.teste[el.dataset.k] = 'aberto'; resumo(R.ids, null, true); break;
      case 'lembrei': marcarTeste(el.dataset.k, el.dataset.v); break;
      case 'resumo-questoes': {
        const ids = R.ids.flatMap(idsDoResumo), missao = R.missao;
        const nome = R.ids.map(id => RESID[id].titulo || RESID[id].tema).join(' + ');
        iniciar('pratica', nome, ids); S.missao = missao; R = null; rolar();
        break;
      }
      case 'titulos': titulos(); rolar(); break;
      case 'ouvir': ouvir(el); break;
      case 'resultado': resultado(); break;
      case 'rever': S.i = Number(el.dataset.i); questao(); rolar(); break;
      case 'refazer': iniciar('pratica', 'Refazer erradas', S.ids.filter(id => S.resp[id] !== BYID[id].correta)); rolar(); break;
      case 'inicio': inicio(); rolar(); break;
      case 'zerar': confirmarZerar = true; inicio(); break;
      case 'zerar-nao': confirmarZerar = false; inicio(); break;
      case 'zerar-sim': store = { res: {} }; salvar(); confirmarZerar = false; inicio(); break;
    }
  });

  // Mantém a sessão aberta quando a página é atualizada enquanto ela estuda.
  function start(data) {
    if (data && data.S && data.S.ids && data.S.ids.every(id => BYID[id])) {
      S = data.S;
      if (S.modo === 'pratica-fim' || (S.modo === 'simulado' && S.entregue && data.tela === 'resultado')) resultado(); else questao();
    } else inicio();
  }
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S, tela: view.querySelector('.placar') ? 'resultado' : 'questao' }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
