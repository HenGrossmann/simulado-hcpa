previsto na NR-07.”", "fonte": "NR-32, itens 32.2.4.3.2, 32.2.4.6.1, 32.2.4.17.1 e 32.2.4.17.6", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "seg-01", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "De acordo com as definições da Resolução RDC Anvisa nº 36/2013, evento adverso é", "alternativas": ["o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde.", "o comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo, incluindo doenças, lesão, sofrimento, morte, incapacidade ou disfunção.", "qualquer incidente notificado ao Núcleo de Segurança do Paciente, com ou sem dano.", "a redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde.", "o incidente que resulta em dano à saúde."], "correta": 4, "explicacao": "Evento adverso é o incidente que resulta em dano (art. 3º, IV). As alternativas A, B e D trazem, respectivamente, as definições de incidente, dano e segurança do paciente; C inventa um critério baseado na notificação.", "fundamento": "Art. 3º: “III - dano: comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo [...]; IV - evento adverso: incidente que resulta em dano à saúde; [...] VII - incidente: evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde; [...] X - segurança do paciente: redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde;”", "fonte": "RDC Anvisa 36/2013, art. 3º, III, IV, VII e X", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-02", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Resolução RDC Anvisa nº 36/2013.\n\nA notificação dos eventos adversos deve ser realizada ________ pelo NSP, até o ________ dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Os eventos adversos que evoluírem para óbito devem ser notificados em até ________ a partir do ocorrido.", "alternativas": ["semanalmente – 5º – 24 horas", "mensalmente – 15º – 72 horas", "mensalmente – 10º – 48 horas", "trimestralmente – 15º – 72 horas", "mensalmente – 15º – 7 dias"], "correta": 1, "explicacao": "O art. 10 fixa notificação mensal, até o 15º dia útil do mês seguinte, e prazo de 72 horas para eventos que evoluíram para óbito. As alternativas D e E acertam dois termos e trocam um.", "fundamento": "“Art. 10 A notificação dos eventos adversos, para fins desta Resolução, deve ser realizada mensalmente pelo NSP, até o 15º (décimo quinto) dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Parágrafo único - Os eventos adversos que evoluírem para óbito devem ser notificados em até 72 (setenta e duas) horas a partir do ocorrido.”", "fonte": "RDC Anvisa 36/2013, art. 10 e parágrafo único", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-03", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Sobre o Núcleo de Segurança do Paciente (NSP) e a abrangência da Resolução RDC Anvisa nº 36/2013, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – A direção do serviço de saúde deve constituir o NSP e nomear a sua composição, podendo utilizar a estrutura de comitês, comissões, gerências, coordenações ou núcleos já existentes para o desempenho de suas atribuições.", "II – A Resolução aplica-se também aos consultórios individualizados e aos laboratórios clínicos.", "III – Compete ao NSP notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I reproduz o art. 4º e seu § 1º; III reproduz o art. 7º, XI. II é falsa: o parágrafo único do art. 2º exclui do escopo os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar.", "fundamento": "“Art. 2º [...] Parágrafo único. Excluem-se do escopo desta Resolução os consultórios individualizados, laboratórios clínicos e os serviços móveis e de atenção domiciliar.” “Art. 7º Compete ao NSP: [...] XI - notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde;”", "fonte": "RDC Anvisa 36/2013, art. 2º, parágrafo único; art. 4º, caput e § 1º; art. 7º, XI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-04", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Com base na Portaria GM/MS nº 529/2013, que institui o Programa Nacional de Segurança do Paciente (PNSP), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A cultura de segurança prioriza a segurança acima de metas financeiras e operacionais.", "( ) A cultura de segurança encoraja e recompensa a identificação, a notificação e a resolução dos problemas relacionados à segurança.", "( ) Uma das estratégias de implementação do PNSP é a promoção da cultura de segurança com ênfase nos processos de responsabilização individual dos profissionais.", "( ) Incidente é o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário ao paciente."], "alternativas": ["V – F – F – V", "F – V – F – V", "V – V – F – V", "V – V – V – F", "V – V – V – V"], "correta": 2, "explicacao": "O primeiro e o segundo itens são características da cultura de segurança (art. 4º, V, “b” e “c”), e o quarto é a definição de incidente (art. 4º, III). O terceiro inverte o art. 5º, VI, que enfatiza sistemas seguros, “evitando-se” a responsabilização individual.", "fundamento": "Art. 5º: “VI - promoção da cultura de segurança com ênfase no aprendizado e aprimoramento organizacional, engajamento dos profissionais e dos pacientes na prevenção de incidentes, com ênfase em sistemas seguros, evitando-se os processos de responsabilização individual;”", "fonte": "Portaria GM/MS 529/2013, art. 4º, III e V, “b” e “c”; art. 5º, VI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html"}, {"id": "cnv-01", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Segundo Pelizzoli (2019), com base em Marshall Rosenberg, os quatro ingredientes principais da Comunicação Não-Violenta são", "alternativas": ["observações, sentimentos, necessidades e pedidos.", "observações, julgamentos, necessidades e ordens.", "avaliações, emoções, desejos e exigências.", "escuta, empatia, perdão e reconciliação.", "fatos, opiniões, estratégias e cobranças."], "correta": 0, "explicacao": "Os quatro componentes são observação, sentimento, necessidade e pedido. As alternativas erradas trocam componentes por aquilo que a CNV distingue deles: julgamento em vez de observação, ordem ou exigência em vez de pedido.", "fundamento": "Paráfrase: o texto apresenta observações (factuais, sem julgamento ou avaliação moral), sentimentos (sensações e emoções), necessidades (o que precisamos e desejamos) e pedidos (forma de demandar ações) como os quatro ingredientes principais da CNV.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 38", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf"}, {"id": "cnv-02", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Um assistente administrativo quer pedir a um colega que pare de deixar processos espalhados sobre a sua mesa. Segundo Pelizzoli (2019), na CNV o pedido deve ser positivo e específico, e não se confunde com um desejo. Assinale a fala que melhor corresponde a essa orientação.", "alternativas": ["“Não quero mais que você deixe papéis na minha mesa.”", "“Preciso da sua ajuda com a organização do setor.”", "“Eu gostaria tanto que você fosse mais organizado...”", "“Preciso que, a partir de hoje, você coloque os processos na bandeja de entrada do setor.”", "“Você é desorganizado e sempre atrapalha o meu trabalho.”"], "correta": 3, "explicacao": "A alternativa D diz o que se quer (positivo) e qual ação concreta (específico). A é pedido negativo, B é genérico, C expressa desejo e E é julgamento moralizador, que a CNV recomenda evitar.", "fundamento": "Paráfrase: o autor contrapõe “não quero que você fale alto” (pedido negativo) a “preciso de silêncio” (positivo), “preciso de sua ajuda” (genérico) a um pedido específico, e distingue desejo (“eu gostaria”) de pedido.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 28-29", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf"}, {"id": "mat-01", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "O almoxarifado de um hospital adota o sistema de reposição contínua para caixas de luvas de procedimento. O consumo médio é de 120 caixas por mês, o tempo de reposição é de 15 dias e o estoque de segurança foi fixado em 40 caixas. Considerando o mês com 30 dias e a fórmula PP = (C × TR) + ES, o ponto de pedido é de", "alternativas": ["60 caixas.", "100 caixas.", "140 caixas.", "160 caixas.", "1.840 caixas."], "correta": 1, "explicacao": "TR = 15/30 = 0,5 mês; PP = 120 × 0,5 + 40 = 100 caixas. A alternativa A esquece o estoque de segurança, D ignora o tempo de reposição e E usa o tempo em dias sem converter para meses.", "fundamento": "Paráfrase de Fenili: ponto de pedido é a quantidade em estoque que, quando atingida, deve provocar novo pedido de compra, cobrindo o consumo durante o tempo de reposição; PP = (C × TR) + ES, sendo ES o estoque mínimo ou de segurança.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 50 (Quadro 8) e p. 53 (Atividade 2)", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-02", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre a classificação ABC de estoques, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – Os itens da classe A são os de maior valor de demanda e, segundo Fenili, correspondem aproximadamente a 80% do valor de demanda e a 20% da quantidade de itens em estoque.", "II – Os percentuais que delimitam as classes A, B e C são aproximados, e não fixos.", "III – Segundo Kummer, em um hospital, o critério de importância pode deixar de ser o valor financeiro e passar a ser o impacto do medicamento para a saúde humana."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "Fenili apresenta a proporção aproximada de 80% do valor para 20% dos itens na classe A e ressalva que os percentuais não são fixos; Kummer afirma não haver regras fixas e cita o hospital como caso em que o valor pode ser substituído pelo impacto do remédio na saúde. Todas as afirmações estão corretas.", "fundamento": "Paráfrase: Fenili (Tabela 1) dá percentuais “aproximados (e não fixos)”: A ≈ 80% do valor e 20% dos itens; B ≈ 15% e 30%; C ≈ 5% e 50%. Kummer diz que, num hospital, o valor pode ser trocado pelo impacto do medicamento na saúde humana.", "fonte": "FENILI, Gestão de materiais (ENAP, 2015), p. 32, Tabela 1; KUMMER, Gestão de estoques (IFPR, 2012), p. 80-81", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-03", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre recebimento de materiais e inventário físico, conforme Fenili (2015), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) No recebimento provisório, o recebedor assina o documento fiscal que acompanha o material apenas para fins de comprovação da data de entrega.", "( ) A conferência qualitativa verifica se a quantidade declarada pelo fornecedor na nota fiscal corresponde àquela efetivamente entregue.", "( ) O recebimento definitivo corresponde à aceitação do material, com sua entrada no estoque e a liberação do pagamento ao fornecedor.", "( ) No inventário rotativo, todos os itens são contados de uma só vez, o que exige a paralisação das atividades da organização."], "alternativas": ["V – V – V – F", "F – F – V – V", "V – F – V – F", "V – F – F – V", "F – V – V – F"], "correta": 2, "explicacao": "O segundo item descreve a conferência quantitativa; a qualitativa verifica as especificações técnicas. O quarto descreve o inventário periódico: o rotativo é contínuo e seletivo e tem a vantagem de não paralisar as atividades.", "fundamento": "Paráfrase de Fenili: no recebimento provisório o recebedor assina a nota só para comprovar a data de entrega; a conferência quantitativa compara quantidades e a qualitativa, especificações; a aceitação (entrada no estoque e liberação do pagamento) é o recebimento definitivo. O inventário rotativo é contínuo e não paralisa a organização.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 129 (Quadro 23) e p. 148", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-04", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Um almoxarifado registrou as seguintes movimentações de um item, partindo de saldo zero: no dia 3, entrada de 400 unidades a R$ 5,00 cada; no dia 10, entrada de 200 unidades a R$ 8,00 cada; no dia 20, saída de 500 unidades. Avaliando o estoque pelo método PEPS (primeiro a entrar, primeiro a sair), o valor total da saída do dia 20 e o valor do saldo remanescente são, respectivamente,", "alternativas": ["R$ 2.800,00 e R$ 800,00.", "R$ 3.000,00 e R$ 600,00.", "R$ 3.100,00 e R$ 500,00.", "R$ 2.500,00 e R$ 1.100,00.", "R$ 2.800,00 e R$ 1.600,00."], "correta": 0, "explicacao": "No PEPS, a saída usa primeiro o preço das entradas mais antigas: 400 × R$ 5,00 + 100 × R$ 8,00 = R$ 2.800,00, e sobram 100 unidades a R$ 8,00 = R$ 800,00 (o estoque total valia R$ 3.600,00). B corresponde ao custo médio (R$ 6,00) e C ao UEPS.", "fundamento": "Paráfrase de Fenili: no PEPS/FIFO a saída é valorada pelo preço das entradas mais remotas; se a saída superar a quantidade do lote mais antigo, o excedente recebe o preço da entrada seguinte (exemplo das 700 unidades, p. 73).", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 72-73 (item 7.2, Tabela 16); KUMMER, Gestão de estoques (IFPR, 2012), p. 59", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}]</script>
<script id="resumos" type="application/json">[{"id": "info-planilhas", "tema": "Informática", "titulo": "Planilhas: fórmulas que mais caem", "minutos": 6, "porque": "Cai copiar fórmula com $, calcular o resultado de uma função (SOMA, MÉDIA, SE, CONT.SE, SOMASE, PROCV) e saber o que cada erro significa.", "pontos": [{"t": "Toda fórmula começa com =. Exemplo: =A1+B1.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "grupo": "Básico das fórmulas", "chave": "começa com ="}, {"t": "Ordem das contas: o que está entre parênteses primeiro, depois ^ (potência), depois * e /, por último + e -. =5+2*3 dá 11; =(5+2)*3 dá 21.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "grupo": "Básico das fórmulas", "chave": "parênteses primeiro"}, {"t": "A1 é relativa: muda ao copiar. $A$1 nunca muda. A$1 trava só a linha. $A1 trava só a coluna. A tecla F4 alterna os tipos.", "fonte": "Microsoft Suporte: Alternar entre referências relativas, absolutas e mistas", "grupo": "Básico das fórmulas", "chave": "$A$1 nunca muda"}, {"t": "Erros: #DIV/0! dividiu por zero ou vazio; #N/D valor não encontrado; #NOME? texto não reconhecido; #REF! referência inválida; #### coluna estreita.", "fonte": "Microsoft Suporte: Detectar erros de fórmula no Excel", "grupo": "Básico das fórmulas", "chave": "#DIV/0!"}, {"t": "=SOMA(A1:A5) soma o intervalo. =MÉDIA(A1:A5) ignora célula vazia e texto, mas conta a célula com zero.", "fonte": "Microsoft Suporte: Função MÉDIA", "grupo": "Funções essenciais", "chave": "ignora célula vazia"}, {"t": "=SE(teste;se_verdadeiro;se_falso). Se o teste der verdadeiro, mostra o 2º argumento; se der falso, o 3º.", "fonte": "Microsoft Suporte: Função SE", "grupo": "Funções essenciais", "chave": "mostra o 2º argumento"}, {"t": "=CONT.SE(intervalo;critério) conta células. =SOMASE(intervalo;critério;intervalo_soma) soma os valores das linhas que batem com o critério.", "fonte": "Microsoft Suporte: Função CONT.SE; Função SOMASE", "grupo": "Funções essenciais", "chave": "=CONT.SE"}, {"t": "=PROCV(valor;tabela;nº da coluna;FALSO) procura na 1ª coluna da tabela e devolve a coluna pedida. FALSO = valor exato.", "fonte": "Microsoft Suporte: Função PROCV", "grupo": "PROCV e PROCX", "chave": "FALSO = valor exato"}, {"t": "No PROCV, se você omitir o último argumento, o padrão é VERDADEIRO (aproximado). Isso vale no Excel e no Google Planilhas.", "fonte": "Microsoft Suporte: Função PROCV; Ajuda do Editores de Documentos Google: PROCV", "grupo": "PROCV e PROCX", "chave": "VERDADEIRO (aproximado)"}, {"t": "PROCX procura para qualquer lado e é exata por padrão. Mas não existe no Excel 2016 nem no Excel 2019.", "fonte": "Microsoft Suporte: Função PROCX", "grupo": "PROCV e PROCX", "chave": "não existe no Excel 2016"}], "pegadinhas": [{"t": "No PROCV, o número da coluna conta a partir da 1ª coluna da tabela escolhida, não a partir da coluna A da planilha.", "ponto": 7}, {"t": "Em SE, cuidado com > e >=. Com valores iguais, 3>3 é falso e 3>=3 é verdadeiro.", "ponto": 5}, {"t": "Ao copiar uma fórmula, só muda a parte que não tem $ na frente.", "ponto": 2}, {"t": "No Google Planilhas em português, CONT.SE, SOMASE e PROCV têm os mesmos nomes do Excel. A banca pode citar os dois programas na mesma questão.", "ponto": null}], "exemplo": {"pergunta": "No Excel, a célula C1 tem a fórmula =A1*B$1. Ela foi copiada para C2, uma linha abaixo. Qual fórmula aparece em C2?", "passos": ["Separe as duas referências: A1 e B$1.", "A1 não tem $. Ela é relativa e acompanha o movimento. Desceu uma linha, então A1 vira A2.", "B$1 tem $ antes do 1. A linha está travada e continua 1.", "A coluna B não tem $, mas a cópia foi na mesma coluna (C para C). Então B continua B.", "Junte tudo: =A2*B$1."], "resposta": "=A2*B$1"}, "links": [{"rotulo": "Referências relativas, absolutas e mistas (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/alternar-entre-refer%C3%AAncias-relativas-absolutas-e-mistas-dfec08cd-ae65-4f56-839e-5f0d8d0baca9"}, {"rotulo": "Ordem das operações no Excel (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/a-ordem-em-que-o-excel-efetua-opera%C3%A7%C3%B5es-em-f%C3%B3rmulas-28eaf0d7-7058-4eff-a8ea-0a835fafadb8"}, {"rotulo": "Função SOMASE (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/somase-fun%C3%A7%C3%A3o-169b8c99-c05c-4483-a712-1697a653039b"}, {"rotulo": "Função PROCV (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-procv-0bbc8083-26fe-4963-8ab8-93a18ad188a1"}, {"rotulo": "Erros de fórmula no Excel (Microsoft)", "url": "https://support.microsoft.com/pt-br/excel/detect-formula-errors-in-excel"}, {"rotulo": "SOMASE no Google Planilhas", "url": "https://support.google.com/docs/answer/3093583?hl=pt-BR"}]}, {"id": "info-docs-drive", "tema": "Informática", "titulo": "Word, Docs e nuvem: o essencial", "minutos": 6, "porque": "Cai atalho de teclado, revisão com comentários e sugestões, permissões de compartilhamento e histórico de versões.", "pontos": [{"t": "Word em português: Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+B salvar.", "fonte": "Microsoft Suporte: Atalhos de teclado no Word", "grupo": "Atalhos", "chave": "Ctrl+B salvar"}, {"t": "Documentos Google: Ctrl+B negrito, Ctrl+I itálico, Ctrl+U sublinhado.", "fonte": "Ajuda do Documentos Google: Atalhos de teclado", "grupo": "Atalhos", "chave": "Ctrl+B negrito"}, {"t": "Nos dois: Ctrl+C copia, Ctrl+X recorta, Ctrl+V cola, Ctrl+Z desfaz, Ctrl+P imprime, Ctrl+F localiza.", "fonte": "Microsoft Suporte: Atalhos de teclado no Word; Ajuda do Documentos Google: Atalhos de teclado", "grupo": "Atalhos", "chave": "Ctrl+Z desfaz"}, {"t": "Refazer: Ctrl+Y no Word e Ctrl+Shift+Z no Documentos Google. Inserir comentário: Ctrl+Alt+M nos dois.", "fonte": "Microsoft Suporte: Atalhos de teclado no Word; Ajuda do Documentos Google: Atalhos de teclado", "grupo": "Atalhos", "chave": "Ctrl+Y no Word"}, {"t": "Word: guia Revisão > Controlar Alterações. Cada alteração pode ser aceita ou rejeitada, uma por uma ou todas de uma vez.", "fonte": "Microsoft Suporte: Controlar alterações no Word", "grupo": "Revisão e comentários", "chave": "Controlar Alterações"}, {"t": "Documentos Google: quem pode comentar ou editar pode sugerir edições. O texto excluído aparece tachado até a sugestão ser aceita.", "fonte": "Ajuda do Documentos Google: Sugerir edições", "grupo": "Revisão e comentários", "chave": "sugerir edições"}, {"t": "Comentário no Docs: escreva @ e o e-mail da pessoa para atribuir uma tarefa. Resolver fecha o comentário, que pode ser reaberto.", "fonte": "Ajuda do Documentos Google: Usar comentários e itens de ação", "grupo": "Revisão e comentários", "chave": "atribuir uma tarefa"}, {"t": "Google Drive: Leitor só vê. Comentador comenta e sugere. Editor edita e, por padrão, também compartilha.", "fonte": "Ajuda do Google Drive: Compartilhar arquivos", "grupo": "Compartilhamento na nuvem", "chave": "também compartilha"}, {"t": "OneDrive: Pode exibir = só ver. Pode editar = ver e alterar. A pessoa fica com a permissão mais alta que recebeu.", "fonte": "Microsoft Suporte: Compartilhar arquivos e pastas no OneDrive", "grupo": "Compartilhamento na nuvem", "chave": "permissão mais alta"}, {"t": "Histórico de versões do Docs: precisa ser editor; dá para nomear e restaurar versões. A lixeira do Drive guarda arquivos por 30 dias.", "fonte": "Ajuda do Documentos Google: Ver versões; Ajuda do Google Drive: Excluir e restaurar", "grupo": "Compartilhamento na nuvem", "chave": "30 dias"}], "pegadinhas": [{"t": "Ctrl+B no Word em português salva. No Documentos Google, Ctrl+B é negrito.", "ponto": 0}, {"t": "Com Qualquer pessoa com o link, quem tem o link abre sem login. No modo Restrito, só abre quem foi convidado.", "ponto": 7}, {"t": "Resolver um comentário não apaga: ele vai para a lista de comentários e pode ser reaberto.", "ponto": 6}, {"t": "Leitor não comenta nem sugere. Para sugerir, a pessoa precisa ser Comentador ou Editor.", "ponto": 7}], "exemplo": {"pergunta": "Uma colega vai revisar um ofício no Documentos Google. Ela deve propor mudanças, mas o texto só pode mudar depois que a chefia aprovar. Qual a permissão mínima e qual recurso ela usa?", "passos": ["Leitor só vê. Não serve, porque ela precisa propor mudanças.", "Editor serve, mas é mais do que o necessário: poderia mudar o texto direto.", "Comentador pode comentar e sugerir edições. Essa é a permissão mínima.", "No modo de sugestão, o que ela apaga fica tachado e o que ela escreve fica destacado.", "A chefia aceita ou rejeita cada sugestão. Só a aceita muda o texto."], "resposta": "Permissão de Comentador e o recurso de sugerir edições."}, "links": [{"rotulo": "Atalhos de teclado no Word (Microsoft)", "url": "https://support.microsoft.com/pt-br/office/atalhos-de-teclado-no-word-95ef89dd-7142-4b50-afb2-f762f663ceb2"}, {"rotulo": "Atalhos do Documentos Google", "url": "https://support.google.com/docs/answer/179738?hl=pt-BR"}, {"rotulo": "Sugerir edições no Documentos Google", "url": "https://support.google.com/docs/answer/6033474?hl=pt-BR"}, {"rotulo": "Compartilhar arquivos no Google Drive", "url": "https://support.google.com/drive/answer/2494822?hl=pt-BR"}, {"rotulo": "Histórico de versões no Documentos Google", "url": "https://support.google.com/docs/answer/190843?hl=pt-BR"}, {"rotulo": "Compartilhar no OneDrive (Microsoft)", "url": "https://support.microsoft.com/pt-br/onedrive/share-files-and-folders-in-microsoft-onedrive"}]}, {"id": "info-seguranca", "tema": "Informática", "titulo": "Segurança: golpes, malware e certificado", "minutos": 6, "porque": "Cai a definição de phishing e dos tipos de malware, cuidados com senha e backup e o que a assinatura digital garante.", "pontos": [{"t": "Phishing: mensagem falsa que imita banco, empresa ou órgão para roubar dados. Junta meios técnicos e engenharia social.", "fonte": "Cartilha CERT.br, livro, 2.3 Phishing", "grupo": "Golpes e malware", "chave": "Phishing"}, {"t": "Vírus: entra em outros programas e arquivos e só age quando o arquivo hospedeiro é executado.", "fonte": "Cartilha CERT.br, livro, 4.1 Vírus", "grupo": "Golpes e malware", "chave": "Vírus"}, {"t": "Worm: espalha-se sozinho pela rede, explorando falhas e mandando cópias de si mesmo. Consome muitos recursos.", "fonte": "Cartilha CERT.br, livro, 4.2 Worm", "grupo": "Golpes e malware", "chave": "Worm"}, {"t": "Cavalo de troia: faz o que promete, mas também executa funções maliciosas sem o usuário saber.", "fonte": "Cartilha CERT.br, livro, 4.6 Cavalo de troia", "grupo": "Golpes e malware", "chave": "Cavalo de troia"}, {"t": "Ransomware: torna os dados inacessíveis, em geral com criptografia, e cobra resgate. Pagar não garante nada.", "fonte": "Cartilha CERT.br: Ransomware; fascículo Códigos Maliciosos", "grupo": "Golpes e malware", "chave": "Ransomware"}, {"t": "Spyware: monitora o sistema e envia os dados para terceiros. Keylogger é um tipo que captura as teclas digitadas.", "fonte": "Cartilha CERT.br, fascículo Códigos Maliciosos", "grupo": "Golpes e malware", "chave": "Spyware"}, {"t": "Senha longa, uma por conta, sem dados pessoais. Ative a verificação em duas etapas; use SMS só se não houver outra opção.", "fonte": "Cartilha CERT.br, fascículo Autenticação", "grupo": "Proteção e certificado", "chave": "verificação em duas etapas"}, {"t": "Backup: de preferência automático, com pelo menos 2 cópias em locais diferentes. Teste as cópias de tempos em tempos.", "fonte": "Cartilha CERT.br, fascículo Backup", "grupo": "Proteção e certificado", "chave": "2 cópias em locais diferentes"}, {"t": "Assinatura digital: prova quem fez (autenticidade) e que não mudou (integridade). Assina com a chave privada, confere com a pública.", "fonte": "Cartilha CERT.br, livro, 9.3 Assinatura digital", "grupo": "Proteção e certificado", "chave": "chave privada"}, {"t": "Certificado digital: liga uma chave pública a uma pessoa, empresa ou site. Quem emite é uma Autoridade Certificadora (AC).", "fonte": "Cartilha CERT.br, livro, 9.4 Certificado digital", "grupo": "Proteção e certificado", "chave": "Autoridade Certificadora (AC)"}], "pegadinhas": [{"t": "Assinatura digital não deixa o documento secreto. Ela garante autenticidade e integridade, não sigilo.", "ponto": 8}, {"t": "Vírus precisa que alguém execute o arquivo infectado. Worm se propaga sozinho.", "ponto": 1}, {"t": "Antivírus é o nome popular de ferramentas antimalware. Elas agem sobre vários tipos de código malicioso, não só vírus.", "ponto": null}, {"t": "Pagar o resgate do ransomware não garante a volta dos dados. A defesa é ter backup.", "ponto": 4}], "exemplo": {"pergunta": "Chega um e-mail em nome do RH do hospital: clique no link e confirme sua senha em 24 horas, ou seu acesso será bloqueado. Que golpe é esse e o que fazer?", "passos": ["Veja os sinais: mensagem em nome de uma instituição conhecida, ameaça de bloqueio e pedido de dados.", "Esse é o retrato do phishing descrito pela Cartilha.", "Não clique no link. Na dúvida, não clique.", "Confirme com o RH por outro meio, como telefone ou pessoalmente.", "Se já digitou a senha, troque-a na hora e ative a verificação em duas etapas."], "resposta": "É phishing. Não clicar, confirmar por outro canal e, se a senha foi digitada, trocá-la imediatamente."}, "links": [{"rotulo": "Cartilha de Segurança para Internet (livro)", "url": "https://cartilha.cert.br/livro/"}, {"rotulo": "Fascículo Códigos Maliciosos (CERT.br)", "url": "https://cartilha.cert.br/fasciculos/codigos-maliciosos/fasciculo-codigos-maliciosos.pdf"}, {"rotulo": "Fascículo Autenticação (CERT.br)", "url": "https://cartilha.cert.br/fasciculos/autenticacao/fasciculo-autenticacao.pdf"}, {"rotulo": "Fascículo Backup (CERT.br)", "url": "https://cartilha.cert.br/fasciculos/backup/fasciculo-backup.pdf"}, {"rotulo": "Ransomware (CERT.br)", "url": "https://cartilha.cert.br/ransomware/"}]}, {"id": "rl-contas", "tema": "Raciocínio Lógico", "titulo": "Contas: porcentagem, regra de três e horas", "minutos": 6, "porque": "Cai aumento e desconto em sequência, regra de três, razão e conversão de horas com vírgula em minutos.", "pontos": [{"t": "Porcentagem é parte de 100: 15% = 0,15. Então 15% de 200 = 0,15 × 200 = 30.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "15% = 0,15"}, {"t": "Aumento de x%: multiplique por (1 + x/100). Aumento de 15% = vezes 1,15.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "(1 + x/100)"}, {"t": "Desconto de x%: multiplique por (1 - x/100). Desconto de 20% = vezes 0,80.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "(1 - x/100)"}, {"t": "Vários aumentos ou descontos seguidos: multiplique os fatores. Não some as porcentagens.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "multiplique os fatores"}, {"t": "Exemplo da prova de 2023: +15% e depois +20% = 1,15 × 1,20 = 1,38. Aumento total de 38%, não de 35%.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "Aumento total de 38%"}, {"t": "Variação percentual = (novo - antigo) ÷ antigo × 100. Divida sempre pelo valor antigo.", "fonte": "regra de matemática", "grupo": "Porcentagem", "chave": "Divida sempre pelo valor antigo"}, {"t": "Regra de três direta: as duas grandezas sobem juntas. Monte a proporção e multiplique em cruz.", "fonte": "regra de matemática", "grupo": "Regra de três, razão e horas", "chave": "multiplique em cruz"}, {"t": "Regra de três inversa: uma sobe e a outra desce (mais gente, menos dias). Multiplique na mesma linha: 6 × 10 = 4 × d.", "fonte": "regra de matemática", "grupo": "Regra de três, razão e horas", "chave": "Multiplique na mesma linha"}, {"t": "Razão 5:3 quer dizer 5 partes para 3 partes, 8 partes no total. Divida o total por 8 e multiplique pelas partes pedidas.", "fonte": "regra de matemática", "grupo": "Regra de três, razão e horas", "chave": "8 partes no total"}, {"t": "Hora com vírgula: multiplique a parte depois da vírgula por 60. 0,8 h = 0,8 × 60 = 48 min.", "fonte": "regra de matemática", "grupo": "Regra de três, razão e horas", "chave": "por 60"}], "pegadinhas": [{"t": "Somar porcentagens seguidas (15% + 20% = 35%) está errado. O segundo percentual incide sobre o valor novo.", "ponto": 3}, {"t": "2,5 horas são 2 h 30 min, e não 2 h 50 min.", "ponto": 9}, {"t": "Aumento de 10% seguido de desconto de 10% não volta ao valor inicial: 1,10 × 0,90 = 0,99, ou seja, 1% a menos.", "ponto": 3}, {"t": "Antes de multiplicar em cruz, pergunte: se uma grandeza aumenta, a outra aumenta ou diminui?", "ponto": 6}], "exemplo": {"pergunta": "Um material custava R$ 80,00. Teve aumento de 15% e, depois, novo aumento de 20%. Qual o preço final?", "passos": ["Transforme cada aumento em fator: 15% vira 1,15 e 20% vira 1,20.", "Primeiro aumento: 80 × 1,15 = 92.", "Segundo aumento, sobre o valor novo: 92 × 1,20 = 110,40.", "Atalho: 1,15 × 1,20 = 1,38. Então 80 × 1,38 = 110,40.", "Confira: 1,38 quer dizer aumento total de 38%. Se você somasse 35%, daria 108,00, que está errado."], "resposta": "R$ 110,40 (aumento total de 38%)."}, "links": [{"rotulo": "Percentuais sucessivos (Khan Academy)", "url": "https://pt.khanacademy.org/math/1-serie-em-mat-sp/x82b03a9b6c8af113:4-bimestre/x82b03a9b6c8af113:aula-24-situacoes-problema-envolvendo-acrescimos-e-decrescimos/a/calculo-de-percentuais-sucessivos"}, {"rotulo": "Introdução à regra de três (Khan Academy)", "url": "https://pt.khanacademy.org/math/pt-8-ano/algebra-sequencia-proporcoes-8ano/x7a9edfd8911d9c95:regrade-tres/a/introducao-a-regra-de-tres"}]}, {"id": "rl-logica", "tema": "Raciocínio Lógico", "titulo": "Lógica: conectivos, negação e mentiras", "minutos": 7, "porque": "Cai negação do se... então, frase equivalente, De Morgan, negação de todo e nenhum, tabela-verdade e quem está mentindo.", "pontos": [{"t": "e (∧): só é verdadeiro se as duas partes forem verdadeiras.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "as duas partes forem verdadeiras"}, {"t": "ou (∨): só é falso se as duas partes forem falsas.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "as duas partes forem falsas"}, {"t": "se p, então q (→): só é falso quando p é verdadeiro e q é falso. Nos outros três casos, é verdadeiro.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "verdadeiro e q é falso"}, {"t": "p se e somente se q (↔): verdadeiro quando as duas partes têm o mesmo valor.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "mesmo valor"}, {"t": "Tautologia: sempre verdadeira. Contradição: sempre falsa. Contingência: depende dos valores.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "Tautologia"}, {"t": "Verdades e mentiras: procure duas falas que se contradizem. Uma delas é falsa. Depois teste cada suspeito.", "fonte": "regra de lógica", "grupo": "Conectivos e tabela-verdade", "chave": "duas falas que se contradizem"}, {"t": "Negação de se p, então q: p e não q. Mantenha a 1ª parte, troque por e, negue a 2ª.", "fonte": "regra de lógica", "grupo": "Negação e equivalência", "chave": "p e não q"}, {"t": "Equivalentes de se p, então q: se não q, então não p (contrapositiva) e não p ou q.", "fonte": "regra de lógica", "grupo": "Negação e equivalência", "chave": "se não q, então não p"}, {"t": "De Morgan: negar p e q dá não p ou não q. Negar p ou q dá não p e não q.", "fonte": "regra de lógica", "grupo": "Negação e equivalência", "chave": "não p ou não q"}, {"t": "Negar todo A é B: algum A não é B. Negar nenhum A é B: algum A é B. Negar algum A é B: nenhum A é B.", "fonte": "regra de lógica", "grupo": "Negação e equivalência", "chave": "algum A não é B"}], "pegadinhas": [{"t": "A negação de um se... então nunca é outro se... então.", "ponto": 6}, {"t": "A recíproca (se q, então p) não equivale a se p, então q.", "ponto": 7}, {"t": "O contrário de todo não é nenhum. A negação de todo é algum... não.", "ponto": 9}, {"t": "Quando a 1ª parte é falsa, o se... então é verdadeiro, qualquer que seja a 2ª.", "ponto": 2}], "exemplo": {"pergunta": "Sabe-se que é FALSA a frase: Se o laudo chegou, então o paciente teve alta. O que se pode concluir?", "passos": ["Chame p = o laudo chegou e q = o paciente teve alta. A frase é p → q.", "O se... então só é falso em um caso: p verdadeiro e q falso.", "Então p é verdadeiro: o laudo chegou.", "E q é falso: o paciente não teve alta.", "Repare que isso é a negação da frase: p e não q."], "resposta": "O laudo chegou e o paciente não teve alta."}, "links": []}, {"id": "rl-sequencias", "tema": "Raciocínio Lógico", "titulo": "Sequências, calendário e tabelas", "minutos": 6, "porque": "Cai descobrir o próximo termo, padrão de figuras, contar dias no calendário e ler tabela ou gráfico.", "pontos": [{"t": "Primeiro passo: calcule a diferença entre termos vizinhos. Se for sempre a mesma, some esse valor.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "diferença entre termos vizinhos"}, {"t": "Se as diferenças crescem (2, 3, 4, 5...), o próximo pulo é o seguinte da fila.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "diferenças crescem"}, {"t": "Se cada termo é o anterior vezes um número (2, 6, 18...), multiplique. Aqui, por 3.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "vezes um número"}, {"t": "Fibonacci: cada termo é a soma dos dois anteriores. 2, 3, 5, 8, 13, 21... Caiu na prova de 2023.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "Fibonacci"}, {"t": "Letras: troque por números (A=1, B=2... Z=26) e ache o padrão nos números. Veja se a questão conta K, W e Y.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "K, W e Y"}, {"t": "Figuras: conte os elementos das 3 primeiras e ache a regra. Fila de quadrados de palitos: 4, 7, 10... = 3n + 1.", "fonte": "regra de matemática", "grupo": "Sequências", "chave": "3n + 1"}, {"t": "Dia da semana: divida o número de dias por 7. Só o resto importa. Resto 2 = dois dias da semana à frente.", "fonte": "regra de matemática", "grupo": "Calendário e tabelas", "chave": "por 7"}, {"t": "Meses: 30 dias em abril, junho, setembro e novembro. Fevereiro tem 28 (29 no bissexto). Os demais têm 31.", "fonte": "regra de matemática", "grupo": "Calendário e tabelas", "chave": "abril, junho, setembro e novembro"}, {"t": "Tabela: leia o título, a unidade e a linha certa antes de calcular. Alternativas erradas costumam usar a linha vizinha.", "fonte": "regra de matemática", "grupo": "Calendário e tabelas", "chave": "linha vizinha"}, {"t": "Média = soma dos valores ÷ quantidade de valores.", "fonte": "regra de matemática", "grupo": "Calendário e tabelas", "chave": "Média"}], "pegadinhas": [{"t": "Da 1ª à 10ª posição há 9 intervalos, não 10.", "ponto": 0}, {"t": "Ao contar dias, veja se a questão inclui o primeiro dia ou não.", "ponto": 6}, {"t": "Gráfico com eixo que não começa no zero exagera as diferenças. Leia os números, não o tamanho das barras.", "ponto": 8}], "exemplo": {"pergunta": "Sexta-feira, 13 de novembro de 2026. Que dia da semana será 13 de dezembro de 2026, dia da prova?", "passos": ["Conte os dias de 13/11 a 13/12. Novembro tem 30 dias: de 13/11 a 30/11 são 17 dias.", "Some os 13 dias de dezembro: 17 + 13 = 30 dias.", "Divida por 7: 30 = 4 × 7 + 2. Sobram 2.", "As 4 semanas completas caem de novo na sexta. Ande os 2 que sobraram: sábado, domingo."], "resposta": "Domingo."}, "links": [{"rotulo": "Sequências numéricas e figurais (Khan Academy)", "url": "https://pt.khanacademy.org/math/8-ano-mat-sme-rio/x6bd34cda54b6498c:2-bim-bloco-i/x6bd34cda54b6498c:sequencia-numerica/a/sequencias-numericas-e-figurais"}, {"rotulo": "Progressões aritméticas (Khan Academy)", "url": "https://pt.khanacademy.org/math/algebra/x2f8bb11595b61c86:sequences/x2f8bb11595b61c86:introduction-to-arithmetic-sequences/a/introduction-to-arithmetic-sequences"}]}, {"id": "sus", "tema": "SUS: objetivos, princípios e diretrizes", "minutos": 5, "porque": "Na prova de 2023 caíram 3 questões quase literais da Lei 8.080: universalidade, participação complementar da iniciativa privada e direção única no município.", "pontos": [{"t": "A saúde é direito fundamental do ser humano. O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade.", "fonte": "Lei 8.080, art. 2º, caput e § 2º", "grupo": "Direito e princípios", "chave": "direito fundamental"}, {"t": "Universalidade de acesso aos serviços de saúde em todos os níveis de assistência. É o princípio do \"todos têm direito à saúde\".", "fonte": "Lei 8.080, art. 7º, I", "grupo": "Direito e princípios", "chave": "Universalidade"}, {"t": "Integralidade: conjunto articulado e contínuo de ações preventivas e curativas, individuais e coletivas, em todos os níveis de complexidade.", "fonte": "Lei 8.080, art. 7º, II", "grupo": "Direito e princípios", "chave": "Integralidade"}, {"t": "Igualdade da assistência, sem preconceitos ou privilégios. Também são princípios: direito à informação e participação da comunidade.", "fonte": "Lei 8.080, art. 7º, IV, V e VIII", "grupo": "Direito e princípios", "chave": "Igualdade da assistência"}, {"t": "Novos no art. 7º: XV, proteção de crianças e adolescentes (Lei 14.679/2023), e XVI, atenção humanizada (Lei 15.126/2025).", "fonte": "Lei 8.080, art. 7º, XV e XVI", "grupo": "Direito e princípios", "chave": "atenção humanizada"}, {"t": "Objetivos do SUS: identificar e divulgar os fatores determinantes da saúde, formular a política de saúde e dar assistência integrada.", "fonte": "Lei 8.080, art. 5º, I a III", "grupo": "Objetivos e direção", "chave": "fatores determinantes da saúde"}, {"t": "Descentralização político-administrativa com direção única em cada esfera, ênfase nos municípios, regionalização e hierarquização.", "fonte": "Lei 8.080, art. 7º, IX, a e b", "grupo": "Objetivos e direção", "chave": "Descentralização político-administrativa"}, {"t": "Direção única em cada esfera: União = Ministério da Saúde. Estados, DF e Municípios = respectiva Secretaria de Saúde ou órgão equivalente.", "fonte": "Lei 8.080, art. 9º, I a III", "grupo": "Objetivos e direção", "chave": "Ministério da Saúde"}, {"t": "Se suas disponibilidades forem insuficientes para cobrir a população de uma área, o SUS pode recorrer aos serviços da iniciativa privada.", "fonte": "Lei 8.080, art. 24", "grupo": "Iniciativa privada", "chave": "insuficientes"}, {"t": "A participação complementar dos serviços privados é formalizada por contrato ou convênio, seguindo as normas de direito público.", "fonte": "Lei 8.080, art. 24, parágrafo único", "grupo": "Iniciativa privada", "chave": "contrato ou convênio"}, {"t": "Entidades filantrópicas e sem fins lucrativos têm preferência para participar do SUS.", "fonte": "Lei 8.080, art. 25", "grupo": "Iniciativa privada", "chave": "têm preferência"}, {"t": "Dono, administrador ou dirigente de serviço contratado não pode exercer cargo de chefia ou função de confiança no SUS.", "fonte": "Lei 8.080, art. 26, § 4º", "grupo": "Iniciativa privada", "chave": "cargo de chefia"}], "pegadinhas": [{"t": "Universalidade (art. 7º, I) é acesso para todos. Integralidade (art. 7º, II) é cuidado completo. A palavra equidade não aparece na Lei 8.080; lá o texto diz igualdade (art. 7º, IV).", "ponto": 3}, {"t": "A iniciativa privada participa em caráter complementar (art. 4º, § 2º), não substitui o SUS, e só quando as disponibilidades do SUS forem insuficientes (art. 24).", "ponto": 8}, {"t": "Filantrópicas e sem fins lucrativos TÊM preferência (art. 25). Na prova de 2023, a afirmativa que negava a preferência estava errada.", "ponto": 10}, {"t": "No município, a direção é da Secretaria de Saúde ou órgão equivalente (art. 9º, III). Não é Secretaria de Assistência Social nem Procuradoria.", "ponto": 7}], "links": [{"rotulo": "Lei 8.080/1990 (Planalto)", "url": "https://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}]}, {"id": "direitos", "tema": "Direitos e deveres dos usuários", "minutos": 5, "porque": "Em 2023 caiu o primeiro princípio da Carta dos Direitos dos Usuários; em 2015 caíram o quinto princípio (responsabilidades) e itens da Carta, cobrados pelo texto.", "pontos": [{"t": "A Carta tem 6 princípios. O 1º: todo cidadão tem direito ao acesso ordenado e organizado aos sistemas de saúde.", "fonte": "Carta dos Direitos dos Usuários da Saúde, 3ª ed., Apresentação, princípio 1", "grupo": "Princípios e deveres", "chave": "acesso ordenado e organizado"}, {"t": "2º: tratamento adequado e efetivo para seu problema. 3º: atendimento humanizado, acolhedor e livre de qualquer discriminação.", "fonte": "Carta dos Direitos dos Usuários da Saúde, 3ª ed., Apresentação, princípios 2 e 3", "grupo": "Princípios e deveres", "chave": "tratamento adequado e efetivo"}, {"t": "4º: atendimento que respeite a pessoa, seus valores e direitos. 5º: o cidadão também tem responsabilidades. 6º: comprometimento dos gestores.", "fonte": "Carta dos Direitos dos Usuários da Saúde, 3ª ed., Apresentação, princípios 4 a 6", "grupo": "Princípios e deveres", "chave": "responsabilidades"}, {"t": "Deveres: informar queixas, doenças, remédios e alergias; dizer se entendeu; seguir o tratamento; ter documentos em mãos.", "fonte": "PRC GM/MS 1/2017, art. 7º, parágrafo único, I, II, III e VIII", "grupo": "Princípios e deveres", "chave": "informar queixas"}, {"t": "O acesso é preferencialmente pela Atenção Básica, perto de casa. Na urgência ou emergência, qualquer serviço deve receber e cuidar.", "fonte": "PRC GM/MS 1/2017, art. 3º, §§ 1º e 2º", "grupo": "Acesso e acompanhante", "chave": "Atenção Básica"}, {"t": "Visita diária de no mínimo duas horas, preferencialmente aberta, em todas as unidades de internação.", "fonte": "PRC GM/MS 1/2017, art. 5º, parágrafo único, VII", "grupo": "Acesso e acompanhante", "chave": "duas horas"}, {"t": "Acompanhante de livre escolha nas consultas e exames. Na internação, nos casos previstos em lei ou com autonomia comprometida.", "fonte": "PRC GM/MS 1/2017, art. 5º, parágrafo único, V e VI", "grupo": "Acesso e acompanhante", "chave": "livre escolha"}, {"t": "Todo documento deve ter campo para o nome social. A pessoa não pode ser identificada por número, nome ou código da doença.", "fonte": "PRC GM/MS 1/2017, art. 5º, parágrafo único, I", "grupo": "Identidade, sigilo e escolha", "chave": "nome social"}, {"t": "A carta do HCPA lista 25 direitos e 9 deveres. Ex.: ser chamado pelo nome e ter a identificação verificada antes de procedimentos.", "fonte": "Carta de direitos e deveres do paciente do HCPA, direito 4", "grupo": "Identidade, sigilo e escolha", "chave": "25 direitos e 9 deveres"}, {"t": "Sigilo de todas as informações pessoais, mesmo após a morte, salvo nos casos de risco à saúde pública.", "fonte": "PRC GM/MS 1/2017, art. 6º, II", "grupo": "Identidade, sigilo e escolha", "chave": "mesmo após a morte"}, {"t": "Consentimento livre, voluntário e esclarecido, que pode ser revogado a qualquer momento sem sanções morais, financeiras ou legais.", "fonte": "PRC GM/MS 1/2017, art. 6º, V", "grupo": "Identidade, sigilo e escolha", "chave": "pode ser revogado"}, {"t": "Liberdade de procurar segunda opinião em qualquer fase do tratamento. Direito de ser ouvido por ouvidorias, com sigilo.", "fonte": "PRC GM/MS 1/2017, art. 6º, IX e XI", "grupo": "Identidade, sigilo e escolha", "chave": "segunda opinião"}], "pegadinhas": [{"t": "O 1º princípio é acesso ordenado e organizado. Tratamento adequado é o 2º; atendimento humanizado é o 3º; compromisso dos gestores é o 6º.", "ponto": 0}, {"t": "O 5º princípio trata de responsabilidades (deveres). Usar a ouvidoria é direito (PRC 1/2017, art. 6º, XI), não dever; por isso foi a resposta do \"NÃO se refere\" em 2015.", "ponto": 2}, {"t": "Recusar tratamento é direito (PRC 1/2017, art. 5º, parágrafo único, XI), mas a pessoa assume a responsabilidade pela recusa (art. 7º, parágrafo único, V).", "ponto": 10}, {"t": "A Carta nasceu na Portaria 1.820/2009 e hoje está na PRC 1/2017 com numeração deslocada: o art. 2º da Portaria virou o art. 3º da PRC, e assim por diante.", "ponto": null}], "links": [{"rotulo": "Carta dos Direitos dos Usuários (MS, 3ª ed.)", "url": "https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf"}, {"rotulo": "Carta de direitos e deveres do paciente (HCPA)", "url": "https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf"}, {"rotulo": "Portaria de Consolidação nº 1/2017", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}]}, {"id": "humaniza", "tema": "HumanizaSUS", "minutos": 5, "porque": "Em 2023 caíram 3 questões de PNH: os componentes da política, os resultados esperados e o acolhimento com classificação de risco.", "pontos": [{"t": "Humanização é a valorização dos sujeitos do processo de produção de saúde: usuários, trabalhadores e gestores.", "fonte": "HumanizaSUS: documento base, 4ª ed., Apresentação", "grupo": "Estrutura da PNH", "chave": "valorização dos sujeitos"}, {"t": "A PNH se estrutura a partir de: princípios, método, diretrizes e dispositivos.", "fonte": "HumanizaSUS: documento base, 4ª ed., Orientações gerais da PNH", "grupo": "Estrutura da PNH", "chave": "princípios, método, diretrizes e dispositivos"}, {"t": "Princípios (3): transversalidade; indissociabilidade entre atenção e gestão; protagonismo, corresponsabilidade e autonomia dos sujeitos.", "fonte": "HumanizaSUS: documento base, 4ª ed., Princípios da PNH", "grupo": "Estrutura da PNH", "chave": "transversalidade"}, {"t": "Método da tríplice inclusão: inclui os sujeitos (gestores, trabalhadores e usuários), os analisadores sociais e o coletivo.", "fonte": "HumanizaSUS: documento base, 4ª ed., O método da PNH", "grupo": "Estrutura da PNH", "chave": "tríplice inclusão"}, {"t": "Diretrizes: clínica ampliada, cogestão, acolhimento, valorização do trabalho e do trabalhador, defesa dos direitos do usuário.", "fonte": "HumanizaSUS: documento base, 4ª ed., Diretrizes da PNH", "grupo": "Diretrizes e conceitos", "chave": "cogestão"}, {"t": "Também são diretrizes: fomento das grupalidades, coletivos e redes; construção da memória do SUS que dá certo.", "fonte": "HumanizaSUS: documento base, 4ª ed., Diretrizes da PNH", "grupo": "Diretrizes e conceitos", "chave": "memória do SUS"}, {"t": "Clínica ampliada: compromisso com o sujeito e não só com a doença; o sujeito é sempre maior que os diagnósticos.", "fonte": "HumanizaSUS: documento base, 4ª ed., Glossário, Clínica ampliada", "grupo": "Diretrizes e conceitos", "chave": "Clínica ampliada"}, {"t": "Ambiência: ambiente físico, social, profissional e de relações interpessoais voltado à atenção acolhedora, resolutiva e humana.", "fonte": "HumanizaSUS: documento base, 4ª ed., Glossário, Ambiência", "grupo": "Diretrizes e conceitos", "chave": "Ambiência"}, {"t": "Dispositivos incluem: GTH, colegiado gestor, visita aberta e direito a acompanhante, acolhimento com classificação de riscos.", "fonte": "HumanizaSUS: documento base, 4ª ed., Dispositivos da PNH", "grupo": "Dispositivos e acolhimento", "chave": "GTH"}, {"t": "Acolhimento: o trabalhador ou a equipe se responsabiliza pelo usuário da chegada à saída, com escuta qualificada.", "fonte": "HumanizaSUS: documento base, 4ª ed., Glossário, Acolhimento", "grupo": "Dispositivos e acolhimento", "chave": "da chegada à saída"}, {"t": "Classificação de risco: prioriza pelo agravo à saúde e/ou grau de sofrimento, não pela ordem de chegada. Usa protocolos técnicos.", "fonte": "HumanizaSUS: documento base, 4ª ed., Glossário, Classificação de Risco", "grupo": "Dispositivos e acolhimento", "chave": "não pela ordem de chegada"}, {"t": "Resultados esperados: menos filas e espera, atendimento acolhedor e resolutivo por risco; o usuário saberá quem cuida dele.", "fonte": "HumanizaSUS: documento base, 4ª ed., Resultados Esperados com a PNH", "grupo": "Dispositivos e acolhimento", "chave": "menos filas"}], "pegadinhas": [{"t": "Componentes da PNH: princípios, método, diretrizes, dispositivos. Tecnologia, revisões e mobilidade são distratores (prova de 2023).", "ponto": 1}, {"t": "A humanização não é programa: é política pública transversal, que atravessa as ações e instâncias do SUS.", "ponto": 2}, {"t": "Nos resultados esperados, educação permanente e ambiência saudável andam juntas; uma não cede espaço à outra (item falso na prova de 2023).", "ponto": 11}, {"t": "Na cogestão, o colegiado gestor compartilha poder, com coanálise, codecisão e coavaliação: planeja quem executa (Glossário, Colegiado gestor).", "ponto": 4}], "links": [{"rotulo": "HumanizaSUS: documento base, 4ª ed. (BVS)", "url": "https://bvsms.saude.gov.br/bvs/publicacoes/humanizasus_gestores_trabalhadores_sus_4ed.pdf"}]}, {"id": "seg-paciente", "tema": "Segurança do paciente", "minutos": 5, "porque": "Em 2023 caíram 2 questões: o objetivo geral do PNSP e qual programa reduz eventos adversos; em 2015 caíram os objetivos específicos.", "pontos": [{"t": "Segurança do paciente: redução, a um mínimo aceitável, do risco de dano desnecessário associado ao cuidado de saúde.", "fonte": "Portaria 529/2013, art. 4º, I", "grupo": "Conceitos", "chave": "mínimo aceitável"}, {"t": "Incidente: evento que poderia ter resultado, ou resultou, em dano desnecessário. Evento adverso: incidente que resulta em dano.", "fonte": "Portaria 529/2013, art. 4º, III e IV", "grupo": "Conceitos", "chave": "resulta em dano"}, {"t": "Cultura da segurança troca a culpa e a punição pela oportunidade de aprender com as falhas.", "fonte": "RDC 36/2013, art. 3º, II", "grupo": "Conceitos", "chave": "aprender com as falhas"}, {"t": "O PNSP foi instituído pela Portaria MS 529/2013.", "fonte": "Portaria 529/2013, art. 1º", "grupo": "PNSP e protocolos", "chave": "Portaria MS 529/2013"}, {"t": "Objetivo geral do PNSP: contribuir para a qualificação do cuidado em saúde em todos os estabelecimentos de saúde do país.", "fonte": "Portaria 529/2013, art. 2º", "grupo": "PNSP e protocolos", "chave": "qualificação do cuidado"}, {"t": "Objetivos específicos (5): gestão de risco e NSP; envolver pacientes e familiares; informar a sociedade; produzir conhecimento; ensino.", "fonte": "Portaria 529/2013, art. 3º, I a V", "grupo": "PNSP e protocolos", "chave": "envolver pacientes e familiares"}, {"t": "Protocolos básicos, 1º grupo: cirurgia segura, prática de higiene das mãos e úlcera por pressão.", "fonte": "Portaria 1.377/2013, art. 1º, parágrafo único", "grupo": "PNSP e protocolos", "chave": "cirurgia segura"}, {"t": "Protocolos básicos, 2º grupo: prevenção de quedas, identificação do paciente e segurança na prescrição, uso e administração de medicamentos.", "fonte": "Portaria 2.095/2013, art. 1º, parágrafo único", "grupo": "PNSP e protocolos", "chave": "prevenção de quedas"}, {"t": "A direção do serviço de saúde constitui o Núcleo de Segurança do Paciente (NSP) e nomeia seus membros.", "fonte": "RDC 36/2013, art. 4º", "grupo": "NSP e notificação", "chave": "direção do serviço de saúde"}, {"t": "O NSP notifica os eventos adversos todo mês, até o 15º dia útil do mês seguinte, pelas ferramentas eletrônicas da Anvisa.", "fonte": "RDC 36/2013, art. 10", "grupo": "NSP e notificação", "chave": "15º dia útil"}, {"t": "Evento adverso que evoluiu para óbito: notificar em até 72 horas a partir do ocorrido.", "fonte": "RDC 36/2013, art. 10, parágrafo único", "grupo": "NSP e notificação", "chave": "72 horas"}, {"t": "A RDC 36 não vale para consultórios individualizados, laboratórios clínicos, serviços móveis e de atenção domiciliar.", "fonte": "RDC 36/2013, art. 2º, parágrafo único", "grupo": "NSP e notificação", "chave": "consultórios individualizados"}], "pegadinhas": [{"t": "Objetivo geral (art. 2º) x objetivos específicos (art. 3º) x competências do Comitê CIPNSP (art. 7º). Propor protocolos e recomendar pesquisas são do Comitê, não objetivo geral.", "ponto": 4}, {"t": "Incidente pode ou não causar dano. Evento adverso é só o incidente que causou dano.", "ponto": 1}, {"t": "Notificação mensal: até o 15º dia útil do mês seguinte. Óbito: até 72 horas. Não troque um prazo pelo outro.", "ponto": 9}, {"t": "O texto original da RDC 36 dava 120 dias para NSP e plano e 150 para notificar. A RDC 53/2013 mudou para 180 e 210 dias (art. 12).", "ponto": 8}], "links": [{"rotulo": "Portaria 529/2013 (PNSP)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html"}, {"rotulo": "RDC 36/2013 (Anvisa)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"rotulo": "RDC 53/2013 (altera art. 12 da RDC 36)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0053_14_11_2013.html"}, {"rotulo": "Portaria 1.377/2013 (protocolos)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt1377_09_07_2013.html"}, {"rotulo": "Portaria 2.095/2013 (protocolos)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt2095_24_09_2013.html"}]}, {"id": "eca", "tema": "ECA", "minutos": 5, "porque": "A banca cobra idades, deveres do hospital e a quem comunicar maus-tratos; no balcão você lida com acompanhante, recém-nascido e criança internada.", "pontos": [{"t": "Criança: até 12 anos incompletos. Adolescente: entre 12 e 18 anos.", "fonte": "ECA, art. 2º, caput", "grupo": "Conceitos e prioridade", "chave": "12 anos incompletos"}, {"t": "Prioridade absoluta é dever da família, da comunidade, da sociedade em geral e do poder público. Inclui vida e saúde.", "fonte": "ECA, art. 4º, caput", "grupo": "Conceitos e prioridade", "chave": "Prioridade absoluta"}, {"t": "A prioridade inclui primazia de proteção e socorro e precedência de atendimento nos serviços públicos ou de relevância pública.", "fonte": "ECA, art. 4º, § 1º, a e b", "grupo": "Conceitos e prioridade", "chave": "primazia de proteção e socorro"}, {"t": "Gestante e parturiente têm direito a 1 acompanhante de sua escolha no pré-natal, no trabalho de parto e no pós-parto imediato.", "fonte": "ECA, art. 8º, § 6º", "grupo": "Gestação e nascimento", "chave": "1 acompanhante"}, {"t": "Recém-nascido é identificado pela impressão plantar e digital dele e pela impressão digital da mãe.", "fonte": "ECA, art. 10, II", "grupo": "Gestação e nascimento", "chave": "impressão plantar"}, {"t": "Hospital que atende gestantes guarda o prontuário individual por 18 anos.", "fonte": "ECA, art. 10, I", "grupo": "Gestação e nascimento", "chave": "18 anos"}, {"t": "Hospital também deve: fazer exames de metabolismo do bebê, dar declaração de nascimento com intercorrências e manter alojamento conjunto.", "fonte": "ECA, art. 10, III a V", "grupo": "Gestação e nascimento", "chave": "alojamento conjunto"}, {"t": "Suspeita ou confirmação de castigo físico, tratamento cruel ou degradante e maus-tratos: comunicar obrigatoriamente ao Conselho Tutelar do local.", "fonte": "ECA, art. 13, caput", "grupo": "Internação e proteção", "chave": "Conselho Tutelar"}, {"t": "Hospital deve dar condições para um dos pais ou responsável ficar em tempo integral na internação, inclusive em UTI e unidade neonatal.", "fonte": "ECA, art. 12, caput", "grupo": "Internação e proteção", "chave": "tempo integral"}, {"t": "Criança e adolescente têm direito de visitar a mãe ou o pai internados em instituição de saúde (Lei 14.950/2024).", "fonte": "ECA, art. 12, parágrafo único", "grupo": "Internação e proteção", "chave": "direito de visitar"}, {"t": "Atendimento médico e psicossocial também para criança com pai ou responsável vítima de grave violência ou preso em regime fechado.", "fonte": "ECA, art. 87, III (Lei 14.987/2024)", "grupo": "Internação e proteção", "chave": "preso em regime fechado"}, {"t": "Poder público dá assistência integral e multiprofissional à criança e ao adolescente dependentes químicos (Lei 15.243/2025).", "fonte": "ECA, art. 14-A", "grupo": "Internação e proteção", "chave": "dependentes químicos"}], "pegadinhas": [{"t": "Quem fez 12 anos já é adolescente: criança é até 12 incompletos. De 18 a 21 o ECA só vale nos casos expressos em lei (art. 2º, parágrafo único).", "ponto": 0}, {"t": "Maus-tratos vão ao Conselho Tutelar (art. 13). Médico ou responsável pelo estabelecimento de saúde que não comunica leva multa de 3 a 20 salários de referência (art. 245).", "ponto": 7}, {"t": "Na identificação do bebê, a impressão plantar é do bebê. Da mãe é só a impressão digital (art. 10, II).", "ponto": 4}, {"t": "Acompanhar o filho internado (art. 12, caput) e visitar o pai ou a mãe internados (art. 12, parágrafo único) são direitos diferentes.", "ponto": 9}], "links": [{"rotulo": "ECA (Lei 8.069/1990)", "url": "https://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"rotulo": "Lei 14.950/2024", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/L14950.htm"}, {"rotulo": "Lei 14.987/2024", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/L14987.htm"}, {"rotulo": "Lei 15.243/2025", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/L15243.htm"}]}, {"id": "idosa", "tema": "Estatuto da Pessoa Idosa", "minutos": 5, "porque": "Cai a idade, a prioridade dos maiores de 80 e o acompanhante; na recepção e na internação você aplica isso todo dia.", "pontos": [{"t": "Pessoa idosa é quem tem 60 anos ou mais.", "fonte": "Estatuto da Pessoa Idosa, art. 1º", "grupo": "Quem é e prioridade", "chave": "60 anos"}, {"t": "Entre os idosos, os maiores de 80 anos têm prioridade especial sobre os demais idosos.", "fonte": "Estatuto da Pessoa Idosa, art. 3º, § 2º", "grupo": "Quem é e prioridade", "chave": "maiores de 80 anos"}, {"t": "Em todo atendimento de saúde, maiores de 80 têm preferência especial sobre os outros idosos, exceto em caso de emergência.", "fonte": "Estatuto da Pessoa Idosa, art. 15, § 7º", "grupo": "Quem é e prioridade", "chave": "exceto em caso de emergência"}, {"t": "Prioridade inclui atendimento preferencial imediato e individualizado em órgãos públicos e privados que atendem a população.", "fonte": "Estatuto da Pessoa Idosa, art. 3º, § 1º, I", "grupo": "Quem é e prioridade", "chave": "atendimento preferencial imediato"}, {"t": "Idoso internado ou em observação tem direito a acompanhante. O hospital dá condições para ficar em tempo integral, segundo critério médico.", "fonte": "Estatuto da Pessoa Idosa, art. 16, caput", "grupo": "Saúde e acompanhante", "chave": "critério médico"}, {"t": "Quem autoriza o acompanhante é o profissional de saúde responsável pelo tratamento. Se não for possível, ele justifica por escrito.", "fonte": "Estatuto da Pessoa Idosa, art. 16, parágrafo único", "grupo": "Saúde e acompanhante", "chave": "profissional de saúde responsável"}, {"t": "Idoso lúcido escolhe o tratamento. Se não puder: curador, familiares ou médico. Sem curador nem família, o médico decide e avisa o MP.", "fonte": "Estatuto da Pessoa Idosa, art. 17", "grupo": "Saúde e acompanhante", "chave": "avisa o MP"}, {"t": "Violência é ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico.", "fonte": "Estatuto da Pessoa Idosa, art. 19, § 1º", "grupo": "Violência e crimes", "chave": "ação ou omissão"}, {"t": "Suspeita ou confirmação de violência: notificação compulsória à autoridade sanitária e comunicação a polícia, MP ou Conselho da Pessoa Idosa.", "fonte": "Estatuto da Pessoa Idosa, art. 19, caput e I a V", "grupo": "Violência e crimes", "chave": "notificação compulsória"}, {"t": "Crime: abandonar idoso em hospital ou casa de saúde. Pena: detenção de 6 meses a 3 anos e multa.", "fonte": "Estatuto da Pessoa Idosa, art. 98", "grupo": "Violência e crimes", "chave": "abandonar idoso em hospital"}, {"t": "Crime: recusar, retardar ou dificultar atendimento ou assistência à saúde do idoso sem justa causa. Reclusão de 6 meses a 1 ano e multa.", "fonte": "Estatuto da Pessoa Idosa, art. 100, III", "grupo": "Violência e crimes", "chave": "recusar, retardar ou dificultar"}, {"t": "Crime: desdenhar, humilhar, menosprezar ou discriminar pessoa idosa por qualquer motivo. Reclusão de 6 meses a 1 ano e multa.", "fonte": "Estatuto da Pessoa Idosa, art. 96, § 1º", "grupo": "Violência e crimes", "chave": "desdenhar, humilhar, menosprezar"}], "pegadinhas": [{"t": "Idoso é idade igual ou superior a 60, não 65. A prioridade especial é dos maiores de 80 (art. 1º e art. 3º, § 2º).", "ponto": 0}, {"t": "A preferência dos maiores de 80 na saúde não vale em emergência (art. 15, § 7º).", "ponto": 2}, {"t": "Planos de saúde não podem cobrar valores diferentes por causa da idade (art. 15, § 3º).", "ponto": null}, {"t": "Crimes do Estatuto são de ação penal pública incondicionada: não dependem de a vítima representar (art. 95).", "ponto": 9}], "links": [{"rotulo": "Estatuto da Pessoa Idosa (Lei 10.741/2003)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}]}, {"id": "lbi", "tema": "Pessoa com Deficiência (LBI)", "minutos": 5, "porque": "A prova cobra as definições do art. 3º quase ao pé da letra; no hospital você garante prioridade, acompanhante e acesso sem barreiras.", "pontos": [{"t": "Pessoa com deficiência: impedimento de longo prazo físico, mental, intelectual ou sensorial que, com barreiras, pode obstruir sua participação.", "fonte": "LBI (Lei 13.146/2015), art. 2º, caput", "grupo": "Deficiência e barreiras", "chave": "impedimento de longo prazo"}, {"t": "Barreiras são 6: urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas.", "fonte": "LBI, art. 3º, IV, a a f", "grupo": "Deficiência e barreiras", "chave": "são 6"}, {"t": "Barreira atitudinal: atitudes ou comportamentos que impedem ou prejudicam a participação social da pessoa com deficiência.", "fonte": "LBI, art. 3º, IV, e", "grupo": "Deficiência e barreiras", "chave": "Barreira atitudinal"}, {"t": "Acessibilidade: possibilidade e condição de alcance para usar, com segurança e autonomia, espaços, transportes, informação e serviços.", "fonte": "LBI, art. 3º, I", "grupo": "Acessibilidade e inclusão", "chave": "Acessibilidade"}, {"t": "Tecnologia assistiva (ou ajuda técnica): produtos, recursos, práticas e serviços que promovem funcionalidade, autonomia e inclusão.", "fonte": "LBI, art. 3º, III", "grupo": "Acessibilidade e inclusão", "chave": "Tecnologia assistiva"}, {"t": "Adaptações razoáveis: ajustes necessários, sem ônus desproporcional e indevido, para garantir direitos em igualdade de condições.", "fonte": "LBI, art. 3º, VI", "grupo": "Acessibilidade e inclusão", "chave": "Adaptações razoáveis"}, {"t": "Discriminação é distinção, restrição ou exclusão, por ação ou omissão. Inclui recusar adaptações razoáveis e tecnologia assistiva.", "fonte": "LBI, art. 4º, § 1º", "grupo": "Acessibilidade e inclusão", "chave": "recusar adaptações razoáveis"}, {"t": "Atendimento prioritário, entre outros: proteção e socorro em quaisquer circunstâncias e atendimento em todos os serviços ao público.", "fonte": "LBI, art. 9º, I e II", "grupo": "Prioridade e proteção", "chave": "proteção e socorro"}, {"t": "A prioridade vale também para o acompanhante ou atendente pessoal, menos na restituição do IR e na tramitação de processos.", "fonte": "LBI, art. 9º, § 1º", "grupo": "Prioridade e proteção", "chave": "restituição do IR"}, {"t": "Nos serviços de emergência, públicos e privados, a prioridade depende dos protocolos de atendimento médico.", "fonte": "LBI, art. 9º, § 2º", "grupo": "Prioridade e proteção", "chave": "protocolos de atendimento médico"}, {"t": "Internada ou em observação: direito a acompanhante ou atendente pessoal em tempo integral. Impedimento justificado por escrito.", "fonte": "LBI, art. 22, caput e § 1º", "grupo": "Prioridade e proteção", "chave": "tempo integral"}, {"t": "Violência contra pessoa com deficiência: notificação compulsória à polícia e ao MP, além dos Conselhos dos Direitos da PcD.", "fonte": "LBI, art. 26, caput", "grupo": "Prioridade e proteção", "chave": "notificação compulsória"}], "pegadinhas": [{"t": "Mobilidade reduzida não é deficiência: inclui idoso, gestante, lactante, pessoa com criança de colo e obeso (art. 3º, IX).", "ponto": 0}, {"t": "Atendente pessoal presta cuidados básicos do dia a dia. Acompanhante só acompanha e pode ou não ser atendente (art. 3º, XII e XIV).", "ponto": 8}, {"t": "Se o acompanhante não puder ficar, o hospital deve suprir a ausência dele, não só justificar (art. 22, § 2º).", "ponto": 10}, {"t": "O cordão de girassol identifica deficiência oculta. É opcional e não dispensa documento, se pedido (art. 2º-A).", "ponto": null}], "links": [{"rotulo": "LBI (Lei 13.146/2015)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}]}, {"id": "injuria", "tema": "Injúria racial", "minutos": 5, "porque": "A prova cobra pena, aumentos e o que saiu do Código Penal; e há aumento de pena quando quem ofende é funcionário público no exercício da função.", "pontos": [{"t": "Injúria racial virou crime da Lei do Crime Racial: injuriar alguém por raça, cor, etnia ou procedência nacional.", "fonte": "Lei 7.716/1989, art. 2º-A (incluído pela Lei 14.532/2023)", "grupo": "Injúria racial e comum", "chave": "Lei do Crime Racial"}, {"t": "Pena da injúria racial: reclusão de 2 a 5 anos e multa.", "fonte": "Lei 7.716/1989, art. 2º-A", "grupo": "Injúria racial e comum", "chave": "reclusão de 2 a 5 anos"}, {"t": "Injúria comum continua no Código Penal: detenção de 1 a 6 meses ou multa.", "fonte": "Código Penal, art. 140, caput", "grupo": "Injúria racial e comum", "chave": "detenção de 1 a 6 meses"}, {"t": "Injúria por religião ou por ser pessoa idosa ou com deficiência continua no Código Penal: reclusão de 1 a 3 anos e multa.", "fonte": "Código Penal, art. 140, § 3º", "grupo": "Injúria racial e comum", "chave": "Injúria por religião"}, {"t": "A pena aumenta de metade se o crime for cometido por 2 ou mais pessoas.", "fonte": "Lei 7.716/1989, art. 2º-A, parágrafo único", "grupo": "Aumentos de pena", "chave": "aumenta de metade"}, {"t": "Funcionário público no exercício da função ou a pretexto de exercê-la: pena aumenta de 1/3 até a metade.", "fonte": "Lei 7.716/1989, art. 20-B", "grupo": "Aumentos de pena", "chave": "Funcionário público"}, {"t": "Para o Código Penal, funcionário público é quem exerce cargo, emprego ou função pública, mesmo transitório ou sem remuneração.", "fonte": "Código Penal, art. 327, caput", "grupo": "Aumentos de pena", "chave": "mesmo transitório ou sem remuneração"}, {"t": "Racismo recreativo: em contexto ou com intuito de descontração, diversão ou recreação, pena aumenta de 1/3 até a metade.", "fonte": "Lei 7.716/1989, art. 20-A", "grupo": "Aumentos de pena", "chave": "Racismo recreativo"}, {"t": "Racismo em atividade esportiva, religiosa, artística ou cultural: reclusão de 2 a 5 anos e proibição de frequentar esses locais por 3 anos.", "fonte": "Lei 7.716/1989, art. 20, § 2º-A", "grupo": "Outros crimes e processo", "chave": "proibição de frequentar esses locais"}, {"t": "Racismo religioso: obstar, impedir ou usar violência contra manifestações ou práticas religiosas. Pena de reclusão de 1 a 3 anos e multa.", "fonte": "Lei 7.716/1989, art. 20, caput e § 2º-B", "grupo": "Outros crimes e processo", "chave": "Racismo religioso"}, {"t": "O juiz deve ver como discriminatório o tratamento que causa constrangimento, humilhação, vergonha, medo ou exposição indevida.", "fonte": "Lei 7.716/1989, art. 20-C", "grupo": "Outros crimes e processo", "chave": "como discriminatório"}, {"t": "Em todos os atos do processo, a vítima de racismo deve estar acompanhada de advogado ou defensor público.", "fonte": "Lei 7.716/1989, art. 20-D", "grupo": "Outros crimes e processo", "chave": "advogado ou defensor público"}], "pegadinhas": [{"t": "Injúria por religião não foi para o art. 2º-A. Ela segue no Código Penal (art. 140, § 3º). O 2º-A cobre raça, cor, etnia ou procedência nacional.", "ponto": 3}, {"t": "Art. 2º-A é injuriar alguém (ofender a dignidade ou o decoro). Art. 20 é praticar, induzir ou incitar discriminação ou preconceito.", "ponto": 0}, {"t": "O aumento por funcionário público (art. 20-B) vale para os arts. 2º-A e 20. O aumento recreativo (art. 20-A) vale para todos os crimes da Lei.", "ponto": 5}, {"t": "Concurso de 2 ou mais pessoas aumenta de metade. Funcionário público e contexto recreativo aumentam de 1/3 até a metade.", "ponto": 4}], "links": [{"rotulo": "Lei 14.532/2023", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm"}, {"rotulo": "Lei 7.716/1989 (compilada)", "url": "https://www.planalto.gov.br/ccivil_03/leis/l7716.htm"}, {"rotulo": "Código Penal (compilado)", "url": "https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"}]}, {"id": "ans", "tema": "Diversidade e inclusão (Guia ANS)", "minutos": 5, "porque": "A banca pode pedir os conceitos do guia com as palavras dele; no atendimento ao público, linguagem e postura inclusivas evitam discriminação.", "pontos": [{"t": "Diversidade está ligada à representatividade. Inclusão vai além: garante a todos as mesmas oportunidades de desenvolvimento e ascensão.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 8", "grupo": "Conceitos-base", "chave": "representatividade"}, {"t": "Inclusão é mudar a perspectiva para uma mentalidade mais empática: se importar com o outro, mesmo que ele seja diferente de você.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 8", "grupo": "Conceitos-base", "chave": "mentalidade mais empática"}, {"t": "Para o guia, a diversidade não deve ser tolerada, e sim promovida e efetivada.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 7", "grupo": "Conceitos-base", "chave": "não deve ser tolerada"}, {"t": "Viés inconsciente cria estereótipos, ideias simplificadas sobre pessoas e grupos, que levam a pré-julgamento e podem gerar discriminação.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 8", "grupo": "Conceitos-base", "chave": "Viés inconsciente"}, {"t": "Diretrizes: enfrentar discriminação de gênero e raça e assédio; igualdade de tratamento; formação e educação permanente.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 9", "grupo": "Diretrizes e linguagem", "chave": "educação permanente"}, {"t": "Ações sugeridas: igualdade nos processos seletivos, linguagem inclusiva, capacitação sobre gênero, raça e etnia, sensibilização.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 9", "grupo": "Diretrizes e linguagem", "chave": "linguagem inclusiva"}, {"t": "Termo correto: pessoa com deficiência (PcD). 'Portador de deficiência' e 'necessidades especiais' estão superados.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 19 e 22", "grupo": "Diretrizes e linguagem", "chave": "pessoa com deficiência (PcD)"}, {"t": "Nome social: nome escolhido por pessoas trans e travestis conforme o gênero com que se identificam. Deve ser usado por todos.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 16", "grupo": "Diretrizes e linguagem", "chave": "Nome social"}, {"t": "Racismo institucional está nas políticas, procedimentos e práticas das instituições, mesmo sem intenção individual de discriminar.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 10 e 11", "grupo": "Formas de discriminação", "chave": "Racismo institucional"}, {"t": "Capacitismo: atitudes e falas, muitas vezes inconscientes, como tratar a PcD como heroína ou não valorizar suas habilidades.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 22", "grupo": "Formas de discriminação", "chave": "Capacitismo"}, {"t": "Racismo religioso: preconceito, discriminação e discurso de ódio contra praticantes de religiões de matriz africana.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 24", "grupo": "Formas de discriminação", "chave": "Racismo religioso"}, {"t": "Ageísmo ou etarismo: discriminação por idade. A OMS define idadismo como estereótipo, preconceito e discriminação com base na idade.", "fonte": "Guia ANS de Diversidade e Inclusão (2023), p. 24", "grupo": "Formas de discriminação", "chave": "Ageísmo ou etarismo"}], "pegadinhas": [{"t": "Orientação sexual é atração por outra pessoa. Identidade de gênero é como a pessoa se reconhece. E não se diz 'opção sexual' (p. 14 e 17).", "ponto": null}, {"t": "Cisgênero se identifica com o sexo biológico de nascimento. Transgênero não se identifica com o gênero atribuído ao nascer (p. 15).", "ponto": 7}, {"t": "Pessoa surda acompanhada: fale com ela, não com o acompanhante (p. 20).", "ponto": 9}, {"t": "O guia troca 'Dia do Índio' por 'Dia dos Povos Indígenas' (19 de abril) e prefere 'povos originários' (p. 12).", "ponto": 5}], "links": [{"rotulo": "Guia ANS de Diversidade e Inclusão (PDF)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}]}, {"id": "lgpd", "tema": "LGPD", "minutos": 5, "porque": "Caiu em 2023 (fundamentos e consentimento de crianças). Na recepção e na internação você lida o dia todo com dado de saúde, que é dado sensível.", "pontos": [{"t": "Dado pessoal é informação de pessoa natural identificada ou identificável. Titular é a pessoa natural a quem os dados se referem.", "fonte": "LGPD, art. 5º, I e V", "grupo": "Definições", "chave": "identificada ou identificável"}, {"t": "Dado sensível: saúde, vida sexual, dado genético ou biométrico, origem racial ou étnica, religião, opinião política, filiação a sindicato.", "fonte": "LGPD, art. 5º, II", "grupo": "Definições", "chave": "Dado sensível"}, {"t": "Dado de criança: precisa de consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal.", "fonte": "LGPD, art. 14, §1º", "grupo": "Definições", "chave": "pelo menos um dos pais"}, {"t": "Tutela da saúde dispensa consentimento, mas só em procedimento feito por profissionais de saúde, serviços de saúde ou autoridade sanitária.", "fonte": "LGPD, art. 7º, VIII, e art. 11, II, f", "grupo": "Definições", "chave": "dispensa consentimento"}, {"t": "Anonimização: usar meios técnicos razoáveis para que o dado perca a possibilidade de ser ligado a uma pessoa, direta ou indiretamente.", "fonte": "LGPD, art. 5º, XI", "grupo": "Definições", "chave": "Anonimização"}, {"t": "Fundamentos da LGPD: respeito à privacidade, autodeterminação informativa e liberdade de expressão, de informação, de comunicação e de opinião.", "fonte": "LGPD, art. 2º, I a III", "grupo": "Fundamentos e princípios", "chave": "autodeterminação informativa"}, {"t": "Também são fundamentos: intimidade, honra e imagem; desenvolvimento econômico; livre iniciativa; direitos humanos e cidadania.", "fonte": "LGPD, art. 2º, IV a VII", "grupo": "Fundamentos e princípios", "chave": "livre iniciativa"}, {"t": "Princípios: finalidade, adequação, necessidade, livre acesso, qualidade, transparência, segurança, prevenção, não discriminação, responsabilização.", "fonte": "LGPD, art. 6º, I a X", "grupo": "Fundamentos e princípios", "chave": "finalidade, adequação, necessidade"}, {"t": "Controlador é quem toma as decisões sobre o tratamento. Operador é quem trata os dados em nome do controlador.", "fonte": "LGPD, art. 5º, VI e VII", "grupo": "Agentes e direitos do titular", "chave": "Controlador"}, {"t": "Encarregado: pessoa indicada pelo controlador e pelo operador como canal de comunicação com os titulares e com a ANPD.", "fonte": "LGPD, art. 5º, VIII", "grupo": "Agentes e direitos do titular", "chave": "Encarregado"}, {"t": "A ANPD agora é a Agência Nacional de Proteção de Dados, autarquia de natureza especial vinculada ao Ministério da Justiça e Segurança Pública.", "fonte": "LGPD, art. 55-A (redação da Lei 15.352/2026)", "grupo": "Agentes e direitos do titular", "chave": "Agência Nacional"}, {"t": "O titular pode pedir ao controlador: confirmação, acesso, correção, eliminação, portabilidade. Declaração completa sai em até 15 dias.", "fonte": "LGPD, art. 18, I a IX, e art. 19, II", "grupo": "Agentes e direitos do titular", "chave": "15 dias"}], "pegadinhas": [{"t": "Basta um dos pais ou o responsável legal para consentir pela criança. Não precisa de ambos os pais.", "ponto": 2}, {"t": "Fundamento é o respeito à privacid
