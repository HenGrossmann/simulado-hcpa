        <button class="sair" data-act="sair">← Sair</button>
        <span class="pos">${S.i + 1} / ${S.ids.length}</span>
      </div>
      <div class="progresso" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <article class="questao">
        <div class="linha-acoes"><span class="num">Questão ${S.i + 1}</span><span class="chip">${esc(q.materia === q.tema ? q.materia : q.tema)}</span></div>
        ${q.texto ? `<details class="texto" open><summary>Texto</summary><p>${esc(q.texto)}</p></details>` : ''}
        <p class="enunciado">${esc(q.enunciado)}</p>
        ${q.itens && q.itens.length ? `<ul class="itens">${q.itens.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        <div class="opcoes">${opcoes}</div>
        ${fb}
      </article>`;
    barraNav();
  }

  function barraNav() {
    nav.hidden = false;
    const ultimo = S.i === S.ids.length - 1;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p>
        <button class="nb" data-act="conf-nao">Voltar</button>
        <button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
      return;
    }
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    let prox;
    if (simuladoAberto) prox = ultimo ? `<button class="nb prim" data-act="entregar">Entregar</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else if (S.modo === 'simulado') prox = ultimo ? `<button class="nb prim" data-act="resultado">Ver resultado</button>` : `<button class="nb prim" data-act="prox">Próxima</button>`;
    else prox = ultimo ? `<button class="nb prim" data-act="fim">Concluir</button>` : `<button class="nb prim" data-act="prox">${S.resp[S.ids[S.i]] == null ? 'Pular' : 'Próxima'}</button>`;
    const extra = simuladoAberto && !ultimo ? `<button class="nb" data-act="entregar">Entregar</button>` : '';
    navIn.innerHTML = `<button class="nb" data-act="ant" ${S.i === 0 ? 'disabled' : ''}>Anterior</button>${extra}${prox}`;
  }

  function entregar() {
    S.entregue = true;
    for (const id of S.ids) if (S.resp[id] != null) registrar(id, S.resp[id] === BYID[id].correta);
    resultado();
  }

  // ---------- Resultado ----------
  function resultado() {
    confirmar = null;
    const ids = S.ids;
    const certa = id => S.resp[id] === BYID[id].correta;
    const acertos = ids.filter(certa).length;
    const porMat = MATERIAS.map(m => {
      const xs = ids.filter(id => BYID[id].materia === m);
      return { m, total: xs.length, ok: xs.filter(certa).length };
    }).filter(x => x.total);

    let edital = '';
    if (S.modo === 'simulado') {
      const nota = acertos * 0.25;
      const faltas = porMat.filter(x => x.m !== 'Conhecimentos Específicos' && x.ok < 2).map(x => x.m);
      const passa = nota >= 6 && !faltas.length;
      const motivos = [];
      if (nota < 6) motivos.push(`nota ${nota.toFixed(2).replace('.', ',')}, abaixo de 6,00 (faltaram ${24 - acertos} acertos)`);
      if (faltas.length) motivos.push(`menos de 2 acertos em ${faltas.length > 1 ? faltas.slice(0, -1).join(', ') + ' e ' + faltas[faltas.length - 1] : faltas[0]}`);
      edital = `<div class="veredito-edital ${passa ? 'ok' : 'bad'}">
        <h2>${passa ? 'Passaria dos mínimos do edital' : 'Ficaria abaixo dos mínimos do edital'}</h2>
        <p>${passa ? 'Nota de pelo menos 6,00 e no mínimo 2 acertos em Português, Informática e Raciocínio Lógico.' : 'Motivo: ' + esc(motivos.join('; ')) + '.'}</p>
        <p class="nota">O mínimo só evita a eliminação. A classificação depende das notas das demais pessoas inscritas e da prova de títulos.</p>
      </div>`;
    }

    const notaTxt = S.modo === 'simulado' ? `<p>Nota ${(acertos * 0.25).toFixed(2).replace('.', ',')} de 10,00 (cada questão vale 0,25)</p>` : '';
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${esc(S.titulo)}</span></div>
      <section class="placar">
        <span class="chip">Resultado</span>
        <span class="grande">${acertos} / ${ids.length}</span>
        ${notaTxt}
      </section>
      ${edital}
      <table class="tabela">
        <thead><tr><th>Matéria</th><th class="n">Acertos</th></tr></thead>
        <tbody>${porMat.map(x => `<tr><td>${esc(x.m)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody>
      </table>
      <section class="grupo">
        <h2>Revisar questão por questão</h2>
        <div class="revisao">${ids.map((id, i) => {
          const r = S.resp[id];
          const cls = r == null ? 'branco' : certa(id) ? 'ok' : 'bad';
          const marca = r == null ? '–' : L[r];
          return `<button data-act="rever" data-i="${i}"><span class="marca ${cls}" aria-label="${cls === 'ok' ? 'certa' : cls === 'bad' ? 'errada' : 'em branco'}">${marca}</span><span class="resumo">${i + 1}. ${esc(BYID[id].tema)}: ${esc(BYID[id].enunciado)}</span></button>`;
        }).join('')}</div>
      </section>`;
    nav.hidden = false;
    const temErro = ids.some(id => !certa(id));
    navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button>${temErro ? `<button class="nb prim" data-act="refazer">Refazer erradas</button>` : ''}`;
    window.scrollTo(0, 0);
  }

  // ---------- Folha de respostas das provas reais ----------
  let F = null; // { pid }
  function folhaDe(pid) {
    store.folhas = store.folhas || {};
    store.folhas[pid] = store.folhas[pid] || { marcas: {}, corrigida: false };
    return store.folhas[pid];
  }
  function contarFolha(pid, marcas) {
    const p = PROVAS[pid];
    const por = p.blocos.map(([nome, a, b]) => {
      let ok = 0;
      for (let n = a; n <= b; n++) { const g = p.gab[n - 1]; if (g === '*' || L[marcas[n]] === g) ok++; }
      return { nome, total: b - a + 1, ok };
    });
    return { por, acertos: por.reduce((s, x) => s + x.ok, 0) };
  }
  function folha() {
    const p = PROVAS[F.pid], f = folhaDe(F.pid);
    const marcadas = Object.keys(f.marcas).length;
    let topo = '';
    if (f.corrigida) {
      const c = contarFolha(F.pid, f.marcas);
      topo = `<section class="placar"><span class="chip">Resultado</span><span class="grande">${c.acertos} / ${p.gab.length}</span>
        ${p.gab.includes('*') ? '<p class="nota">Questão anulada conta ponto para todo mundo, como na prova.</p>' : ''}</section>
        <table class="tabela"><thead><tr><th>Parte</th><th class="n">Acertos</th></tr></thead>
        <tbody>${c.por.map(x => `<tr><td>${esc(x.nome)}</td><td class="n">${x.ok} / ${x.total}</td></tr>`).join('')}</tbody></table>
        <p class="nota">Verde cheio: você acertou. Vermelho: você errou, e a certa aparece com contorno verde.</p>`;
    } else {
      topo = `<p class="aviso">A primeira página do PDF é o gabarito. Pule ela para não ver as respostas.</p>
        <a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir a prova (PDF)</a>`;
    }
    const blocos = p.blocos.map(([nome, a, b]) => {
      let linhas = '';
      for (let n = a; n <= b; n++) {
        const g = p.gab[n - 1], m = f.marcas[n];
        const bs = [0, 1, 2, 3, 4].map(k => {
          let cls = 'b', extra = '';
          if (f.corrigida && g !== '*') {
            if (m === k) cls += L[k] === g ? ' certa' : ' errada';
            else if (L[k] === g) cls += ' gab';
          } else if (m === k) extra = ' aria-pressed="true"';
          if (!f.corrigida && m !== k) extra = ' aria-pressed="false"';
          return `<button class="${cls}" data-act="fm" data-n="${n}" data-k="${k}"${extra} ${f.corrigida ? 'disabled' : ''} aria-label="Questão ${n}, alternativa ${L[k]}">${L[k]}</button>`;
        }).join('');
        const obs = f.corrigida && g === '*' ? '<span class="obs">Anulada: ponto para todos</span>' : '';
        linhas += `<div class="lf"><span class="nq">${String(n).padStart(2, '0')}</span><div class="bs">${bs}</div>${obs}</div>`;
      }
      return `<div class="bloco"><h3>${esc(nome)} · ${a} a ${b}</h3><div class="linhas">${linhas}</div></div>`;
    }).join('');
    view.innerHTML = `
      <div class="barra-sup"><button class="sair" data-act="inicio">← Início</button><span class="pos">${marcadas} / ${p.gab.length} marcadas</span></div>
      <header class="topo"><span class="sub chip">${esc(p.sub)}</span><h1>${esc(p.titulo)}</h1></header>
      ${topo}
      <div class="folha">${blocos}</div>`;
    nav.hidden = false;
    if (confirmar) {
      navIn.innerHTML = `<p>${esc(confirmar.msg)}</p><button class="nb" data-act="conf-nao">Voltar</button><button class="nb perigo" data-act="conf-sim">${esc(confirmar.rotuloSim)}</button>`;
    } else if (f.corrigida) {
      navIn.innerHTML = `<button class="nb" data-act="inicio">Início</button><button class="nb prim" data-act="folha-refazer">Fazer de novo</button>`;
    } else {
      navIn.innerHTML = `<button class="nb" data-act="folha-limpar" ${marcadas ? '' : 'disabled'}>Apagar marcações</button><button class="nb prim" data-act="folha-corrigir">Corrigir</button>`;
    }
  }

  // ---------- Eventos ----------
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const rolar = () => window.scrollTo(0, 0);
    switch (act) {
      case 'simulado': iniciar('simulado', 'Simulado de 40', montarSimulado()); rolar(); break;
      case 'rapida': iniciar('pratica', 'Rodada rápida', embaralhar(Q.map(q => q.id)).slice(0, 10)); rolar(); break;
      case 'erros': iniciar('pratica', 'Refazer erros', Object.keys(store.res).filter(id => BYID[id] && !store.res[id].ok)); rolar(); break;
      case 'tema': {
        const t = temas().find(t => t.materia + '|' + t.tema === el.dataset.tema);
        if (t) { iniciar('pratica', t.tema, t.ids.slice()); rolar(); }
        break;
      }
      case 'marcar': {
        const id = S.ids[S.i], k = Number(el.dataset.k);
        S.resp[id] = k;
        if (S.modo !== 'simulado') registrar(id, k === BYID[id].correta);
        questao();
        break;
      }
      case 'prox': if (S.i < S.ids.length - 1) { S.i++; questao(); rolar(); } break;
      case 'ant': if (S.i > 0) { S.i--; questao(); rolar(); } break;
      case 'entregar': {
        const brancos = S.ids.filter(id => S.resp[id] == null).length;
        if (brancos) { confirmar = { msg: `${brancos} ${brancos === 1 ? 'questão está' : 'questões estão'} em branco. Entregar assim mesmo?`, sim: 'entregar-ja', rotuloSim: 'Entregar' }; barraNav(); }
        else entregar();
        break;
      }
      case 'sair': {
        if (S.modo === 'simulado' && !S.entregue && Object.keys(S.resp).length) {
          confirmar = { msg: 'Sair sem entregar? As respostas deste simulado não serão salvas.', sim: 'inicio', rotuloSim: 'Sair' };
          barraNav();
        } else if ((S.modo === 'simulado' && S.entregue) || S.modo === 'pratica-fim') { resultado(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'conf-nao': confirmar = null; if (F) folha(); else barraNav(); break;
      case 'conf-sim': {
        const alvo = confirmar.sim; confirmar = null;
        if (alvo === 'entregar-ja') entregar();
        else if (alvo === 'folha-corrigir-ja') { folhaDe(F.pid).corrigida = true; salvar(); folha(); rolar(); }
        else if (alvo === 'folha-limpar-ja') { folhaDe(F.pid).marcas = {}; salvar(); folha(); }
        else { inicio(); rolar(); }
        break;
      }
      case 'folha': F = { pid: el.dataset.p }; S = null; confirmar = null; folha(); rolar(); break;
      case 'fm': {
        const f = folhaDe(F.pid), n = Number(el.dataset.n), k = Number(el.dataset.k);
        if (f.marcas[n] === k) delete f.marcas[n]; else f.marcas[n] = k;
        salvar(); folha();
        break;
      }
      case 'folha-corrigir': {
        const f = folhaDe(F.pid), faltam = PROVAS[F.pid].gab.length - Object.keys(f.marcas).length;
        if (faltam) { confirmar = { msg: `${faltam} ${faltam === 1 ? 'questão está' : 'questões estão'} sem marcação. Corrigir assim mesmo?`, sim: 'folha-corrigir-ja', rotuloSim: 'Corrigir' }; folha(); }
        else { f.corrigida = true; salvar(); folha(); rolar(); }
        break;
      }
      case 'folha-limpar': confirmar = { msg: 'Apagar todas as marcações desta prova?', sim: 'folha-limpar-ja', rotuloSim: 'Apagar' }; folha(); break;
      case 'folha-refazer': store.folhas[F.pid] = { marcas: {}, corrigida: false }; salvar(); folha(); rolar(); break;
      case 'fim': S.modo = 'pratica-fim'; resultado(); break;
      case 'resultado': resultado(); break;
      case 'rever': S.i = Number(el.dataset.i); questao(); rolar(); break;
      case 'refazer': iniciar('pratica', 'Refazer erradas', S.ids.filter(id => S.resp[id] !== BYID[id].correta)); rolar(); break;
      case 'inicio': inicio(); rolar(); break;
      case 'zerar': confirmarZerar = true; inicio(); break;
      case 'zerar-nao': confirmarZerar = false; inicio(); break;
      case 'zerar-sim': store = { res: {} }; salvar(); confirmarZerar = false; inicio(); break;
    }
  });

  // Mantém a sessão aberta quando a página é atualizada enquanto ela estuda.
  function start(data) {
    if (data && data.S && data.S.ids && data.S.ids.every(id => BYID[id])) {
      S = data.S;
      if (S.modo === 'pratica-fim' || (S.modo === 'simulado' && S.entregue && data.tela === 'resultado')) resultado(); else questao();
    } else inicio();
  }
  if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S, tela: view.querySelector('.placar') ? 'resultado' : 'questao' }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
