<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
<title>Simulado HCPA</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: uma coluna estreita, como um caderno de questões; alternativas viram as bolhas da folha óptica. */
:root {
  --paper: #fbf2f6;
  --card: #ffffff;
  --ink: #2b1a25;
  --muted: #6f5967;
  --line: #e3c6d4;
  --pen: #b4306b;
  --pen-fill: #b4306b;
  --pen-soft: #fbe3ee;
  --ok: #1d7748;
  --ok-soft: #e2f3e9;
  --bad: #c2410c;
  --bad-soft: #fdebdd;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1016; --card: #25161f; --ink: #f7eaf1; --muted: #b59cab; --line: #4a2e3c;
    --pen: #f38bb9; --pen-fill: #e36fa2; --pen-soft: #3f1a2d; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff9d5c; --bad-soft: #3a1c22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1016; --card: #25161f; --ink: #f7eaf1; --muted: #b59cab; --line: #4a2e3c;
  --pen: #f38bb9; --pen-fill: #e36fa2; --pen-soft: #3f1a2d; --ok: #55c98f; --ok-soft: #11301f; --bad: #ff9d5c; --bad-soft: #3a1c22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 680px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.2rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--pen); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }

.faixa {
  font-size: 0.92rem; color: var(--muted); margin-top: -4px;
}
.topo { display: flex; flex-direction: column; gap: 10px; }
.contagem { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.contagem .dias { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--pen); font-variant-numeric: tabular-nums; }
.contagem .rot { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats div { background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.8rem; color: var(--muted); }

.acoes { display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  border: 1px solid var(--line); background: var(--card); border-radius: var(--r);
  padding: 14px 16px; text-align: left; cursor: pointer; min-height: 52px;
}
.btn small { display: block; color: var(--muted); font-size: 0.85rem; }
.btn.prim { background: var(--pen-fill); border-color: var(--pen-fill); color: var(--card); }
.btn.prim small { color: var(--card); opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: default; }
.seta { font-family: var(--f-mono); flex: none; color: var(--pen); }

.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.temas { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.tema { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.tema:first-child { border-top: 0; }
.tema .nome { min-width: 0; }
.tema .qtd { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.barra { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; }
.barra i { display: block; height: 100%; background: var(--ok); }
.barra i.e { background: var(--bad); }

details.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 12px 14px; }
details.material summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
details.material ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
details.material li a { display: inline-block; padding: 10px 0; }
.nota { color: var(--muted); font-size: 0.88rem; }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-btn { background: none; border: 0; padding: 0; color: var(--pen); text-decoration: underline; cursor: pointer; font-size: 0.88rem; }

/* Questão */
.barra-sup { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.barra-sup .pos { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.progresso { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progresso i { display: block; height: 100%; background: var(--pen); }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pen); background: var(--pen-soft); padding: 4px 8px; border-radius: 6px; }
.questao { display: flex; flex-direction: column; gap: 16px; }
.questao .num { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
details.texto { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--muted); }
details.texto summary { cursor: pointer; font-weight: 700; color: var(--ink); }
details.texto p { margin-top: 10px; white-space: pre-line; font-size: 0.95rem; color: var(--ink); }
.enunciado { font-size: 1.15rem; font-weight: 700; line-height: 1.45; white-space: pre-line; }
.origem { font-size: 0.85rem; color: var(--muted); }
.feito { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.feito h2 { color: var(--ok); font-size: 1.4rem; }
.itens { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.itens li { padding-left: 12px; border-left: 2px solid var(--line); }
.opcoes { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
  width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 14px; cursor: pointer; min-height: 52px;
}
.opt .txt { min-width: 0; padding-top: 3px; }
.bolha {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted);
}
.opt.marcada { border-color: var(--pen); }
.opt.marcada .bolha { background: var(--pen); border-color: var(--pen); color: var(--card); }
.opt.certa { border-color: var(--ok); background: var(--ok-soft); }
.opt.certa .bolha { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.errada { border-color: var(--bad); background: var(--bad-soft); }
.opt.errada .bolha { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.apagada { opacity: 0.6; }
.opt:disabled { cursor: default; }

.feedback { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--card); }
.feedback .veredito { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.feedback.ok .veredito { color: var(--ok); }
.feedback.bad .veredito { color: var(--bad); }
.feedback blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--pen); background: var(--pen-soft); border-radius: 0 8px 8px 0; font-size: 0.95rem; white-space: pre-line; }
.feedback .fonte { font-size: 0.88rem; color: var(--muted); overflow-wrap: anywhere; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.nav .in > p { flex: 1 1 100%; font-size: 0.92rem; }
.nb { flex: 1 1 0; min-height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; padding: 0 12px; }
.nb.prim { background: var(--pen-fill); color: var(--card); border-color: var(--pen-fill); }
.nb.perigo { background: var(--bad); color: var(--card); border-color: var(--bad); }
.nb:disabled { opacity: 0.45; cursor: default; }
.sair { background: none; border: 0; color: var(--pen); cursor: pointer; padding: 6px 0; font-weight: 700; }

/* Resultado */
.placar { display: flex; flex-direction: column; gap: 6px; }
.placar .grande { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.veredito-edital { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.veredito-edital.ok { border-color: var(--ok); background: var(--ok-soft); }
.veredito-edital.bad { border-color: var(--bad); background: var(--bad-soft); }
.tabela { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabela th, .tabela td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); }
.tabela th { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; border-top: 0; }
.tabela td.n, .tabela th.n { text-align: right; font-family: var(--f-mono); white-space: nowrap; }
.revisao { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.revisao button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.revisao button:first-child { border-top: 0; }
.revisao .marca { font-family: var(--f-mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; color: var(--card); }
.revisao .marca.ok { background: var(--ok); }
.revisao .marca.bad { background: var(--bad); }
.revisao .marca.branco { background: var(--muted); }
.revisao .resumo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
/* Provas reais e folha de respostas */
.provas { display: flex; flex-direction: column; gap: 10px; }
.prova-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.prova-card h3 { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.prova-card .sub { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { flex: 1 1 140px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); padding: 0 12px; font-size: 0.95rem; }
.mini.prim { background: var(--pen-fill); border-color: var(--pen-fill); color: var(--card); }
.aviso { background: var(--pen-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.folha { display: flex; flex-direction: column; gap: 18px; }
.bloco { display: flex; flex-direction: column; gap: 6px; }
.bloco h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.linhas { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; display: flex; flex-direction: column; }
.lf { display: flex; align-items: center; gap: 10px; padding-block: 5px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.lf:first-child { border-top: 0; }
.lf .nq { font-family: var(--f-mono); width: 2.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
.lf .bs { display: flex; gap: 8px; }
.lf .obs { font-size: 0.8rem; color: var(--muted); flex-basis: 100%; padding-left: calc(2.2em + 10px); }
.b { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--muted); background: none; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); cursor: pointer; padding: 0; }
.b[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.b.certa { background: var(--ok); border-color: var(--ok); color: var(--card); }
.b.errada { background: var(--bad); border-color: var(--bad); color: var(--card); }
.b.gab { border-color: var(--ok); color: var(--ok); border-width: 3px; }
.b:disabled { cursor: default; }
/* Tarefa do dia, resumos, plano e títulos */
.hoje { background: var(--card); border: 1px solid var(--pen); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.hoje .meta { color: var(--muted); font-size: 0.92rem; margin-top: -6px; }
.hoje h2 { font-size: 1.35rem; }
.hoje ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 2px; }
.hoje .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.passos-plano { display: flex; gap: 4px; }
.passos-plano i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.passos-plano i.f { background: var(--ok); }
.resumo { display: flex; flex-direction: column; gap: 14px; }
.resumo-cab { display: flex; flex-direction: column; gap: 6px; }
.resumo-cab h2 { font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
.resumo-cab .meta { color: var(--muted); font-size: 0.92rem; }
.resumo-cab .porque { font-size: 1rem; }
.ferramentas { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.modos { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.modo { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: none; cursor: pointer; font-weight: 700; color: var(--muted); }
.modo[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); }
.modo:disabled { opacity: 0.45; cursor: default; }
.ouvir { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-weight: 700; }
.ouvir svg { color: var(--pen); }
.ouvir[aria-pressed="true"] { border-color: var(--pen); }
.gtitulo { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; margin-top: 10px; }
.pontos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.pontos li { display: grid; grid-template-columns: 1.8em 1fr; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); transition: background-color 0.25s ease-out; }
.pontos li:first-child { border-top: 0; }
.pontos .num { color: var(--pen); font-weight: 800; font-variant-numeric: tabular-nums; }
.pontos .corpo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pontos .chave { color: var(--ink); font-weight: 800; background: linear-gradient(transparent 62%, var(--pen-soft) 62%); }
.pontos .ref { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.pontos li.falando { background: var(--pen-soft); }
.pontos li.lembrou .num { color: var(--ok); }
.pontos li.revisar .num { color: var(--bad); }
.lacuna { display: inline-block; min-height: 32px; padding: 2px 12px; border-radius: 8px; border: 1px dashed var(--pen); background: var(--pen-soft); color: var(--pen); font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; vertical-align: baseline; }
.avaliar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.avaliar span { color: var(--muted); font-size: 0.92rem; }
.avaliar .mini { flex: 0 1 auto; min-height: 40px; }
.veredito-ponto { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.lembrou .veredito-ponto { color: var(--ok); }
.revisar .veredito-ponto { color: var(--bad); }
.pega-ponto { font-size: 0.95rem; padding: 8px 10px; border-radius: 8px; background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.pega-ponto b { color: var(--bad); }
.armadilhas { background: var(--card); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.armadilhas h3, .exemplo h3, .videos h3 { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; color: var(--ink); text-transform: none; letter-spacing: 0; }
.armadilhas ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.exemplo { background: var(--card); border: 1px solid color-mix(in srgb, var(--pen) 40%, transparent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.exemplo ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.exemplo .resp { font-weight: 700; }
.fim-leitura { font-weight: 700; padding: 14px 0 0; border-top: 1px solid var(--line); }
.links-res { display: flex; flex-direction: column; gap: 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.links-res a { display: flex; align-items: center; min-height: 44px; }
.divisor { border: 0; border-top: 2px solid var(--ink); margin: 8px 0 0; }
.plano-lista { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.pl { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.pl:first-child { border-top: 0; }
.pl .ck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); background: none; cursor: pointer; padding: 0; color: var(--card); font-size: 0.9rem; }
.pl .ck[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.pl .abrir { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pl .abrir small { color: var(--muted); font-size: 0.82rem; }
.pl.feito .abrir b { color: var(--muted); text-decoration: line-through; }
.estrela { color: var(--pen); font-weight: 700; }
.campos { display: flex; flex-direction: column; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.campo { display: grid; grid-template-columns: 1fr 5.5em; gap: 4px 12px; align-items: center; }
.campo small { grid-column: 1 / -1; color: var(--muted); font-size: 0.82rem; }
.campo input { font: inherit; font-family: var(--f-mono); width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--paper); color: var(--ink); text-align: right; }
.lista-simples { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.videos { display: flex; flex-direction: column; gap: 8px; }
.video { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.reais ul, .lista-provas { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.reais h3 { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; }
.link-prova { width: 100%; min-height: 52px; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); cursor: pointer; font: inherit; }
.link-prova small { color: var(--muted); font-size: 0.85rem; }
.video-proprio { margin: 0; display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.video-proprio video { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--paper); }
.video-proprio figcaption { display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px; }
.video-proprio small { color: var(--muted); font-size: 0.85rem; }
.video-tit { display: flex; gap: 8px; align-items: flex-start; }
.video-tit svg { color: var(--pen); flex: none; margin-top: 4px; }
.video small { color: var(--muted); font-size: 0.85rem; }
.video span { font-size: 0.9rem; }
details.material.pesos > div { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .progresso i, .barra i { transition: width 0.3s ease; }
}
</style>
</head>

<script id="questoes" type="application/json">[{"id": "por-01", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Considere as seguintes afirmações sobre a referência de palavras do texto.", "itens": ["I – O pronome “eles” (3º parágrafo) retoma “Os profissionais administrativos”.", "II – O pronome “ela” (último período) retoma “a forma como alguém é recebido”.", "III – O pronome “aquele” (2º parágrafo) refere-se a um paciente, termo já mencionado na mesma frase."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I está correta: “São eles que organizam as filas” só pode se referir aos profissionais administrativos, sujeito do período anterior. III está correta: “aquele que é deixado sem resposta” contrapõe-se a “Um paciente que entende”, ou seja, “aquele” = o paciente. II está errada: em “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, “ela” retoma “a sobrecarga de trabalho”. A pegadinha é o termo “a forma como alguém é recebido”, que aparece depois, na oração com “pois”; o pronome anafórico aponta para trás, não para o que vem adiante.", "fundamento": "Pronomes pessoais e demonstrativos têm função referencial (anafórica): retomam um termo já expresso, normalmente o mais próximo compatível em gênero, número e sentido.", "fonte": "Coesão referencial: função anafórica dos pronomes pessoais e demonstrativos", "url": ""}, {"id": "por-02", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações sobre os nexos do texto. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) “Por isso” (1º parágrafo) introduz uma conclusão a partir do que foi dito antes.", "( ) “no entanto” (2º parágrafo) poderia ser substituído por “portanto” sem alteração de sentido.", "( ) “Embora” (3º parágrafo) introduz uma ideia de concessão.", "( ) “pois” (último período) expressa finalidade."], "alternativas": ["V – V – F – F", "V – F – V – F", "F – F – V – V", "V – F – F – V", "F – V – V – F"], "correta": 1, "explicacao": "1ª V: como quem chega traz dor e medo, conclui-se que o primeiro contato pesa muito. 2ª F: “no entanto” é adversativo (opõe a cortesia à ideia de que acolher é só ser educado); “portanto” é conclusivo e mudaria o sentido. 3ª V: “Embora” admite um fato (a sobrecarga é real) que não impede a conclusão. 4ª F: “pois”, posposto ao verbo e iniciando a oração, é explicativo/causal (dá a razão de a indiferença não se justificar); finalidade seria “para que”.", "fundamento": "Conjunções estabelecem relações lógicas: adversativas (mas, no entanto) opõem; conclusivas (portanto, por isso) concluem; concessivas (embora, ainda que) admitem um obstáculo que não impede o fato; explicativas (pois, porque) justificam.", "fonte": "Nexos/conjunções: valor semântico das coordenativas e subordinativas", "url": ""}, {"id": "por-03", "materia": "Português", "tema": "Português", "texto": "Quem chega à recepção de um hospital público raramente está ali por escolha. Traz consigo a dor, o medo e, muitas vezes, a pressa de quem não sabe o que vai ouvir. Por isso, o primeiro contato com o serviço tem um peso que vai além da burocracia: é nesse momento que o usuário decide se pode confiar na instituição.\n\nHá quem pense que acolher signifique apenas ser educado. A cortesia, no entanto, é só o ponto de partida. Acolher exige escutar a queixa com atenção, explicar com clareza os próximos passos e reconhecer os limites do que se pode oferecer naquele momento. Um paciente que entende por que está esperando tende a suportar melhor a espera do que aquele que é deixado sem resposta.\n\nOs profissionais administrativos ocupam, nesse processo, um lugar estratégico. São eles que organizam as filas, conferem documentos e encaminham cada caso ao setor adequado. Quando executam essas tarefas com respeito, contribuem para que o cuidado comece antes mesmo da consulta. Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença, pois a forma como alguém é recebido também faz parte do tratamento.", "enunciado": "No trecho “Embora a sobrecarga de trabalho seja real, ela não justifica a indiferença”, a palavra “Embora” pode ser substituída, sem alteração do sentido e sem necessidade de outras mudanças na frase, por", "alternativas": ["Ainda que", "Visto que", "Caso", "À medida que", "Para que"], "correta": 0, "explicacao": "“Embora” é concessiva, e “Ainda que” também é, mantendo o verbo no subjuntivo (“seja”). “Visto que” é causal: diria que a sobrecarga é a causa de não se justificar a indiferença, o que não faz sentido. “Caso” é condicional e tornaria hipotético um fato que o texto afirma. “À medida que” indica proporção, e “Para que”, finalidade. A pegadinha é que todas as opções “cabem” na sintaxe com o subjuntivo ou o indicativo; só a concessiva conserva o sentido.", "fundamento": "Conjunções subordinativas concessivas (embora, ainda que, mesmo que, conquanto, se bem que) introduzem um fato contrário ao da oração principal, mas insuficiente para impedi-lo; costumam exigir o subjuntivo.", "fonte": "Conjunções subordinativas concessivas: substituição mantendo o sentido", "url": ""}, {"id": "por-04", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas da frase abaixo, na ordem em que aparecem.\n\n“Entregue o laudo ___ enfermeira responsável e informe ___ ela o horário da consulta, marcada para ___ 14h.”", "alternativas": ["a – à – às", "à – à – as", "a – a – às", "à – a – as", "à – a – às"], "correta": 4, "explicacao": "1ª lacuna: entrega-se algo A alguém (preposição) + A enfermeira (artigo) = “à”. 2ª lacuna: diante do pronome pessoal “ela” não se usa artigo, logo não há crase: “a ela”. 3ª lacuna: na indicação de hora determinada, há crase: “às 14h”. A pegadinha é a 2ª lacuna: o verbo pede a preposição, mas o pronome pessoal não admite artigo.", "fundamento": "Crase é a fusão da preposição “a” com o artigo feminino “a”. Ocorre antes de palavra feminina que admite artigo e na indicação de horas; não ocorre antes de pronomes pessoais como ela, você ou eles.", "fonte": "Crase: a + artigo feminino; ausência antes de pronome pessoal; presença na indicação de horas", "url": ""}, {"id": "por-05", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.", "alternativas": ["Faziam dois meses que o paciente aguardava a cirurgia.", "Houveram muitas reclamações sobre a demora no atendimento.", "Devem haver vagas no ambulatório na próxima semana.", "Precisa-se de técnicos de enfermagem para o turno da noite.", "Aluga-se salas comerciais próximas ao hospital."], "correta": 3, "explicacao": "Em D, “precisar de” é verbo transitivo indireto; o “se” é índice de indeterminação do sujeito e o verbo fica no singular. Em A, “fazer” indicando tempo é impessoal: “Fazia dois meses”. Em B, “haver” no sentido de existir é impessoal: “Houve”. Em C, o auxiliar de “haver” impessoal também fica no singular: “Deve haver”. Em E, “alugar” é transitivo direto e o “se” é partícula apassivadora; o verbo concorda com o sujeito “salas”: “Alugam-se”. A pegadinha é tratar D e E como iguais: só com VTI o singular é obrigatório.", "fundamento": "Haver (existir) e fazer (tempo decorrido) são impessoais e ficam na 3ª pessoa do singular, inclusive o auxiliar da locução. Com VTD + se (voz passiva sintética), o verbo concorda com o sujeito; com VTI + se (índice de indeterminação), fica no singular.", "fonte": "Concordância verbal: verbos impessoais e voz passiva sintética × índice de indeterminação do sujeito", "url": ""}, {"id": "por-06", "materia": "Português", "tema": "Português", "enunciado": "Considere as frases abaixo quanto à regência verbal, segundo a norma-padrão.", "itens": ["I – A paciente preferia mais ser atendida pela manhã do que à tarde.", "II – Os usuários devem obedecer às normas de visitação do hospital.", "III – Os familiares chegaram no hospital antes do horário de visita."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 1, "explicacao": "II está correta: “obedecer” é transitivo indireto e exige a preposição “a” (obedecer às normas). I está errada: “preferir” rege a preposição “a” e não admite “mais... do que”; o correto é “preferia ser atendida pela manhã a ser atendida à tarde”. III está errada: verbos de movimento como “chegar” regem a preposição “a” na norma-padrão (“chegaram ao hospital”); “chegar em” é uso coloquial. A pegadinha é que I e III soam naturais na fala.", "fundamento": "Preferir: prefere-se uma coisa a outra, sem intensificadores. Obedecer/desobedecer: transitivos indiretos (preposição a). Chegar, ir: regem a preposição a para indicar destino.", "fonte": "Regência verbal: preferir, obedecer e chegar", "url": ""}, {"id": "por-07", "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa em que a pontuação está correta.", "alternativas": ["Os pacientes que aguardam na fila, devem apresentar o cartão do SUS.", "O hospital, que atende pelo SUS recebe pacientes de todo o estado.", "Na semana passada, a ouvidoria recebeu elogios, sugestões e reclamações.", "A enfermeira explicou, os cuidados ao familiar do paciente.", "Senhora, Maria por favor, aguarde ser chamada."], "correta": 2, "explicacao": "Em C, a vírgula isola o adjunto adverbial deslocado para o início (“Na semana passada”) e as demais separam os itens de uma enumeração. Em A, há vírgula entre o sujeito (“Os pacientes que aguardam na fila”) e o verbo (“devem”). Em B, a oração adjetiva explicativa foi aberta e não fechada: “O hospital, que atende pelo SUS, recebe...”. Em D, a vírgula separa o verbo de seu complemento. Em E, o vocativo é “Senhora Maria” e deve vir isolado inteiro: “Senhora Maria, por favor, aguarde...”.", "fundamento": "Não se separa por vírgula o sujeito do verbo nem o verbo de seus complementos. Isolam-se por vírgulas o adjunto adverbial deslocado, os termos de enumeração, as orações adjetivas explicativas (nos dois lados) e o vocativo.", "fonte": "Pontuação: emprego da vírgula", "url": ""}, {"id": "inf-01", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha do Excel, a célula B2 contém a fórmula =A2*$C$1. Essa célula foi copiada e colada na célula C3 (uma linha abaixo e uma coluna à direita). A fórmula que aparecerá em C3 é", "alternativas": ["=A3*$C$1", "=B3*$D$2", "=A2*$C$1", "=B3*$D$1", "=B3*$C$1"], "correta": 4, "explicacao": "A referência A2 é relativa: ao deslocar a fórmula uma linha para baixo e uma coluna para a direita, ela vira B3. A referência $C$1 é absoluta (cifrão antes da coluna e da linha) e não muda. Resultado: =B3*$C$1. As pegadinhas: em A só a linha foi ajustada; em B e D a referência absoluta foi tratada como relativa; em C nada foi ajustado.", "fundamento": "A página da Microsoft explica que, por padrão, a referência é relativa e se ajusta ao ser copiada; o cifrão antes da coluna e da linha ($A$1) a torna absoluta, e F4 alterna entre os tipos. Na tabela do suporte, $A$1 copiada continua $A$1, enquanto A1 vira C3.", "fonte": "Microsoft Suporte – Alternar entre referências relativas, absolutas e mistas", "url": "https://support.microsoft.com/pt-br/office/alternar-entre-refer%C3%AAncias-relativas-absolutas-e-mistas-dfec08cd-ae65-4f56-839e-5f0d8d0baca9", "sub": "info-planilhas"}, {"id": "inf-02", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre funções de pesquisa do Excel.", "itens": ["I – Na função PROCV, o valor procurado deve estar na primeira coluna do intervalo informado como matriz_tabela.", "II – Na fórmula =PROCV(A2;D2:F50;3;FALSO), o número 3 indica que o valor retornado virá da coluna F, e o argumento FALSO indica correspondência exata.", "III – Assim como a PROCV, a função PROCX só pesquisa da esquerda para a direita, não podendo retornar valores de colunas situadas à esquerda da coluna pesquisada."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I está correta: a primeira coluna da matriz deve conter o valor procurado. II está correta: o índice de coluna conta a partir da primeira coluna da matriz (D=1, E=2, F=3), e FALSO/0 pede correspondência exata. III está errada: essa limitação é da PROCV; a PROCX recebe a matriz de pesquisa e a de retorno separadamente e funciona com o retorno de qualquer lado. Pegadinha extra: o índice 3 não é a 3ª coluna da planilha (C), e sim a 3ª coluna da matriz.", "fundamento": "Suporte Microsoft: a primeira coluna do intervalo deve conter o valor procurado; o número da coluna começa em 1 na coluna mais à esquerda da matriz; 0/FALSO pesquisa o valor exato. A PROCX retorna resultados independentemente do lado da coluna de retorno, ao contrário da PROCV.", "fonte": "Microsoft Suporte – Função PROCV; Função PROCX", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-procv-0bbc8083-26fe-4963-8ab8-93a18ad188a1", "sub": "info-planilhas"}, {"id": "inf-03", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha (Excel ou Google Planilhas), o intervalo B2:B7 contém, nesta ordem, os textos Agendado, Faltou, Agendado, Atendido, Faltou, Faltou; o intervalo C2:C7 contém os tempos de espera 20, 35, 15, 40, 25, 15. Foram digitadas as fórmulas: D1: =CONT.SE(B2:B7;\"Faltou\") | D2: =SE(D1>3;\"Revisar agenda\";\"Normal\") | D3: =MÉDIA(C2:C7). Os resultados exibidos em D1, D2 e D3 são, respectivamente,", "alternativas": ["3 – Normal – 25", "3 – Revisar agenda – 25", "2 – Normal – 25", "3 – Normal – 30", "4 – Revisar agenda – 22,5"], "correta": 0, "explicacao": "CONT.SE conta as células de B2:B7 iguais a \"Faltou\": são 3 (B3, B6 e B7). Em D2, o teste é D1>3, ou seja, 3>3, que é FALSO; por isso SE devolve o terceiro argumento, \"Normal\". MÉDIA: (20+35+15+40+25+15)/6 = 150/6 = 25. A pegadinha é o operador “maior que” (>) e não “maior ou igual” (>=): com 3 faltas o teste é falso.", "fundamento": "CONT.SE(intervalo; critério) conta as células do intervalo que atendem ao critério. SE(teste_lógico; valor_se_verdadeiro; [valor_se_falso]) devolve o segundo argumento se o teste for VERDADEIRO e o terceiro se for FALSO.", "fonte": "Microsoft Suporte – Função CONT.SE; Função SE", "url": "https://support.microsoft.com/pt-br/office/fun%C3%A7%C3%A3o-cont-se-e0de10c6-f885-4e71-abb4-1f464816df34", "sub": "info-planilhas"}, {"id": "inf-04", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre o compartilhamento de arquivos no Google Drive, assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Quem recebe o acesso de Leitor pode ver e abrir o arquivo, mas não pode editá-lo, comentá-lo nem compartilhá-lo.", "( ) Quem recebe o acesso de Comentador (comentarista) pode adicionar comentários e fazer sugestões, mas não editar o conteúdo diretamente.", "( ) Por padrão, os Editores podem mudar as permissões e compartilhar o arquivo, mas essa possibilidade pode ser desativada nas configurações de compartilhamento.", "( ) Quando o acesso geral é definido como “Qualquer pessoa com o link”, só consegue abrir o arquivo quem tem Conta do Google e foi convidado individualmente."], "alternativas": ["V – F – V – F", "F – V – V – V", "V – V – F – F", "V – V – V – F", "V – F – F – V"], "correta": 3, "explicacao": "As três primeiras estão de acordo com a Central de Ajuda do Drive: Leitor só vê; Comentador comenta e sugere; Editor edita e, por padrão, também compartilha e muda permissões, o que pode ser desligado desmarcando “Permitir que os editores mudem as permissões e compartilhem”. A quarta é falsa: com “Qualquer pessoa com o link”, quem tiver o link abre o arquivo mesmo sem fazer login; convite individual é o modo “Restrito”. Observação: a página atual do Drive chama o papel de “Comentador”; outras páginas do Google usam “comentarista”.", "fundamento": "Segundo a Central de Ajuda do Google Drive, Leitores não editam, comentam nem compartilham; Editores podem mudar permissões e compartilhar por padrão; com “Qualquer pessoa com o link”, qualquer pessoa que tenha o link abre o arquivo sem fazer login.", "fonte": "Google Drive Ajuda – Compartilhar arquivos do Google Drive", "url": "https://support.google.com/drive/answer/2494822?hl=pt-BR", "sub": "info-docs-drive"}, {"id": "inf-05", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre revisão colaborativa de documentos.", "itens": ["I – No Documentos Google, uma pessoa com permissão para comentar pode sugerir edições; as sugestões aparecem destacadas, o texto excluído aparece tachado, e o texto original só é substituído se a sugestão for aceita.", "II – No Microsoft Word, o recurso Controlar Alterações é ativado pela guia Revisão.", "III – No Microsoft Word, é possível aceitar ou rejeitar as alterações uma a uma ou todas de uma vez."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três estão corretas. I: o Google permite sugerir edições a quem tem permissão de comentar ou editar; o que se exclui fica tachado e só substitui o original após aprovação. II: no Word, o caminho é Revisão > Controlar Alterações. III: o Word oferece Aceitar/Rejeitar para cada alteração e “Aceitar Todas as Alterações” / “Rejeitar Todas as Alterações”. A pegadinha é supor que só Editores sugerem no Google Docs: Comentaristas também podem.", "fundamento": "Google: as pessoas podem sugerir edições quando têm permissão para comentar ou editar; exclusões aparecem tachadas e as sugestões aprovadas substituem o original. Microsoft: na guia Revisão, Controlar Alterações; aceitar ou rejeitar uma a uma ou todas.", "fonte": "Google Documentos Ajuda – Sugerir edições; Microsoft Suporte – Controlar alterações no Word", "url": "https://support.google.com/docs/answer/6033474?hl=pt-BR", "sub": "info-docs-drive"}, {"id": "inf-06", "materia": "Informática", "tema": "Informática", "enunciado": "De acordo com a Cartilha de Segurança para Internet (CERT.br), assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Pagar o resgate exigido por um ransomware garante a recuperação dos dados; por isso, manter backups é dispensável.", "( ) Phishing é a fraude em que o golpista tenta obter dados pessoais e financeiros combinando meios técnicos e engenharia social, por exemplo com mensagens que se passam pela comunicação oficial de uma instituição.", "( ) Com a verificação em duas etapas ativada, mesmo que o atacante descubra a senha, ele precisará de outras informações para acessar a conta.", "( ) O recebimento de códigos por SMS é o método de verificação em duas etapas mais seguro e deve ser preferido à chave de segurança física."], "alternativas": ["V – V – F – F", "F – V – V – F", "F – F – V – V", "V – F – V – F", "F – V – F – V"], "correta": 1, "explicacao": "1ª F: a Cartilha afirma que pagar o resgate não garante o acesso aos dados, e que a única garantia é ter backups atualizados. 2ª V: é a definição de phishing do livro da Cartilha. 3ª V: é o que o fascículo Autenticação diz sobre a verificação em duas etapas. 4ª F: o fascículo diz que a chave de segurança física é a opção mais segura e recomenda usar SMS só se não houver outras opções.", "fundamento": "Cartilha: ransomware torna os dados inacessíveis e cobra resgate, que não garante a recuperação; backups atualizados são a única garantia. Phishing combina meios técnicos e engenharia social. Na verificação em duas etapas, prefira chave física ou aplicativo; SMS só sem alternativa.", "fonte": "CERT.br – Cartilha: página Ransomware (cartilha.cert.br/ransomware/); Fascículo Autenticação; Livro, cap. Golpes na Internet, seção 2.3 Phishing", "url": "https://cartilha.cert.br/ransomware/", "sub": "info-seguranca"}, {"id": "inf-07", "materia": "Informática", "tema": "Informática", "enunciado": "Segundo a Cartilha de Segurança para Internet (CERT.br), assinale a alternativa correta sobre certificado digital e assinatura digital.", "alternativas": ["A assinatura digital garante a confidencialidade de um documento, impedindo que terceiros leiam o seu conteúdo.", "A assinatura digital é gerada com a chave pública do autor e verificada com a chave privada dele.", "O certificado digital associa uma chave pública a uma entidade e é emitido por uma Autoridade Certificadora (AC), que também publica a lista dos certificados que deixaram de ser confiáveis.", "Todo certificado autoassinado é malicioso, pois somente uma AC comercial pode emitir certificados legítimos.", "O certificado digital não possui prazo de validade: uma vez emitido, vale até ser revogado."], "correta": 2, "explicacao": "C reproduz a definição da Cartilha: registro eletrônico que distingue uma entidade e a associa a uma chave pública, emitido por uma AC, que publica a Lista de Certificados Revogados (LCR). A está errada: a assinatura digital comprova autenticidade e integridade, não sigilo. B inverte as chaves: assina-se com a chave privada e verifica-se com a pública. D está errada: as ACs raízes têm certificado autoassinado, e há usos legítimos (o uso malicioso também existe). E está errada: a validade (data de emissão e de expiração) é um dos dados do certificado.", "fundamento": "Cartilha (cap. Criptografia): a assinatura digital comprova autenticidade e integridade; é feita com a chave privada e verificada com a pública. O certificado associa uma chave pública a uma entidade, é emitido por uma AC, que mantém a LCR, e traz a validade.", "fonte": "CERT.br – Cartilha de Segurança para Internet (livro), cap. 9 Criptografia, seções 9.3 Assinatura digital e 9.4 Certificado digital", "url": "https://cartilha.cert.br/livro/", "sub": "info-seguranca"}, {"id": "inf-08", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha do Excel, as células A1, B1 e C1 contêm, respectivamente, os números 10, 4 e 2. Na célula D1 foi digitada a fórmula =A1+B1*C1^2. O valor exibido em D1 é", "alternativas": ["56", "26", "74", "324", "784"], "correta": 1, "explicacao": "Passo 1: troque as referências pelos números: =10+4*2^2. Passo 2: o Excel faz primeiro a potência: 2^2 = 4. Passo 3: depois a multiplicação: 4*4 = 16. Passo 4: por último a soma: 10+16 = 26. As erradas vêm de fazer as contas fora de ordem: 56 é (10+4)*4; 74 é 10+(4*2)^2; 324 é (10+4*2)^2; 784 é ((10+4)*2)^2. Contas conferidas em Python.", "fundamento": "Na ordem de precedência do Excel, a exponenciação (^) vem antes da multiplicação e da divisão, que vêm antes da adição e da subtração. Parênteses mudam essa ordem: =5+2*3 dá 11 e =(5+2)*3 dá 21.", "fonte": "Microsoft Suporte: A ordem em que o Excel efetua operações em fórmulas", "url": "https://support.microsoft.com/pt-br/office/a-ordem-em-que-o-excel-efetua-opera%C3%A7%C3%B5es-em-f%C3%B3rmulas-28eaf0d7-7058-4eff-a8ea-0a835fafadb8", "sub": "info-planilhas"}, {"id": "inf-09", "materia": "Informática", "tema": "Informática", "enunciado": "Em uma planilha (Excel ou Google Planilhas), o intervalo A2:A7 contém os setores Clínica, UTI, Emergência, UTI, Clínica, UTI, e o intervalo B2:B7 contém os gastos com material, em reais: 120, 80, 210, 45, 30, 75. As fórmulas =SOMASE(A2:A7;\"UTI\";B2:B7) e =CONT.SE(A2:A7;\"UTI\") retornam, respectivamente,", "alternativas": ["560 e 3", "3 e 200", "150 e 2", "200 e 3", "200 e 6"], "correta": 3, "explicacao": "SOMASE: Passo 1: ache as linhas em que A diz \"UTI\": linhas 3, 5 e 7. Passo 2: some os gastos dessas linhas na coluna B: 80 + 45 + 75 = 200. CONT.SE: conta quantas células de A2:A7 são \"UTI\": 3. Resposta: 200 e 3. As erradas: 560 é a soma de todos os gastos (sem critério); \"3 e 200\" inverte a ordem; 150 e 2 são os números da Clínica; 6 é o total de linhas. Contas conferidas em Python.", "fundamento": "SOMASE(intervalo; critérios; [intervalo_soma]) soma as células de intervalo_soma cujas linhas atendem ao critério em intervalo. CONT.SE(intervalo; critério) conta as células que atendem ao critério. As duas funções têm o mesmo nome e a mesma ordem de argumentos no Google Planilhas em português.", "fonte": "Microsoft Suporte: Função SOMASE; Ajuda do Editores de Documentos Google: SOMASE e CONT.SE", "url": "https://support.microsoft.com/pt-br/office/somase-fun%C3%A7%C3%A3o-169b8c99-c05c-4483-a712-1697a653039b", "sub": "info-planilhas"}, {"id": "inf-10", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo sobre mensagens de erro no Excel.", "itens": ["I – A fórmula =B2/C2 exibe #DIV/0! quando a célula C2 está vazia.", "II – A fórmula =PROCV(\"Pediatria\";A2:B7;2;FALSO) exibe #N/D quando o texto Pediatria não existe na coluna A.", "III – A fórmula =SOMMA(B2:B7), com o nome da função digitado errado, exibe #NOME?."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três estão corretas. I: dividir por zero ou por célula vazia gera #DIV/0!. Como C2 está vazia, =B2/C2 mostra esse erro. II: #N/D quer dizer valor não disponível. A causa mais comum é uma função de procura, como o PROCV, não achar o que foi pedido. III: o Excel não reconhece SOMMA como nome de função, então mostra #NOME?. Dica para decorar: DIV de dividir, N/D de não disponível, NOME de nome errado.", "fundamento": "Segundo o suporte da Microsoft: #DIV/0! aparece quando um número é dividido por zero ou por uma célula vazia; #N/D, quando um valor não está disponível para a função ou fórmula; #NOME?, quando o Excel não reconhece o texto da fórmula.", "fonte": "Microsoft Suporte: Detectar erros de fórmula no Excel; Como corrigir um erro #N/D", "url": "https://support.microsoft.com/pt-br/excel/detect-formula-errors-in-excel", "sub": "info-planilhas"}, {"id": "inf-11", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre atalhos de teclado no Microsoft Word para Windows, em português, e no Documentos Google, assinale a alternativa correta.", "alternativas": ["No Word em português, Ctrl+B aplica negrito, assim como no Documentos Google.", "Nos dois programas, Ctrl+Z refaz a última ação que foi desfeita.", "No Word em português, Ctrl+N aplica negrito e Ctrl+S aplica sublinhado; no Documentos Google, o negrito é Ctrl+B e o sublinhado é Ctrl+U.", "No Word, Ctrl+X copia o texto selecionado e Ctrl+C o recorta.", "No Documentos Google, Ctrl+I insere um comentário no trecho selecionado."], "correta": 2, "explicacao": "C está certa. O Word em português usa as iniciais em português: N de negrito, I de itálico, S de sublinhado. O Documentos Google usa as iniciais em inglês: B (bold) para negrito e U (underline) para sublinhado. A está errada: no Word em português, Ctrl+B salva o documento. B está errada: Ctrl+Z desfaz; para refazer, o Word usa Ctrl+Y e o Docs usa Ctrl+Shift+Z. D inverteu: Ctrl+C copia e Ctrl+X recorta. E está errada: no Docs, Ctrl+I é itálico; comentário é Ctrl+Alt+M.", "fundamento": "Suporte da Microsoft (Word para Windows, pt-BR): negrito Ctrl+N, itálico Ctrl+I, sublinhado Ctrl+S, salvar Ctrl+B, desfazer Ctrl+Z, refazer Ctrl+Y. Ajuda do Documentos Google: negrito Ctrl+B, itálico Ctrl+I, sublinhado Ctrl+U, refazer Ctrl+Shift+Z, inserir comentário Ctrl+Alt+M.", "fonte": "Microsoft Suporte: Atalhos de teclado no Word; Ajuda do Documentos Google: Atalhos de teclado", "url": "https://support.microsoft.com/pt-br/office/atalhos-de-teclado-no-word-95ef89dd-7142-4b50-afb2-f762f663ceb2", "sub": "info-docs-drive"}, {"id": "inf-12", "materia": "Informática", "tema": "Informática", "enunciado": "Sobre recursos do Documentos Google e do Google Drive, assinale V (verdadeiro) ou F (falso). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) No Documentos Google, é preciso ter permissão de editor para ver o histórico de versões de um arquivo.", "( ) No histórico de versões do Documentos Google, é possível dar um nome a uma versão.", "( ) No Google Drive, os arquivos excluídos ficam na lixeira por 30 dias e depois são excluídos permanentemente.", "( ) No Documentos Google, ao clicar em Resolver em um comentário, ele é apagado e não pode mais ser reaberto."], "alternativas": ["V – V – V – F", "V – F – V – V", "F – V – F – F", "V – V – F – V", "F – F – V – F"], "correta": 0, "explicacao": "1ª V: a Ajuda do Google diz que, sem permissão para editar, não é possível ver o histórico de versões. 2ª V: no histórico, dá para escolher uma versão e usar Nomear esta versão. 3ª V: arquivos excluídos ficam 30 dias na lixeira e depois são apagados de vez. 4ª F: Resolver apenas fecha o comentário. Ele continua na lista de comentários e pode ser reaberto com o botão Reabrir.", "fundamento": "Ajuda do Google: ver o histórico de versões exige permissão de editor, e é possível nomear versões; na lixeira do Drive, os arquivos permanecem por 30 dias antes da exclusão permanente; um comentário resolvido pode ser visto na lista de comentários e reaberto.", "fonte": "Ajuda do Documentos Google: Ver atividade e versões; Ajuda do Google Drive: Excluir e restaurar arquivos; Ajuda do Documentos Google: Usar comentários", "url": "https://support.google.com/docs/answer/190843?hl=pt-BR", "sub": "info-docs-drive"}, {"id": "inf-13", "materia": "Informática", "tema": "Informática", "enunciado": "Uma servidora compartilhou pelo OneDrive (Microsoft 365) a planilha de escala do setor com alguns colegas. De acordo com o suporte da Microsoft, assinale a alternativa correta.", "alternativas": ["Com a permissão Pode exibir, o colega pode alterar o conteúdo da planilha, desde que não a exclua.", "A permissão Pode editar permite exibir e alterar o arquivo.", "A opção Remover acesso exclui a planilha também do OneDrive da proprietária.", "Se um colega recebeu Pode editar por um link e Pode exibir por convite direto, vale sempre a permissão mais restrita.", "O OneDrive só oferece a opção Pode editar; para impedir alterações, é preciso enviar uma cópia por e-mail."], "correta": 1, "explicacao": "B está certa: Pode editar = ver e alterar. A está errada: Pode exibir deixa só ver, sem fazer alterações. C está errada: Remover acesso tira o acesso dos outros e deixa o arquivo privado para os proprietários; não apaga o arquivo. D está errada: o suporte avisa que a pessoa mantém a permissão MAIS ALTA que recebeu por qualquer caminho. Por isso, para tirar a edição, é preciso mudar todas as fontes. E está errada: além de Pode editar, existe Pode exibir.", "fundamento": "Suporte da Microsoft: Pode editar permite exibir e alterar; Pode exibir permite ver sem fazer alterações; Remover acesso torna o item privado para os proprietários; uma pessoa mantém a permissão mais alta que tem por meio de qualquer fonte.", "fonte": "Microsoft Suporte: Compartilhar arquivos e pastas no Microsoft OneDrive", "url": "https://support.microsoft.com/pt-br/onedrive/share-files-and-folders-in-microsoft-onedrive", "sub": "info-docs-drive"}, {"id": "inf-14", "materia": "Informática", "tema": "Informática", "enunciado": "Associe cada tipo de código malicioso (coluna da esquerda) à sua descrição (coluna da direita), de acordo com a Cartilha de Segurança para Internet (CERT.br).\n(1) Vírus\n(2) Worm\n(3) Cavalo de troia\n(4) Spyware\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Propaga-se automaticamente pelas redes, explorando vulnerabilidades e enviando cópias de si mesmo de computador para computador.", "( ) Insere cópias de si mesmo em outros programas e arquivos e depende da execução do programa ou arquivo hospedeiro para agir.", "( ) Monitora as atividades de um sistema e envia as informações coletadas para terceiros.", "( ) Além de executar as funções para as quais aparentemente foi projetado, executa outras funções, normalmente maliciosas, sem o conhecimento do usuário."], "alternativas": ["1 – 2 – 4 – 3", "2 – 1 – 3 – 4", "3 – 1 – 4 – 2", "1 – 2 – 3 – 4", "2 – 1 – 4 – 3"], "correta": 4, "explicacao": "1º item: espalhar-se sozinho pela rede, explorando falhas, é o worm (2). 2º item: entrar em outros arquivos e depender de o arquivo ser executado é o vírus (1). 3º item: monitorar e mandar dados para terceiros é o spyware (4). 4º item: parecer um programa normal e esconder funções maliciosas é o cavalo de troia (3). Sequência: 2 – 1 – 4 – 3. Dica: a diferença que mais cai é vírus x worm. O vírus precisa de execução; o worm não.", "fundamento": "Cartilha CERT.br: o vírus se propaga inserindo cópias de si mesmo em outros programas e arquivos e depende da execução do hospedeiro; o worm se propaga automaticamente pelas redes; o cavalo de troia executa, além das funções aparentes, funções maliciosas sem o conhecimento do usuário; o spyware monitora as atividades e envia as informações a terceiros.", "fonte": "Cartilha CERT.br, livro, cap. 4 Códigos maliciosos (4.1 Vírus, 4.2 Worm, 4.6 Cavalo de troia); fascículo Códigos Maliciosos (Spyware)", "url": "https://cartilha.cert.br/livro/", "sub": "info-seguranca"}, {"id": "inf-15", "materia": "Informática", "tema": "Informática", "enunciado": "Considere as afirmações abaixo, baseadas na Cartilha de Segurança para Internet (CERT.br).", "itens": ["I – Usar a mesma senha em vários serviços é seguro, desde que ela seja longa e tenha letras, números e símbolos.", "II – Recomenda-se ter pelo menos duas cópias de backup, guardadas em locais diferentes, por exemplo uma na nuvem e outra em pen drive.", "III – A assinatura digital permite comprovar a autenticidade e a integridade de uma informação, isto é, que ela foi gerada por quem diz tê-la gerado e que não foi alterada."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e III.", "Apenas II e III.", "I, II e III."], "correta": 3, "explicacao": "I está errada: a Cartilha manda usar uma senha diferente para cada conta. Se a mesma senha vazar em um lugar, o atacante entra em todos os outros, por mais forte que ela seja. II está certa: a Cartilha recomenda ter pelo menos 2 cópias, em locais diferentes, como nuvem e pen drive. III está certa: é a definição de assinatura digital da Cartilha. Resposta: apenas II e III.", "fundamento": "Cartilha CERT.br: reusar senhas é arriscado, pois basta descobrir a senha de uma conta para acessar as demais; tenha pelo menos 2 cópias dos dados em locais diferentes; a assinatura digital permite comprovar a autenticidade e a integridade de uma informação.", "fonte": "Cartilha CERT.br: fascículos Autenticação e Backup; livro, 9.3 Assinatura digital", "url": "https://cartilha.cert.br/fasciculos/autenticacao/fasciculo-autenticacao.pdf", "sub": "info-seguranca"}, {"id": "rl-01", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação lógica da proposição “Se o paciente chegou atrasado, então a consulta foi remarcada” é", "alternativas": ["O paciente chegou atrasado e a consulta não foi remarcada.", "Se o paciente não chegou atrasado, então a consulta não foi remarcada.", "O paciente não chegou atrasado ou a consulta foi remarcada.", "O paciente não chegou atrasado e a consulta foi remarcada.", "Se a consulta não foi remarcada, então o paciente não chegou atrasado."], "correta": 0, "explicacao": "Sejam p = “o paciente chegou atrasado” e q = “a consulta foi remarcada”. A condicional p → q só é falsa quando p é V e q é F; logo, sua negação é p ∧ ~q: “chegou atrasado e a consulta não foi remarcada”. Conferido por tabela-verdade nas 4 linhas: só A coincide com ~(p → q). Pegadinhas: C (~p ∨ q) e E (~q → ~p) são EQUIVALENTES à frase original, não sua negação; B é a inversa; D nega a parte errada. Erro comum: negar uma condicional com outra condicional.", "fundamento": "~(p → q) ≡ p ∧ ~q: mantém-se o antecedente, troca-se “se... então” por “e” e nega-se o consequente.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-02", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma proposição logicamente equivalente a “Se o setor recebe a documentação, então o cadastro é liberado” é", "alternativas": ["Se o cadastro é liberado, então o setor recebe a documentação.", "Se o setor não recebe a documentação, então o cadastro não é liberado.", "O setor recebe a documentação e o cadastro não é liberado.", "Se o cadastro não é liberado, então o setor não recebe a documentação.", "O setor recebe a documentação ou o cadastro não é liberado."], "correta": 3, "explicacao": "Com p = “o setor recebe a documentação” e q = “o cadastro é liberado”, a frase é p → q. A contrapositiva ~q → ~p (alternativa D) é equivalente: inverte-se a ordem e negam-se as duas partes. Conferido por tabela-verdade: só D coincide com p → q nas 4 linhas. A é a recíproca (q → p); B é a inversa (~p → ~q); C é a negação (p ∧ ~q); E é p ∨ ~q, que equivale a q → p (recíproca), e não a p → q. Atenção: “O setor NÃO recebe a documentação OU o cadastro é liberado” (~p ∨ q) também seria equivalente, mas não está entre as opções; a pegadinha de E é negar o termo errado.", "fundamento": "p → q ≡ ~q → ~p (contrapositiva) ≡ ~p ∨ q. A recíproca (q → p) e a inversa (~p → ~q) não são equivalentes à condicional original.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-03", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A negação da proposição “Todos os pacientes foram atendidos e nenhum paciente reclamou” é", "alternativas": ["Nenhum paciente foi atendido e todos os pacientes reclamaram.", "Algum paciente não foi atendido e algum paciente reclamou.", "Nem todos os pacientes foram atendidos ou nenhum paciente reclamou.", "Todos os pacientes não foram atendidos ou algum paciente reclamou.", "Algum paciente não foi atendido ou algum paciente reclamou."], "correta": 4, "explicacao": "Passo 1 (De Morgan): ~(P ∧ Q) ≡ ~P ∨ ~Q — o “e” vira “ou” e as duas partes são negadas. Passo 2: ~(“Todos foram atendidos”) = “Algum paciente não foi atendido”. Passo 3: ~(“Nenhum reclamou”) = “Algum paciente reclamou”. Resultado: alternativa E. B mantém o “e” (erro de De Morgan); C não nega a segunda parte; A e D trocam “todos” por “nenhum”/“todos... não”, que é o contrário, não a negação (“todos não foram atendidos” equivale a “nenhum foi atendido”).", "fundamento": "De Morgan: ~(P ∧ Q) ≡ ~P ∨ ~Q. Quantificadores: a negação de “Todo A é B” é “Algum A não é B”; a negação de “Nenhum A é B” é “Algum A é B”.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-04", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um setor com 120 funcionários, 68 fizeram o curso de Comunicação Não-Violenta (CNV), 50 fizeram o curso de LGPD e 22 fizeram os dois cursos. O número de funcionários que fizeram apenas um dos dois cursos é", "alternativas": ["96", "74", "24", "118", "46"], "correta": 1, "explicacao": "Apenas CNV = 68 − 22 = 46. Apenas LGPD = 50 − 22 = 28. Apenas um dos cursos = 46 + 28 = 74. Conferência: 46 + 28 + 22 = 96 fizeram ao menos um curso (união = 68 + 50 − 22 = 96) e 120 − 96 = 24 não fizeram nenhum. As distratoras são valores intermediários do próprio cálculo: 96 (pelo menos um curso), 24 (nenhum), 46 (apenas CNV) e 118 (soma direta 68 + 50, contando a interseção duas vezes). Contas rodadas em Python.", "fundamento": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B). “Apenas A” = n(A) − n(A ∩ B). “Apenas um” = n(A ∪ B) − n(A ∩ B).", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-05", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um prontuário foi esquecido na sala de espera, e sabe-se que foi exatamente uma de quatro pessoas: Ana, Bruno, Carla ou Davi. Questionadas, disseram:\nAna: “Foi o Bruno.”\nBruno: “Foi o Davi.”\nCarla: “Não fui eu.”\nDavi: “O Bruno está mentindo.”\nSabendo que apenas uma das quatro pessoas mentiu, quem esqueceu o prontuário?", "alternativas": ["Ana", "Carla", "Bruno", "Davi", "Não é possível determinar."], "correta": 2, "explicacao": "As falas de Bruno e Davi são contraditórias (Davi diz que Bruno mente): exatamente uma delas é falsa. Como só há uma mentira, ela está entre Bruno e Davi, e Ana e Carla dizem a verdade. Se Ana diz a verdade, foi o Bruno. Conferência: Bruno (“Foi o Davi”) mente; Davi (“Bruno está mentindo”) diz a verdade; Carla (“Não fui eu”) diz a verdade — exatamente 1 mentira. Testando os 4 culpados possíveis em Python: Ana → 2 mentiras; Bruno → 1; Carla → 3; Davi → 2. Só Bruno satisfaz a condição, então E também está descartada.", "fundamento": "Em problemas de verdades e mentiras, procure duas afirmações contraditórias: uma delas é necessariamente falsa, o que localiza a(s) mentira(s) e torna verdadeiras as demais.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-06", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Um ambulatório realizava 800 consultas por mês. No mês seguinte, o número de consultas aumentou 15% e, no mês subsequente, diminuiu 10% em relação ao mês anterior. O número de consultas no último mês foi", "alternativas": ["828", "840", "820", "832", "860"], "correta": 0, "explicacao": "Aumento de 15%: 800 × 1,15 = 920. Redução de 10% sobre 920: 920 × 0,90 = 828. Equivalente: 800 × 1,15 × 0,90 = 800 × 1,035 = 828 (conta rodada em Python). A pegadinha é a alternativa 840: somar as porcentagens (+15% − 10% = +5%) ignora que a redução incide sobre a base nova (920), e não sobre 800. As demais (820, 832, 860) não correspondem a nenhuma aplicação correta das duas porcentagens.", "fundamento": "Porcentagens sucessivas se multiplicam: aumento de i% → fator (1 + i/100); redução de j% → fator (1 − j/100). O fator total é o produto dos fatores, não a soma das porcentagens.", "fonte": "Resolução", "url": "", "sub": "rl-contas"}, {"id": "rl-07", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma paciente iniciou sessões de fisioterapia na segunda-feira, 2 de novembro de 2026, com uma sessão a cada 4 dias (2/11, 6/11, 10/11, e assim por diante). A 10ª sessão ocorrerá em", "alternativas": ["4 de dezembro, sexta-feira.", "6 de dezembro, domingo.", "8 de dezembro, segunda-feira.", "12 de dezembro, sábado.", "8 de dezembro, terça-feira."], "correta": 4, "explicacao": "As datas formam uma progressão aritmética de razão 4. Da 1ª à 10ª sessão há 9 intervalos: 9 × 4 = 36 dias. 2/11 + 36 dias: novembro tem 30 dias, então 2/11 + 28 = 30/11 e mais 8 dias = 8/12. Dia da semana: 36 = 5 × 7 + 1, logo a data cai 1 dia da semana após segunda-feira: terça-feira. Conferido em Python (datetime): 2/11/2026 é segunda e 8/12/2026 é terça. Pegadinhas: 12/12 conta 10 intervalos (40 dias); 4/12 é a 9ª sessão; a opção C tem a data certa e o dia errado.", "fundamento": "n-ésimo termo de uma PA: aₙ = a₁ + (n − 1)·r. Para o dia da semana, só importa o resto da divisão do número de dias por 7.", "fonte": "Resolução", "url": "", "sub": "rl-sequencias"}, {"id": "rl-08", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um plantão, uma atendente fez 3 atendimentos de 0,4 hora cada e mais um atendimento de 1,25 hora. O tempo total desses atendimentos foi de", "alternativas": ["2 h 45 min", "3 h 25 min", "2 h 27 min", "2 h 37 min", "1 h 27 min"], "correta": 2, "explicacao": "Passo 1: some em horas: 3 × 0,4 = 1,2 h; 1,2 + 1,25 = 2,45 h. Passo 2: separe a parte inteira: 2 horas. Passo 3: transforme a parte depois da vírgula em minutos: 0,45 × 60 = 27 min. Total: 2 h 27 min. Pegadinhas: 2 h 45 min lê 0,45 como se fosse 45 minutos. 3 h 25 min lê 0,4 h como 40 min e 1,25 h como 1 h 25 min. 2 h 37 min erra só o 1,25 (o certo é 1 h 15 min). 1 h 27 min lê 0,4 h como 4 min. Contas conferidas em Python.", "fundamento": "Uma hora tem 60 minutos. Para converter a parte decimal da hora em minutos, multiplica-se por 60 (0,8 h = 48 min, como na prova de 2023).", "fonte": "Resolução", "url": "", "sub": "rl-contas"}, {"id": "rl-09", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Seis servidores, trabalhando no mesmo ritmo, digitalizam todos os prontuários de um arquivo em 10 dias. Se apenas 4 desses servidores fizerem o mesmo trabalho, no mesmo ritmo, o número de dias necessários será", "alternativas": ["6", "8", "12", "15", "20"], "correta": 3, "explicacao": "Passo 1: pense no sentido. Com menos gente, o trabalho demora MAIS. É regra de três inversa. Passo 2: o total de trabalho é o mesmo: 6 servidores × 10 dias = 60 servidor-dias. Passo 3: divida pelos 4 servidores: 60 ÷ 4 = 15 dias. Pegadinha: se fizer regra de três direta (10 × 4 ÷ 6), dá cerca de 6,7 dias, menos tempo com menos gente, o que não faz sentido. Conta conferida em Python.", "fundamento": "Grandezas inversamente proporcionais: quando uma aumenta, a outra diminui na mesma proporção, e o produto fica constante (6 × 10 = 4 × d).", "fonte": "Resolução", "url": "", "sub": "rl-contas"}, {"id": "rl-10", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma cadeira de rodas custava R$ 250,00. O fornecedor deu um desconto de 20% e, depois, mais 10% de desconto sobre o novo preço. O preço final e o desconto total equivalente são, respectivamente,", "alternativas": ["R$ 180,00 e 28%", "R$ 175,00 e 30%", "R$ 180,00 e 30%", "R$ 175,00 e 28%", "R$ 185,00 e 26%"], "correta": 0, "explicacao": "Passo 1: desconto de 20% = multiplicar por 0,80: 250 × 0,80 = 200. Passo 2: mais 10% sobre o novo preço = multiplicar por 0,90: 200 × 0,90 = 180. Passo 3: desconto total: 250 - 180 = 70; 70 ÷ 250 = 0,28 = 28%. Atalho: 0,80 × 0,90 = 0,72; pagou 72%, então o desconto foi 28%. Pegadinha: somar 20% + 10% = 30% (daria R$ 175,00). Contas conferidas em Python.", "fundamento": "Descontos sucessivos se multiplicam: desconto de i% equivale ao fator (1 - i/100). O fator total é o produto dos fatores, não a soma das porcentagens.", "fonte": "Resolução", "url": "", "sub": "rl-contas"}, {"id": "rl-11", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere as proposições p: “O sistema está fora do ar” e q: “A recepção usa fichas de papel”. Sabe-se que p é falsa e q é verdadeira. Avalie as afirmações.", "itens": ["I – A proposição “Se o sistema está fora do ar, então a recepção usa fichas de papel” é verdadeira.", "II – A proposição “Se a recepção usa fichas de papel, então o sistema está fora do ar” é verdadeira.", "III – A proposição “O sistema está fora do ar ou a recepção usa fichas de papel” é verdadeira."], "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 1, "explicacao": "I (p → q): o se... então só é falso quando a 1ª parte é V e a 2ª é F. Aqui a 1ª é F, então I é verdadeira. II (q → p): a 1ª parte (q) é V e a 2ª (p) é F. Esse é justamente o caso falso. II é falsa. III (p ∨ q): o ou só é falso se as duas forem falsas. Como q é V, III é verdadeira. Resposta: apenas I e III. Tabela-verdade conferida em Python.", "fundamento": "p → q é falsa somente quando p é V e q é F. p ∨ q é falsa somente quando p e q são F. A recíproca (q → p) não é equivalente a p → q e pode ter valor diferente.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-12", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Considere verdadeiras as afirmações: “Todo enfermeiro do hospital é servidor concursado” e “Nenhum servidor concursado é estagiário”. A partir delas, conclui-se necessariamente que", "alternativas": ["algum estagiário é enfermeiro.", "todo servidor concursado é enfermeiro.", "algum servidor concursado é estagiário.", "todo estagiário é servidor concursado.", "nenhum enfermeiro é estagiário."], "correta": 4, "explicacao": "Desenhe os conjuntos. Passo 1: “todo enfermeiro é concursado” = o círculo dos enfermeiros fica DENTRO do círculo dos concursados. Passo 2: “nenhum concursado é estagiário” = o círculo dos estagiários fica totalmente FORA do círculo dos concursados. Passo 3: se os enfermeiros estão dentro dos concursados, e os estagiários estão fora, enfermeiros e estagiários não se encontram. Logo, nenhum enfermeiro é estagiário. As outras não decorrem: A e C contrariam as premissas; B inverte a primeira frase (pode haver concursado que não é enfermeiro); D vai contra a segunda frase, pois os estagiários ficam fora dos concursados. Conferido em Python testando todos os diagramas possíveis.", "fundamento": "Um argumento é válido quando a conclusão é verdadeira em todos os casos em que as premissas são verdadeiras. Se A está contido em B e B não tem nada em comum com C, então A não tem nada em comum com C.", "fonte": "Resolução", "url": "", "sub": "rl-logica"}, {"id": "rl-13", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Uma sequência de figuras é feita com palitos. A figura 1 é um quadrado (4 palitos). A figura 2 tem dois quadrados lado a lado, que dividem um palito (7 palitos). A figura 3 tem três quadrados em fila (10 palitos), e assim por diante. O número de palitos da figura 12 é", "alternativas": ["36", "48", "37", "40", "34"], "correta": 2, "explicacao": "Passo 1: veja quanto aumenta de uma figura para a outra: 4, 7, 10. Sempre +3, porque cada quadrado novo aproveita um palito do anterior. Passo 2: regra: começa com 4 e soma 3 para cada figura a mais. Figura n = 4 + 3 × (n - 1) = 3n + 1. Passo 3: figura 12 = 3 × 12 + 1 = 37. Pegadinhas: 48 conta 4 palitos por quadrado, sem aproveitar os palitos comuns; 36 esquece o palito inicial; 40 é a figura 13; 34 é a figura 11. Conferido em Python.", "fundamento": "Em uma sequência em que a diferença entre termos vizinhos é constante (progressão aritmética), o termo n é a₁ + (n - 1) × r.", "fonte": "Resolução", "url": "", "sub": "rl-sequencias"}, {"id": "rl-14", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "A tabela mostra o número de atendimentos de um ambulatório em quatro meses.\nJaneiro: 120\nFevereiro: 150\nMarço: 135\nAbril: 180\nConsidere as afirmações.", "itens": ["I – A média mensal de atendimentos no período foi de 146,25.", "II – De janeiro para fevereiro, o número de atendimentos aumentou 25%.", "III – De março para abril, o número de atendimentos aumentou 45%."], "alternativas": ["Apenas I e II.", "Apenas I.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 0, "explicacao": "I: média = soma ÷ quantidade = (120 + 150 + 135 + 180) ÷ 4 = 585 ÷ 4 = 146,25. Verdadeira. II: de janeiro para fevereiro aumentou 30 atendimentos; 30 ÷ 120 = 0,25 = 25%. Verdadeira. III: de março para abril aumentou 45 atendimentos, mas o percentual é 45 ÷ 135 ≈ 0,333, cerca de 33,3%. Falsa: a pegadinha é confundir a diferença absoluta (45) com a porcentagem. Resposta: apenas I e II. Contas conferidas em Python.", "fundamento": "Média aritmética = soma dos valores ÷ número de valores. Variação percentual = (valor novo - valor antigo) ÷ valor antigo × 100.", "fonte": "Resolução", "url": "", "sub": "rl-sequencias"}, {"id": "rl-15", "materia": "Raciocínio Lógico", "tema": "Raciocínio Lógico", "enunciado": "Em um ambulatório, a razão entre o número de consultas presenciais e o de consultas por telemedicina é de 5 para 3. Em um mês, foram feitas 480 consultas no total. O número de consultas por telemedicina foi", "alternativas": ["288", "300", "160", "180", "96"], "correta": 3, "explicacao": "Passo 1: 5 para 3 quer dizer que, a cada 8 consultas, 5 são presenciais e 3 por telemedicina. Passo 2: divida o total em 8 partes: 480 ÷ 8 = 60 por parte. Passo 3: telemedicina = 3 partes = 3 × 60 = 180. Conferência: presenciais = 5 × 60 = 300; 300 + 180 = 480. Pegadinhas: 288 usa 3/5 de 480 (esquece de somar as partes); 300 é o número de presenciais; 160 e 96 são 480 ÷ 3 e 480 ÷ 5. Contas conferidas em Python.", "fundamento": "Na divisão em partes proporcionais a 5 e 3, o total corresponde a 5 + 3 = 8 partes; cada parte vale total ÷ 8.", "fonte": "Resolução", "url": "", "sub": "rl-contas"}, {"id": "sus-01", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas dos incisos abaixo, transcritos do art. 7º da Lei nº 8.080/1990.\n\nI – ________ de acesso aos serviços de saúde em todos os níveis de assistência;\nII – ________ de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema;\nIV – ________ da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "alternativas": ["integralidade – universalidade – equidade", "universalidade – integralidade – equidade", "universalidade – integralidade – igualdade", "equidade – integralidade – universalidade", "universalidade – equidade – igualdade"], "correta": 2, "explicacao": "O texto da Lei 8.080 usa “universalidade” (I), “integralidade” (II) e “igualdade” (IV). A pegadinha é “equidade”: o termo é muito usado na doutrina do SUS, mas não é a palavra que aparece no inciso IV do art. 7º.", "fundamento": "Art. 7º, I – universalidade de acesso aos serviços de saúde em todos os níveis de assistência; II – integralidade de assistência [...]; IV – igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.", "fonte": "Lei 8.080/1990, art. 7º, I, II e IV", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-02", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Considere as afirmações abaixo sobre os objetivos do
