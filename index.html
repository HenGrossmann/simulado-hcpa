Sistema Único de Saúde (SUS), conforme o art. 5º da Lei nº 8.080/1990.\n\nQuais estão corretas?", "itens": ["I – É objetivo do SUS a identificação e divulgação dos fatores condicionantes e determinantes da saúde.", "II – É objetivo do SUS a formulação de política de saúde destinada a promover, nos campos econômico e social, a observância do dever do Estado de garantir a saúde.", "III – É objetivo do SUS a assistência às pessoas exclusivamente por meio de ações de recuperação da saúde, ficando as atividades preventivas a cargo de outros setores do governo."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II reproduzem os incisos I e II do art. 5º (o inciso II remete ao § 1º do art. 2º, que trata do dever do Estado). III está errada: a lei prevê ações de promoção, proteção e recuperação, com realização integrada das ações assistenciais e das atividades preventivas.", "fundamento": "Art. 5º São objetivos do Sistema Único de Saúde SUS: [...] III - a assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas.", "fonte": "Lei 8.080/1990, art. 5º, I a III (e art. 2º, § 1º)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-03", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com o art. 6º da Lei nº 8.080/1990, estão incluídas no campo de atuação do Sistema Único de Saúde (SUS) as ações abaixo, EXCETO:", "alternativas": ["a vigilância nutricional e a orientação alimentar.", "a fiscalização e a inspeção de alimentos, água e bebidas para consumo humano.", "a ordenação da formação de recursos humanos na área de saúde.", "a colaboração na proteção do meio ambiente, nele compreendido o do trabalho.", "a formulação e a execução, de forma exclusiva, da política de saneamento básico."], "correta": 4, "explicacao": "Quanto ao saneamento básico, a lei atribui ao SUS apenas a participação na formulação da política e na execução de ações, e não a condução exclusiva da política. As demais alternativas reproduzem os incisos IV, VIII, III e V do art. 6º.", "fundamento": "Art. 6º Estão incluídas ainda no campo de atuação do Sistema Único de Saúde (SUS): [...] II - a participação na formulação da política e na execução de ações de saneamento básico;", "fonte": "Lei 8.080/1990, art. 6º, II, III, IV, V e VIII", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-04", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com as definições do art. 6º da Lei nº 8.080/1990.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Entende-se por vigilância sanitária um conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde.", "( ) A vigilância epidemiológica abrange o controle de bens de consumo que, direta ou indiretamente, se relacionem com a saúde, compreendidas todas as etapas e processos, da produção ao consumo.", "( ) Entende-se por vigilância epidemiológica um conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.", "( ) Para fins da lei, a saúde do trabalhador destina-se apenas à recuperação e reabilitação dos trabalhadores já acidentados, não abrangendo ações de promoção e proteção da saúde."], "alternativas": ["F – V – V – F", "V – F – V – F", "V – V – F – F", "V – F – F – V", "F – F – V – V"], "correta": 1, "explicacao": "O controle de bens de consumo “da produção ao consumo” integra a vigilância sanitária (§ 1º, I), não a epidemiológica: é a troca entre as duas vigilâncias. A saúde do trabalhador (§ 3º) abrange promoção e proteção, além de recuperação e reabilitação.", "fundamento": "§ 3º Entende-se por saúde do trabalhador [...] um conjunto de atividades que se destina, através das ações de vigilância epidemiológica e vigilância sanitária, à promoção e proteção da saúde dos trabalhadores, assim como visa à recuperação e reabilitação da saúde dos trabalhadores [...]", "fonte": "Lei 8.080/1990, art. 6º, §§ 1º, 2º e 3º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-05", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "Segundo o art. 7º, IX, da Lei nº 8.080/1990, a descentralização político-administrativa no Sistema Único de Saúde (SUS) ocorre", "alternativas": ["com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os municípios e com regionalização e hierarquização da rede de serviços de saúde.", "com direção compartilhada entre União, Estados e Municípios em cada serviço, com ênfase na descentralização dos serviços para os Estados.", "com direção única exercida pela União, com ênfase na centralização dos serviços de maior complexidade e com regionalização da rede.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os Estados e com hierarquização dos profissionais de saúde.", "com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os consórcios intermunicipais, dispensada a regionalização."], "correta": 0, "explicacao": "A lei fala em direção única em cada esfera de governo, com ênfase na descentralização para os municípios, e não para os Estados. Regionalização e hierarquização referem-se à rede de serviços de saúde, não aos profissionais.", "fundamento": "IX - descentralização político-administrativa, com direção única em cada esfera de governo: a) ênfase na descentralização dos serviços para os municípios; b) regionalização e hierarquização da rede de serviços de saúde;", "fonte": "Lei 8.080/1990, art. 7º, IX, alíneas a e b", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-06", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "De acordo com os arts. 2º a 4º da Lei nº 8.080/1990, assinale a alternativa correta.", "alternativas": ["O dever do Estado de garantir a saúde exclui o das pessoas, da família, das empresas e da sociedade.", "A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "Integram o SUS somente os órgãos da Administração direta federal, estadual e municipal, excluídas as fundações mantidas pelo Poder Público.", "As instituições públicas de produção de medicamentos, sangue e hemoderivados não estão incluídas no SUS, por se tratarem de atividade industrial.", "Para a lei, os níveis de saúde dependem apenas da oferta de serviços médicos, não sendo considerados fatores como moradia, renda e educação."], "correta": 1, "explicacao": "O art. 4º, § 2º, prevê a participação da iniciativa privada em caráter complementar. O dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade (art. 2º, § 2º). O SUS inclui a Administração indireta, as fundações e as instituições públicas de produção de insumos (art. 4º). O art. 3º lista moradia, renda, educação e outros determinantes.", "fundamento": "Art. 4º, § 2º A iniciativa privada poderá participar do Sistema Único de Saúde (SUS), em caráter complementar.", "fonte": "Lei 8.080/1990, art. 2º, § 2º; art. 3º; art. 4º, caput e §§ 1º e 2º", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "sus-07", "materia": "Conhecimentos Específicos", "tema": "SUS: objetivos, princípios e diretrizes", "enunciado": "O art. 7º da Lei nº 8.080/1990 estabelece os princípios que as ações e serviços públicos de saúde, e os serviços privados contratados ou conveniados que integram o SUS, devem obedecer. Assinale a alternativa INCORRETA em relação a esses princípios.", "alternativas": ["Conjugação dos recursos financeiros, tecnológicos, materiais e humanos exclusivamente da União na prestação de serviços de assistência à saúde da população.", "Utilização da epidemiologia para o estabelecimento de prioridades, a alocação de recursos e a orientação programática.", "Organização dos serviços públicos de modo a evitar duplicidade de meios para fins idênticos.", "Preservação da autonomia das pessoas na defesa de sua integridade física e moral.", "Atenção humanizada."], "correta": 0, "explicacao": "O inciso XI fala em conjugação dos recursos da União, dos Estados, do Distrito Federal e dos Municípios, não apenas da União. As demais alternativas reproduzem os incisos VII, XIII, III e XVI (este incluído pela Lei nº 15.126/2025).", "fundamento": "XI - conjugação dos recursos financeiros, tecnológicos, materiais e humanos da União, dos Estados, do Distrito Federal e dos Municípios na prestação de serviços de assistência à saúde da população;", "fonte": "Lei 8.080/1990, art. 7º, III, VII, XI, XIII e XVI", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm"}, {"id": "hum-01", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Segundo o documento HumanizaSUS: documento base para gestores e trabalhadores do SUS (Ministério da Saúde, 2008), a Política Nacional de Humanização (PNH) possui três princípios, a partir dos quais se desdobra como política pública de saúde. Esses princípios são:", "alternativas": ["acolhimento; clínica ampliada; co-gestão.", "universalidade; integralidade; equidade.", "transversalidade; indissociabilidade entre atenção e gestão; protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "visita aberta; direito à acompanhante; acolhimento com classificação de risco.", "descentralização; regionalização; hierarquização."], "correta": 2, "explicacao": "Os três princípios da PNH são transversalidade, indissociabilidade entre atenção e gestão e protagonismo/co-responsabilidade/autonomia. Acolhimento, clínica ampliada e co-gestão são diretrizes; visita aberta e classificação de risco são dispositivos. As alternativas B e E trazem princípios e diretrizes do SUS, não da PNH.", "fundamento": "O documento afirma que a PNH, como movimento de mudança dos modelos de atenção e gestão, tem três princípios: transversalidade; indissociabilidade entre atenção e gestão; e protagonismo, co-responsabilidade e autonomia dos sujeitos e dos coletivos.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios da PNH”, p. 23-24", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-02", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "A PNH se estrutura a partir de princípios, método, diretrizes e dispositivos. Considere as afirmações abaixo, de acordo com o HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nQuais estão corretas?", "itens": ["I – Acolhimento e clínica ampliada estão entre as diretrizes da PNH.", "II – O Grupo de Trabalho de Humanização (GTH) e a Visita Aberta e Direito à Acompanhante estão entre os dispositivos da PNH.", "III – A transversalidade é uma das diretrizes da PNH, ao lado da co-gestão e da defesa dos direitos do usuário."], "alternativas": ["Apenas I e II.", "Apenas I.", "Apenas III.", "Apenas II e III.", "I, II e III."], "correta": 0, "explicacao": "I e II estão de acordo com as listas de diretrizes e de dispositivos do documento. III está errada porque a transversalidade é princípio da PNH, e não diretriz. A pegadinha é misturar os níveis princípio, diretriz e dispositivo.", "fundamento": "O documento lista como diretrizes a clínica ampliada, a co-gestão, o acolhimento, a valorização do trabalho e do trabalhador e a defesa dos direitos do usuário, entre outras. Entre os dispositivos estão o GTH, o colegiado gestor e a visita aberta e direito à acompanhante. A transversalidade aparece como princípio.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “Princípios”, “Diretrizes” e “Dispositivos da PNH”, p. 23-27", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-03", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "O HumanizaSUS: documento base para gestores e trabalhadores do SUS afirma que a PNH caminha no sentido da inclusão, nos processos de produção de saúde, dos diferentes agentes implicados, e fala em um “método de tríplice inclusão”. Essa tríplice inclusão compreende a inclusão", "alternativas": ["dos usuários, dos familiares e dos acompanhantes nas decisões clínicas.", "da União, dos Estados e dos Municípios no financiamento das ações de humanização.", "da atenção básica, da média complexidade e da alta complexidade em uma rede única.", "dos diferentes sujeitos (gestores, trabalhadores e usuários), dos analisadores sociais e do coletivo.", "dos trabalhadores, dos conselhos de saúde e das ouvidorias no planejamento hospitalar."], "correta": 3, "explicacao": "O método da PNH inclui os diferentes sujeitos (gestores, trabalhadores e usuários), os analisadores sociais (fenômenos que desestabilizam os modelos tradicionais de atenção e gestão) e o coletivo. As outras alternativas trocam essa tríade por divisões que soam plausíveis, mas não estão no documento.", "fundamento": "O método de tríplice inclusão compreende: incluir os diferentes sujeitos (gestores, trabalhadores e usuários), com rodas; incluir os analisadores sociais, com análise coletiva dos conflitos; e incluir o coletivo, como movimento social organizado ou experiência grupal, com fomento das redes.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, “O método da PNH”, p. 24-25", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "hum-04", "materia": "Conhecimentos Específicos", "tema": "HumanizaSUS", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o glossário do HumanizaSUS: documento base para gestores e trabalhadores do SUS.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Na classificação de risco, o critério de priorização da atenção passa a ser o agravo à saúde e/ou o grau de sofrimento, e não mais a ordem de chegada.", "( ) O acolhimento restringe-se à recepção do usuário na porta de entrada, encerrando-se a responsabilização da equipe no momento em que ele é encaminhado ao setor de atendimento.", "( ) A ambiência refere-se exclusivamente à estrutura física do serviço, como luminosidade, ruídos e temperatura, sem relação com a forma de acolher e de interagir.", "( ) Entre as propostas da clínica ampliada está o compromisso com o sujeito, e não só com a doença."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – F – V", "V – F – F – V"], "correta": 4, "explicacao": "O acolhimento implica responsabilização do trabalhador/equipe pelo usuário desde a chegada até a saída. Na ambiência, o documento destaca como muito importante o componente afetivo, expresso no acolhimento e nas interações. A primeira e a quarta afirmações correspondem ao glossário.", "fundamento": "Glossário: a classificação de risco prioriza pelo agravo e/ou grau de sofrimento, não pela ordem de chegada. O acolhimento responsabiliza a equipe pelo usuário da chegada à saída. A ambiência inclui o componente afetivo. A clínica ampliada propõe compromisso com o sujeito e não só com a doença.", "fonte": "HumanizaSUS: documento base para gestores e trabalhadores do SUS, 4ª ed., 2008, Glossário (“Acolhimento”, “Ambiência”, “Classificação de Risco”, “Clínica ampliada”), p. 51-56", "url": "https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/"}, {"id": "dir-01", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Portaria de Consolidação GM/MS nº 1/2017, que garante à pessoa atendimento humanizado e acolhedor.\n\nÉ garantida a identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o ________, independente do registro civil. É garantido também o direito a visita diária não inferior a ________ horas, preferencialmente ________ em todas as unidades de internação, ressalvadas as situações técnicas não indicadas.", "alternativas": ["nome de preferência – uma – restrita", "nome social – duas – aberta", "nome social – quatro – restrita", "apelido – duas – restrita", "número do prontuário – uma – aberta"], "correta": 1, "explicacao": "A norma prevê campo para o nome social em todo documento e visita diária não inferior a duas horas, preferencialmente aberta. A mesma norma proíbe identificar o usuário por número, nome ou código da doença.", "fundamento": "I - identificação pelo nome e sobrenome civil, devendo existir em todo documento do usuário e usuária um campo para se registrar o nome social [...]; VII - o direito a visita diária não inferior a duas horas, preferencialmente aberta em todas as unidades de internação, ressalvadas as situações técnicas não indicadas;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 5º, parágrafo único, I e VII (origem: Portaria MS/GM nº 1.820/2009, art. 4º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-02", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "A Portaria de Consolidação GM/MS nº 1/2017 estabelece que toda pessoa tem responsabilidade para que seu tratamento e recuperação sejam adequados e sem interrupção, e lista o que as pessoas deverão fazer para isso. Assinale a alternativa que NÃO corresponde a um desses deveres.", "alternativas": ["Prestar informações apropriadas nos atendimentos, nas consultas e nas internações sobre queixas, enfermidades e hospitalizações anteriores, história de uso de medicamentos, drogas e reações alérgicas.", "Expressar se compreendeu as informações e orientações recebidas e, caso ainda tenha dúvidas, solicitar esclarecimento sobre elas.", "Ter em mão seus documentos e, quando solicitados, os resultados de exames que estejam em seu poder.", "Submeter-se a todos os procedimentos, exames e tratamentos recomendados, uma vez que a norma não admite a recusa do usuário.", "Comunicar à autoridade sanitária local a ocorrência de caso de doença transmissível, quando a situação requerer o isolamento ou quarentena da pessoa ou quando a doença constar da relação do Ministério da Saúde."], "correta": 3, "explicacao": "A norma não proíbe a recusa. O dever é assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados, e a mesma portaria garante o consentimento livre e revogável. As demais alternativas reproduzem os incisos I, II, VIII e XIII.", "fundamento": "V - assumir a responsabilidade pela recusa a procedimentos, exames ou tratamentos recomendados e pelo descumprimento das orientações do profissional ou da equipe de saúde;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 7º, parágrafo único, I, II, V, VIII e XIII (origem: Portaria MS/GM nº 1.820/2009, art. 6º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-03", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta dos Direitos dos Usuários da Saúde (Ministério da Saúde, 3ª edição, 2011).\n\nQuais estão corretas?", "itens": ["I – “Todo cidadão tem direito ao acesso ordenado e organizado aos sistemas de saúde” é um dos seis princípios basilares da Carta.", "II – A Carta foi aprovada pela Agência Nacional de Saúde Suplementar (ANS), em 2009, e por isso vale apenas para os planos de saúde.", "III – A Carta é apresentada como ferramenta para que o cidadão conheça seus direitos e deveres no momento de procurar atendimento de saúde, tanto público como privado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "Apenas I e III."], "correta": 4, "explicacao": "I e III estão na apresentação da Carta. II está errada: a Carta foi aprovada pelo Conselho Nacional de Saúde (CNS), na 198ª Reunião Ordinária, em 17 de junho de 2009, e vale tanto para o atendimento público quanto para o privado.", "fundamento": "A apresentação informa que a Carta foi aprovada pelo Conselho Nacional de Saúde em 17/06/2009. Ela se apoia em seis princípios basilares, o primeiro deles o acesso ordenado e organizado. Ela serve ao cidadão no atendimento público e no privado.", "fonte": "Carta dos Direitos dos Usuários da Saúde, MS/CNS, 3ª ed., 2011, Apresentação, p. 3-4", "url": "https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf"}, {"id": "dir-04", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Segundo a Portaria de Consolidação GM/MS nº 1/2017, toda pessoa deve ter seus valores, cultura e direitos respeitados na relação com os serviços de saúde. Assinale a alternativa correta a respeito das garantias previstas.", "alternativas": ["O sigilo e a confidencialidade das informações pessoais cessam com a morte do paciente.", "A segunda opinião sobre o estado de saúde só pode ser buscada antes do início do tratamento.", "O acesso ao conteúdo do prontuário é exclusivo da equipe assistencial, sendo vedado o fornecimento de cópia ao usuário.", "O consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais.", "O exame de saúde pré-admissional pode ser realizado sem conhecimento do trabalhador sempre que exigido pelo empregador."], "correta": 3, "explicacao": "A alternativa D reproduz o inciso V do art. 6º. O sigilo vale mesmo após a morte, salvo risco à saúde pública. A segunda opinião pode ser buscada em qualquer fase do tratamento. O usuário tem acesso ao prontuário e direito a cópia em caso de encaminhamento ou mudança de domicílio. Exame sem conhecimento e consentimento só é admitido em caso de risco coletivo.", "fundamento": "V - o consentimento livre, voluntário e esclarecido, a quaisquer procedimentos diagnósticos, preventivos ou terapêuticos, salvo nos casos que acarretem risco à saúde pública, considerando que o consentimento anteriormente dado poderá ser revogado a qualquer instante, por decisão livre e esclarecida, sem que sejam imputadas à pessoa sanções morais, financeiras ou legais;", "fonte": "Portaria de Consolidação GM/MS nº 1/2017, art. 6º, II, III, V, VI e IX (origem: Portaria MS/GM nº 1.820/2009, art. 5º)", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2017/prc0001_03_10_2017.html"}, {"id": "dir-05", "materia": "Conhecimentos Específicos", "tema": "Direitos e deveres dos usuários", "enunciado": "Considere as afirmações abaixo sobre a Carta de direitos e deveres do paciente do Hospital de Clínicas de Porto Alegre (HCPA).\n\nQuais estão corretas?", "itens": ["I – É dever do paciente ter em mãos um documento oficial com foto sempre que vier ao hospital.", "II – É direito do paciente definir se seus familiares e acompanhantes devem ser informados sobre seu estado de saúde, podendo autorizar um representante de sua livre escolha para ter acesso a essas informações ou decidir em seu nome, caso necessite.", "III – O adolescente deve ser atendido sempre na presença dos pais ou responsável, ainda que deseje ser atendido sem acompanhante.", "IV – É dever do paciente respeitar a proibição do fumo e do consumo de bebidas alcoólicas e/ou do uso de drogas ilícitas nas dependências do hospital e exigir que seus acompanhantes também a respeitem."], "alternativas": ["Apenas I e II.", "Apenas III e IV.", "Apenas I, II e IV.", "Apenas II, III e IV.", "I, II, III e IV."], "correta": 2, "explicacao": "I, II e IV estão na Carta do HCPA. III está errada: o adolescente, se desejar, pode ser atendido sem acompanhante, com garantia de individualidade e confidencialidade. A participação e o consentimento dos pais ou responsável só são exigidos em situações de risco ou em procedimentos de alguma complexidade.", "fundamento": "A Carta do HCPA garante ao adolescente, se desejar, atendimento sem acompanhante, com individualidade e confidencialidade, salvo quando o sigilo possa acarretar dano. Em situações de risco ou procedimentos de alguma complexidade, exige participação e consentimento dos pais ou responsável.", "fonte": "Carta de direitos e deveres do paciente do HCPA, seções “São direitos do paciente” e “São deveres do paciente/família”", "url": "https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf"}, {"id": "eca-01", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "De acordo com o Estatuto da Criança e do Adolescente (Lei nº 8.069/1990), assinale a alternativa correta quanto à definição de criança e de adolescente.", "alternativas": ["Considera-se criança a pessoa até doze anos de idade completos, e adolescente aquela entre doze e dezoito anos de idade.", "Considera-se criança a pessoa até quatorze anos de idade incompletos, e adolescente aquela entre quatorze e dezoito anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "Considera-se criança a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade; nos casos expressos em lei, aplica-se excepcionalmente o Estatuto às pessoas entre dezoito e vinte e quatro anos de idade.", "Considera-se adolescente a pessoa entre doze e vinte e um anos de idade, aplicando-se o Estatuto integralmente a toda essa faixa etária."], "correta": 2, "explicacao": "Criança é a pessoa até doze anos incompletos; adolescente, entre doze e dezoito; e, excepcionalmente, o ECA se aplica dos dezoito aos vinte e um anos. As pegadinhas trocam “incompletos” por “completos”, 12 por 14 e 21 por 24.", "fundamento": "Art. 2º Considera-se criança, para os efeitos desta Lei, a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade. Parágrafo único. Nos casos expressos em lei, aplica-se excepcionalmente este Estatuto às pessoas entre dezoito e vinte e um anos de idade.", "fonte": "Lei 8.069/1990, art. 2º, caput e parágrafo único", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-02", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Considere o art. 12 do ECA, na redação atual, que inclui o parágrafo único acrescentado pela Lei nº 14.950/2024: “Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo ______ de ______, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de ______ à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["integral – um dos pais ou responsável – visitação", "parcial – ambos os pais – visitação", "integral – ambos os pais ou responsáveis – acompanhamento", "integral – um dos pais ou responsável – acompanhamento", "diurno – um dos pais ou responsável – visitação"], "correta": 0, "explicacao": "O caput garante a permanência em tempo integral de um dos pais ou responsável na internação de criança ou adolescente; o parágrafo único, incluído pela Lei 14.950/2024, garante à criança e ao adolescente o direito de visitação ao pai ou à mãe internados. A pegadinha troca “um dos pais” por “ambos” e “visitação” por “acompanhamento”.", "fundamento": "Art. 12. Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo integral de um dos pais ou responsável, nos casos de internação de criança ou adolescente. Parágrafo único. Será garantido à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras. (Incluído pela Lei nº 14.950, de 2024)", "fonte": "Lei 8.069/1990, art. 12, caput e parágrafo único (incluído pela Lei 14.950/2024)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-03", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Um funcionário da recepção de um hospital percebe sinais de que uma criança atendida pode estar sofrendo maus-tratos. Sobre o que dispõe o ECA a respeito dessas situações, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais.", "II – A comunicação ao Conselho Tutelar só é obrigatória quando os maus-tratos estiverem confirmados, não bastando a mera suspeita.", "III – Constitui infração administrativa, punida com multa, deixar o responsável por estabelecimento de atenção à saúde de comunicar à autoridade competente os casos de que tenha conhecimento envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "O art. 13 manda comunicar ao Conselho Tutelar tanto a suspeita quanto a confirmação, por isso a II está errada. A III reproduz o art. 245, que está no capítulo das infrações administrativas e prevê multa de três a vinte salários de referência.", "fundamento": "Art. 13. Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais. Art. 245. Deixar o médico, professor ou responsável por estabelecimento de atenção à saúde [...] de comunicar à autoridade competente os casos de que tenha conhecimento, envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente: Pena - multa de três a vinte salários de referência [...].", "fonte": "Lei 8.069/1990, art. 13, caput, e art. 245", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-04", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre alterações recentes do Estatuto da Criança e do Adolescente. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A Lei nº 14.950/2024 garantiu à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.", "( ) A Lei nº 14.987/2024 estendeu o atendimento médico e psicossocial às crianças e aos adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime semiaberto.", "( ) A Lei nº 15.243/2025 incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas, e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "( ) Segundo a Lei nº 15.243/2025, a assistência à criança e ao adolescente dependentes químicos cabe exclusivamente à família, restando ao poder público apenas promover campanhas de prevenção do uso de drogas ilícitas."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "A Lei 14.987/2024 fala em pai ou responsável preso em regime fechado, não semiaberto (2ª é falsa). A Lei 15.243/2025 atribui ao poder público a assistência integral e multiprofissional e as campanhas sobre drogas lícitas e ilícitas (4ª é falsa).", "fundamento": "Art. 12, parágrafo único (Lei 14.950/2024): direito de visitação à mãe ou ao pai internados. Art. 87, III (Lei 14.987/2024): atendimento médico e psicossocial às crianças e adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime fechado. Art. 14-A (Lei 15.243/2025): Incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas [...] e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "fonte": "Lei 8.069/1990, art. 12, parágrafo único (Lei 14.950/2024); art. 87, III (Lei 14.987/2024); art. 14-A (Lei 15.243/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-05", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Sobre o dever de assegurar, com absoluta prioridade, os direitos da criança e do adolescente, previsto no art. 4º do ECA, assinale a alternativa INCORRETA.", "alternativas": ["A garantia de prioridade compreende a primazia de receber proteção e socorro em quaisquer circunstâncias.", "A garantia de prioridade compreende a precedência de atendimento somente nos serviços públicos de saúde e de educação.", "A garantia de prioridade compreende a preferência na formulação e na execução das políticas sociais públicas.", "A garantia de prioridade compreende a destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde e à alimentação, entre outros."], "correta": 1, "explicacao": "A lei prevê precedência de atendimento nos serviços públicos ou de relevância pública, sem limitar a saúde e educação; por isso a B é a incorreta. As demais reproduzem o caput e as alíneas do § 1º do art. 4º.", "fundamento": "Art. 4º É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde, à alimentação [...]. § 1º A garantia de prioridade compreende: a) primazia de receber proteção e socorro em quaisquer circunstâncias; b) precedência de atendimento nos serviços públicos ou de relevância pública; c) preferência na formulação e na execução das políticas sociais públicas; d) destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "fonte": "Lei 8.069/1990, art. 4º, caput e § 1º (antigo parágrafo único; numeração dada pela Lei 15.240/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "ido-01", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Conforme a Lei nº 10.741/2003, com a redação dada pela Lei nº 14.423/2022, o Estatuto da Pessoa Idosa destina-se a regular os direitos assegurados às pessoas com idade igual ou superior a ______ anos. Entre as pessoas idosas, é assegurada prioridade especial aos maiores de ______ anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["65 – 80", "60 – 80", "60 – 75", "65 – 90", "60 – 90"], "correta": 1, "explicacao": "Pessoa idosa é quem tem 60 anos ou mais (art. 1º), e a prioridade especial é dos maiores de 80 anos (art. 3º, § 2º). A pegadinha troca 60 por 65, idade que aparece em outras normas.", "fundamento": "Art. 1º É instituído o Estatuto da Pessoa Idosa, destinado a regular os direitos assegurados às pessoas com idade igual ou superior a 60 (sessenta) anos. Art. 3º, § 2º Entre as pessoas idosas, é assegurada prioridade especial aos maiores de 80 (oitenta) anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas.", "fonte": "Lei 10.741/2003, art. 1º e art. 3º, § 2º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-02", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Uma pessoa idosa de 68 anos é internada em um hospital, e sua filha pergunta na recepção se pode permanecer como acompanhante. De acordo com o art. 16 do Estatuto da Pessoa Idosa, assinale a alternativa correta.", "alternativas": ["O direito a acompanhante é assegurado apenas à pessoa idosa internada, não se estendendo à que estiver em observação.", "Cabe ao diretor administrativo do hospital conceder a autorização para o acompanhamento da pessoa idosa.", "O direito a acompanhante em tempo integral é assegurado apenas às pessoas idosas maiores de 80 anos.", "Cabe ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento ou, no caso de impossibilidade, justificá-la por escrito.", "Havendo impossibilidade de acompanhamento, basta que o profissional de saúde comunique verbalmente a negativa à família."], "correta": 3, "explicacao": "O art. 16 garante acompanhante à pessoa idosa internada ou em observação, e o parágrafo único atribui a autorização ao profissional de saúde responsável pelo tratamento, que deve justificar por escrito eventual impossibilidade. As pegadinhas trocam o responsável (diretor), a forma (verbal) e a idade (80 anos).", "fundamento": "Art. 16. À pessoa idosa internada ou em observação é assegurado o direito a acompanhante, devendo o órgão de saúde proporcionar as condições adequadas para a sua permanência em tempo integral, segundo o critério médico. Parágrafo único. Caberá ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento da pessoa idosa ou, no caso de impossibilidade, justificá-la por escrito.", "fonte": "Lei 10.741/2003, art. 16, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-03", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Sobre a violência contra a pessoa idosa, de acordo com o art. 19 do Estatuto da Pessoa Idosa, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária.", "II – Esses casos também serão obrigatoriamente comunicados pelos serviços de saúde a quaisquer dos seguintes órgãos: autoridade policial, Ministério Público, Conselho Municipal, Conselho Estadual ou Conselho Nacional da Pessoa Idosa.", "III – Para os efeitos do Estatuto, considera-se violência contra a pessoa idosa apenas a ação praticada em local público que lhe cause morte ou dano físico."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I e II reproduzem o caput e os incisos do art. 19. A III está errada: o § 1º considera violência qualquer ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico.", "fundamento": "Art. 19. Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária, bem como serão obrigatoriamente comunicados por eles a quaisquer dos seguintes órgãos: I – autoridade policial; II – Ministério Público; III – Conselho Municipal da Pessoa Idosa; IV – Conselho Estadual da Pessoa Idosa; V – Conselho Nacional da Pessoa Idosa. § 1º [...] considera-se violência contra a pessoa idosa qualquer ação ou omissão praticada em local público ou privado que lhe cause morte, dano ou sofrimento físico ou psicológico.", "fonte": "Lei 10.741/2003, art. 19, caput, incisos I a V e § 1º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-04", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Estatuto da Pessoa Idosa. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É permitida a cobrança de valores diferenciados em razão da idade nos planos de saúde, desde que a pessoa idosa seja informada previamente.", "( ) A garantia de prioridade compreende o atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população.", "( ) Não estando a pessoa idosa em condições de optar pelo tratamento de saúde e não tendo curador, a opção será feita pelo diretor do hospital.", "( ) À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável."], "alternativas": ["F – V – F – V", "V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – V – V"], "correta": 0, "explicacao": "O art. 15, § 3º, veda a cobrança diferenciada por idade nos planos de saúde (1ª é falsa). Sem curador, a opção cabe aos familiares, e ao médico apenas em iminente risco de vida ou sem familiar conhecido; a lei não menciona o diretor do hospital (3ª é falsa).", "fundamento": "Art. 3º, § 1º, I – atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população. Art. 15, § 3º É vedada a discriminação da pessoa idosa nos planos de saúde pela cobrança de valores diferenciados em razão da idade. Art. 17. À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável. Parágrafo único [...] II – pelos familiares, quando a pessoa idosa não tiver curador ou este não puder ser contactado em tempo hábil.", "fonte": "Lei 10.741/2003, art. 3º, § 1º, I; art. 15, § 3º; art. 17, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "pcd-01", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "De acordo com a Lei Brasileira de Inclusão (Lei nº 13.146/2015): “Considera-se pessoa com deficiência aquela que tem impedimento de ______ prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais ______, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.” E ainda: “A avaliação da deficiência, quando necessária, será ______, realizada por equipe multiprofissional e interdisciplinar.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["longo – barreiras – biopsicossocial", "curto – barreiras – exclusivamente médica", "longo – limitações – exclusivamente médica", "médio – barreiras – biopsicossocial", "longo – doenças – psicossocial"], "correta": 0, "explicacao": "O art. 2º exige impedimento de longo prazo que, em interação com barreiras, obstrua a participação; a deficiência resulta dessa interação, e não só do diagnóstico. A avaliação é biopsicossocial e feita por equipe multiprofissional e interdisciplinar, não por avaliação exclusivamente médica.", "fundamento": "Art. 2º Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas. § 1º A avaliação da deficiência, quando necessária, será biopsicossocial, realizada por equipe multiprofissional e interdisciplinar [...].", "fonte": "Lei 13.146/2015, art. 2º, caput e § 1º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-02", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "A Lei nº 13.146/2015 classifica as barreiras que limitam ou impedem a participação social da pessoa com deficiência. Considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Barreiras atitudinais são atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "II – Barreiras arquitetônicas são as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo.", "III – Barreiras nas comunicações e na informação são qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações por intermédio de sistemas de comunicação e de tecnologia da informação."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas I e III."], "correta": 4, "explicacao": "A II traz a definição de barreiras urbanísticas, não das arquitetônicas. Barreiras arquitetônicas são as que existem nos edifícios públicos e privados. I e III reproduzem as alíneas “e” e “d” do art. 3º, IV.", "fundamento": "Art. 3º, IV – barreiras [...]: a) barreiras urbanísticas: as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo; b) barreiras arquitetônicas: as existentes nos edifícios públicos e privados; [...] d) barreiras nas comunicações e na informação: qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações [...]; e) barreiras atitudinais: atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "fonte": "Lei 13.146/2015, art. 3º, IV, alíneas a, b, d e e", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-03", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre o atendimento à pessoa com deficiência segundo a Lei nº 13.146/2015. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A pessoa com deficiência tem direito a receber atendimento prioritário, inclusive em todas as instituições e serviços de atendimento ao público.", "( ) Nos serviços de emergência públicos e privados, a prioridade conferida pela Lei é condicionada aos protocolos de atendimento médico.", "( ) Os direitos de atendimento prioritário estendem-se ao acompanhante ou ao atendente pessoal da pessoa com deficiência, inclusive quanto à restituição de imposto de renda e à tramitação processual.", "( ) O uso do cordão de fita com desenhos de girassóis, símbolo nacional de identificação de pessoas com deficiências ocultas, é obrigatório para o exercício dos direitos previstos em lei."], "alternativas": ["V – F – V – F", "F – V – F – V", "V – V – V – F", "V – V – F – F", "F – F – V – V"], "correta": 3, "explicacao": "A extensão ao acompanhante ou atendente pessoal exclui justamente a restituição de imposto de renda e a tramitação processual (incisos VI e VII), por isso a 3ª é falsa. O uso do cordão de girassóis é opcional, e sua ausência não prejudica direitos, por isso a 4ª também é falsa.", "fundamento": "Art. 9º [...] II - atendimento em todas as instituições e serviços de atendimento ao público; [...] § 1º Os direitos previstos neste artigo são extensivos ao acompanhante da pessoa com deficiência ou ao seu atendente pessoal, exceto quanto ao disposto nos incisos VI e VII deste artigo. § 2º Nos serviços de emergência públicos e privados, a prioridade conferida por esta Lei é condicionada aos protocolos de atendimento médico. Art. 2º-A, § 1º O uso do símbolo [...] é opcional, e sua ausência não prejudica o exercício de direitos e garantias previstos em lei.", "fonte": "Lei 13.146/2015, art. 9º, II, §§ 1º e 2º; art. 2º-A, § 1º (incluído pela Lei 14.624/2023)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-04", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Sobre os direitos da pessoa com deficiência nos serviços de saúde, conforme a Lei nº 13.146/2015, assinale a alternativa INCORRETA.", "alternativas": ["À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal, devendo o órgão ou a instituição de saúde proporcionar condições adequadas para sua permanência em tempo integral.", "Na impossibilidade de permanência do acompanhante ou do atendente pessoal junto à pessoa com deficiência, cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito.", "A notificação compulsória de violência contra a pessoa com deficiência é exigida apenas dos serviços públicos de saúde e somente nos casos em que a violência estiver confirmada.", "Ocorrendo a impossibilidade de permanência do acompanhante, o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência do acompanhante ou do atendente pessoal.", "Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência."], "correta": 2, "explicacao": "O art. 26 obriga os serviços de saúde públicos e privados a notificar a suspeita ou a confirmação de violência. Por isso a C é a incorreta, ao restringir a notificação ao setor público e aos casos confirmados. As demais reproduzem os arts. 22 e 26.", "fundamento": "Art. 22. À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal [...]. § 1º Na impossibilidade de permanência [...], cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito. § 2º [...] o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência [...]. Art. 26. Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência.", "fonte": "Lei 13.146/2015, art. 22, caput, §§ 1º e 2º; art. 26", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "rac-01", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "A Lei nº 14.532/2023 incluiu o art. 2º-A na Lei nº 7.716/1989 (Lei do Crime Racial) e tipificou a injúria racial como crime de racismo. Sobre esse dispositivo, assinale a alternativa correta.", "alternativas": ["Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional, sujeita o autor à pena de detenção, de 1 (um) a 6 (seis) meses, ou multa.", "A pena prevista é de reclusão, de 2 (dois) a 5 (cinco) anos, e multa, aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "A pena prevista é de reclusão, de 1 (um) a 3 (três) anos, e multa, aumentada de 1/3 (um terço) se o crime for cometido por 2 (duas) ou mais pessoas.", "A injúria praticada em razão da religião da vítima passou a ser punida pelo art. 2º-A da Lei nº 7.716/1989, com a mesma pena da injúria em razão de raça ou cor.", "A injúria racial continuou prevista exclusivamente no Código Penal, como forma qualificada do crime de injúria."], "correta": 1, "explicacao": "O art. 2º-A prevê reclusão de 2 a 5 anos e multa, com aumento de metade no concurso de duas ou mais pessoas. A religião não está no art. 2º-A: a injúria por religião, idade ou deficiência ficou no art. 140, § 3º, do Código Penal, com reclusão de 1 a 3 anos (pegadinhas C e D).", "fundamento": "Art. 2º-A Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional. Pena: reclusão, de 2 (dois) a 5 (cinco) anos, e multa. Parágrafo único. A pena é aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "fonte": "Lei 7.716/1989, art. 2º-A (incluído pela Lei 14.532/2023, art. 1º); Código Penal, art. 140, § 3º (redação da Lei 14.532/2023, art. 2º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm"}, {"id": "rac-02", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "Considere as afirmações abaixo sobre os dispositivos que a Lei nº 14.532/2023 incluiu na Lei nº 7.716/1989. Quais estão corretas?", "itens": ["I – Os crimes previstos nos arts. 2º-A e 20 da Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando praticados por funcionário público, no exercício de suas funções ou a pretexto de exercê-las.", "II – Os crimes previstos na Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando ocorrerem em contexto ou com intuito de descontração, diversão ou recreação.", "III – Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três afirmações reproduzem os arts. 20-B (racismo praticado por funcionário público), 20-A (racismo “recreativo”) e 20-D (assistência à vítima). O candidato pode desconfiar da II por achar que piada afasta o crime, mas ela aumenta a pena.", "fundamento": "Art. 20-A. Os crimes previstos nesta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando ocorrerem em contexto ou com intuito de descontração, diversão ou recreação. Art. 20-B. Os crimes previstos nos arts. 2º-A e 20 desta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando praticados por funcionário público [...], no exercício de suas funções ou a pretexto de exercê-las. Art. 20-D. Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público.", "fonte": "Lei 7.716/1989, arts. 20-A, 20-B e 20-D (incluídos pela Lei 14.532/2023, art. 1º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm"}, {"id": "div-01", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Segundo o Guia ANS de Diversidade e Inclusão (2023), a diversidade não deve ser ______, mas sim promovida e efetivada. O Guia afirma ainda que a diversidade está ligada à ______, enquanto a inclusão é um passo além: garantir que todos tenham acesso às mesmas oportunidades de desenvolvimento e ______ profissional dentro da instituição. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["tolerada – representatividade – ascensão", "tolerada – produtividade – remuneração", "imposta – representatividade – ascensão", "apenas declarada – meritocracia – ascensão", "tolerada – representatividade – estabilidade"], "correta": 0, "explicacao": "O Guia diz que a diversidade não deve ser tolerada, mas promovida e efetivada. Para ele, diversidade se liga à representatividade, e inclusão é garantir a todos as mesmas oportunidades de desenvolvimento e ascensão profissional. As alternativas erradas trocam termos por palavras plausíveis do mundo do trabalho.", "fundamento": "O Guia afirma que a diversidade deve ser promovida e efetivada, não apenas tolerada (seção 1). Na seção 2, liga diversidade à representatividade e descreve a inclusão como um passo além: assegurar a todos as mesmas oportunidades de desenvolvimento e ascensão profissional na instituição.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 1 “Por que um Guia ANS de Diversidade e Inclusão?” (p. 7) e seção 2 “Contextualização” (p. 8)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "div-02", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Um assistente administrativo atende, na recepção de um hospital, pessoas com diferentes tipos de deficiência. De acordo com as orientações do Guia ANS de Diversidade e Inclusão (2023), assinale a alternativa correta.", "alternativas": ["Se a pessoa surda estiver acompanhada, a fala deve ser dirigida ao acompanhante, para agilizar o atendimento.", "Ao guiar uma pessoa com deficiência visual, deve-se segurá-la firmemente pelo braço ou pela bengala e conduzi-la à frente.", "Ao conduzir uma pessoa em cadeira de rodas, deve-se perguntar antes como proceder, pois há pessoas que se sentem mais seguras indo de frente ou de costas.", "Diante de uma pessoa cega acompanhada de cão-guia, recomenda-se fazer carinho no animal para tranquilizá-lo antes de orientar a pessoa.", "Na conversa com uma pessoa cega, devem-se evitar palavras como “ver” e “olhar”, que podem constrangê-la."], "correta": 2, "explicacao": "O Guia recomenda perguntar antes de conduzir a cadeira de rodas. Ele orienta a falar diretamente com a pessoa surda, oferecer o cotovelo sem agarrar o braço nem a bengala, não distrair o cão-guia com carinho e usar com naturalidade palavras como “ver” e “olhar”.", "fundamento": "Na seção 4.3, o Guia orienta: perguntar como conduzir a cadeira de rodas (de frente ou de costas); falar diretamente com a pessoa surda, não com o acompanhante; oferecer o cotovelo ao guiar pessoa cega, sem agarrá-la; não acariciar o cão-guia; usar “cego”, “ver” e “olhar” com naturalidade.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 4.3 “Pessoas com Deficiência – PcD”, deficiências física, auditiva e visual (p. 20–21)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "div-03", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Guia ANS de Diversidade e Inclusão (2023). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A nomenclatura adequada atualmente é “pessoa com deficiência” (PcD), estando superadas expressões como “pessoa portadora de deficiência” e “pessoa com necessidades especiais”.", "( ) Orientação sexual e opção sexual são expressões equivalentes, pois os desejos afetivos e sexuais decorrem de uma escolha pessoal.", "( ) O nome social, escolhido por pessoas trans e travestis de acordo com o gênero com que se identificam, deve ser respeitado pelos colegas, mas não é exigível das instituições.", "( ) O ageísmo, também chamado de etarismo ou idadismo, é a conduta discriminatória em razão da idade avançada das pessoas."], "alternativas": ["V – V – F – F", "V – F – F – V", "F – V – V – F", "V – F – V – V", "F – F – V – V"], "correta": 1, "explicacao": "O Guia afirma que orientação sexual não é opção, porque não se trata de escolha (2ª é falsa). Também diz que o nome social deve ser usado e acatado por todos, inclusive pelas instituições (3ª é falsa).", "fundamento": "O Guia considera superadas as expressões “portadora de deficiência” e “necessidades especiais” e recomenda “pessoa com deficiência” (PcD). Afirma que orientação sexual não é opção, que o nome social deve ser acatado por todos, inclusive instituições, e que ageísmo (etarismo, idadismo) é a discriminação pela idade avançada.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seções 4.2 “Gênero” (p. 16–17), 4.3 “Pessoas com Deficiência” (p. 19 e 22) e 4.5 “Ageísmo ou Etarismo” (p. 24)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "lgpd-01", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Um hospital registra no prontuário eletrônico o diagnóstico de um paciente identificado. De acordo com as definições da Lei nº 13.709/2018 (LGPD), a informação sobre a saúde desse paciente é classificada como", "alternativas": ["dado anonimizado, por estar protegida pelo sigilo médico.", "dado pessoal comum, pois a lei só considera sensíveis os dados sobre origem racial ou étnica e convicção religiosa.", "dado pessoal sensível.", "dado público, por constar de registro de instituição pública de saúde.", "banco de dados, categoria que dispensa a aplicação dos princípios da lei."], "correta": 2, "explicacao": "O art. 5º, II, inclui expressamente o “dado referente à saúde” entre os dados pessoais sensíveis. A pegadinha da alternativa B é restringir a lista; a de A é confundir sigilo com anonimização, que exige que o titular não possa ser identificado.", "fundamento": "“II - dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;”", "fonte": "Lei 13.709/2018, art. 5º, II (e III, para dado anonimizado)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-02", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Lei nº 13.709/2018 (LGPD).\n\nPara os fins da lei, ________ é a pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; ________ é a pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do ________.", "alternativas": ["controlador – operador – controlador", "operador – controlador – operador", "encarregado – operador – titular", "controlador – encarregado – titular", "titular – operador – controlador"], "correta": 0, "explicacao": "Quem decide sobre o tratamento é o controlador; quem executa o tratamento em nome do controlador é o operador. A banca costuma inverter esses dois papéis (alternativa B).", "fundamento": "“VI - controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; VII - operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador;”", "fonte": "Lei 13.709/2018, art. 5º, VI e VII", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-03", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Considere as definições abaixo, relacionadas aos princípios do art. 6º da Lei nº 13.709/2018 (LGPD), e indique se são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial.", "( ) Qualidade dos dados: limitação do tratamento ao mínimo necessário para a realização de suas finalidades.", "( ) Prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais.", "( ) Adequação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "Transparência e prevenção estão definidas corretamente. A segunda definição é a do princípio da necessidade, e a quarta é a do princípio da não discriminação; a pegadinha é trocar o nome do princípio mantendo a definição literal.", "fundamento": "Art. 6º: “III - necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades [...]; VI - transparência: [...]; VIII - prevenção: adoção de medidas para prevenir a ocorrência de danos [...]; IX - não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos;”", "fonte": "Lei 13.709/2018, art. 6º, II, III, V, VI, VIII e IX", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-04", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Sobre o tratamento de dados pessoais sensíveis e os direitos do titular na Lei nº 13.709/2018 (LGPD), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – O tratamento de dados pessoais sensíveis pode ocorrer sem fornecimento de consentimento do titular quando for indispensável para a tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária.", "II – Quando o tratamento de dado sensível se basear no consentimento, basta um consentimento genérico, dispensada a indicação de finalidades específicas.", "III – O titular tem direito a obter do controlador, a qualquer momento e mediante requisição, a confirmação da existência de tratamento e o acesso aos dados."], "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 1, "explicacao": "I reproduz o art. 11, II, “f” (redação da Lei 13.853/2019) e III reproduz o art. 18, I e II. II está errada: para dado sensível, o consentimento deve ser dado de forma específica e destacada, para finalidades específicas.", "fundamento": "Art. 11: “I - quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas; II - sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para: [...] f) tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária”. Art. 18, I e II: confirmação da existência de tratamento; acesso aos dados.", "fonte": "Lei 13.709/2018, art. 11, I e II, “f” (redação da Lei 13.853/2019); art. 18, caput, I e II", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "eti-01", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "De acordo com o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), a pena aplicável ao servidor público pela Comissão de Ética é a de", "alternativas": ["advertência, com fundamentação em parecer assinado pelo presidente da Comissão.", "suspensão, com ciência do faltoso.", "demissão, após rito sumário com recurso ao Ministro de Estado.", "censura, cuja fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.", "censura, cuja fundamentação constará de parecer assinado apenas pelo relator, dispensada a ciência do faltoso."], "correta": 3, "explicacao": "O inciso XXII prevê a censura, com parecer assinado por todos os integrantes e ciência do faltoso. A alternativa E acerta a pena, mas troca quem assina e dispensa a ciência; advertência, suspensão e demissão não são penas da Comissão de Ética.", "fundamento": "“XXII - A pena aplicável ao servidor público pela Comissão de Ética é a de censura e sua fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo II, inciso XXII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-02", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Considerando as Regras Deontológicas do Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), assinale a alternativa INCORRETA.", "alternativas": ["Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral.", "Toda ausência injustificada do servidor de seu local de trabalho é fator de desmoralização do serviço público.", "A publicidade dos atos administrativos pode ser omitida sempre que o servidor a julgar inconveniente para a chefia, sem que isso configure comprometimento ético.", "Os fatos e atos verificados na conduta do dia a dia na vida privada do servidor poderão acrescer ou diminuir o seu bom conceito na vida funcional.", "Toda pessoa tem direito à verdade, e o servidor não pode omiti-la ou falseá-la, ainda que contrária aos interesses da própria Administração Pública."], "correta": 2, "explicacao": "Pelo inciso VII, a publicidade é requisito de eficácia e moralidade, ressalvados apenas segurança nacional, investigações policiais ou interesse superior do Estado em processo previamente declarado sigiloso; sua omissão gera comprometimento ético. As demais alternativas reproduzem os incisos IX, XII, VI e VIII.", "fundamento": "“VII - Salvo os casos de segurança nacional, investigações policiais ou interesse superior do Estado e da Administração Pública, a serem preservados em processo previamente declarado sigiloso, nos termos da lei, a publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade, ensejando sua omissão comprometimento ético contra o bem comum, imputável a quem a negar.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo I, Seção I, incisos VI, VII, VIII, IX e XII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-03", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre os deveres e as vedações previstos no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – É vedado ao servidor público apresentar-se embriagado no serviço ou fora dele habitualmente.", "II – É dever do servidor resistir às pressões de superiores hierárquicos que visem obter vantagens indevidas, mas não lhe cabe denunciá-las, em respeito à hierarquia.", "III – É vedado ao servidor retirar da repartição pública qualquer documento, livro ou bem pertencente ao patrimônio público, ainda que esteja legalmente autorizado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 0, "explicacao": "I reproduz a alínea “n” do inciso XV. II está errada porque a alínea “i” do inciso XIV manda resistir às pressões “e denunciá-las”. III está errada porque a vedação é retirar bens “sem estar legalmente autorizado”.", "fundamento": "XIV, i) “resistir a todas as pressões de superiores hierárquicos, de contratantes, interessados e outros que visem obter quaisquer favores, benesses ou vantagens indevidas [...] e denunciá-las”; XV, l) “retirar da repartição pública, sem estar legalmente autorizado, qualquer documento, livro ou bem pertencente ao patrimônio público”; XV, n) “apresentar-se embriagado no serviço ou fora dele habitualmente”.", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alínea i; inciso XV, alíneas l e n", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-04", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Com base no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É dever fundamental do servidor ser assíduo e frequente ao serviço, na certeza de que sua ausência provoca danos ao trabalho ordenado.", "( ) Para fins de apuração do comprometimento ético, só se considera servidor público quem presta serviços de natureza permanente e mediante retribuição financeira.", "( ) É dever fundamental do servidor apresentar-se ao trabalho com vestimentas adequadas ao exercício da função.", "( ) É dever fundamental do servidor divulgar e informar a todos os integrantes da sua classe sobre a existência do Código de Ética, estimulando o seu integral cumprimento."], "alternativas": ["V – V – V – V", "F – F – V – V", "V – F – F – V", "V – V – F – F", "V – F – V – V"], "correta": 4, "explicacao": "O primeiro, o terceiro e o quarto itens reproduzem as alíneas “l”, “p” e “v” do inciso XIV. O segundo é falso: o inciso XXIV abrange serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira.", "fundamento": "“XXIV - Para fins de apuração do comprometimento ético, entende-se por servidor público todo aquele que, por força de lei, contrato ou de qualquer ato jurídico, preste serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira [...]”", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alíneas l, p e v; inciso XXIV", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "nr32-01", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Para fins de aplicação da Norma Regulamentadora nº 32 (Segurança e Saúde no Trabalho em Serviços de Saúde), entende-se por serviços de saúde", "alternativas": ["apenas os hospitais e as clínicas que mantenham regime de internação.", "qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.", "somente os estabelecimentos de alta complexidade, como hospitais universitários e de referência.", "as edificações de saúde que mantenham trabalhadores expostos a radiações ionizantes.", "qualquer edificação destinada à prestação de assistência à saúde da população, excluídas as atividades de pesquisa e ensino."], "correta": 1, "explicacao": "O item 32.1.2 adota conceito amplo, que inclui pesquisa e ensino e vale para qualquer nível de complexidade. A alternativa E é a pegadinha: copia o início do texto, mas exclui justamente pesquisa e ensino.", "fundamento": "“32.1.2 Para fins de aplicação desta NR entende-se por serviços de saúde qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.”", "fonte": "NR-32, item 32.1.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-02", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Segundo a NR-32, entre as medidas de proteção contra riscos biológicos, o empregador deve vedar:\n\nQuais estão corretas?", "itens": ["I – o consumo de alimentos e bebidas nos postos de trabalho.", "II – o uso de adornos e o manuseio de lentes de contato nos postos de trabalho.", "III – o uso de calçados fechados."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II estão no item 32.2.4.5, alíneas “c” e “b”. III troca uma palavra: o que deve ser vedado é o uso de calçados abertos.", "fundamento": "“32.2.4.5 O empregador deve vedar: a) a utilização de pias de trabalho para fins diversos dos previstos; b) o ato de fumar, o uso de adornos e o manuseio de lentes de contato nos postos de trabalho; c) o consumo de alimentos e bebidas nos postos de trabalho; d) a guarda de alimentos em locais não destinados para este fim; e) o uso de calçados abertos.”", "fonte": "NR-32, item 32.2.4.5", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-03", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a NR-32.\n\nOs trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu ________. São vedados o ________ e a desconexão manual de agulhas. Para os recipientes destinados à coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado ________ abaixo do bocal.", "alternativas": ["armazenamento – descarte – 2 cm", "descarte – transporte – 10 cm", "descarte – reencape – 5 cm", "reencape – descarte – 5 cm", "transporte – reencape – 10 cm"], "correta": 2, "explicacao": "Quem usa o perfurocortante é responsável pelo descarte (32.2.4.14), o reencape é vedado (32.2.4.15) e o limite de enchimento do coletor fica 5 cm abaixo do bocal (32.5.3.2). A alternativa D usa os mesmos termos em ordem invertida.", "fundamento": "“32.2.4.14 Os trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu descarte. 32.2.4.15 São vedados o reencape e a desconexão manual de agulhas.” “32.5.3.2 Para os recipientes destinados a coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado 5 cm abaixo do bocal.”", "fonte": "NR-32, itens 32.2.4.14, 32.2.4.15 e 32.5.3.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-04", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Com base na NR-32, indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A todo trabalhador dos serviços de saúde deve ser fornecido, gratuitamente, programa de imunização ativa contra tétano, difteria, hepatite B e os estabelecidos no PCMSO.", "( ) O uso de luvas descartáveis substitui o processo de lavagem das mãos.", "( ) A vacinação deve ser registrada no prontuário clínico individual do trabalhador, previsto na NR-07.", "( ) A vestimenta de trabalho deve ser fornecida pelo empregador, podendo seu custo ser descontado do salário do empregado."], "alternativas": ["V – F – V – F", "V – V – V – F", "F – F – V – V", "V – F – F – V", "F – V – F – V"], "correta": 0, "explicacao": "O primeiro e o terceiro itens reproduzem os itens 32.2.4.17.1 e 32.2.4.17.6. O uso de luvas não substitui a lavagem das mãos (32.2.4.3.2), e a vestimenta deve ser fornecida sem ônus para o empregado (32.2.4.6.1).", "fundamento": "“32.2.4.3.2 O uso de luvas não substitui o processo de lavagem das mãos, o que deve ocorrer, no mínimo, antes e depois do uso das mesmas.” “32.2.4.6.1 A vestimenta deve ser fornecida sem ônus para o empregado.” “32.2.4.17.6 A vacinação deve ser registrada no prontuário clínico individual do trabalhador,
