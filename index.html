s estiverem confirmados, não bastando a mera suspeita.", "III – Constitui infração administrativa, punida com multa, deixar o responsável por estabelecimento de atenção à saúde de comunicar à autoridade competente os casos de que tenha conhecimento envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "O art. 13 manda comunicar ao Conselho Tutelar tanto a suspeita quanto a confirmação, por isso a II está errada. A III reproduz o art. 245, que está no capítulo das infrações administrativas e prevê multa de três a vinte salários de referência.", "fundamento": "Art. 13. Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais. Art. 245. Deixar o médico, professor ou responsável por estabelecimento de atenção à saúde [...] de comunicar à autoridade competente os casos de que tenha conhecimento, envolvendo suspeita ou confirmação de maus-tratos contra criança ou adolescente: Pena - multa de três a vinte salários de referência [...].", "fonte": "Lei 8.069/1990, art. 13, caput, e art. 245", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-04", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre alterações recentes do Estatuto da Criança e do Adolescente. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A Lei nº 14.950/2024 garantiu à criança e ao adolescente o direito de visitação à mãe ou ao pai internados em instituição de saúde, nos termos das normas regulamentadoras.", "( ) A Lei nº 14.987/2024 estendeu o atendimento médico e psicossocial às crianças e aos adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime semiaberto.", "( ) A Lei nº 15.243/2025 incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas, e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "( ) Segundo a Lei nº 15.243/2025, a assistência à criança e ao adolescente dependentes químicos cabe exclusivamente à família, restando ao poder público apenas promover campanhas de prevenção do uso de drogas ilícitas."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "A Lei 14.987/2024 fala em pai ou responsável preso em regime fechado, não semiaberto (2ª é falsa). A Lei 15.243/2025 atribui ao poder público a assistência integral e multiprofissional e as campanhas sobre drogas lícitas e ilícitas (4ª é falsa).", "fundamento": "Art. 12, parágrafo único (Lei 14.950/2024): direito de visitação à mãe ou ao pai internados. Art. 87, III (Lei 14.987/2024): atendimento médico e psicossocial às crianças e adolescentes que tiverem qualquer dos pais ou responsáveis vitimado por grave violência ou preso em regime fechado. Art. 14-A (Lei 15.243/2025): Incumbe ao poder público proporcionar assistência integral e multiprofissional à criança e ao adolescente dependentes químicos e/ou com problemas decorrentes do uso de drogas [...] e promover campanhas de prevenção do uso de drogas lícitas e ilícitas.", "fonte": "Lei 8.069/1990, art. 12, parágrafo único (Lei 14.950/2024); art. 87, III (Lei 14.987/2024); art. 14-A (Lei 15.243/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "eca-05", "materia": "Conhecimentos Específicos", "tema": "ECA", "enunciado": "Sobre o dever de assegurar, com absoluta prioridade, os direitos da criança e do adolescente, previsto no art. 4º do ECA, assinale a alternativa INCORRETA.", "alternativas": ["A garantia de prioridade compreende a primazia de receber proteção e socorro em quaisquer circunstâncias.", "A garantia de prioridade compreende a precedência de atendimento somente nos serviços públicos de saúde e de educação.", "A garantia de prioridade compreende a preferência na formulação e na execução das políticas sociais públicas.", "A garantia de prioridade compreende a destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde e à alimentação, entre outros."], "correta": 1, "explicacao": "A lei prevê precedência de atendimento nos serviços públicos ou de relevância pública, sem limitar a saúde e educação; por isso a B é a incorreta. As demais reproduzem o caput e as alíneas do § 1º do art. 4º.", "fundamento": "Art. 4º É dever da família, da comunidade, da sociedade em geral e do poder público assegurar, com absoluta prioridade, a efetivação dos direitos referentes à vida, à saúde, à alimentação [...]. § 1º A garantia de prioridade compreende: a) primazia de receber proteção e socorro em quaisquer circunstâncias; b) precedência de atendimento nos serviços públicos ou de relevância pública; c) preferência na formulação e na execução das políticas sociais públicas; d) destinação privilegiada de recursos públicos nas áreas relacionadas com a proteção à infância e à juventude.", "fonte": "Lei 8.069/1990, art. 4º, caput e § 1º (antigo parágrafo único; numeração dada pela Lei 15.240/2025)", "url": "http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm"}, {"id": "ido-01", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Conforme a Lei nº 10.741/2003, com a redação dada pela Lei nº 14.423/2022, o Estatuto da Pessoa Idosa destina-se a regular os direitos assegurados às pessoas com idade igual ou superior a ______ anos. Entre as pessoas idosas, é assegurada prioridade especial aos maiores de ______ anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["65 – 80", "60 – 80", "60 – 75", "65 – 90", "60 – 90"], "correta": 1, "explicacao": "Pessoa idosa é quem tem 60 anos ou mais (art. 1º), e a prioridade especial é dos maiores de 80 anos (art. 3º, § 2º). A pegadinha troca 60 por 65, idade que aparece em outras normas.", "fundamento": "Art. 1º É instituído o Estatuto da Pessoa Idosa, destinado a regular os direitos assegurados às pessoas com idade igual ou superior a 60 (sessenta) anos. Art. 3º, § 2º Entre as pessoas idosas, é assegurada prioridade especial aos maiores de 80 (oitenta) anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas.", "fonte": "Lei 10.741/2003, art. 1º e art. 3º, § 2º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-02", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Uma pessoa idosa de 68 anos é internada em um hospital, e sua filha pergunta na recepção se pode permanecer como acompanhante. De acordo com o art. 16 do Estatuto da Pessoa Idosa, assinale a alternativa correta.", "alternativas": ["O direito a acompanhante é assegurado apenas à pessoa idosa internada, não se estendendo à que estiver em observação.", "Cabe ao diretor administrativo do hospital conceder a autorização para o acompanhamento da pessoa idosa.", "O direito a acompanhante em tempo integral é assegurado apenas às pessoas idosas maiores de 80 anos.", "Cabe ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento ou, no caso de impossibilidade, justificá-la por escrito.", "Havendo impossibilidade de acompanhamento, basta que o profissional de saúde comunique verbalmente a negativa à família."], "correta": 3, "explicacao": "O art. 16 garante acompanhante à pessoa idosa internada ou em observação, e o parágrafo único atribui a autorização ao profissional de saúde responsável pelo tratamento, que deve justificar por escrito eventual impossibilidade. As pegadinhas trocam o responsável (diretor), a forma (verbal) e a idade (80 anos).", "fundamento": "Art. 16. À pessoa idosa internada ou em observação é assegurado o direito a acompanhante, devendo o órgão de saúde proporcionar as condições adequadas para a sua permanência em tempo integral, segundo o critério médico. Parágrafo único. Caberá ao profissional de saúde responsável pelo tratamento conceder autorização para o acompanhamento da pessoa idosa ou, no caso de impossibilidade, justificá-la por escrito.", "fonte": "Lei 10.741/2003, art. 16, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-03", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Sobre a violência contra a pessoa idosa, de acordo com o art. 19 do Estatuto da Pessoa Idosa, considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária.", "II – Esses casos também serão obrigatoriamente comunicados pelos serviços de saúde a quaisquer dos seguintes órgãos: autoridade policial, Ministério Público, Conselho Municipal, Conselho Estadual ou Conselho Nacional da Pessoa Idosa.", "III – Para os efeitos do Estatuto, considera-se violência contra a pessoa idosa apenas a ação praticada em local público que lhe cause morte ou dano físico."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 2, "explicacao": "I e II reproduzem o caput e os incisos do art. 19. A III está errada: o § 1º considera violência qualquer ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico.", "fundamento": "Art. 19. Os casos de suspeita ou confirmação de violência praticada contra pessoas idosas serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade sanitária, bem como serão obrigatoriamente comunicados por eles a quaisquer dos seguintes órgãos: I – autoridade policial; II – Ministério Público; III – Conselho Municipal da Pessoa Idosa; IV – Conselho Estadual da Pessoa Idosa; V – Conselho Nacional da Pessoa Idosa. § 1º [...] considera-se violência contra a pessoa idosa qualquer ação ou omissão praticada em local público ou privado que lhe cause morte, dano ou sofrimento físico ou psicológico.", "fonte": "Lei 10.741/2003, art. 19, caput, incisos I a V e § 1º (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "ido-04", "materia": "Conhecimentos Específicos", "tema": "Estatuto da Pessoa Idosa", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Estatuto da Pessoa Idosa. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É permitida a cobrança de valores diferenciados em razão da idade nos planos de saúde, desde que a pessoa idosa seja informada previamente.", "( ) A garantia de prioridade compreende o atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população.", "( ) Não estando a pessoa idosa em condições de optar pelo tratamento de saúde e não tendo curador, a opção será feita pelo diretor do hospital.", "( ) À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável."], "alternativas": ["F – V – F – V", "V – V – F – F", "F – F – V – V", "V – F – V – F", "F – V – V – V"], "correta": 0, "explicacao": "O art. 15, § 3º, veda a cobrança diferenciada por idade nos planos de saúde (1ª é falsa). Sem curador, a opção cabe aos familiares, e ao médico apenas em iminente risco de vida ou sem familiar conhecido; a lei não menciona o diretor do hospital (3ª é falsa).", "fundamento": "Art. 3º, § 1º, I – atendimento preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população. Art. 15, § 3º É vedada a discriminação da pessoa idosa nos planos de saúde pela cobrança de valores diferenciados em razão da idade. Art. 17. À pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de optar pelo tratamento de saúde que lhe for reputado mais favorável. Parágrafo único [...] II – pelos familiares, quando a pessoa idosa não tiver curador ou este não puder ser contactado em tempo hábil.", "fonte": "Lei 10.741/2003, art. 3º, § 1º, I; art. 15, § 3º; art. 17, caput e parágrafo único (redação da Lei 14.423/2022)", "url": "https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm"}, {"id": "pcd-01", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "De acordo com a Lei Brasileira de Inclusão (Lei nº 13.146/2015): “Considera-se pessoa com deficiência aquela que tem impedimento de ______ prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais ______, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.” E ainda: “A avaliação da deficiência, quando necessária, será ______, realizada por equipe multiprofissional e interdisciplinar.” Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["longo – barreiras – biopsicossocial", "curto – barreiras – exclusivamente médica", "longo – limitações – exclusivamente médica", "médio – barreiras – biopsicossocial", "longo – doenças – psicossocial"], "correta": 0, "explicacao": "O art. 2º exige impedimento de longo prazo que, em interação com barreiras, obstrua a participação; a deficiência resulta dessa interação, e não só do diagnóstico. A avaliação é biopsicossocial e feita por equipe multiprofissional e interdisciplinar, não por avaliação exclusivamente médica.", "fundamento": "Art. 2º Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas. § 1º A avaliação da deficiência, quando necessária, será biopsicossocial, realizada por equipe multiprofissional e interdisciplinar [...].", "fonte": "Lei 13.146/2015, art. 2º, caput e § 1º", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-02", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "A Lei nº 13.146/2015 classifica as barreiras que limitam ou impedem a participação social da pessoa com deficiência. Considere as afirmações abaixo. Quais estão corretas?", "itens": ["I – Barreiras atitudinais são atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "II – Barreiras arquitetônicas são as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo.", "III – Barreiras nas comunicações e na informação são qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações por intermédio de sistemas de comunicação e de tecnologia da informação."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas I e III."], "correta": 4, "explicacao": "A II traz a definição de barreiras urbanísticas, não das arquitetônicas. Barreiras arquitetônicas são as que existem nos edifícios públicos e privados. I e III reproduzem as alíneas “e” e “d” do art. 3º, IV.", "fundamento": "Art. 3º, IV – barreiras [...]: a) barreiras urbanísticas: as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo; b) barreiras arquitetônicas: as existentes nos edifícios públicos e privados; [...] d) barreiras nas comunicações e na informação: qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações [...]; e) barreiras atitudinais: atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas.", "fonte": "Lei 13.146/2015, art. 3º, IV, alíneas a, b, d e e", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-03", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, sobre o atendimento à pessoa com deficiência segundo a Lei nº 13.146/2015. A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A pessoa com deficiência tem direito a receber atendimento prioritário, inclusive em todas as instituições e serviços de atendimento ao público.", "( ) Nos serviços de emergência públicos e privados, a prioridade conferida pela Lei é condicionada aos protocolos de atendimento médico.", "( ) Os direitos de atendimento prioritário estendem-se ao acompanhante ou ao atendente pessoal da pessoa com deficiência, inclusive quanto à restituição de imposto de renda e à tramitação processual.", "( ) O uso do cordão de fita com desenhos de girassóis, símbolo nacional de identificação de pessoas com deficiências ocultas, é obrigatório para o exercício dos direitos previstos em lei."], "alternativas": ["V – F – V – F", "F – V – F – V", "V – V – V – F", "V – V – F – F", "F – F – V – V"], "correta": 3, "explicacao": "A extensão ao acompanhante ou atendente pessoal exclui justamente a restituição de imposto de renda e a tramitação processual (incisos VI e VII), por isso a 3ª é falsa. O uso do cordão de girassóis é opcional, e sua ausência não prejudica direitos, por isso a 4ª também é falsa.", "fundamento": "Art. 9º [...] II - atendimento em todas as instituições e serviços de atendimento ao público; [...] § 1º Os direitos previstos neste artigo são extensivos ao acompanhante da pessoa com deficiência ou ao seu atendente pessoal, exceto quanto ao disposto nos incisos VI e VII deste artigo. § 2º Nos serviços de emergência públicos e privados, a prioridade conferida por esta Lei é condicionada aos protocolos de atendimento médico. Art. 2º-A, § 1º O uso do símbolo [...] é opcional, e sua ausência não prejudica o exercício de direitos e garantias previstos em lei.", "fonte": "Lei 13.146/2015, art. 9º, II, §§ 1º e 2º; art. 2º-A, § 1º (incluído pela Lei 14.624/2023)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "pcd-04", "materia": "Conhecimentos Específicos", "tema": "Pessoa com Deficiência (LBI)", "enunciado": "Sobre os direitos da pessoa com deficiência nos serviços de saúde, conforme a Lei nº 13.146/2015, assinale a alternativa INCORRETA.", "alternativas": ["À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal, devendo o órgão ou a instituição de saúde proporcionar condições adequadas para sua permanência em tempo integral.", "Na impossibilidade de permanência do acompanhante ou do atendente pessoal junto à pessoa com deficiência, cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito.", "A notificação compulsória de violência contra a pessoa com deficiência é exigida apenas dos serviços públicos de saúde e somente nos casos em que a violência estiver confirmada.", "Ocorrendo a impossibilidade de permanência do acompanhante, o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência do acompanhante ou do atendente pessoal.", "Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência."], "correta": 2, "explicacao": "O art. 26 obriga os serviços de saúde públicos e privados a notificar a suspeita ou a confirmação de violência. Por isso a C é a incorreta, ao restringir a notificação ao setor público e aos casos confirmados. As demais reproduzem os arts. 22 e 26.", "fundamento": "Art. 22. À pessoa com deficiência internada ou em observação é assegurado o direito a acompanhante ou a atendente pessoal [...]. § 1º Na impossibilidade de permanência [...], cabe ao profissional de saúde responsável pelo tratamento justificá-la por escrito. § 2º [...] o órgão ou a instituição de saúde deve adotar as providências cabíveis para suprir a ausência [...]. Art. 26. Os casos de suspeita ou de confirmação de violência praticada contra a pessoa com deficiência serão objeto de notificação compulsória pelos serviços de saúde públicos e privados à autoridade policial e ao Ministério Público, além dos Conselhos dos Direitos da Pessoa com Deficiência.", "fonte": "Lei 13.146/2015, art. 22, caput, §§ 1º e 2º; art. 26", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm"}, {"id": "rac-01", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "A Lei nº 14.532/2023 incluiu o art. 2º-A na Lei nº 7.716/1989 (Lei do Crime Racial) e tipificou a injúria racial como crime de racismo. Sobre esse dispositivo, assinale a alternativa correta.", "alternativas": ["Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional, sujeita o autor à pena de detenção, de 1 (um) a 6 (seis) meses, ou multa.", "A pena prevista é de reclusão, de 2 (dois) a 5 (cinco) anos, e multa, aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "A pena prevista é de reclusão, de 1 (um) a 3 (três) anos, e multa, aumentada de 1/3 (um terço) se o crime for cometido por 2 (duas) ou mais pessoas.", "A injúria praticada em razão da religião da vítima passou a ser punida pelo art. 2º-A da Lei nº 7.716/1989, com a mesma pena da injúria em razão de raça ou cor.", "A injúria racial continuou prevista exclusivamente no Código Penal, como forma qualificada do crime de injúria."], "correta": 1, "explicacao": "O art. 2º-A prevê reclusão de 2 a 5 anos e multa, com aumento de metade no concurso de duas ou mais pessoas. A religião não está no art. 2º-A: a injúria por religião, idade ou deficiência ficou no art. 140, § 3º, do Código Penal, com reclusão de 1 a 3 anos (pegadinhas C e D).", "fundamento": "Art. 2º-A Injuriar alguém, ofendendo-lhe a dignidade ou o decoro, em razão de raça, cor, etnia ou procedência nacional. Pena: reclusão, de 2 (dois) a 5 (cinco) anos, e multa. Parágrafo único. A pena é aumentada de metade se o crime for cometido mediante concurso de 2 (duas) ou mais pessoas.", "fonte": "Lei 7.716/1989, art. 2º-A (incluído pela Lei 14.532/2023, art. 1º); Código Penal, art. 140, § 3º (redação da Lei 14.532/2023, art. 2º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm"}, {"id": "rac-02", "materia": "Conhecimentos Específicos", "tema": "Injúria racial", "enunciado": "Considere as afirmações abaixo sobre os dispositivos que a Lei nº 14.532/2023 incluiu na Lei nº 7.716/1989. Quais estão corretas?", "itens": ["I – Os crimes previstos nos arts. 2º-A e 20 da Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando praticados por funcionário público, no exercício de suas funções ou a pretexto de exercê-las.", "II – Os crimes previstos na Lei nº 7.716/1989 terão as penas aumentadas de 1/3 (um terço) até a metade quando ocorrerem em contexto ou com intuito de descontração, diversão ou recreação.", "III – Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três afirmações reproduzem os arts. 20-B (racismo praticado por funcionário público), 20-A (racismo “recreativo”) e 20-D (assistência à vítima). O candidato pode desconfiar da II por achar que piada afasta o crime, mas ela aumenta a pena.", "fundamento": "Art. 20-A. Os crimes previstos nesta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando ocorrerem em contexto ou com intuito de descontração, diversão ou recreação. Art. 20-B. Os crimes previstos nos arts. 2º-A e 20 desta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando praticados por funcionário público [...], no exercício de suas funções ou a pretexto de exercê-las. Art. 20-D. Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público.", "fonte": "Lei 7.716/1989, arts. 20-A, 20-B e 20-D (incluídos pela Lei 14.532/2023, art. 1º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm"}, {"id": "div-01", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Segundo o Guia ANS de Diversidade e Inclusão (2023), a diversidade não deve ser ______, mas sim promovida e efetivada. O Guia afirma ainda que a diversidade está ligada à ______, enquanto a inclusão é um passo além: garantir que todos tenham acesso às mesmas oportunidades de desenvolvimento e ______ profissional dentro da instituição. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["tolerada – representatividade – ascensão", "tolerada – produtividade – remuneração", "imposta – representatividade – ascensão", "apenas declarada – meritocracia – ascensão", "tolerada – representatividade – estabilidade"], "correta": 0, "explicacao": "O Guia diz que a diversidade não deve ser tolerada, mas promovida e efetivada. Para ele, diversidade se liga à representatividade, e inclusão é garantir a todos as mesmas oportunidades de desenvolvimento e ascensão profissional. As alternativas erradas trocam termos por palavras plausíveis do mundo do trabalho.", "fundamento": "O Guia afirma que a diversidade deve ser promovida e efetivada, não apenas tolerada (seção 1). Na seção 2, liga diversidade à representatividade e descreve a inclusão como um passo além: assegurar a todos as mesmas oportunidades de desenvolvimento e ascensão profissional na instituição.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 1 “Por que um Guia ANS de Diversidade e Inclusão?” (p. 7) e seção 2 “Contextualização” (p. 8)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "div-02", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Um assistente administrativo atende, na recepção de um hospital, pessoas com diferentes tipos de deficiência. De acordo com as orientações do Guia ANS de Diversidade e Inclusão (2023), assinale a alternativa correta.", "alternativas": ["Se a pessoa surda estiver acompanhada, a fala deve ser dirigida ao acompanhante, para agilizar o atendimento.", "Ao guiar uma pessoa com deficiência visual, deve-se segurá-la firmemente pelo braço ou pela bengala e conduzi-la à frente.", "Ao conduzir uma pessoa em cadeira de rodas, deve-se perguntar antes como proceder, pois há pessoas que se sentem mais seguras indo de frente ou de costas.", "Diante de uma pessoa cega acompanhada de cão-guia, recomenda-se fazer carinho no animal para tranquilizá-lo antes de orientar a pessoa.", "Na conversa com uma pessoa cega, devem-se evitar palavras como “ver” e “olhar”, que podem constrangê-la."], "correta": 2, "explicacao": "O Guia recomenda perguntar antes de conduzir a cadeira de rodas. Ele orienta a falar diretamente com a pessoa surda, oferecer o cotovelo sem agarrar o braço nem a bengala, não distrair o cão-guia com carinho e usar com naturalidade palavras como “ver” e “olhar”.", "fundamento": "Na seção 4.3, o Guia orienta: perguntar como conduzir a cadeira de rodas (de frente ou de costas); falar diretamente com a pessoa surda, não com o acompanhante; oferecer o cotovelo ao guiar pessoa cega, sem agarrá-la; não acariciar o cão-guia; usar “cego”, “ver” e “olhar” com naturalidade.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 4.3 “Pessoas com Deficiência – PcD”, deficiências física, auditiva e visual (p. 20–21)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "div-03", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Guia ANS de Diversidade e Inclusão (2023). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A nomenclatura adequada atualmente é “pessoa com deficiência” (PcD), estando superadas expressões como “pessoa portadora de deficiência” e “pessoa com necessidades especiais”.", "( ) Orientação sexual e opção sexual são expressões equivalentes, pois os desejos afetivos e sexuais decorrem de uma escolha pessoal.", "( ) O nome social, escolhido por pessoas trans e travestis de acordo com o gênero com que se identificam, deve ser respeitado pelos colegas, mas não é exigível das instituições.", "( ) O ageísmo, também chamado de etarismo ou idadismo, é a conduta discriminatória em razão da idade avançada das pessoas."], "alternativas": ["V – V – F – F", "V – F – F – V", "F – V – V – F", "V – F – V – V", "F – F – V – V"], "correta": 1, "explicacao": "O Guia afirma que orientação sexual não é opção, porque não se trata de escolha (2ª é falsa). Também diz que o nome social deve ser usado e acatado por todos, inclusive pelas instituições (3ª é falsa).", "fundamento": "O Guia considera superadas as expressões “portadora de deficiência” e “necessidades especiais” e recomenda “pessoa com deficiência” (PcD). Afirma que orientação sexual não é opção, que o nome social deve ser acatado por todos, inclusive instituições, e que ageísmo (etarismo, idadismo) é a discriminação pela idade avançada.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seções 4.2 “Gênero” (p. 16–17), 4.3 “Pessoas com Deficiência” (p. 19 e 22) e 4.5 “Ageísmo ou Etarismo” (p. 24)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf"}, {"id": "lgpd-01", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Um hospital registra no prontuário eletrônico o diagnóstico de um paciente identificado. De acordo com as definições da Lei nº 13.709/2018 (LGPD), a informação sobre a saúde desse paciente é classificada como", "alternativas": ["dado anonimizado, por estar protegida pelo sigilo médico.", "dado pessoal comum, pois a lei só considera sensíveis os dados sobre origem racial ou étnica e convicção religiosa.", "dado pessoal sensível.", "dado público, por constar de registro de instituição pública de saúde.", "banco de dados, categoria que dispensa a aplicação dos princípios da lei."], "correta": 2, "explicacao": "O art. 5º, II, inclui expressamente o “dado referente à saúde” entre os dados pessoais sensíveis. A pegadinha da alternativa B é restringir a lista; a de A é confundir sigilo com anonimização, que exige que o titular não possa ser identificado.", "fundamento": "“II - dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;”", "fonte": "Lei 13.709/2018, art. 5º, II (e III, para dado anonimizado)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-02", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Lei nº 13.709/2018 (LGPD).\n\nPara os fins da lei, ________ é a pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; ________ é a pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do ________.", "alternativas": ["controlador – operador – controlador", "operador – controlador – operador", "encarregado – operador – titular", "controlador – encarregado – titular", "titular – operador – controlador"], "correta": 0, "explicacao": "Quem decide sobre o tratamento é o controlador; quem executa o tratamento em nome do controlador é o operador. A banca costuma inverter esses dois papéis (alternativa B).", "fundamento": "“VI - controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; VII - operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador;”", "fonte": "Lei 13.709/2018, art. 5º, VI e VII", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-03", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Considere as definições abaixo, relacionadas aos princípios do art. 6º da Lei nº 13.709/2018 (LGPD), e indique se são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial.", "( ) Qualidade dos dados: limitação do tratamento ao mínimo necessário para a realização de suas finalidades.", "( ) Prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais.", "( ) Adequação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "Transparência e prevenção estão definidas corretamente. A segunda definição é a do princípio da necessidade, e a quarta é a do princípio da não discriminação; a pegadinha é trocar o nome do princípio mantendo a definição literal.", "fundamento": "Art. 6º: “III - necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades [...]; VI - transparência: [...]; VIII - prevenção: adoção de medidas para prevenir a ocorrência de danos [...]; IX - não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos;”", "fonte": "Lei 13.709/2018, art. 6º, II, III, V, VI, VIII e IX", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "lgpd-04", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Sobre o tratamento de dados pessoais sensíveis e os direitos do titular na Lei nº 13.709/2018 (LGPD), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – O tratamento de dados pessoais sensíveis pode ocorrer sem fornecimento de consentimento do titular quando for indispensável para a tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária.", "II – Quando o tratamento de dado sensível se basear no consentimento, basta um consentimento genérico, dispensada a indicação de finalidades específicas.", "III – O titular tem direito a obter do controlador, a qualquer momento e mediante requisição, a confirmação da existência de tratamento e o acesso aos dados."], "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 1, "explicacao": "I reproduz o art. 11, II, “f” (redação da Lei 13.853/2019) e III reproduz o art. 18, I e II. II está errada: para dado sensível, o consentimento deve ser dado de forma específica e destacada, para finalidades específicas.", "fundamento": "Art. 11: “I - quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas; II - sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para: [...] f) tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária”. Art. 18, I e II: confirmação da existência de tratamento; acesso aos dados.", "fonte": "Lei 13.709/2018, art. 11, I e II, “f” (redação da Lei 13.853/2019); art. 18, caput, I e II", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"}, {"id": "eti-01", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "De acordo com o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), a pena aplicável ao servidor público pela Comissão de Ética é a de", "alternativas": ["advertência, com fundamentação em parecer assinado pelo presidente da Comissão.", "suspensão, com ciência do faltoso.", "demissão, após rito sumário com recurso ao Ministro de Estado.", "censura, cuja fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.", "censura, cuja fundamentação constará de parecer assinado apenas pelo relator, dispensada a ciência do faltoso."], "correta": 3, "explicacao": "O inciso XXII prevê a censura, com parecer assinado por todos os integrantes e ciência do faltoso. A alternativa E acerta a pena, mas troca quem assina e dispensa a ciência; advertência, suspensão e demissão não são penas da Comissão de Ética.", "fundamento": "“XXII - A pena aplicável ao servidor público pela Comissão de Ética é a de censura e sua fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo II, inciso XXII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-02", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Considerando as Regras Deontológicas do Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), assinale a alternativa INCORRETA.", "alternativas": ["Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral.", "Toda ausência injustificada do servidor de seu local de trabalho é fator de desmoralização do serviço público.", "A publicidade dos atos administrativos pode ser omitida sempre que o servidor a julgar inconveniente para a chefia, sem que isso configure comprometimento ético.", "Os fatos e atos verificados na conduta do dia a dia na vida privada do servidor poderão acrescer ou diminuir o seu bom conceito na vida funcional.", "Toda pessoa tem direito à verdade, e o servidor não pode omiti-la ou falseá-la, ainda que contrária aos interesses da própria Administração Pública."], "correta": 2, "explicacao": "Pelo inciso VII, a publicidade é requisito de eficácia e moralidade, ressalvados apenas segurança nacional, investigações policiais ou interesse superior do Estado em processo previamente declarado sigiloso; sua omissão gera comprometimento ético. As demais alternativas reproduzem os incisos IX, XII, VI e VIII.", "fundamento": "“VII - Salvo os casos de segurança nacional, investigações policiais ou interesse superior do Estado e da Administração Pública, a serem preservados em processo previamente declarado sigiloso, nos termos da lei, a publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade, ensejando sua omissão comprometimento ético contra o bem comum, imputável a quem a negar.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo I, Seção I, incisos VI, VII, VIII, IX e XII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-03", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre os deveres e as vedações previstos no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – É vedado ao servidor público apresentar-se embriagado no serviço ou fora dele habitualmente.", "II – É dever do servidor resistir às pressões de superiores hierárquicos que visem obter vantagens indevidas, mas não lhe cabe denunciá-las, em respeito à hierarquia.", "III – É vedado ao servidor retirar da repartição pública qualquer documento, livro ou bem pertencente ao patrimônio público, ainda que esteja legalmente autorizado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 0, "explicacao": "I reproduz a alínea “n” do inciso XV. II está errada porque a alínea “i” do inciso XIV manda resistir às pressões “e denunciá-las”. III está errada porque a vedação é retirar bens “sem estar legalmente autorizado”.", "fundamento": "XIV, i) “resistir a todas as pressões de superiores hierárquicos, de contratantes, interessados e outros que visem obter quaisquer favores, benesses ou vantagens indevidas [...] e denunciá-las”; XV, l) “retirar da repartição pública, sem estar legalmente autorizado, qualquer documento, livro ou bem pertencente ao patrimônio público”; XV, n) “apresentar-se embriagado no serviço ou fora dele habitualmente”.", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alínea i; inciso XV, alíneas l e n", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "eti-04", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Com base no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É dever fundamental do servidor ser assíduo e frequente ao serviço, na certeza de que sua ausência provoca danos ao trabalho ordenado.", "( ) Para fins de apuração do comprometimento ético, só se considera servidor público quem presta serviços de natureza permanente e mediante retribuição financeira.", "( ) É dever fundamental do servidor apresentar-se ao trabalho com vestimentas adequadas ao exercício da função.", "( ) É dever fundamental do servidor divulgar e informar a todos os integrantes da sua classe sobre a existência do Código de Ética, estimulando o seu integral cumprimento."], "alternativas": ["V – V – V – V", "F – F – V – V", "V – F – F – V", "V – V – F – F", "V – F – V – V"], "correta": 4, "explicacao": "O primeiro, o terceiro e o quarto itens reproduzem as alíneas “l”, “p” e “v” do inciso XIV. O segundo é falso: o inciso XXIV abrange serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira.", "fundamento": "“XXIV - Para fins de apuração do comprometimento ético, entende-se por servidor público todo aquele que, por força de lei, contrato ou de qualquer ato jurídico, preste serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira [...]”", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alíneas l, p e v; inciso XXIV", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm"}, {"id": "nr32-01", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Para fins de aplicação da Norma Regulamentadora nº 32 (Segurança e Saúde no Trabalho em Serviços de Saúde), entende-se por serviços de saúde", "alternativas": ["apenas os hospitais e as clínicas que mantenham regime de internação.", "qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.", "somente os estabelecimentos de alta complexidade, como hospitais universitários e de referência.", "as edificações de saúde que mantenham trabalhadores expostos a radiações ionizantes.", "qualquer edificação destinada à prestação de assistência à saúde da população, excluídas as atividades de pesquisa e ensino."], "correta": 1, "explicacao": "O item 32.1.2 adota conceito amplo, que inclui pesquisa e ensino e vale para qualquer nível de complexidade. A alternativa E é a pegadinha: copia o início do texto, mas exclui justamente pesquisa e ensino.", "fundamento": "“32.1.2 Para fins de aplicação desta NR entende-se por serviços de saúde qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.”", "fonte": "NR-32, item 32.1.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-02", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Segundo a NR-32, entre as medidas de proteção contra riscos biológicos, o empregador deve vedar:\n\nQuais estão corretas?", "itens": ["I – o consumo de alimentos e bebidas nos postos de trabalho.", "II – o uso de adornos e o manuseio de lentes de contato nos postos de trabalho.", "III – o uso de calçados fechados."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II estão no item 32.2.4.5, alíneas “c” e “b”. III troca uma palavra: o que deve ser vedado é o uso de calçados abertos.", "fundamento": "“32.2.4.5 O empregador deve vedar: a) a utilização de pias de trabalho para fins diversos dos previstos; b) o ato de fumar, o uso de adornos e o manuseio de lentes de contato nos postos de trabalho; c) o consumo de alimentos e bebidas nos postos de trabalho; d) a guarda de alimentos em locais não destinados para este fim; e) o uso de calçados abertos.”", "fonte": "NR-32, item 32.2.4.5", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-03", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a NR-32.\n\nOs trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu ________. São vedados o ________ e a desconexão manual de agulhas. Para os recipientes destinados à coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado ________ abaixo do bocal.", "alternativas": ["armazenamento – descarte – 2 cm", "descarte – transporte – 10 cm", "descarte – reencape – 5 cm", "reencape – descarte – 5 cm", "transporte – reencape – 10 cm"], "correta": 2, "explicacao": "Quem usa o perfurocortante é responsável pelo descarte (32.2.4.14), o reencape é vedado (32.2.4.15) e o limite de enchimento do coletor fica 5 cm abaixo do bocal (32.5.3.2). A alternativa D usa os mesmos termos em ordem invertida.", "fundamento": "“32.2.4.14 Os trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu descarte. 32.2.4.15 São vedados o reencape e a desconexão manual de agulhas.” “32.5.3.2 Para os recipientes destinados a coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado 5 cm abaixo do bocal.”", "fonte": "NR-32, itens 32.2.4.14, 32.2.4.15 e 32.5.3.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "nr32-04", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Com base na NR-32, indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A todo trabalhador dos serviços de saúde deve ser fornecido, gratuitamente, programa de imunização ativa contra tétano, difteria, hepatite B e os estabelecidos no PCMSO.", "( ) O uso de luvas descartáveis substitui o processo de lavagem das mãos.", "( ) A vacinação deve ser registrada no prontuário clínico individual do trabalhador, previsto na NR-07.", "( ) A vestimenta de trabalho deve ser fornecida pelo empregador, podendo seu custo ser descontado do salário do empregado."], "alternativas": ["V – F – V – F", "V – V – V – F", "F – F – V – V", "V – F – F – V", "F – V – F – V"], "correta": 0, "explicacao": "O primeiro e o terceiro itens reproduzem os itens 32.2.4.17.1 e 32.2.4.17.6. O uso de luvas não substitui a lavagem das mãos (32.2.4.3.2), e a vestimenta deve ser fornecida sem ônus para o empregado (32.2.4.6.1).", "fundamento": "“32.2.4.3.2 O uso de luvas não substitui o processo de lavagem das mãos, o que deve ocorrer, no mínimo, antes e depois do uso das mesmas.” “32.2.4.6.1 A vestimenta deve ser fornecida sem ônus para o empregado.” “32.2.4.17.6 A vacinação deve ser registrada no prontuário clínico individual do trabalhador, previsto na NR-07.”", "fonte": "NR-32, itens 32.2.4.3.2, 32.2.4.6.1, 32.2.4.17.1 e 32.2.4.17.6", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf"}, {"id": "seg-01", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "De acordo com as definições da Resolução RDC Anvisa nº 36/2013, evento adverso é", "alternativas": ["o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde.", "o comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo, incluindo doenças, lesão, sofrimento, morte, incapacidade ou disfunção.", "qualquer incidente notificado ao Núcleo de Segurança do Paciente, com ou sem dano.", "a redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde.", "o incidente que resulta em dano à saúde."], "correta": 4, "explicacao": "Evento adverso é o incidente que resulta em dano (art. 3º, IV). As alternativas A, B e D trazem, respectivamente, as definições de incidente, dano e segurança do paciente; C inventa um critério baseado na notificação.", "fundamento": "Art. 3º: “III - dano: comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo [...]; IV - evento adverso: incidente que resulta em dano à saúde; [...] VII - incidente: evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde; [...] X - segurança do paciente: redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde;”", "fonte": "RDC Anvisa 36/2013, art. 3º, III, IV, VII e X", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-02", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Resolução RDC Anvisa nº 36/2013.\n\nA notificação dos eventos adversos deve ser realizada ________ pelo NSP, até o ________ dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Os eventos adversos que evoluírem para óbito devem ser notificados em até ________ a partir do ocorrido.", "alternativas": ["semanalmente – 5º – 24 horas", "mensalmente – 15º – 72 horas", "mensalmente – 10º – 48 horas", "trimestralmente – 15º – 72 horas", "mensalmente – 15º – 7 dias"], "correta": 1, "explicacao": "O art. 10 fixa notificação mensal, até o 15º dia útil do mês seguinte, e prazo de 72 horas para eventos que evoluíram para óbito. As alternativas D e E acertam dois termos e trocam um.", "fundamento": "“Art. 10 A notificação dos eventos adversos, para fins desta Resolução, deve ser realizada mensalmente pelo NSP, até o 15º (décimo quinto) dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Parágrafo único - Os eventos adversos que evoluírem para óbito devem ser notificados em até 72 (setenta e duas) horas a partir do ocorrido.”", "fonte": "RDC Anvisa 36/2013, art. 10 e parágrafo único", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-03", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Sobre o Núcleo de Segurança do Paciente (NSP) e a abrangência da Resolução RDC Anvisa nº 36/2013, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – A direção do serviço de saúde deve constituir o NSP e nomear a sua composição, podendo utilizar a estrutura de comitês, comissões, gerências, coordenações ou núcleos já existentes para o desempenho de suas atribuições.", "II – A Resolução aplica-se também aos consultórios individualizados e aos laboratórios clínicos.", "III – Compete ao NSP notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I reproduz o art. 4º e seu § 1º; III reproduz o art. 7º, XI. II é falsa: o parágrafo único do art. 2º exclui do escopo os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar.", "fundamento": "“Art. 2º [...] Parágrafo único. Excluem-se do escopo desta Resolução os consultórios individualizados, laboratórios clínicos e os serviços móveis e de atenção domiciliar.” “Art. 7º Compete ao NSP: [...] XI - notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde;”", "fonte": "RDC Anvisa 36/2013, art. 2º, parágrafo único; art. 4º, caput e § 1º; art. 7º, XI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html"}, {"id": "seg-04", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Com base na Portaria GM/MS nº 529/2013, que institui o Programa Nacional de Segurança do Paciente (PNSP), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A cultura de segurança prioriza a segurança acima de metas financeiras e operacionais.", "( ) A cultura de segurança encoraja e recompensa a identificação, a notificação e a resolução dos problemas relacionados à segurança.", "( ) Uma das estratégias de implementação do PNSP é a promoção da cultura de segurança com ênfase nos processos de responsabilização individual dos profissionais.", "( ) Incidente é o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário ao paciente."], "alternativas": ["V – F – F – V", "F – V – F – V", "V – V – F – V", "V – V – V – F", "V – V – V – V"], "correta": 2, "explicacao": "O primeiro e o segundo itens são características da cultura de segurança (art. 4º, V, “b” e “c”), e o quarto é a definição de incidente (art. 4º, III). O terceiro inverte o art. 5º, VI, que enfatiza sistemas seguros, “evitando-se” a responsabilização individual.", "fundamento": "Art. 5º: “VI - promoção da cultura de segurança com ênfase no aprendizado e aprimoramento organizacional, engajamento dos profissionais e dos pacientes na prevenção de incidentes, com ênfase em sistemas seguros, evitando-se os processos de responsabilização individual;”", "fonte": "Portaria GM/MS 529/2013, art. 4º, III e V, “b” e “c”; art. 5º, VI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html"}, {"id": "cnv-01", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Segundo Pelizzoli (2019), com base em Marshall Rosenberg, os quatro ingredientes principais da Comunicação Não-Violenta são", "alternativas": ["observações, sentimentos, necessidades e pedidos.", "observações, julgamentos, necessidades e ordens.", "avaliações, emoções, desejos e exigências.", "escuta, empatia, perdão e reconciliação.", "fatos, opiniões, estratégias e cobranças."], "correta": 0, "explicacao": "Os quatro componentes são observação, sentimento, necessidade e pedido. As alternativas erradas trocam componentes por aquilo que a CNV distingue deles: julgamento em vez de observação, ordem ou exigência em vez de pedido.", "fundamento": "Paráfrase: o texto apresenta observações (factuais, sem julgamento ou avaliação moral), sentimentos (sensações e emoções), necessidades (o que precisamos e desejamos) e pedidos (forma de demandar ações) como os quatro ingredientes principais da CNV.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 38", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf"}, {"id": "cnv-02", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Um assistente administrativo quer pedir a um colega que pare de deixar processos espalhados sobre a sua mesa. Segundo Pelizzoli (2019), na CNV o pedido deve ser positivo e específico, e não se confunde com um desejo. Assinale a fala que melhor corresponde a essa orientação.", "alternativas": ["“Não quero mais que você deixe papéis na minha mesa.”", "“Preciso da sua ajuda com a organização do setor.”", "“Eu gostaria tanto que você fosse mais organizado...”", "“Preciso que, a partir de hoje, você coloque os processos na bandeja de entrada do setor.”", "“Você é desorganizado e sempre atrapalha o meu trabalho.”"], "correta": 3, "explicacao": "A alternativa D diz o que se quer (positivo) e qual ação concreta (específico). A é pedido negativo, B é genérico, C expressa desejo e E é julgamento moralizador, que a CNV recomenda evitar.", "fundamento": "Paráfrase: o autor contrapõe “não quero que você fale alto” (pedido negativo) a “preciso de silêncio” (positivo), “preciso de sua ajuda” (genérico) a um pedido específico, e distingue desejo (“eu gostaria”) de pedido.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 28-29", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf"}, {"id": "mat-01", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "O almoxarifado de um hospital adota o sistema de reposição contínua para caixas de luvas de procedimento. O consumo médio é de 120 caixas por mês, o tempo de reposição é de 15 dias e o estoque de segurança foi fixado em 40 caixas. Considerando o mês com 30 dias e a fórmula PP = (C × TR) + ES, o ponto de pedido é de", "alternativas": ["60 caixas.", "100 caixas.", "140 caixas.", "160 caixas.", "1.840 caixas."], "correta": 1, "explicacao": "TR = 15/30 = 0,5 mês; PP = 120 × 0,5 + 40 = 100 caixas. A alternativa A esquece o estoque de segurança, D ignora o tempo de reposição e E usa o tempo em dias sem converter para meses.", "fundamento": "Paráfrase de Fenili: ponto de pedido é a quantidade em estoque que, quando atingida, deve provocar novo pedido de compra, cobrindo o consumo durante o tempo de reposição; PP = (C × TR) + ES, sendo ES o estoque mínimo ou de segurança.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 50 (Quadro 8) e p. 53 (Atividade 2)", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-02", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre a classificação ABC de estoques, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – Os itens da classe A são os de maior valor de demanda e, segundo Fenili, correspondem aproximadamente a 80% do valor de demanda e a 20% da quantidade de itens em estoque.", "II – Os percentuais que delimitam as classes A, B e C são aproximados, e não fixos.", "III – Segundo Kummer, em um hospital, o critério de importância pode deixar de ser o valor financeiro e passar a ser o impacto do medicamento para a saúde humana."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "Fenili apresenta a proporção aproximada de 80% do valor para 20% dos itens na classe A e ressalva que os percentuais não são fixos; Kummer afirma não haver regras fixas e cita o hospital como caso em que o valor pode ser substituído pelo impacto do remédio na saúde. Todas as afirmações estão corretas.", "fundamento": "Paráfrase: Fenili (Tabela 1) dá percentuais “aproximados (e não fixos)”: A ≈ 80% do valor e 20% dos itens; B ≈ 15% e 30%; C ≈ 5% e 50%. Kummer diz que, num hospital, o valor pode ser trocado pelo impacto do medicamento na saúde humana.", "fonte": "FENILI, Gestão de materiais (ENAP, 2015), p. 32, Tabela 1; KUMMER, Gestão de estoques (IFPR, 2012), p. 80-81", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-03", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre recebimento de materiais e inventário físico, conforme Fenili (2015), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) No recebimento provisório, o recebedor assina o documento fiscal que acompanha o material apenas para fins de comprovação da data de entrega.", "( ) A conferência qualitativa verifica se a quantidade declarada pelo fornecedor na nota fiscal corresponde àquela efetivamente entregue.", "( ) O recebimento definitivo corresponde à aceitação do material, com sua entrada no estoque e a liberação do pagamento ao fornecedor.", "( ) No inventário rotativo, todos os itens são contados de uma só vez, o que exige a paralisação das atividades da organização."], "alternativas": ["V – V – V – F", "F – F – V – V", "V – F – V – F", "V – F – F – V", "F – V – V – F"], "correta": 2, "explicacao": "O segundo item descreve a conferência quantitativa; a qualitativa verifica as especificações técnicas. O quarto descreve o inventário periódico: o rotativo é contínuo e seletivo e tem a vantagem de não paralisar as atividades.", "fundamento": "Paráfrase de Fenili: no recebimento provisório o recebedor assina a nota só para comprovar a data de entrega; a conferência quantitativa compara quantidades e a qualitativa, especificações; a aceitação (entrada no estoque e liberação do pagamento) é o recebimento definitivo. O inventário rotativo é contínuo e não paralisa a organização.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 129 (Quadro 23) e p. 148", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}, {"id": "mat-04", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Um almoxarifado registrou as seguintes movimentações de um item, partindo de saldo zero: no dia 3, entrada de 400 unidades a R$ 5,00 cada; no dia 10, entrada de 200 unidades a R$ 8,00 cada; no dia 20, saída de 500 unidades. Avaliando o estoque pelo método PEPS (primeiro a entrar, primeiro a sair), o valor total da saída do dia 20 e o valor do saldo remanescente são, respectivamente,", "alternativas": ["R$ 2.800,00 e R$ 800,00.", "R$ 3.000,00 e R$ 600,00.", "R$ 3.100,00 e R$ 500,00.", "R$ 2.500,00 e R$ 1.100,00.", "R$ 2.800,00 e R$ 1.600,00."], "correta": 0, "explicacao": "No PEPS, a saída usa primeiro o preço das entradas mais antigas: 400 × R$ 5,00 + 100 × R$ 8,00 = R$ 2.800,00, e sobram 100 unidades a R$ 8,00 = R$ 800,00 (o estoque total valia R$ 3.600,00). B corresponde ao custo médio (R$ 6,00) e C ao UEPS.", "fundamento": "Paráfrase de Fenili: no PEPS/FIFO a saída é valorada pelo preço das entradas mais remotas; se a saída superar a quantidade do lote mais antigo, o excedente recebe o preço da entrada seguinte (exemplo das 700 unidades, p. 73).", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 72-73 (item 7.2, Tabela 16); KUMMER, Gestão de estoques (IFPR, 2012), p. 59", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content"}]</script>
<script>
(function () {
  const Q = JSON.parse(document.getElementById('questoes').textContent);
  const BYID = Object.fromEntries(Q.map(q => [q.id, q]));
  const MATERIAS = ['Português', 'Informática', 'Raciocínio Lógico', 'Conhecimentos Específicos'];
  // Composição da prova escrita do PS 32, item 13 do Edital 04/2026.
  const OFICIAL = { 'Português': 5, 'Informática': 5, 'Raciocínio Lógico': 5, 'Conhecimentos Específicos': 25 };
  const L = 'ABCDE';
  const KEY = 'hcpa-ps32-v1';
  // Gabaritos após recursos publicados pela FAURGS; '*' marca questão anulada (ponto para todos).
  const PROVAS = {
    p2023: {
      titulo: 'Prova de 2023', sub: 'HCPA · Edital 02/2023 · PS 07 · Assistente Administrativo II',
      url: 'https://portalfaurgs.com.br/LerArquivo/5e230bea-c692-4a4a-8112-12c0e8fd2a4f',
      gab: 'DCECDBAAEDCBABAECECBDABDCABBDDBDACDADEBC',
      blocos: [['Português', 1, 15], ['Matemática', 16, 20], ['Raciocínio Lógico', 21, 26], ['Conhecimentos Específicos', 27, 40]],
      nota: 'Os específicos (27 a 40) cobram SUS, LGPD, NR-32, HumanizaSUS, ética do servidor e segurança do paciente, que também estão no edital deste ano.'
    },
    p2015: {
      titulo: 'Prova de 2015', sub: 'HCPA · Edital 04/2015 · PS 34 · Assistente Administrativo II',
      url: 'https://www.estudegratis.com.br/images/provas/35801-faurgs-2015-hcpa-assistente-administrativo-ii-prova.pdf',
      gab: 'CDBEBDACADCBEE*BABCDBEADEEADCCBCBDACDEAABCDEABD*DB',
      blocos: [['Português', 1, 15], ['Matemática e Raciocínio Lógico', 16, 25], ['Conhecimentos Específicos', 26, 50]],
      nota: 'Mais antiga: parte dos específicos é sobre atendimento ao público, que saiu do edital. SUS, HumanizaSUS, NR-32 e segurança do paciente continuam.'
    }
  };
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const navIn = document.getElementById('nav-in');

  let store = { res: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.res) store = s; } catch (e) {}
  function salvar() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function registrar(id, ok) {
    const r = store.res[id] || { n: 0, acertos: 0 };
    r.n += 1; if (ok) r.acertos += 1; r.ok = ok;
    store.res[id] = r; salvar();
  }

  let S = null;       // sessão em andamento
  let confirmar = null; // { msg, sim, rotuloSim }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function idsDa(materia) { return Q.filter(q => q.materia === materia).map(q => q.id); }

  function temas() {
    const m = new Map();
    for (const q of Q) {
      const k = q.materia + '|' + q.tema;
      if (!m.has(k)) m.set(k, { materia: q.materia, tema: q.tema, ids: [] });
      m.get(k).ids.push(q.id);
    }
    return [...m.values()].sort((a, b) => MATERIAS.indexOf(a.materia) - MATERIAS.indexOf(b.materia));
  }

  function diasAteProva() {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    return Math.round((new Date(2026, 11, 13) - hoje) / 86400000);
  }

  // ---------- Início ----------
  function inicio() {
    S = null; F = null; confirmar = null;
    const resp = Object.keys(store.res).filter(id => BYID[id]);
    const certas = resp.filter(id => store.res[id].ok).length;
    const erros = resp.filter(id => !store.res[id].ok);
    const d = diasAteProva();
    const contagem = d > 1 ? `<span class="dias">${d}</span><span class="rot">dias até a prova escrita, domingo, 13 de dezembro</span>`
      : d === 1 ? `<span class="dias">1</span><span class="rot">dia até a prova escrita. Amanhã!</span>`
      : d === 0 ? `<span class="dias">Hoje</span><span class="rot">é dia de prova. Boa sorte!</span>`
      : `<span class="rot">A prova escrita foi em 13 de dezembro de 2026.</span>`;
    const temOficial = MATERIAS.every(m => idsDa(m).length >= OFICIAL[m]);

    let grupos = '';
    for (const mat of MATERIAS) {
      const ts = temas().filter(t => t.materia === mat);
      if (!ts.length) continue;
      grupos += `<div class="grupo"><h3>${esc(mat)}</h3><div class="temas">` + ts.map(t => {
        const feitas = t.ids.filter(id => store.res[id]);
        const ok = feitas.filter(id => store.res[id].ok).length;
        const pOk = 100 * ok / t.ids.length, pErr = 100 * (feitas.length - ok) / t.ids.length;
        const label = feitas.length ? `${ok}/${feitas.length} certas` : `${t.ids.length} questões`;
        return `<button class="tema" data-act="tema" data-tema="${esc(t.materia + '|' + t.tema)}">
          <span class="nome">${esc(t.tema)}</span><span class="qtd">${label}</span>
          <span class="barra" aria-hidden="true"><i style="width:${pOk}%"></i><i class="e" style="width:${pErr}%"></i></span>
        </button>`;
      }).join('') + `</div></div>`;
    }

    view.innerHTML = `
      <header class="topo">
        <div class="faixa"><span>Caderno de treino</span><span>Edital 04/2026</span><span>PS 32 · Assistente Administrativo II</span></div>
        <h1>Simulado HCPA</h1>
        <div class="contagem">${contagem}</div>
      </header>
      <div class="stats" role="list">
        <div role="listitem"><b>${Q.length}</b><span>questões no banco</span></div>
        <div role="listitem"><b>${resp.length}</b><span>já respondidas</span></div>
        <div role="listitem"><b>${resp.length ? Math.round(100 * certas / resp.length) + '%' : '–'}</b><span>de acerto</span></div>
      </div>
      <div class="acoes">
        <button class="btn prim" data-act="simulado" ${temOficial ? '' : 'disabled'}>
          <span>Simulado de 40 questões<small>5 Português · 5 Informática · 5 Raciocínio Lógico · 25 Específicos, como na prova. Correção no final.</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="rapida">
          <span>Rodada rápida<small>10 questões sorteadas, com a correção na hora</small></span><span class="seta">→</span>
        </button>
        <button class="btn" data-act="erros" ${erros.length ? '' : 'disabled'}>
          <span>Refazer as que errei<small>${erros.length ? erros.length + (erros.length === 1 ? ' questão' : ' questões') + ' com erro na última tentativa' : 'Nenhum erro guardado ainda'}</small></span><span class="seta">→</span>
        </button>
      </div>
      <section class="grupo" aria-labelledby="t-provas">
        <h2 id="t-provas">Provas reais da FAURGS</h2>
        <p class="nota">Questões de verdade da banca, de concursos anteriores do HCPA para o mesmo cargo. Você resolve no PDF e marca as respostas aqui. A página corrige pelo gabarito oficial.</p>
      </section>
      <div class="provas">${Object.entries(PROVAS).map(([pid, p]) => {
        const f = (store.folhas || {})[pid];
        const ult = f && f.corrigida ? `<p class="nota">Última correção: ${contarFolha(pid, f.marcas).acertos} de ${p.gab.length}</p>` : f && Object.keys(f.marcas || {}).length ? `<p class="nota">${Object.keys(f.marcas).length} respostas marcadas, falta corrigir</p>` : '';
        return `<div class="prova-card">
          <span class="sub">${esc(p.sub)}</span>
          <h3>${esc(p.titulo)} · ${p.gab.length} questões</h3>
          <p class="nota">${esc(p.nota)}</p>
          ${ult}
          <div class="botoes">
            <a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir a prova (PDF)</a>
            <button class="mini prim" data-act="folha" data-p="${pid}">Marcar respostas</button>
          </div>
        </div>`;
      }).join('')}</div>
      <section class="grupo" aria-labelledby="t-temas">
        <h2 id="t-temas">Treinar por assunto</h2>
        <p class="nota">Os assuntos são os do conteúdo da prova escrita no edital. A barra mostra acertos (verde) e erros (vermelho) da última tentativa.</p>
      </section>
      ${grupos}
      <details class="material">
        <summary>Material oficial para estudar</summary>
        <ul>
          <li><a href="https://portalfaurgs.com.br/LerArquivo/19c9cb82-a209-4830-8cd8-24e43fc55b45" target="_blank" rel="noopener">Edital 04/2026 completo (FAURGS)</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/Leis/L8080.htm" target="_blank" rel="noopener">Lei 8.080/1990 (SUS)</a></li>
          <li><a href="https://redehumanizasus.net/acervo/humanizasus-documento-base-para-gestores-e-trabalhadores-do-sus-ministerio-da-saude-secretaria-de-atenc%CC%A7a%CC%83o-a-saude-nucleo-tecnico-da-politica/" target="_blank" rel="noopener">HumanizaSUS: documento base</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/publicacoes/cartas_direitos_usuarios_saude_3ed.pdf" target="_blank" rel="noopener">Carta dos Direitos dos Usuários da Saúde</a></li>
          <li><a href="https://www.hcpa.edu.br/downloads/carta_direitos_e_deveres_pacientes_completa.pdf" target="_blank" rel="noopener">Carta de direitos e deveres do paciente do HCPA</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/Leis/L8069.htm" target="_blank" rel="noopener">ECA, Lei 8.069/1990</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/leis/2003/l10.741.htm" target="_blank" rel="noopener">Estatuto da Pessoa Idosa, Lei 10.741/2003</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13146.htm" target="_blank" rel="noopener">Lei Brasileira de Inclusão, Lei 13.146/2015</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm" target="_blank" rel="noopener">Injúria racial, Lei 14.532/2023</a></li>
          <li><a href="https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf" target="_blank" rel="noopener">Guia ANS de Diversidade e Inclusão</a></li>
          <li><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm" target="_blank" rel="noopener">LGPD, Lei 13.709/2018</a></li>
          <li><a href="http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm" target="_blank" rel="noopener">Código de Ética do servidor, Decreto 1.171/1994</a></li>
          <li><a href="https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf" target="_blank" rel="noopener">NR-32</a></li>
          <li><a href="https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html" target="_blank" rel="noopener">RDC 36/2013 (segurança do paciente)</a> e <a href="https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html" target="_blank" rel="noopener">Portaria 529/2013</a></li>
          <li><a href="https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content" target="_blank" rel="noopener">Gestão de materiais (Fenili, ENAP)</a> e <a href="https://efivest.com.br/wp-content/uploads/2018/09/gestaodeestoques.pdf" target="_blank" rel="noopener">Gestão de estoques (Kummer)</a></li>
          <li><a href="https://cartilha.cert.br/" target="_blank" rel="noopener">Cartilha de Segurança para Internet (cert.br)</a></li>
        </ul>
      </details>
      <p class="nota">As questões de "Treinar por assunto" e dos simulados foram escritas a partir das leis e documentos que o edital indica. Não são questões da FAURGS. Cada resposta mostra o artigo ou trecho de onde saiu, para conferir. As questões da banca são as das provas reais acima.</p>
      <div class="linha-acoes">
        <p class="nota">Seu progresso fica salvo só neste aparelho.</p>
        ${resp.length ? (confirmarZerar
          ? `<span class="nota">Apagar todo o progresso?</span><button class="link-btn" data-act="zerar-sim">Sim, apagar</button><button class="link-btn" data-act="zerar-nao">Cancelar</button>`
          : `<button class="link-btn" data-act="zerar">Zerar progresso</button>`) : ''}
      </div>`;
    nav.hidden = true;
  }
  let confirmarZerar = false;

  // ---------- Sessões ----------
  function iniciar(modo, titulo, ids) {
    confirmarZerar = false;
    S = { modo, titulo, ids, i: 0, resp: {}, entregue: false };
    confirmar = null;
    questao();
  }
  function montarSimulado() {
    let ids = [];
    for (const m of MATERIAS) {
      let sorteadas = embaralhar(idsDa(m)).slice(0, OFICIAL[m]);
      // Questões de Português que dividem o mesmo texto ficam juntas.
      if (m === 'Português') sorteadas.sort((a, b) => (BYID[b].texto ? 1 : 0) - (BYID[a].texto ? 1 : 0));
      ids = ids.concat(sorteadas);
    }
    return ids;
  }

  // ---------- Questão ----------
  function questao() {
    const id = S.ids[S.i], q = BYID[id];
    const simuladoAberto = S.modo === 'simulado' && !S.entregue;
    const escolhida = S.resp[id];
    const revelado = !simuladoAberto && (escolhida != null || S.entregue);

    const opcoes = q.alternativas.map((a, k) => {
      let cls = 'opt';
      if (revelado) cls += k === q.correta ? ' certa' : k === escolhida ? ' errada' : ' apagada';
      else if (k === escolhida) cls += ' marcada';
      const estado = revelado ? (k === q.correta ? ' (resposta certa)' : k === escolhida ? ' (sua resposta)' : '') : (k === escolhida ? ' (marcada)' : '');
      return `<button class="${cls}" data-act="marcar" data-k="${k}" ${revelado ? 'disabled' : ''} aria-label="Alternativa ${L[k]}${estado}"><span class="bolha" aria-hidden="true">${L[k]}</span><span class="txt">${esc(a)}</span></button>`;
    }).join('');

    let fb = '';
    if (revelado) {
      const ok = escolhida === q.correta;
      const ver = escolhida == null ? `Em branco. Resposta: letra ${L[q.correta]}` : ok ? 'Certa!' : `Errou. Resposta: letra ${L[q.correta]}`;
      fb = `<section class="feedback ${ok ? 'ok' : 'bad'}">
        <p class="veredito">${ver}</p>
        ${q.explicacao ? `<p>${esc(q.explicacao)}</p>` : ''}
        ${q.fundamento ? `<blockquote>${esc(q.fundamento)}</blockquote>` : ''}
        ${q.fonte ? `<p class="fonte">Fonte: ${esc(q.fonte)}${q.url ? ` · <a href="${esc(q.url)}" target="_blank" rel="noopener">abrir</a>` : ''}</p>` : ''}
      </section>`;
    }

    const pct = 100 * (S.i + 1) / S.ids.length;
    view.innerHTML = `
      <div class="barra-sup">
