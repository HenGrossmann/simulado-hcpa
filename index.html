em em contexto ou com intuito de descontração, diversão ou recreação.", "III – Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "As três afirmações reproduzem os arts. 20-B (racismo praticado por funcionário público), 20-A (racismo “recreativo”) e 20-D (assistência à vítima). O candidato pode desconfiar da II por achar que piada afasta o crime, mas ela aumenta a pena.", "fundamento": "Art. 20-A. Os crimes previstos nesta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando ocorrerem em contexto ou com intuito de descontração, diversão ou recreação. Art. 20-B. Os crimes previstos nos arts. 2º-A e 20 desta Lei terão as penas aumentadas de 1/3 (um terço) até a metade, quando praticados por funcionário público [...], no exercício de suas funções ou a pretexto de exercê-las. Art. 20-D. Em todos os atos processuais, cíveis e criminais, a vítima dos crimes de racismo deverá estar acompanhada de advogado ou defensor público.", "fonte": "Lei 7.716/1989, arts. 20-A, 20-B e 20-D (incluídos pela Lei 14.532/2023, art. 1º)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14532.htm", "regra": "Quando a questão disser que o racismo foi “de brincadeira” ou cometido por funcionário público, lembre que a pena AUMENTA de 1/3 até a metade.", "passos": [{"t": "I: é o art. 20-B. Funcionário público no exercício da função, ou a pretexto de exercê-la, tem pena aumentada de 1/3 até a metade. Correta."}, {"t": "II: é o art. 20-A, o racismo “recreativo”. Contexto de descontração, diversão ou recreação também aumenta a pena de 1/3 até a metade. Correta."}, {"t": "III: é o art. 20-D. Em todos os atos processuais, a vítima deve estar acompanhada de advogado ou defensor público. Correta."}], "resp": "Alternativa E", "pegadinha": "Dá vontade de cortar a II achando que piada afasta o crime. Pela lei, o contexto de brincadeira aumenta a pena.", "porque": {"A": "Essa deixa a II e a III de fora, mas as duas estão na lei: racismo “recreativo” aumenta a pena e a vítima deve ter advogado ou defensor.", "B": "Essa deixa a I e a III de fora, mas as duas estão na lei: funcionário público tem pena aumentada e a vítima deve ter advogado ou defensor.", "C": "Essa deixa a III de fora, mas ela está na lei (art. 20-D). Em todos os atos processuais, a vítima deve ter advogado ou defensor público.", "D": "Essa deixa a I de fora, mas ela está na lei (art. 20-B). Funcionário público no exercício da função tem pena aumentada de 1/3 até a metade."}}, {"id": "div-01", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Segundo o Guia ANS de Diversidade e Inclusão (2023), a diversidade não deve ser ______, mas sim promovida e efetivada. O Guia afirma ainda que a diversidade está ligada à ______, enquanto a inclusão é um passo além: garantir que todos tenham acesso às mesmas oportunidades de desenvolvimento e ______ profissional dentro da instituição. Assinale a alternativa que preenche corretamente as lacunas.", "alternativas": ["tolerada – representatividade – ascensão", "tolerada – produtividade – remuneração", "imposta – representatividade – ascensão", "apenas declarada – meritocracia – ascensão", "tolerada – representatividade – estabilidade"], "correta": 0, "explicacao": "O Guia diz que a diversidade não deve ser tolerada, mas promovida e efetivada. Para ele, diversidade se liga à representatividade, e inclusão é garantir a todos as mesmas oportunidades de desenvolvimento e ascensão profissional. As alternativas erradas trocam termos por palavras plausíveis do mundo do trabalho.", "fundamento": "O Guia afirma que a diversidade deve ser promovida e efetivada, não apenas tolerada (seção 1). Na seção 2, liga diversidade à representatividade e descreve a inclusão como um passo além: assegurar a todos as mesmas oportunidades de desenvolvimento e ascensão profissional na instituição.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 1 “Por que um Guia ANS de Diversidade e Inclusão?” (p. 7) e seção 2 “Contextualização” (p. 8)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf", "regra": "Quando a questão falar do Guia ANS de Diversidade e Inclusão, lembre: diversidade não é para ser tolerada, e sim promovida. Diversidade é representatividade; inclusão é oportunidade de desenvolvimento e ascensão.", "passos": [{"t": "1ª lacuna: o Guia diz que a diversidade não deve ser tolerada, mas promovida e efetivada."}, {"t": "2ª lacuna: diversidade está ligada à representatividade."}, {"t": "3ª lacuna: inclusão é garantir a todos as mesmas oportunidades de desenvolvimento e ascensão profissional."}, {"t": "Só A tem tolerada, representatividade e ascensão."}], "resp": "Alternativa A", "pegadinha": "E acerta as duas primeiras e troca ascensão por estabilidade. Parece plausível no mundo do trabalho, mas o Guia fala em ascensão profissional.", "porque": {"B": "Acerta “tolerada”, mas o Guia liga diversidade à representatividade, não à produtividade, e fala em ascensão profissional, não remuneração.", "C": "O Guia diz que a diversidade não deve ser tolerada, e não “imposta”. As outras duas lacunas estão certas.", "D": "O Guia diz que a diversidade não deve ser tolerada, e a liga à representatividade, não à meritocracia.", "E": "Acerta as duas primeiras, mas troca ascensão por estabilidade. O Guia fala em ascensão profissional."}}, {"id": "div-02", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Um assistente administrativo atende, na recepção de um hospital, pessoas com diferentes tipos de deficiência. De acordo com as orientações do Guia ANS de Diversidade e Inclusão (2023), assinale a alternativa correta.", "alternativas": ["Se a pessoa surda estiver acompanhada, a fala deve ser dirigida ao acompanhante, para agilizar o atendimento.", "Ao guiar uma pessoa com deficiência visual, deve-se segurá-la firmemente pelo braço ou pela bengala e conduzi-la à frente.", "Ao conduzir uma pessoa em cadeira de rodas, deve-se perguntar antes como proceder, pois há pessoas que se sentem mais seguras indo de frente ou de costas.", "Diante de uma pessoa cega acompanhada de cão-guia, recomenda-se fazer carinho no animal para tranquilizá-lo antes de orientar a pessoa.", "Na conversa com uma pessoa cega, devem-se evitar palavras como “ver” e “olhar”, que podem constrangê-la."], "correta": 2, "explicacao": "O Guia recomenda perguntar antes de conduzir a cadeira de rodas. Ele orienta a falar diretamente com a pessoa surda, oferecer o cotovelo sem agarrar o braço nem a bengala, não distrair o cão-guia com carinho e usar com naturalidade palavras como “ver” e “olhar”.", "fundamento": "Na seção 4.3, o Guia orienta: perguntar como conduzir a cadeira de rodas (de frente ou de costas); falar diretamente com a pessoa surda, não com o acompanhante; oferecer o cotovelo ao guiar pessoa cega, sem agarrá-la; não acariciar o cão-guia; usar “cego”, “ver” e “olhar” com naturalidade.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seção 4.3 “Pessoas com Deficiência – PcD”, deficiências física, auditiva e visual (p. 20–21)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf", "regra": "Quando for atender uma pessoa com deficiência, fale diretamente com ela e, antes de conduzir, pergunte como ela prefere.", "passos": [{"t": "A questão pede a conduta correta segundo o Guia ANS."}, {"t": "O Guia manda perguntar antes como conduzir a cadeira de rodas, de frente ou de costas. Por isso C está certa."}, {"t": "As outras contrariam o Guia. Fale direto com a pessoa surda, ofereça o cotovelo sem agarrar o braço nem a bengala e não faça carinho no cão-guia."}], "resp": "Alternativa C", "pegadinha": "E parece cuidadosa, mas o Guia orienta usar “ver” e “olhar” com naturalidade com a pessoa cega. Evitar essas palavras não é a recomendação.", "porque": {"A": "O Guia manda falar diretamente com a pessoa surda, não com o acompanhante.", "B": "O Guia manda oferecer o cotovelo ao guiar a pessoa cega, sem agarrar o braço nem a bengala.", "D": "O Guia orienta não acariciar o cão-guia.", "E": "O Guia orienta usar “ver” e “olhar” com naturalidade com a pessoa cega, sem evitar essas palavras."}}, {"id": "div-03", "materia": "Conhecimentos Específicos", "tema": "Diversidade e inclusão (Guia ANS)", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações abaixo, de acordo com o Guia ANS de Diversidade e Inclusão (2023). A sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A nomenclatura adequada atualmente é “pessoa com deficiência” (PcD), estando superadas expressões como “pessoa portadora de deficiência” e “pessoa com necessidades especiais”.", "( ) Orientação sexual e opção sexual são expressões equivalentes, pois os desejos afetivos e sexuais decorrem de uma escolha pessoal.", "( ) O nome social, escolhido por pessoas trans e travestis de acordo com o gênero com que se identificam, deve ser respeitado pelos colegas, mas não é exigível das instituições.", "( ) O ageísmo, também chamado de etarismo ou idadismo, é a conduta discriminatória em razão da idade avançada das pessoas."], "alternativas": ["V – V – F – F", "V – F – F – V", "F – V – V – F", "V – F – V – V", "F – F – V – V"], "correta": 1, "explicacao": "O Guia afirma que orientação sexual não é opção, porque não se trata de escolha (2ª é falsa). Também diz que o nome social deve ser usado e acatado por todos, inclusive pelas instituições (3ª é falsa).", "fundamento": "O Guia considera superadas as expressões “portadora de deficiência” e “necessidades especiais” e recomenda “pessoa com deficiência” (PcD). Afirma que orientação sexual não é opção, que o nome social deve ser acatado por todos, inclusive instituições, e que ageísmo (etarismo, idadismo) é a discriminação pela idade avançada.", "fonte": "Guia ANS de Diversidade e Inclusão (ANS, 2023), seções 4.2 “Gênero” (p. 16–17), 4.3 “Pessoas com Deficiência” (p. 19 e 22) e 4.5 “Ageísmo ou Etarismo” (p. 24)", "url": "https://sbafs.org.br/admin/files/docs/file_d8nLY3ei3qoX.pdf", "regra": "Quando a questão disser “opção sexual”, desconfie: o Guia fala em orientação sexual, porque não se trata de escolha.", "passos": [{"t": "1ª é V: o termo atual é “pessoa com deficiência” (PcD). “Portadora de deficiência” e “necessidades especiais” estão superadas."}, {"t": "2ª é F: orientação sexual não é opção, porque não é escolha."}, {"t": "3ª é F: o nome social deve ser acatado por todos, inclusive pelas instituições."}, {"t": "4ª é V: ageísmo, etarismo ou idadismo é a discriminação pela idade avançada."}], "resp": "Alternativa B (V, F, F, V)", "pegadinha": "D (V, F, V, V) erra só a 3ª. O nome social não depende só dos colegas: as instituições também devem acatá-lo.", "porque": {"A": "Essa diz que a 2ª é verdadeira, mas orientação sexual não é opção, porque não é escolha. E a 4ª é verdadeira: ageísmo é discriminação pela idade.", "C": "Essa marca a 1ª como falsa, mas “pessoa com deficiência” é mesmo o termo atual. E orientação sexual não é opção, então a 2ª é falsa.", "D": "Essa diz que a 3ª é verdadeira, mas o nome social deve ser acatado por todos, inclusive pelas instituições.", "E": "Essa marca a 1ª como falsa, mas “pessoa com deficiência” é o termo atual. E a 3ª é falsa: as instituições também devem acatar o nome social."}}, {"id": "lgpd-01", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Um hospital registra no prontuário eletrônico o diagnóstico de um paciente identificado. De acordo com as definições da Lei nº 13.709/2018 (LGPD), a informação sobre a saúde desse paciente é classificada como", "alternativas": ["dado anonimizado, por estar protegida pelo sigilo médico.", "dado pessoal comum, pois a lei só considera sensíveis os dados sobre origem racial ou étnica e convicção religiosa.", "dado pessoal sensível.", "dado público, por constar de registro de instituição pública de saúde.", "banco de dados, categoria que dispensa a aplicação dos princípios da lei."], "correta": 2, "explicacao": "O art. 5º, II, inclui expressamente o “dado referente à saúde” entre os dados pessoais sensíveis. A pegadinha da alternativa B é restringir a lista; a de A é confundir sigilo com anonimização, que exige que o titular não possa ser identificado.", "fundamento": "“II - dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;”", "fonte": "Lei 13.709/2018, art. 5º, II (e III, para dado anonimizado)", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm", "regra": "Quando a questão falar em dado de saúde de uma pessoa identificada, lembre que ele é dado pessoal sensível.", "passos": [{"t": "O trecho que decide: diagnóstico de um paciente identificado, ou seja, informação sobre a saúde de uma pessoa."}, {"t": "O art. 5º, II, da LGPD inclui expressamente o “dado referente à saúde” na lista de dados pessoais sensíveis."}, {"t": "Por isso a resposta é dado pessoal sensível."}], "resp": "Alternativa C", "pegadinha": "B encurta a lista de dados sensíveis, que é bem maior. A confunde sigilo com anonimização: dado anonimizado é aquele em que o titular não pode ser identificado, e aqui o paciente é identificado.", "porque": {"A": "Sigilo não é anonimização. Dado anonimizado é aquele em que o titular não pode ser identificado, e aqui o paciente é identificado.", "B": "A lista de dados sensíveis é bem maior que isso e inclui expressamente o “dado referente à saúde”.", "D": "O art. 5º, II, põe o “dado referente à saúde” entre os dados pessoais sensíveis, e não como dado público.", "E": "A pergunta é sobre a classe da informação. Dado de saúde de paciente identificado é dado pessoal sensível, pelo art. 5º, II."}}, {"id": "lgpd-02", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Lei nº 13.709/2018 (LGPD).\n\nPara os fins da lei, ________ é a pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; ________ é a pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do ________.", "alternativas": ["controlador – operador – controlador", "operador – controlador – operador", "encarregado – operador – titular", "controlador – encarregado – titular", "titular – operador – controlador"], "correta": 0, "explicacao": "Quem decide sobre o tratamento é o controlador; quem executa o tratamento em nome do controlador é o operador. A banca costuma inverter esses dois papéis (alternativa B).", "fundamento": "“VI - controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais; VII - operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador;”", "fonte": "Lei 13.709/2018, art. 5º, VI e VII", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm", "regra": "Quando aparecerem controlador e operador, lembre: o controlador DECIDE sobre o tratamento, o operador FAZ o tratamento em nome do controlador.", "passos": [{"t": "1ª lacuna: “a quem competem as decisões” é o controlador."}, {"t": "2ª lacuna: quem “realiza o tratamento” em nome de outro é o operador."}, {"t": "3ª lacuna: o operador trabalha em nome do controlador. Fica controlador, operador, controlador."}], "resp": "Alternativa A", "pegadinha": "B inverte os dois papéis, e a banca costuma fazer isso. Guarde: quem decide é o controlador.", "porque": {"B": "Essa inverte os papéis. Quem decide sobre o tratamento é o controlador, e o operador faz o tratamento em nome dele.", "C": "A 1ª lacuna, de quem decide, é o controlador, não o encarregado. E o operador trata os dados em nome do controlador, não do titular.", "D": "A 2ª lacuna, de quem realiza o tratamento, é o operador, não o encarregado. E ele age em nome do controlador, não do titular.", "E": "A 1ª lacuna, de quem decide sobre o tratamento, é o controlador, não o titular. O titular não aparece nessas duas definições."}}, {"id": "lgpd-03", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Considere as definições abaixo, relacionadas aos princípios do art. 6º da Lei nº 13.709/2018 (LGPD), e indique se são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) Transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial.", "( ) Qualidade dos dados: limitação do tratamento ao mínimo necessário para a realização de suas finalidades.", "( ) Prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais.", "( ) Adequação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos."], "alternativas": ["V – V – F – F", "F – F – V – V", "V – F – F – V", "F – V – V – F", "V – F – V – F"], "correta": 4, "explicacao": "Transparência e prevenção estão definidas corretamente. A segunda definição é a do princípio da necessidade, e a quarta é a do princípio da não discriminação; a pegadinha é trocar o nome do princípio mantendo a definição literal.", "fundamento": "Art. 6º: “III - necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades [...]; VI - transparência: [...]; VIII - prevenção: adoção de medidas para prevenir a ocorrência de danos [...]; IX - não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos;”", "fonte": "Lei 13.709/2018, art. 6º, II, III, V, VI, VIII e IX", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm", "regra": "Quando a questão listar princípios da LGPD com definição, leia a definição primeiro e depois veja se o nome bate. A banca costuma trocar só o nome.", "passos": [{"t": "1º: informações claras, precisas e acessíveis sobre o tratamento é mesmo transparência. Verdadeiro."}, {"t": "2º: “mínimo necessário” é a definição de necessidade, não de qualidade dos dados. Falso."}, {"t": "3º: medidas para prevenir danos é mesmo prevenção. Verdadeiro."}, {"t": "4º: proibir tratamento para fins discriminatórios é a definição de não discriminação, não de adequação. Falso."}], "resp": "Alternativa E (V, F, V, F)", "pegadinha": "Os itens 2 e 4 copiam a definição da lei palavra por palavra, por isso parecem certos. O erro está só no nome do princípio.", "porque": {"A": "Essa marca a 2ª como verdadeira, mas “mínimo necessário” é o princípio da necessidade. E a 3ª é verdadeira: prevenir danos é mesmo prevenção.", "B": "Essa marca a 1ª como falsa, mas aquela definição é mesmo de transparência. E a 4ª define não discriminação, não adequação.", "C": "Essa marca a 3ª como falsa, mas medidas para prevenir danos é mesmo prevenção. E a 4ª define não discriminação, não adequação.", "D": "Essa marca a 1ª como falsa, mas aquela definição é mesmo de transparência. E a 2ª define necessidade, não qualidade dos dados."}}, {"id": "lgpd-04", "materia": "Conhecimentos Específicos", "tema": "LGPD", "enunciado": "Sobre o tratamento de dados pessoais sensíveis e os direitos do titular na Lei nº 13.709/2018 (LGPD), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – O tratamento de dados pessoais sensíveis pode ocorrer sem fornecimento de consentimento do titular quando for indispensável para a tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária.", "II – Quando o tratamento de dado sensível se basear no consentimento, basta um consentimento genérico, dispensada a indicação de finalidades específicas.", "III – O titular tem direito a obter do controlador, a qualquer momento e mediante requisição, a confirmação da existência de tratamento e o acesso aos dados."], "alternativas": ["Apenas I.", "Apenas I e III.", "Apenas II.", "Apenas II e III.", "I, II e III."], "correta": 1, "explicacao": "I reproduz o art. 11, II, “f” (redação da Lei 13.853/2019) e III reproduz o art. 18, I e II. II está errada: para dado sensível, o consentimento deve ser dado de forma específica e destacada, para finalidades específicas.", "fundamento": "Art. 11: “I - quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas; II - sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para: [...] f) tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária”. Art. 18, I e II: confirmação da existência de tratamento; acesso aos dados.", "fonte": "Lei 13.709/2018, art. 11, I e II, “f” (redação da Lei 13.853/2019); art. 18, caput, I e II", "url": "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm", "regra": "Quando o tratamento de dado sensível se basear no consentimento, ele precisa ser específico e destacado, para finalidades específicas. Consentimento genérico não vale.", "passos": [{"t": "I: o art. 11, II, “f”, permite tratar dado sensível sem consentimento para tutela da saúde, em procedimento feito por profissionais de saúde, serviços de saúde ou autoridade sanitária. Correta."}, {"t": "II: o art. 11, I, exige consentimento “de forma específica e destacada, para finalidades específicas”. Errada."}, {"t": "III: o art. 18, I e II, garante ao titular a confirmação de que há tratamento e o acesso aos dados. Correta."}], "resp": "Alternativa B", "pegadinha": "C, D e E incluem a II, que está errada: para dado sensível, consentimento genérico não basta. Ele precisa ser específico e destacado, para finalidades específicas.", "porque": {"A": "Essa deixa de fora a III, que está certa: o titular tem direito à confirmação de que há tratamento e ao acesso aos dados.", "C": "A II está errada, porque consentimento genérico não vale para dado sensível. E essa deixa de fora a I e a III, que estão certas.", "D": "Essa inclui a II, mas para dado sensível o consentimento precisa ser específico e destacado. E deixa de fora a I, que está certa.", "E": "Essa inclui a II, mas consentimento genérico não vale para dado sensível. Ele precisa ser específico e destacado, para finalidades específicas."}}, {"id": "eti-01", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "De acordo com o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), a pena aplicável ao servidor público pela Comissão de Ética é a de", "alternativas": ["advertência, com fundamentação em parecer assinado pelo presidente da Comissão.", "suspensão, com ciência do faltoso.", "demissão, após rito sumário com recurso ao Ministro de Estado.", "censura, cuja fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.", "censura, cuja fundamentação constará de parecer assinado apenas pelo relator, dispensada a ciência do faltoso."], "correta": 3, "explicacao": "O inciso XXII prevê a censura, com parecer assinado por todos os integrantes e ciência do faltoso. A alternativa E acerta a pena, mas troca quem assina e dispensa a ciência; advertência, suspensão e demissão não são penas da Comissão de Ética.", "fundamento": "“XXII - A pena aplicável ao servidor público pela Comissão de Ética é a de censura e sua fundamentação constará do respectivo parecer, assinado por todos os seus integrantes, com ciência do faltoso.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo II, inciso XXII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm", "regra": "Quando perguntarem a pena da Comissão de Ética no Decreto 1.171/1994, é uma só: censura, com parecer assinado por todos os integrantes e ciência do faltoso.", "passos": [{"t": "O inciso XXII prevê uma única pena aplicada pela Comissão de Ética: a censura."}, {"t": "A lei exige dois detalhes: o parecer é assinado por todos os integrantes, e o faltoso (o servidor que errou) toma ciência, ou seja, é informado."}, {"t": "A D tem a pena e os dois detalhes certos. Advertência, suspensão e demissão não são penas da Comissão de Ética."}], "resp": "Alternativa D", "pegadinha": "E acerta a pena (censura), mas diz que só o relator assina e dispensa a ciência do faltoso. A lei pede assinatura de todos e ciência do faltoso.", "porque": {"A": "Advertência não é pena da Comissão de Ética. A única pena que ela aplica é a censura, com parecer assinado por todos os integrantes.", "B": "Suspensão não é pena da Comissão de Ética. A única pena que ela aplica é a censura.", "C": "Demissão não é pena da Comissão de Ética. A única pena que ela aplica é a censura.", "E": "A pena está certa, mas o parecer é assinado por todos os integrantes, não só pelo relator, e o faltoso precisa tomar ciência."}}, {"id": "eti-02", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Considerando as Regras Deontológicas do Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), assinale a alternativa INCORRETA.", "alternativas": ["Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral.", "Toda ausência injustificada do servidor de seu local de trabalho é fator de desmoralização do serviço público.", "A publicidade dos atos administrativos pode ser omitida sempre que o servidor a julgar inconveniente para a chefia, sem que isso configure comprometimento ético.", "Os fatos e atos verificados na conduta do dia a dia na vida privada do servidor poderão acrescer ou diminuir o seu bom conceito na vida funcional.", "Toda pessoa tem direito à verdade, e o servidor não pode omiti-la ou falseá-la, ainda que contrária aos interesses da própria Administração Pública."], "correta": 2, "explicacao": "Pelo inciso VII, a publicidade é requisito de eficácia e moralidade, ressalvados apenas segurança nacional, investigações policiais ou interesse superior do Estado em processo previamente declarado sigiloso; sua omissão gera comprometimento ético. As demais alternativas reproduzem os incisos IX, XII, VI e VIII.", "fundamento": "“VII - Salvo os casos de segurança nacional, investigações policiais ou interesse superior do Estado e da Administração Pública, a serem preservados em processo previamente declarado sigiloso, nos termos da lei, a publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade, ensejando sua omissão comprometimento ético contra o bem comum, imputável a quem a negar.”", "fonte": "Decreto 1.171/1994, Anexo, Capítulo I, Seção I, incisos VI, VII, VIII, IX e XII", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm", "regra": "Quando a questão deixar o servidor omitir a publicidade de um ato por conveniência, está errada: só há ressalva para segurança nacional, investigação policial ou interesse superior do Estado, em processo previamente declarado sigiloso.", "passos": [{"t": "A questão pede a INCORRETA. A C deixa o servidor omitir a publicidade quando achar inconveniente para a chefia."}, {"t": "Pelo inciso VII, a publicidade é requisito de eficácia e moralidade. As únicas ressalvas são segurança nacional, investigações policiais ou interesse superior do Estado, em processo previamente declarado sigiloso."}, {"t": "Fora dessas ressalvas, omitir a publicidade gera comprometimento ético. As outras alternativas copiam os incisos IX, XII, VI e VIII."}], "resp": "Alternativa C", "pegadinha": "E parece exagerada (“ainda que contrária aos interesses da própria Administração Pública”), mas está certa: é o inciso VIII.", "porque": {"A": "Essa frase está certa, porque copia o inciso IX. A questão pede a INCORRETA.", "B": "Essa frase está certa, porque copia o inciso XII. A questão pede a INCORRETA.", "D": "Essa frase está certa, porque copia o inciso VI. A questão pede a INCORRETA.", "E": "Parece exagerada, mas está certa, porque é o inciso VIII. A questão pede a INCORRETA."}}, {"id": "eti-03", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Sobre os deveres e as vedações previstos no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – É vedado ao servidor público apresentar-se embriagado no serviço ou fora dele habitualmente.", "II – É dever do servidor resistir às pressões de superiores hierárquicos que visem obter vantagens indevidas, mas não lhe cabe denunciá-las, em respeito à hierarquia.", "III – É vedado ao servidor retirar da repartição pública qualquer documento, livro ou bem pertencente ao patrimônio público, ainda que esteja legalmente autorizado."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas I e III.", "I, II e III."], "correta": 0, "explicacao": "I reproduz a alínea “n” do inciso XV. II está errada porque a alínea “i” do inciso XIV manda resistir às pressões “e denunciá-las”. III está errada porque a vedação é retirar bens “sem estar legalmente autorizado”.", "fundamento": "XIV, i) “resistir a todas as pressões de superiores hierárquicos, de contratantes, interessados e outros que visem obter quaisquer favores, benesses ou vantagens indevidas [...] e denunciá-las”; XV, l) “retirar da repartição pública, sem estar legalmente autorizado, qualquer documento, livro ou bem pertencente ao patrimônio público”; XV, n) “apresentar-se embriagado no serviço ou fora dele habitualmente”.", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alínea i; inciso XV, alíneas l e n", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm", "regra": "Quando o item falar em pressão de superior, lembre que o dever é resistir E denunciar. Quando falar em retirar bem da repartição, a proibição é só para quem não está legalmente autorizado.", "passos": [{"t": "I copia a alínea “n” do inciso XV: é vedado apresentar-se embriagado no serviço ou fora dele habitualmente. Certo."}, {"t": "II erra no final. A alínea “i” do inciso XIV manda resistir às pressões “e denunciá-las”."}, {"t": "III inverte a regra. A vedação é retirar bens “sem estar legalmente autorizado”, e o item proíbe mesmo com autorização."}], "resp": "Alternativa A", "pegadinha": "D (I e III) engana porque o item III parece rigor ético. Mas a lei só proíbe retirar bens sem autorização legal.", "porque": {"B": "A II está errada, porque o dever é resistir às pressões e também denunciá-las. E essa deixa de fora a I, que está certa.", "C": "Essa inclui a II, mas o Código manda resistir às pressões “e denunciá-las”.", "D": "Essa inclui a III, mas a lei só proíbe retirar bens “sem estar legalmente autorizado”. Com autorização, pode.", "E": "Essa inclui a II e a III. O dever é resistir e denunciar, e só é proibido retirar bens sem autorização legal."}}, {"id": "eti-04", "materia": "Conhecimentos Específicos", "tema": "Ética do servidor (Decreto 1.171/1994)", "enunciado": "Com base no Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) É dever fundamental do servidor ser assíduo e frequente ao serviço, na certeza de que sua ausência provoca danos ao trabalho ordenado.", "( ) Para fins de apuração do comprometimento ético, só se considera servidor público quem presta serviços de natureza permanente e mediante retribuição financeira.", "( ) É dever fundamental do servidor apresentar-se ao trabalho com vestimentas adequadas ao exercício da função.", "( ) É dever fundamental do servidor divulgar e informar a todos os integrantes da sua classe sobre a existência do Código de Ética, estimulando o seu integral cumprimento."], "alternativas": ["V – V – V – V", "F – F – V – V", "V – F – F – V", "V – V – F – F", "V – F – V – V"], "correta": 4, "explicacao": "O primeiro, o terceiro e o quarto itens reproduzem as alíneas “l”, “p” e “v” do inciso XIV. O segundo é falso: o inciso XXIV abrange serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira.", "fundamento": "“XXIV - Para fins de apuração do comprometimento ético, entende-se por servidor público todo aquele que, por força de lei, contrato ou de qualquer ato jurídico, preste serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira [...]”", "fonte": "Decreto 1.171/1994, Anexo, inciso XIV, alíneas l, p e v; inciso XXIV", "url": "http://www.planalto.gov.br/ccivil_03/decreto/d1171.htm", "regra": "Quando a questão restringir quem é servidor para fins de ética, está errada: vale para serviço permanente, temporário ou excepcional, ainda que sem retribuição financeira.", "passos": [{"t": "Itens 1, 3 e 4 copiam deveres do inciso XIV (alíneas “l”, “p” e “v”): ser assíduo, usar vestimenta adequada e divulgar o Código de Ética. Todos V."}, {"t": "Item 2 usa “só” e restringe a serviço permanente e pago. O inciso XXIV inclui serviço permanente, temporário ou excepcional, ainda que sem retribuição financeira. É F."}], "resp": "Alternativa E", "pegadinha": "A (tudo V) pega quem não percebe o “só” do item 2. Para o Código de Ética, quem presta serviço temporário ou sem receber também conta como servidor.", "porque": {"A": "Essa marca a 2ª como verdadeira, mas o “só” a torna falsa. Serviço temporário, excepcional ou sem retribuição financeira também conta.", "B": "Essa marca a 1ª como falsa, mas ser assíduo e frequente é mesmo dever fundamental do servidor.", "C": "Essa marca a 3ª como falsa, mas apresentar-se com vestimenta adequada é mesmo dever fundamental do servidor.", "D": "Essa marca a 2ª como verdadeira, mas o Código inclui serviço temporário e sem retribuição. E a 3ª e a 4ª são deveres fundamentais."}}, {"id": "nr32-01", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Para fins de aplicação da Norma Regulamentadora nº 32 (Segurança e Saúde no Trabalho em Serviços de Saúde), entende-se por serviços de saúde", "alternativas": ["apenas os hospitais e as clínicas que mantenham regime de internação.", "qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.", "somente os estabelecimentos de alta complexidade, como hospitais universitários e de referência.", "as edificações de saúde que mantenham trabalhadores expostos a radiações ionizantes.", "qualquer edificação destinada à prestação de assistência à saúde da população, excluídas as atividades de pesquisa e ensino."], "correta": 1, "explicacao": "O item 32.1.2 adota conceito amplo, que inclui pesquisa e ensino e vale para qualquer nível de complexidade. A alternativa E é a pegadinha: copia o início do texto, mas exclui justamente pesquisa e ensino.", "fundamento": "“32.1.2 Para fins de aplicação desta NR entende-se por serviços de saúde qualquer edificação destinada à prestação de assistência à saúde da população, e todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde em qualquer nível de complexidade.”", "fonte": "NR-32, item 32.1.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf", "regra": "Quando a NR-32 definir serviço de saúde, pense amplo: qualquer edificação de assistência à saúde e também pesquisa e ensino, em qualquer nível de complexidade.", "passos": [{"t": "O item 32.1.2 dá um conceito amplo: qualquer edificação de assistência à saúde da população."}, {"t": "Inclui todas as ações de promoção, recuperação, assistência, pesquisa e ensino em saúde, em qualquer nível de complexidade."}, {"t": "A alternativa B reproduz esse texto inteiro."}], "resp": "Alternativa B", "pegadinha": "E copia o começo do texto, mas exclui justamente pesquisa e ensino. Desconfie de “excluídas”, “apenas” e “somente” nesse conceito.", "porque": {"A": "O conceito não se limita a hospitais com internação. Vale para qualquer edificação de assistência à saúde, em qualquer nível de complexidade.", "C": "O conceito não é só alta complexidade. A norma fala em qualquer nível de complexidade.", "D": "A norma não liga o conceito a radiação. Serviço de saúde é qualquer edificação de assistência à saúde, mais pesquisa e ensino.", "E": "Essa copia o começo do texto, mas exclui pesquisa e ensino, que a norma inclui expressamente."}}, {"id": "nr32-02", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Segundo a NR-32, entre as medidas de proteção contra riscos biológicos, o empregador deve vedar:\n\nQuais estão corretas?", "itens": ["I – o consumo de alimentos e bebidas nos postos de trabalho.", "II – o uso de adornos e o manuseio de lentes de contato nos postos de trabalho.", "III – o uso de calçados fechados."], "alternativas": ["Apenas I.", "Apenas III.", "Apenas I e III.", "Apenas I e II.", "I, II e III."], "correta": 3, "explicacao": "I e II estão no item 32.2.4.5, alíneas “c” e “b”. III troca uma palavra: o que deve ser vedado é o uso de calçados abertos.", "fundamento": "“32.2.4.5 O empregador deve vedar: a) a utilização de pias de trabalho para fins diversos dos previstos; b) o ato de fumar, o uso de adornos e o manuseio de lentes de contato nos postos de trabalho; c) o consumo de alimentos e bebidas nos postos de trabalho; d) a guarda de alimentos em locais não destinados para este fim; e) o uso de calçados abertos.”", "fonte": "NR-32, item 32.2.4.5", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf", "regra": "Quando a NR-32 falar do que o empregador deve vedar, lembre que o proibido é calçado ABERTO, além de comer, beber, usar adornos e manusear lentes no posto de trabalho.", "passos": [{"t": "I: consumo de alimentos e bebidas nos postos de trabalho está no item 32.2.4.5, alínea “c”. Correta."}, {"t": "II: uso de adornos e manuseio de lentes de contato está no mesmo item, alínea “b”. Correta."}, {"t": "III: a norma veda calçados abertos, não fechados. Errada."}], "resp": "Alternativa D", "pegadinha": "A III troca uma só palavra, “abertos” por “fechados”. Lida rápido, parece certa.", "porque": {"A": "Essa deixa de fora a II, que está certa: a norma veda adornos e lentes de contato no posto de trabalho.", "B": "A III está errada, porque a norma veda calçados abertos, não fechados. E essa deixa de fora a I e a II, que estão certas.", "C": "Essa inclui a III, mas o proibido é calçado aberto, não fechado. E deixa de fora a II, que está certa.", "E": "Essa inclui a III, mas a norma veda calçados abertos, não fechados."}}, {"id": "nr32-03", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a NR-32.\n\nOs trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu ________. São vedados o ________ e a desconexão manual de agulhas. Para os recipientes destinados à coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado ________ abaixo do bocal.", "alternativas": ["armazenamento – descarte – 2 cm", "descarte – transporte – 10 cm", "descarte – reencape – 5 cm", "reencape – descarte – 5 cm", "transporte – reencape – 10 cm"], "correta": 2, "explicacao": "Quem usa o perfurocortante é responsável pelo descarte (32.2.4.14), o reencape é vedado (32.2.4.15) e o limite de enchimento do coletor fica 5 cm abaixo do bocal (32.5.3.2). A alternativa D usa os mesmos termos em ordem invertida.", "fundamento": "“32.2.4.14 Os trabalhadores que utilizarem objetos perfurocortantes devem ser os responsáveis pelo seu descarte. 32.2.4.15 São vedados o reencape e a desconexão manual de agulhas.” “32.5.3.2 Para os recipientes destinados a coleta de material perfurocortante, o limite máximo de enchimento deve estar localizado 5 cm abaixo do bocal.”", "fonte": "NR-32, itens 32.2.4.14, 32.2.4.15 e 32.5.3.2", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf", "regra": "Quando a questão for de perfurocortante, lembre a sequência: quem usa descarta, reencapar agulha é proibido, e o coletor enche só até 5 cm abaixo do bocal.", "passos": [{"t": "1ª lacuna: quem usa o perfurocortante é responsável pelo descarte (32.2.4.14)."}, {"t": "2ª lacuna: são vedados o reencape e a desconexão manual de agulhas (32.2.4.15)."}, {"t": "3ª lacuna: o limite de enchimento do coletor fica 5 cm abaixo do bocal (32.5.3.2). Fica descarte, reencape, 5 cm."}], "resp": "Alternativa C", "pegadinha": "D usa os mesmos termos em ordem invertida (reencape, descarte). Confira a ordem das lacunas, não só se as palavras aparecem.", "porque": {"A": "Quem usa o perfurocortante é responsável pelo descarte, não pelo armazenamento. E o coletor enche só até 5 cm abaixo do bocal, não 2 cm.", "B": "O vedado é o reencape, não o transporte. E o limite do coletor fica 5 cm abaixo do bocal, não 10 cm.", "D": "Essa troca a ordem. Quem usa é responsável pelo descarte, e o vedado é o reencape de agulhas.", "E": "Quem usa o perfurocortante é responsável pelo descarte, não pelo transporte. E o limite do coletor é 5 cm, não 10 cm."}}, {"id": "nr32-04", "materia": "Conhecimentos Específicos", "tema": "NR-32", "enunciado": "Com base na NR-32, indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A todo trabalhador dos serviços de saúde deve ser fornecido, gratuitamente, programa de imunização ativa contra tétano, difteria, hepatite B e os estabelecidos no PCMSO.", "( ) O uso de luvas descartáveis substitui o processo de lavagem das mãos.", "( ) A vacinação deve ser registrada no prontuário clínico individual do trabalhador, previsto na NR-07.", "( ) A vestimenta de trabalho deve ser fornecida pelo empregador, podendo seu custo ser descontado do salário do empregado."], "alternativas": ["V – F – V – F", "V – V – V – F", "F – F – V – V", "V – F – F – V", "F – V – F – V"], "correta": 0, "explicacao": "O primeiro e o terceiro itens reproduzem os itens 32.2.4.17.1 e 32.2.4.17.6. O uso de luvas não substitui a lavagem das mãos (32.2.4.3.2), e a vestimenta deve ser fornecida sem ônus para o empregado (32.2.4.6.1).", "fundamento": "“32.2.4.3.2 O uso de luvas não substitui o processo de lavagem das mãos, o que deve ocorrer, no mínimo, antes e depois do uso das mesmas.” “32.2.4.6.1 A vestimenta deve ser fornecida sem ônus para o empregado.” “32.2.4.17.6 A vacinação deve ser registrada no prontuário clínico individual do trabalhador, previsto na NR-07.”", "fonte": "NR-32, itens 32.2.4.3.2, 32.2.4.6.1, 32.2.4.17.1 e 32.2.4.17.6", "url": "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/arquivos/normas-regulamentadoras/nr-32-atualizada-2022-2.pdf", "regra": "Quando a NR-32 falar de luvas e vestimenta, lembre: luva não substitui lavar as mãos, e a vestimenta é fornecida sem custo para o empregado.", "passos": [{"t": "1º: imunização gratuita contra tétano, difteria, hepatite B e os do PCMSO está no item 32.2.4.17.1. Verdadeiro."}, {"t": "2º: o uso de luvas não substitui a lavagem das mãos (32.2.4.3.2). Falso."}, {"t": "3º: a vacinação é registrada no prontuário clínico individual do trabalhador, previsto na NR-07 (32.2.4.17.6). Verdadeiro."}, {"t": "4º: a vestimenta deve ser fornecida sem ônus para o empregado (32.2.4.6.1). Descontar do salário é proibido. Falso."}], "resp": "Alternativa A (V, F, V, F)", "pegadinha": "O 4º item começa certo (“fornecida pelo empregador”) e erra no final, ao permitir desconto no salário. Sem ônus quer dizer sem custo nenhum para o empregado.", "porque": {"B": "Essa marca a 2ª como verdadeira, mas luva não substitui a lavagem das mãos.", "C": "Essa marca a 1ª como falsa, mas a imunização gratuita está na norma. E a 4ª é falsa: a vestimenta é sem ônus para o empregado.", "D": "Essa marca a 3ª como falsa, mas a vacinação é mesmo registrada no prontuário. E a 4ª é falsa: descontar do salário é proibido.", "E": "Essa marca a 2ª como verdadeira, mas luva não substitui lavar as mãos. E a 4ª é falsa: a vestimenta não tem custo para o empregado."}}, {"id": "seg-01", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "De acordo com as definições da Resolução RDC Anvisa nº 36/2013, evento adverso é", "alternativas": ["o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde.", "o comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo, incluindo doenças, lesão, sofrimento, morte, incapacidade ou disfunção.", "qualquer incidente notificado ao Núcleo de Segurança do Paciente, com ou sem dano.", "a redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde.", "o incidente que resulta em dano à saúde."], "correta": 4, "explicacao": "Evento adverso é o incidente que resulta em dano (art. 3º, IV). As alternativas A, B e D trazem, respectivamente, as definições de incidente, dano e segurança do paciente; C inventa um critério baseado na notificação.", "fundamento": "Art. 3º: “III - dano: comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo [...]; IV - evento adverso: incidente que resulta em dano à saúde; [...] VII - incidente: evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário à saúde; [...] X - segurança do paciente: redução, a um mínimo aceitável, do risco de dano desnecessário associado à atenção à saúde;”", "fonte": "RDC Anvisa 36/2013, art. 3º, III, IV, VII e X", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html", "regra": "Quando pedirem a definição de evento adverso, pense em incidente + dano: incidente é o que poderia causar ou causou dano; evento adverso é o incidente que resulta em dano.", "passos": [{"t": "A RDC 36/2013 (art. 3º) define vários termos parecidos: incidente, dano, evento adverso e segurança do paciente."}, {"t": "Evento adverso é o incidente que resulta em dano à saúde (art. 3º, IV). É a alternativa E."}, {"t": "As outras são definições de outros termos: A é incidente, B é dano, D é segurança do paciente. C inventa um critério baseado na notificação."}], "resp": "Alternativa E", "pegadinha": "A engana porque fala em dano. Mas “poderia ter resultado, ou resultou, em dano” é a definição de incidente, não de evento adverso.", "porque": {"A": "Essa é a definição de incidente. Evento adverso é o incidente que de fato resulta em dano.", "B": "Essa é a definição de dano. Evento adverso é o incidente que resulta em dano à saúde.", "C": "A notificação não entra na definição, e evento adverso sempre tem dano. É o incidente que resulta em dano à saúde.", "D": "Essa é a definição de segurança do paciente. Evento adverso é o incidente que resulta em dano à saúde."}}, {"id": "seg-02", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas do texto abaixo, de acordo com a Resolução RDC Anvisa nº 36/2013.\n\nA notificação dos eventos adversos deve ser realizada ________ pelo NSP, até o ________ dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Os eventos adversos que evoluírem para óbito devem ser notificados em até ________ a partir do ocorrido.", "alternativas": ["semanalmente – 5º – 24 horas", "mensalmente – 15º – 72 horas", "mensalmente – 10º – 48 horas", "trimestralmente – 15º – 72 horas", "mensalmente – 15º – 7 dias"], "correta": 1, "explicacao": "O art. 10 fixa notificação mensal, até o 15º dia útil do mês seguinte, e prazo de 72 horas para eventos que evoluíram para óbito. As alternativas D e E acertam dois termos e trocam um.", "fundamento": "“Art. 10 A notificação dos eventos adversos, para fins desta Resolução, deve ser realizada mensalmente pelo NSP, até o 15º (décimo quinto) dia útil do mês subsequente ao mês de vigilância, por meio das ferramentas eletrônicas disponibilizadas pela Anvisa. Parágrafo único - Os eventos adversos que evoluírem para óbito devem ser notificados em até 72 (setenta e duas) horas a partir do ocorrido.”", "fonte": "RDC Anvisa 36/2013, art. 10 e parágrafo único", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html", "regra": "Quando a questão pedir os prazos de notificação de evento adverso da RDC 36/2013, lembre: mensal, até o 15º dia útil do mês seguinte, e 72 horas se houve óbito.", "passos": [{"t": "1ª lacuna: pelo art. 10, o NSP notifica mensalmente. Isso já elimina A (semanalmente) e D (trimestralmente)."}, {"t": "2ª lacuna: até o 15º dia útil do mês seguinte ao mês de vigilância. Isso elimina C (10º)."}, {"t": "3ª lacuna: evento adverso que evoluiu para óbito é notificado em até 72 horas. Entre B e E, só a B tem 72 horas."}], "resp": "Alternativa B", "pegadinha": "E acerta mensal e 15º dia útil, mas troca 72 horas por 7 dias. D também acerta dois termos e erra só a frequência.", "porque": {"A": "A notificação é mensal, não semanal, e vai até o 15º dia útil, não o 5º. E óbito se notifica em até 72 horas.", "C": "O prazo é até o 15º dia útil, não o 10º. E evento com óbito é notificado em até 72 horas, não 48.", "D": "A notificação é mensal, não trimestral. Os outros dois termos estão certos.", "E": "Acerta mensal e 15º dia útil, mas evento com óbito é notificado em até 72 horas, não 7 dias."}}, {"id": "seg-03", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Sobre o Núcleo de Segurança do Paciente (NSP) e a abrangência da Resolução RDC Anvisa nº 36/2013, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – A direção do serviço de saúde deve constituir o NSP e nomear a sua composição, podendo utilizar a estrutura de comitês, comissões, gerências, coordenações ou núcleos já existentes para o desempenho de suas atribuições.", "II – A Resolução aplica-se também aos consultórios individualizados e aos laboratórios clínicos.", "III – Compete ao NSP notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e III.", "I, II e III."], "correta": 3, "explicacao": "I reproduz o art. 4º e seu § 1º; III reproduz o art. 7º, XI. II é falsa: o parágrafo único do art. 2º exclui do escopo os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar.", "fundamento": "“Art. 2º [...] Parágrafo único. Excluem-se do escopo desta Resolução os consultórios individualizados, laboratórios clínicos e os serviços móveis e de atenção domiciliar.” “Art. 7º Compete ao NSP: [...] XI - notificar ao Sistema Nacional de Vigilância Sanitária os eventos adversos decorrentes da prestação do serviço de saúde;”", "fonte": "RDC Anvisa 36/2013, art. 2º, parágrafo único; art. 4º, caput e § 1º; art. 7º, XI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/anvisa/2013/rdc0036_25_07_2013.html", "regra": "Quando a questão disser que a RDC 36/2013 vale para consultório individualizado ou laboratório clínico, está errada: eles ficam fora do escopo da norma.", "passos": [{"t": "I copia o art. 4º: a direção constitui o NSP e pode usar comitês, comissões ou núcleos já existentes. Certo."}, {"t": "III copia o art. 7º, XI: o NSP notifica ao Sistema Nacional de Vigilância Sanitária os eventos adversos. Certo."}, {"t": "II é falsa. O art. 2º, parágrafo único, exclui do escopo os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar."}], "resp": "Alternativa D", "pegadinha": "E (I, II e III) pega quem acha que a norma vale para todo serviço de saúde. Consultório individualizado e laboratório clínico estão excluídos pelo próprio texto.", "porque": {"A": "Essa deixa de fora a III, que está certa: compete ao NSP notificar os eventos adversos ao Sistema Nacional de Vigilância Sanitária.", "B": "A II está errada, porque consultórios individualizados e laboratórios clínicos ficam fora da norma. E essa deixa de fora a I e a III.", "C": "Essa deixa de fora a I, que está certa: a direção constitui o NSP e pode usar comitês ou núcleos já existentes.", "E": "Essa inclui a II, mas consultórios individualizados e laboratórios clínicos estão excluídos do escopo da norma."}}, {"id": "seg-04", "materia": "Conhecimentos Específicos", "tema": "Segurança do paciente", "enunciado": "Com base na Portaria GM/MS nº 529/2013, que institui o Programa Nacional de Segurança do Paciente (PNSP), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) A cultura de segurança prioriza a segurança acima de metas financeiras e operacionais.", "( ) A cultura de segurança encoraja e recompensa a identificação, a notificação e a resolução dos problemas relacionados à segurança.", "( ) Uma das estratégias de implementação do PNSP é a promoção da cultura de segurança com ênfase nos processos de responsabilização individual dos profissionais.", "( ) Incidente é o evento ou circunstância que poderia ter resultado, ou resultou, em dano desnecessário ao paciente."], "alternativas": ["V – F – F – V", "F – V – F – V", "V – V – F – V", "V – V – V – F", "V – V – V – V"], "correta": 2, "explicacao": "O primeiro e o segundo itens são características da cultura de segurança (art. 4º, V, “b” e “c”), e o quarto é a definição de incidente (art. 4º, III). O terceiro inverte o art. 5º, VI, que enfatiza sistemas seguros, “evitando-se” a responsabilização individual.", "fundamento": "Art. 5º: “VI - promoção da cultura de segurança com ênfase no aprendizado e aprimoramento organizacional, engajamento dos profissionais e dos pacientes na prevenção de incidentes, com ênfase em sistemas seguros, evitando-se os processos de responsabilização individual;”", "fonte": "Portaria GM/MS 529/2013, art. 4º, III e V, “b” e “c”; art. 5º, VI", "url": "https://bvsms.saude.gov.br/bvs/saudelegis/gm/2013/prt0529_01_04_2013.html", "regra": "Quando a questão ligar cultura de segurança a “responsabilização individual”, está errada: o PNSP enfatiza aprendizado e sistemas seguros, evitando a responsabilização individual.", "passos": [{"t": "Itens 1 e 2 são características da cultura de segurança (art. 4º, V, “b” e “c”): segurança acima de metas financeiras e incentivo a notificar e resolver problemas. Ambos V."}, {"t": "Item 4 é a definição de incidente (art. 4º, III). V."}, {"t": "Item 3 inverte o art. 5º, VI. A lei pede ênfase em sistemas seguros, “evitando-se” os processos de responsabilização individual. F."}], "resp": "Alternativa C", "pegadinha": "D e E marcam o item 3 como V. Ele começa igual à lei (“promoção da cultura de segurança”), mas troca “evitar” por dar ênfase à responsabilização individual.", "porque": {"A": "Essa marca a 2ª como falsa, mas incentivar a notificação e a resolução de problemas é mesmo característica da cultura de segurança.", "B": "Essa marca a 1ª como falsa, mas priorizar a segurança acima de metas financeiras é mesmo característica da cultura de segurança.", "D": "Essa marca a 3ª como verdadeira, mas a lei manda evitar a responsabilização individual. E a 4ª é verdadeira: é a definição de incidente.", "E": "Essa marca a 3ª como verdadeira, mas o PNSP enfatiza sistemas seguros, evitando a responsabilização individual."}}, {"id": "cnv-01", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Segundo Pelizzoli (2019), com base em Marshall Rosenberg, os quatro ingredientes principais da Comunicação Não-Violenta são", "alternativas": ["observações, sentimentos, necessidades e pedidos.", "observações, julgamentos, necessidades e ordens.", "avaliações, emoções, desejos e exigências.", "escuta, empatia, perdão e reconciliação.", "fatos, opiniões, estratégias e cobranças."], "correta": 0, "explicacao": "Os quatro componentes são observação, sentimento, necessidade e pedido. As alternativas erradas trocam componentes por aquilo que a CNV distingue deles: julgamento em vez de observação, ordem ou exigência em vez de pedido.", "fundamento": "Paráfrase: o texto apresenta observações (factuais, sem julgamento ou avaliação moral), sentimentos (sensações e emoções), necessidades (o que precisamos e desejamos) e pedidos (forma de demandar ações) como os quatro ingredientes principais da CNV.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 38", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf", "regra": "Quando pedirem os quatro ingredientes da CNV, a resposta é observação, sentimento, necessidade e pedido. Julgamento e ordem são justamente o que a CNV evita.", "passos": [{"t": "A questão pede os quatro ingredientes principais da CNV, segundo Pelizzoli com base em Rosenberg."}, {"t": "Os quatro são: observação (o fato, sem julgamento), sentimento (o que você sente), necessidade (o que você precisa) e pedido (a ação que você pede)."}, {"t": "Só a alternativa A traz exatamente esses quatro."}], "resp": "Alternativa A", "pegadinha": "B começa certo, com observações e necessidades, mas coloca julgamentos e ordens. A CNV separa a observação do julgamento e o pedido da ordem.", "porque": {"B": "Começa certo, mas põe julgamentos e ordens. A CNV separa a observação do julgamento e o pedido da ordem.", "C": "Essa troca observação por avaliações e pedido por exigências. Os quatro são observação, sentimento, necessidade e pedido.", "D": "Essa lista não é a dos ingredientes. Os quatro são observação, sentimento, necessidade e pedido.", "E": "Opiniões e cobranças não estão na lista. Os quatro ingredientes são observação, sentimento, necessidade e pedido."}}, {"id": "cnv-02", "materia": "Conhecimentos Específicos", "tema": "Comunicação não-violenta (CNV)", "enunciado": "Um assistente administrativo quer pedir a um colega que pare de deixar processos espalhados sobre a sua mesa. Segundo Pelizzoli (2019), na CNV o pedido deve ser positivo e específico, e não se confunde com um desejo. Assinale a fala que melhor corresponde a essa orientação.", "alternativas": ["“Não quero mais que você deixe papéis na minha mesa.”", "“Preciso da sua ajuda com a organização do setor.”", "“Eu gostaria tanto que você fosse mais organizado...”", "“Preciso que, a partir de hoje, você coloque os processos na bandeja de entrada do setor.”", "“Você é desorganizado e sempre atrapalha o meu trabalho.”"], "correta": 3, "explicacao": "A alternativa D diz o que se quer (positivo) e qual ação concreta (específico). A é pedido negativo, B é genérico, C expressa desejo e E é julgamento moralizador, que a CNV recomenda evitar.", "fundamento": "Paráfrase: o autor contrapõe “não quero que você fale alto” (pedido negativo) a “preciso de silêncio” (positivo), “preciso de sua ajuda” (genérico) a um pedido específico, e distingue desejo (“eu gostaria”) de pedido.", "fonte": "PELIZZOLI, M. Comunicação Não-Violenta (CNV) como escuta-diálogo e transformação de conflitos. João Pessoa: EDR-UFPE, 2019, p. 28-29", "url": "https://carceraria.org.br/wp-content/uploads/2021/08/ebook-cnv-final-1.pdf", "regra": "Quando a questão pedir um pedido no estilo da CNV, procure a frase que diz o que você quer (positivo) e qual ação concreta (específico). Fuja de “não quero”, “eu gostaria” e frases vagas.", "passos": [{"t": "O enunciado já dá a chave: o pedido deve ser positivo e específico, e não é um desejo."}, {"t": "Positivo é dizer o que você quer, e não o que você não quer. Específico é dizer qual ação concreta a pessoa deve fazer."}, {"t": "D diz o que se quer e a ação exata: colocar os processos na bandeja de entrada do setor."}], "resp": "Alternativa D", "pegadinha": "B parece educada, mas “preciso da sua ajuda” é genérico e não diz qual ação. A também erra, porque “não quero” é pedido negativo.", "porque": {"A": "“Não quero” é pedido negativo. Na CNV, você diz o que quer, e não o que não quer.", "B": "“Preciso da sua ajuda” é genérico e não diz qual ação o colega deve fazer.", "C": "“Eu gostaria” expressa um desejo, não um pedido. E também não diz qual ação concreta você espera.", "E": "Isso é um julgamento sobre a pessoa, não um pedido. A CNV recomenda evitar julgamento moralizador."}}, {"id": "mat-01", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "O almoxarifado de um hospital adota o sistema de reposição contínua para caixas de luvas de procedimento. O consumo médio é de 120 caixas por mês, o tempo de reposição é de 15 dias e o estoque de segurança foi fixado em 40 caixas. Considerando o mês com 30 dias e a fórmula PP = (C × TR) + ES, o ponto de pedido é de", "alternativas": ["60 caixas.", "100 caixas.", "140 caixas.", "160 caixas.", "1.840 caixas."], "correta": 1, "explicacao": "TR = 15/30 = 0,5 mês; PP = 120 × 0,5 + 40 = 100 caixas. A alternativa A esquece o estoque de segurança, D ignora o tempo de reposição e E usa o tempo em dias sem converter para meses.", "fundamento": "Paráfrase de Fenili: ponto de pedido é a quantidade em estoque que, quando atingida, deve provocar novo pedido de compra, cobrindo o consumo durante o tempo de reposição; PP = (C × TR) + ES, sendo ES o estoque mínimo ou de segurança.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 50 (Quadro 8) e p. 53 (Atividade 2)", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content", "regra": "Quando a fórmula pede o tempo em meses e o enunciado dá em dias, converta antes de multiplicar. E não esqueça de somar o estoque de segurança.", "passos": [{"t": "Separe os dados: consumo de 120 caixas por mês, reposição em 15 dias, estoque de segurança de 40 caixas."}, {"t": "O consumo está por mês, então o tempo de reposição também precisa estar em meses:", "conta": ["TR = 15 ÷ 30 = 0,5 mês"]}, {"t": "Aplique a fórmula PP = (C × TR) + ES:", "conta": ["PP = (120 × 0,5) + 40", "PP = 60 + 40", "PP = 100 caixas"]}], "resp": "Alternativa B", "pegadinha": "A (60) esquece o estoque de segurança. E (1.840) usa 15 dias sem converter para meses.", "porque": {"A": "Esse 60 é só 120 × 0,5. Faltou somar as 40 caixas do estoque de segurança.", "C": "Esse 140 não sai da fórmula. Com o tempo em meses, 120 × 0,5 dá 60, e somando as 40 de segurança dá 100.", "D": "Esse 160 é 120 + 40. Você usou o consumo do mês inteiro, mas a reposição leva só meio mês.", "E": "Esse 1.840 vem de multiplicar 120 por 15 dias. O consumo é por mês, então 15 dias vira 0,5 mês."}}, {"id": "mat-02", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre a classificação ABC de estoques, considere as afirmações abaixo.\n\nQuais estão corretas?", "itens": ["I – Os itens da classe A são os de maior valor de demanda e, segundo Fenili, correspondem aproximadamente a 80% do valor de demanda e a 20% da quantidade de itens em estoque.", "II – Os percentuais que delimitam as classes A, B e C são aproximados, e não fixos.", "III – Segundo Kummer, em um hospital, o critério de importância pode deixar de ser o valor financeiro e passar a ser o impacto do medicamento para a saúde humana."], "alternativas": ["Apenas I.", "Apenas II.", "Apenas I e II.", "Apenas II e III.", "I, II e III."], "correta": 4, "explicacao": "Fenili apresenta a proporção aproximada de 80% do valor para 20% dos itens na classe A e ressalva que os percentuais não são fixos; Kummer afirma não haver regras fixas e cita o hospital como caso em que o valor pode ser substituído pelo impacto do remédio na saúde. Todas as afirmações estão corretas.", "fundamento": "Paráfrase: Fenili (Tabela 1) dá percentuais “aproximados (e não fixos)”: A ≈ 80% do valor e 20% dos itens; B ≈ 15% e 30%; C ≈ 5% e 50%. Kummer diz que, num hospital, o valor pode ser trocado pelo impacto do medicamento na saúde humana.", "fonte": "FENILI, Gestão de materiais (ENAP, 2015), p. 32, Tabela 1; KUMMER, Gestão de estoques (IFPR, 2012), p. 80-81", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content", "regra": "Quando a questão falar em curva ABC, lembre: classe A é pouco item com muito valor (cerca de 80% do valor e 20% dos itens), e esses percentuais são aproximados, não fixos.", "passos": [{"t": "I: segundo Fenili, a classe A tem cerca de 80% do valor e 20% dos itens. Correta."}, {"t": "II: o próprio Fenili diz que os percentuais são “aproximados (e não fixos)”. Correta."}, {"t": "III: Kummer diz que não há regras fixas e que, num hospital, o valor pode ser trocado pelo impacto do medicamento na saúde. Correta."}], "resp": "Alternativa E", "pegadinha": "Não trate o 80/20 como regra fixa: Fenili e Kummer dizem que os percentuais são aproximados. Por isso a II e a III também estão certas.", "porque": {"A": "Essa deixa de fora a II e a III, que também estão certas. Os percentuais são aproximados, e no hospital o critério pode ser a saúde.", "B": "Essa deixa de fora a I e a III. A classe A tem cerca de 80% do valor, e Kummer aceita o impacto na saúde como critério.", "C": "Essa deixa de fora a III, que está certa: segundo Kummer, no hospital o valor pode ser trocado pelo impacto do medicamento na saúde.", "D": "Essa deixa de fora a I, que está certa: segundo Fenili, a classe A tem cerca de 80% do valor e 20% dos itens."}}, {"id": "mat-03", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Sobre recebimento de materiais e inventário físico, conforme Fenili (2015), indique se as afirmações abaixo são verdadeiras (V) ou falsas (F).\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "itens": ["( ) No recebimento provisório, o recebedor assina o documento fiscal que acompanha o material apenas para fins de comprovação da data de entrega.", "( ) A conferência qualitativa verifica se a quantidade declarada pelo fornecedor na nota fiscal corresponde àquela efetivamente entregue.", "( ) O recebimento definitivo corresponde à aceitação do material, com sua entrada no estoque e a liberação do pagamento ao fornecedor.", "( ) No inventário rotativo, todos os itens são contados de uma só vez, o que exige a paralisação das atividades da organização."], "alternativas": ["V – V – V – F", "F – F – V – V", "V – F – V – F", "V – F – F – V", "F – V – V – F"], "correta": 2, "explicacao": "O segundo item descreve a conferência quantitativa; a qualitativa verifica as especificações técnicas. O quarto descreve o inventário periódico: o rotativo é contínuo e seletivo e tem a vantagem de não paralisar as atividades.", "fundamento": "Paráfrase de Fenili: no recebimento provisório o recebedor assina a nota só para comprovar a data de entrega; a conferência quantitativa compara quantidades e a qualitativa, especificações; a aceitação (entrada no estoque e liberação do pagamento) é o recebimento definitivo. O inventário rotativo é contínuo e não paralisa a organização.", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 129 (Quadro 23) e p. 148", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content", "regra": "Quando aparecer conferência de material, lembre: quantitativa confere a quantidade, qualitativa confere as especificações técnicas. E inventário rotativo é contínuo e não para a organização.", "passos": [{"t": "1º: no recebimento provisório, quem recebe assina a nota só para comprovar a data de entrega. Verdadeiro."}, {"t": "2º: comparar a quantidade da nota com a entregue é a conferência quantitativa. A qualitativa olha as especificações técnicas. Falso."}, {"t": "3º: aceitar o material, dar entrada no estoque e liberar o pagamento é o recebimento definitivo. Verdadeiro."}, {"t": "4º: contar tudo de uma vez e parar as atividades é o inventário periódico. O rotativo é contínuo e não paralisa. Falso."}], "resp": "Alternativa C (V, F, V, F)", "pegadinha": "O 4º item descreve certinho um inventário, só que o periódico. Se você não reparar na palavra “rotativo”, marca V.", "porque": {"A": "Essa marca a 2ª como verdadeira, mas conferir a quantidade é a conferência quantitativa. A qualitativa olha as especificações técnicas.", "B": "Essa marca a 4ª como verdadeira, mas contar tudo de uma vez e parar é o inventário periódico. E a 1ª é verdadeira.", "D": "Essa marca a 3ª como falsa, mas aceitar o material e liberar o pagamento é o recebimento definitivo. E a 4ª descreve o inventário periódico.", "E": "Essa marca a 1ª como falsa, mas no recebimento provisório se assina só para comprovar a data. E a 2ª descreve a conferência quantitativa."}}, {"id": "mat-04", "materia": "Conhecimentos Específicos", "tema": "Gestão de materiais e almoxarifado", "enunciado": "Um almoxarifado registrou as seguintes movimentações de um item, partindo de saldo zero: no dia 3, entrada de 400 unidades a R$ 5,00 cada; no dia 10, entrada de 200 unidades a R$ 8,00 cada; no dia 20, saída de 500 unidades. Avaliando o estoque pelo método PEPS (primeiro a entrar, primeiro a sair), o valor total da saída do dia 20 e o valor do saldo remanescente são, respectivamente,", "alternativas": ["R$ 2.800,00 e R$ 800,00.", "R$ 3.000,00 e R$ 600,00.", "R$ 3.100,00 e R$ 500,00.", "R$ 2.500,00 e R$ 1.100,00.", "R$ 2.800,00 e R$ 1.600,00."], "correta": 0, "explicacao": "No PEPS, a saída usa primeiro o preço das entradas mais antigas: 400 × R$ 5,00 + 100 × R$ 8,00 = R$ 2.800,00, e sobram 100 unidades a R$ 8,00 = R$ 800,00 (o estoque total valia R$ 3.600,00). B corresponde ao custo médio (R$ 6,00) e C ao UEPS.", "fundamento": "Paráfrase de Fenili: no PEPS/FIFO a saída é valorada pelo preço das entradas mais remotas; se a saída superar a quantidade do lote mais antigo, o excedente recebe o preço da entrada seguinte (exemplo das 700 unidades, p. 73).", "fonte": "FENILI, R. R. Gestão de materiais. Brasília: ENAP, 2015, p. 72-73 (item 7.2, Tabela 16); KUMMER, Gestão de estoques (IFPR, 2012), p. 59", "url": "https://repositorio.enap.gov.br/server/api/core/bitstreams/57bce870-20c5-42a6-b40e-91fc5dec0b9d/content", "regra": "Quando for PEPS, a saída sai primeiro do lote mais antigo, com o preço dele. Se o lote antigo acabar, o resto da saída usa o preço do lote seguinte.", "passos": [{"t": "Saíram 500 unidades. O lote mais antigo (dia 3) tem 400. Use todas as 400 e complete com 100 do lote do dia 10:", "conta": ["400 × R$ 5,00 = R$ 2.000,00", "100 × R$ 8,00 = R$ 800,00", "Saída = R$ 2.800,00"]}, {"t": "Sobraram 100 unidades do lote do dia 10:", "conta": ["100 × R$ 8,00 = R$ 800,00"]}, {"t": "Confira: o estoque todo valia R$ 3.600,00, e R$ 2.800,00 + R$ 800,00 dá exatamente isso."}], "resp": "Alternativa A", "pegadinha": "B é o resultado pelo custo médio (R$ 6,00 por unidade) e C é o resultado pelo UEPS. Ambas usam outro método, não o PEPS.", "porque": {"B": "Esses valores são do custo médio, R$ 6,00 por unidade. No PEPS, a saída usa primeiro o preço do lote mais antigo.", "C": "Esses valores são do UEPS, que tira primeiro do lote mais novo. No PEPS, a saída começa pelo lote do dia 3.", "D": "Aqui você cobrou as 500 unidades a R$ 5,00. Mas o lote do dia 3 só tem 400, e as outras 100 custam R$ 8,00.", "E": "A saída está certa, mas o saldo de R$ 1.600,00 conta as 200 unidades do dia 10. Só sobraram 100, que valem R$ 800,00."}}, {"id": "p2015-q01", "banca": "p2015", "num": 1, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que preenche corretamente as lacunas das linhas 06, 19, 29 e 34 do texto, respectivamente.", "alternativas": ["tem – mantêm – inclui – tem", "têm – mantêm – incluem – têm", "têm – mantém – inclui – têm", "têm – mantém – incluem – têm", "tem – mantem – incluem – tem"], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 1", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=3", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q02", "banca": "p2015", "num": 2, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta uma afirmação que NÃO pode ser depreendida a partir da leitura do texto.", "alternativas": ["Há interesse acadêmico internacional pela língua portuguesa.", "Apesar de muitos países ensinarem a variedade europeia da língua portuguesa, há também procura e interesse no ensino e no aprendizado da variedade brasileira do português.", "O Instituto Camões é um centro de ensino de língua portuguesa em sua variedade europeia.", "Brasil e Portugal deveriam pensar juntos o ensino de português para aprendizes estrangeiros em universidades internacionais.", "Há disparidade entre Brasil e Portugal no que toca à importância geopolítica e econômica."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 2", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=3", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q03", "banca": "p2015", "num": 3, "materia": "Português", "tema": "Português", "enunciado": "Considere as seguintes afirmações sobre algumas das ideias que podem ser depreendidas a partir da leitura do texto.\n\nQuais das afirmações acima estão corretas?", "alternativas": ["Apenas I.", "Apenas II.", "Apenas III.", "Apenas I e II.", "Apenas II e III."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 3", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=3", "itens": ["I - Apesar do interesse dos mexicanos em aprender português (exemplificado pelo caso da Universidade Nacional Autônoma), eles ainda não contam com um centro de língua portuguesa adequado para a aprendizagem da língua.", "II - Via de regra, a política do governo brasileiro, no que tange ao ensino de língua, tem sido uma política de não estar presente em lugares onde o português europeu já está sendo ensinado.", "III - Hoje, o Brasil parece exercer mais influência política e econômica no cenário mundial do que Portugal, e essa influência se reflete nos centros de ensino de língua portuguesa como língua estrangeira ao redor do mundo."], "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q04", "banca": "p2015", "num": 4, "materia": "Português", "tema": "Português", "enunciado": "Assinale a única alternativa que traz uma afirmação que pode ser depreendida a partir da leitura do texto.", "alternativas": ["O autor do texto viajou por muitos países e viu a dificuldade encontrada por professores de língua portuguesa que desejam continuar ensinando o português para falantes estrangeiros.", "O Brasil, assim como os outros países do grupo BRICS (Rússia, Índia, China e África do Sul), mantém poucos centros de ensino de língua em universidades estrangeiras.", "Portugal, Irlanda, Itália, Grécia e Espanha são exemplos de países que investem no ensino de seus idiomas pátrios em centros de ensino de língua estrangeiros.", "Nos últimos anos, países da América Latina, como Argentina, Uruguai, México e Colômbia estão demonstrando cada vez mais interesse em ensinar o espanhol como língua estrangeira.", "Professores de diversos países estão encontrando dificuldade em tornar o português brasileiro uma língua valorizada e digna de ensino como língua estrangeira."], "correta": 4, "fonte": "Prova de 2015 (FAURGS), questão 4", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q05", "banca": "p2015", "num": 5, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta uma substituição possível para a expressão Só que (l. 13), sem que o sentido do enunciado seja significativamente alterado.", "alternativas": ["Porque.", "Contudo.", "Portanto.", "Já que.", "Ainda que."], "correta": 1, "fonte": "Prova de 2015 (FAURGS), questão 5", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q06", "banca": "p2015", "num": 6, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta uma versão modificada da frase A postura do Itamaraty parece ser a seguinte: se já estão lá os portugueses, nós não precisamos estar também (l. 23-26) com sentido literal equivalente.", "alternativas": ["A postura do Itamaraty parece ser a seguinte: se os portugueses já estão lá, nós também não precisamos estar.", "A postura do Itamaraty parece ser a seguinte: se lá os portugueses já estão, nós precisamos também estar.", "A postura do Itamaraty parece ser a seguinte: se nós também não estamos lá, os portugueses já estão.", "A postura do Itamaraty parece ser a seguinte: uma vez que os portugueses já estão lá, nós não precisamos estar também.", "A postura do Itamaraty parece ser a seguinte: uma vez que os portugueses não estão lá, nós também não precisamos estar."], "correta": 3, "fonte": "Prova de 2015 (FAURGS), questão 6", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q07", "banca": "p2015", "num": 7, "materia": "Português", "tema": "Português", "enunciado": "Assinale a alternativa que apresenta apenas exemplos de dígrafos consonantais de palavras retiradas do texto.", "alternativas": ["português (l. 06) – interesse (l. 11) – seguinte (l. 24).", "México (l. 03) – esses (l. 04) – pejorativamente (l. 32).", "eloquentes (l. 18) – nosso (l. 21) – China (l. 31).", "professores (l. 06) – oferecer (l. 16) – chamadas (l. 30).", "estrangeiras (l. 15) – universidades (l. 21) – surpreendente (l. 27)."], "correta": 0, "fonte": "Prova de 2015 (FAURGS), questão 7", "url": "provas/2015-ps34-assistente-administrativo-ii.pdf#page=4", "instrucao": "As questões 01 a 10 referem-se ao texto abaixo.", "textoRef": "p2015:t1"}, {"id": "p2015-q08", "banca": "p2015", "num": 8, "materia": "Português", "tema": "Português", "enunciado": "Assinale V (verdadeiro) ou F (falso) nas afirmações a seguir.\n\nA sequência correta de preenchimento dos parênteses, de cima para baixo, é", "alternativas": ["F – F – V.", "V – F – V.", "F – V – V.", "V – V – F.", "V – F – F."], "correta": 2, "fonte": "Prova de 2015 (FAURGS), questão 8", "url": "provas/2015-ps34-assistente-
